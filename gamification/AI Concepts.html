ented Generation","Fine-Tuning","Longer System Prompt"],"answer":"Retrieval-Augmented Generation","why":"RAG retrieves current private evidence at request time and supports citations. Trade-off: Fine-tuning can adapt behavior, but it is a poor mechanism for frequently changing facts."},{"id":"model-decisions-02","label":"Thousands of examples demonstrate a stable report style that the base model fails to reproduce consistently.","sub":"Stable Specialist Format","options":["Fine-Tuning","RAG","Increase Temperature"],"answer":"Fine-Tuning","why":"Fine-tuning is appropriate for recurring behavior demonstrated by a curated example set. Trade-off: Few-shot prompting should still be tried first when it meets quality requirements at lower complexity."},{"id":"model-decisions-03","label":"A capable model must extract five fields into a validated JSON object; no new knowledge is required.","sub":"Strict JSON Extraction","options":["Prompt with Structured Output","Continued Pretraining","Vector Search"],"answer":"Prompt with Structured Output","why":"Clear instructions, examples, a schema, and validation address formatting without changing model weights. Trade-off: Fine-tuning becomes reasonable only if prompt-based extraction repeatedly fails at the required scale and quality."},{"id":"model-decisions-04","label":"A model must internalize specialized terminology from a very large unlabeled scientific corpus.","sub":"Domain Language at Scale","options":["Continued Pretraining","RAG Only","Higher Top-p"],"answer":"Continued Pretraining","why":"Continued pretraining adapts the model's language representations using large quantities of domain text. Trade-off: RAG remains preferable when the need is access to changing facts rather than deeper domain-language adaptation."},{"id":"model-decisions-05","label":"The system must inspect an order, request approval, call a refund API, and report the result.","sub":"Action-Taking Assistant","options":["Agent with Constrained Tools","Text Generation Only","Embedding Model"],"answer":"Agent with Constrained Tools","why":"A tool-using agent can orchestrate steps, but each tool needs narrow permissions, validation, and approval gates. Trade-off: A deterministic workflow is safer when the sequence is fixed and does not require model-directed planning."},{"id":"model-decisions-06","label":"A claims system must reason over a damage photograph together with the written incident description.","sub":"Image and Text Inspection","options":["Multimodal Foundation Model","Text Embedding Model","Keyword Search"],"answer":"Multimodal Foundation Model","why":"A multimodal model can jointly interpret visual and textual inputs. Trade-off: Separate specialist vision and text models may win when independent outputs, control, or lower cost matter more."},{"id":"model-decisions-07","label":"Ten million short records must be classified nightly under a tight budget after labels are available.","sub":"High-Volume Simple Classification","options":["Small Task-Specific Model","Largest Available Foundation Model","Real-Time Agent"],"answer":"Small Task-Specific Model","why":"A smaller evaluated classifier can deliver adequate quality with much lower batch-inference cost. Trade-off: A foundation model may accelerate prototyping or create labels, but should earn its production cost through measured quality."},{"id":"model-decisions-08","label":"Published rules completely determine eligibility and every decision must be reproducible and auditable.","sub":"Exact Eligibility Policy","options":["Deterministic Rules","Fine-Tuned LLM","Autonomous Agent"],"answer":"Deterministic Rules","why":"Exact, complete rules should be implemented directly rather than approximated by a probabilistic model. Trade-off: AI can assist document intake or explanation without owning the authoritative decision."}]},"decks/shared/genai-ops.json":{"id":"genai-ops","runner":"board","title":"GenAI Evaluation & Ops","blurb":"Diagnose the failure, then pick the intervention that fits it.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 3","asOf":"2026-07","area":"ops","zoneMode":"options","hint":"Drag each situation onto the response it calls for. Some responses on the board are there to tempt you.","items":[{"id":"genai-ops-01","label":"Answers read well but include claims absent from the retrieved policy passages.","sub":"Unsupported Claims","options":["Measure Groundedness and Require Citations","Increase Temperature","Add More Agent Tools"],"answer":"Measure Groundedness and Require Citations","why":"First determine whether claims are supported, then tighten evidence use, refusal behavior, and citation validation. Trade-off: A larger model may improve fluency without solving missing or ignored evidence."},{"id":"genai-ops-02","label":"The answer generator cannot use the right fact because the relevant passage is absent from the retrieved set.","sub":"Correct Evidence Never Appears","options":["Measure Retrieval Recall","Fine-Tune Response Style","Lower Maximum Tokens"],"answer":"Measure Retrieval Recall","why":"Retrieval recall isolates whether chunking, embeddings, filters, query rewriting, or candidate count misses needed evidence. Trade-off: Generation changes cannot recover evidence that never enters the context."},{"id":"genai-ops-03","label":"The relevant passage is present, but it is buried among many distracting chunks.","sub":"Too Much Irrelevant Context","options":["Improve Retrieval Precision and Reranking","Add More Chunks","Raise Temperature"],"answer":"Improve Retrieval Precision and Reranking","why":"Better filters, hybrid retrieval, and reranking reduce noise while preserving the best evidence. Trade-off: Increasing candidate count can improve recall but may worsen precision, latency, and token cost."},{"id":"genai-ops-04","label":"A prompt change improved test examples but degraded several important customer workflows.","sub":"Quality Varies After Release","options":["Run a Golden-Set Regression Evaluation","Judge Five Handpicked Outputs","Deploy and Watch Complaints"],"answer":"Run a Golden-Set Regression Evaluation","why":"A versioned representative evaluation set detects regressions across use cases before release. Trade-off: Human review remains valuable when guided by a rubric and sampled across the real distribution."},{"id":"genai-ops-05","label":"An LLM judge consistently scores longer answers higher even when concise answers are correct.","sub":"Evaluator Prefers Verbose Answers","options":["Calibrate Against Human Ratings","Trust the Automated Score","Increase Every Output Length"],"answer":"Calibrate Against Human Ratings","why":"LLM judges can have position, verbosity, and self-preference biases and must be calibrated with human judgments. Trade-off: Automated judging remains useful for scale after its rubric and bias are validated."},{"id":"genai-ops-06","label":"Usage is steady, but average input context and output length have tripled.","sub":"Interactive Cost Spike","options":["Track Tokens, Trim Context, and Cap Output","Provision More GPUs Immediately","Increase Top-p"],"answer":"Track Tokens, Trim Context, and Cap Output","why":"Token telemetry exposes the direct cost driver; retrieve less noise, summarize history, cache stable context, and cap output. Trade-off: Provisioned throughput helps predictable high utilization, not wasteful prompt growth by itself."},{"id":"genai-ops-07","label":"Many users ask semantically equivalent questions about unchanged public information.","sub":"Slow but Repeated Answers","options":["Use Evaluated Semantic Caching","Fine-Tune Every Week","Disable Monitoring"],"answer":"Use Evaluated Semantic Caching","why":"A carefully keyed cache can reduce latency and token spend for equivalent requests when freshness and access boundaries are respected. Trade-off: Do not cache sensitive, personalized, rapidly changing, or insufficiently isolated responses."},{"id":"genai-ops-08","label":"A support agent calls the same failing API until its execution budget is exhausted.","sub":"Agent Repeats a Tool Call","options":["Add Call Limits, Error State, and Fallback","Give the Agent More Permissions","Hide Tool Errors"],"answer":"Add Call Limits, Error State, and Fallback","why":"Bounded retries, explicit error handling, idempotency, observability, and human escalation prevent runaway loops. Trade-off: Improving tool descriptions helps selection but does not replace runtime limits and failure controls."},{"id":"genai-ops-10","label":"A medical support model is uncertain and the cost of a wrong recommendation is severe.","sub":"High-Stakes Low Confidence","options":["Abstain and Route to Human Review","Force the Most Likely Answer","Raise Temperature"],"answer":"Abstain and Route to Human Review","why":"Confidence thresholds, abstention, evidence display, and qualified human review are appropriate for consequential uncertainty. Trade-off: Human oversight needs clear responsibility, useful context, and measured review quality rather than ceremonial approval."}]},"decks/shared/ml-lifecycle.json":{"id":"ml-lifecycle","runner":"ladders","title":"ML Lifecycle","blurb":"Put the machine-learning lifecycle in order.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 1","asOf":"2026-07","area":"foundations","ladders":[{"id":"ml-lifecycle","title":"ML Lifecycle","prompt":"Order the lifecycle from business goal to production monitoring.","steps":[{"label":"Business Goal Identification","detail":"Everything downstream inherits this. Without a business goal there is no way to say whether the model is any good."},{"label":"ML Problem Framing","detail":"Translate the goal into a learnable task: what is predicted, from what, and what counts as success."},{"label":"Data Collection","detail":"Assemble the raw material, and establish its provenance and permitted use before it is relied on."},{"label":"Data Preprocessing","detail":"Clean, join, de-duplicate and handle missing values, so the model learns signal rather than artefacts."},{"label":"Feature Engineering","detail":"Shape inputs into representations the algorithm can use. Often the largest single lever on accuracy."},{"label":"Model Training","detail":"Fit parameters on the training split. Cheap to repeat, so it comes after the expensive data work, not before."},{"label":"Hyperparameter Tuning","detail":"Search the settings the model cannot learn for itself, evaluated on validation data rather than test."},{"label":"Model Evaluation","detail":"Measure against held-out data and the business metric. This is the gate, not a formality."},{"label":"Model Deployment (Inference and Prediction)","detail":"Serve predictions for real requests, with the same preprocessing as training or the results will not match."},{"label":"Model Monitoring","detail":"Watch inputs, outputs and quality in production. This is where drift surfaces, and it never ends."}]}]},"decks/shared/industry-lifecycle.json":{"id":"industry-lifecycle","runner":"ladders","title":"Industry ML Pipeline","blurb":"The fuller lifecycle as it runs in practice.","source":"Industry ML delivery practice","asOf":"2026-07","area":"ops","ladders":[{"id":"industry-lifecycle","title":"Industry ML Pipeline","prompt":"Order the pipeline as it actually runs in an organisation.","steps":[{"label":"Understand the Business Problem and Stakeholders","detail":"Who is affected, who decides, and what a good outcome is for them. Skipping this is how technically sound models get built for the wrong problem."},{"label":"Define the ML Task, Constraints, and Success Metrics","detail":"Fix the target, the latency and cost budget, and the metric before any data is touched, so success cannot be redefined after the fact."},{"label":"Source Data and Establish Governance","detail":"Establish lawful basis, licence, consent and retention up front. Data acquired without them is a liability that no later step removes."},{"label":"Ingest, Catalogue, and Version Data","detail":"Land the data with a catalogue entry and a version. Without versioning no result is reproducible and no regression is explainable."},{"label":"Explore Data and Validate Quality","detail":"Profile distributions, nulls, duplicates and outliers before modelling, because every one of them shows up later as unexplained error."},{"label":"Clean, Transform, and Label Data","detail":"Repair what can be repaired and label what needs labels, with the labelling guidance itself treated as a versioned artefact."},{"label":"Engineer and Select Features","detail":"Build the representations the model will use, and drop the ones that leak the target or will not exist at inference time."},{"label":"Create Training, Validation, and Test Splits","detail":"Split before fitting anything, respecting time and group boundaries. A split made after preprocessing has already leaked."},{"label":"Build a Reproducible Baseline","detail":"A simple model that runs end to end. It sets the bar every later candidate must clear and proves the pipeline works."},{"label":"Train Candidate Models and Track Experiments","detail":"Fit alternatives with their configuration, data version and results recorded, so the winner can be rebuilt months later."},{"label":"Tune Hyperparameters with Validation Data","detail":"Search settings against validation data only. Tuning against test data turns the final number into self-assessment."},{"label":"Evaluate Quality, Robustness, Fairness, and Security","detail":"Test held-out quality, behaviour under perturbation, performance by subgroup, and adversarial exposure. One aggregate accuracy number hides all three of the others."},{"label":"Document, Approve, Package, and Register the Model","detail":"Record intended use, limits and evaluation results, get the accountable approval, and register the artefact. This is what makes deployment reviewable."},{"label":"Deploy Gradually with Automated Tests and Rollback","detail":"Shadow, canary or staged rollout with a tested path back. Gradual exposure is what makes a bad release survivable."},{"label":"Monitor Data, Model, System, and Business Performance","detail":"Watch all four layers. Inputs drift, quality decays, infrastructure fails and business value erodes — and they are not the same signal."},{"label":"Collect Feedback, Retrain, Revalidate, or Retire","detail":"Feed production reality back in, and decide deliberately between retraining, revalidating and retirement. A model with no retirement criterion never gets retired."}]}]},"decks/shared/rag-pipeline.json":{"id":"rag-pipeline","runner":"ladders","title":"RAG Builder","blurb":"Assemble a retrieval-augmented generation pipeline.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 3","asOf":"2026-07","area":"genai","ladders":[{"id":"rag-pipeline","title":"RAG Builder","prompt":"Order the stages from ingestion to a grounded, cited answer.","steps":[{"label":"Ingest Trusted Source Documents","detail":"Retrieval can only ever surface what was ingested. Source selection is a governance decision, not a plumbing one."},{"label":"Clean, Split, and Attach Metadata","detail":"Chunking decides what a retrievable unit is; metadata is what later makes filtering and attribution possible."},{"label":"Create Embeddings for Each Chunk","detail":"Text becomes vectors. The embedding model chosen here constrains everything the retriever can distinguish."},{"label":"Store Chunks and Vectors in an Index","detail":"The index makes similarity search tractable. Access controls belong here, not only at the answer."},{"label":"Embed and Interpret the User Query","detail":"The query is embedded by the same model as the chunks, or the two live in incomparable spaces."},{"label":"Retrieve, Filter, and Rerank Evidence","detail":"Recall decides whether the right passage is available at all; ranking decides whether it survives the context budget."},{"label":"Build a Prompt with Evidence and Instructions","detail":"The retrieved evidence is placed in the prompt with instructions on how to use it and when to refuse."},{"label":"Generate, Validate, and Cite the Grounded Answer","detail":"The model answers from the supplied evidence and cites it, so a reader can check rather than trust."}]}]}}</script>

// data file those games reference, keyed by the path the manifest used. A deck
// referenced by two labs is authored once and inlined into both.

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

/* ---------------------------------------------------------------- storage */
const KEY = LAB.storageKey;
let memoryOnly = false;
function loadProgress(){
  try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : {items:{},briefs:{}}; }
  catch(e){ memoryOnly = true; return {items:{},briefs:{}}; }
}
let progress = loadProgress();
function save(){
  if(memoryOnly) return;
  try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){ memoryOnly = true; }
}

/* -------------------------------------------------------------- scheduler */
const INTERVALS = [0,1,3,7,21];
const today = () => new Date().toISOString().slice(0,10);
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function record(id, correct){
  const it = progress.items[id] || {seen:0,wrong:0,confidentWrong:0,interval:0,due:today()};
  it.seen++;
  if(correct){
    const i = INTERVALS.indexOf(it.interval);
    it.interval = INTERVALS[Math.min(INTERVALS.length-1, (i<0?0:i)+1)];
  }else{
    it.wrong++; it.interval = 0;
  }
  it.due = addDays(it.interval); it.lastSeen = today();
  progress.items[id] = it; save();
}
function markConfidentlyWrong(id){
  const it = progress.items[id]; if(!it) return;
  it.confidentWrong = (it.confidentWrong||0)+1;
  it.interval = 0; it.due = today(); save();
}
function priority(id){
  const it = progress.items[id];
  if(!it) return 0;
  if(it.confidentWrong>0) return -3;
  if(it.wrong>0) return -2;
  if(it.interval<7) return -1;
  return it.interval;
}
const dueNow = id => { const it=progress.items[id]; return !it || it.due <= today(); };
function masteryOf(ids){
  if(!ids.length) return 0;
  return ids.filter(id => (progress.items[id]||{}).interval >= 7).length / ids.length;
}

// (an existing typed knowledge file, reached by the functions that already drove it).
// An adapter returns whatever its runner expects; nothing else in the engine

function deckOf(g){
  const d = DECKS[g.deck || g.data];
  if(!d) throw new Error(`game ${g.id}: no deck loaded for "${g.deck || g.data}"`);
  return d;
}

}

function serviceIcon(serviceName, providerKey){
  const p = ICON_PROVIDERS[providerKey];
  if (!p) return undefined;
  const file = p.map[serviceName] || p.fallback;
  return `assets/${p.dir}/${file}`;

const MAX_ZONES = 8;
function zonesFromAnswers(use){
  return [...new Set(use.map(i => i.answer))].map(a => ({key:a, name:a}));
}
// Decision decks add distractors drawn from the cards' own options. An
// answers-only board of six distinct answers is solvable by one-to-one
// elimination without reading a single card, which teaches nothing.
function zonesFromOptions(use, all, seed){
  const answers = [...new Set(use.map(i => i.answer))];
  const pool = [...new Set(all.flatMap(i => i.options || []))].filter(o => !answers.includes(o));
  const extra = shuffle(pool, seed + 11).slice(0, Math.max(0, MAX_ZONES - answers.length));
  return shuffle(answers.concat(extra), seed + 3).map(a => ({key:a, name:a}));
}
function genericBoard(g){
  const d = deckOf(g);
  const items = withProvenance(d.items, d);
  const stamped = g.areaOverride ? items.map(it => ({...it, area: g.areaOverride})) : items;
  const spec = {items: stamped, hint:d.hint || "", note:d.note, traps:d.traps};
  spec.icons = d.icons;
  if(d.zones) spec.zones = d.zones;
  else if(d.zoneMode === "options") spec.zonesFrom = use => zonesFromOptions(use, stamped, state.round);
  else spec.zonesFrom = zonesFromAnswers;
  // A "pick a service, see just its cards" mode: the deck names the field each
  // item is grouped by, and every group's identity (icon + name) comes from
  // the same lookup the tokens themselves already use.
  if(d.groupByService){
    const names = [...new Set(stamped.map(i => i.service))].sort();
    spec.serviceGroups = names.map(name => ({name, icon: serviceIcon(name, d.icons)}));
  }
  return spec;
}
function genericPairs(g){
  const d = deckOf(g);
  return d.pairs.map(p => {
    const base = {area:d.area, ...p, citation:p.citation || d.source};
    return g.areaOverride ? {...base, area: g.areaOverride} : base;
  });
}
function genericLadders(g){
  const d = deckOf(g);
  return d.ladders.map(l => {

    return g.areaOverride ? {...base, area: g.areaOverride} : base;
  });
}

// {key, name, def?}. One board runner drives them all.
function tellsBoard(g){
  const DATA = deckOf(g);
  return {
    zonesFrom: items => {
      const s = new Set(); items.forEach(i => i.options.forEach(o => s.add(o)));
      return [...s].map(o => ({key:o, name:o}));
    },
    items: DATA.tells.map(t => ({
      id:t.id, area:t.area, status:t.status, label:`“${t.snippet}”`,
      answer:t.answer, options:t.options, why:t.tell, citation:t.citation
    })),
    hint:"Drag each snippet onto the instrument it came from. The reveal names the tell."
  };
}
function roleBoard(g){
  const DATA = deckOf(g);
  const set = DATA.roleMatrix.sets.find(s => s.id===g.setId);
  if(set.items){
    return {
      zones:set.buckets.map(b => ({key:b, name:b})),
      items:set.items.map((it,i) => ({
        id:`${set.id}-${i}`, area:set.area, status:"stable", label:it.text,
        answer:it.answer, why:it.why, citation:set.citation
      })),
      hint:set.prompt, traps:set.traps
    };
  }
  return {
    zones:set.roles.map(r => ({key:r.name, name:r.name, def:r.definition})),
    items:set.obligations.map((o,i) => {
      const role = set.roles.find(r => r.id===o.role);
      return {id:`${set.id}-${i}`, area:set.area, status:"stable", label:o.text,
              answer:role.name, why:role.definition, citation:set.citation};
    }),
    hint:DATA.roleMatrix.prompt, traps:set.traps
  };
}
function timelineBoard(g){
  const t = deckOf(g).timeline;

      id:m.id, area:"II.C", status:m.status, scope:m.scope,
      label:`${m.instrument} — ${m.milestone}`, sub:m.jurisdiction,
      answer:m.bucket, why:`${m.date}. ${m.note}`, citation:t.title
    })),
    hint:t.prompt, note:t.note
  };
}
function caseBoards(g){

// Deep links: the address bar mirrors the open game as #g/<id>, so any game
// can be linked to directly. The id is only ever *compared* against GAMES —
// never rendered — so a hostile hash is inert. replaceState rather than
// pushState: tab and back button behave as before, the hash is just a label.
function syncHash(){
  const want = state.game ? "#g/" + encodeURIComponent(state.game.id) : "";
  const have = location.hash.startsWith("#g/") ? location.hash : "";
  if(want === have) return;
  // try/catch: some browsers refuse replaceState on file:// — the label is
  // cosmetic, so losing it must never take the render down with it.

}
function gameFromHash(){
  const m = /^#g\/(.+)$/.exec(location.hash);

  return GAMES.find(g => g.id === id) || null;
}
function openFromHash(){
  const g = gameFromHash();

  state.domain = g.tab || TABS[0].id;

}

/* ------------------------------------------------------------ board runner */
function dealBoard(){
  const spec = state.game.board();
  // A "pick a service" board narrows the pool to one group before anything
  // else runs, so priority/due scheduling and the round-robin deal below only
  // ever see that one service's cards.
  if(spec.serviceGroups){
    if(!state.serviceFilter || !spec.serviceGroups.some(s => s.name===state.serviceFilter)){
      state.serviceFilter = spec.serviceGroups[0].name;
    }
  }
  const scoped = spec.serviceGroups ? spec.items.filter(i => i.service===state.serviceFilter) : spec.items;
  const pool = scoped.filter(areaOK).slice().sort((a,b)=>priority(a.id)-priority(b.id));
  const due = pool.filter(i=>dueNow(i.id));
  const source = due.length>=ROUND ? due : pool;

  // Stratify by answer. Dealt in priority order alone, a board fills with the
  // first zone's items and every card has the same answer — which is winnable
  // by pattern and teaches nothing. Round-robin across answer groups instead,
  // keeping priority order inside each group.
  const groups = new Map();
  source.forEach(i => {
    if(!groups.has(i.answer)) groups.set(i.answer, []);
    groups.get(i.answer).push(i);
  });
  const keys = shuffle([...groups.keys()], state.round + 7);
  const use = [];
  for(let guard=0; use.length<ROUND && guard<ROUND*keys.length+1; guard++){
    let took = false;
    for(const k of keys){
      const g = groups.get(k);
      if(g.length && use.length<ROUND){ use.push(g.shift()); took = true; }
    }
    if(!took) break;
  }
  state.board = {
    spec,
    zones: spec.zones || spec.zonesFrom(use),
    items: shuffle(use, state.round + use.length)
  };
  state.placed={}; state.sel=null; state.checked=false; state.scored=false;
}
function shuffle(arr, seed){
  let h = 2166136261 ^ seed;
  return arr.map((v,i)=>{ h = (h*16777619) ^ (i+1); return [v,(h>>>0)]; })
            .sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
}
