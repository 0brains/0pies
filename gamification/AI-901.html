it under text analysis, not generative AI.","Extracting fields from audio or video content against a fixed schema is information extraction, not speech — the deliverable is structured data, not a transcript."],"zones":[{"key":"Generative AI","name":"Generative AI","def":"Creating new content — text, images, code, or audio — from a prompt, rather than analyzing or acting on content that already exists."},{"key":"Agentic AI","name":"Agentic AI","def":"Autonomously planning, using tools, and taking multi-step action toward a goal, going beyond a single stateless response."},{"key":"Text analysis","name":"Text analysis","def":"Analyzing written text to surface meaning already present in it — sentiment, key phrases, entities, PII, or a grounded summary — without generating new content."},{"key":"Speech","name":"Speech","def":"Converting between spoken audio and text, or working directly with audio streams — recognition, synthesis, translation, and diarization."},{"key":"Computer vision","name":"Computer vision","def":"Analyzing the visual content of images and video frames — classifying, detecting objects, verifying faces, or reading a scene."},{"key":"Information extraction","name":"Information extraction","def":"Pulling a fixed set of structured fields, or a searchable index, out of documents, forms, or mixed-modality content."}],"items":[{"id":"wl-001","label":"Draft five candidate slogans for a new product from a two-line brief","answer":"Generative AI","why":"Creating new content from a prompt is generative AI — nothing is being analyzed, extracted or spoken.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — generative AI workloads"},{"id":"wl-007","label":"Create a photorealistic hero image for a product page from a two-sentence text description of the item and its setting","answer":"Generative AI","why":"Producing a brand-new image from a text prompt is generative AI's image side — there is no existing image being analyzed, which is what would make it computer vision.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — generative AI workloads"},{"id":"wl-008","label":"Produce a first draft of a product FAQ page from a bullet-point outline of talking points","answer":"Generative AI","why":"Turning a sparse outline into new prose is content creation from a prompt, the same capability as wl-001's slogans, just applied to a longer document.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — generative AI workloads"},{"id":"wl-009","label":"Answer a single one-off customer question in a chat window with one reply, with no follow-up steps or tools invoked","answer":"Generative AI","why":"One stateless response to one prompt is generative AI; the moment a system starts planning steps and calling tools on its own it crosses into agentic AI.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — generative AI workloads"},{"id":"wl-002","label":"An assistant that checks inventory, files the reorder, and emails the supplier without step-by-step prompts","answer":"Agentic AI","why":"Multi-step autonomous action with tool use is the agentic signature — histack's 'persistent assistant' vs 'one stateless response'.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — agentic AI workloads"},{"id":"wl-010","label":"A travel-booking assistant compares fares across three sites, holds a seat, and completes the purchase once the price target is hit, with no human confirming each step","answer":"Agentic AI","why":"Comparing, deciding, and executing a purchase end to end with no per-step prompting is the agentic pattern, distinct from a chatbot that only replies.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — agentic AI workloads"},{"id":"wl-011","label":"An IT-support assistant triages an incoming ticket, runs a diagnostic script against the affected server, and escalates to a human only if the automated fix fails","answer":"Agentic AI","why":"Tool use plus a conditional next action is the exam's 'tool use means the agent can call external capabilities' definition — distinct from a single generated response.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — agentic AI workloads"},{"id":"wl-012","label":"A research assistant breaks a broad question into sub-questions, searches multiple sources for each, and stitches the findings into one final report","answer":"Agentic AI","why":"Task planning that decomposes a goal into steps, executed end to end, is the exam's task-planning-plus-task-completion definition of agentic AI, not a single generated answer.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — agentic AI workloads"},{"id":"wl-013","label":"Scan free-text support tickets and flag any phone numbers or email addresses they contain before the tickets are stored","answer":"Text analysis","why":"PII detection flags sensitive spans inside unstructured text — a text-analysis feature, distinct from information extraction's fixed fields pulled from forms and documents.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — natural language processing workloads · Microsoft Learn: Azure AI Language"},{"id":"wl-014","label":"Return a short ranked list of the main topics mentioned across thousands of support tickets, without producing a rewritten paragraph","answer":"Text analysis","why":"Keyword extraction lists the salient terms; the exam's planted trap is offering summarization instead, which would produce prose rather than a topic list.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — natural language processing workloads · Microsoft Learn: Azure AI Language"},{"id":"wl-015","label":"Identify every person name, organization, and location mentioned across a batch of news articles","answer":"Text analysis","why":"Named entity recognition classifies mentions inside running text into people, places and organizations — a text-analysis capability, not extraction against a fixed document schema.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — natural language processing workloads · Microsoft Learn: Azure AI Language"},{"id":"wl-016","label":"Condense a 40-page policy document into a three-paragraph overview that captures its key points","answer":"Text analysis","why":"Summarization compresses existing text into new but faithful prose — text analysis, not generative AI, because the output is grounded in and constrained by the source document.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — natural language processing workloads · Microsoft Learn: Azure AI Language"},{"id":"wl-003","label":"Determine who spoke when in a recorded meeting (speaker diarisation)","answer":"Speech","why":"Diarisation separates speakers within audio — a speech capability. Trap: it generates nothing, so it is never synthesis.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — speech workloads · Microsoft Learn: Azure AI Speech"},{"id":"wl-004","label":"Low-latency, high-quality speech-to-speech interactions for a voice agent","answer":"Speech","why":"Verbatim Voice Live / gpt-realtime phrasing from the corpus — real-time audio in, audio out.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — speech workloads · Microsoft Learn: Azure AI Speech"},{"id":"wl-017","label":"Transcribe a batch of uploaded interview recordings once they have all finished uploading, rather than as they are spoken","answer":"Speech","why":"Batch transcription processes pre-recorded audio asynchronously — still a speech capability, just the offline sibling of real-time recognition, not a text or extraction task.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — speech workloads · Microsoft Learn: Azure AI Speech"},{"id":"wl-018","label":"Produce natural-sounding narrated audio for an e-learning module from a written script","answer":"Speech","why":"Converting written text into spoken audio is text-to-speech synthesis — the output side of the speech workload, mirroring wl-004's audio-in/audio-out case.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — speech workloads · Microsoft Learn: Azure AI Speech"},{"id":"wl-005","label":"Return bounding boxes around each vehicle in traffic-camera footage","answer":"Computer vision","why":"Object detection — bounding boxes per object — is computer vision, distinct from whole-image classification.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — computer vision workloads · Microsoft Learn: Azure AI Vision"},{"id":"wl-019","label":"Verify that the person in front of a login camera is a live human being, not a printed photo or a video replay","answer":"Computer vision","why":"Face liveness detection defends against presentation attacks by analyzing the live camera image — a computer-vision security capability, distinct from face verification's identity match.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — computer vision workloads · Microsoft Learn: Azure AI Vision"},{"id":"wl-020","label":"Detect scene changes and generate chapter markers by analyzing the visual frames of an uploaded training video","answer":"Computer vision","why":"Deriving chapter breaks from what the frames show is visual analysis of the video; the same footage shifts to speech only when the deliverable is the spoken transcript instead.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — computer vision workloads · Microsoft Learn: Azure AI Vision"},{"id":"wl-021","label":"Tag an uploaded photo with a single whole-image category such as 'beach' or 'city street', with no per-object locations needed","answer":"Computer vision","why":"Image classification assigns one label to the whole image, unlike wl-005's object detection, which returns per-object bounding boxes — both are computer vision, but distinct techniques.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — computer vision workloads · Microsoft Learn: Azure AI Vision"},{"id":"wl-006","label":"Pull the invoice number, total, and due date out of thousands of scanned PDFs","answer":"Information extraction","why":"Extracting structured fields from documents and forms is the information-extraction workload — Content Understanding territory in Domain 2.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — information extraction workloads · Microsoft Learn: Azure AI Document Intelligence and Content Understanding"},{"id":"wl-022","label":"Run AI enrichment skills over thousands of scanned reports and images during indexing so content that was previously unsearchable becomes searchable","answer":"Information extraction","why":"This is knowledge mining — the exam's Azure AI Search definition of using AI skills to surface information from unstructured content into a search index.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — information extraction workloads · Microsoft Learn: Azure AI Document Intelligence and Content Understanding"},{"id":"wl-023","label":"Return a schema-defined set of fields — call reason, resolution, and follow-up action — from a batch of recorded support calls","answer":"Information extraction","why":"Pulling a fixed business schema out of audio content is Content Understanding's structured extraction; the deliverable is defined fields, not a transcript, which is what would make it speech.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — information extraction workloads · Microsoft Learn: Azure AI Document Intelligence and Content Understanding"},{"id":"wl-024","label":"Pull key-value pairs and table structure from a mixed batch of contracts, intake forms, and handwritten receipts using one reusable schema","answer":"Information extraction","why":"Structured field and table extraction across varied document types is document intelligence's layout/custom-model territory — the same workload as wl-006's invoices, applied to a broader document mix.","citation":"AI-901 study guide Task 1.3 (common AI workloads) — information extraction workloads · Microsoft Learn: Azure AI Document Intelligence and Content Understanding"}]},"decks/microsoft/param-dials.json":{"id":"param-dials","runner":"board","title":"Turn the Right Dial","blurb":"Text dials, image dials, deployment dials — match each symptom to the parameter that fixes it, past the near-miss the exam planted.","source":"AI-901 study guide Task 1.2; histack.net","asOf":"2026-07","area":"microsoft-models","zoneMode":"options","traps":["Tune temperature OR top_p — not both","max_tokens caps length, never randomness"],"items":[{"id":"pd-001","label":"You need consistent, repeatable output from the same prompt every run","answer":"Temperature","options":["Temperature","top_p","max_tokens"],"why":"histack's exact exam cue: 'consistent, repeatable output' → low temperature. It rescales the whole probability distribution; tune it or top_p, not both.","citation":"Microsoft Learn · Azure OpenAI chat completions API reference (sampling and penalty parameters)"},{"id":"pd-002","label":"Restrict sampling to the smallest set of tokens whose cumulative probability reaches a set threshold","answer":"top_p","options":["top_p","Temperature","Presence penalty"],"why":"Nucleus sampling — top_p truncates the candidate set, while temperature reshapes the whole distribution (corpus confused-pair #5).","citation":"Microsoft Learn · Azure OpenAI chat completions API reference (sampling and penalty parameters)"},{"id":"pd-003","label":"Responses keep cutting off mid-sentence — you need complete answers","answer":"max_tokens","options":["max_tokens","Temperature","Stop sequence"],"why":"max_tokens caps output length only — the exam's most frequent parameter trap is offering it as a randomness control (pair #4).","citation":"Microsoft Learn · Azure OpenAI chat completions API reference (sampling and penalty parameters)"},{"id":"pd-004","label":"The model keeps repeating one phrase; penalize tokens in proportion to how often they've appeared","answer":"Frequency penalty","options":["Frequency penalty","Presence penalty","top_p"],"why":"Frequency penalty scales with repeat count (repetition); presence penalty fires once a token has appeared at all (topic novelty) — corpus pair #6.","citation":"Microsoft Learn · Azure OpenAI chat completions API reference (sampling and penalty parameters)"},{"id":"pd-005","label":"Generated marketing images look rough — request the higher render fidelity tier","answer":"quality","options":["quality","size","n"],"why":"gpt-image-1's payload takes prompt, size, quality (including the 'high' trap value) and n — quality controls fidelity, size controls dimensions.","citation":"Microsoft Learn · Azure OpenAI image generation API (gpt-image-1)"},{"id":"pd-006","label":"See image progress sooner while a large generation renders","answer":"partial_images","options":["partial_images","n","quality"],"why":"Streaming partial_images on the images/generations path returns progressive output — the exam's 'see image progress sooner' stem verbatim.","citation":"Microsoft Learn · Azure OpenAI image generation API (gpt-image-1)"},{"id":"pd-007","label":"The randomness knob that reshapes the entire token probability distribution before sampling, not just the top slice","answer":"Temperature","options":["Temperature","top_p","Frequency penalty"],"why":"Temperature scales logits across the whole distribution; top_p instead truncates by cumulative probability mass — same 'creativity' intuition, different mechanism.","citation":"Microsoft Learn · Azure OpenAI chat completions API reference (sampling and penalty parameters)"},{"id":"pd-008","label":"The team wants the model to only ever consider the most probable slice of next-token candidates, cutting off the long tail","answer":"top_p","options":["top_p","Temperature","Presence penalty"],"why":"Nucleus sampling (top_p) restricts candidates to a cumulative-probability slice; temperature reshapes probabilities but never removes candidates outright.","citation":"Microsoft Learn · Azure OpenAI chat completions API reference (sampling and penalty parameters)"},{"id":"pd-009","label":"A hard ceiling on how many tokens a single response can generate, regardless of what it says","answer":"max_tokens","options":["max_tokens","Stop sequence","Temperature"],"why":"max_tokens is a length ceiling enforced during generation; a stop sequence instead halts generation early only when a specific string appears — different trigger, same 'shorter output' goal.","citation":"Microsoft Learn · Azure OpenAI chat completions API reference (sampling and penalty parameters)"},{"id":"pd-010","label":"Discourage the model from reusing the same word or phrase many times over — the more it repeats, the harder the pushback","answer":"Frequency penalty","options":["Frequency penalty","Presence penalty","top_p"],"why":"Frequency penalty scales with how often a token has already appeared; presence penalty applies a flat penalty the moment a token appears even once — count-proportional vs binary.","citation":"Microsoft Learn · Azure OpenAI chat completions API reference (sampling and penalty parameters)"},{"id":"pd-011","label":"The chat transcript never revisits earlier topics — the model always drifts onto new subject matter instead of returning to what it already covered","answer":"Presence penalty","options":["Presence penalty","Frequency penalty","top_p"],"why":"A high presence penalty fires the instant a token has appeared once, pushing the model toward new topics; frequency penalty scales with repeat count and mainly curbs literal repetition, not topic drift.","citation":"Microsoft Learn · Azure OpenAI chat completions API reference (sampling and penalty parameters)"},{"id":"pd-012","label":"Applies the same fixed penalty to any token that has shown up at all in the response so far, no matter how many times","answer":"Presence penalty","options":["Presence penalty","Frequency penalty","max_tokens"],"why":"Presence penalty is binary per-token (appeared or not); frequency penalty instead grows with repeat count — the exam's confused-pair distinction between the two penalty parameters.","citation":"Microsoft Learn · Azure OpenAI chat completions API reference (sampling and penalty parameters)"},{"id":"pd-013","label":"Generation should end the instant the model writes a specific marker string, without waiting to hit the length ceiling","answer":"Stop sequence","options":["Stop sequence","max_tokens","Temperature"],"why":"A stop sequence is a literal string trigger that halts generation early; max_tokens only enforces a length ceiling and has no awareness of specific text.","citation":"Microsoft Learn · Azure OpenAI chat completions API reference (sampling and penalty parameters)"},{"id":"pd-014","label":"A specific piece of text the model is told to treat as an ending marker, so output stops the moment that text is produced","answer":"Stop sequence","options":["Stop sequence","Frequency penalty","max_tokens"],"why":"Stop sequences trigger on matching text content; neither max_tokens nor frequency penalty inspects the generated text itself — one counts tokens, the other counts repeats.","citation":"Microsoft Learn · Azure OpenAI chat completions API reference (sampling and penalty parameters)"},{"id":"pd-015","label":"Latency must stay predictable at high, sustained request volume, and the team is fine paying reserved hourly cost to guarantee it","answer":"PTU deployment","options":["PTU deployment","Standard deployment","Capacity (TPM)"],"why":"Provisioned throughput (PTU) reserves dedicated capacity for predictable latency at scale; Standard deployment is pay-per-token with variable throughput under load, and Capacity (TPM) is only the quota dial, not the deployment type itself.","citation":"Microsoft Learn · Azure OpenAI provisioned throughput (PTU) and standard deployment types"},{"id":"pd-016","label":"Reserved, dedicated model capacity purchased ahead of time so throughput does not fluctuate with shared-tenant traffic","answer":"PTU deployment","options":["PTU deployment","Standard deployment","Capacity (TPM)"],"why":"PTU is the reserved-capacity deployment model; Standard shares capacity and bills per token with variable throughput, while Capacity (TPM) merely sets the quota on whichever deployment type is chosen.","citation":"Microsoft Learn · Azure OpenAI provisioned throughput (PTU) and standard deployment types"},{"id":"pd-017","label":"Traffic to the customer-support app is unpredictable and bursty, and the team wants pay-per-token billing instead of hourly reserved capacity","answer":"Standard deployment","options":["Standard deployment","PTU deployment","Capacity (TPM)"],"why":"Pay-per-token pricing under variable load is Standard deployment (the exam's exact scenario); PTU instead bills hourly for reserved capacity regardless of actual usage.","citation":"Microsoft Learn · Azure OpenAI provisioned throughput (PTU) and standard deployment types"},{"id":"pd-018","label":"Bills per token consumed rather than per hour of reserved compute, with throughput that can vary under shared load","answer":"Standard deployment","options":["Standard deployment","PTU deployment","Capacity (TPM)"],"why":"Standard is consumption-based billing with variable throughput; PTU trades that variability for a fixed hourly reservation, and Capacity (TPM) is the quota setting layered on top of either model.","citation":"Microsoft Learn · Azure OpenAI provisioned throughput (PTU) and standard deployment types"},{"id":"pd-019","label":"A deployment keeps hitting throttling under peak load, so the team shifts spare throughput quota over from another underused deployment","answer":"Capacity (TPM)","options":["Capacity (TPM)","PTU deployment","Standard deployment"],"why":"The per-deployment throughput quota can be reallocated between deployments (the exam's documented scenario); PTU and Standard describe the deployment's billing/reservation model, not its quota dial.","citation":"Microsoft Learn · Azure OpenAI quotas and limits (tokens-per-minute capacity)"},{"id":"pd-020","label":"The dial that sets an upper bound on total throughput a deployment can process each minute, independent of any single response's length","answer":"Capacity (TPM)","options":["Capacity (TPM)","max_tokens","PTU deployment"],"why":"Capacity (TPM) throttles at the deployment level across all requests measured in tokens per minute; max_tokens instead caps the length of one response and has nothing to do with rate limiting.","citation":"Microsoft Learn · Azure OpenAI quotas and limits (tokens-per-minute capacity)"},{"id":"pd-021","label":"The banner image request keeps returning a small square when the layout needs a wide rectangular canvas","answer":"size","options":["size","quality","n"],"why":"size sets the pixel dimensions (e.g. a wide format instead of 1024x1024); quality controls rendering fidelity and n controls image count — neither changes the canvas shape.","citation":"Microsoft Learn · Azure OpenAI image generation API (gpt-image-1)"},{"id":"pd-022","label":"The request field that sets the pixel dimensions of the generated image, such as 1024×1024","answer":"size","options":["size","quality","partial_images"],"why":"size is the dimensions field in the images/generations payload; quality instead governs rendering fidelity, and partial_images controls progressive streaming, not the final canvas dimensions.","citation":"Microsoft Learn · Azure OpenAI image generation API (gpt-image-1)"},{"id":"pd-023","label":"The field that accepts the 'high' fidelity tier so fine detail renders more crisply, separate from how big the image is","answer":"quality","options":["quality","size","n"],"why":"quality (including the documented 'high' trap value) controls rendering fidelity; size controls dimensions and n controls how many images come back — three independent dials on the same request.","citation":"Microsoft Learn · Azure OpenAI image generation API (gpt-image-1)"},{"id":"pd-024","label":"One prompt should return four separate image variations to choose between, in a single request","answer":"n","options":["n","size","quality"],"why":"n sets how many images the request returns (e.g. n=4); size and quality shape each individual image but do not change how many come back.","citation":"Microsoft Learn · Azure OpenAI image generation API (gpt-image-1)"},{"id":"pd-025","label":"The parameter that sets how many image variations a single images/generations call returns","answer":"n","options":["n","partial_images","size"],"why":"n is the image-count field; partial_images instead streams progressive previews of a single image as it renders, and size only sets that image's dimensions.","citation":"Microsoft Learn · Azure OpenAI image generation API (gpt-image-1)"},{"id":"pd-026","label":"Combined with streaming, this field sets how many progressive preview frames are sent before the final image completes","answer":"partial_images","options":["partial_images","n","quality"],"why":"partial_images (used together with stream=True) sets the count of progressive preview frames during rendering; n instead sets how many separate final images are returned, and quality sets fidelity, not preview cadence.","citation":"Microsoft Learn · Azure OpenAI image generation API (gpt-image-1)"}]},"decks/microsoft/rai-pairs.json":{"id":"rai-pairs","runner":"pairs","title":"Principle Splitters","blurb":"Two near-identical situations, one flipped fact — name the principle each one illustrates.","source":"histack.net principle table","asOf":"2026-07","area":"microsoft-rai","pairs":[{"id":"rp-01","dimension":"whether the harm is biased outcomes or blocked access","buckets":["Fairness","Inclusiveness"],"a":{"text":"A hiring model shortlists far fewer candidates from one demographic group despite equal qualifications.","answer":"Fairness","why":"Unequal outcomes across groups is fairness — fixed with balanced training data and fairness assessments."},"b":{"text":"The same hiring portal's AI screening works only by voice, so deaf candidates cannot complete it at all.","answer":"Inclusiveness","why":"Nobody is scored unfairly — some users are locked out. Multiple interaction methods and accessibility are inclusiveness."},"citation":"AI-901 study guide Task 1.1 · Microsoft responsible AI principles (Microsoft Learn) — Fairness vs Inclusiveness"},{"id":"rp-02","dimension":"whether the gap traces to underrepresented training data or to a single required interaction method","buckets":["Fairness","Inclusiveness"],"a":{"text":"A retailer's shoplifting-detection camera system, trained mostly on images of one demographic group, flags people from other groups at a much higher rate.","answer":"Fairness","why":"An accuracy gap traceable to underrepresented training data across demographic groups is fairness — representative, balanced training data is the fix."},"b":{"text":"The same retailer's self-checkout assistant accepts only spoken commands, so customers who cannot speak or hear clearly cannot use it at all.","answer":"Inclusiveness","why":"No group is scored worse here — an entire set of users is shut out by relying on one interaction method. That access gap is inclusiveness, not a scoring problem."},"citation":"AI-901 study guide Task 1.1 · Microsoft responsible AI principles (Microsoft Learn) — Fairness vs Inclusiveness"},{"id":"rp-03","dimension":"disclosing how the system works vs owning its outcomes","buckets":["Transparency","Accountability"],"a":{"text":"The bank publishes a model card explaining the credit model's capabilities and known limitations.","answer":"Transparency","why":"Communicating capabilities AND limitations — model cards, transparency notes — is transparency."},"b":{"text":"The bank keeps audit logs of every AI credit decision and names the officer who signs off on overrides.","answer":"Accountability","why":"Human oversight, governance and a reviewable record of who is answerable is accountability."},"citation":"AI-901 study guide Task 1.1 · Microsoft responsible AI principles (Microsoft Learn) — Transparency vs Accountability"},{"id":"rp-04","dimension":"explaining one already-made decision vs assigning who owns it if it goes wrong","buckets":["Transparency","Accountability"],"a":{"text":"When a patient's insurance claim is denied by a triage model, the care team can point to the specific factors that drove that particular denial.","answer":"Transparency","why":"Explaining the specific reasons behind one already-made decision, to the person it affected, is transparency."},"b":{"text":"The hospital defines who is responsible for reviewing a denial and escalating it if the triage model's decision turns out to be wrong.","answer":"Accountability","why":"Assigning ownership and an escalation path for when things go wrong is accountability — who answers for the outcome, not what gets disclosed."},"citation":"AI-901 study guide Task 1.1 · Microsoft responsible AI principles (Microsoft Learn) — Transparency vs Accountability"},{"id":"rp-05","dimension":"protecting the data vs disclosing the behavior","buckets":["Privacy & security","Transparency"],"a":{"text":"The support bot is configured so customer PII never appears in responses or logs.","answer":"Privacy & security","why":"PII governance, data protection and access control map to privacy & security."},"b":{"text":"The support bot opens every session stating it is an AI and listing what it can and cannot help with.","answer":"Transparency","why":"Disclosing what the system is and its limits is transparency — a different obligation from protecting data."},"citation":"AI-901 study guide Task 1.1 · Microsoft responsible AI principles (Microsoft Learn) — Privacy & security vs Transparency"},{"id":"rp-06","dimension":"communicating limitations vs behaving safely under adverse input","buckets":["Transparency","Reliability & safety"],"a":{"text":"Release notes state the summarizer performs poorly on legal documents so users can judge when to trust it.","answer":"Transparency","why":"Stating limitations up front is transparency, even though it feels safety-adjacent."},"b":{"text":"The summarizer is stress-tested with adversarial prompts and refuses to produce harmful content under them.","answer":"Reliability & safety","why":"Consistent, tested, safe behavior under risky prompts — content filters and model evaluation — is reliability & safety."},"citation":"AI-901 study guide Task 1.1 · Microsoft responsible AI principles (Microsoft Learn) — Transparency vs Reliability & safety"},{"id":"rp-07","dimension":"whether the risk is harmful output behavior or exposure of personal data","buckets":["Reliability & safety","Privacy & security"],"a":{"text":"A content-moderation service must resist adversarial prompts that try to make it generate violent instructions.","answer":"Reliability & safety","why":"Resisting adversarial prompts to keep output from turning harmful is tested, consistent system behavior — reliability & safety."},"b":{"text":"The same service must keep customer phone numbers typed into chat messages from ever appearing in stored logs.","answer":"Privacy & security","why":"Keeping personal data out of storage and logs is data protection — a different concern from how the model behaves under attack."},"citation":"AI-901 study guide Task 1.1 · Microsoft responsible AI principles (Microsoft Learn) — Reliability & safety vs Privacy & security"},{"id":"rp-08","dimension":"whether the gap is about who can use the system or what users are told about it","buckets":["Inclusiveness","Transparency"],"a":{"text":"A financial-advice chatbot adds screen-reader-compatible output and keyboard-only navigation so people with visual or motor impairments can complete a session end to end.","answer":"Inclusiveness","why":"Removing barriers so people with different abilities can use the product at all is inclusiveness."},"b":{"text":"The same chatbot opens every session stating it is an automated assistant and listing the topics it is not qualified to advise on.","answer":"Transparency","why":"Disclosing that the system is AI and stating its limits is a different obligation from making the interface usable to everyone."},"citation":"AI-901 study guide Task 1.1 · Microsoft responsible AI principles (Microsoft Learn) — Inclusiveness vs Transparency"}]},"decks/microsoft/workload-pairs.json":{"id":"workload-pairs","runner":"pairs","title":"Separated at Birth","blurb":"Two capabilities that sound identical until one fact flips — learn to hear the difference the exam listens for.","source":"histack.net","asOf":"2026-07","area":"microsoft-workloads","pairs":[{"id":"wp-01","dimension":"identifying what is mentioned vs scoring the opinion about it","buckets":["Entity recognition","Sentiment analysis"],"a":{"text":"From support tickets, list every product name, person, and date mentioned.","answer":"Entity recognition","why":"Entities identify who/what is mentioned — people, dates, organizations (histack: 'categorizes specific things')."},"b":{"text":"From the same tickets, determine whether customers feel positive, negative, or neutral.","answer":"Sentiment analysis","why":"Opinion polarity is sentiment — the exam's #1 confused pair (17 co-occurrences)."},"citation":"AI-901 study guide Task 1.3 (common AI workloads) · Microsoft Learn: Azure AI Language (entity recognition vs sentiment analysis)"},{"id":"wp-02","dimension":"which direction the audio conversion runs","buckets":["Speech recognition","Speech synthesis"],"a":{"text":"Transcribe a call-center recording so agents can search the conversation.","answer":"Speech recognition","why":"Audio in, text out — recognition. 'Transcribe' is the giveaway verb."},"b":{"text":"A navigation app reads turn-by-turn directions aloud with the en-US-Ava neural voice.","answer":"Speech synthesis","why":"Text in, audio out — synthesis. SSML and voice names like en-US-Ava:DragonHDLatestNeural belong to synthesis only."},"citation":"AI-901 study guide Task 1.3 (common AI workloads) · Microsoft Learn: Azure AI Speech (speech to text vs text to speech)"},{"id":"wp-03","dimension":"crossing languages vs staying in the same language","buckets":["Speech translation","Speech recognition"],"a":{"text":"A conference app listens to a French speaker and produces live English captions for the audience.","answer":"Speech translation","why":"Recognizing speech in one language and rendering it in another is translation — the exam's tell for this pair (audio-in, different-language-out)."},"b":{"text":"The same app also produces same-language French captions for a hearing-impaired attendee in the front row.","answer":"Speech recognition","why":"Audio in, same-language text out is plain speech-to-text; no language crosses, so there is nothing to translate."},"citation":"AI-901 study guide Task 1.3 (common AI workloads) · Microsoft Learn: Azure AI Speech (speech translation vs speech recognition)"},{"id":"wp-04","dimension":"reading literal text vs describing the scene","buckets":["OCR","Image captioning"],"a":{"text":"Extract the serial number printed on a photographed equipment label.","answer":"OCR","why":"OCR/Read extracts the literal text present in the image — 'extract readable text from an image' is the exam stem."},"b":{"text":"Generate a one-sentence natural-language description of what the photo shows.","answer":"Image captioning","why":"Captioning (VisualFeatures.CAPTION) describes the scene — it does not read text within it."},"citation":"AI-901 study guide Task 1.3 (common AI workloads) · Microsoft Learn: Azure AI Vision (OCR vs image captioning)"},{"id":"wp-05","dimension":"reading pixels into text vs turning a text prompt into pixels","buckets":["OCR","Image generation"],"a":{"text":"A scanning app reads the printed address block off a photographed envelope into structured text fields.","answer":"OCR","why":"OCR converts existing pixels into text — the input is an image, the output is text."},"b":{"text":"A design tool takes the prompt 'a flat icon of a blue rocket' and produces a brand-new PNG that never existed before.","answer":"Image generation","why":"Image generation (client.images.generate with gpt-image-1 / DALL·E) runs the opposite direction — text prompt in, synthesized pixels out — the exam's direction-flip trap on this pair."},"citation":"AI-901 study guide Task 1.3 (common AI workloads) · Microsoft Learn: Azure AI Vision OCR and Azure OpenAI image generation"},{"id":"wp-06","dimension":"one label for the whole image vs a located box per object","buckets":["Image classification","Object detection"],"a":{"text":"Decide whether each uploaded photo is 'defective part' or 'good part'.","answer":"Image classification","why":"Classification assigns one label to the entire image."},"b":{"text":"Mark where every part sits on the conveyor image with bounding boxes.","answer":"Object detection","why":"Bounding boxes per object is the exam's tell for detection — the classic vision confusion."},"citation":"AI-901 study guide Task 1.3 (common AI workloads) · Microsoft Learn: Azure AI Vision (image classification vs object detection)"},{"id":"wp-07","dimension":"a list of terms vs new condensed sentences","buckets":["Key phrase extraction","Summarization"],"a":{"text":"Return ['pricing', 'battery life', 'customer support'] from a batch of reviews.","answer":"Key phrase extraction","why":"Key phrases return a list of important terms — no new prose is written."},"b":{"text":"Condense the same reviews into three fresh sentences capturing the overall feedback.","answer":"Summarization","why":"Summarization writes new condensed sentences — the output-shape contrast the corpus tests (pair #14)."},"citation":"AI-901 study guide Task 1.3 (common AI workloads) · Microsoft Learn: Azure AI Language (key phrase extraction vs summarization)"},{"id":"wp-08","dimension":"a dedicated privacy filter vs general-purpose entity extraction","buckets":["PII detection","Entity recognition"],"a":{"text":"A lightweight app must find and redact every email address and phone number in customer messages before storing them.","answer":"PII detection","why":"PII detection is the dedicated capability that identifies and can redact sensitive personal data such as phone numbers and email addresses (the exam calls it 'the most direct privacy-focused capability')."},"b":{"text":"The same app also tags every person, organization, and location mentioned in the messages for a searchable index.","answer":"Entity recognition","why":"Entity recognition is broader extraction across categories — people, places, organizations — not the dedicated redaction-focused feature PII detection is."},"citation":"AI-901 study guide Task 1.3 (common AI workloads) · Microsoft Learn: Azure AI Language (PII detection vs entity recognition)"},{"id":"wp-09","dimension":"labeling who spoke vs producing spoken audio","buckets":["Speaker diarization","Speech synthesis"],"a":{"text":"A meeting transcript must attribute each section of the recorded audio to the correct participant.","answer":"Speaker diarization","why":"Diarization identifies and separates speakers within incoming audio, labeling who spoke each portion of the transcript (the exam calls it 'audio speaker attribution')."},"b":{"text":"Once the transcript is finalized, a narrator voice reads the meeting summary aloud for a podcast feed.","answer":"Speech synthesis","why":"Synthesis converts text into human-like voice output — the opposite pipeline stage from diarizing existing audio."},"citation":"AI-901 study guide Task 1.3 (common AI workloads) · Microsoft Learn: Azure AI Speech (speaker diarization vs speech synthesis)"},{"id":"wp-10","dimension":"converting speech within/into audio vs converting written text between languages","buckets":["Azure AI Speech","Azure AI Translator"],"a":{"text":"A developer needs live audio captioning of a video conference in real time, same language, for hearing-impaired participants.","answer":"Azure AI Speech","why":"Azure AI Speech provides the real-time speech-to-text pipeline for live audio — the standard service for captioning, distinct from cross-language text conversion."},"b":{"text":"A retailer needs to convert written product descriptions from English into 20 other languages as text.","answer":"Azure AI Translator","why":"Azure AI Translator provides neural machine translation between languages for text — the exam's contrast is audio-pipeline service vs cross-language text service, not a workload overlap (pair #29)."},"citation":"AI-901 study guide Task 1.3 (common AI workloads) · Microsoft Learn: Azure AI Speech and Azure AI Translator documentation"}]},"decks/microsoft/foundry-traps.json":{"id":"foundry-traps","runner":"pairs","title":"The Planted Answer","blurb":"The wrong answers Microsoft planted for Domain 2 — twin scenarios that differ by the exact fact the exam flips.","source":"histack.net traps 1–7","asOf":"2026-07","area":"microsoft-foundry","pairs":[{"id":"ft-01","dimension":"governance container vs the workspace where you build","buckets":["Hub","Project"],"a":{"text":"The platform team needs one place to manage shared security, connections, compute and quota for all AI teams.","answer":"Hub","why":"The hub is the top-level collaboration and governance container with shared resources — histack trap #3."},"b":{"text":"A product team needs the place where their deployments, agents, data and evaluations actually live.","answer":"Project","why":"A project lives inside a hub and is where you actually build — deployments, agents, data, evaluations."},"citation":"Microsoft Learn · Azure AI Foundry hubs and projects documentation"},{"id":"ft-02","dimension":"the name your code calls vs the base model family","buckets":["Deployment name","Model name"],"a":{"text":"Your code passes 'chat-app-prod' — the custom name chosen at deploy time — as the model argument in chat.completions.create.","answer":"Deployment name","why":"The deployment name — not the base model name — is what your code calls (histack's exact trap; corpus pair #19)."},"b":{"text":"The Foundry catalog lists gpt-4o with its benchmark scores before anything is deployed.","answer":"Model name","why":"gpt-4o is the base model id in the catalog; it becomes callable only through a named deployment."},"citation":"Microsoft Learn · Azure AI Foundry model deployment documentation (deployment name vs model name)"},{"id":"ft-03","dimension":"the resource address you connect to vs the secret that authenticates the call","buckets":["Endpoint","API key"],"a":{"text":"A developer configures the client with the Foundry resource's HTTPS address, read from an environment variable, so every request knows which resource on Azure to reach.","answer":"Endpoint","why":"The endpoint (azure_endpoint) is the resource address the SDK targets — it identifies where the call is sent, not who is allowed to send it."},"b":{"text":"A developer moves a secret out of the source file into a separate environment variable, so the credential that proves the caller's identity is never hard-coded.","answer":"API key","why":"The credential is passed as api_key (os.getenv('AZURE_OPENAI_KEY')) and authenticates the caller — a privacy-and-security habit distinct from routing."},"citation":"Microsoft Learn · Azure AI services keys and endpoints documentation"},{"id":"ft-04","dimension":"a stateful, tool-using resource vs a single stateless completion request","buckets":["Agent","Chat call"],"a":{"text":"A Foundry resource is created once with a name, instructions and attached tools, then referenced across many later turns by follow-up requests using the same conversation.","answer":"Agent","why":"An agent is a persistent, named resource — created via PromptAgentDefinition with instructions and tools, then invoked repeatedly."},"b":{"text":"A script sends messages=[{'role': 'user', 'content': 'Summarize this case.'}] and gets one reply back from a plain completions request, with nothing saved on the server and no thread or tools involved.","answer":"Chat call","why":"A bare chat.completions.create is a single stateless request — no persisted instructions, tools or identity survive between calls."},"citation":"Microsoft Learn · Azure AI Foundry Agent Service documentation"},{"id":"ft-05","dimension":"where behavioral rules belong in the message stack","buckets":["System prompt","User prompt"],"a":{"text":"'Always return customer details in a fixed JSON shape and only answer HR-policy questions' — a persistent rule for every turn.","answer":"System prompt","why":"Persona, tone, rules and guardrails belong in the system prompt — histack's 'single most-tested distinction'; the planted wrong answer puts behavior in the user prompt or deployment settings."},"b":{"text":"'Summarize this quarter's absence report for me' — one request, this turn only.","answer":"User prompt","why":"The user prompt carries this turn's request; prior model replies replayed for memory are assistant messages."},"citation":"Microsoft Learn · Azure OpenAI prompt engineering documentation (system and user messages)"},{"id":"ft-06","dimension":"testing in the portal with no code vs the programmatic path your app ships with","buckets":["Playground","SDK code"],"a":{"text":"After deploying a model, a developer types a prompt directly into the Foundry portal and reads the reply on screen without writing a single line of Python.","answer":"Playground","why":"The playground is Foundry's on-demand, no-code environment for rapid prototyping and validation before any production code exists."},"b":{"text":"The same developer copies the Code tab's snippet, which constructs an AzureOpenAI client and calls chat.completions.create from a Python file the app will actually run.","answer":"SDK code","why":"The Code tab hands you the programmatic access pattern — the SDK call is what ships, not the portal session that validated it."},"citation":"Microsoft Learn · Azure AI Foundry playgrounds documentation"},{"id":"ft-07","dimension":"the behavioral rules an agent follows vs the capabilities it can invoke","buckets":["Agent instructions","Tools"],"a":{"text":"A prompt agent is configured so it always responds in a formal tone and refuses to discuss competitor pricing, no matter what the user asks.","answer":"Agent instructions","why":"Persona and behavioral rules supplied to PromptAgentDefinition are instructions — they shape how the agent responds, not what it can do."},"b":{"text":"The same agent is given web search and file search so it can look up live information instead of relying only on what it already knows.","answer":"Tools","why":"Web search and file search are attached from the Build > Tools catalog — capabilities the agent can invoke, separate from its instructions."},"citation":"Microsoft Learn · Azure AI Foundry Agent Service documentation (instructions and tools)"},{"id":"ft-08","dimension":"changing model weights vs injecting current data at inference","buckets":["Fine-tuning","RAG / grounding"],"a":{"text":"The model must always answer in your firm's house style, learned from 5,000 past examples.","answer":"Fine-tuning","why":"Fine-tuning retrains weights on examples — the tool for durable style/behavior change."},"b":{"text":"The model must answer from this month's price list, which changes weekly, without retraining.","answer":"RAG / grounding","why":"RAG injects retrieved current org data at inference — 'feeding the model your own data so answers stay accurate'."},"citation":"Microsoft Learn · Azure AI Foundry documentation (fine-tuning and retrieval-augmented generation)"},{"id":"ft-09","dimension":"reserved hourly capacity vs pay-per-token elastic pricing","buckets":["Provisioned throughput (PTU)","Standard deployment"],"a":{"text":"A batch workload needs a predictable, guaranteed processing rate at a fixed hourly cost, reserved in advance regardless of how many tokens are actually sent.","answer":"Provisioned throughput (PTU)","why":"PTU reserves dedicated hourly capacity for predictable, high-volume throughput — you pay for the reservation, not per token."},"b":{"text":"An interactive chat app has unpredictable traffic and needs pay-per-token billing with regional, data zone, or global processing options, rather than hourly reserved capacity.","answer":"Standard deployment","why":"Standard deployment is the preferred option offering the widest range of capabilities and elastic pay-per-token pricing — the exam's most-tested deployment contrast (pair #27)."},"citation":"Microsoft Learn · Azure OpenAI provisioned throughput (PTU) and standard deployment types"},{"id":"ft-10","dimension":"defining the analyzer vs running it","buckets":["begin_create_analyzer","begin_analyze"],"a":{"text":"You have written a custom field schema for supplier contracts and must register it before any document is processed.","answer":"begin_create_analyzer","why":"Creating/defining the analyzer from a field schema is setup, not execution."},"b":{"text":"The analyzer already exists; the code runs it against a contract URL and polls for the structured result.","answer":"begin_analyze","why":"Execution is begin_analyze(analyzer_id=…, inputs=[AnalysisInput(url=…)]) — the close-method-name swap the corpus documents (pair #26)."},"citation":"Microsoft Learn · Azure AI Content Understanding quickstart (create analyzer, then analyze)"},{"id":"ft-11","dimension":"multimodal LLM-reasoned extraction vs deterministic known-form extraction","buckets":["Content Understanding","Document Intelligence"],"a":{"text":"Describe the fields you want in natural language and extract them from a mix of PDFs, images and meeting audio into structured JSON.","answer":"Content Understanding","why":"CU lets you describe fields in natural language while an LLM reasons over multimodal input — histack's cue: 'free-form or non-document input'."},"b":{"text":"Extract totals from a high volume of standard invoices and receipts using a ready-made model.","answer":"Document Intelligence","why":"Deterministic extraction from known form types — invoices, receipts, IDs, business cards. 'The extraction trap', histack's favorite."},"citation":"Microsoft Learn · Azure AI Content Understanding and Azure AI Document Intelligence documentation"},{"id":"ft-12","dimension":"pulling structured fields out of raw content vs indexing content for later retrieval","buckets":["Content Understanding","Azure AI Search"],"a":{"text":"A retail team sends shelf photos in and gets back structured product fields such as name, price and quantity, defined by their own schema.","answer":"Content Understanding","why":"Content Understanding turns raw, unstructured or multimodal input into the specific structured output a schema asks for."},"b":{"text":"A RAG chatbot needs a knowledge base it can query by semantic similarity so a chat model can ground its answers in the retrieved passages.","answer":"Azure AI Search","why":"Azure AI Search indexes content — often via embeddings — and retrieves it at query time; RAG patterns pair a chat model with AI Search for grounding, a different job from extracting fields from a document."},"citation":"Microsoft Learn · Azure AI Content Understanding and Azure AI Search documentation"}]},"decks/microsoft/prompt-roles.json":{"id":"prompt-roles","runner":"board","title":"Sorting the Mail","blurb":"Every message in a chat belongs to exactly one role — misfile one and the exam's favourite trap gets you.","source":"histack.net trap #7","asOf":"2026-07","area":"microsoft-foundry","hint":"Ask two questions: does this apply to every turn or just this one (persistent vs one-off)? And who is speaking — the developer setting up the assistant, the person typing right now, or the model's own prior reply being resent for memory?","note":"Instruction-shaped wording is not proof of a system prompt — a one-off task can sound like a command and still be a user message. Persistence across turns is the real test.","traps":["Behavioral instructions placed in the user prompt or deployment settings are the planted wrong answer — rules belong in the system prompt."],"zones":[{"key":"System prompt","name":"System prompt","def":"Persona, tone, rules and guardrails — persistent across every turn"},{"key":"User prompt","name":"User prompt","def":"This turn's actual request"},{"key":"Assistant message","name":"Assistant message","def":"Prior model replies replayed for conversational memory"}],"items":[{"id":"pr-001","label":"\"You are a formal HR assistant. Only answer questions about HR policy.\"","answer":"System prompt","why":"Persona plus scope guardrails — histack's verbatim example of system-prompt content.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-002","label":"\"Always return customer details in a fixed JSON shape.\"","answer":"System prompt","why":"Output-format rules persist across turns — the exam material states verbatim that JSON-shape instructions belong in the system prompt.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-003","label":"\"How many vacation days do I have left this year?\"","answer":"User prompt","why":"This turn's actual request — no rules, no persona, just the ask.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-004","label":"\"You have 12 vacation days remaining.\" — replayed into the next request for context","answer":"Assistant message","why":"Prior model replies are resent as assistant messages so the model has conversational memory; they are never user content.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-005","label":"\"Summarize the attached meeting notes in three bullet points.\"","answer":"User prompt","why":"A one-off task for this turn — it sounds like an instruction, but it is not a persistent rule, so it is user, not system.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-006","label":"\"If a request falls outside HR policy, say so instead of guessing.\"","answer":"System prompt","why":"A fallback rule for handling out-of-scope requests, applied every turn — the exam's verbatim 'good addition to the system prompt' pattern, distinct from pr-001's persona/scope pair.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-007","label":"\"Keep replies to two sentences unless the customer asks for more detail.\"","answer":"System prompt","why":"A tone/length rule that applies to the whole conversation is a system-prompt signal distinct from a format rule (pr-002) or a scope rule (pr-001) — this one governs verbosity.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-008","label":"\"Refuse to discuss competitor pricing, even if the customer insists.\"","answer":"System prompt","why":"A safety/topic-restriction guardrail meant to survive user pushback for every turn — the exam notes system messages carry app-specific restrictions beyond platform content filters.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-009","label":"\"Cancel my 3pm meeting and let the team know.\"","answer":"User prompt","why":"Reads as a command, but it is a single request scoped to right now — the trap is mistaking instruction-shaped phrasing for a persistent rule.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-010","label":"\"From now on, always answer in French.\" — typed by the customer mid-chat","answer":"User prompt","why":"'From now on' sounds persistent, but who is speaking still decides the role: a request typed into the chat by the customer is a user message, even one asking for standing behavior — persistence lives in the system prompt, not in user wording.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-011","label":"\"Compare these two contract clauses and flag any conflicts.\"","answer":"User prompt","why":"A specific analytical task submitted for this exchange — no persona or app-wide rule is being set, so it is this turn's request.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-012","label":"\"Based on your account, your subscription renews on the 14th.\" — sent back on the next turn so the model remembers what it already told the customer","answer":"Assistant message","why":"Model-generated output resent to preserve context is an assistant message, not the customer's words — the trap is mistaking replayed model output for something the user said.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-013","label":"\"{\\\"status\\\": \\\"resolved\\\", \\\"ticket_id\\\": \\\"48213\\\"}\" — the model's structured reply from the previous turn, carried forward as history","answer":"Assistant message","why":"JSON-shaped content looks like the format rule from pr-002, but a rule and an instance of the model's own output are different roles — this is the model's answer being replayed, not a standing instruction.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-014","label":"\"Would you like me to also check flights for the return leg?\" — the model's own follow-up question from the previous turn, kept in context","answer":"Assistant message","why":"Question-shaped text can be mistaken for the user speaking, but this question was generated by the model itself and is resent so it remembers having asked it — the discriminator is who originated the words, not their grammatical form.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"},{"id":"pr-015","label":"\"Step 1: Restart the router. Step 2: Reconnect to Wi-Fi.\" — the model's troubleshooting steps from an earlier turn, replayed so it remembers what it already told the customer","answer":"Assistant message","why":"Numbered instructions look rule-like, tempting a mix-up with the system prompt, but these are the model's own prior output being carried forward for memory, not a persistent guardrail set by the developer.","citation":"Microsoft Learn · Azure OpenAI chat completions documentation (system, user, and assistant message roles)"}]},"decks/microsoft/agent-anatomy.json":{"id":"agent-anatomy","runner":"board","title":"Anatomy of an Agent","blurb":"Instructions, model, tools, knowledge, thread, run — drop each job on the agent component that does it.","source":"AI-901 study guide Task 2.1","asOf":"2026-07","area":"microsoft-foundry","hint":"Ask which layer the job belongs to: fixed at creation (instructions), the reasoning engine itself (model), an action beyond text (tools), attached data to ground answers (knowledge), one conversation's accumulating state (thread), or the single call that produces output (run).","note":"Instructions and tools both get configured at design time — the tie-break is whether the card is a behavior rule (instructions) or an external capability the agent calls (tools). Thread and run both live at runtime — the tie-break is whether the card is the container holding messages (thread) or the invocation that produces the next message (run).","traps":["`{\"deployment\":{\"model\":AGENT_NAME}}` is the canonical wrong answer — deployments host models, agents are model + instructions + tools","Unsaved agent changes are lost on leaving the portal — save / create_version."],"zones":[{"key":"Instructions","name":"Instructions","def":"The persistent behavior, persona, and rules set when the agent is defined — not chosen per conversation."},{"key":"Model","name":"Model","def":"The deployed model — referenced by deployment name — that the agent reasons with."},{"key":"Tools","name":"Tools","def":"Functions, APIs, and other actions the agent can call beyond generating text."},{"key":"Knowledge","name":"Knowledge","def":"Files, indexes, and other data sources the agent can search to ground its answers."},{"key":"Thread","name":"Thread","def":"One ongoing conversation's runtime message history, created per session."},{"key":"Run","name":"Run","def":"The invocation that executes the agent against a thread and produces its next output."}],"items":[{"id":"ag-001","label":"\"You are a courteous support agent; escalate anything involving refunds\" — set once when the agent is created","answer":"Instructions","why":"The instructions field defines persistent behavior at creation time — the study material's most-emphasised agent concept, distinct from runtime chat state.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service documentation"},{"id":"ag-007","label":"The natural-language persona text supplied inside PromptAgentDefinition alongside the model name, when the agent is first defined in code","answer":"Instructions","why":"PromptAgentDefinition(model=MODEL_NAME, instructions=...) sets both fields at definition time, but only the persona text shapes how the agent behaves — the model name beside it is a separate component.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service documentation"},{"id":"ag-008","label":"Format every response as a numbered list capped at five items — fixed when the agent is authored, not chosen per question","answer":"Instructions","why":"A standing formatting rule baked in at authoring time is behavior, not an external action — it doesn't call anything beyond text, which is what separates it from Tools.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service documentation"},{"id":"ag-003","label":"The deployed gpt-4o the agent reasons with — referenced by its deployment name","answer":"Model","why":"An agent = model + instructions + tools; the model is a deployment, and {\"deployment\":{\"model\":AGENT_NAME}} is the canonical wrong answer.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service documentation"},{"id":"ag-009","label":"Swapping the reasoning engine from gpt-4o-mini to gpt-5-mini without touching the agent's persona or its attached tools","answer":"Model","why":"Only the deployed reasoning engine changes here; persona and tool wiring stay fixed — a clean test of whether the deployment is a separate layer from the agent's other components.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service documentation"},{"id":"ag-010","label":"The deployment identifier passed inside PromptAgentDefinition alongside the persona text, when the agent is first defined in code","answer":"Model","why":"Same PromptAgentDefinition() call as the persona text, but this parameter names which deployed engine the agent calls — a deployment reference, not the behavior itself.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service documentation"},{"id":"ag-002","label":"Allow the agent to call external functions or APIs to take actions","answer":"Tools","why":"Function calling / tools let the model act beyond text — the capability that separates an agent from a plain chat call.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service documentation"},{"id":"ag-011","label":"Turn on live web search so the agent can pull current information beyond what's in its training data","answer":"Tools","why":"Web search is opened from the Foundry portal's tool catalog (Build > Tools) alongside code interpreter and file search — a live external capability, not attached static content.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service documentation"},{"id":"ag-012","label":"Let the agent run generated code to compute a result instead of just describing the calculation steps","answer":"Tools","why":"Code execution is one of the catalog capabilities, alongside web search and file search, that lets the agent act beyond producing text — the reasoning engine itself never executes code directly.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service documentation"},{"id":"ag-004","label":"Grounding files and data sources the agent can search to answer from your content","answer":"Knowledge","why":"Knowledge attaches your data to the agent so answers ground in it — part of the agent anatomy the study guide names for Task 2.1.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service documentation"},{"id":"ag-013","label":"Connect an existing Azure AI Search index so the agent's answers cite your indexed content instead of guessing","answer":"Knowledge","why":"An attached search index is static content the agent retrieves from to ground its answers — distinct from a tool like web search, which reaches out to a live external capability instead of your own data.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service documentation"},{"id":"ag-014","label":"Add company policy documents for the agent to search over — configured in the Agents playground alongside its persona text and attached tools — before testing multi-turn behavior","answer":"Knowledge","why":"The Agents playground configures three distinct surfaces side by side — persona, tools, and attached documents — and this card is the attached-content one: data the agent grounds answers in, not an action it takes.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service documentation"},{"id":"ag-005","label":"Carries one ongoing conversation's user and assistant messages at runtime","answer":"Thread","why":"Threads/conversations hold runtime chat state — created per session by the client app, not at agent-definition time.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service quickstart (Responses and Conversations API)"},{"id":"ag-015","label":"openai.conversations.create() called by the client app before the first turn is sent to the agent","answer":"Thread","why":"Creating the conversation object happens before any message is sent — it opens the runtime container that later turns write into, distinct from the call that actually produces a reply.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service quickstart (Responses and Conversations API)"},{"id":"ag-016","label":"The single unbroken timeline of turns that lets the agent reference something the user said three questions ago, without those messages being resent by hand every time","answer":"Thread","why":"Accumulated runtime chat history is session state, not agent behavior — it grows per conversation, unlike the persona rules fixed once at definition time.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service quickstart (Responses and Conversations API)"},{"id":"ag-006","label":"The invocation that processes the conversation and produces the agent's next output","answer":"Run","why":"A run (openai.responses.create / create run) executes the agent against the thread — the third distinct layer: definition vs session vs invocation.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service quickstart (Responses and Conversations API)"},{"id":"ag-017","label":"openai.responses.create() is the call that actually sends the user's latest message and returns the agent's reply","answer":"Run","why":"This is the invocation step — it's what actually processes the conversation and produces output, distinct from openai.conversations.create(), which only opens the container the messages live in.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service quickstart (Responses and Conversations API)"},{"id":"ag-018","label":"The extra_body={\"agent_reference\": {...}} parameter inside that same call, telling the system which agent definition to execute against the conversation","answer":"Run","why":"agent_reference is per-invocation metadata on the responses.create() call, not a fixed agent property — the exam draws this distinction explicitly against the deployment name baked into the agent's own definition.","citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service quickstart (Responses and Conversations API)"}]},"decks/microsoft/service-selection.json":{"id":"service-selection","runner":"board","title":"One Call to Make","blurb":"Read the scenario, pick the service — or the model family — the exam wants, past the near-miss planted beside it.","source":"histack.net decision list; AI-901 study guide Tasks 1.2/2.2–2.4","asOf":"2026-07","area":"microsoft-foundry","zoneMode":"options","icons":"azure-service","hint":"Two questions decide it: what does the input look like (text, form, image, audio, video, or vectors), and does the job extract/analyze, translate, search/index, or generate? The planted option is almost always the neighbor that shares the input but does the other job.","traps":["Content Understanding extracts with a plain-language field schema over multimodal input; Document Intelligence extracts with deterministic prebuilts over documents only.","Translator is text-to-text; Azure AI Speech carries audio in or out, including speech translation.","Extraction and retrieval are different services — Content Understanding/Document Intelligence extract, Azure AI Search indexes and retrieves.","Embeddings models produce vectors; Azure AI Search stores and queries them. Neither one generates new content."],"items":[{"id":"ss-001","label":"Describe invoice fields in plain language and extract them from PDFs, photos, and call recordings into structured JSON","answer":"Azure Content Understanding","options":["Azure Content Understanding","Azure AI Document Intelligence","Azure AI Language"],"why":"Natural-language field description over multimodal input → structured JSON is Content Understanding; Document Intelligence prebuilts are deterministic and document-only.","citation":"Microsoft Learn · Azure AI Content Understanding documentation"},{"id":"ss-002","label":"High-volume deterministic extraction from standard receipts and ID cards with a prebuilt model","answer":"Azure AI Document Intelligence","options":["Azure AI Document Intelligence","Azure Content Understanding","Azure AI Vision"],"why":"Known form types — invoices, receipts, IDs, business cards — are Document Intelligence prebuilt territory.","citation":"Microsoft Learn · Azure AI Document Intelligence documentation"},{"id":"ss-003","label":"Translate written product manuals from English text into Japanese text","answer":"Azure AI Translator","options":["Azure AI Translator","Azure AI Speech","Azure AI Language"],"why":"Translator is text-to-text; Azure Speech handles audio in/out including speech translation — a 6-count corpus confusion (pair #29).","citation":"Microsoft Learn · Azure AI Translator documentation"},{"id":"ss-004","label":"Index the extracted invoice data so downstream apps can search and retrieve it","answer":"Azure AI Search","options":["Azure AI Search","Azure Content Understanding","Azure AI Document Intelligence"],"why":"CU extracts; AI Search indexes and retrieves downstream (indexer, skillset, knowledge store) — extraction and retrieval are different services (pair #22).","citation":"Microsoft Learn · Azure AI Search documentation"},{"id":"ss-005","label":"Search product descriptions by semantic similarity instead of exact keyword matching","answer":"Embeddings models","options":["Embeddings models","Chat/completion model deployment","DALL-E image generation"],"why":"Embeddings convert text into vectors for semantic comparison (text-embedding-3-large) — they retrieve and compare, they never create content (pair #18).","citation":"Microsoft Learn · Azure OpenAI embeddings documentation"},{"id":"ss-006","label":"Answer free-form questions about a photo the user attaches to their chat message","answer":"Multimodal model","options":["Multimodal model","DALL-E image generation","Azure AI Vision"],"why":"Image-as-input needs a deployed multimodal model reading image content parts; image generation goes the other direction, and ImageAnalysisClient/Vision returns fixed features — a different API and endpoint (pair #23).","citation":"Microsoft Learn · Azure AI Foundry models documentation (multimodal models)"},{"id":"ss-007","label":"Read printed text off a photographed street sign so the app can show it back as plain text","answer":"Azure AI Vision","options":["Azure AI Vision","Azure AI Document Intelligence","Azure Content Understanding"],"why":"OCR/Read is a core Vision capability over general images; Document Intelligence targets structured form layouts, not incidental street-scene text.","citation":"Microsoft Learn · Azure AI Vision documentation"},{"id":"ss-008","label":"Automatically detect the source language of incoming text before translating it into English, in the same call","answer":"Azure AI Translator","options":["Azure AI Translator","Azure AI Language","Azure AI Speech"],"why":"Translator's language auto-detection runs inline as part of the translation pipeline; AI Language's Language Detection is a standalone text-analytics feature used outside a translation call.","citation":"Microsoft Learn · Azure AI Translator documentation"},{"id":"ss-009","label":"Train a model on your own labeled photos to tell defective parts from acceptable ones on a production line","answer":"Azure AI Custom Vision","options":["Azure AI Custom Vision","Azure AI Vision","Azure Machine Learning"],"why":"Custom Vision purpose-builds classification/detection from your own labeled images with a managed training loop; general Vision only returns its fixed prebuilt features and can't be retrained on your data.","citation":"Microsoft Learn · Azure AI Custom Vision documentation"},{"id":"ss-010","label":"Match a badge-scanner photo against a roster of employee photos to confirm the person's identity","answer":"Azure AI Face","options":["Azure AI Face","Azure AI Vision","Azure AI Custom Vision"],"why":"1:1 verification and 1:N identification against enrolled faces is Face's dedicated capability; general Vision analysis has no identity-matching feature.","citation":"Microsoft Learn · Azure AI Face service documentation"},{"id":"ss-011","label":"Persist key phrases, sentiment, and entities pulled from a document pipeline into a store downstream apps can search","answer":"Azure AI Search","options":["Azure AI Search","Azure AI Language","Azure Content Understanding"],"why":"A skillset can call AI Language to enrich each document, but the persisted, queryable knowledge store belongs to AI Search — enrichment and retrieval are separate pipeline stages.","citation":"Microsoft Learn · Azure AI Search documentation"},{"id":"ss-012","label":"Pull sentiment, key phrases, and named entities directly out of raw support-ticket text","answer":"Azure AI Language","options":["Azure AI Language","Azure AI Search","Azure Content Understanding"],"why":"Sentiment, key phrase extraction, and NER are AI Language text-analytics features; AI Search only consumes that output as an enrichment step, it doesn't produce it.","citation":"Microsoft Learn · Azure AI Language documentation"},{"id":"ss-013","label":"Flag an unusual spike in a factory sensor's vibration readings as they stream in over time","answer":"Azure AI Anomaly Detector","options":["Azure AI Anomaly Detector","Azure Machine Learning","Azure AI Search"],"why":"Purpose-built univariate/multivariate anomaly detection over time-series data is Anomaly Detector's job; a general ML workspace would require you to design, train, and manage that model yourself.","citation":"Microsoft Learn · Azure AI Anomaly Detector documentation"},{"id":"ss-014","label":"Get a transcript with timestamped speaker turns from a recorded two-person support call","answer":"Azure AI Speech","options":["Azure AI Speech","Azure AI Language","Azure Content Understanding"],"why":"Speech-to-text with speaker diarization runs directly on raw audio as a Speech capability; AI Language only works on text that's already been transcribed.","citation":"Microsoft Learn · Azure AI Speech documentation"},{"id":"ss-015","label":"Turn a block of written English marketing copy into narrated audio for a video voiceover","answer":"Azure AI Speech","options":["Azure AI Speech","Azure OpenAI Service","Azure AI Translator"],"why":"Neural text-to-speech synthesis is a native Speech capability; producing spoken audio from Azure OpenAI needs a separate multimodal/realtime deployment, and Translator never touches audio at all.","citation":"Microsoft Learn · Azure AI Speech documentation"},{"id":"ss-016","label":"Flag violent or hateful language in user-submitted chat messages before they ever reach the model","answer":"Azure AI Content Safety","options":["Azure AI Content Safety","Azure AI Language","Azure OpenAI Service"],"why":"Prompt Shields and moderation categories are Content Safety's job, applied to input and output alike; AI Language's PII detection is a privacy feature, not a harmful-content classifier.","citation":"Microsoft Learn · Azure AI Content Safety documentation"},{"id":"ss-017","label":"Blur or redact a customer's phone number and email address before a chat transcript is stored","answer":"Azure AI Language","options":["Azure AI Language","Azure AI Content Safety","Azure Content Understanding"],"why":"PII Detection and Redaction is a dedicated AI Language feature for spotting and masking personal data; Content Safety instead classifies harmful-content categories — a privacy concern, not a safety one.","citation":"Microsoft Learn · Azure AI Language documentation"},{"id":"ss-018","label":"Store and query millions of already-computed embedding vectors so nearest-neighbor lookups return in milliseconds","answer":"Azure AI Search","options":["Azure AI Search","Embeddings models","Azure AI Language"],"why":"Vector search and storage at query time is AI Search's job; Embeddings models only produce the vectors in the first place, they don't index or retrieve them.","citation":"Microsoft Learn · Azure AI Search documentation"},{"id":"ss-019","label":"Route a running agent's tool call out to a live weather API and feed the result back into the same conversation","answer":"Microsoft Foundry Agent Service","options":["Microsoft Foundry Agent Service","Azure OpenAI Service","Azure AI Search"],"why":"Invoking a function/custom tool mid-run against a live external API is the Agent Service's orchestration layer; a bare chat completion call has no built-in tool-invocation loop of its own.","citation":"Microsoft Learn · Azure AI Foundry Agent Service documentation"},{"id":"ss-020","label":"Attach an existing search index to a Foundry agent so its answers ground in and cite your indexed documents","answer":"Microsoft Foundry Agent Service","options":["Microsoft Foundry Agent Service","Azure AI Search","Azure OpenAI Service"],"why":"Wiring a knowledge source into an agent's grounding/citation behavior is configured on the Agent Service; the index itself just serves queries, it doesn't own the agent's persona, tools, or knowledge wiring.","citation":"Microsoft Learn · Azure AI Fo
