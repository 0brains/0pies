/* --------------------------------------------------------------- grid3x3 */
// 9 domains, 3 rounds of 3. Column 1 (domain label) is fixed; columns 2/3
// (Original/Updated) are drop targets fed from one shuffled pool per round
// mixing both sides of all 3 domains, so the player must place both which
// domain AND which side a snippet belongs to.
function dealGrid3x3(){
  const domains = state.game.payload();
  if(!state.gridGroups){
    const ids = shuffle(domains.map(d=>d.id), Math.floor(Math.random()*1e9));
    state.gridGroups = [ids.slice(0,3), ids.slice(3,6), ids.slice(6,9)];
  }
  const roundIds = state.gridGroups[state.gridRound];
  const roundDomains = roundIds.map(id => domains.find(d=>d.id===id));
  const items = [];
  roundDomains.forEach(d => {
    items.push({id:`${d.id}-original`, domainId:d.id, domain:d.domain, side:"original",
                text:d.original.text, citation:d.original.citation});
    items.push({id:`${d.id}-updated`, domainId:d.id, domain:d.domain, side:"updated",
                text:d.updated.text, citation:d.updated.citation});
  });
  state.gridItems = shuffle(items, state.gridRound + items.length);
  state.gridPlaced = {}; state.gridSel = null; state.gridChecked = false; state.gridScored = false;
}
function renderGrid3x3(){
  const domains = state.game.payload();
  const roundDomains = state.gridGroups[state.gridRound].map(id => domains.find(d=>d.id===id));
  const bank = state.gridItems.filter(i => !state.gridPlaced[i.id]);
  const allPlaced = bank.length===0;

  const tok = (i, cls="") => `<button class="tok ${cls}" draggable="true" data-tok="${i.id}">${esc(i.text)}</button>`;
  const cellItem = key => {
    const id = Object.keys(state.gridPlaced).find(k => state.gridPlaced[k]===key);
    return id ? state.gridItems.find(i=>i.id===id) : null;
  };
  const cell = (d, side) => {
    const key = `${d.id}:${side}`;
    const item = cellItem(key);
    const cls = state.gridChecked && item ? (item.domainId===d.id && item.side===side ? "correct" : "wrong") : "";
    return `<div class="zone grid-cell" data-cell="${key}"><div class="drop">${
      item ? tok(item, cls) : `<span class="cell-empty">Drop ${side==="original"?"Original":"Updated"} here</span>`
    }</div></div>`;
  };
  const rows = roundDomains.map(d => `<div class="grid-row">
      <div class="grid-domain">${esc(d.domain)}</div>
      ${cell(d,"original")}
      ${cell(d,"updated")}
    </div>`).join("");

  let body = `<p class="hint">${esc(isCoarse()
      ? "Tap a card, then choose where it belongs."
      : "Column 1 is fixed. Drag each Original/Updated snippet onto the matching domain and side.")}</p>
    <div class="grid-head"><span></span><span>Original Act</span><span>Updated Act</span></div>
    <div class="grid3x3">${rows}</div>
    <div class="bank">${bank.map(i => tok(i, state.gridSel===i.id?"sel":"")).join("")}</div>`;

  if(!state.gridChecked){
    body += `<div class="row"><button class="btn" id="check" ${allPlaced?"":"disabled"}>
      ${allPlaced?"Check round":"Place all 6 cards"}</button>
      <button class="btn ghost" id="clear" ${Object.keys(state.gridPlaced).length?"":"disabled"}>Clear round</button>
      <span class="badge">Round ${state.gridRound+1} of 3</span></div>`;
  }else{
    const right = state.gridItems.filter(i => state.gridPlaced[i.id]===`${i.domainId}:${i.side}`);
    body += `<div class="reveal">
      <p class="score ${right.length===6?"ok":right.length>=4?"mid":"no"}">${right.length} of 6</p>
      <ul>` + state.gridItems.map(i => {
        const ok = state.gridPlaced[i.id]===`${i.domainId}:${i.side}`;
        return `<li><b class="${ok?"hit":"miss"}">${ok?"✓":"✗"} ${esc(i.domain)} — ${i.side==="original"?"Original":"Updated"}</b>
          <span>${esc(i.text)} <em>${esc(i.citation)}</em></span></li>`;
      }).join("") + `</ul></div>`;
    const isLast = state.gridRound===2;
    body += `<div class="row"><button class="btn" id="next">${isLast?"Finish":"Next round →"}</button>
      <button class="btn ghost" id="retry">Replay this round</button></div>`;
  }

  const gridSheet = () => ({
    targets: () => {
      const t = [];
      roundDomains.forEach(d => ["original","updated"].forEach(side => {
        const key = `${d.id}:${side}`;
        const occ = cellItem(key);
        t.push({key, label: `${d.domain} — ${side === "original" ? "Original" : "Updated"}`,
                sub: occ ? `Holds: ${occ.text.slice(0, 60)}…` : "", icon: null});
      }));
      return t;
    },
    labelOf: id => {
      const i = state.gridItems.find(x => x.id === id);
      return i.text.length > 80 ? i.text.slice(0, 80) + "…" : i.text;
    },
    nextUnplaced: () => {
      const n = state.gridItems.find(i => state.gridPlaced[i.id] === undefined);
      return n ? n.id : null;
    },
    place: (id, key) => { placeInCell(id, key); state.gridSel = null; },
  });
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack(); wireGridDnd(gridSheet());

  const chk = document.getElementById("check");
  if(chk) chk.onclick = () => {
    state.gridChecked = true;
    if(!state.gridScored){
      state.gridItems.forEach(i => record(i.id, state.gridPlaced[i.id]===`${i.domainId}:${i.side}`));
      state.gridScored = true;
    }
    render();
  };
  const clr = document.getElementById("clear");
  if(clr) clr.onclick = () => { state.gridPlaced = {}; state.gridSel = null; render(); };
  const rty = document.getElementById("retry");
  if(rty) rty.onclick = () => { dealGrid3x3(); render(); };
  const nx = document.getElementById("next");
  if(nx) nx.onclick = () => {
    if(state.gridRound < 2){ state.gridRound++; dealGrid3x3(); render(); }
    else { state.game = null; render(); }
  };
}
function wireGridDnd(sheet){
  let dragId = null;
  main.querySelectorAll("[data-tok]").forEach(t => {
    t.onclick = () => {
      if(state.gridChecked) return;
      const id = t.dataset.tok;
      if(state.gridSel && state.gridSel!==id && state.gridPlaced[id]!==undefined) return;
      if(state.gridPlaced[id] !== undefined){ delete state.gridPlaced[id]; state.gridSel = null; render(); return; }
      if(sheet && isCoarse()){ sheetFlow(sheet, id); return; }
      state.gridSel = state.gridSel===id ? null : id;
      render();
    };
    t.ondragstart = e => { dragId = t.dataset.tok; e.dataTransfer.effectAllowed = "move"; };
  });
  main.querySelectorAll("[data-cell]").forEach(z => {
    z.ondragover = e => { e.preventDefault(); z.classList.add("over"); };
    z.ondragleave = () => z.classList.remove("over");
    z.ondrop = e => {
      e.preventDefault(); z.classList.remove("over");
      if(dragId && !state.gridChecked){ placeInCell(dragId, z.dataset.cell); dragId=null; state.gridSel=null; render(); }
    };
    z.onclick = () => {
      if(state.gridSel && !state.gridChecked){ placeInCell(state.gridSel, z.dataset.cell); state.gridSel=null; render(); }
    };
  });
}
function placeInCell(itemId, cellKey){
  // A cell holds at most one item; dropping a new one onto an occupied cell
  // bumps the old occupant back to the bank rather than stacking silently.
  for(const k of Object.keys(state.gridPlaced)) if(state.gridPlaced[k]===cellKey) delete state.gridPlaced[k];
  state.gridPlaced[itemId] = cellKey;
}

/* ------------------------------------------------------------------ pairs */
function renderPairs(){
  const pairs = state.game.payload().filter(areaOK);
  const p = pairs[state.pairIdx % pairs.length];
  const done = state.pairPick.a!==undefined && state.pairPick.b!==undefined && state.checked;

  const side = k => {
    const v = p[k];
    return `<div class="variant"><p>${esc(v.text)}</p><div class="pick">` +
      p.buckets.map(o => {
        let cls="";
        if(state.checked) cls = o===v.answer ? "correct" : (state.pairPick[k]===o ? "wrong":"");
        return `<button class="${cls}" data-side="${k}" data-opt="${esc(o)}"
          aria-pressed="${state.pairPick[k]===o}" ${state.checked?"disabled":""}>${esc(o)}</button>`;
      }).join("") + `</div>` +
      (state.checked?`<p class="why" style="margin:10px 0 0;font-size:13px">${esc(v.why)}</p>`:"") +
      `</div>`;
  };

  let body = `<p class="hint">Classify both. They differ by exactly one fact.</p>
    <div class="flip">${side("a")}${side("b")}</div>`;

  if(!state.checked){
    const both = state.pairPick.a!==undefined && state.pairPick.b!==undefined;
    const any = state.pairPick.a!==undefined || state.pairPick.b!==undefined;
    body += `<div class="row"><button class="btn" id="check" ${both?"":"disabled"}>
      ${both?"Check both":"Classify both cards"}</button>
      <button class="btn ghost" id="clear" ${any?"":"disabled"}>Clear</button>
      <span class="badge">${state.pairIdx+1} of ${pairs.length}</span></div>`;
  }else{
    const ok = state.pairPick.a===p.a.answer && state.pairPick.b===p.b.answer;
    body += `<div class="reveal">
      <p class="score ${ok?"ok":"no"}">${ok?"Both right":"Not quite"}</p>
      <div class="dim-note">The variable that changed: <b>${esc(p.dimension)}</b></div>`;
    if(p.currency) body += currencyHtml(p.currency);
    body += `<p class="cite">${esc(p.citation)}</p>`;
    const missed = [];
    if(state.pairPick.a!==p.a.answer) missed.push({label:p.a.text,said:state.pairPick.a,answer:p.a.answer,why:p.a.why});
    if(state.pairPick.b!==p.b.answer) missed.push({label:p.b.text,said:state.pairPick.b,answer:p.b.answer,why:p.b.why});
    const ctx = `the variable that changed was ${p.dimension}; ${p.citation}`;
    body += aiLinks(explainPrompt(state.game.title,
      [{label:p.a.text,answer:p.a.answer,why:p.a.why},
       {label:p.b.text,answer:p.b.answer,why:p.b.why}], ctx) +
      `\n\nThis was a deliberate minimal pair: the ONLY fact that changed between the two was ${p.dimension}. Show me three further variations along that same axis where the answer is genuinely contestable, and tell me exactly where the boundary sits.`,
      "Explain this concept:");
    if(missed.length){
      body += aiLinks(deepenPrompt(state.game.title, missed, ctx), "Go deeper on what you missed:");
    }
    body += `<div class="row"><button class="btn" id="next">Next pair →</button>
      <button class="btn ghost" id="retry">Replay this pair</button></div></div>`;
  }

  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack(); wireAiLinks();
  main.querySelectorAll("[data-side]").forEach(b => b.onclick = () => {
    state.pairPick[b.dataset.side] = b.dataset.opt; render();
  });
  const chk = document.getElementById("check");
  if(chk) chk.onclick = () => {
    state.checked = true;
    if(!state.scored){
      record(p.id, state.pairPick.a===p.a.answer && state.pairPick.b===p.b.answer);
      state.scored = true;
    }
    render();
  };
  const clr = document.getElementById("clear");
  if(clr) clr.onclick = () => { state.pairPick = {}; render(); };
  const rty = document.getElementById("retry");
  if(rty) rty.onclick = () => { state.pairPick={}; state.checked=false; render(); };
  const nx = document.getElementById("next");
  if(nx) nx.onclick = () => {
    state.pairIdx++; state.pairPick={}; state.checked=false; state.scored=false; render();
  };
}
function currencyHtml(c){
  return `<div class="currency">
    <div>📖 <strong>The book says:</strong> ${esc(c.book)}</div>
    <div>⚡ <strong>What changed:</strong> ${esc(c.changed)}</div>
    <div>🎯 <strong>For the exam:</strong> ${esc(c.exam)}</div></div>`;
}

/* -------------------------------------------------------------------- map */
function renderMap(){
  const MAP = state.game.payload();
  const js = MAP.jurisdictions;
  const chips = js.map(j => ({id:j.id, label:j.instruments[0], answer:j.id}));
  const pool = shuffle(chips, state.round).slice(0, ROUND);
  if(!state.board || state.board.kind!=="map"){
    state.board = {kind:"map", items:pool}; state.placed={}; state.checked=false;
  }
  const items = state.board.items;
  const bank = items.filter(i => !state.placed[i.id]);

  const pins = js.map(j => {
    const held = items.filter(i => state.placed[i.id]===j.id);
    let cls = `pin ${j.coverage}`;
    if(state.checked && held.length) cls += held.every(i=>i.answer===j.id) ? " correct" : " wrong";
    const lx = j.x + (j.labelDx||0), ly = j.y + (j.labelDy||0);
    // The marker sits at the true coordinates; only the label is nudged, with a
    // leader line back to it wherever the offset is big enough to be ambiguous.
    const dx = (j.labelDx||0), dy = (j.labelDy||0);
    let leader = "";
    if(Math.abs(dx) > 1 || Math.abs(dy) > 1){
      // Board is ~2:1, so a percent of height is ~half a percent of width.
      const ax = dx, ay = dy/2;
      const len = Math.sqrt(ax*ax + ay*ay), ang = Math.atan2(dy, dx*2) * 180/Math.PI;
      leader = `<div class="leader" style="left:${j.x}%;top:${j.y}%;width:${len}%;
        transform:rotate(${ang}deg)"></div>`;
    }
    return `${leader}<div class="site ${j.coverage}" style="left:${j.x}%;top:${j.y}%"></div>
      <button class="${cls}" style="left:${lx}%;top:${ly}%" data-zone="${j.id}"
        title="${esc(j.name)}">${esc(j.short)}${
        held.map(i=>`<span class="held">${esc(i.label)}</span>`).join("")}</button>`;
  }).join("");

  let body = `<p class="hint">${esc(isCoarse() ? "Tap a card, then choose where it belongs." : MAP.prompt)}</p>
    <div class="legend">${MAP.legend.map(l=>`<span class="badge">${esc(l.label)}</span>`).join("")}</div>
    <p class="map-hint">Scroll the map sideways to reach every jurisdiction.</p>
    <div class="map-wrap"><div class="map">
      <svg class="map-svg" viewBox="0 0 1016.371 514.609" preserveAspectRatio="none"
        aria-hidden="true"></svg>${pins}</div></div>
    <p class="cite">Base map: “Simplified World Map” by Guilherme de Souza Vieira, via Wikimedia
      Commons, licensed <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank"
      rel="noopener noreferrer">CC BY-SA 3.0</a>. Modified: metadata stripped, coordinate precision
      reduced, fills removed so the land follows the page theme.</p>
    <div class="bank">${bank.map(i =>
      `<button class="tok ${state.sel===i.id?"sel":""}" draggable="true" data-tok="${i.id}">${esc(i.label)}</button>`).join("")}</div>`;

  if(!state.checked){
    const placed = items.length - bank.length;
    body += `<div class="row"><button class="btn" id="check" ${bank.length?"disabled":""}>
      ${bank.length?`Place all ${items.length}`:"Check the map"}</button>
      <button class="btn ghost" id="clear" ${placed?"":"disabled"}>Clear map</button>
      <span class="badge">${placed} of ${items.length} placed</span></div>`;
  }else{
    const right = items.filter(i => state.placed[i.id]===i.answer);
    body += `<div class="reveal"><p class="score ${right.length===items.length?"ok":"no"}">
      ${right.length} of ${items.length}</p><ul>` + items.map(i => {
        const j = js.find(x=>x.id===i.answer); const ok = state.placed[i.id]===i.answer;
        return `<li><b class="${ok?"hit":"miss"}">${ok?"✓":"✗"} ${esc(i.label)} — ${esc(j.name)}</b>
          <span>${esc(j.tell)} <em>Effective ${esc(j.effective)}.</em></span></li>`;
      }).join("") + `</ul>
      <p class="cite">${esc(MAP.note)}</p>`;
    const asItems = items.map(i => {
      const j = js.find(x=>x.id===i.answer);
      return {label:`${i.label} — which jurisdiction?`, answer:j.name,
              why:`${j.tell} Effective ${j.effective}. Obligations: ${j.obligations.join("; ")}`};
    });
    body += aiLinks(explainPrompt("Jurisdiction Map", asItems,
      "matching AI instruments to the jurisdictions that enacted them"), "Explain these jurisdictions:");
    const missedMap = items.filter(i => state.placed[i.id]!==i.answer);
    if(missedMap.length){
      body += aiLinks(deepenPrompt("Jurisdiction Map", missedMap.map(i => {
        const j=js.find(x=>x.id===i.answer), g=js.find(x=>x.id===state.placed[i.id]);
        return {label:i.label, said:g?g.name:"nothing", answer:j.name, why:j.tell};
      }), "global AI regulation"), "Go deeper on what you missed:");
    }
    body += `<div class="row"><button class="btn" id="next">Next round →</button>
      <button class="btn ghost" id="retry">Replay this round</button></div></div>`;
  }
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack();
  wireDnd({
    targets: () => js.map(j => ({key: j.id, label: j.name, sub: j.short, icon: null})),
    labelOf: id => items.find(i => i.id === id).label,
    nextUnplaced: () => { const n = items.find(i => !state.placed[i.id]); return n ? n.id : null; },
    place: (id, key) => { state.placed[id] = key; state.sel = null; },
  });
  wireAiLinks();
  const chk = document.getElementById("check");
  if(chk) chk.onclick = () => {
    state.checked = true;
    if(!state.scored){
      items.forEach(i => record(`${i.id}-map`, state.placed[i.id]===i.answer));
      state.scored = true;
    }
    render();
  };
  const clr = document.getElementById("clear");
  if(clr) clr.onclick = () => { state.placed = {}; state.sel = null; render(); };
  const rty = document.getElementById("retry");
  if(rty) rty.onclick = () => { state.placed={}; state.sel=null; state.checked=false; render(); };
  const nx = document.getElementById("next");
  if(nx) nx.onclick = () => {
    state.round++; state.board=null; state.placed={}; state.checked=false; state.scored=false; render();
  };
}

/* ------------------------------------------------- regulatory risk (rr) */
// Slice 1: adapter + campaign persistence + S1 role select + S2 tinted
// board. Slice 2: the S3 action screen (expand gate / defend / consolidate),
// card draws per ADD §3.3, record(card.id, ok) at every submit, pending
// persistence + resume per ADD §3.4, and the §1.3 capital/notice mutations
// with the nexus rule. Slice 3 adds the regulator phase, the US inset sheet
// and the debrief on top of the same module-level helpers. Every id handed
// to record() is an ii-rr-* card id; no localStorage key this game touches
// ever ends in "-map".
const RR_KEY = "rr-campaign-v1", RR_META_KEY = "rr-meta-v1";
const RR_COV_LETTER = {comprehensive:"C", sectoral:"S", voluntary:"V",
                       proposed:"P", none:"—", treaty:"T"};
// US sub-nationals live in the inset sheet (slice 3) + the list, never as
// world-map hit targets; the US pin carries the ⊞ 5 chip instead.
const RR_INSET_IDS = ["map-us-co","map-us-il","map-us-tx","map-us-nyc","map-us-ca"];

function rrData(){ return state.game.payload(); }        // {campaign, map}
function rrCfg(){ return rrData().campaign.config; }
function rrJur(mapId){ return rrData().map.jurisdictions.find(j => j.id===mapId); }

function rrMeta(){
  let m = null;
  try{ m = JSON.parse(localStorage.getItem(RR_META_KEY) || "null"); }catch(e){}
  if(!m || m.v !== 1) m = {v:1, campaignCount:0, baseSeed:(Date.now() % 2147483647) || 1};
  return m;
}
function rrMetaSave(m){ try{ localStorage.setItem(RR_META_KEY, JSON.stringify(m)); }catch(e){} }

// The live campaign. undefined = storage not read yet; null = no campaign.
let rrCamp;
let rrStaleNote = false;   // saved campaign from an older version was discarded
// Shape + range validation on load (playtest wave 1): a v:1 blob with the
// wrong types (log not an Array, held not a plain object, pending truthy but
// not {action,cardIds,qIndex}) or absurd numbers is discarded to the same
// stale-note fresh start as a version bump — never rendered, never crashed on.
function rrValidCampaign(c){
  if(!c || typeof c !== "object" || c.v !== 1) return false;
  if(!Array.isArray(c.log)) return false;
  if(!c.held || typeof c.held !== "object" || Array.isArray(c.held)) return false;
  const p = c.pending;
  if(p != null && !(typeof p === "object" && typeof p.action === "string"
      && Array.isArray(p.cardIds) && typeof p.qIndex === "number")) return false;
  if(!Number.isFinite(c.turn) || !Number.isFinite(c.capital)) return false;
  if(Math.abs(c.capital) > 99) return false;   // beyond any legitimate path — corrupt
  return true;
}
function rrState(){
  if(rrCamp !== undefined) return rrCamp;
  rrCamp = null;
  try{
    const raw = localStorage.getItem(RR_KEY);
    if(raw){
      const c = JSON.parse(raw);
      if(rrValidCampaign(c)){
        // In-range drift is clamped rather than discarded; a legitimate
        // negative capital (bust path) is left intact for the F debrief.
        const cfg = rrCfg();
        c.turn = Math.min(Math.max(1, Math.round(c.turn)), cfg.turns + 1);
        if(c.capital > cfg.capitalCap) c.capital = cfg.capitalCap;
        rrCamp = c;
      }
      else rrStaleNote = true;
    }
  }catch(e){ rrStaleNote = true; }
  return rrCamp;
}
function rrSave(){
  if(!rrCamp) return;
  rrCamp.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(RR_KEY, JSON.stringify(rrCamp)); }catch(e){}
}
function rrStart(role, hat, ops){
  const meta = rrMeta();
  const now = new Date().toISOString();
  rrCamp = {v:1, turn:1, capital:rrCfg().startCapital, role, hat,
            operations:ops.slice(), held:{}, notices:[], sanctions:0,
            roleShiftsFired:0, deckDrawn:[], askedQ:[], pending:null, log:[],
            seed:(meta.baseSeed + meta.campaignCount * 9973) % 2147483647,
            startedAt:now, updatedAt:now};
  // Every start consumes a seed slot, so an abandoned campaign never
  // replays the previous campaign's shuffles and draws.
  meta.campaignCount += 1;
  rrMetaSave(meta);
  rrSave();
}
function rrClear(){
  rrCamp = null; rrStaleNote = false;
  try{ localStorage.removeItem(RR_KEY); }catch(e){}
}

// Joined territory view: campaign entry + map jurisdiction + tier config +
// runtime campaign state. `short` is the display short from the map data;
// `sid` is the CSS token (map id minus "map-") the stamped SVG classes use.
function rrTerr(mapId){
  const camp = rrState();
  const t = rrData().campaign.territories.find(x => x.mapId===mapId);
  const j = rrJur(mapId);
  if(!t || !j) return null;
  const tier = rrCfg().tiers[j.coverage] || {};
  const heldRec = (camp && camp.held[mapId]) || null;
  const noticeLevel = camp
    ? camp.notices.filter(n => n.terr===mapId).reduce((m,n) => Math.max(m,n.level), 0) : 0;
  // Open map (2026-08-03): every territory is launchable from turn 1. The
  // data's unlock fields stay in place but are ignored; `unlocked` is kept in
  // the view (always true) for compatibility with older consumers.
  const u = t.unlock;
  const unlocked = true;
  return {mapId, name:j.name, short:j.short, sid:mapId.slice(4), tier:j.coverage,
          gateSize:tier.gateSize, market:tier.market, noticeOnFail:tier.noticeOnFail,
          entryCost:tier.entryCost || 0,
          unlock:u, opsHooks:t.opsHooks, teach:t.teach, roleSensitive:t.roleSensitive,
          held:!!heldRec, suspended:!!(heldRec && heldRec.suspended),
          noticeLevel, unlocked};
}

// Ownership/coverage tint per ADD §5.3: coverage hue+badge come from the
// build-stamped cov-* classes; ownership rides on the rr-open/rr-held
// opacity channel; notices add a stroke + a hatch clone in #rr-fx; the CoE
// ring is stroke-only. Idempotent — safe to call after every state change.
function rrTint(){
  // All .rr-svg surfaces tint together: the world map and, when the US inset
  // sheet is open, its five hand-authored state shapes share the same classes.
  document.querySelectorAll(".rr-svg").forEach(svg => {
    const old = svg.querySelector(".rr-fx");
    if(old) old.remove();
    const fx = document.createElementNS("http://www.w3.org/2000/svg","g");
    fx.setAttribute("class","rr-fx");
    rrData().map.jurisdictions.forEach(j => {
      const v = rrTerr(j.id);
      if(!v) return;
      const els = svg.querySelectorAll(j.id==="map-coe" ? ".rr-coe" : ".t-"+v.sid);
      els.forEach(el => {
        el.classList.remove("rr-open","rr-held","rr-notice","rr-sel");
        el.classList.add(v.held ? "rr-held" : "rr-open");
        if(v.noticeLevel > 0 || v.suspended){
          el.classList.add("rr-notice");
          if(!el.classList.contains("rr-coe")) fx.appendChild(el.cloneNode(false));
        }
        if(state.rr && state.rr.sel===j.id) el.classList.add("rr-sel");
      });
    });
    svg.appendChild(fx);
  });
}

function rrGrade(score){
  const g = rrCfg().grades.find(gr => score >= gr[1]);
  return g ? g[0] : "F";
}

function rrStatusText(v){
  const notice = v.noticeLevel ? ` · ⚑ L${v.noticeLevel} notice` : "";
  if(v.suspended) return `SUSPENDED — L3 enforcement${notice}`;
  if(v.held) return `HELD · market +${v.market}${notice}`;
  const entry = v.entryCost ? ` · entry −₿${v.entryCost}` : "";
  return `OPEN · ${v.gateSize}-Q gate${entry} · market ${v.market}${notice}`;
}

// Launch/Expand button shared by the board list and the US inset sheet.
// Entry cost (tier config) shows on the label; if paying it would bust you
// (capital ≤ cost — bust fires at capital ≤ 0) the button is disabled with a
// hint. `acted` still disables everything once the turn's action is spent.
function rrExpandBtn(v, camp, acted){
  const cost = v.entryCost || 0;
  const poor = cost > 0 && camp.capital <= cost;
  const label = (Object.keys(camp.held).length ? "Expand" : "Launch")
    + (cost ? ` −₿${cost}` : "");
  const hint = poor
    ? ` title="Entry costs ₿${cost} and you hold ₿${camp.capital} — entering would bust you"` : "";
  return `<button class="btn rr-act" data-rr-act="expand"
    data-rr-terr="${v.mapId}"${(acted || poor) ? " disabled" : ""}${hint}>${label}</button>`;
}

let rrRegTimer = null;
function rrStopRegTimer(){ if(rrRegTimer){ clearInterval(rrRegTimer); rrRegTimer = null; } }

function renderRisk(){
  // Any screen re-render invalidates a live countdown; the board re-arms it.
  rrStopRegTimer();
  if(!state.rr) state.rr = {screen:null, sel:null, action:null, confirmAbandon:false,
                            pick:{role:"deployer", hat:"dpo", ops:[]}};
  if(!state.rr.screen) state.rr.screen = rrState() ? "board" : "role";
  const s = state.rr.screen;
  if(s === "role") return rrRenderRole();
  if(s === "board") return rrRenderBoard();
  if(s === "action") return rrRenderAction();
  if(s === "regulator") return rrRenderRegulator();
  if(s === "inset") return rrRenderInset();
  if(s === "debrief") return rrRenderDebrief();
  state.rr.screen = "board";
  return rrRenderBoard();
}

/* S1 — role select */
function rrRenderRole(){
  const C = rrData().campaign, cfg = C.config, p = state.rr.pick;
  const role = C.roles.find(r => r.id===p.role);
  const hat = C.hats.find(h => h.id===p.hat);
  const one = (items, key) => `<div class="pick">` + items.map(o =>
    `<button data-rr-pick="${key}" data-rr-val="${o.id}"
       aria-pressed="${key==="ops" ? p.ops.includes(o.id) : p[key]===o.id}">${esc(o.name)}</button>`)
    .join("") + `</div>`;
  const stale = rrStaleNote ? `<p class="dim-note hint">Saved campaign is from an older
    version — starting fresh.</p>` : "";
  const body = `<p class="hint">${esc(C.prompt)}</p>${stale}
    <div class="field"><label>Legal role — decides which gate and defend questions you face</label>
      ${one(C.roles, "role")}
      <p class="hint" style="margin:8px 0 0">${esc(role ? role.definition : "")}</p></div>
    <div class="field"><label>Org hat — flavours the regulator event deck only</label>
      ${one(C.hats, "hat")}
      <p class="hint" style="margin:8px 0 0">${esc(hat ? hat.blurb : "")}</p></div>
    <div class="field"><label>Declared operations — pick exactly 2 (they decide where regulators have a nexus)</label>
      ${one(C.operations, "ops")}
      <p class="rr-opscount">${p.ops.length} of 2 chosen${p.ops.length===2 ? " — ready" : ""}</p></div>
    <div class="row"><button class="btn" id="rr-start" ${p.ops.length===2 ? "" : "disabled"}>
      ${p.ops.length===2 ? "Start campaign" : "Pick 2 operations"}</button>
      <span class="badge">${cfg.turns} turns · ₿ ${cfg.startCapital} start · cap ${cfg.capitalCap}</span></div>`;
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack();
  main.querySelectorAll("[data-rr-pick]").forEach(b => b.onclick = () => {
    const key = b.dataset.rrPick, val = b.dataset.rrVal;
    if(key === "ops"){
      const i = p.ops.indexOf(val);
      if(i >= 0) p.ops.splice(i, 1);
      else if(p.ops.length < 2) p.ops.push(val);
    }else p[key] = val;
    render();
  });
  const st = document.getElementById("rr-start");
  if(st) st.onclick = () => {
    if(p.ops.length !== 2) return;
    rrStart(p.role, p.hat, p.ops);
    state.rr.screen = "board"; state.rr.sel = null;
    render();
  };
}

/* S2 — campaign board */
function rrRenderBoard(){
  const camp = rrState();
  if(!camp){ state.rr.screen = "role"; return rrRenderRole(); }
  // A pending action means a stem has been drawn (ADD §3.4): the board never
  // shows until it is resolved — reloading mid-gate resumes the same cards at
  // the same question, so there is nothing to scout.
  if(camp.pending){
    const pa = rrActionFromPending(camp.pending);
    // Belt-and-braces (playtest wave 1): a pending that cannot resolve to a
    // renderable action (unknown territory, no event context) is dropped here
    // instead of ping-ponging board↔action into a stack overflow.
    if(rrTerr(pa.terr) || pa.type === "audit" || pa.type === "check"){
      state.rr.action = pa;
      state.rr.screen = "action";
      return rrRenderAction();
    }
    camp.pending = null; rrSave();
  }
  const cfg = rrCfg(), M = rrData().map;
  if(camp.turn > cfg.turns || camp.capital <= 0){
    state.rr.screen = "debrief"; return rrRenderDebrief();
  }
  // A saved interstitial (aging applied, event drawn) resumes before the board.
  if(camp.reg && camp.reg.turn === camp.turn){
    state.rr.screen = "regulator"; return rrRenderRegulator();
  }
  // The regulator phase owns turn advancement; the player phase is exactly one
  // action, derived from the log rather than a separate flag.
  const acted = camp.log.some(l => l.t === camp.turn
    && ["expand","defend","consolidate"].includes(l.a));
  const views = M.jurisdictions.map(j => rrTerr(j.id));

  const regBtn = `<button class="btn${acted ? "" : " ghost"} rr-reg">
      ${acted ? "Regulator phase →" : "Pass the turn → regulator phase"}</button>`;
  // The top copy lives INSIDE the sticky turn bar; the countdown targets the
  // .rr-reg class, so it keeps ticking here too. Narrow screens get a compact
  // label so the bar wraps vertically rather than scrolling horizontally.
  const narrow = window.matchMedia("(max-width:700px)").matches;
  const hudReg = `<button class="btn${acted ? "" : " ghost"} rr-reg">
      ${acted ? "Regulator phase →" : (narrow ? "Pass turn →" : "Pass the turn → regulator phase")}</button>`;
  const hud = `<div class="rr-hud" id="rr-hud"><span>TURN ${camp.turn}/${cfg.turns}</span>
    <span>₿ ${camp.capital}</span><span>⚑ ${camp.notices.length}</span>
    <div class="meter"><i style="width:${Math.round((camp.turn-1)/cfg.turns*100)}%"></i></div>
    ${hudReg}</div>`;

  const hits = views.filter(v => !RR_INSET_IDS.includes(v.mapId)).map(v => {
    const j = rrJur(v.mapId);
    const glyph = (v.noticeLevel || v.suspended) ? "▨" : v.held ? "●" : "◍";
    // Desktop-only 5-dot substate mirror under the US pin (ADD §5.4).
    const dots = v.mapId==="map-us" ? `<span class="rr-usdots">` + RR_INSET_IDS.map(id => {
      const sv = rrTerr(id);
      return `<i style="background:var(--cov-${sv.tier});opacity:${sv.held ? 1 : .35}"></i>`;
    }).join("") + `</span>` : "";
    const chip = v.mapId==="map-us" ? `<span class="rr-chip">⊞ 5</span>${dots}` : "";
    // Desktop pin labels consume the same labelDx/labelDy nudges (map-%) the
    // Jurisdiction Map uses, converted to px at the capped desktop map width
    // (~1050×532), so clustered labels (EU/CoE/CH) can be separated in data.
    const ndx = (j.labelDx || 0), ndy = (j.labelDy || 0);
    const px = Math.round(ndx * 10.5), py = Math.round(ndy * 5.3);
    const nudge = (ndx || ndy)
      ? ` style="transform:translate(${px}px,${py}px)"` : "";
    // A label nudged well past its default seat (~12px below the pin) gets a
    // leader line back to the pin, so far-flung labels (UK/CH/CoE cluster,
    // JP/KR/TW/SG) still read as belonging to their country. The line runs
    // from just outside the glyph to just short of the label box.
    let lead = "";
    const tx = px, ty = py + 12, len = Math.hypot(tx, ty);
    if(len > 34){
      const ang = Math.round(Math.atan2(ty, tx) * 180 / Math.PI);
      lead = `<i class="rr-lead" style="width:${Math.round(len) - 18}px;
        transform:rotate(${ang}deg) translateX(9px)"></i>`;
    }
    return `<button class="rr-hit${state.rr.sel===v.mapId ? " rr-hitsel" : ""}"
      style="left:${j.x}%;top:${j.y}%" data-rr-terr="${v.mapId}"
      aria-label="${esc(v.name)} — ${esc(rrStatusText(v))}">
      ${lead}<span class="rr-glyph">${glyph}</span><span class="rr-pinlab"${nudge}>${esc(v.sid.toUpperCase())}</span>${chip}</button>`;
  }).join("");

  const legend = `<div class="rr-legend">` + M.legend.map(l =>
    `<span><i class="rr-badge cov-${l.key}">${RR_COV_LETTER[l.key] || "?"}</i>${esc(l.label)}</span>`)
    .join("") + `</div>`;

  const row = v => {
    const dis = acted ? " disabled" : "";
    let acts = "";
    if(v.noticeLevel) acts += `<button class="btn rr-act" data-rr-act="defend"
      data-rr-terr="${v.mapId}"${dis}>Defend</button>`;
    if(v.held){
      const consDone = (camp.held[v.mapId].consolidates || 0) >= rrConsLimit(v.mapId);
      acts += `<button class="btn ghost rr-act" data-rr-act="consolidate"
        data-rr-terr="${v.mapId}"${consDone ? " disabled" : dis}>${consDone
        ? "Consolidated ✓" : "Consolidate"}</button>`;
    }
    else acts += rrExpandBtn(v, camp, acted);
    if(v.mapId==="map-us") acts += `<button class="btn ghost rr-act" data-rr-inset="1">⊞ States</button>`;
    return `<div class="rr-row${state.rr.sel===v.mapId ? " rr-rowsel" : ""}"
      id="rr-row-${v.mapId}">
      <span class="rr-badge cov-${v.tier}">${RR_COV_LETTER[v.tier] || "?"}</span>
      <div class="rr-tinfo"><b>${esc(v.name)}</b><em>${esc(rrStatusText(v))}</em></div>
      <div class="rr-acts">${acts}</div></div>`;
  };
  const grp = (label, vs) => vs.length
    ? `<div class="rr-group">${label}</div>` + vs.map(row).join("") : "";
  const heldVs = views.filter(v => v.held);
  const openVs = views.filter(v => !v.held);
  const list = `<div class="rr-list">${grp(`Held (${heldVs.length})`, heldVs)}
    ${grp(`Open to expand (${openVs.length})`, openVs)}</div>`;

  const body = `${hud}<p class="hint">${acted
      ? "Action taken this turn — run the regulator phase to end the turn."
      : esc(rrData().campaign.prompt)
        + " Every action lives in the list below — map taps just jump to a territory."}</p>
    ${legend}
    <div class="rr-map"><svg class="rr-svg" viewBox="0 0 1016.371 514.609"
      preserveAspectRatio="none" aria-hidden="true"></svg>${hits}</div>
    <p class="cite">Base map: “Simplified World Map” by Guilherme de Souza Vieira, via Wikimedia
      Commons, licensed <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank"
      rel="noopener noreferrer">CC BY-SA 3.0</a>. Modified: metadata stripped, coordinate precision
      reduced, fills removed so the land follows the page theme; paths classified by territory for per-mode tinting.</p>
    ${list}
    <div class="row">${regBtn}
      <button class="btn ghost" id="rr-abandon">${state.rr.confirmAbandon ? "Really abandon?" : "Abandon campaign"}</button></div>`;
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack();
  rrTint();

  // The page header is itself sticky; pin the HUD just below its live height.
  const hudEl = document.getElementById("rr-hud");
  const head = document.querySelector("header");
  if(hudEl && head) hudEl.style.top = head.offsetHeight + "px";

  main.querySelectorAll("[data-rr-terr].rr-hit").forEach(b => b.onclick = () => {
    state.rr.sel = state.rr.sel===b.dataset.rrTerr ? null : b.dataset.rrTerr;
    render();
    const r = document.getElementById("rr-row-" + b.dataset.rrTerr);
    if(r) r.scrollIntoView({block:"nearest", behavior:"smooth"});
  });
  main.querySelectorAll(".rr-act[data-rr-act]").forEach(b => b.onclick = () => {
    state.rr.action = {type:b.dataset.rrAct, terr:b.dataset.rrTerr};
    state.rr.screen = "action";
    render();
  });
  main.querySelectorAll(".rr-act[data-rr-inset]").forEach(b => b.onclick = () => {
    state.rr.screen = "inset"; render();
  });
  const goReg = () => {
    rrStopRegTimer();
    delete state.rr.regDeadline;
    rrRegBegin(); state.rr.screen = "regulator"; render();
  };
  main.querySelectorAll(".rr-reg").forEach(b => b.onclick = goReg);
  // Once the turn's action is taken, the regulator phase auto-triggers after
  // 10s (visible countdown on both buttons). Never fires on an unspent turn.
  rrStopRegTimer();
  if(acted){
    // A deadline that expired off-screen (player left the game mid-countdown)
    // must not fire on re-entry — grant a fresh 10s instead.
    if(!state.rr.regDeadline || state.rr.regDeadline <= Date.now())
      state.rr.regDeadline = Date.now() + 10000;
    const tick = () => {
      if(!state.rr || state.rr.screen !== "board"
         || !main.querySelector(".rr-reg")) return rrStopRegTimer();
      const left = Math.ceil((state.rr.regDeadline - Date.now()) / 1000);
      if(left <= 0) return goReg();
      main.querySelectorAll(".rr-reg").forEach(b =>
        b.textContent = `Regulator phase → ${left}s`);
    };
    rrRegTimer = setInterval(tick, 250);
    tick();
  }else{
    delete state.rr.regDeadline;
  }
  const ab = document.getElementById("rr-abandon");
  if(ab) ab.onclick = () => {
    if(!state.rr.confirmAbandon){ state.rr.confirmAbandon = true; return render(); }
    rrClear();
    state.rr = null;
    render();
  };
}

/* ---- slice 2: card draws (ADD §3.3) ---- */
// The draws read the scheduler store exactly the way record()/dueNow/priority
// do — progress.items[id].{due,lastSeen} — and never write it. record() at
// each submit is the only writer; every id that reaches it is an ii-rr-* card
// id straight from campaign.cards.
function rrCards(){ return rrData().campaign.cards; }
function rrCard(id){ return rrCards().find(c => c.id===id); }
// Authoring keeps the correct answer first in the data; the DISPLAY order is
// shuffled deterministically per campaign+card (stable across a mid-gate
// reload, different between campaigns) so the answer is never "always A".
function rrOptOrder(card){
  const camp = rrState();
  let h = ((camp && camp.seed) || 1) >>> 0;
  for(let i = 0; i < card.id.length; i++)
    h = (Math.imul(h, 31) + card.id.charCodeAt(i)) >>> 0;
  return rrShuffle(card.options, h);
}
function rrRand(seed){
  let t = (seed >>> 0) || 1;
  return () => {
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function rrShuffle(list, seed){
  const a = list.slice(), rnd = rrRand(seed);
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
// Exhaustion fallback: due first per the scheduler store, then least recently
// recorded. A card with no SR entry sorts first (it has never been recorded).
function rrDueOrder(pool){
  return pool.slice().sort((x, y) => {
    const a = progress.items[x.id] || {}, b = progress.items[y.id] || {};
    return (a.due || "").localeCompare(b.due || "")
        || (a.lastSeen || "").localeCompare(b.lastSeen || "");
  });
}
// Per-draw seed: campaign seed folded with turn + questions asked so far, so
// draws differ across a campaign but are stable until something is submitted
// (a reload before the first submit re-derives the identical draw; after the
// first submit `pending.cardIds` is the persisted truth anyway).
function rrDrawSeed(){
  const c = rrState();
  return (c.seed ^ Math.imul(c.turn, 2654435761) ^ Math.imul(c.askedQ.length + 1, 40503)) >>> 0;
}
function rrDrawFrom(pool, n, seed){
  const camp = rrState();
  const fresh = pool.filter(c => !camp.askedQ.includes(c.id));
  const picked = rrShuffle(fresh, seed).slice(0, n);
  if(picked.length < n)
    picked.push(...rrDueOrder(pool.filter(c => !picked.includes(c)))
      .slice(0, n - picked.length));
  return picked.map(c => c.id);
}
function rrDrawGate(terr, role, seed){
  const all = rrCards().filter(c => c.kind==="gate" && c.territory===terr);
  const pool = all.filter(c => c.roles.includes("*") || c.roles.includes(role));
  const n = (rrTerr(terr) || {}).gateSize || 1;
  // Role-pool fallback (playtest wave 1): an empty role-filtered pool falls
  // back to the territory's full gate pool so no role/territory combo is
  // locked out of expansion; a non-empty-but-short pool keeps its role cards
  // first and tops up from the unfiltered remainder before the ADD §3.3
  // due/LRU fallback kicks in.
  if(!pool.length) return rrDrawFrom(all, n, seed);
  if(pool.length >= n) return rrDrawFrom(pool, n, seed);
  const first = rrDrawFrom(pool, pool.length, seed);
  const rest = rrDrawFrom(all.filter(c => !first.includes(c.id)), n - first.length, seed);
  return first.concat(rest);
}
function rrDrawDefend(notice){
  let pool = rrCards().filter(c => c.kind==="defend" && c.territory===notice.terr);
  if(notice.pool === "any" || !pool.length)
    pool = rrCards().filter(c => c.kind==="defend" && c.territory==="any");
  return rrDrawFrom(pool, notice.level >= 2 ? 2 : 1, rrDrawSeed());
}
function rrDrawConsolidate(terr){
  const pool = rrCards().filter(c => c.kind==="consolidate" && c.territory===terr);
  return rrDrawFrom(pool, 1, rrDrawSeed());
}
function rrConsLimit(terr){
  return Math.min(2, rrCards().filter(c => c.kind==="consolidate" && c.territory===terr).length);
}
// One mapping from a persisted pending record to the transient action object,
// used by the board resume, the action screen and the regulator phase alike.
// Audit/check pendings carry their event id + stakes so a reload mid-audit
// resumes with identical consequences.
function rrActionFromPending(p){
  return {type:p.action, terr:p.terr, noticeId:p.noticeId, eventId:p.eventId,
          reward:p.reward, penalty:p.penalty, evName:p.evName};
}
function rrEvResolved(id, res){
  const camp = rrState();
  if(!id) return;
  (camp.eventsFaced = camp.eventsFaced || []).push({id, res});
}
// Regulator-phase wrap-up: the ONLY place the turn number advances.
function rrTurnEnd(){
  const camp = rrState();
  camp.reg = null;
  camp.turn += 1;
  rrSave();
}

/* ---- slice 2: capital / notice mutations (ADD §1.3) ---- */
function rrHookedOps(terr){
  const camp = rrState(), t = rrData().campaign.territories.find(x => x.mapId===terr);
  return camp.operations.filter(op => ((t && t.opsHooks) || []).includes(op));
}
function rrOpNames(ids){
  const ops = rrData().campaign.operations;
  return ids.map(id => (ops.find(o => o.id===id) || {name:id}).name.toLowerCase()).join(" + ");
}
// The fail copy always names the nexus explicitly, whichever way the nexus
// rule (ops ∩ opsHooks, binding tiers only) lands.
function rrNexusCopy(terr){
  const v = rrTerr(terr), hooked = rrHookedOps(terr);
  if(!v.noticeOnFail)
    return `No notice: ${v.name} is a ${v.tier === "none" ? "no-AI-law" : v.tier} regime with no ` +
           `enforcement hook — nothing to serve a notice under. That asymmetry is the lesson.`;
  if(!hooked.length)
    return `Application refused. Your declared operations (${rrOpNames(rrState().operations)}) ` +
           `create no regulated nexus in ${v.name} — no notice.`;
  return `Your ${rrOpNames(hooked)} operations create a ${v.name} nexus — L1 notice served.`;
}
function rrResolveFail(a){
  const camp = rrState(), cfg = rrCfg(), v = rrTerr(a.terr);
  let msg;
  if(a.type === "expand"){
    camp.capital -= cfg.gateFailCost;
    if(v.noticeOnFail && rrHookedOps(a.terr).length){
      camp.noticeSeq = (camp.noticeSeq || 0) + 1;
      camp.notices.push({id:"n"+camp.noticeSeq, terr:a.terr, level:1, ageTurns:0,
                         source:"gate-fail"});
    }
    msg = `Gate failed — −${cfg.gateFailCost} capital. ${rrNexusCopy(a.terr)}`;
  }else if(a.type === "defend"){
    camp.capital -= cfg.gateFailCost;
    msg = `Defence failed — −${cfg.gateFailCost} capital. The ${v.name} notice stays open ` +
          `and keeps aging.`;
  }else if(a.type === "audit"){
    // ADD §4.1: audit wrong → −1 capital AND an L1 notice on that territory,
    // unconditionally (the regulator already established its own nexus).
    camp.capital -= 1;
    camp.noticeSeq = (camp.noticeSeq || 0) + 1;
    camp.notices.push({id:"n"+camp.noticeSeq, terr:a.terr, level:1, ageTurns:0,
                       source:a.eventId || "audit"});
    msg = `Audit failed — −1 capital, and an L1 notice lands in ${v.name}.`;
    rrEvResolved(a.eventId, "audit failed — −1 capital, L1 notice");
  }else if(a.type === "check"){
    const pen = a.penalty || 0;
    camp.capital -= pen;
    msg = pen ? `Wrong call — −${pen} capital.`
              : `Wrong call — no capital lost, but the fact goes on your review list.`;
    rrEvResolved(a.eventId, pen ? `check failed — −${pen} capital` : "check failed");
  }else{
    msg = `Review missed — no capital gained, none lost. Consolidate stays the safe action.`;
  }
  camp.log.push({t:camp.turn, a:a.type, terr:a.terr || "any", ok:false});
  camp.pending = null;
  if(a.type === "audit" || a.type === "check") rrTurnEnd();   // regulator phase ends
  rrSave();
  return {ok:false, msg, bust:camp.capital <= 0};
}
function rrResolvePass(a){
  const camp = rrState(), cfg = rrCfg(), v = rrTerr(a.terr);
  let msg;
  if(a.type === "expand"){
    camp.held[a.terr] = {turnClaimed:camp.turn, suspended:false, consolidates:0};
    // The entry stake comes back on a passed gate (lost on fail/withdraw).
    if(v.entryCost) camp.capital = Math.min(cfg.capitalCap, camp.capital + v.entryCost);
    msg = `${v.name} claimed — market +${v.market} while held${v.entryCost
      ? `, ₿${v.entryCost} entry stake returned` : ""}.`;
  }else if(a.type === "defend"){
    const i = camp.notices.findIndex(n => n.id===a.noticeId);
    if(i >= 0) camp.notices.splice(i, 1);
    const rec = camp.held[a.terr];
    if(rec && rec.suspended){ rec.suspended = false; msg = `Notice cleared — ${v.name} reinstated.`; }
    else msg = `Notice cleared — ${v.name} is back in good standing.`;
  }else if(a.type === "audit"){
    msg = `Audit passed — the ${v.name} file holds. No capital moves.`;
    rrEvResolved(a.eventId, "audit passed");
  }else if(a.type === "check"){
    const rew = a.reward || 0;
    const gained = rew && camp.capital < cfg.capitalCap;
    camp.capital = Math.min(cfg.capitalCap, camp.capital + rew);
    msg = !rew ? `Right call — status confirmed.`
        : gained ? `Right call — +${rew} capital (now ₿ ${camp.capital}).`
                 : `Right call — capital already at the cap of ${cfg.capitalCap}.`;
    rrEvResolved(a.eventId, rew ? "check passed — +" + rew + " capital" : "check passed");
  }else{
    const gained = camp.capital < cfg.capitalCap;
    camp.capital = Math.min(cfg.capitalCap, camp.capital + 1);
    msg = gained ? `Position consolidated — +1 capital (now ₿ ${camp.capital}).`
                 : `Position consolidated — capital already at the cap of ${cfg.capitalCap}.`;
  }
  camp.log.push({t:camp.turn, a:a.type, terr:a.terr || "any", ok:true});
  camp.pending = null;
  if(a.type === "audit" || a.type === "check") rrTurnEnd();   // regulator phase ends
  rrSave();
  return {ok:true, msg, bust:false};
}

/* S3 — action screen: expand gate / defend / consolidate (slice 2).
   Three stages: intro (no stem shown yet — withdrawing is free), question
   (pending live — withdrawing counts as a fail, ADD §3.4), reveal (why +
   citation + aiLinks on a miss; outcome once the action resolves).
   record(card.id, ok) fires at every submit, before any consequence. */
function rrRenderAction(){
  const camp = rrState();
  if(!camp){ state.rr.screen = "role"; return rrRenderRole(); }
  if(camp.pending && !state.rr.action)
    state.rr.action = rrActionFromPending(camp.pending);
  const a = state.rr.action;
  const fromEvent = a && (a.type === "audit" || a.type === "check");
  // Check events can draw territory-"any" cards, so the joined view may be
  // null there — the event title stands in for the territory name.
  let v = a && (rrTerr(a.terr)
    || (fromEvent ? {name:a.evName || "Regulator docket"} : null));
  if(!a || !v || (fromEvent && !camp.pending && !state.rr.reveal)){
    state.rr.action = null; state.rr.screen = "board"; return rrRenderBoard();
  }
  const cfg = rrCfg();
  const toBoard = () => { state.rr.action = null; state.rr.reveal = null;
    state.rr.qPick = null; state.rr.confirmWd = false;
    state.rr.screen = "board"; render(); };
  let notice = null;
  if(a.type === "defend"){
    notice = camp.notices.find(n => n.id===a.noticeId)
      || camp.notices.filter(n => n.terr===a.terr).sort((x,y) => y.level - x.level)[0] || null;
    if(notice) a.noticeId = notice.id;
  }
  const head = `<div class="row" style="margin:0 0 12px"><strong>${(a.type === "expand"
      && !Object.keys(camp.held).length ? "launch" : a.type).toUpperCase()} —
      ${esc(v.name)}</strong>
    <span class="badge">₿ ${camp.capital}</span>
    <span class="badge">TURN ${camp.turn}/${cfg.turns}</span></div>`;
  const shell = body => {
    main.innerHTML = backBar(state.game.title) + `<div class="panel">${head}${body}</div>`;
    wireBack();
  };

  /* stage 3 — reveal */
  const r = state.rr.reveal;
  if(r){
    const card = r.cardId ? rrCard(r.cardId) : null;
    let body = "";
    if(card){
      body += `<div class="field"><div class="scenario">${esc(card.q)}</div><div class="pick">`
        + rrOptOrder(card).map(o => `<button disabled class="${o===card.answer ? "correct"
            : (r.pick===o ? "wrong" : "")}">${esc(o)}</button>`).join("")
        + `</div></div>
        <p class="why" style="margin:9px 0 0;font-size:13px">${esc(card.why)}</p>
        <p class="cite">${esc(card.citation)} · as of ${esc(card.asOf)}</p>`;
      body += r.ok
        ? aiLinks(explainPrompt(`Regulatory Risk — ${v.name}`,
            [{label:card.q, answer:card.answer, why:card.why}],
            `${a.type} action in ${v.name}, playing as ${camp.role}`),
            "Go deeper with AI:")
        : aiLinks(deepenPrompt(`Regulatory Risk — ${v.name}`,
            [{label:card.q, said:r.pick, answer:card.answer, why:card.why}],
            `${a.type} action in ${v.name}, playing as ${camp.role}`),
            "Go deeper on what you missed:");
    }
    if(r.done){
      body += `<div class="reveal"><p class="score ${r.done.ok ? "ok" : "no"}">${esc(r.done.msg)}</p>`;
      if(r.done.bust) body += `<p class="score no">Compliance capital exhausted — the campaign
        is over. Bust is always an F.</p>`;
      body += `</div>`;
    }
    const label = r.done ? (r.done.bust ? "To the debrief →" : "Back to the board →")
                         : "Next question →";
    body += `<div class="row"><button class="btn" id="rr-cont">${label}</button></div>`;
    shell(body); wireAiLinks();
    document.getElementById("rr-cont").onclick = () => {
      const done = r.done;
      state.rr.reveal = null; state.rr.qPick = null; state.rr.confirmWd = false;
      if(done){ state.rr.action = null; state.rr.screen = done.bust ? "debrief" : "board"; }
      render();
    };
    return;
  }

  /* stage 2 — live question (pending persisted; withdrawing now costs) */
  if(camp.pending){
    const p = camp.pending, card = rrCard(p.cardIds[p.qIndex]);
    if(!card){ camp.pending = null; rrSave(); return toBoard(); }   // data drift guard
    const wd = state.rr.confirmWd;
    const wdWarn = a.type === "expand"
      ? `Withdrawing counts as a gate fail: −${cfg.gateFailCost} capital. ${rrNexusCopy(a.terr)}`
      : a.type === "defend"
      ? `Withdrawing counts as a failed defence: −${cfg.gateFailCost} capital and the notice keeps aging.`
      : a.type === "audit"
      ? `You cannot dodge a regulator: withdrawing counts as a failed audit — −1 capital and an L1 notice in ${v.name}.`
      : a.type === "check"
      ? `Withdrawing counts as the wrong call${(a.penalty || 0) ? `: −${a.penalty} capital` : " — the reward is forfeit"}.`
      : `Withdrawing counts as a missed review — no gain, no loss, but the question is spent.`;
    const body = `<p class="hint">Question ${p.qIndex + 1} of ${p.cardIds.length}
        · ${p.correctSoFar} correct so far${a.type==="expand" ? " · first miss ends the gate" : ""}</p>
      <div class="field"><div class="scenario">${esc(card.q)}</div><div class="pick">`
      + rrOptOrder(card).map(o => `<button data-rr-opt="${esc(o)}"
          aria-pressed="${state.rr.qPick===o}">${esc(o)}</button>`).join("")
      + `</div></div>
      ${wd ? `<p class="why" style="margin:0 0 9px;font-size:13px">${esc(wdWarn)}</p>` : ""}
      <div class="row"><button class="btn" id="rr-submit" ${state.rr.qPick ? "" : "disabled"}>
        ${state.rr.qPick ? "Submit answer" : "Pick an answer"}</button>
      <button class="btn ghost" id="rr-wd">${wd ? "Really withdraw — accept the fail" : "Withdraw"}</button></div>`;
    shell(body);
    main.querySelectorAll("[data-rr-opt]").forEach(b => b.onclick = () => {
      state.rr.qPick = b.dataset.rrOpt; render();
    });
    document.getElementById("rr-submit").onclick = () => {
      const pick = state.rr.qPick;
      if(!pick) return;
      const ok = pick === card.answer;
      record(card.id, ok);                       // SR commit at every submit (ADD §6.3)
      camp.askedQ.push(card.id);
      // Per-question ledger for the debrief review list + print report. Same
      // rr-campaign-v1 key, additive field — no new localStorage keys.
      (camp.answers = camp.answers || []).push({id:card.id, ok, pick, t:camp.turn});
      if(ok) p.correctSoFar++;
      let done = null;
      if(!ok) done = rrResolveFail(a);           // first miss ends gate AND defence
      else if(p.qIndex + 1 >= p.cardIds.length) done = rrResolvePass(a);
      else { p.qIndex++; rrSave(); }             // pending persisted after every submit
      state.rr.reveal = {cardId:card.id, pick, ok, done};
      state.rr.qPick = null; state.rr.confirmWd = false;
      render();
    };
    document.getElementById("rr-wd").onclick = () => {
      if(!state.rr.confirmWd){ state.rr.confirmWd = true; return render(); }
      const done = rrResolveFail(a);             // no record(): nothing was submitted
      state.rr.reveal = {cardId:null, pick:null, ok:false, done};
      state.rr.qPick = null; state.rr.confirmWd = false;
      render();
    };
    return;
  }

  /* stage 1 — intro: no stem revealed yet, withdrawing is free */
  // One-action-per-turn at the mutation layer (playtest wave 1): re-derive
  // `acted` from the log here, not just in the board's button rendering, so a
  // forced screen state cannot double-act. Regulator-phase actions (audit /
  // check) are exempt — the guard keys on player-phase action types only.
  const rrPlayerActs = ["expand","defend","consolidate"];
  const rrActedNow = () => camp.log.some(l => l.t === camp.turn && rrPlayerActs.includes(l.a));
  let bad = null;
  if(rrPlayerActs.includes(a.type) && rrActedNow())
    bad = "Action already taken this turn — run the regulator phase to end the turn.";
  if(a.type === "expand" && v.held) bad = `${v.name} is already held.`;
  if(a.type === "defend" && !notice) bad = `No open notice in ${v.name}.`;
  if(a.type === "consolidate"){
    if(!v.held) bad = `${v.name} is not held — nothing to consolidate.`;
    else if((camp.held[a.terr].consolidates || 0) >= rrConsLimit(a.terr))
      bad = `Consolidate limit reached for ${v.name} — ` +
            `${rrConsLimit(a.terr)} per territory per campaign.`;
  }
  if(bad){
    shell(`<p class="hint">${esc(bad)}</p>
      <div class="row"><button class="btn" id="rr-back2">← Back to the board</button></div>`);
    document.getElementById("rr-back2").onclick = toBoard;
    return;
  }
  const entryCost = (a.type === "expand" && v.entryCost) || 0;
  const canAfford = !(entryCost > 0 && camp.capital <= entryCost);
  let stakes;
  if(a.type === "expand"){
    const hooked = rrHookedOps(a.terr);
    const noticeLine = !v.noticeOnFail
      ? `a ${v.tier} regime serves no notices — no enforcement hook.`
      : hooked.length
      ? `your ${rrOpNames(hooked)} operations give ${v.name} an enforcement nexus — expect an L1 notice.`
      : `your operations create no regulated nexus in ${v.name} — no notice.`;
    const costLine = entryCost
      ? ` Entering this ${v.tier} regime takes a ₿${entryCost} stake up front —
        charged when the first question is shown, returned if you pass the gate,
        lost on a fail or withdrawal (a fail costs the usual
        −${cfg.gateFailCost} on top).` : "";
    stakes = `${v.gateSize}-question market-entry gate, drawn for your ${camp.role} role.${costLine}
      First miss ends the gate: −${cfg.gateFailCost} capital, and ${noticeLine}`;
  }else if(a.type === "defend"){
    stakes = `Answer ${notice.level >= 2 ? "2 questions — both required —" : "1 question"}
      to clear the L${notice.level} notice. Fail: −${cfg.gateFailCost} capital and the
      notice stays open and keeps aging.`;
  }else{
    stakes = `1 review question. Pass: +1 capital (cap ${cfg.capitalCap}). Fail: no gain,
      no loss. ${(camp.held[a.terr].consolidates || 0)} of ${rrConsLimit(a.terr)} consolidations used here.`;
  }
  shell(`<p class="hint">${esc(stakes)}</p>
    <p class="hint">Withdrawing is free until the first question is shown. After that,
      withdrawing counts as a fail with full consequences.</p>
    ${canAfford ? "" : `<p class="why" style="margin:0 0 9px;font-size:13px">Entry costs
      ₿${entryCost} and you hold ₿${camp.capital} — entering would bust you, so the
      gate cannot begin.</p>`}
    <div class="row"><button class="btn" id="rr-begin" ${canAfford ? "" : "disabled"}>
      ${canAfford ? "Show the first question" : `Need more than ₿${entryCost} to enter`}</button>
      <button class="btn ghost" id="rr-wdfree">Withdraw (free)</button></div>`);
  document.getElementById("rr-wdfree").onclick = toBoard;
  document.getElementById("rr-begin").onclick = () => {
    const badState = msg => {
      shell(`<p class="hint">${esc(msg)}</p>
        <div class="row"><button class="btn" id="rr-back2">← Back to the board</button></div>`);
      document.getElementById("rr-back2").onclick = toBoard;
    };
    // Mutation-layer turn guard (playtest wave 1): re-check the log right
    // before pending is created — the intro screen may be stale or forced.
    if(rrPlayerActs.includes(a.type) && rrActedNow())
      return badState("Action already taken this turn — run the regulator phase to end the turn.");
    let cardIds;
    if(a.type === "expand") cardIds = rrDrawGate(a.terr, camp.role, rrDrawSeed());
    else if(a.type === "defend") cardIds = rrDrawDefend(notice);
    else cardIds = rrDrawConsolidate(a.terr);
    // Empty-draw guard (playtest wave 1): never silently bounce begin→board.
    if(!cardIds.length)
      return badState(`No ${a.type === "expand" ? "gate" : "question"} available for ${v.name} right now.`);
    // Tier entry stake — charged exactly once, in the same code path that
    // creates pending (a reload mid-gate resumes pending and never re-charges).
    // Returned on a gate pass (rrResolvePass); lost on fail/withdraw, with
    // gateFailCost on top of a fail. Mutation-layer affordability guard:
    // entering must not itself bust you (bust fires at capital ≤ 0).
    if(entryCost > 0){
      if(camp.capital <= entryCost)
        return badState(`Entry costs ₿${entryCost} and you hold ₿${camp.capital} — entering would bust you.`);
      camp.capital -= entryCost;
    }
    camp.pending = {action:a.type, terr:a.terr, cardIds, qIndex:0, correctSoFar:0};
    if(a.type === "defend") camp.pending.noticeId = notice.id;
    if(a.type === "consolidate")
      camp.held[a.terr].consolidates = (camp.held[a.terr].consolidates || 0) + 1;
    rrSave();                                    // stem now committed — no re-roll scouting
    state.rr.qPick = null; state.rr.confirmWd = false;
    render();
  };
}

/* ---- slice 3: regulator phase (ADD §1.2 step 3, §4.3, §5.2-5) ---- */
// Which territory an audit lands on: the effect names one, or "match" resolves
// against the event's weighted holdings — held first, then noticed.
function rrAuditTerr(e, camp){
  const cands = e.effect.territory === "match"
    ? ((e.weight || {}).holdings || []) : [e.effect.territory];
  return cands.find(id => camp.held[id])
      || cands.find(id => camp.notices.some(n => n.terr===id)) || null;
}
function rrEventEligible(e, camp, cfg){
  if(camp.deckDrawn.includes(e.id)) return false;          // without replacement
  const w = e.weight || {}, t = e.effect.type;
  if(w.minTurn && camp.turn < w.minTurn) return false;
  if(w.hats && w.hats.length && !w.hats.includes(camp.hat)) return false;
  if(t === "roleShift"){
    if(camp.turn < cfg.roleShiftMinTurn) return false;
    if(camp.roleShiftsFired >= cfg.roleShiftMax) return false;
    if(e.effect.toRole === camp.role) return false;
  }
  if(t === "audit" && !rrAuditTerr(e, camp)) return false; // neither held nor noticed
  return true;
}
// ADD §4.3 weighting: base 1; +2 holdings held; +1 noticed holdings (+2 at
// L2+); +2 operations overlap; +1 coverage tier matching ≥2 held; +2
// rubber-band lifeline on reward events at capital ≤ 2.
function rrEventWeight(e, camp){
  const w = e.weight || {};
  let x = 1;
  if((w.holdings || []).some(id => camp.held[id])) x += 2;
  const lv = (w.holdings || []).reduce((m, id) =>
    camp.notices.reduce((mm, n) => n.terr===id ? Math.max(mm, n.level) : mm, m), 0);
  if(lv >= 2) x += 2; else if(lv >= 1) x += 1;
  if((w.operations || []).some(op => camp.operations.includes(op))) x += 2;
  if((w.coverage || []).some(cv =>
    Object.keys(camp.held).filter(id => (rrJur(id) || {}).coverage===cv).length >= 2)) x += 1;
  if((e.effect.reward || 0) > 0 && camp.capital <= 2) x += 2;
  return x;
}
function rrEventDraw(){
  const camp = rrState(), cfg = rrCfg();
  const evs = rrData().campaign.events;
  let pool = evs.filter(e => rrEventEligible(e, camp, cfg));
  if(!pool.length){
    // Deck exhausted: reshuffle, minus fired role-shifts (ADD §4.3).
    camp.deckDrawn = camp.deckDrawn.filter(id => {
      const e = evs.find(x => x.id===id);
      return e && e.effect.type === "roleShift";
    });
    pool = evs.filter(e => rrEventEligible(e, camp, cfg));
  }
  if(!pool.length) return null;
  const rnd = rrRand((camp.seed ^ Math.imul(camp.turn, 68767) ^ 0x2545F49) >>> 0);
  const weights = pool.map(e => rrEventWeight(e, camp));
  let roll = rnd() * weights.reduce((s, w) => s + w, 0);
  for(let i = 0; i < pool.length; i++){
    roll -= weights[i];
    if(roll <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}
// Phase A aging + Phase B draw, applied EXACTLY once per turn and persisted in
// camp.reg so a reload resumes the same interstitial (same event, no re-roll).
function rrRegBegin(){
  const camp = rrState(), cfg = rrCfg();
  if(camp.reg && camp.reg.turn === camp.turn) return;    // already running
  const lines = [];
  camp.notices.forEach(n => {
    n.ageTurns = (n.ageTurns || 0) + 1;
    const name = (rrJur(n.terr) || {name:n.terr}).name;
    if(n.level === 1 && n.ageTurns >= cfg.escalateEveryTurns){
      n.level = 2;
      lines.push({cls:"warn", txt:`⚠ ${name} notice escalates to FORMAL INVESTIGATION — ` +
        `defending now needs 2 correct answers, and audit pressure doubles.`});
    }else if(n.level === 2 && n.ageTurns >= cfg.escalateEveryTurns * 2){
      n.level = 3;
      camp.capital -= cfg.l3Cost;
      camp.sanctions += 1;
      const rec = camp.held[n.terr];
      if(rec) rec.suspended = true;
      lines.push({cls:"no", txt:`⛔ ${name.toUpperCase()}: ENFORCEMENT ACTION — ` +
        `−${cfg.l3Cost} capital, sanction on record${rec ? ", operations SUSPENDED" : ""}.`});
    }else{
      lines.push({cls:"", txt:`⚑ ${name} L${n.level} notice remains open ` +
        `(${n.ageTurns} regulator ${n.ageTurns===1 ? "phase" : "phases"} unresolved).`});
    }
  });
  camp.reg = {turn:camp.turn, lines, ev:null, terr:null, shiftLines:null, bust:false};
  if(camp.capital <= 0){                                   // bust check after aging
    camp.reg.bust = true;
    rrSave();
    return;
  }
  const pick = rrEventDraw();
  if(pick){
    camp.deckDrawn.push(pick.id);
    camp.reg.ev = pick.id;
    const eff = pick.effect;
    if(eff.type === "audit") camp.reg.terr = rrAuditTerr(pick, camp);
    if(eff.type === "roleShift"){
      // ADD §2.4: role changes now; one random held comprehensive territory
      // gains an L1 notice whose defend pool is the any-pool duty-shift cards.
      camp.role = eff.toRole;
      camp.roleShiftsFired += 1;
      const shift = [`Your legal role is now ${eff.toRole.toUpperCase()} — every future ` +
        `gate and defence draws ${eff.toRole} questions.`];
      const comps = Object.keys(camp.held).filter(id =>
        (rrTerr(id) || {}).tier === "comprehensive" && !camp.held[id].suspended);
      if(comps.length){
        const t = comps[Math.floor(rrRand((camp.seed ^ Math.imul(camp.turn, 40503)) >>> 0)()
          * comps.length)];
        camp.noticeSeq = (camp.noticeSeq || 0) + 1;
        camp.notices.push({id:"n"+camp.noticeSeq, terr:t, level:1, ageTurns:0,
                           source:pick.id, pool:"any"});
        shift.push(`⚑ Conformity status re-assessment: an L1 notice is served in ` +
          `${(rrJur(t) || {name:t}).name} — which duties just moved to you?`);
      }
      camp.reg.shiftLines = shift;
      rrEvResolved(pick.id, "role → " + eff.toRole);
    }
    if(eff.type === "info") rrEvResolved(pick.id, "noted");
  }
  rrSave();
}

/* S4 — regulator interstitial: ONGOING MATTERS aging block first (ADD §5.2-5),
   then the drawn event, then [ YOUR TURN → ]. */
function rrRenderRegulator(){
  const camp = rrState();
  if(!camp){ state.rr.screen = "role"; return rrRenderRole(); }
  if(!camp.reg || camp.reg.turn !== camp.turn) rrRegBegin();
  const cfg = rrCfg(), reg = camp.reg;
  const ev = reg.ev ? rrData().campaign.events.find(e => e.id===reg.ev) : null;
  const aging = `<div class="rr-group">Ongoing matters</div><div class="rr-aging">`
    + (reg.lines.length
        ? reg.lines.map(l => `<div class="rr-age ${l.cls}">${esc(l.txt)}</div>`).join("")
        : `<div class="rr-age">No open matters — a quiet docket.</div>`)
    + `</div>`;
  const head = `<div class="row" style="margin:0 0 12px"><strong>REGULATOR PHASE —
      TURN ${camp.turn}/${cfg.turns}</strong>
    <span class="badge">₿ ${camp.capital}</span>
    <span class="badge">⚑ ${camp.notices.length}</span></div>`;
  let body = head + aging, wire = null;
  if(reg.bust){
    body += `<p class="score no">Compliance capital exhausted — the campaign is over.
        Bust is always an F.</p>
      <div class="row"><button class="btn" id="rr-toend">To the debrief →</button></div>`;
    wire = () => document.getElementById("rr-toend").onclick = () => {
      state.rr.screen = "debrief"; render();
    };
  }else if(!ev){
    body += `<div class="rr-event"><h3>Quiet docket</h3>
        <p>No regulator event reaches your desk this turn.</p></div>
      <div class="row"><button class="btn" id="rr-turn">[ YOUR TURN → ]</button></div>`;
  }else{
    const cite = `<p class="cite">${esc(ev.citation)} · as of ${esc(ev.asOf)}</p>`;
    if(ev.effect.type === "audit"){
      const tn = (rrJur(reg.terr) || {name:reg.terr}).name;
      body += `<div class="rr-event"><h3>⚖ ${esc(ev.title)}</h3><p>${esc(ev.text)}</p>
          <p class="hint">Audit of ${esc(tn)}: 1 question from its defend file. Wrong:
            −1 capital and an L1 notice there.</p>${cite}</div>
        <div class="row"><button class="btn" id="rr-face">Face the audit →</button></div>`;
      wire = () => document.getElementById("rr-face").onclick = () => {
        const cardIds = rrDrawDefend({terr:reg.terr, level:1});
        if(!cardIds.length){ rrEvResolved(ev.id, "no file to audit"); rrTurnEnd();
          state.rr.screen = "board"; return render(); }
        camp.pending = {action:"audit", terr:reg.terr, cardIds, qIndex:0,
                        correctSoFar:0, eventId:ev.id, evName:ev.title};
        rrSave();
        state.rr.action = rrActionFromPending(camp.pending);
        state.rr.qPick = null; state.rr.confirmWd = false;
        state.rr.screen = "action"; render();
      };
    }else if(ev.effect.type === "check"){
      const rew = ev.effect.reward || 0, pen = ev.effect.penalty || 0;
      body += `<div class="rr-event"><h3>☑ ${esc(ev.title)}</h3><p>${esc(ev.text)}</p>
          <p class="hint">1 question. ${rew ? `Right: +${rew} capital (cap ${cfg.capitalCap}). ` : ""}
            ${pen ? `Wrong: −${pen} capital.` : "Wrong: no capital lost."} Never a notice.</p>${cite}</div>
        <div class="row"><button class="btn" id="rr-face">Make the call →</button></div>`;
      wire = () => document.getElementById("rr-face").onclick = () => {
        const pool = (ev.effect.cardId ? [rrCard(ev.effect.cardId)]
          : (ev.effect.cardPool || []).map(id => rrCard(id))).filter(Boolean);
        const cardIds = rrDrawFrom(pool, 1, rrDrawSeed());
        if(!cardIds.length){ rrEvResolved(ev.id, "no card resolved"); rrTurnEnd();
          state.rr.screen = "board"; return render(); }
        const ct = (rrCard(cardIds[0]) || {}).territory;
        camp.pending = {action:"check", terr:ct==="any" ? null : ct, cardIds, qIndex:0,
                        correctSoFar:0, eventId:ev.id, evName:ev.title,
                        reward:rew, penalty:pen};
        rrSave();
        state.rr.action = rrActionFromPending(camp.pending);
        state.rr.qPick = null; state.rr.confirmWd = false;
        state.rr.screen = "action"; render();
      };
    }else if(ev.effect.type === "roleShift"){
      body += `<div class="rr-event"><h3>⇄ ${esc(ev.title)}</h3><p>${esc(ev.text)}</p>
          ${(reg.shiftLines || []).map(l => `<p class="score no" style="font-size:14px">
            ${esc(l)}</p>`).join("")}${cite}</div>
        <div class="row"><button class="btn" id="rr-turn">[ YOUR TURN → ]</button></div>`;
    }else{
      body += `<div class="rr-event"><h3>ℹ ${esc(ev.title)}</h3><p>${esc(ev.text)}</p>${cite}</div>
        <div class="row"><button class="btn" id="rr-turn">[ YOUR TURN → ]</button></div>`;
    }
  }
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack();
  if(wire) wire();
  const tn = document.getElementById("rr-turn");
  if(tn) tn.onclick = () => { rrTurnEnd(); state.rr.screen = "board"; render(); };
}

function rrRenderInset(){
  const camp = rrState();
  if(!camp){ state.rr.screen = "role"; return rrRenderRole(); }
  rrRenderBoard();
  if(state.rr.screen !== "inset") return;      // the board redirected elsewhere

        data-rr-terr="${id}"${consDone ? " disabled" : dis}>${consDone

      width="68" height="68"/>` : "";
    const shape = RR_INSET_SHAPES[id]
