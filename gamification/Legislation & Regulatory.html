he conformity assessment was carried out, technical documentation exists and the system bears CE marking — then add your own name and contact details","why":"Nearest confusable is (c): the importer VERIFIES the provider completed the pre-market steps (Art. 23) — it does not redo them. (d) confuses the importer with the authorised representative, a separate mandated role; (b) ignores that importers carry their own verification and identification duties.","citation":"Ch6 §Mapping Your Role in the AI Lifecycle; EU AI Act Art. 23 (cf. Art. 24 distributors); Regulation (EU) 2026/1744 (Digital Omnibus)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-eu-i02","kind":"gate","territory":"map-eu","roles":["importer"],"area":"II.C","fact":"eu-rebrand-importer-becomes-provider","q":"Your import business starts selling that third-country high-risk system under its own trademark instead of the developer's. What happens to your obligations?","options":["You are now treated as the provider and assume the provider's duties, including conformity obligations","You remain an importer — branding does not change the role analysis","You become a distributor with only storage-and-transport care duties","You and the original developer share provider duties equally"],"answer":"You are now treated as the provider and assume the provider's duties, including conformity obligations","why":"Nearest confusable is (b): putting your name or trademark on a high-risk system already on the market is precisely the Article 25(1)(a) trigger that re-allocates the provider role. (d) is wrong on the mechanism — the original provider owes cooperation and documentation handover, not joint provider status.","citation":"Ch6 §When Deployers Become Providers; EU AI Act Art. 25(1)(a)","asOf":"2026-08-02"},{"id":"ii-rr-eu-i03","kind":"gate","territory":"map-eu","roles":["importer"],"area":"II.C","fact":"eu-authorised-rep-vs-importer","q":"A non-EU provider wants an EU foothold for its high-risk system. It signs a written mandate with a Paris firm to keep documentation available and cooperate with authorities, while a Madrid company physically places the system on the EU market. Which is which?","options":["Paris is the authorised representative; Madrid is the importer","Paris is the importer; Madrid is the distributor","Both are importers — the first EU entity in the chain takes the role","Paris is a deployer acting on the provider's behalf"],"answer":"Paris is the authorised representative; Madrid is the importer","why":"Nearest confusable is (b): the WRITTEN MANDATE to act for a third-country provider is the defining mark of the authorised representative (Art. 22), while the importer is the EU entity that places a third-country system on the market. Neither role attaches by mere position in the chain (c), and neither firm is using the system (d).","citation":"Ch6 §Mapping Your Role in the AI Lifecycle; EU AI Act Art. 22","asOf":"2026-08-02"},{"id":"ii-rr-eu-n01","kind":"defend","territory":"map-eu","roles":["*"],"area":"II.C","fact":"eu-gpai-documentation-response","q":"The AI Office opens an inquiry into your GPAI model and requests documentation. What do you produce?","options":["The Article 53 technical documentation, information for downstream providers, your copyright policy and the public training-data summary","The EU declaration of conformity and CE-marking file","A fundamental rights impact assessment","Nothing — GPAI documentation duties only bind from December 2027"],"answer":"The Article 53 technical documentation, information for downstream providers, your copyright policy and the public training-data summary","why":"Nearest confusable is (b): declarations of conformity and CE marking belong to the HIGH-RISK product-safety machinery, not the GPAI chapter. (c) is a deployer instrument; (d) misapplies the Omnibus deferral, which moved Annex III/I dates and left GPAI duties (applying since 2025-08-02) untouched.","citation":"Ch6 §Requirements for General-purpose AI; EU AI Act Art. 53","asOf":"2026-08-02"},{"id":"ii-rr-eu-n02","kind":"defend","territory":"map-eu","roles":["*"],"area":"II.C","fact":"eu-untargeted-scraping-ban","q":"A market surveillance authority probes your EU operation: you have been scraping social-media photos at scale to grow a face-recognition database. What is the correct read of your position?","options":["The practice has been unlawful outright since February 2025 — wind it down; exposure sits in the top fining band","It is high-risk: complete a conformity assessment and you may continue","It is lawful until the biometric provisions apply in December 2027"],"answer":"The practice has been unlawful outright since February 2025 — wind it down; exposure sits in the top fining band","why":"Nearest confusable is (b): untargeted scraping of facial images is an Article 5 PROHIBITED practice, not an Annex III high-risk use — no conformity route legalises it. (c) fails on currency: the prohibitions applied from 2025-02-02 and were untouched by the Digital Omnibus.","citation":"Ch6 §Prohibited AI Systems; EU AI Act Art. 5(1)(e)","asOf":"2026-08-02"},{"id":"ii-rr-eu-c01","kind":"consolidate","territory":"map-eu","roles":["*"],"area":"II.C","fact":"eu-december-2026-twin-deadline","q":"Your EU compliance calendar flags 2 December 2026. What actually lands on that date?","options":["The watermarking grace for systems already on the market before August 2026 ends, and the new prohibition on AI generating NCII/CSAM starts to apply","The Annex III high-risk obligations become enforceable","GPAI fining powers take effect","Nothing — the next AI Act milestone is December 2027"],"answer":"The watermarking grace for systems already on the market before August 2026 ends, and the new prohibition on AI generating NCII/CSAM starts to apply","why":"Nearest confusable is (b): Annex III sits a full year later, on 2027-12-02 — 2026-12-02 is the Omnibus's own transition date, closing the Art. 50 watermarking grace for pre-August-2026 systems and switching on the new Art. 5 NCII/CSAM ban it added. (c) is stale by four months — fining powers arrived 2026-08-02; (d) misses both December-2026 items.","citation":"Regulation (EU) 2026/1744 (Digital Omnibus) — transition dates","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-eu-c02","kind":"consolidate","territory":"map-eu","roles":["*"],"area":"II.C","fact":"eu-omnibus-binds-today","q":"Your board asks which EU AI Act duties bind the company today, 2 August 2026. The accurate briefing is:","options":["Prohibitions and AI literacy; GPAI duties, now backed by fining powers; Article 50 transparency; and every member state must have a sandbox — the high-risk regime is not among them","The full Act, including Annex III high-risk conformity assessment","Only the prohibitions — everything else was deferred","Nothing — the Act as a whole applies from December 2027"],"answer":"Prohibitions and AI literacy; GPAI duties, now backed by fining powers; Article 50 transparency; and every member state must have a sandbox — the high-risk regime is not among them","why":"Nearest confusable is (b): the pre-Omnibus calendar would indeed have made high-risk duties bite today, but Regulation (EU) 2026/1744 moved Annex III to 2027-12-02. (c) over-corrects in the other direction — GPAI duties and Article 50 are live alongside the prohibitions.","citation":"Regulation (EU) 2026/1744 (Digital Omnibus); Council 2026-06-29 Omnibus adoption","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-eu-k01","kind":"check","territory":"map-eu","roles":["*"],"area":"II.C","fact":"eu-sandbox-availability","q":"You want to trial a novel EU offering with supervisory cover before the high-risk regime bites. What is actually available to you today?","options":["A national AI regulatory sandbox — every member state must have at least one operational as of 2 August 2026","Nothing yet — sandboxes arrive with the high-risk regime in December 2027","The UK's proposed AI Growth Labs, which cover EU launches too"],"answer":"A national AI regulatory sandbox — every member state must have at least one operational as of 2 August 2026","why":"Nearest confusable is (b): the Digital Omnibus moved the Annex III date but left the Article 57 sandbox deadline at 2026-08-02. (c) confuses the UK's Regulating for Growth Bill — a proposal before Parliament, and not EU law — with the EU member-state obligation.","citation":"EU AI Act Art. 57; Regulation (EU) 2026/1744 (Digital Omnibus)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-uk-s01","kind":"gate","territory":"map-uk","roles":["*"],"area":"II.C","fact":"uk-principles-route-sectoral-regulators","q":"Your firm expands into the UK. Who will actually apply the five cross-sector AI principles to your business?","options":["Existing sectoral regulators — the ICO, FCA, Ofcom and peers — each within its own statutory remit","A dedicated central AI regulator created for the purpose","DSIT, which enforces the principles directly against firms","No one — the principles have no supervisory owner"],"answer":"Existing sectoral regulators — the ICO, FCA, Ofcom and peers — each within its own statutory remit","why":"Nearest confusable is (b): the UK deliberately created no central AI regulator — the principles route through existing sectoral remits, so one AI system can face the ICO on data, the FCA on financial services and Ofcom on content. DSIT (c) coordinates policy and steers the framework; it does not enforce against firms. (d) understates: regulators apply the principles through their existing statutory powers.","citation":"AIGP Study Guide §II.C UK pro-innovation approach; DSIT Blueprint for AI regulation (Oct 2025)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-uk-s02","kind":"gate","territory":"map-uk","roles":["*"],"area":"II.A","fact":"uk-duaa-adm-regime","q":"Since 5 February 2026, when can your UK operation take a significant, solely automated decision about a customer?","options":["Generally yes, with safeguards — unless special-category data is involved, where the stricter regime persists","Never without explicit consent, under a general restriction on automated decisions","Freely — the UK abolished all automated-decision rules","Only after completing an EU-style conformity assessment"],"answer":"Generally yes, with safeguards — unless special-category data is involved, where the stricter regime persists","why":"Nearest confusable is (b): that is the OLD Article 22 posture the Data (Use and Access) Act replaced — UK GDPR Articles 22A–22D flip the default to permission-with-safeguards (human intervention, representations, contest). (c) overshoots: safeguards and the special-category carve-out remain; (d) imports the wrong regime entirely.","citation":"Data (Use and Access) Act 2025 s.80 (UK GDPR Arts. 22A–22D, in force 2026-02-05)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-uk-s03","kind":"gate","territory":"map-uk","roles":["*"],"area":"II.A","fact":"uk-ico-statutory-code-duty","q":"What did SI 2026/425, in force 12 May 2026, change about UK AI supervision?","options":["It placed the ICO under a statutory duty to produce a code of practice on AI and automated decision-making, including a children's-data component","It gave the UK its first binding AI statute for companies","It transposed the EU AI Act into UK law","It created a mandatory licensing regime for AI developers"],"answer":"It placed the ICO under a statutory duty to produce a code of practice on AI and automated decision-making, including a children's-data component","why":"Nearest confusable is (b): the binding duty falls on the REGULATOR — to prepare the code — not directly on companies; the code will then guide enforcement of existing law. (c) is impossible post-Brexit mechanics; nothing in the SI licenses developers (d).","citation":"SI 2026/425 (DPA 2018 s.124A AI code duty, in force 2026-05-12)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-uk-s04","kind":"gate","territory":"map-uk","roles":["*"],"area":"II.C","fact":"uk-coe-party-effect","q":"How does the Council of Europe Framework Convention on AI reach your UK business?","options":["Indirectly — the UK has been a party since November 2025, but the treaty binds the state, so you feel it only through domestic implementation","Directly — treaty obligations apply to companies operating in ratifying states","Not at all — the UK signed but never ratified","Through the EU, which enforces it in the UK"],"answer":"Indirectly — the UK has been a party since November 2025, but the treaty binds the state, so you feel it only through domestic implementation","why":"Nearest confusable is (b): CETS 225 binds States Parties, not firms. (c) describes SWITZERLAND'S position (signed 2025-03-27, not ratified) — the UK ratified, and the Convention has been in force for it since 2025-11-01. (d) is doubly wrong: the UK left the EU and the EU's own accession takes effect only from 2026-09-01.","citation":"CoE Framework Convention CETS 225 (in force 2025-11-01; UK a party)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-uk-c01","kind":"consolidate","territory":"map-uk","roles":["*"],"area":"II.C","fact":"uk-growth-bill-status","q":"The Regulating for Growth Bill announced in the May 2026 King's Speech would give the UK…","options":["Cross-economy AI sandbox powers ('AI Growth Labs') and statutory backing for AISI — but it is still a proposal before Parliament","An EU-style AI Act with risk tiers","Binding duties already in force since May 2026","A statutory duty on the ICO to write an AI code"],"answer":"Cross-economy AI sandbox powers ('AI Growth Labs') and statutory backing for AISI — but it is still a proposal before Parliament","why":"Nearest confusable is (c): a King's Speech announcement is not law — the Bill remains before Parliament. (d) is the SEPARATE SI 2026/425, which IS in force; (b) is what the Bill deliberately is not — the UK is legislating for sandboxes, not for an AI Act.","citation":"King's Speech 2026-05-13 — Regulating for Growth Bill (proposed)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-uk-c02","kind":"consolidate","territory":"map-uk","roles":["*"],"area":"II.C","fact":"uk-five-principles","q":"Which set are the UK's cross-sector AI principles that regulators apply?","options":["Safety, security and robustness; appropriate transparency and explainability; fairness; accountability and governance; contestability and redress","GOVERN, MAP, MEASURE, MANAGE","Human agency, technical robustness, privacy, transparency, diversity, societal wellbeing, accountability","Unacceptable, high, limited and minimal risk tiers"],"answer":"Safety, security and robustness; appropriate transparency and explainability; fairness; accountability and governance; contestability and redress","why":"Nearest confusable is (c): those are the EU HLEG trustworthy-AI requirements, not the UK's five pro-innovation principles. (b) is the NIST AI RMF's four functions; (d) is the EU AI Act's risk classification — a tiering scheme, not a principles set.","citation":"AIGP Study Guide §II.C UK pro-innovation approach (five cross-sector principles)","asOf":"2026-08-02"},{"id":"ii-rr-uk-k01","kind":"check","territory":"map-uk","roles":["*"],"area":"II.C","fact":"uk-no-ai-act-trap","q":"A client asks: 'Surely the UK has its own AI Act by now?' The correct answer is:","options":["No — the October 2025 Blueprint confirmed the regulator-led route, and the anticipated AI Bill never materialised","Yes — the Data (Use and Access) Act 2025 is the UK's AI Act","Yes — the Regulating for Growth Bill became law in May 2026"],"answer":"No — the October 2025 Blueprint confirmed the regulator-led route, and the anticipated AI Bill never materialised","why":"Nearest confusable is (b): the DUAA is data-protection law that happens to reshape automated-decision rules — it is not an AI statute. (c) fails on status: the Regulating for Growth Bill was only ANNOUNCED in the King's Speech and remains before Parliament.","citation":"DSIT Blueprint for AI regulation (Oct 2025); House of Commons Library — AI regulation in the UK","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-uk-k02","kind":"check","territory":"map-uk","roles":["*"],"area":"II.A","fact":"uk-22a-vs-art22-contrast","q":"After the DUAA reforms, how does the UK's treatment of solely automated significant decisions compare with EU GDPR Article 22?","options":["They diverged on 5 February 2026 — the EU keeps the restriction model, while the UK switched to a permit-with-safeguards model","They remain aligned — the EU made an equivalent amendment at the same time","The divergence runs the other way — the UK now restricts what the EU permits"],"answer":"They diverged on 5 February 2026 — the EU keeps the restriction model, while the UK switched to a permit-with-safeguards model","why":"Nearest confusable is (c), the direction-of-travel reversal — easy if you anchor on the shared pre-Brexit text: it is the UK that liberalised, while EU Article 22 keeps its restriction-shaped default. (b) fails because the EU has made no equivalent amendment — this is now a live cross-border compliance split for any group running one decisioning stack in both markets.","citation":"Data (Use and Access) Act 2025 s.80 (UK GDPR Arts. 22A–22D); AIGP Study Guide §II.A automated decision-making","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-coe-s01","kind":"gate","territory":"map-coe","roles":["*"],"area":"II.C","fact":"coe-binds-states-not-companies","q":"Your compliance lead asks whether the Council of Europe Framework Convention adds items to your company's obligations register. Correct answer:","options":["Not directly — it binds States Parties, covering public authorities and private actors acting for them; each party chooses how to reach the wider private sector","Yes — it imposes conformity assessment duties on providers","Yes — any company in a ratifying state must register its AI systems with the Council of Europe","No, because the Convention is not yet in force"],"answer":"Not directly — it binds States Parties, covering public authorities and private actors acting for them; each party chooses how to reach the wider private sector","why":"Nearest confusable is (b): conformity assessment is EU AI Act machinery — the Convention contains no company-facing operative rules. (d) is the stale fact this game punishes: CETS 225 entered into force on 2025-11-01.","citation":"CoE Framework Convention CETS 225 (in force 2025-11-01)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-coe-s02","kind":"gate","territory":"map-coe","roles":["*"],"area":"II.C","fact":"coe-first-binding-treaty","q":"What distinction does CETS No. 225 hold in the history of AI governance?","options":["The first binding international AI treaty — in force since 1 November 2025 after its fifth ratification","The first national AI statute","A non-binding declaration, like the OECD AI Principles","An EU regulation with direct effect in member states"],"answer":"The first binding international AI treaty — in force since 1 November 2025 after its fifth ratification","why":"Nearest confusable is (c): unlike the OECD Principles or the G7 Hiroshima Process, CETS 225 creates binding obligations for its parties. It is a Council of Europe treaty open to non-members — international, not national (b) — and not an EU act (d): the EU is acceding to it as a party.","citation":"CoE Framework Convention CETS 225 (in force 2025-11-01; ratifiers incl. UK, France, Norway)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-coe-s03","kind":"gate","territory":"map-coe","roles":["*"],"area":"II.C","fact":"coe-eu-accession-timing","q":"When does the Framework Convention start applying to the EU itself?","options":["1 September 2026 — the EU ratified on 15 May 2026 and the Convention takes effect for it from that later date","It already has, since the Convention entered into force in November 2025","Never — the EU cannot join a Council of Europe treaty","2 December 2027, aligned with the AI Act's high-risk regime"],"answer":"1 September 2026 — the EU ratified on 15 May 2026 and the Convention takes effect for it from that later date","why":"Nearest confusable is (b): the treaty's general entry into force (2025-11-01) bound the states that had ratified by then — for each new party, including the EU, the clock runs from its own ratification, with effect 2026-09-01. (d) borrows the Digital Omnibus deferral date from an entirely different instrument.","citation":"CoE — EU ratifies the Framework Convention on AI (2026-05-15; effective 2026-09-01)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-coe-c01","kind":"consolidate","territory":"map-coe","roles":["*"],"area":"II.C","fact":"coe-huderia-methodology","q":"The Council of Europe's HUDERIA is best described as:","options":["Non-binding guidance for assessing AI risks and impacts on human rights, democracy and the rule of law","The mandatory impact assessment every Convention party must impose on companies","The EU AI Act's fundamental rights impact assessment","A certifiable management-system standard"],"answer":"Non-binding guidance for assessing AI risks and impacts on human rights, democracy and the rule of law","why":"Nearest confusable is (c): the FRIA (AI Act Art. 27) is EU law and deployer-facing — HUDERIA is Council of Europe methodology supporting Convention implementation, and it is guidance, not itself mandatory (b). (d) describes ISO/IEC 42001, a different animal entirely.","citation":"CoE CAI — HUDERIA risk and impact assessment methodology (2024)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-coe-c02","kind":"consolidate","territory":"map-coe","roles":["*"],"area":"II.C","fact":"coe-signatory-vs-ratification","q":"What does the Framework Convention's signature list tell you about its reach?","options":["Around 46 signatories by May 2026 — including non-European states such as the US, Canada and Japan — but signature alone does not bind; ratification does","Only Council of Europe member states may sign","Every signatory is immediately bound from the moment of signature","The US has ratified and is fully bound"],"answer":"Around 46 signatories by May 2026 — including non-European states such as the US, Canada and Japan — but signature alone does not bind; ratification does","why":"Nearest confusable is (c): signature signals intent — obligations attach only on ratification and entry into force for that party. The US and Japan have signed but not ratified (d), and the treaty is expressly open to non-members (b).","citation":"CoE Framework Convention CETS 225 — signature/ratification status (46 signatories, May 2026)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ch-s01","kind":"gate","territory":"map-ch","roles":["*"],"area":"II.C","fact":"ch-no-ai-specific-law","q":"Your company opens a Zurich office. What AI-specific law applies to your Swiss operations today?","options":["None — Switzerland deliberately chose a lean, sector-specific approach; a draft bill is only due for consultation by end-2026","The EU AI Act, which applies in Switzerland via the bilateral agreements","A Swiss horizontal AI statute in force since 2025","The CoE Convention, which Switzerland has ratified and implemented"],"answer":"None — Switzerland deliberately chose a lean, sector-specific approach; a draft bill is only due for consultation by end-2026","why":"Nearest confusable is (b): Switzerland is neither EU nor EEA, so the AI Act is not Swiss law — though it can still reach a Swiss firm extraterritorially when output is used in the EU. (d) fails on status: Switzerland SIGNED the Convention in March 2025 but has not ratified it.","citation":"Swiss Federal Council AI decision (Feb 2025); White & Case AI Watch — Switzerland","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ch-s02","kind":"gate","territory":"map-ch","roles":["*"],"area":"II.C","fact":"ch-coe-signed-not-ratified","q":"Where does Switzerland stand on the Council of Europe Framework Convention?","options":["Signed in March 2025, not yet ratified — the implementing bill is in drafting, with public consultation planned by end-2026","Ratified — in force for Switzerland since November 2025","Not signed — Switzerland stays outside all international AI instruments","Signed, and directly applicable without any implementing law"],"answer":"Signed in March 2025, not yet ratified — the implementing bill is in drafting, with public consultation planned by end-2026","why":"Nearest confusable is (b): that is the UNITED KINGDOM'S position — the UK ratified and the Convention has been in force for it since 2025-11-01. Switzerland is a signatory only, and a treaty of this kind needs ratification plus implementing legislation before it binds (contra d).","citation":"Swiss Federal Council — CoE Convention signed 2025-03-27, ratification planned; consultation due end-2026","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ch-c01","kind":"consolidate","territory":"map-ch","roles":["*"],"area":"II.C","fact":"ch-federal-council-lean-approach","q":"What did the Swiss Federal Council actually decide in February 2025 about regulating AI?","options":["Implement the CoE Convention mainly for state actors, add cross-sectoral rules only where fundamental rights demand, and otherwise rely on sectoral and non-binding measures","Draft an EU-style horizontal AI act","Suspend high-risk AI deployments pending legislation","Join the EU AI Act regime as an EEA-style partner"],"answer":"Implement the CoE Convention mainly for state actors, add cross-sectoral rules only where fundamental rights demand, and otherwise rely on sectoral and non-binding measures","why":"Nearest confusable is (b): the decision expressly REJECTED a horizontal act in favour of the lean sectoral route — the opposite of the EU's choice next door. (d) mistakes Switzerland's institutional position: it is not in the EEA and has no mechanism to adopt the AI Act wholesale.","citation":"Swiss Federal Council AI decision (2025-02-12): sectoral approach, CoE implementation","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ch-c02","kind":"consolidate","territory":"map-ch","roles":["*"],"area":"II.C","fact":"ch-tech-neutral-law-applies","q":"With no AI statute on the books, what governs an AI-driven credit product in Switzerland today?","options":["Existing technology-neutral law — the Federal Act on Data Protection plus sectoral finance rules","Nothing, until the AI bill passes","The EU AI Act's credit-scoring rules, applied directly by the Swiss financial regulator"],"answer":"Existing technology-neutral law — the Federal Act on Data Protection plus sectoral finance rules","why":"Nearest confusable is (b), the classic 'no AI law means no law' error — the FADP, product rules and financial supervision all reach AI systems today. (c) is wrong on mechanism: EU rules are not Swiss law and bite only extraterritorially where output is used in the EU market.","citation":"Swiss Federal Council AI decision (Feb 2025); Chambers — Artificial Intelligence 2026: Switzerland","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-any-n01","kind":"defend","territory":"any","roles":["*"],"area":"II.C","fact":"any-rebrand-triggers-provider","q":"A distributor takes a high-risk system already on the EU market and starts selling it under its own name. Under the AI Act's role rules, the distributor…","options":["Is treated as the provider and assumes the provider's obligations","Remains a distributor, since it did not modify the system","Becomes an importer","Shares liability 50/50 with the original provider"],"answer":"Is treated as the provider and assumes the provider's obligations","why":"Nearest confusable is (b): modification is a SEPARATE trigger (Art. 25(1)(b)) — name-or-trademark substitution alone re-allocates the provider role under Art. 25(1)(a). (c) mistakes the supply-chain geography test for the branding test; (d) invents a sharing rule the Act does not contain.","citation":"Ch6 §When Deployers Become Providers; EU AI Act Art. 25(1)(a)","asOf":"2026-08-02"},{"id":"ii-rr-any-n02","kind":"defend","territory":"any","roles":["*"],"area":"II.C","fact":"any-substantial-modification-shift","q":"A hospital rewires a CE-marked diagnostic system's model to change how it scores patients — a substantial modification — and keeps using it internally. What follows?","options":["The hospital becomes the provider of the modified system and owes a fresh conformity assessment","It stays a deployer, because it never sells the system to anyone","The original vendor remains solely responsible for the system"],"answer":"The hospital becomes the provider of the modified system and owes a fresh conformity assessment","why":"Nearest confusable is (b): putting a substantially modified high-risk system INTO SERVICE under your own authority triggers the Art. 25(1)(b) shift even without a sale. (c) is wrong on the residue — the original provider owes cooperation and documentation handover, not responsibility for someone else's modification.","citation":"Ch6 §When Deployers Become Providers; EU AI Act Art. 25(1)(b)","asOf":"2026-08-02"},{"id":"ii-rr-any-n03","kind":"defend","territory":"any","roles":["*"],"area":"II.C","fact":"any-purpose-change-shift","q":"A deployer repurposes a vendor's general office-automation tool to shortlist job applicants — a use the vendor never intended, and one that lands in the high-risk tier. Who now owes the high-risk provider duties?","options":["The deployer, because changing the intended purpose so a system becomes high-risk makes it the provider","The vendor, since it built the underlying system","No one, until the vendor updates its documentation"],"answer":"The deployer, because changing the intended purpose so a system becomes high-risk makes it the provider","why":"Nearest confusable is (b): the vendor's INTENDED PURPOSE fixed the original classification — whoever changes that purpose so the system becomes high-risk takes the provider role for the new use (Art. 25(1)(c)). (c) would leave a high-risk use ungoverned, which the role-shift rule exists to prevent.","citation":"Ch6 §When Deployers Become Providers; EU AI Act Art. 25(1)(c)","asOf":"2026-08-02"},{"id":"ii-rr-any-n04","kind":"defend","territory":"any","roles":["*"],"area":"II.C","fact":"any-finetune-gpai-provider","q":"Your team fine-tunes a third party's general-purpose model and releases the result under your own brand. Where do you now sit?","options":["You take on GPAI provider duties for your modification — documentation, downstream-information and copyright-policy duties attach to you","You remain a mere deployer of the upstream model","The upstream lab remains the only provider, whatever you do","Fine-tuning another lab's model is prohibited without a licence under the AI Act"],"answer":"You take on GPAI provider duties for your modification — documentation, downstream-information and copyright-policy duties attach to you","why":"Nearest confusable is (b): releasing a modified model under your own name is provider activity, not use — the Commission's GPAI guidelines treat significant fine-tunes as making you provider OF THE MODIFICATION, while the upstream lab keeps duties for the base model (contra c). (d) invents an AI Act licensing rule; that question is contract and IP law.","citation":"Ch6 §Requirements for General-purpose AI; Commission GPAI guidelines (2025)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-any-n05","kind":"defend","territory":"any","roles":["*"],"area":"II.C","fact":"any-role-shift-original-provider-duty","q":"A deployer's rebuild of a high-risk system has just shifted the provider role onto it. What does the ORIGINAL provider owe under the role-shift rules?","options":["Close cooperation: hand over the documentation and technical access the new provider reasonably needs to comply","Nothing — the shift extinguishes every duty it had","It must co-sign the new conformity assessment"],"answer":"Close cooperation: hand over the documentation and technical access the new provider reasonably needs to comply","why":"Nearest confusable is (b): Art. 25(2) keeps the initial provider on the hook for cooperation, information and reasonable technical access. But it does not make it a co-assessor of a system it no longer controls (c) — the conformity duty travels whole to the new provider.","citation":"Ch6 §When Deployers Become Providers; EU AI Act Art. 25(2)","asOf":"2026-08-02"},{"id":"ii-rr-any-n06","kind":"defend","territory":"any","roles":["*"],"area":"II.C","fact":"any-no-shift-intended-use","q":"Which of these does NOT move provider duties onto a deployer?","options":["Rolling the vendor's system out to thousands of staff, used exactly per its instructions and intended purpose","Marketing the system under the deployer's own trademark","Substantially modifying the system while it stays high-risk","Repurposing it so a non-high-risk system becomes high-risk"],"answer":"Rolling the vendor's system out to thousands of staff, used exactly per its instructions and intended purpose","why":"Scale of use is not a trigger — the nearest confusable is assuming heavy operational reliance alone converts a deployer. The three statutory triggers are exactly (b), (c) and (d): rebranding, substantial modification, and purpose change into high-risk (Art. 25(1)(a)–(c)).","citation":"Ch6 §When Deployers Become Providers; EU AI Act Art. 25(1)","asOf":"2026-08-02"},{"id":"ii-rr-any-w01","kind":"sweep","territory":"any","roles":["*"],"area":"II.C","fact":"any-kr-duties-jp-none","q":"South Korea's AI Framework Act and Japan's AI Promotion Act both took effect recently. Only one imposes enforceable duties on businesses — which, and why?","options":["Korea's — it carries high-impact and generative-AI obligations backed by administrative fines; Japan's statute asks businesses only for cooperation efforts, with no penalties","Japan's — it is the older statute and therefore fully enforceable","Both — any statute in force binds companies","Neither — both are purely promotional frameworks"],"answer":"Korea's — it carries high-impact and generative-AI obligations backed by administrative fines; Japan's statute asks businesses only for cooperation efforts, with no penalties","why":"Nearest confusable is (c): 'binding statute' does not mean 'business duties' — Japan's Act No. 53 of 2025 is binding law addressed to the STATE, with a deliberate no-penalty design, while Korea's Act No. 20676 (in force 2026-01-22) imposes operator duties, softened only by MSIT's 2026 enforcement grace period.","citation":"KR AI Framework Act (Act No. 20676, in force 2026-01-22); JP AI Promotion Act (Act No. 53 of 2025)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-any-w02","kind":"sweep","territory":"any","roles":["*"],"area":"II.C","fact":"any-eu-statute-uk-regulators","q":"Same product, two launches: Brussels and London. Structurally, what differs about the AI rules you meet?","options":["The EU applies one horizontal statute with risk tiers; the UK routes cross-sector principles through existing regulators, with no AI statute","Both jurisdictions apply comprehensive AI acts of their own","The UK applies the EU AI Act under the withdrawal agreement","The EU has no in-force duties until December 2027, so the launches are equivalent for now"],"answer":"The EU applies one horizontal statute with risk tiers; the UK routes cross-sector principles through existing regulators, with no AI statute","why":"Nearest confusable is (c), the retained-EU-law reflex: the AI Act post-dates Brexit and never applied in the UK. (d) fails on currency — the EU's prohibitions, GPAI duties and Article 50 transparency are already live; only the high-risk regime waits until 2027-12-02.","citation":"Ch6 §EU AI Act Implementation; AIGP Study Guide §II.C UK pro-innovation approach","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-any-w03","kind":"sweep","territory":"any","roles":["*"],"area":"II.C","fact":"any-tx-live-co-pending","q":"Texas and Colorado both passed state AI laws. As of August 2026, which one can actually be enforced against you?","options":["Texas's TRAIGA — in force since 1 January 2026; Colorado's replacement ADMT law is signed but takes effect 1 January 2027","Colorado's — its landmark AI Act has applied since February 2026","Both are in force","Neither is in force"],"answer":"Texas's TRAIGA — in force since 1 January 2026; Colorado's replacement ADMT law is signed but takes effect 1 January 2027","why":"Nearest confusable is (b): the Colorado AI Act (SB 24-205) NEVER took effect — delayed, challenged in court by xAI with DOJ intervening, then repealed and replaced by SB 26-189 (signed 2026-05-14, effective 2027-01-01). Texas's HB 149 has been enforceable by the AG since New Year 2026.","citation":"TRAIGA (HB 149, eff. 2026-01-01); Colorado SB 26-189 (signed 2026-05-14, eff. 2027-01-01)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-any-w04","kind":"sweep","territory":"any","roles":["*"],"area":"II.C","fact":"any-eu-companies-coe-states","q":"Contrast who is bound: the EU AI Act versus the Council of Europe Framework Convention.","options":["The AI Act binds operators — providers, deployers, importers — directly; the Convention binds States Parties, reaching companies only through national implementation","Both instruments bind companies directly","Both instruments bind only governments","The Convention binds companies; the AI Act binds member states only"],"answer":"The AI Act binds operators — providers, deployers, importers — directly; the Convention binds States Parties, reaching companies only through national implementation","why":"Nearest confusable is (d), the clean inversion: a REGULATION has direct effect on operators across member states, while a TREATY obliges its state parties to act. Mixing up which instrument works which way is the exact error this pairing punishes.","citation":"Ch6 §EU AI Act Implementation; CoE Framework Convention CETS 225","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-any-w05","kind":"sweep","territory":"any","roles":["*"],"area":"II.C","fact":"any-ch-minimalist-eu-horizontal","q":"Two neighbours, two philosophies: how do the EU and Switzerland differ on AI regulation?","options":["The EU runs a comprehensive horizontal statute; Switzerland deliberately chose sectoral, technology-neutral law with no AI-specific act — its first bill only reaches consultation by end-2026","Switzerland mirrors the EU AI Act to preserve market access","Both have comprehensive AI statutes; Switzerland's is just newer","Switzerland has banned high-risk AI outright instead of regulating it"],"answer":"The EU runs a comprehensive horizontal statute; Switzerland deliberately chose sectoral, technology-neutral law with no AI-specific act — its first bill only reaches consultation by end-2026","why":"Nearest confusable is (b): 'Brussels effect' logic predicts convergence, but the February 2025 Federal Council decision expressly rejected a horizontal act. The catch for Swiss firms: the EU AI Act still reaches them extraterritorially whenever their systems' output is used in the EU.","citation":"Swiss Federal Council AI decision (Feb 2025); Ch6 §Extraterritoriality","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-any-w06","kind":"sweep","territory":"any","roles":["*"],"area":"II.C","fact":"any-kr-binding-ca-br-not","q":"Canada's generative-AI code, Brazil's PL 2338 and South Korea's framework statute: which one creates enforceable company duties today?","options":["South Korea's — its statute is in force; Canada's code is voluntary (AIDA died), and Brazil's bill is still pending","Canada's — the code became binding when AIDA passed","Brazil's — PL 2338 took effect in 2025","All three are binding"],"answer":"South Korea's — its statute is in force; Canada's code is voluntary (AIDA died), and Brazil's bill is still pending","why":"Nearest confusable is (b): AIDA died with Parliament's prorogation and was never revived — Canada's 2023 generative-AI code remains voluntary. (c) fails on status: PL 2338 is still a bill before Brazil's legislature. Korea's Act No. 20676 has been in force since 2026-01-22.","citation":"KR AI Framework Act (Act No. 20676); Canada GenAI Voluntary Code (2023, AIDA dead); Brazil PL 2338 (pending)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-any-w07","kind":"sweep","territory":"any","roles":["*"],"area":"II.C","fact":"any-four-regimes-live-check","q":"Four regimes on your expansion map: EU Article 50 transparency, Korea's AI Framework Act, Texas's TRAIGA, Colorado's SB 26-189. Which is NOT yet imposing duties on 2 August 2026?","options":["Colorado's SB 26-189 — signed May 2026 but effective 1 January 2027","EU Article 50 — deferred to December 2027 with the high-risk regime","Korea's AI Framework Act — still in its legislative process","Texas's TRAIGA — enjoined by the courts"],"answer":"Colorado's SB 26-189 — signed May 2026 but effective 1 January 2027","why":"Nearest confusable is (b): the Digital Omnibus deferral hit the ANNEX III high-risk duties, not Article 50, which became enforceable on 2026-08-02. (c) is stale — Korea's Act has been in force since January 2026; (d) borrows the litigation story from COLORADO (xAI/DOJ v. the old SB 24-205) and pins it on the wrong state.","citation":"Regulation (EU) 2026/1744 (Digital Omnibus); KR Act No. 20676; TRAIGA (HB 149); Colorado SB 26-189","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-any-k01","kind":"check","territory":"any","roles":["*"],"area":"II.B","fact":"any-iso42001-certifiable-aims","q":"Your board wants a recognised credential attesting the company's AI governance system, awarded by an external auditor and usable in every market you enter. What fits?","options":["ISO/IEC 42001 — a voluntary, certifiable AI management system standard; certification signals governance maturity but discharges no legal duty","ISO/IEC 42005 — get certified against its impact-assessment checklist","NIST AI RMF certification through a US accreditation body","EU AI Act CE marking, which certifies the whole organisation"],"answer":"ISO/IEC 42001 — a voluntary, certifiable AI management system standard; certification signals governance maturity but discharges no legal duty","why":"Nearest confusable is (b): ISO/IEC 42005 is GUIDANCE for AI impact assessments — not a management-system standard and not certifiable. (c) — the NIST AI RMF is voluntary with no certification scheme behind it; (d) — CE marking attests a PRODUCT'S conformity, never an organisation's governance.","citation":"AIGP Study Guide §II.D ISO Core AI Standards; ISO/IEC 42001:2023","asOf":"2026-08-02"},{"id":"ii-rr-us-s01","kind":"gate","territory":"map-us","roles":["*"],"area":"II.C","fact":"us-no-federal-ai-statute","q":"Your board asks which single federal law imposes comprehensive obligations on your AI hiring and lending products across sectors. What do you tell them?","options":["None exists — the US regulates AI through existing sectoral statutes and enforcement","The TAKE IT DOWN Act imposes comprehensive cross-sector duties on AI systems","The NIST AI RMF, which binds all companies selling to the government","EO 14179, which directly regulates private-sector AI development"],"answer":"None exists — the US regulates AI through existing sectoral statutes and enforcement","why":"The nearest confusable is the TAKE IT DOWN Act — it really is a federal AI statute, but its scope is narrow (non-consensual intimate deepfakes), not comprehensive. The NIST AI RMF is voluntary guidance, and executive orders bind agencies, not companies.","citation":"SG Ch5 §Sectoral and Civil Laws","asOf":"2026-08-02"},{"id":"ii-rr-us-s02","kind":"gate","territory":"map-us","roles":["*"],"area":"II.B","fact":"us-ftc-s5-ai-washing","q":"A startup advertises its chatbot as delivering 'fully autonomous legal advice, 99% accurate' with no evidence behind either boast. Which authority reaches this conduct first, and on what theory?","options":["The FTC, treating unsubstantiated AI performance claims as deceptive under Section 5","The CFPB, under adverse-action notice rules","No one — marketing claims about AI fall in a gap until Congress passes an AI act","NIST, through mandatory RMF conformity findings"],"answer":"The FTC, treating unsubstantiated AI performance claims as deceptive under Section 5","why":"The nearest confusable is the no-federal-AI-act fallacy: absence of an AI statute is not absence of law — FTC Act §5 already reaches AI-washing. The CFPB's adverse-action rules govern credit decisions, not ad copy, and NIST has no enforcement power at all.","citation":"AIGP Body of Knowledge v2.1","asOf":"2026-08-02"},{"id":"ii-rr-us-s03","kind":"gate","territory":"map-us","roles":["*"],"area":"II.B","fact":"us-ecoa-adverse-action","q":"Your AI credit model turns down an applicant, who asks why. Under US federal credit law, what must your client provide?","options":["An adverse-action notice stating the specific principal reasons for the outcome","Nothing, if the model is too complex to explain","A copy of the model documentation and training data","A referral to the FTC's public complaint portal"],"answer":"An adverse-action notice stating the specific principal reasons for the outcome","why":"The nearest confusable is the black-box excuse (b): ECOA/Regulation B require specific reasons and the CFPB has said model complexity is no defense. Handing over documentation or routing to the FTC answers a different question — the duty is a reasons notice to the applicant.","citation":"ECOA/Reg B; CFPB Circular 2022-03","asOf":"2026-08-02"},{"id":"ii-rr-us-s04","kind":"gate","territory":"map-us","roles":["*"],"area":"II.D","fact":"us-nist-rmf-voluntary","q":"A US customer demands proof that your system 'complies with the NIST AI RMF as required by federal law.' What is wrong with the demand?","options":["It is voluntary guidance — no US statute makes conformity with it mandatory","Only FTC-regulated companies must certify against it","It became mandatory for high-risk systems in 2025","Only EU notified bodies can attest against it"],"answer":"It is voluntary guidance — no US statute makes conformity with it mandatory","why":"The nearest confusable is ISO/IEC 42001, which IS a certifiable management-system standard — the NIST AI RMF has no certification scheme and no legal mandate. Option (d) imports the EU notified-body machinery, which belongs to AI Act conformity assessment, not NIST.","citation":"SG Ch7 §AI Standards and Frameworks","asOf":"2026-08-02"},{"id":"ii-rr-us-s05","kind":"gate","territory":"map-us","roles":["*"],"area":"II.B","fact":"us-sectoral-patchwork-method","q":"Your US counsel maps oversight for three product lines: a credit-underwriting model, a diagnostic-support tool, and a hiring screener. The correct method is to ask:","options":["Which existing sector regulator and statute already govern that activity","Whether each product is registered in the federal AI database","Whether the state where the servers sit has ratified the AI treaty","Which NIST profile the vendor selected at design time"],"answer":"Which existing sector regulator and statute already govern that activity","why":"The nearest confusable is (b), which imports the EU's high-risk registration database — the US has no such register. The patchwork discipline is activity-based: CFPB/ECOA for credit, FDA for medical devices, EEOC/Title VII for hiring. Framework profiles (d) are voluntary choices, not jurisdictional facts.","citation":"SG Ch5 §Sectoral and Civil Laws","asOf":"2026-08-02"},{"id":"ii-rr-us-n01","kind":"defend","territory":"map-us","roles":["*"],"area":"II.B","fact":"us-ftc-inquiry-substantiation","q":"The FTC sends your company a civil investigative demand about accuracy claims made for your AI screening tool. What is the strongest first response?","options":["Produce the evidence you held to substantiate them at the time they were made","Argue the agency lacks jurisdiction because no federal AI statute exists","Point to NIST AI RMF alignment as a complete defense"],"answer":"Produce the evidence you held to substantiate them at the time they were made","why":"The nearest confusable is the jurisdiction gambit (b) — Section 5 reaches AI conduct without any AI-specific statute, so that argument loses. Substantiation must pre-date the claim; framework alignment (c) is good hygiene but does not immunize deception.","citation":"AIGP Body of Knowledge v2.1","asOf":"2026-08-02"},{"id":"ii-rr-us-n02","kind":"defend","territory":"map-us","roles":["*"],"area":"II.B","fact":"us-ecoa-black-box-no-excuse","q":"A regulator demands an explanation of 4,000 AI-driven credit denials issued last quarter. Your data-science team says the network is not interpretable. What is the compliant position?","options":["Notices must give the specific principal reasons — black-box complexity is no excuse","A general statement that the algorithm scored the applicant below threshold satisfies the duty","Reasons are owed only where a human made the final decision"],"answer":"Notices must give the specific principal reasons — black-box complexity is no excuse","why":"The nearest confusable is (c), the human-in-the-loop misconception — ECOA's adverse-action duty attaches to the credit decision however it is made. A generic below-threshold line (b) fails the specificity requirement the CFPB reiterated for AI models.","citation":"CFPB Circular 2022-03; ECOA/Reg B §1002.9","asOf":"2026-08-02"},{"id":"ii-rr-us-c01","kind":"consolidate","territory":"map-us","roles":["*"],"area":"II.C","fact":"us-federal-preemption-push-2026","q":"Which statement best captures the US federal posture toward state AI laws in mid-2026?","options":["The executive is pushing preemption — a DOJ task force sues states, while Congress has enacted nothing","A federal preemption statute took effect in March 2026","Washington has endorsed the state laws as the model for national legislation"],"answer":"The executive is pushing preemption — a DOJ task force sues states, while Congress has enacted nothing","why":"The nearest confusable is (b): the White House sent legislative preemption recommendations to Congress on 2026-03-20, but recommendations are not enacted law. EO 14365 created the DOJ AI Litigation Task Force (established 2026-01-09) to challenge state laws in court — the opposite of endorsement (c).","citation":"EO 14365; White House AI legislative recommendations 2026-03-20","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-us-c02","kind":"consolidate","territory":"map-us","roles":["*"],"area":"II.C","fact":"us-take-it-down-narrow-scope","q":"The one AI-specific law Congress has actually passed does what?","options":["Criminalizes non-consensual intimate deepfakes and requires platform notice-and-removal","Imposes risk-tiered duties on high-risk AI systems","Mandates provenance labels on all synthetic media"],"answer":"Criminalizes non-consensual intimate deepfakes and requires platform notice-and-removal","why":"The nearest confusable is (b), the EU-style risk-tier model — no US federal statute does that. Provenance labelling (c) is California SB 942's territory, not federal law. The TAKE IT DOWN Act's platform removal process had to be in place by 2026-05-19.","citation":"TAKE IT DOWN Act (Pub. L. 119-12)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tx-p01","kind":"gate","territory":"map-us-tx","roles":["provider"],"area":"II.C","fact":"traiga-developer-prohibited-purposes","q":"You build AI systems sold into Texas. Under the state's AI governance act, your baseline exposure as a developer centers on what?","options":["Prohibited purposes — creating a system with intent to unlawfully discriminate or manipulate behavior is barred","A duty of care with algorithmic impact assessments filed with the attorney general","Mandatory third-party conformity assessment before any sale","Registering each model in a state AI database"],"answer":"Prohibited purposes — creating a system with intent to unlawfully discriminate or manipulate behavior is barred","why":"The nearest confusable is (b) — that duty-of-care-plus-impact-assessment design was Colorado's original SB 24-205 model, which TRAIGA deliberately rejected in favor of intent-based prohibitions. Third-party conformity assessment (c) is the EU route; no US state runs one.","citation":"Texas Legislature — HB 149 (TRAIGA)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tx-p02","kind":"gate","territory":"map-us-tx","roles":["provider"],"area":"II.C","fact":"traiga-intent-standard","q":"A plaintiff-side report shows your Texas-deployed screening model produces skewed outcomes by race. Under TRAIGA alone, what determines developer liability?","options":["Proof of intent — a discriminatory result by itself does not establish a violation","Whether the outcomes differ at a statistically significant level","Whether the developer completed an annual bias audit","Whether the model appears in the state's high-risk registry"],"answer":"Proof of intent — a discriminatory result by itself does not establish a violation","why":"The nearest confusable is Illinois HB 3773, which uses a discriminatory-EFFECT standard — under TRAIGA the same statistics prove nothing without intent. The annual bias audit (c) is New York City's LL144 mechanism, and Texas keeps no high-risk registry (d).","citation":"Texas Legislature — HB 149 (TRAIGA)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tx-p03","kind":"gate","territory":"map-us-tx","roles":["provider"],"area":"II.C","fact":"traiga-ag-only-enforcement","q":"Who can bring an action against your company under Texas's AI act, and what happens before any suit?","options":["Only the attorney general — after notice and a 60-day cure period","Private plaintiffs, through a statutory private right of action","The state AI council, following a sandbox exit review","Municipal prosecutors in the county of deployment"],"answer":"Only the attorney general — after notice and a 60-day cure period","why":"The nearest confusable is (b), the BIPA-style private right of action — TRAIGA expressly has none, which is a large part of why it is 'light-touch'. The sandbox (c) is a testing shelter, not an enforcement gatekeeper.","citation":"Texas Legislature — HB 149 (TRAIGA)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tx-d01","kind":"gate","territory":"map-us-tx","roles":["deployer"],"area":"II.C","fact":"traiga-deployer-prohibited-uses","q":"Your firm deploys a persuasion engine inside a Texas consumer app. Which line of the state AI act does compliance review flag first?","options":["The prohibition on intentionally manipulating behavior to incite self-harm or criminal conduct","The requirement to file the algorithm with a state registry before launch","The mandatory fundamental-rights impact assessment for deployers","An outright ban on consumer-facing chatbots"],"answer":"The prohibition on intentionally manipulating behavior to incite self-harm or criminal conduct","why":"The nearest confusable is (b) — pre-launch algorithm filing is China's mechanism, not Texas's. The fundamental-rights impact assessment (c) is the EU AI Act's deployer duty. TRAIGA reaches deployers through intent-based prohibited uses, not paperwork gates.","citation":"Texas Legislature — HB 149 (TRAIGA)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tx-d02","kind":"gate","territory":"map-us-tx","roles":["deployer"],"area":"II.C","fact":"traiga-government-asymmetry","q":"Two clients ask about the same customer-ranking feature in Texas: a retailer and a city agency. Why do the answers differ?","options":["Government bodies face the social-score and biometric-ID bans — private firms face lighter, intent-based rules","Government users are exempt while private firms carry the duties","Both face identical duties under the act","Only federal agencies are covered, so neither client is affected"],"answer":"Government bodies face the social-score and biometric-ID bans — private firms face lighter, intent-based rules","why":"The nearest confusable is (b), which inverts the asymmetry: TRAIGA is STRICTER on government (social scoring; capturing biometric identifiers from public data without consent) than on private actors. It is a state law, so (d)'s federal framing is a category error.","citation":"Texas Legislature — HB 149 (TRAIGA)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tx-n01","kind":"defend","territory":"map-us-tx","roles":["*"],"area":"II.C","fact":"traiga-nist-safe-harbor","q":"The Texas attorney general opens an inquiry into your deployed screening tool. Which fact pattern gives you a recognized defense under the act?","options":["Substantial adherence to the NIST AI Risk Management Framework","The tool was procured from a reputable vendor","The tool produced no skewed outcomes last quarter"],"answer":"Substantial adherence to the NIST AI Risk Management Framework","why":"The nearest confusable is (c) — clean outcome statistics argue effects, but TRAIGA turns on intent and its safe harbors, which include following recognized frameworks like the NIST AI RMF. Vendor reputation (b) is no statutory defense anywhere.","citation":"Texas Legislature — HB 149 (TRAIGA)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tx-n02","kind":"defend","territory":"map-us-tx","roles":["*"],"area":"II.C","fact":"traiga-60-day-cure","q":"A violation notice lands from the Texas attorney general. What does the statute let you do before any enforcement action begins?","options":["Cure the cited problem within 60 days","Demand a jury trial in the first instance","Move the matter into the regulatory sandbox retroactively"],"answer":"Cure the cited problem within 60 days","why":"The nearest confusable is (c): the sandbox is a prospective testing shelter, not an after-the-fact defense. TRAIGA's cure period is the pre-enforcement safety valve — fix it in 60 days and the AG action never starts.","citation":"Texas Legislature — HB 149 (TRAIGA)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tx-c01","kind":"consolidate","territory":"map-us-tx","roles":["*"],"area":"II.C","fact":"traiga-status-third-comprehensive","q":"Place Texas correctly among US state AI laws as of mid-2026.","options":["In force since January 2026 — a cross-sector but light-touch, intent-based comprehensive law","Enacted but postponed to 2027 after a repeal-and-replace","A hiring-only audit ordinance enforced by a city agency"],"answer":"In force since January 2026 — a cross-sector but light-touch, intent-based comprehensive law","why":"The nearest confusable is (b) — that is Colorado's trajectory, not Texas's. TRAIGA took effect on schedule (2026-01-01) and is widely described as the third state comprehensive AI law. The hiring-only audit ordinance (c) is NYC Local Law 144.","citation":"Texas Legislature — HB 149 (TRAIGA)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tx-k01","kind":"check","territory":"map-us-tx","roles":["*"],"area":"II.C","fact":"traiga-sandbox-opportunity","q":"An invitation arrives to enter the Texas regulatory sandbox with a novel biometric product. What does participation actually buy?","options":["A supervised testing window with relief from certain state enforcement while conditions are met","Permanent exemption from the state's AI act","Preemption of federal FTC oversight during the trial"],"answer":"A supervised testing window with relief from certain state enforcement while conditions are met","why":"The nearest confusable is (b): sandbox relief is temporary and conditional, never a permanent pass. And no state program can displace federal law (c) — FTC Act §5 still applies inside the sandbox.","citation":"Texas Legislature — HB 149 (TRAIGA)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-il-s01","kind":"gate","territory":"map-us-il","roles":["*"],"area":"II.C","fact":"il-hb3773-effect-standard","q":"From 1 January 2026, an Illinois employer's AI screening tool disadvantages a protected group even though nobody meant it to. What is the legal position?","options":["A civil-rights violation — the state's Human Rights Act now reaches AI with discriminatory effect, no intent required","Lawful unless plaintiffs prove an intent to discriminate","Governed only by the federal EEOC, not state law","Permitted if the vendor certified the tool as bias-free"],"answer":"A civil-rights violation — the state's Human Rights Act now reaches AI with discriminatory effect, no intent required","why":"The nearest confusable is (b) — that intent-based standard is Texas TRAIGA's, and HB 3773 pointedly chose the opposite: effect suffices. Vendor certification (d) shifts nothing; the duty sits on the employer under the amended IHRA.","citation":"Illinois General Assembly — HB 3773 (P.A. 103-0804)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-il-s02","kind":"gate","territory":"map-us-il","roles":["*"],"area":"II.B","fact":"il-bipa-written-consent","q":"Your client wants to roll out fingerprint time-clocks across Illinois warehouses. Before any scanning starts, the state's biometric statute requires what?","options":["Written notice and a written release from each worker, plus a public retention schedule","A bias audit published on the company website","Registration of the fingerprint templates with the state","Nothing, provided the data never leaves company premises"],"answer":"Written notice and a written release from each worker, plus a public retention schedule","why":"The nearest confusable is (b) — the published bias audit is NYC LL144's hiring rule, a different instrument and city. BIPA §15 demands informed written consent and a retention/destruction policy before collection; on-premises storage (d) is no exemption.","citation":"740 ILCS 14 (BIPA)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-il-s03","kind":"gate","territory":"map-us-il","roles":["*"],"area":"II.C","fact":"il-zip-code-proxy-ban","q":"An Illinois recruiter's model never sees race but heavily weights applicants' home postal areas. Under the 2026 employment-AI amendment, that practice is:","options":["Expressly restricted — ZIP code may not be used as a proxy for protected classes","Lawful, because location is not a protected characteristic","A biometric-privacy violation","Actionable only under federal redlining rules"],"answer":"Expressly restricted — ZIP code may not be used as a proxy for protected classes","why":"The nearest confusable is (c) — BIPA is the other famous Illinois statute, but it covers biometric identifiers, not geographic proxies. HB 3773 names ZIP-code-as-proxy explicitly, so no resort to federal redlining doctrine (d) is needed.","citation":"Illinois General Assembly — HB 3773 (P.A. 103-0804)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-il-n01","kind":"defend","territory":"map-us-il","roles":["*"],"area":"II.C","fact":"il-ai-use-notice-duty","q":"An employee charge says your client used AI in promotion decisions without telling anyone. Even if the tool turns out to be fair, what exposure remains?","options":["Failing to notify workers of AI use is itself a violation of the amended Human Rights Act","None — notice matters only where discrimination is proven","Only contract damages owed to the software vendor"],"answer":"Failing to notify workers of AI use is itself a violation of the amended Human Rights Act","why":"The nearest confusable is (b): HB 3773 makes the notice duty freestanding — a silent deployment violates the act even absent any discriminatory outcome. The vendor relationship (c) is irrelevant to the civil-rights charge.","citation":"Illinois General Assembly — HB 3773 (P.A. 103-0804)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-il-n02","kind":"defend","territory":"map-us-il","roles":["*"],"area":"II.B","fact":"il-bipa-private-right-of-action","q":"A demand letter arrives on behalf of thousands of workers over years of un-consented voiceprint collection in Illinois. What makes this statute uniquely dangerous to defendants?","options":["A private right of action with statutory damages per violation, no proof of actual harm needed","Criminal liability for company executives","Automatic revocation of the company's business license"],"answer":"A private right of action with statutory damages per violation, no proof of actual harm needed","why":"The nearest confusable is HB 3773's route — employment-AI charges there go through the IDHR administrative process, whereas BIPA lets plaintiffs sue directly for statutory damages of $1,000 per negligent and $5,000 per intentional or reckless violation, with no proof of actual harm required (Rosenbach v. Six Flags) — multiplied across a class of thousands of workers. Neither criminal liability (b) nor license loss (c) is BIPA's mechanism.","citation":"740 ILCS 14 (BIPA)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-il-c01","kind":"consolidate","territory":"map-us-il","roles":["*"],"area":"II.C","fact":"il-idhr-rules-withdrawn","q":"What is the mid-2026 status of Illinois's implementing rules for the employment-AI amendment?","options":["Proposed in May 2026, withdrawn in June — the statute applies without final regulations","Final since January 2026, alongside the statute","The statute is suspended until the rules issue"],"answer":"Proposed in May 2026, withdrawn in June — the statute applies without final regulations","why":"The nearest confusable is (c), the suspension myth: statutory duties operate regardless of the rulemaking's fate. IDHR proposed Subpart J on 2026-05-15, then temporarily withdrew it on 2026-06-02 to coordinate with other agencies — no adopted rules exist, but HB 3773 binds anyway.","citation":"IDHR proposed Subpart J rules, withdrawn 2026-06-02","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-nyc-d01","kind":"gate","territory":"map-us-nyc","roles":["deployer"],"area":"II.C","fact":"nyc-bias-audit-precondition","q":"Before your client screens New York City candidates with an automated employment decision tool, the local law's threshold requirement is:","options":["An independent bias audit completed within the past year","A conformity assessment and CE marking","Filing the algorithm with the city's consumer-affairs agency","Written consent from every candidate"],"answer":"An independent bias audit completed within the past year","why":"The nearest confusable is (d): LL144 requires candidate NOTICE, not consent — consent-before-collection is Illinois BIPA's model. CE marking (b) belongs to the EU regime, and there is no algorithm filing in NYC (c); that pattern is China's.","citation":"NYC DCWP — Automated Employment Decision Tools (Local Law 144)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-nyc-d02","kind":"gate","territory":"map-us-nyc","roles":["deployer"],"area":"II.C","fact":"nyc-audit-results-publication","q":"The bias audit for your client's hiring tool is complete. What must happen to the results?","options":["A summary must be posted publicly on the employer's website","They are filed confidentially with the enforcement agency","They go only to affected candidates on request","They must be notarized and retained internally for five years"],"answer":"A summary must be posted publicly on the employer's website","why":"The nearest confusable is (b) — confidential regulator filing is how China's algorithm-filing regime works, but LL144 chose sunlight: the summary is public. On-request or internal-only handling (c, d) both fail the publication duty.","citation":"NYC DCWP — Automated Employment Decision Tools (Local Law 144)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-nyc-d03","kind":"gate","territory":"map-us-nyc","roles":["deployer"],"area":"II.C","fact":"nyc-candidate-notice-10-days","q":"How far in advance must a New York City employer tell candidates an automated tool will assess them?","options":["Ten business days before use","At the moment the application is submitted","Within thirty days after the decision issues","Never, provided the audit summary is published"],"answer":"Ten business days before use","why":"The nearest confusable is (c) — notice AFTER the decision is the ECOA adverse-action pattern from credit law; LL144's notice is prospective. Publication of the audit (d) is a separate, parallel duty and does not substitute for individual notice.","citation":"NYC DCWP — Automated Employment Decision Tools (Local Law 144)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-nyc-d04","kind":"gate","territory":"map-us-nyc","roles":["deployer"],"area":"II.C","fact":"nyc-employer-only-scope","q":"Enforcement of the city's hiring-tool rule began 5 July 2023. Which actor does it actually bind?","options":["Employers and employment agencies using the tool — not the vendor that built it","The software vendor, as the system's provider","Vendor and employer jointly and severally","The independent auditors who review the tool"],"answer":"Employers and employment agencies using the tool — not the vendor that built it","why":"The nearest confusable is (b), the EU-style provider framing — LL144 places no duty on developers or vendors at all; the deployer-side employer carries everything. Auditors (d) are third-party service providers, not duty-bearers.","citation":"NYC DCWP — Automated Employment Decision Tools (Local Law 144)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-nyc-n01","kind":"defend","territory":"map-us-nyc","roles":["*"],"area":"II.C","fact":"nyc-per-day-penalty-accrual","q":"The city's consumer-affairs department alleges your client ran an unaudited screening tool for three months. How does the exposure accumulate?","options":["Per violation per day — each day of use is a separate violation, $500 to $1,500","One flat fine per non-compliant tool","Exposure begins only on a second offense"],"answer":"Per violation per day — each day of use is a separate violation, $500 to $1,500","why":"The nearest confusable is (b): LL144 penalties are not a one-off — each day the tool runs without a current audit is a fresh violation, so three months compounds fast. There is no first-offense grace (c); enforcement has run since 2023-07-05.","citation":"NYC DCWP — Automated Employment Decision Tools (Local Law 144)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-nyc-n02","kind":"defend","territory":"map-us-nyc","roles":["*"],"area":"II.C","fact":"nyc-audit-independence-currency","q":"To answer a city inquiry, your client offers a review of its hiring tool that the vendor ran itself two years ago. Name the two defects.","options":["It is not independent, and it is older than the one-year currency window","It was not notarized and not filed with the state","Only the vendor's own review is acceptable, so the age is the sole problem"],"answer":"It is not independent, and it is older than the one-year currency window","why":"The nearest confusable is (c), which inverts the independence rule — the auditor must NOT be someone involved in developing or using the tool, so a vendor self-review fails per se. LL144 has no notarization or state-filing mechanics (b).","citation":"NYC DCWP — Automated Employment Decision Tools (Local Law 144)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-nyc-c01","kind":"consolidate","territory":"map-us-nyc","roles":["*"],"area":"II.C","fact":"nyc-comptroller-enforcement-audit","q":"A December 2025 state review examined how the city polices its hiring-tool rule. What did it find, and what should compliance teams infer for 2026?","options":["Enforcement was called ineffective; the agency accepted the recommendations, so scrutiny is expected to tighten","The rule was found unconstitutional and struck down","It found near-universal employer compliance, so risk is falling"],"answer":"Enforcement was called ineffective; the agency accepted the recommendations, so scrutiny is expected to tighten","why":"The nearest confusable is (b) — no court touched LL144; this was the NYS Comptroller's performance audit of DCWP (2025-12-02). Weak past enforcement plus accepted recommendations signals MORE enforcement ahead, the opposite of (c)'s complacency read.","citation":"NYS Comptroller — LL144 enforcement audit 2025-12-02","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-nyc-c02","kind":"consolidate","territory":"map-us-nyc","roles":["*"],"area":"II.C","fact":"ny-raise-act-separate-regime","q":"Your client conflates the city hiring rule with New York State's new AI law signed in December 2025. Set them straight.","options":["The state law targets frontier-model safety — a separate regime that leaves the city ordinance untouched","The state law replaced the city ordinance on signing","They are the same statute at different procedural stages"],"answer":"The state law targets frontier-model safety — a separate regime that leaves the city ordinance untouched","why":"The nearest confusable is (b), the preemption assumption — the RAISE Act (signed 2025-12-19) regulates frontier-model developers at state level and does not displace LL144's employer-side hiring duties. Different duty-bearers, different subject matter.","citation":"NY RAISE Act (signed 2025-12-19)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-usca-p01","kind":"gate","territory":"map-us-ca","roles":["provider"],"area":"II.C","fact":"usca-sb942-provenance-duties","q":"Your client runs a generative service with two million monthly California visitors. As of today, 2 August 2026, the state's AI transparency act requires it to offer:","options":["A free public AI-detection tool plus manifest and latent disclosures in AI-generated content","Publication of a high-level training-data summary","An annual independent bias audit with a posted summary","Age verification before any content generation"],"answer":"A free public AI-detection tool plus manifest and latent disclosures in AI-generated content","why":"The nearest confusable is (b) — the training-data summary is AB 2013's separate duty, not SB 942's. SB 942 became operative today (2026-08-02, after the AB 853 delay) for covered providers over one million monthly visitors or users; the bias audit (c) is NYC's mechanism.","citation":"California SB 942 (as amended by AB 853, 2025-10-13)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-usca-p02","kind":"gate","territory":"map-us-ca","roles":["provider"],"area":"II.C","fact":"usca-ab853-delay","q":"Compliance was planned around a 1 January 2026 start for California's provenance law. What actually happened to that date?","options":["An amendment moved the operative date to 2 August 2026, with large-platform duties following in 2027","The law was repealed and replaced with a narrower one","It took effect on schedule at the start of the year","A court enjoined it indefinitely"],"answer":"An amendment moved the operative date to 2 August 2026, with large-platform duties following in 2027","why":"The nearest confusable is (b) — repeal-and-replace is Colorado's story; California merely DELAYED via AB 853 (chaptered 2025-10-13). No court has enjoined SB 942 (d). The lesson is date-churn: track amendments, not just enactments.","citation":"California SB 942 (as amended by AB 853, 2025-10-13)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-usca-p03","kind":"gate","territory":"map-us-ca","roles":["provider"],"area":"II.C","fact":"usca-ab2013-training-data","q":"Since January 2026, what must a generative-AI developer publish about the data behind any system offered to Californians?","options":["High-level documentation of the datasets used to train the system","The full training corpus, on request from any user","Nothing, unless the system is classed high-risk","Only records of data purchased from third parties"],"answer":"High-level documentation of the datasets used to train the system","why":"The nearest confusable is (b), which overreads AB 2013 — the duty is a high-level summary (sources, types, copyright/personal-data flags), never corpus disclosure. Option (c) imports EU risk-tier gating; AB 2013 applies without any risk classification.","citation":"California AB 2013 (eff. 2026-01-01)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-usca-d01","kind":"gate","territory":"map-us-ca","roles":["deployer"],"area":"II.C","fact":"usca-admt-rights","q":"A Californian asks to opt out of your client's automated tool that decides loan approvals. Which regime governs, and what does it grant?","options":["The CCPA ADMT regulations — notice, opt-out and access rights around significant decisions","The AI transparency act's detection-tool duties","The civil-rights agency's employment rules","A federal ADMT preemption framework"],"answer":"The CCPA ADMT regulations — notice, opt-out and access rights around significant decisions","why":"The nearest confusable is (c) — the CRD's FEHA rules also reach automated decisions but only in EMPLOYMENT; lending is a 'significant decision' under the CPPA's ADMT regulations. No federal ADMT framework exists (d), and SB 942 (b) is about content provenance, not decisions.","citation":"CPPA — Final ADMT regulations (eff. 2026-01-01)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-usca-d02","kind":"gate","territory":"map-us-ca","roles":["deployer"],"area":"II.C","fact":"usca-bot-disclosure","q":"Your client's sales chatbot converses with California consumers without ever saying it is software. Where is the exposure?","options":["The bot-disclosure law — bots used to sell must clearly reveal they are not human","The provenance act's latent-disclosure duties","Nowhere; conversational identity is unregulated in the state","The intent-based manipulation ban in the state AI act"],"answer":"The bot-disclosure law — bots used to sell must clearly reveal they are not human","why":"The nearest confusable is (b): SB 942 marks AI-GENERATED CONTENT, while SB 1001 governs conversational identity when a bot incentivizes a sale or influences a vote — different disclosure objects. Option (d) describes Texas TRAIGA, the wrong state.","citation":"California SB 1001 (B.O.T. Act)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-usca-d03","kind":"gate","territory":"map-us-ca","roles":["deployer"],"area":"II.B","fact":"usca-feha-ads-rules","q":"An employer uses an algorithmic ranking system for California hires. Since October 2025, which body's rules directly govern discrimination risk from that system?","options":["The Civil Rights Department's FEHA automated-decision employment rules","The privacy agency's ADMT regulations alone","New York City's consumer-affairs department","None — California employment AI awaits a 2027 statute"],"answer":"The Civil Rights Department's FEHA automated-decision employment rules","why":"The nearest confusable is (b) — the CPPA's ADMT regs also touch employment decisions, but the DISCRIMINATION question runs through the CRD's FEHA rules (effective 2025-10-01). Option (d) is false: those rules are already in force, no waiting period.","citation":"CRD — FEHA automated-decision regulations (eff. 2025-10-01)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-usca-n01","kind":"defend","territory":"map-us-ca","roles":["*"],"area":"II.C","fact":"usca-admt-phase-in","q":"A wave of opt-out and access requests hits your client's decisioning tool after a viral privacy post. Counsel asks what the timeline actually demands. Your answer:","options":["Build the opt-out and access machinery now — the rules took effect in 2026, with significant-decision compliance due by 1 January 2027","Ignore them; nothing is in force until 2028","Honor them only for fully autonomous decisions with no human involvement"],"answer":"Build the op
