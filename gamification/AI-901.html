 throughput quota can be reallocated between deployments (the exam's documented scenario); PTU and Standard describe the deployment's billing/reservation model, not its quota dial."},{"id":"pd-020","label":"The dial that sets an upper bound on total throughput a deployment can process each minute, independent of any single response's length","answer":"Capacity (TPM)","options":["Capacity (TPM)","max_tokens","PTU deployment"],"why":"Capacity (TPM) throttles at the deployment level across all requests measured in tokens per minute; max_tokens instead caps the length of one response and has nothing to do with rate limiting."},{"id":"pd-021","label":"The banner image request keeps returning a small square when the layout needs a wide rectangular canvas","answer":"size","options":["size","quality","n"],"why":"size sets the pixel dimensions (e.g. a wide format instead of 1024x1024); quality controls rendering fidelity and n controls image count — neither changes the canvas shape."},{"id":"pd-022","label":"The request field that sets the pixel dimensions of the generated image, such as 1024×1024","answer":"size","options":["size","quality","partial_images"],"why":"size is the dimensions field in the images/generations payload; quality instead governs rendering fidelity, and partial_images controls progressive streaming, not the final canvas dimensions."},{"id":"pd-023","label":"The field that accepts the 'high' fidelity tier so fine detail renders more crisply, separate from how big the image is","answer":"quality","options":["quality","size","n"],"why":"quality (including the documented 'high' trap value) controls rendering fidelity; size controls dimensions and n controls how many images come back — three independent dials on the same request."},{"id":"pd-024","label":"One prompt should return four separate image variations to choose between, in a single request","answer":"n","options":["n","size","quality"],"why":"n sets how many images the request returns (e.g. n=4); size and quality shape each individual image but do not change how many come back."},{"id":"pd-025","label":"The parameter that sets how many image variations a single images/generations call returns","answer":"n","options":["n","partial_images","size"],"why":"n is the image-count field; partial_images instead streams progressive previews of a single image as it renders, and size only sets that image's dimensions."},{"id":"pd-026","label":"Combined with streaming, this field sets how many progressive preview frames are sent before the final image completes","answer":"partial_images","options":["partial_images","n","quality"],"why":"partial_images (used together with stream=True) sets the count of progressive preview frames during rendering; n instead sets how many separate final images are returned, and quality sets fidelity, not preview cadence."}]},"decks/microsoft/rai-pairs.json":{"id":"rai-pairs","runner":"pairs","title":"Principle Splitters","blurb":"Two near-identical situations, one flipped fact — name the principle each one illustrates.","source":"histack.net principle table","asOf":"2026-07","area":"microsoft-rai","pairs":[{"id":"rp-01","dimension":"whether the harm is biased outcomes or blocked access","buckets":["Fairness","Inclusiveness"],"a":{"text":"A hiring model shortlists far fewer candidates from one demographic group despite equal qualifications.","answer":"Fairness","why":"Unequal outcomes across groups is fairness — fixed with balanced training data and fairness assessments."},"b":{"text":"The same hiring portal's AI screening works only by voice, so deaf candidates cannot complete it at all.","answer":"Inclusiveness","why":"Nobody is scored unfairly — some users are locked out. Multiple interaction methods and accessibility are inclusiveness."}},{"id":"rp-02","dimension":"whether the gap traces to underrepresented training data or to a single required interaction method","buckets":["Fairness","Inclusiveness"],"a":{"text":"A retailer's shoplifting-detection camera system, trained mostly on images of one demographic group, flags people from other groups at a much higher rate.","answer":"Fairness","why":"An accuracy gap traceable to underrepresented training data across demographic groups is fairness — representative, balanced training data is the fix."},"b":{"text":"The same retailer's self-checkout assistant accepts only spoken commands, so customers who cannot speak or hear clearly cannot use it at all.","answer":"Inclusiveness","why":"No group is scored worse here — an entire set of users is shut out by relying on one interaction method. That access gap is inclusiveness, not a scoring problem."}},{"id":"rp-03","dimension":"disclosing how the system works vs owning its outcomes","buckets":["Transparency","Accountability"],"a":{"text":"The bank publishes a model card explaining the credit model's capabilities and known limitations.","answer":"Transparency","why":"Communicating capabilities AND limitations — model cards, transparency notes — is transparency."},"b":{"text":"The bank keeps audit logs of every AI credit decision and names the officer who signs off on overrides.","answer":"Accountability","why":"Human oversight, governance and a reviewable record of who is answerable is accountability."}},{"id":"rp-04","dimension":"explaining one already-made decision vs assigning who owns it if it goes wrong","buckets":["Transparency","Accountability"],"a":{"text":"When a patient's insurance claim is denied by a triage model, the care team can point to the specific factors that drove that particular denial.","answer":"Transparency","why":"Explaining the specific reasons behind one already-made decision, to the person it affected, is transparency."},"b":{"text":"The hospital defines who is responsible for reviewing a denial and escalating it if the triage model's decision turns out to be wrong.","answer":"Accountability","why":"Assigning ownership and an escalation path for when things go wrong is accountability — who answers for the outcome, not what gets disclosed."}},{"id":"rp-05","dimension":"protecting the data vs disclosing the behavior","buckets":["Privacy & security","Transparency"],"a":{"text":"The support bot is configured so customer PII never appears in responses or logs.","answer":"Privacy & security","why":"PII governance, data protection and access control map to privacy & security."},"b":{"text":"The support bot opens every session stating it is an AI and listing what it can and cannot help with.","answer":"Transparency","why":"Disclosing what the system is and its limits is transparency — a different obligation from protecting data."}},{"id":"rp-06","dimension":"communicating limitations vs behaving safely under adverse input","buckets":["Transparency","Reliability & safety"],"a":{"text":"Release notes state the summarizer performs poorly on legal documents so users can judge when to trust it.","answer":"Transparency","why":"Stating limitations up front is transparency, even though it feels safety-adjacent."},"b":{"text":"The summarizer is stress-tested with adversarial prompts and refuses to produce harmful content under them.","answer":"Reliability & safety","why":"Consistent, tested, safe behavior under risky prompts — content filters and model evaluation — is reliability & safety."}},{"id":"rp-07","dimension":"whether the risk is harmful output behavior or exposure of personal data","buckets":["Reliability & safety","Privacy & security"],"a":{"text":"A content-moderation service must resist adversarial prompts that try to make it generate violent instructions.","answer":"Reliability & safety","why":"Resisting adversarial prompts to keep output from turning harmful is tested, consistent system behavior — reliability & safety."},"b":{"text":"The same service must keep customer phone numbers typed into chat messages from ever appearing in stored logs.","answer":"Privacy & security","why":"Keeping personal data out of storage and logs is data protection — a different concern from how the model behaves under attack."}},{"id":"rp-08","dimension":"whether the gap is about who can use the system or what users are told about it","buckets":["Inclusiveness","Transparency"],"a":{"text":"A financial-advice chatbot adds screen-reader-compatible output and keyboard-only navigation so people with visual or motor impairments can complete a session end to end.","answer":"Inclusiveness","why":"Removing barriers so people with different abilities can use the product at all is inclusiveness."},"b":{"text":"The same chatbot opens every session stating it is an automated assistant and listing the topics it is not qualified to advise on.","answer":"Transparency","why":"Disclosing that the system is AI and stating its limits is a different obligation from making the interface usable to everyone."}}]},"decks/microsoft/workload-pairs.json":{"id":"workload-pairs","runner":"pairs","title":"Separated at Birth","blurb":"Two capabilities that sound identical until one fact flips — learn to hear the difference the exam listens for.","source":"histack.net","asOf":"2026-07","area":"microsoft-workloads","pairs":[{"id":"wp-01","dimension":"identifying what is mentioned vs scoring the opinion about it","buckets":["Entity recognition","Sentiment analysis"],"a":{"text":"From support tickets, list every product name, person, and date mentioned.","answer":"Entity recognition","why":"Entities identify who/what is mentioned — people, dates, organizations (histack: 'categorizes specific things')."},"b":{"text":"From the same tickets, determine whether customers feel positive, negative, or neutral.","answer":"Sentiment analysis","why":"Opinion polarity is sentiment — the exam's #1 confused pair (17 co-occurrences)."}},{"id":"wp-02","dimension":"which direction the audio conversion runs","buckets":["Speech recognition","Speech synthesis"],"a":{"text":"Transcribe a call-center recording so agents can search the conversation.","answer":"Speech recognition","why":"Audio in, text out — recognition. 'Transcribe' is the giveaway verb."},"b":{"text":"A navigation app reads turn-by-turn directions aloud with the en-US-Ava neural voice.","answer":"Speech synthesis","why":"Text in, audio out — synthesis. SSML and voice names like en-US-Ava:DragonHDLatestNeural belong to synthesis only."}},{"id":"wp-03","dimension":"crossing languages vs staying in the same language","buckets":["Speech translation","Speech recognition"],"a":{"text":"A conference app listens to a French speaker and produces live English captions for the audience.","answer":"Speech translation","why":"Recognizing speech in one language and rendering it in another is translation — the exam's tell for this pair (audio-in, different-language-out)."},"b":{"text":"The same app also produces same-language French captions for a hearing-impaired attendee in the front row.","answer":"Speech recognition","why":"Audio in, same-language text out is plain speech-to-text; no language crosses, so there is nothing to translate."}},{"id":"wp-04","dimension":"reading literal text vs describing the scene","buckets":["OCR","Image captioning"],"a":{"text":"Extract the serial number printed on a photographed equipment label.","answer":"OCR","why":"OCR/Read extracts the literal text present in the image — 'extract readable text from an image' is the exam stem."},"b":{"text":"Generate a one-sentence natural-language description of what the photo shows.","answer":"Image captioning","why":"Captioning (VisualFeatures.CAPTION) describes the scene — it does not read text within it."}},{"id":"wp-05","dimension":"reading pixels into text vs turning a text prompt into pixels","buckets":["OCR","Image generation"],"a":{"text":"A scanning app reads the printed address block off a photographed envelope into structured text fields.","answer":"OCR","why":"OCR converts existing pixels into text — the input is an image, the output is text."},"b":{"text":"A design tool takes the prompt 'a flat icon of a blue rocket' and produces a brand-new PNG that never existed before.","answer":"Image generation","why":"Image generation (client.images.generate with gpt-image-1 / DALL·E) runs the opposite direction — text prompt in, synthesized pixels out — the exam's direction-flip trap on this pair."}},{"id":"wp-06","dimension":"one label for the whole image vs a located box per object","buckets":["Image classification","Object detection"],"a":{"text":"Decide whether each uploaded photo is 'defective part' or 'good part'.","answer":"Image classification","why":"Classification assigns one label to the entire image."},"b":{"text":"Mark where every part sits on the conveyor image with bounding boxes.","answer":"Object detection","why":"Bounding boxes per object is the exam's tell for detection — the classic vision confusion."}},{"id":"wp-07","dimension":"a list of terms vs new condensed sentences","buckets":["Key phrase extraction","Summarization"],"a":{"text":"Return ['pricing', 'battery life', 'customer support'] from a batch of reviews.","answer":"Key phrase extraction","why":"Key phrases return a list of important terms — no new prose is written."},"b":{"text":"Condense the same reviews into three fresh sentences capturing the overall feedback.","answer":"Summarization","why":"Summarization writes new condensed sentences — the output-shape contrast the corpus tests (pair #14)."}},{"id":"wp-08","dimension":"a dedicated privacy filter vs general-purpose entity extraction","buckets":["PII detection","Entity recognition"],"a":{"text":"A lightweight app must find and redact every email address and phone number in customer messages before storing them.","answer":"PII detection","why":"PII detection is the dedicated capability that identifies and can redact sensitive personal data such as phone numbers and email addresses (the exam calls it 'the most direct privacy-focused capability')."},"b":{"text":"The same app also tags every person, organization, and location mentioned in the messages for a searchable index.","answer":"Entity recognition","why":"Entity recognition is broader extraction across categories — people, places, organizations — not the dedicated redaction-focused feature PII detection is."}},{"id":"wp-09","dimension":"labeling who spoke vs producing spoken audio","buckets":["Speaker diarization","Speech synthesis"],"a":{"text":"A meeting transcript must attribute each section of the recorded audio to the correct participant.","answer":"Speaker diarization","why":"Diarization identifies and separates speakers within incoming audio, labeling who spoke each portion of the transcript (the exam calls it 'audio speaker attribution')."},"b":{"text":"Once the transcript is finalized, a narrator voice reads the meeting summary aloud for a podcast feed.","answer":"Speech synthesis","why":"Synthesis converts text into human-like voice output — the opposite pipeline stage from diarizing existing audio."}},{"id":"wp-10","dimension":"converting speech within/into audio vs converting written text between languages","buckets":["Azure AI Speech","Azure AI Translator"],"a":{"text":"A developer needs live audio captioning of a video conference in real time, same language, for hearing-impaired participants.","answer":"Azure AI Speech","why":"Azure AI Speech provides the real-time speech-to-text pipeline for live audio — the standard service for captioning, distinct from cross-language text conversion."},"b":{"text":"A retailer needs to convert written product descriptions from English into 20 other languages as text.","answer":"Azure AI Translator","why":"Azure AI Translator provides neural machine translation between languages for text — the exam's contrast is audio-pipeline service vs cross-language text service, not a workload overlap (pair #29)."}}]},"decks/microsoft/foundry-traps.json":{"id":"foundry-traps","runner":"pairs","title":"The Planted Answer","blurb":"The wrong answers Microsoft planted for Domain 2 — twin scenarios that differ by the exact fact the exam flips.","source":"histack.net traps 1–7","asOf":"2026-07","area":"microsoft-foundry","pairs":[{"id":"ft-01","dimension":"governance container vs the workspace where you build","buckets":["Hub","Project"],"a":{"text":"The platform team needs one place to manage shared security, connections, compute and quota for all AI teams.","answer":"Hub","why":"The hub is the top-level collaboration and governance container with shared resources — histack trap #3."},"b":{"text":"A product team needs the place where their deployments, agents, data and evaluations actually live.","answer":"Project","why":"A project lives inside a hub and is where you actually build — deployments, agents, data, evaluations."}},{"id":"ft-02","dimension":"the name your code calls vs the base model family","buckets":["Deployment name","Model name"],"a":{"text":"Your code passes 'chat-app-prod' — the custom name chosen at deploy time — as the model argument in chat.completions.create.","answer":"Deployment name","why":"The deployment name — not the base model name — is what your code calls (histack's exact trap; corpus pair #19)."},"b":{"text":"The Foundry catalog lists gpt-4o with its benchmark scores before anything is deployed.","answer":"Model name","why":"gpt-4o is the base model id in the catalog; it becomes callable only through a named deployment."}},{"id":"ft-03","dimension":"the resource address you connect to vs the secret that authenticates the call","buckets":["Endpoint","API key"],"a":{"text":"A developer configures the client with the Foundry resource's HTTPS address, read from an environment variable, so every request knows which resource on Azure to reach.","answer":"Endpoint","why":"The endpoint (azure_endpoint) is the resource address the SDK targets — it identifies where the call is sent, not who is allowed to send it."},"b":{"text":"A developer moves a secret out of the source file into a separate environment variable, so the credential that proves the caller's identity is never hard-coded.","answer":"API key","why":"The credential is passed as api_key (os.getenv('AZURE_OPENAI_KEY')) and authenticates the caller — a privacy-and-security habit distinct from routing."}},{"id":"ft-04","dimension":"a stateful, tool-using resource vs a single stateless completion request","buckets":["Agent","Chat call"],"a":{"text":"A Foundry resource is created once with a name, instructions and attached tools, then referenced across many later turns by follow-up requests using the same conversation.","answer":"Agent","why":"An agent is a persistent, named resource — created via PromptAgentDefinition with instructions and tools, then invoked repeatedly."},"b":{"text":"A script sends messages=[{'role': 'user', 'content': 'Summarize this case.'}] and gets one reply back from a plain completions request, with nothing saved on the server and no thread or tools involved.","answer":"Chat call","why":"A bare chat.completions.create is a single stateless request — no persisted instructions, tools or identity survive between calls."}},{"id":"ft-05","dimension":"where behavioral rules belong in the message stack","buckets":["System prompt","User prompt"],"a":{"text":"'Always return customer details in a fixed JSON shape and only answer HR-policy questions' — a persistent rule for every turn.","answer":"System prompt","why":"Persona, tone, rules and guardrails belong in the system prompt — histack's 'single most-tested distinction'; the planted wrong answer puts behavior in the user prompt or deployment settings."},"b":{"text":"'Summarize this quarter's absence report for me' — one request, this turn only.","answer":"User prompt","why":"The user prompt carries this turn's request; prior model replies replayed for memory are assistant messages."}},{"id":"ft-06","dimension":"testing in the portal with no code vs the programmatic path your app ships with","buckets":["Playground","SDK code"],"a":{"text":"After deploying a model, a developer types a prompt directly into the Foundry portal and reads the reply on screen without writing a single line of Python.","answer":"Playground","why":"The playground is Foundry's on-demand, no-code environment for rapid prototyping and validation before any production code exists."},"b":{"text":"The same developer copies the Code tab's snippet, which constructs an AzureOpenAI client and calls chat.completions.create from a Python file the app will actually run.","answer":"SDK code","why":"The Code tab hands you the programmatic access pattern — the SDK call is what ships, not the portal session that validated it."}},{"id":"ft-07","dimension":"the behavioral rules an agent follows vs the capabilities it can invoke","buckets":["Agent instructions","Tools"],"a":{"text":"A prompt agent is configured so it always responds in a formal tone and refuses to discuss competitor pricing, no matter what the user asks.","answer":"Agent instructions","why":"Persona and behavioral rules supplied to PromptAgentDefinition are instructions — they shape how the agent responds, not what it can do."},"b":{"text":"The same agent is given web search and file search so it can look up live information instead of relying only on what it already knows.","answer":"Tools","why":"Web search and file search are attached from the Build > Tools catalog — capabilities the agent can invoke, separate from its instructions."}},{"id":"ft-08","dimension":"changing model weights vs injecting current data at inference","buckets":["Fine-tuning","RAG / grounding"],"a":{"text":"The model must always answer in your firm's house style, learned from 5,000 past examples.","answer":"Fine-tuning","why":"Fine-tuning retrains weights on examples — the tool for durable style/behavior change."},"b":{"text":"The model must answer from this month's price list, which changes weekly, without retraining.","answer":"RAG / grounding","why":"RAG injects retrieved current org data at inference — 'feeding the model your own data so answers stay accurate'."}},{"id":"ft-09","dimension":"reserved hourly capacity vs pay-per-token elastic pricing","buckets":["Provisioned throughput (PTU)","Standard deployment"],"a":{"text":"A batch workload needs a predictable, guaranteed processing rate at a fixed hourly cost, reserved in advance regardless of how many tokens are actually sent.","answer":"Provisioned throughput (PTU)","why":"PTU reserves dedicated hourly capacity for predictable, high-volume throughput — you pay for the reservation, not per token."},"b":{"text":"An interactive chat app has unpredictable traffic and needs pay-per-token billing with regional, data zone, or global processing options, rather than hourly reserved capacity.","answer":"Standard deployment","why":"Standard deployment is the preferred option offering the widest range of capabilities and elastic pay-per-token pricing — the exam's most-tested deployment contrast (pair #27)."}},{"id":"ft-10","dimension":"defining the analyzer vs running it","buckets":["begin_create_analyzer","begin_analyze"],"a":{"text":"You have written a custom field schema for supplier contracts and must register it before any document is processed.","answer":"begin_create_analyzer","why":"Creating/defining the analyzer from a field schema is setup, not execution."},"b":{"text":"The analyzer already exists; the code runs it against a contract URL and polls for the structured result.","answer":"begin_analyze","why":"Execution is begin_analyze(analyzer_id=…, inputs=[AnalysisInput(url=…)]) — the close-method-name swap the corpus documents (pair #26)."}},{"id":"ft-11","dimension":"multimodal LLM-reasoned extraction vs deterministic known-form extraction","buckets":["Content Understanding","Document Intelligence"],"a":{"text":"Describe the fields you want in natural language and extract them from a mix of PDFs, images and meeting audio into structured JSON.","answer":"Content Understanding","why":"CU lets you describe fields in natural language while an LLM reasons over multimodal input — histack's cue: 'free-form or non-document input'."},"b":{"text":"Extract totals from a high volume of standard invoices and receipts using a ready-made model.","answer":"Document Intelligence","why":"Deterministic extraction from known form types — invoices, receipts, IDs, business cards. 'The extraction trap', histack's favorite."}},{"id":"ft-12","dimension":"pulling structured fields out of raw content vs indexing content for later retrieval","buckets":["Content Understanding","Azure AI Search"],"a":{"text":"A retail team sends shelf photos in and gets back structured product fields such as name, price and quantity, defined by their own schema.","answer":"Content Understanding","why":"Content Understanding turns raw, unstructured or multimodal input into the specific structured output a schema asks for."},"b":{"text":"A RAG chatbot needs a knowledge base it can query by semantic similarity so a chat model can ground its answers in the retrieved passages.","answer":"Azure AI Search","why":"Azure AI Search indexes content — often via embeddings — and retrieves it at query time; RAG patterns pair a chat model with AI Search for grounding, a different job from extracting fields from a document."}}]},"decks/microsoft/prompt-roles.json":{"id":"prompt-roles","runner":"board","title":"Sorting the Mail","blurb":"Every message in a chat belongs to exactly one role — misfile one and the exam's favourite trap gets you.","source":"histack.net trap #7","asOf":"2026-07","area":"microsoft-foundry","hint":"Ask two questions: does this apply to every turn or just this one (persistent vs one-off)? And who is speaking — the developer setting up the assistant, the person typing right now, or the model's own prior reply being resent for memory?","note":"Instruction-shaped wording is not proof of a system prompt — a one-off task can sound like a command and still be a user message. Persistence across turns is the real test.","traps":["Behavioral instructions placed in the user prompt or deployment settings are the planted wrong answer — rules belong in the system prompt."],"zones":[{"key":"System prompt","name":"System prompt","def":"Persona, tone, rules and guardrails — persistent across every turn"},{"key":"User prompt","name":"User prompt","def":"This turn's actual request"},{"key":"Assistant message","name":"Assistant message","def":"Prior model replies replayed for conversational memory"}],"items":[{"id":"pr-001","label":"\"You are a formal HR assistant. Only answer questions about HR policy.\"","answer":"System prompt","why":"Persona plus scope guardrails — histack's verbatim example of system-prompt content."},{"id":"pr-002","label":"\"Always return customer details in a fixed JSON shape.\"","answer":"System prompt","why":"Output-format rules persist across turns — the exam material states verbatim that JSON-shape instructions belong in the system prompt."},{"id":"pr-003","label":"\"How many vacation days do I have left this year?\"","answer":"User prompt","why":"This turn's actual request — no rules, no persona, just the ask."},{"id":"pr-004","label":"\"You have 12 vacation days remaining.\" — replayed into the next request for context","answer":"Assistant message","why":"Prior model replies are resent as assistant messages so the model has conversational memory; they are never user content."},{"id":"pr-005","label":"\"Summarize the attached meeting notes in three bullet points.\"","answer":"User prompt","why":"A one-off task for this turn — it sounds like an instruction, but it is not a persistent rule, so it is user, not system."},{"id":"pr-006","label":"\"If a request falls outside HR policy, say so instead of guessing.\"","answer":"System prompt","why":"A fallback rule for handling out-of-scope requests, applied every turn — the exam's verbatim 'good addition to the system prompt' pattern, distinct from pr-001's persona/scope pair."},{"id":"pr-007","label":"\"Keep replies to two sentences unless the customer asks for more detail.\"","answer":"System prompt","why":"A tone/length rule that applies to the whole conversation is a system-prompt signal distinct from a format rule (pr-002) or a scope rule (pr-001) — this one governs verbosity."},{"id":"pr-008","label":"\"Refuse to discuss competitor pricing, even if the customer insists.\"","answer":"System prompt","why":"A safety/topic-restriction guardrail meant to survive user pushback for every turn — the exam notes system messages carry app-specific restrictions beyond platform content filters."},{"id":"pr-009","label":"\"Cancel my 3pm meeting and let the team know.\"","answer":"User prompt","why":"Reads as a command, but it is a single request scoped to right now — the trap is mistaking instruction-shaped phrasing for a persistent rule."},{"id":"pr-010","label":"\"From now on, always answer in French.\" — typed by the customer mid-chat","answer":"User prompt","why":"'From now on' sounds persistent, but who is speaking still decides the role: a request typed into the chat by the customer is a user message, even one asking for standing behavior — persistence lives in the system prompt, not in user wording."},{"id":"pr-011","label":"\"Compare these two contract clauses and flag any conflicts.\"","answer":"User prompt","why":"A specific analytical task submitted for this exchange — no persona or app-wide rule is being set, so it is this turn's request."},{"id":"pr-012","label":"\"Based on your account, your subscription renews on the 14th.\" — sent back on the next turn so the model remembers what it already told the customer","answer":"Assistant message","why":"Model-generated output resent to preserve context is an assistant message, not the customer's words — the trap is mistaking replayed model output for something the user said."},{"id":"pr-013","label":"\"{\\\"status\\\": \\\"resolved\\\", \\\"ticket_id\\\": \\\"48213\\\"}\" — the model's structured reply from the previous turn, carried forward as history","answer":"Assistant message","why":"JSON-shaped content looks like the format rule from pr-002, but a rule and an instance of the model's own output are different roles — this is the model's answer being replayed, not a standing instruction."},{"id":"pr-014","label":"\"Would you like me to also check flights for the return leg?\" — the model's own follow-up question from the previous turn, kept in context","answer":"Assistant message","why":"Question-shaped text can be mistaken for the user speaking, but this question was generated by the model itself and is resent so it remembers having asked it — the discriminator is who originated the words, not their grammatical form."},{"id":"pr-015","label":"\"Step 1: Restart the router. Step 2: Reconnect to Wi-Fi.\" — the model's troubleshooting steps from an earlier turn, replayed so it remembers what it already told the customer","answer":"Assistant message","why":"Numbered instructions look rule-like, tempting a mix-up with the system prompt, but these are the model's own prior output being carried forward for memory, not a persistent guardrail set by the developer."}]},"decks/microsoft/agent-anatomy.json":{"id":"agent-anatomy","runner":"board","title":"Anatomy of an Agent","blurb":"Instructions, model, tools, knowledge, thread, run — drop each job on the agent component that does it.","source":"AI-901 study guide Task 2.1","asOf":"2026-07","area":"microsoft-foundry","hint":"Ask which layer the job belongs to: fixed at creation (instructions), the reasoning engine itself (model), an action beyond text (tools), attached data to ground answers (knowledge), one conversation's accumulating state (thread), or the single call that produces output (run).","note":"Instructions and tools both get configured at design time — the tie-break is whether the card is a behavior rule (instructions) or an external capability the agent calls (tools). Thread and run both live at runtime — the tie-break is whether the card is the container holding messages (thread) or the invocation that produces the next message (run).","traps":["`{\"deployment\":{\"model\":AGENT_NAME}}` is the canonical wrong answer — deployments host models, agents are model + instructions + tools","Unsaved agent changes are lost on leaving the portal — save / create_version."],"zones":[{"key":"Instructions","name":"Instructions","def":"The persistent behavior, persona, and rules set when the agent is defined — not chosen per conversation."},{"key":"Model","name":"Model","def":"The deployed model — referenced by deployment name — that the agent reasons with."},{"key":"Tools","name":"Tools","def":"Functions, APIs, and other actions the agent can call beyond generating text."},{"key":"Knowledge","name":"Knowledge","def":"Files, indexes, and other data sources the agent can search to ground its answers."},{"key":"Thread","name":"Thread","def":"One ongoing conversation's runtime message history, created per session."},{"key":"Run","name":"Run","def":"The invocation that executes the agent against a thread and produces its next output."}],"items":[{"id":"ag-001","label":"\"You are a courteous support agent; escalate anything involving refunds\" — set once when the agent is created","answer":"Instructions","why":"The instructions field defines persistent behavior at creation time — the study material's most-emphasised agent concept, distinct from runtime chat state."},{"id":"ag-007","label":"The natural-language persona text supplied inside PromptAgentDefinition alongside the model name, when the agent is first defined in code","answer":"Instructions","why":"PromptAgentDefinition(model=MODEL_NAME, instructions=...) sets both fields at definition time, but only the persona text shapes how the agent behaves — the model name beside it is a separate component."},{"id":"ag-008","label":"Format every response as a numbered list capped at five items — fixed when the agent is authored, not chosen per question","answer":"Instructions","why":"A standing formatting rule baked in at authoring time is behavior, not an external action — it doesn't call anything beyond text, which is what separates it from Tools."},{"id":"ag-003","label":"The deployed gpt-4o the agent reasons with — referenced by its deployment name","answer":"Model","why":"An agent = model + instructions + tools; the model is a deployment, and {\"deployment\":{\"model\":AGENT_NAME}} is the canonical wrong answer."},{"id":"ag-009","label":"Swapping the reasoning engine from gpt-4o-mini to gpt-5-mini without touching the agent's persona or its attached tools","answer":"Model","why":"Only the deployed reasoning engine changes here; persona and tool wiring stay fixed — a clean test of whether the deployment is a separate layer from the agent's other components."},{"id":"ag-010","label":"The deployment identifier passed inside PromptAgentDefinition alongside the persona text, when the agent is first defined in code","answer":"Model","why":"Same PromptAgentDefinition() call as the persona text, but this parameter names which deployed engine the agent calls — a deployment reference, not the behavior itself."},{"id":"ag-002","label":"Allow the agent to call external functions or APIs to take actions","answer":"Tools","why":"Function calling / tools let the model act beyond text — the capability that separates an agent from a plain chat call."},{"id":"ag-011","label":"Turn on live web search so the agent can pull current information beyond what's in its training data","answer":"Tools","why":"Web search is opened from the Foundry portal's tool catalog (Build > Tools) alongside code interpreter and file search — a live external capability, not attached static content."},{"id":"ag-012","label":"Let the agent run generated code to compute a result instead of just describing the calculation steps","answer":"Tools","why":"Code execution is one of the catalog capabilities, alongside web search and file search, that lets the agent act beyond producing text — the reasoning engine itself never executes code directly."},{"id":"ag-004","label":"Grounding files and data sources the agent can search to answer from your content","answer":"Knowledge","why":"Knowledge attaches your data to the agent so answers ground in it — part of the agent anatomy the study guide names for Task 2.1."},{"id":"ag-013","label":"Connect an existing Azure AI Search index so the agent's answers cite your indexed content instead of guessing","answer":"Knowledge","why":"An attached search index is static content the agent retrieves from to ground its answers — distinct from a tool like web search, which reaches out to a live external capability instead of your own data."},{"id":"ag-014","label":"Add company policy documents for the agent to search over — configured in the Agents playground alongside its persona text and attached tools — before testing multi-turn behavior","answer":"Knowledge","why":"The Agents playground configures three distinct surfaces side by side — persona, tools, and attached documents — and this card is the attached-content one: data the agent grounds answers in, not an action it takes."},{"id":"ag-005","label":"Carries one ongoing conversation's user and assistant messages at runtime","answer":"Thread","why":"Threads/conversations hold runtime chat state — created per session by the client app, not at agent-definition time."},{"id":"ag-015","label":"openai.conversations.create() called by the client app before the first turn is sent to the agent","answer":"Thread","why":"Creating the conversation object happens before any message is sent — it opens the runtime container that later turns write into, distinct from the call that actually produces a reply."},{"id":"ag-016","label":"The single unbroken timeline of turns that lets the agent reference something the user said three questions ago, without those messages being resent by hand every time","answer":"Thread","why":"Accumulated runtime chat history is session state, not agent behavior — it grows per conversation, unlike the persona rules fixed once at definition time."},{"id":"ag-006","label":"The invocation that processes the conversation and produces the agent's next output","answer":"Run","why":"A run (openai.responses.create / create run) executes the agent against the thread — the third distinct layer: definition vs session vs invocation."},{"id":"ag-017","label":"openai.responses.create() is the call that actually sends the user's latest message and returns the agent's reply","answer":"Run","why":"This is the invocation step — it's what actually processes the conversation and produces output, distinct from openai.conversations.create(), which only opens the container the messages live in."},{"id":"ag-018","label":"The extra_body={\"agent_reference\": {...}} parameter inside that same call, telling the system which agent definition to execute against the conversation","answer":"Run","why":"agent_reference is per-invocation metadata on the responses.create() call, not a fixed agent property — the exam draws this distinction explicitly against the deployment name baked into the agent's own definition."}]},"decks/microsoft/service-selection.json":{"id":"service-selection","runner":"board","title":"One Call to Make","blurb":"Read the scenario, pick the service — or the model family — the exam wants, past the near-miss planted beside it.","source":"histack.net decision list; AI-901 study guide Tasks 1.2/2.2–2.4","asOf":"2026-07","area":"microsoft-foundry","zoneMode":"options","icons":"azure-service","hint":"Two questions decide it: what does the input look like (text, form, image, audio, video, or vectors), and does the job extract/analyze, translate, search/index, or generate? The planted option is almost always the neighbor that shares the input but does the other job.","traps":["Content Understanding extracts with a plain-language field schema over multimodal input; Document Intelligence extracts with deterministic prebuilts over documents only.","Translator is text-to-text; Azure AI Speech carries audio in or out, including speech translation.","Extraction and retrieval are different services — Content Understanding/Document Intelligence extract, Azure AI Search indexes and retrieves.","Embeddings models produce vectors; Azure AI Search stores and queries them. Neither one generates new content."],"items":[{"id":"ss-001","label":"Describe invoice fields in plain language and extract them from PDFs, photos, and call recordings into structured JSON","answer":"Azure Content Understanding","options":["Azure Content Understanding","Azure AI Document Intelligence","Azure AI Language"],"why":"Natural-language field description over multimodal input → structured JSON is Content Understanding; Document Intelligence prebuilts are deterministic and document-only."},{"id":"ss-002","label":"High-volume deterministic extraction from standard receipts and ID cards with a prebuilt model","answer":"Azure AI Document Intelligence","options":["Azure AI Document Intelligence","Azure Content Understanding","Azure AI Vision"],"why":"Known form types — invoices, receipts, IDs, business cards — are Document Intelligence prebuilt territory."},{"id":"ss-003","label":"Translate written product manuals from English text into Japanese text","answer":"Azure AI Translator","options":["Azure AI Translator","Azure AI Speech","Azure AI Language"],"why":"Translator is text-to-text; Azure Speech handles audio in/out including speech translation — a 6-count corpus confusion (pair #29)."},{"id":"ss-004","label":"Index the extracted invoice data so downstream apps can search and retrieve it","answer":"Azure AI Search","options":["Azure AI Search","Azure Content Understanding","Azure AI Document Intelligence"],"why":"CU extracts; AI Search indexes and retrieves downstream (indexer, skillset, knowledge store) — extraction and retrieval are different services (pair #22)."},{"id":"ss-005","label":"Search product descriptions by semantic similarity instead of exact keyword matching","answer":"Embeddings models","options":["Embeddings models","Chat/completion model deployment","DALL-E image generation"],"why":"Embeddings convert text into vectors for semantic comparison (text-embedding-3-large) — they retrieve and compare, they never create content (pair #18)."},{"id":"ss-006","label":"Answer free-form questions about a photo the user attaches to their chat message","answer":"Multimodal model","options":["Multimodal model","DALL-E image generation","Azure AI Vision"],"why":"Image-as-input needs a deployed multimodal model reading image content parts; image generation goes the other direction, and ImageAnalysisClient/Vision returns fixed features — a different API and endpoint (pair #23)."},{"id":"ss-007","label":"Read printed text off a photographed street sign so the app can show it back as plain text","answer":"Azure AI Vision","options":["Azure AI Vision","Azure AI Document Intelligence","Azure Content Understanding"],"why":"OCR/Read is a core Vision capability over general images; Document Intelligence targets structured form layouts, not incidental street-scene text."},{"id":"ss-008","label":"Automatically detect the source language of incoming text before translating it into English, in the same call","answer":"Azure AI Translator","options":["Azure AI Translator","Azure AI Language","Azure AI Speech"],"why":"Translator's language auto-detection runs inline as part of the translation pipeline; AI Language's Language Detection is a standalone text-analytics feature used outside a translation call."},{"id":"ss-009","label":"Train a model on your own labeled photos to tell defective parts from acceptable ones on a production line","answer":"Azure AI Custom Vision","options":["Azure AI Custom Vision","Azure AI Vision","Azure Machine Learning"],"why":"Custom Vision purpose-builds classification/detection from your own labeled images with a managed training loop; general Vision only returns its fixed prebuilt features and can't be retrained on your data."},{"id":"ss-010","label":"Match a badge-scanner photo against a roster of employee photos to confirm the person's identity","answer":"Azure AI Face","options":["Azure AI Face","Azure AI Vision","Azure AI Custom Vision"],"why":"1:1 verification and 1:N identification against enrolled faces is Face's dedicated capability; general Vision analysis has no identity-matching feature."},{"id":"ss-011","label":"Persist key phrases, sentiment, and entities pulled from a document pipeline into a store downstream apps can search","answer":"Azure AI Search","options":["Azure AI Search","Azure AI Language","Azure Content Understanding"],"why":"A skillset can call AI Language to enrich each document, but the persisted, queryable knowledge store belongs to AI Search — enrichment and retrieval are separate pipeline stages."},{"id":"ss-012","label":"Pull sentiment, key phrases, and named entities directly out of raw support-ticket text","answer":"Azure AI Language","options":["Azure AI Language","Azure AI Search","Azure Content Understanding"],"why":"Sentiment, key phrase extraction, and NER are AI Language text-analytics features; AI Search only consumes that output as an enrichment step, it doesn't produce it."},{"id":"ss-013","label":"Flag an unusual spike in a factory sensor's vibration readings as they stream in over time","answer":"Azure AI Anomaly Detector","options":["Azure AI Anomaly Detector","Azure Machine Learning","Azure AI Search"],"why":"Purpose-built univariate/multivariate anomaly detection over time-series data is Anomaly Detector's job; a general ML workspace would require you to design, train, and manage that model yourself."},{"id":"ss-014","label":"Get a transcript with timestamped speaker turns from a recorded two-person support call","answer":"Azure AI Speech","options":["Azure AI Speech","Azure AI Language","Azure Content Understanding"],"why":"Speech-to-text with speaker diarization runs directly on raw audio as a Speech capability; AI Language only works on text that's already been transcribed."},{"id":"ss-015","label":"Turn a block of written English marketing copy into narrated audio for a video voiceover","answer":"Azure AI Speech","options":["Azure AI Speech","Azure OpenAI Service","Azure AI Translator"],"why":"Neural text-to-speech synthesis is a native Speech capability; producing spoken audio from Azure OpenAI needs a separate multimodal/realtime deployment, and Translator never touches audio at all."},{"id":"ss-016","label":"Flag violent or hateful language in user-submitted chat messages before they ever reach the model","answer":"Azure AI Content Safety","options":["Azure AI Content Safety","Azure AI Language","Azure OpenAI Service"],"why":"Prompt Shields and moderation categories are Content Safety's job, applied to input and output alike; AI Language's PII detection is a privacy feature, not a harmful-content classifier."},{"id":"ss-017","label":"Blur or redact a customer's phone number and email address before a chat transcript is stored","answer":"Azure AI Language","options":["Azure AI Language","Azure AI Content Safety","Azure Content Understanding"],"why":"PII Detection and Redaction is a dedicated AI Language feature for spotting and masking personal data; Content Safety instead classifies harmful-content categories — a privacy concern, not a safety one."},{"id":"ss-018","label":"Store and query millions of already-computed embedding vectors so nearest-neighbor lookups return in milliseconds","answer":"Azure AI Search","options":["Azure AI Search","Embeddings models","Azure AI Language"],"why":"Vector search and storage at query time is AI Search's job; Embeddings models only produce the vectors in the first place, they don't index or retrieve them."},{"id":"ss-019","label":"Route a running agent's tool call out to a live weather API and feed the result back into the same conversation","answer":"Microsoft Foundry Agent Service","options":["Microsoft Foundry Agent Service","Azure OpenAI Service","Azure AI Search"],"why":"Invoking a function/custom tool mid-run against a live external API is the Agent Service's orchestration layer; a bare chat completion call has no built-in tool-invocation loop of its own."},{"id":"ss-020","label":"Attach an existing search index to a Foundry agent so its answers ground in and cite your indexed documents","answer":"Microsoft Foundry Agent Service","options":["Microsoft Foundry Agent Service","Azure AI Search","Azure OpenAI Service"],"why":"Wiring a knowledge source into an agent's grounding/citation behavior is configured on the Agent Service; the index itself just serves queries, it doesn't own the agent's persona, tools, or knowledge wiring."},{"id":"ss-021","label":"Generate a photorealistic product mockup image from a plain-English description, with no starting photo","answer":"DALL-E image generation","options":["DALL-E image generation","Multimodal model","Azure AI Vision"],"why":"Text-to-image generation is DALL-E's job; a multimodal chat model reads images as input but doesn't paint new ones, and Vision only analyzes images that already exist."},{"id":"ss-022","label":"Run a cost-sensitive assistant on a budget deployment that only ever handles short, simple requests","answer":"Small language model (Phi)","options":["Small language model (Phi)","Multimodal model","Azure OpenAI Service"],"why":"A Phi-class small language model trades some capability for a much smaller footprint and lower cost, which fits lightweight, budget-constrained requests; deploying a full frontier model for simple text is the classic over-provisioning trap."},{"id":"ss-023","label":"Let a user speak a question and hear a spoken answer back in the same low-latency turn, with no separate recognizer/synthesizer calls to wire up","answer":"Voice Live / gpt-realtime","options":["Voice Live / gpt-realtime","Azure AI Speech","Multimodal model"],"why":"gpt-realtime / Voice Live is the single low-latency speech-in, speech-out session; the Azure AI Speech distractor means wiring up the manual SpeechRecognizer→process→SpeechSynthesizer pipeline yourself, which loses on latency and integration — exactly what the realtime API replaces."},{"id":"ss-024","label":"Get the deployed model's reply back as well-formed JSON matching a schema you supply, with no extra prose around it","answer":"Chat/completion model deployment","options":["Chat/completion model deployment","Fine-tuning","Multimodal model"],"why":"Structured output is a per-call parameter on a deployed chat/completion model; fine-tuning permanently changes model weights and is unnecessary just to shape one response's format."},{"id":"ss-025","label":"Bake a company's writing style into every future response using hundreds of labeled example transcripts, so it never has to be re-prompted","answer":"Fine-tuning","options":["Fine-tuning","Chat/completion model deployment","Multimodal model"],"why":"Fine-tuning is the training pass that bakes demonstrated behavior into new weights so it persists across calls; a stock chat/completion deployment only reflects what's resent in that call's prompt, and a multimodal model changes what input types are accepted, not whether style persists without re-prompting."},{"id":"ss-026","label":"Test spoken prompts against a deployed audio-capable model directly in the Foundry chat playground, without writing any SDK code","answer":"Multimodal model","options":["Multimodal model","Voice Live / gpt-realtime","Azure AI Speech"],"why":"An audio-capable multimodal deployment can be exercised straight in the chat playground; Voice Live/gpt-realtime is the dedicated low-latency realtime session API, a separate deployment path built for continuous conversational voice."}]},"decks/microsoft/cu-modality-grid.json":{"id":"cu-modality-grid","runner":"board","title":"Right Analyzer, Right Modality","blurb":"Documents, images, audio, video — drop each extraction job on the modality Content Understanding runs it against.","source":"AI-901 study guide Task 2.4","asOf":"2026-07","area":"microsoft-foundry","hint":"Ask what the source file actually is, then check the sub line for the exact prebuilt-* analyzer id — the id itself names its modality (document/image/audio/video), and Search-suffixed ids prep output for indexing rather than change the modality.","note":"Content Understanding always extracts — it never generates or indexes. Extraction into Azure AI Search is a downstream step, not something CU does itself.","traps":["Treating Content Understanding as another name for Document Intelligence is the classic trap — Document Intelligence is the older Forms Recognizer-lineage service; Content Understanding is the newer multimodal one spanning documents, images, audio and video.","Content Understanding extracts structured content; it doesn't index it for search — that's Azure AI Search's job once CU's markdown and fields are the input."],"zones":[{"key":"Documents & forms","name":"Documents & forms","def":"PDFs, invoices, contracts and freeform paperwork Content Understanding turns into structured fields, tables and text."},{"key":"Images","name":"Images","def":"Photos, screenshots and charts Content Understanding turns into structured fields, descriptions and detected objects."},{"key":"Audio","name":"Audio","def":"Recorded speech — calls, podcasts and voicemails — Content Understanding turns into transcripts, summaries and speaker labels."},{"key":"Video","name":"Video","def":"Recorded footage Content Understanding segments, transcribes and prepares for search."}],"items":[{"id":"cu-001","label":"Analyze an invoice PDF and read the extracted vendor, total and due-date fields","sub":"prebuilt-invoice","answer":"Documents & forms","why":"prebuilt-invoice extracts structured fields from invoice documents — the exam's most-tested prebuilt analyzer (7 mentions)."},{"id":"cu-002","label":"Define your own field schema in natural language and extract those fields from contracts","sub":"custom analyzer via begin_create_analyzer","answer":"Documents & forms","why":"Custom analyzers are built from a field schema you describe — CU's plain-language field description is what separates it from Document Intelligence prebuilts."},{"id":"cu-006","label":"Return text, tables, and selection marks with document structure — no field semantics","sub":"prebuilt-layout","answer":"Documents & forms","why":"Layout extracts text, tables, selection marks and structure; Read-style OCR is text only — histack's CU Read-vs-Layout distinction."},{"id":"cu-007","label":"A mixed batch of vendor forms needs their loose key-value pairs pulled out without starting from a predefined field schema","sub":"prebuilt-documentFields","answer":"Documents & forms","why":"prebuilt-documentFields extracts general key-value pairs from documents with no domain-specific schema required — unlike prebuilt-invoice's fixed invoice fields."},{"id":"cu-008","label":"Before building a custom analyzer for a brand-new form type, ask Content Understanding to propose the field schema, then base the new analyzer on the general document analyzer","sub":"prebuilt-documentFieldSchema → prebuilt-document","answer":"Documents & forms","why":"prebuilt-documentFieldSchema proposes fields for a document type you haven't schema'd yet; prebuilt-document is the base_analyzer_id used when defining a new custom document analyzer — two distinct ids in the same custom-build workflow."},{"id":"cu-003","label":"Extract text and identified objects from photographed equipment labels","sub":"prebuilt-image","answer":"Images","why":"prebuilt-image extracts text and objects from still images through the same analyzer workflow as every other modality."},{"id":"cu-009","label":"Run the Python quickstart against a product photo and read the generated description back from the result's Summary field","sub":"prebuilt-imageSearch","answer":"Images","why":"prebuilt-imageSearch is the quickstart analyzer for descriptive image output — its result exposes a Summary field holding the natural-language description."},{"id":"cu-010","label":"Build a custom analyzer that pulls a chart's Title and ChartType fields out of a batch of dashboard screenshots","sub":"custom analyzer via base_analyzer_id=\"prebuilt-image\"","answer":"Images","why":"Custom image analyzers set base_analyzer_id to prebuilt-image before layering a field schema — the documented pattern for chart and screenshot extraction."},{"id":"cu-011","label":"Analyze shelf photos from a retail audit and return structured fields for product count, brand presence, and out-of-stock indicators","sub":"prebuilt-image","answer":"Images","why":"Content Understanding's image analyzer returns schema-defined structured fields straight from photos — the retail shelf-audit scenario the exam tests directly."},{"id":"cu-012","label":"Wire a Python client that calls begin_analyze with analyzer_id=\"prebuilt-image\" against a photo URL, then read back the detected objects from the result","sub":"prebuilt-image","answer":"Images","why":"The begin_analyze(analyzer_id=..., inputs=[AnalysisInput(url=...)]) call pattern is identical across modalities — only the analyzer id changes, and prebuilt-image is the direct (non-search) image analyzer."},{"id":"cu-004","label":"Get a transcript plus summary and speaker breakdown from recorded support calls","sub":"prebuilt-audio","answer":"Audio","why":"CU's audio analyzers return transcripts, summaries and speakers — extraction, never speech synthesis."},{"id":"cu-013","label":"Wire a lightweight Python client that calls begin_analyze with a call-recording URL to pull back a transcript and summary ready for a retrieval index","sub":"prebuilt-audioSearch","answer":"Audio","why":"prebuilt-audioSearch is the documented analyzer id in the SDK's quickstart snippet — the *Search suffix marks output prepped for indexing/RAG retrieval, unlike prebuilt-audio's direct extraction with no retrieval prep."},{"id":"cu-014","label":"Pull speaker-labeled, precisely timed transcript phrases out of a batch of podcast episodes","sub":"transcriptPhrases","answer":"Audio","why":"transcriptPhrases is the output field carrying speaker identification and timing information — a direct audio-extraction output, distinct from the analyzer id itself."},{"id":"cu-015","label":"Recognize that submitting a podcast MP3 to Content Understanding sets the contents object's kind to the same value used for video inputs","sub":"kind: \"audioVisual\"","answer":"Audio","why":"Audio-only and video inputs both use kind: \"audioVisual\" in the contents schema — a shared value that trips up anyone expecting a distinct 'audio' kind."},{"id":"cu-016","label":"Confirm that pulling a structured transcript out of a voicemail inbox is speech captured into text, never text turned into speech","answer":"Audio","why":"CU's audio analyzers transcribe existing speech into structured output — they never synthesize new spoken output; that job belongs to Azure AI Speech, not Content Understanding."},{"id":"cu-005","label":"Segment recorded training sessions and index their transcripts and visual events for search","sub":"prebuilt-videoSearch","answer":"Video","why":"Video analyzers return segments, transcripts and visual events; the *Search variants prepare content for retrieval — Azure AI Search indexes what CU extracts."},{"id":"cu-017","label":"Divide an uploaded recorded product demo into logical scene segments before any downstream processing runs","sub":"enableSegment","answer":"Video","why":"enableSegment is the analyzer schema property that splits footage into logical segments such as scenes — a video-analyzer control, not an audio or document one."},{"id":"cu-018","label":"After analyzing a marketing clip, read back a structured markdown summary of its transcript and visual content","sub":"prebuilt-videoSearch","answer":"Video","why":"prebuilt-videoSearch results expose a markdown field summarizing transcript and visual content per segment — the SDK's documented read-back field for video."},{"id":"cu-019","label":"Confirm that extracting keyframes and visual events from an uploaded recording works on footage that already exists, rather than generating new frames","answer":"Video","why":"CU's analyzers extract keyframes, transcripts and visual events from footage that already exists — they don't generate synthetic frames; that's a different category of AI service entirely."},{"id":"cu-020","label":"Wire a Python client that calls begin_analyze with analyzer_id=\"prebuilt-videoSearch\" against an uploaded MP4 URL","sub":"prebuilt-videoSearch","answer":"Video","why":"The begin_analyze(analyzer_id=\"prebuilt-videoSearch\", inputs=[AnalysisInput(url=...)]) call is the documented SDK pattern for kicking off video extraction."}]},"decks/microsoft/sdk-wiring.json":{"id":"sdk-wiring","runner":"board","title":"Read the Snippet","blurb":"What does this line do, and which identifier does it — with the close-name impostor sitting right next to it?","source":"histack.net SDK-snippet pattern","asOf":"2026-07","area":"microsoft-foundry","zoneMode":"options","traps":["SpeechConfig holds credentials and voice settings; AudioConfig picks the input/output device; neither one recognizes or synthesizes on its own.","AIProjectClient.get_openai_client() is a method call on an instance, not a class-level call — the exam's documented trap.","input_audio is a message content part for spoken INPUT; modalities+audio is a request-level setting for spoken OUTPUT — they are opposite directions on the same call.","A multimodal chat deployment reads image content parts as input; ImageAnalysisClient is a separate Vision SDK with its own endpoint and fixed feature set — different services entirely."],"items":[{"id":"sw-001","label":"Connects your code to a Foundry project using an endpoint and credential (package azure-ai-projects)","answer":"AIProjectClient","options":["AIProjectClient","get_openai_client","DefaultAzureCredential"],"why":"AIProjectClient(endpoint, credential) is the project entry point; get_openai_client() hangs off it — remove auth and this is the line that breaks."},{"id":"sw-002","label":"Sends the messages list to a deployed model and returns choices[0].message.content","answer":"chat.completions.create","options":["chat.completions.create","openai.responses.create","get_openai_client"],"why":"chat.completions.create(model=DEPLOYMENT_NAME, messages=[…]) is the chat call — and model= takes the deployment name, not the base model name (histack trap #5)."},{"id":"sw-003","label":"Holds your Speech resource key and region, and the synthesis voice name","answer":"SpeechConfig","options":["SpeechConfig","AudioConfig","SpeechSynthesizer"],"why":"SpeechConfig(key, region) is configured first (e.g. speech_synthesis_voice_name='en-US-Ava:DragonHDLatestNeural'); AudioConfig handles devices, not credentials."},{"id":"sw-004","label":"Send the user's spoken question as inline audio data inside the message content","answer":"input_audio part","options":["input_audio part","modalities+audio","SpeechRecognizer"],"why":"Spoken INPUT goes in message content parts as input_audio; the response-settings twin is the documented trap."},{"id":"sw-005","label":"Ask the model to answer with spoken audio: voice \"alloy\", format \"wav\"","answer":"modalities+audio","options":["modalities+audio","input_audio part","SpeechSynthesizer"],"why":"Spoken OUTPUT is requested via modalities=[\"text\",\"audio\"] plus audio={\"voice\":\"alloy\",\"format\":\"wav\"} on the multimodal call — the exam's exact payload."},{"id":"sw-006","label":"Include a photo (URL or base64) in a chat message so the deployed gpt-4o can describe it","answer":"image content part","options":["image content part","ImageAnalysisClient","gpt-image-1 call"],"why":"Visual input travels as image_url / base64 content parts to a multimodal deployment — not through the Vision SDK, which is a different service and endpoint (pair #23)."},{"id":"sw-007","label":"Bridges an existing project client to the OpenAI-compatible client used for Responses and Conversations calls","answer":"get_openai_client","options":["get_openai_client","AIProjectClient","chat.completions.create"],"why":"project.get_openai_client() is an instance method called on the project object; the exam's trap is calling it on the class itself instead."},{"id":"sw-008","label":"Called once, right after the project client is built, before the first Responses or Conversations request goes out","answer":"get_openai_client","options":["get_openai_client","DefaultAzureCredential","AIProjectClient"],"why":"It is the runtime bridge that hands back the OpenAI-shaped client; the credential object only authenticates the project client, it never returns a chat client."},{"id":"sw-009","label":"Passed with zero arguments as the credential= value so the app authenticates via signed-in Azure identity, no key typed anywhere","answer":"DefaultAzureCredential","options":["DefaultAzureCredential","AIProjectClient","azure-ai-projects"],"why":"DefaultAzureCredential() is the keyless Entra ID credential object; AIProjectClient is what consumes it, and azure-ai-projects is only the package name, not a runtime object."},{"id":"sw-010","label":"The object az login sets up for: the client resolves your signed-in identity from it automatically at call time, no environment API key needed","answer":"DefaultAzureCredential","options":["DefaultAzureCredential","get_openai_client","AIProjectClient"],"why":"The quickstart pairs az login with this credential object; get_openai_client only returns a chat client and has nothing to do with authentication."},{"id":"sw-011","label":"The pip package you install before writing any Foundry project client code, per the quickstart's very first setup command","answer":"azure-ai-projects","options":["azure-ai-projects","azure-ai-search","azure-ai-language"],"why":"\"Which package should you install for the project client?\" is a classic exam stem — the answer is azure-ai-projects, not the search or language SDKs."},{"id":"sw-012","label":"Listed alongside az login in the quickstart setup steps, pinned to a minimum version (>=2.0.0) before any client code runs","answer":"azure-ai-projects","options":["azure-ai-projects","azure-ai-vision","azure-ai-search"],"why":"The documented quickstart guidance installs azure-ai-projects>=2.0.0 and runs az login — the Vision and Search packages are unrelated to the project client."},{"id":"sw-013","label":"Constructed with an endpoint and an AzureKeyCredential before any key-phrase or sentiment call can run against plain text","answer":"TextAnalyticsClient","options":["TextAnalyticsClient","ContentUnderstandingClient","ImageAnalysisClient"],"why":"TextAnalyticsClient(endpoint, credential) exposes.extract_key_phrases()/.analyze_sentiment() on raw text; the other two clients target multimodal documents and images at different endpoints entirely."},{"id":"sw-014","label":"Whichever client type exposes analyze_sentiment(documents) so each document's overall sentiment gets printed back","answer":"TextAnalyticsClient","options":["TextAnalyticsClient","ContentUnderstandingClient","SpeechRecognizer"],"why":"Sentiment and key-phrase extraction are AI Language text-analytics methods on this client; the other two operate on multimodal documents or live audio, not plain text."},{"id":"sw-015","label":"Set to listen from the computer's default microphone instead of a saved file, then handed to the recognizer as its audio source","answer":"AudioConfig","options":["AudioConfig","SpeechConfig","SpeechRecognizer"],"why":"AudioConfig(use_default_microphone=True) picks the input device; SpeechConfig instead holds the subscription key/region, and SpeechRecognizer is the class this object gets passed into, not the device selector itself."},{"id":"sw-016","label":"Built from a saved filename so a recognizer reads speech from a test WAV file instead of a live microphone","answer":"AudioConfig","options":["AudioConfig","SpeechConfig","SpeechSynthesizer"],"why":"AudioConfig(filename=…) is the file-backed device source; SpeechConfig carries credentials and voice name, and SpeechSynthesizer plays audio out rather than reading it in."},{"id":"sw-017","label":"Given both a speech config and an audio config, then called to capture exactly one short spoken utterance and stop","answer":"SpeechRecognizer","options":["SpeechRecognizer","SpeechSynthesizer","AudioConfig"],"why":"This is the class whose recognize_once_async() captures a single utterance; SpeechSynthesizer instead speaks text out, and AudioConfig only wires up the input device."},{"id":"sw-018","label":"Its single-utterance async call returns a result object whose.text holds the transcript of what the microphone just heard","answer":"SpeechRecognizer","options":["SpeechRecognizer","SpeechSynthesizer","TextAnalyticsClient"],"why":"The speech-to-text class returns result.text from recognizing live audio; the synthesizer speaks instead of listens, and the Language client only ever works on text that's already been transcribed."},{"id":"sw-019","label":"Takes a speech config with the voice name already set, then turns a text string into spoken output through the speaker","answer":"SpeechSynthesizer","options":["SpeechSynthesizer","SpeechRecognizer","AudioConfig"],"why":"This class's speak_text_async() plays a string aloud using the configured voice; the recognizer instead converts speech to text, and AudioConfig only selects a device."},{"id":"sw-020","label":"After a recognizer produces a text transcript, this second object reads that same string back out loud with its own async speak call","answer":"SpeechSynthesizer","options":["SpeechSynthesizer","SpeechRecognizer","SpeechConfig"],"why":"Text-to-speech playback of the recognized reply is this class's job; the recognizer already produced the text, and SpeechConfig only stores credentials and the voice name it uses."},{"id":"sw-021","label":"Constructed with an endpoint and key, then its single call analyzes an image URL for the READ visual feature to pull text off a photo","answer":"ImageAnalysisClient","options":["ImageAnalysisClient","ContentUnderstandingClient","TextAnalyticsClient"],"why":"This Vision client's.analyze(image_url=…, visual_features=[…]) call runs OCR on general images; ContentUnderstandingClient instead returns a poller from a very different, asynchronous call shape."},{"id":"sw-022","label":"Its captioning-plus-OCR call takes the image by URL rather than raw bytes, requesting both CAPTION and READ features in one pass","answer":"ImageAnalysisClient","options":["ImageAnalysisClient","ContentUnderstandingClient","SpeechRecognizer"],"why":"This Vision client's by-URL analysis method returns fixed prebuilt features like caption and read; it has no polling step and no relation to speech capture at all."},{"id":"sw-023","label":"The client an app creates first when it will send document URLs off for extraction and read structured results back","answer":"ContentUnderstandingClient","options":["ContentUnderstandingClient","TextAnalyticsClient","ImageAnalysisClient"],"why":"\"Which client should the app create first?\" for a Content Understanding app is this class — the other two are separate services with separate endpoints for plain text and general images respectively."},{"id":"sw-024","label":"Its long-running analyze call returns a poller; calling.result() on that poller is how the app waits for the final extracted output","answer":"ContentUnderstandingClient","options":["ContentUnderstandingClient","ImageAnalysisClient","TextAnalyticsClient"],"why":"begin_analyze() plus poller.result() is this client's asynchronous polling pattern; the Vision client's analyze() is synchronous, and the Language client's methods take documents directly with no polling."},{"id":"sw-025","label":"The image-generation request whose response field b64_json holds the actual pixel data you decode, not a url field","answer":"gpt-image-1 call","options":["gpt-image-1 call","chat.completions.create","ImageAnalysisClient"],"why":"A GPT-image-1 deployment returns generated image bytes in response.data[0].b64_json; a completions call returns text choices, and the Vision client only analyzes an image that already exists."},{"id":"sw-026","label":"Set background to transparent and request PNG output on this text-to-image request to get a see-through background","answer":"gpt-image-1 call","options":["gpt-image-1 call","ImageAnalysisClient","chat.completions.create"],"why":"Transparent background plus PNG output are GPT-image-1-series generation parameters; nothing in the Vision analysis or chat-completion calls accepts them."}]},"decks/microsoft/foundry-flows.json":{"id":"foundry-flows","runner":"ladders","title":"Build Orders","blurb":"Six workflows the exam expects you to replay from memory — click each step into the only order that ships.","source":"AI-901 study guide Tasks 1.2/2.1/2.2/2.4","asOf":"2026-07","area":"microsoft-foundry","ladders":[{"id":"lad-genai","title":"How a generative model produces text","prompt":"Put the steps in the order a generative model turns your prompt into text.","steps":[{"label":"Tokenization","detail":"Input text is split into tokens — words or sub-words — each mapped to an id from the model's vocabulary; nothing downstream has meaning until this happens (Task 1.2)."},{"label":"Embeddings","detail":"Each token id is converted into a numeric vector encoding meaning — the same vector space that makes semantic similarity computable as vector distance."},{"label":"Transformer attention","detail":"Self-attention layers weigh every token against every other token in the sequence — the mechanic that 'powers most modern foundation models,' and it needs the embedding vectors to already exist."},{"label":"Next-token prediction","detail":"The model outputs a probability distribution over the whole vocabulary for the single next token; temperature and top-p reshape this distribution before one token is sampled."},{"label":"Detokenized output","detail":"The predicted token id is decoded back to text and the loop repeats one token at a time until a stop condition — perplexity measures how well this step's predictions matched held-out text."}]},{"id":"lad-chat","title":"Chat client with the Foundry SDK","prompt":"Put the code flow in the order it must run.","steps":[{"label":"Install azure-ai-projects","detail":"'Which package should you install for the project client?' is a classic exam stem — the answer is azure-ai-projects."},{"label":"Create AIProjectClient(endpoint, DefaultAzureCredential())","detail":"Endpoint + credential must both exist before any call; keyless auth = Entra ID DefaultAzureCredential."},{"label":"Call get_openai_client()","detail":"Bridges the project client to an OpenAI-compatible chat client — the line that breaks everything if removed."},{"label":"Build the messages list (system prompt first, then user prompt)","detail":"Rules and guardrails in the system message; this turn's request in the user message."},{"label":"Call chat.completions.create(model=DEPLOYMENT_NAME, messages=[...])","detail":"model= takes YOUR deployment name, never the base model name — the classic trap."},{"label":"Read response.choices[0].message.content","detail":"The reply text lives on the first choice's message — corpus snippet questions end here."}]},{"id":"lad-agent","title":"Agent lifecycle","prompt":"Put the agent's lifecycle in the order it must happen.","steps":[{"label":"Define the agent: PromptAgentDefinition(model=MODEL_NAME, instructions=..., tools=[...])","detail":"Model + instructions + tools set at definition time — {\"deployment\":{\"model\":AGENT_NAME}} is the canonical wrong answer; deployments host models, agents are model + instructions + tools."},{"label":"Test it in the Agents playground","detail":"The playground configures persona, tools, and attached knowledge side by side and lets you try multi-turn behavior before any client code calls the agent."},{"label":"Save it: project.agents.create_version(agent_name=AGENT_NAME, definition=...)","detail":"Unsaved playground edits are lost on leaving the portal — create_version is what actually persists a definition, whether you built it in the portal or in code."},{"label":"Create a thread: openai.conversations.create()","detail":"Opens the runtime container that later turns write into — called by the client app before the first message is sent, distinct from the agent's own definition."},{"label":"Add the user's message to the thread","detail":"The turn's content is appended to the thread's accumulating message history — a run can't process a message that hasn't been added yet."},{"label":"Create a run and read the output: openai.responses.create(..., extra_body={\"agent_reference\": {...}})","detail":"The invocation that actually processes the conversation and produces the agent's next output; agent_reference is per-call metadata pointing at the saved definition."}]},{"id":"lad-speech","title":"Speech SDK call order","prompt":"Put the Speech SDK calls in the order they must run.","steps":[{"label":"SpeechConfig(subscription=key, region=region)","detail":"Every Speech SDK flow starts here — the key/region (or endpoint) pair that authenticates every call that follows."},{"label":"Set speech_config.speech_synthesis_voice_name = \"...\"","detail":"Voice selection is a property set directly on the config object — exam's DragonHD-voice snippet sets this line right after SpeechConfig, before any other object is built from it."},{"label":"AudioConfig(...) — microphone, file, or default device","detail":"Built independently of the voice-name property, but quickstart snippets construct it only after config setup is finished, immediately before the recognizer/synthesizer that will consume both objects."},{"label":"Create the Recognizer or Synthesizer: SpeechRecognizer(speech_config, audio_config) / SpeechSynthesizer(speech_config)","detail":"Both constructors take the already-built speech_config (the recognizer also takes audio_config) — nothing after this point can still inject the config."},{"label":"Call recognize_once() / speak_text_async(text)","detail":"recognize_once() captures one short utterance (vs. continuous recognition); speak_text_async() actually plays the text — the async future/.get() pattern belongs here, last, once the object exists."}]},{"id":"lad-voice","title":"Classic voice pipeline","prompt":"Put the classic voice-agent pipeline in order.","steps":[{"label":"Speech-to-text: convert the caller's spoken audio into text","detail":"Pipeline step one — recognize_once() or continuous recognition turns audio into a transcript before any reasoning can happen on it."},{"label":"Language / generative-AI processing: reason over the transcript and produce a text reply","detail":"A chat/agent call reasons over the transcript — the step a single multimodal model (e.g. audio-in/audio-out chat deployment) can collapse together with steps 1 and 3, and the one the Voice Live API is built to replace all three of at once with a single low-latency speech-to-speech interface."},{"label":"Text-to-speech: synthesize the reply back to audio","detail":"speak_text_async() plays the generated reply — the classic pipeline's final step, also foldable into the single-multimodal-model or Voice Live alternative named in step 2's detail."}]},{"id":"lad-cu","title":"Content Understanding workflow","prompt":"Put the Content Understanding workflow in order.","steps":[{"label":"Choose or define an analyzer: describe the schema in natural language (ContentAnalyzer(base_analyzer_id=..., field_schema=...))","detail":"Prebuilt analyzer ids (prebuilt-invoice, prebuilt-audio,...) cover common domains; a custom ContentAnalyzer names the fields you want in plain language via field_schema — no code beyond describing what to extract."},{"label":"Register it: client.begin_create_analyzer(...)","detail":"Provisi
