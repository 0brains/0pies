m","why":"The nearest confusable is (b): the instrument with real fines (about USD 25k–50k per violation) is DIFC Regulation 10, not the Charter (July 2024), which has no enforcement arm. (d) invents a repeal — the Charter simply sits alongside the new authority.","citation":"UAE Charter for the Development and Use of Artificial Intelligence (July 2024)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ae-n01","kind":"defend","territory":"map-ae","roles":["*"],"area":"II.C","fact":"ae-reg10-duty-cluster","q":"The DIFC Commissioner questions your autonomous credit-decisioning deployment. Which duty cluster must your response evidence?","options":["Impact assessment, transparency notices, documentation and audit or certification duties","CE marking backed by an EU declaration of conformity","A published bias-audit summary under the municipal hiring rule"],"answer":"Impact assessment, transparency notices, documentation and audit or certification duties","why":"The nearest confusable is (b) — CE marking and declarations of conformity are EU AI Act artifacts with no DIFC counterpart. (c) is NYC Local Law 144's employer duty. Regulation 10 asks for the data-protection-style cluster, with fines around USD 25k–50k per violation.","citation":"DIFC Data Protection Regulations, Regulation 10","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ae-n02","kind":"defend","territory":"map-ae","roles":["*"],"area":"II.C","fact":"ae-outside-difc-pdpl","q":"Your mainland Dubai operation — outside the free zone — receives a regulator letter about its algorithmic processing of customers. Which regime is actually in play?","options":["The federal data-protection law's automated-decision provisions — the zone-scoped AI rule stops at the zone boundary","DIFC Regulation 10, which has applied UAE-wide since January 2026","The UAE AI Charter's enforcement chapter"],"answer":"The federal data-protection law's automated-decision provisions — the zone-scoped AI rule stops at the zone boundary","why":"The nearest confusable is (b): January 2026 changed enforcement intensity, not geography — Regulation 10 binds only within the DIFC. The Charter (c) has no enforcement chapter. Mainland processing answers to PDPL (Decree-Law 45/2021), with a reported 2027-01-01 compliance deadline.","citation":"UAE PDPL (Federal Decree-Law 45/2021), automated-decision provisions","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ae-c01","kind":"consolidate","territory":"map-ae","roles":["*"],"area":"II.C","fact":"ae-scope-is-a-place","q":"Why does the UAE sit in the sectoral band of your compliance map when it has no AI-specific statute for most of the country?","options":["Its only binding AI rules are scoped to a financial free zone — defined by a place, not an industry","Because federal law imposes AI duties on the banking industry nationwide","Because the AI Charter binds the technology industry"],"answer":"Its only binding AI rules are scoped to a financial free zone — defined by a place, not an industry","why":"The nearest confusable is (b) — there is no nationwide AI-specific banking duty; the binding instrument is DIFC Regulation 10 inside the zone, and even ADGM next door has only guidance, no Regulation-10 equivalent. (c) fails because the Charter binds no one.","citation":"DIFC Regulation 10; ADGM Data Protection Regulations 2021 (guidance only for AI)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ke-s01","kind":"gate","territory":"map-ke","roles":["*"],"area":"II.C","fact":"ke-bill-first-reading-status","q":"It is August 2026 and a client asks about the legal position of Kenya's Artificial Intelligence Bill. What is accurate?","options":["It had its Senate first reading in April 2026 and sits in committee — it must still pass the National Assembly before assent","It was enacted and its licensing duties are already enforceable","It was withdrawn after criticism that it restricted political speech","It exists only as a ministry white paper, never introduced in parliament"],"answer":"It had its Senate first reading in April 2026 and sits in committee — it must still pass the National Assembly before assent","why":"The nearest confusable is (b) — the classic proposed-tier trap: Senate Bill No. 4 (published 2026-02-19, first reading 2026-04-02) is at committee stage, not law. (c) gets the criticism right but the withdrawal wrong; (d) understates a real bill before the Senate.","citation":"The Artificial Intelligence Bill, 2026 (Senate Bill No. 4); first reading 2026-04-02","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ke-s02","kind":"gate","territory":"map-ke","roles":["*"],"area":"II.C","fact":"ke-commissioner-licensing-model","q":"If Kenya's 2026 AI bill became law tomorrow, what regulatory shape would companies face?","options":["An Office of the AI Commissioner licensing AI systems under risk-based provisions with penalties","An EU-style chain of provider, deployer and importer obligations","A voluntary code administered by the communications authority","Sector regulators issuing binding measures under a framework statute"],"answer":"An Office of the AI Commissioner licensing AI systems under risk-based provisions with penalties","why":"The nearest confusable is (b): the bill regulates AI systems through a commissioner-licensing model and draws no EU-style role chain — its published text makes no clear provider/deployer distinction. (d) is the Taiwan pattern (and roughly Peru's), not Kenya's commissioner-licensing design.","citation":"The Artificial Intelligence Bill, 2026 (Senate Bill No. 4) — Office of the AI Commissioner","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ke-c01","kind":"consolidate","territory":"map-ke","roles":["*"],"area":"II.C","fact":"ke-strategy-is-operative-framework","q":"While the AI bill waits in parliament, what actually steers AI governance in Kenya today?","options":["The National AI Strategy 2025–2030, backed by a five-year implementation budget","The AI Commissioner's interim licensing regulations","Directly applicable African Union AI regulations"],"answer":"The National AI Strategy 2025–2030, backed by a five-year implementation budget","why":"The nearest confusable is (b): the Commissioner's office does not exist yet — it is created only if the bill passes. The African Union (c) issues continental strategy, not directly applicable regulation. The March 2025 strategy (about KES 152bn) is the operative framework.","citation":"Kenya National AI Strategy 2025-2030 (launched March 2025)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ke-c02","kind":"consolidate","territory":"map-ke","roles":["*"],"area":"II.C","fact":"ke-africa-strongest-candidate","q":"Your Africa market brief must name the jurisdiction furthest along toward a standalone national AI statute. Why does Kenya top the list?","options":["It has the only dedicated national AI bill before an African legislature in 2026 — peers govern by policy, strategy or broader digital-economy bills","It enacted Africa's first AI act in 2025","It adopted the EU AI Act wholesale through a trade agreement"],"answer":"It has the only dedicated national AI bill before an African legislature in 2026 — peers govern by policy, strategy or broader digital-economy bills","why":"The nearest confusable is (b): nothing is enacted — a first-reading bill is precisely what puts Kenya ahead on the dedicated-statute track. Nigeria is the closest call, but its AI provisions sit inside a digital-economy omnibus (the e-governance bill, at third reading in July 2026), not a standalone AI act; Rwanda and South Africa govern by policy only. (c) invents an adoption mechanism that does not exist.","citation":"The Artificial Intelligence Bill, 2026 (Senate Bill No. 4); regional status per verified fact base","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-sg-k01","kind":"check","territory":"map-sg","roles":["*"],"area":"II.C","fact":"sg-agentic-framework-nonbinding","q":"An adviser warns that Singapore's new agentic-AI framework means autonomous agents are now legally regulated there. How do you respond?","options":["Decline to pre-comply on that basis — it is voluntary guidance, and no binding AI-specific statute exists there","Agree — IMDA instruments carry penalties once launched at ministerial level","Agree in part — it binds agent operators but not developers"],"answer":"Decline to pre-comply on that basis — it is voluntary guidance, and no binding AI-specific statute exists there","why":"The nearest confusable is (b) — launch profile is not legal force: the Davos debut (2026-01-22) and the 2026-05-20 update change nothing about the instrument being a voluntary IMDA model framework. (c) invents a role split; it addresses developers, deployers and agent operators without binding any of them.","citation":"IMDA — Model AI Governance Framework for Agentic AI (launched 2026-01-22, updated 2026-05-20)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tw-k01","kind":"check","territory":"map-tw","roles":["*"],"area":"II.C","fact":"tw-in-force-not-binding-trap","q":"Headline: 'Taiwan's AI law takes effect.' Leadership asks whether your Taipei business now needs a compliance programme. What is the correct call?","options":["Not yet — the statute directs government action; obligations for firms arrive only through future risk-classification and sector measures","Yes — a framework act in force means operational duties and penalties apply now","Yes — Taiwan mirrored the EU AI Act, so provider duties began at once"],"answer":"Not yet — the statute directs government action; obligations for firms arrive only through future risk-classification and sector measures","why":"The nearest confusable is (b) — the statute-equals-duties error: the Basic Act (effective on promulgation, 2026-01-14) codifies seven principles and tasks MODA with a risk framework, imposing no immediate obligations or penalties on private business. (c) is wrong twice over: no EU mirroring, and no provider/deployer split yet.","citation":"Taiwan AI Basic Act (promulgated and effective 2026-01-14); MODA risk framework pending","asOf":"2026-08-02","externalSource":true}],"events":[{"id":"ii-rr-ev-01","title":"Coordinated GPAI inquiry","text":"The AI Office opens a coordinated inquiry into general-purpose model providers — and since the Digital Omnibus it wields real fining powers over GPAI providers (up to 3% of global turnover or EUR 15M). Your model documentation is requested.","weight":{"holdings":["map-eu"],"operations":["genai"],"roles":["provider"],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"Ch6 §GPAI; Digital Omnibus (Council adoption 2026-06-29)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-02","title":"Biometric-practice probe","text":"A market-surveillance authority probes whether your biometric deployment crosses into the EU's prohibited-practices tier — the ban layer has applied since February 2025.","weight":{"holdings":["map-eu"],"operations":["biometric"],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"Ch6 §Prohibited Practices","asOf":"2026-08-02"},{"id":"ii-rr-ev-03","title":"Incident-readiness sweep","text":"A hospital customer reports a malfunction. The AI Office runs a readiness sweep: your post-market monitoring and serious-incident process will be duties when the deferred high-risk regime binds from 2 December 2027 — regulators are checking preparedness now.","weight":{"holdings":["map-eu"],"operations":[],"roles":["provider"],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"Ch6 §Post-Market Monitoring; Digital Omnibus deferral to 2027-12-02","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-04","title":"GDPR Art-22 ADM complaint","text":"A rejected loan applicant files an automated-decision-making complaint. Whatever the AI-law timeline says, GDPR Article 22 rights are enforceable today, and your DPO owns the response.","weight":{"holdings":["map-eu","map-uk"],"operations":["credit"],"roles":[],"hats":["dpo"],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"map-eu"},"citation":"Ch4 §Data Controller Obligations","asOf":"2026-08-02"},{"id":"ii-rr-ev-07","title":"AEDT audit sweep","text":"New York City's enforcement arm sweeps employers using automated employment decision tools: bias-audit currency and candidate notices are being checked.","weight":{"holdings":["map-us-nyc"],"operations":["hiring"],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"SG §Local Law 144","asOf":"2026-08-02"},{"id":"ii-rr-ev-08","title":"Illinois HRA charge filed","text":"A candidate files a Human Rights Act charge over AI use in hiring — the HB 3773 amendment has been in force since 1 January 2026, and the agency wants your records.","weight":{"holdings":["map-us-il"],"operations":["hiring"],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"SG §HB 3773 (in force 2026-01-01)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-10","title":"FTC AI-washing sweep","text":"The FTC announces a deception sweep over exaggerated AI claims in consumer products. Your chatbot's marketing copy is in scope under Section 5.","weight":{"holdings":["map-us"],"operations":["chatbot"],"roles":[],"hats":["product"],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"Ch5 §FTC Act §5","asOf":"2026-08-02"},{"id":"ii-rr-ev-11","title":"ECOA adverse-action demand","text":"A regulator demands your adverse-action notices for algorithmic credit denials — specific reasons are required, and 'the model said so' is not one.","weight":{"holdings":["map-us"],"operations":["credit"],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"Ch5 §ECOA","asOf":"2026-08-02"},{"id":"ii-rr-ev-12","title":"California ADMT opt-out wave","text":"Consumers exercise their California privacy rights against your automated decisionmaking in a coordinated wave. The ADMT regulations' access and opt-out machinery is being stress-tested on you.","weight":{"holdings":["map-us-ca"],"operations":["credit"],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"SG §CCPA/CPRA ADMT regulations","asOf":"2026-08-02"},{"id":"ii-rr-ev-13","title":"SB 942 provenance spot-check","text":"California spot-checks covered generative providers for AI-detection tooling and content disclosures under the AI Transparency Act.","weight":{"holdings":["map-us-ca"],"operations":["genai"],"roles":["provider"],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"California SB 942 (AI Transparency Act)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-14","title":"Korea qualifying-threshold letter","text":"The Ministry of Science and ICT writes: does your system meet the Framework Act's high-impact or compute thresholds? Misjudging scope here is the top Korea compliance failure.","weight":{"holdings":["map-kr"],"operations":[],"roles":["provider","importer"],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"AI Framework Act (Act No. 20676, in force 2026-01-22)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-15","title":"Korea generative-labelling notice","text":"A takedown notice cites unlabelled AI-generated output reaching Korean users. The Framework Act's generative-AI labelling duty is being enforced against your service.","weight":{"holdings":["map-kr"],"operations":["genai"],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"AI Framework Act (Act No. 20676) — generative labelling","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-16","title":"CAC filing audit","text":"The Cyberspace Administration audits your algorithm filing and security assessment for the public-facing generative service you operate in China.","weight":{"holdings":["map-cn"],"operations":["genai"],"roles":["provider"],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"Interim Measures for Generative AI Services; algorithm-filing regime","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-17","title":"Synthetic-content label inspection","text":"Inspectors check your outputs for the explicit and implicit labels the 2025 labelling measures and their companion standard require on synthetic content.","weight":{"holdings":["map-cn"],"operations":["genai"],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"Labelling Measures (effective 2025-09-01); GB 45438-2025","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-30","title":"DIFC autonomous-systems inspection","text":"The DIFC Commissioner of Data Protection opens an inspection of your autonomous decision systems — Regulation 10 has been fully enforced since 1 January 2026, with per-violation fines.","weight":{"holdings":["map-ae"],"operations":["credit","genai"],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"DIFC Data Protection Regulations, Regulation 10 (full enforcement 2026-01-01)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-31","title":"Peru reglamento verification","text":"Peru's digital-government secretariat verifies your high-risk classification and duty evidence under Law 31814's implementing regulation, in force since January 2026.","weight":{"holdings":["map-pe"],"operations":["biometric","hiring"],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"audit","territory":"match"},"citation":"Law 31814; DS 115-2025-PCM (in force 2026-01-22)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-05","title":"You fine-tune a foundation model","text":"Engineering ships a fine-tuned foundation model under your own brand. Congratulations: in EU terms you now carry provider duties for what you modified.","weight":{"holdings":[],"operations":["genai"],"roles":[],"hats":[],"coverage":[],"minTurn":5},"effect":{"type":"roleShift","toRole":"provider"},"citation":"Ch6 §GPAI; EU AI Act Art. 25 concept","asOf":"2026-08-02"},{"id":"ii-rr-ev-06","title":"White-label rebrand ships under your mark","text":"Sales closes a white-label deal: a third-party system now ships under your trademark. Putting your name on it moves provider obligations onto you.","weight":{"holdings":[],"operations":[],"roles":["importer","deployer"],"hats":[],"coverage":[],"minTurn":5},"effect":{"type":"roleShift","toRole":"provider"},"citation":"EU AI Act Art. 25; Ch6 §Roles along the value chain","asOf":"2026-08-02"},{"id":"ii-rr-ev-19","title":"AIDA revival rumour","text":"Ottawa insiders whisper that the federal AI bill — dead since prorogation killed Bill C-27 in January 2025 — is coming back. Clients want to know whether to stand up compliance now.","weight":{"holdings":["map-ca"],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"check","cardId":"ii-rr-ca-k01","reward":0,"penalty":1},"citation":"ISED — AIDA (Bill C-27) companion document; prorogation 2025-01-06","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-20","title":"Brazil Chamber momentum","text":"Headlines say the Brazilian AI bill is moving in the Chamber of Deputies and an AI act is 'imminent'. A client asks whether to stand up an EU-style compliance programme in São Paulo this quarter.","weight":{"holdings":["map-br"],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"check","cardId":"ii-rr-br-k01","reward":0,"penalty":1},"citation":"Câmara dos Deputados — PL 2338/2023 tramitação","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-22","title":"Canberra guardrails headline","text":"An Australian paper runs a mandatory-AI-rules headline. Worth remembering: the 2024 mandatory-guardrails proposal was abandoned in the December 2025 National AI Plan — check the substance before reacting.","weight":{"holdings":["map-au"],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"check","cardId":"ii-rr-au-k01","reward":0,"penalty":1},"citation":"National AI Plan (Dec 2025) — mandatory guardrails proposal abandoned","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-24","title":"Texas sandbox invitation","text":"The Texas programme invites your novel AI product into its regulatory sandbox under TRAIGA. Getting the terms right earns supervised room to test.","weight":{"holdings":["map-us-tx"],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"check","cardId":"ii-rr-tx-k01","reward":1,"penalty":0},"citation":"SG §TRAIGA; Texas HB 149","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-25","title":"EU regulatory-sandbox admission","text":"A member-state sandbox — every member state must now have at least one operational — offers your novel system supervised testing with regulatory cover.","weight":{"holdings":["map-eu"],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"check","cardId":"ii-rr-eu-k01","reward":1,"penalty":0},"citation":"Ch6 §Sandboxes; EU AI Act Art. 57","asOf":"2026-08-02"},{"id":"ii-rr-ev-26","title":"ISO/IEC 42001 certification opportunity","text":"Your board wants a recognised credential for the AI management system before the next funding round. A certification audit window opens this quarter.","weight":{"holdings":[],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"check","cardId":"ii-rr-any-k01","reward":1,"penalty":0},"citation":"Ch3 §Standards; ISO/IEC 42001:2023","asOf":"2026-08-02"},{"id":"ii-rr-ev-27","title":"Comprehensive-regime enforcement sweep","text":"Regulators in the binding-statute jurisdictions you operate across run a coordinated enforcement sweep. Knowing which duties are actually live where is the whole test.","weight":{"holdings":[],"operations":[],"roles":[],"hats":[],"coverage":["comprehensive"],"minTurn":0},"effect":{"type":"check","cardPool":["ii-rr-any-w01","ii-rr-any-w02","ii-rr-any-w03","ii-rr-any-w07"],"reward":0,"penalty":1},"citation":"Cross-tier sweep — citation carried by the drawn card","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-28","title":"Voluntary-framework benchmarking survey","text":"An industry association benchmarks members against the voluntary frameworks of the soft-law jurisdictions you hold. Mislabelling what is and is not binding costs credibility.","weight":{"holdings":[],"operations":[],"roles":[],"hats":[],"coverage":["voluntary"],"minTurn":0},"effect":{"type":"check","cardPool":["ii-rr-any-w04","ii-rr-any-w05","ii-rr-any-w06","ii-rr-uk-k01","ii-rr-uk-k02"],"reward":0,"penalty":1},"citation":"Cross-tier sweep — citation carried by the drawn card","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-32","title":"Singapore agentic-AI briefing","text":"After IMDA's world-first agentic-AI governance framework (launched at Davos, January 2026; updated May 2026), your board asks for a briefing on what it changes for your agents.","weight":{"holdings":["map-sg"],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"check","cardId":"ii-rr-sg-k01","reward":1,"penalty":0},"citation":"IMDA — Model AI Governance Framework for Agentic AI (2026-01-22, updated 2026-05-20)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-34","title":"Taipei headline check","text":"'Taiwan's AI law is in force' crosses the wire and your leadership asks whether the Taipei business must now stand up a compliance programme. Read the statute before you answer.","weight":{"holdings":["map-tw"],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"check","cardId":"ii-rr-tw-k01","reward":0,"penalty":1},"citation":"Taiwan AI Basic Act (promulgated and effective 2026-01-14)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-09","title":"Colorado moves the goalposts again","text":"Colorado repealed SB 24-205 before it ever took effect and replaced it with SB 26-189 (signed 2026-05-14): a narrower ADMT disclosure law, effective 2027-01-01, with duties mainly on deployers. Date-churn is the lesson — track the law, not the headline.","weight":{"holdings":["map-us-co"],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"info"},"citation":"Colorado SB 26-189 (signed 2026-05-14, effective 2027-01-01)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-33","title":"Kenya bill reaches committee","text":"Kenya's Artificial Intelligence Bill (Senate Bill No. 4) had its Senate first reading on 2 April 2026 and sits with the ICT committee. It must still pass the National Assembly — Africa's strongest dedicated-AI-bill candidate, but not yet law.","weight":{"holdings":["map-ke"],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"info"},"citation":"The Artificial Intelligence Bill, 2026 (Senate Bill No. 4); first reading 2026-04-02","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-35","title":"Swiss consultation opens","text":"Switzerland stays deliberately minimalist: the Federal Council's February 2025 decision holds — lean, sectoral, no horizontal AI act — with a draft bill due in consultation by end-2026. The CoE Convention is signed but not ratified.","weight":{"holdings":["map-ch"],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"info"},"citation":"Swiss Federal Council decision (Feb 2025); consultation draft due end-2026","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-36","title":"Digital Omnibus reshuffles the deadlines","text":"The June 2026 Digital Omnibus rewrote the EU AI Act timeline: Annex III high-risk duties now bind from 2 December 2027 (embedded systems 2028). Binding today: prohibitions and AI literacy, GPAI duties with fining powers, Article 50 transparency, and member-state sandboxes.","weight":{"holdings":["map-eu"],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"info"},"citation":"Digital Omnibus (Parliament 2026-06-16, Council 2026-06-29)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-37","title":"EU accedes to the Framework Convention","text":"The EU's accession to the Council of Europe Framework Convention on AI takes effect on 1 September 2026. Remember what kind of instrument this is: a binding treaty that binds states — obligations reach companies only through implementing law.","weight":{"holdings":["map-coe"],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"info"},"citation":"CoE Framework Convention (in force 2025-11-01); EU accession effective 2026-09-01","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ev-38","title":"Denver client asks about Colorado","text":"A Denver client has read that Colorado passed an AI law and asks whether to stand up compliance now. Signing dates are not effective dates — check what actually binds today before you answer.","weight":{"holdings":["map-us-co"],"operations":[],"roles":[],"hats":[],"coverage":[],"minTurn":0},"effect":{"type":"check","cardId":"ii-rr-co-k01","reward":0,"penalty":1},"citation":"Colorado General Assembly — SB26-189","asOf":"2026-08-02","externalSource":true}]},"roleMatrix":{"id":"II-roles","title":"Role Matrix","asOf":"2026-07-26","prompt":"Assign each obligation to the role it attaches to. Obligations follow actors, not systems.","sets":[{"id":"roles-aiact","area":"II.C","title":"EU AI Act roles","citation":"Ch6 §Organizational Context","roles":[{"id":"provider","name":"Provider","definition":"Develops an AI system or has one developed and places it on the market or puts it into service under its own name or trademark."},{"id":"deployer","name":"Deployer","definition":"Uses an AI system under its own authority, other than in a personal non-professional activity."},{"id":"importer","name":"Importer","definition":"Established in the EU and places on the market a system bearing the name or trademark of a third-country entity."},{"id":"distributor","name":"Distributor","definition":"Makes a system available on the EU market without being provider or importer."},{"id":"authrep","name":"Authorised representative","definition":"Appointed in writing by a third-country provider to act on its behalf in the EU."}],"obligations":[{"text":"Establish and maintain a risk management system across the lifecycle","role":"provider"},{"text":"Draw up technical documentation before placing on the market","role":"provider"},{"text":"Carry out the conformity assessment and affix CE marking","role":"provider"},{"text":"Register the high-risk system in the EU database","role":"provider"},{"text":"Operate a quality management system","role":"provider"},{"text":"Design the system so human oversight is possible","role":"provider"},{"text":"Apply data governance to training, validation and test data","role":"provider"},{"text":"Conduct post-market monitoring and report serious incidents","role":"provider"},{"text":"Use the system in accordance with the instructions for use","role":"deployer"},{"text":"Assign human oversight to people with the competence and authority to act","role":"deployer"},{"text":"Ensure input data is relevant and sufficiently representative for the intended purpose","role":"deployer"},{"text":"Inform workers and their representatives before putting a high-risk system into use in the workplace","role":"deployer"},{"text":"Inform individuals that they are subject to a high-risk system's decision","role":"deployer"},{"text":"Retain automatically generated logs for the required period","role":"deployer"},{"text":"Carry out a fundamental rights impact assessment where required","role":"deployer"},{"text":"Verify the provider has completed the conformity assessment before placing on the market","role":"importer"},{"text":"Verify the third-country provider has appointed an authorised representative","role":"importer"},{"text":"Indicate your name and contact address on the system or its packaging","role":"importer"},{"text":"Verify the CE marking and required documentation are present before making available","role":"distributor"},{"text":"Refrain from making available a system you know or should know is non-compliant","role":"distributor"},{"text":"Keep the declaration of conformity and technical documentation at the authorities' disposal","role":"authrep"},{"text":"Terminate the mandate if the provider acts contrary to its obligations, and inform the authority","role":"authrep"}],"traps":["A deployer becomes a provider by rebranding, substantially modifying, or changing the intended purpose so the system becomes high-risk.","Importer and distributor look similar: the importer brings a third-country system onto the EU market for the first time; the distributor moves one already on it.","Conformity assessment is never a deployer duty — but assigning competent human oversight is never a provider duty either. Providers design for oversight; deployers staff it."]},{"id":"roles-gdpr","area":"II.A","title":"GDPR roles","citation":"Ch4 §Data Controller Obligations in the AI Context","roles":[{"id":"controller","name":"Controller","definition":"Determines the purposes and means of processing."},{"id":"joint","name":"Joint controllers","definition":"Two or more controllers that jointly determine purposes and means."},{"id":"processor","name":"Processor","definition":"Processes personal data on behalf of the controller."},{"id":"dpo","name":"Data protection officer","definition":"Appointed to inform, advise and monitor compliance, independently."},{"id":"gdpr-rep","name":"Article 27 representative","definition":"Represents a non-EU controller or processor within the EU."}],"obligations":[{"text":"Identify a lawful basis before processing begins","role":"controller"},{"text":"Provide Article 13 and 14 transparency information to data subjects","role":"controller"},{"text":"Respond to access, rectification, erasure and objection requests","role":"controller"},{"text":"Carry out a data protection impact assessment for high-risk processing","role":"controller"},{"text":"Notify the supervisory authority of a breach within 72 hours","role":"controller"},{"text":"Communicate a high-risk breach to affected data subjects","role":"controller"},{"text":"Put an Article 28 contract in place before engaging a processor","role":"controller"},{"text":"Establish a transfer mechanism under Chapter V before sending data abroad","role":"controller"},{"text":"Agree an arrangement setting out respective responsibilities, and make its essence available to data subjects","role":"joint"},{"text":"Accept that a data subject may exercise their rights against either of you, regardless of the arrangement","role":"joint"},{"text":"Process only on documented instructions from the controller","role":"processor"},{"text":"Obtain authorisation before engaging a sub-processor","role":"processor"},{"text":"Notify the controller of a personal data breach without undue delay","role":"processor"},{"text":"Assist the controller in responding to data subject requests","role":"processor"},{"text":"Delete or return the data at the end of the engagement","role":"processor"},{"text":"Inform and advise on obligations, and monitor compliance, without receiving instructions on how to perform the task","role":"dpo"},{"text":"Act as the contact point for the supervisory authority and for data subjects","role":"dpo"},{"text":"Maintain the record of processing activities and make it available to the authority on request","role":"gdpr-rep"}],"traps":["A processor that starts determining purposes becomes a controller for that processing, whatever the contract says.","The DPO advises and monitors; the DPO does not own compliance and cannot be instructed how to do the job.","Security under Article 32 binds controller and processor alike — it is one of the few duties that genuinely sits on both."]},{"id":"roles-overlap","area":"II.A+II.C","title":"Where the AI Act and GDPR overlap","citation":"Ch4 §Practical Implications and Governance; Ch6 §Regulatory Intersection","prompt":"For each statement, decide whether it belongs to the EU AI Act, the GDPR, or both.","buckets":["EU AI Act","GDPR","Both"],"items":[{"text":"Roles are assigned by who places a system on the market or puts it into service","answer":"EU AI Act","why":"Market placement is the AI Act's allocator. The GDPR allocates by who determines purposes and means."},{"text":"Roles are assigned by who determines the purposes and means of processing","answer":"GDPR","why":"Purpose determination, not market position."},{"text":"An organisation can be a provider under one regime and a controller under the other for the same system","answer":"Both","why":"The two role sets are independent. A provider may process no personal data at all; a deployer is very often the controller."},{"text":"Requires an impact assessment before high-risk activity","answer":"Both","why":"AI Act fundamental rights impact assessment for certain deployers; GDPR Article 35 DPIA for high-risk processing. Different triggers, different scopes, and they can be run together."},{"text":"Gives an individual the right not to be subject to a solely automated decision with significant effects","answer":"GDPR","why":"Article 22 is a data subject right. The AI Act imposes oversight duties on organisations but does not create this right."},{"text":"Requires that people be told when they are interacting with an AI system","answer":"EU AI Act","why":"Article 50 transparency. GDPR notice obligations are about processing of personal data, which is a different subject matter."},{"text":"Applies to organisations outside the EU on the basis of effects inside it","answer":"Both","why":"Both reach extraterritorially, but on different triggers: market placement or output used in the EU, versus establishment, offering goods and services, or monitoring behaviour."},{"text":"Maximum fines can reach 7% of total worldwide annual turnover","answer":"EU AI Act","why":"The Article 5 prohibitions band. The GDPR tops out at 4% or €20 million."},{"text":"Permits processing special categories of data specifically to detect and correct bias, subject to safeguards","answer":"Both","why":"AI Act Article 10(5) creates the permission for high-risk bias monitoring; it has to be read with GDPR Article 9. Neither works alone."},{"text":"Enforced by data protection authorities","answer":"GDPR","why":"The AI Act is enforced by market surveillance authorities and the AI Office — though some member states have designated their DPA as the market surveillance authority for certain Annex III areas."},{"text":"Requires data used for training to be relevant, representative and as free of errors as possible","answer":"EU AI Act","why":"Article 10 data governance for high-risk systems. This sits in genuine tension with GDPR data minimisation, and reconciling the two is a governance judgment, not a lookup."},{"text":"Requires records to be kept that demonstrate compliance","answer":"Both","why":"AI Act technical documentation, logging and record-keeping; GDPR Article 30 records and the Article 5(2) accountability principle."},{"text":"Obligations can attach to you even if you never touch personal data","answer":"EU AI Act","why":"A provider of a high-risk system processing only industrial sensor data still carries the full obligation set. This is the cleanest demonstration that the two regimes are not nested."}],"traps":["Complying with the GDPR does not discharge AI Act obligations, and vice versa. They stack, and so do the fines.","A fundamental rights impact assessment is not a renamed DPIA. They have different triggers and different scopes, even though they can be conducted together.","AI Act data governance pushes toward more and better data; GDPR minimisation pushes toward less. Naming that tension is what a real answer looks like."]}]},"cases":[{"id":"II-case-001","areas":["II.C","II.A"],"asOf":"2026-07-26","status":"stable","brief":"A Dutch insurer licenses a third-party model to price motor policies, retrains it on its own claims history, and markets it to customers under its own brand. Pricing decisions are issued automatically.","citation":"Ch6 §When Deployers Become Providers; Ch4 §Data Controller Obligations","steps":[{"q":"What is the insurer under the EU AI Act?","options":["Provider","Deployer","Importer","Distributor"],"answer":"Provider","why":"It rebranded the system and substantially modified it by retraining — either alone transfers provider obligations."},{"q":"Which additional regime is squarely engaged?","options":["GDPR Article 22","Product liability","TDM exception","FTC Act §5"],"answer":"GDPR Article 22","why":"Automatic pricing decisions with significant effects are solely automated decision-making."},{"q":"What must be in place before go-live?","options":["Conformity assessment and technical documentation","A patent filing","An environmental report","A trade mark registration"],"answer":"Conformity assessment and technical documentation","why":"Provider duties for a high-risk system, alongside the DPIA required on the privacy side."}]},{"id":"II-case-002","areas":["II.B","II.A"],"asOf":"2026-07-26","status":"stable","brief":"A US retailer's AI screening tool for warehouse roles rejects applicants at a much higher rate from one postal-code cluster that correlates strongly with race. There was no intent to discriminate.","citation":"Ch5 §Non-discrimination Laws and AI","steps":[{"q":"What is the legal theory?","options":["Disparate impact","Disparate treatment","Breach of contract","Product defect"],"answer":"Disparate impact","why":"Facially neutral feature, disproportionate effect, no intent needed."},{"q":"Which statute is the primary hook?","options":["Title VII","ECOA","Fair Housing Act","FTC Act §5"],"answer":"Title VII","why":"Employment context."},{"q":"What is the employer's strongest defence posture?","options":["Job-relatedness and business necessity, with a less discriminatory alternative assessed","The vendor built it","The feature was not race","Accuracy was high overall"],"answer":"Job-relatedness and business necessity, with a less discriminatory alternative assessed","why":"The statutory test. \"The vendor built it\" is not a defence, and overall accuracy does not answer disparate impact."}]},{"id":"II-case-003","areas":["II.D","II.C"],"asOf":"2026-07-26","status":"stable","brief":"A board asks why the company should adopt ISO/IEC 42001 when it already intends to comply with the EU AI Act.","citation":"Ch7 §ISO Standards","steps":[{"q":"What is the relationship?","options":["42001 is a voluntary management system that can evidence AI Act compliance","42001 replaces AI Act obligations","42001 is binding law in the EU","They are unrelated"],"answer":"42001 is a voluntary management system that can evidence AI Act compliance","why":"Standards are not law, but a certified management system is strong evidence of the governance the Act demands."},{"q":"What can 42001 do that the AI Act cannot?","options":["Be certified by an accredited third party","Impose fines","Ban a practice","Confer legal immunity"],"answer":"Be certified by an accredited third party","why":"Certifiability is the practical value; it confers no immunity."}]},{"id":"II-case-004","areas":["II.C"],"asOf":"2026-07-26","status":"stable","brief":"A US company trains a general-purpose model above the systemic-risk compute threshold. It has no EU establishment, but EU businesses integrate the model into their products.","citation":"Ch6 §Extraterritoriality; §Additional Obligations for GPAI with Systemic Risk","steps":[{"q":"Does the AI Act reach this provider?","options":["Yes — the Act applies where output or the model is placed on the EU market","No — no EU establishment","Only if it has EU customers directly","Only after 2028"],"answer":"Yes — the Act applies where output or the model is placed on the EU market","why":"Extraterritorial reach follows market placement, not establishment."},{"q":"What does systemic risk add?","options":["Model evaluation, adversarial testing, incident reporting and cybersecurity","Nothing beyond baseline","Only a copyright policy","CE marking"],"answer":"Model evaluation, adversarial testing, incident reporting and cybersecurity","why":"Systemic-risk duties sit on top of the baseline GPAI set."},{"q":"What must it appoint?","options":["An authorised representative in the EU","A works council","A notified body","A data protection officer"],"answer":"An authorised representative in the EU","why":"Third-country GPAI providers must appoint an EU authorised representative."}]},{"id":"II-case-005","areas":["II.A","II.B"],"asOf":"2026-07-26","status":"stable","brief":"A marketing agency fine-tunes an LLM on scraped web content to generate campaign copy. Some source sites carry machine-readable rights reservations. The campaign targets construction businesses, not individuals.","citation":"Ch5 §Intellectual Property Laws and AI; Ch4 §Notice, Choice, Consent","steps":[{"q":"What does the rights reservation mean for the training data?","options":["The commercial TDM exception is unavailable, so a licence is needed","Reservations are unenforceable","Fair use applies automatically in the EU","Only attribution is required"],"answer":"The commercial TDM exception is unavailable, so a licence is needed","why":"The commercial exception can be reserved; the research exception cannot."},{"q":"Does GDPR apply to the targeting?","options":["Not to business entities as such, but it does to identifiable contacts","Yes, fully, to companies","No, never to B2B","Only if consent was collected"],"answer":"Not to business entities as such, but it does to identifiable contacts","why":"Legal persons are outside GDPR, but named individuals at those firms are personal data."}]},{"id":"II-case-006","areas":["II.C","II.D"],"asOf":"2026-07-26","status":"superseded","brief":"It is September 2026. Your board asks which EU AI Act obligations currently bind the company's Annex III recruitment system.","citation":"Ch6 §EU AI Act Implementation","currency":{"book":"High-risk obligations would be in force from 2 August 2026.","changed":"The Digital Omnibus deferred standalone Annex III to 2 December 2027, so in September 2026 the full high-risk set does not yet bind. Article 50 transparency does, from 2 August 2026.","exam":"BoK v2.1 predates the Omnibus — for the exam, assume the enacted timeline."},"steps":[{"q":"Which obligations are live in September 2026 on the amended timeline?","options":["Article 50 transparency and the Article 5 prohibitions","The full high-risk conformity set","Nothing yet","Only GPAI duties"],"answer":"Article 50 transparency and the Article 5 prohibitions","why":"Prohibitions since February 2025, transparency since August 2026; high-risk deferred to December 2027."},{"q":"What is the right governance posture on the deferred obligations?","options":["Continue preparing to the original schedule","Stop the programme","Wait for national guidance before acting","Reclassify the system as minimal risk"],"answer":"Continue preparing to the original schedule","why":"A deferral is not a repeal, and conformity work takes longer than the extension granted."}]}],"briefs":[{"id":"II.A-brief-01","area":"II.A","asOf":"2026-07-26","status":"stable","title":"The support transcripts","scenario":"Helio, a SaaS company headquartered in Berlin, has eleven years of customer support transcripts — roughly 40 million messages. Customers were told at collection that the data would be used to \"resolve your support request and improve our service\". Helio's new product team wants to fine-tune a language model on the full archive to build an automated support agent, and later to license that agent to other companies.\n\nThe archive is not clean. Customers routinely paste screenshots, order numbers, and occasionally health information when explaining why they missed a payment. About 12% of transcripts come from users who have since closed their accounts, and 3% from users who have made erasure requests that were actioned against the account record but not against the transcript store. The transcripts are stored in Frankfurt, but the fine-tuning would run on infrastructure in Oregon.\n\nThe product team's position is that the transcripts are Helio's own business records, that \"improve our service\" covers building a better support agent, and that because the model will not reproduce transcripts verbatim, no personal data leaves the training process. The general counsel is uneasy but cannot articulate why. You are asked for a written position before the sprint starts.","fields":[{"key":"basis","prompt":"Is \"improve our service\" a sufficient basis for this training, and for the licensing plan?","hint":"Address purpose limitation and compatibility separately for each of the two uses."},{"key":"erasure","prompt":"How do you handle the closed accounts and the 3% erasure requests?"},{"key":"special","prompt":"What follows from the incidental health information in the transcripts?"},{"key":"transfer","prompt":"What does the Frankfurt-to-Oregon training run require?"},{"key":"controls","prompt":"What controls and documentation would you require before the sprint starts?"},{"key":"position","prompt":"State your position to the general counsel in five sentences or fewer."}],"rubric":[{"criterion":"Separates the two purposes","expected":"Internal service improvement and commercial licensing to third parties are different purposes with different compatibility analyses. Licensing is very hard to bring inside the original notice.","citation":"Ch4 §Notice, Choice, Consent, and Purpose Limitation in AI"},{"criterion":"Applies the compatibility test rather than asserting it","expected":"Link to original purpose, context of collection, nature of the data, consequences, safeguards — not simply 'improve our service covers it'.","citation":"Ch4 §Notice, Choice, Consent, and Purpose Limitation in AI"},{"criterion":"Treats erasure as extending to the training corpus","expected":"Actioning erasure against the account record but not the transcript store is an incomplete response; the transcripts must be removed before training, and model memorisation risk addressed.","citation":"Ch4 §Data Controller Obligations in the AI Context"},{"criterion":"Identifies incidental special-category data","expected":"Art. 9 applies to health data even when incidental and unsolicited; needs an Art. 9 condition or robust filtering, and 'we did not ask for it' is not a basis.","citation":"Ch4 §Understanding the Requirements That Apply to Sensitive or Special Categories of Data"},{"criterion":"Addresses the transfer properly","expected":"Training in Oregon is a cross-border transfer requiring a Chapter V mechanism and a transfer risk assessment; storage location does not settle it.","citation":"Ch4 §Data Controller Obligations in the AI Context"},{"criterion":"Rejects the 'no verbatim output' argument","expected":"Training on personal data is processing regardless of whether outputs reproduce it; memorisation and extraction risk are additional concerns, not the test.","citation":"Ch4 §Practical Implications and Governance"},{"criterion":"Requires a DPIA","expected":"Large-scale processing of a decade of customer data including special categories for a new purpose meets the Art. 35 threshold.","citation":"Ch4 §Data Controller Obligations in the AI Context"}]},{"id":"II.B-brief-01","area":"II.B","asOf":"2026-07-26","status":"stable","title":"The hiring funnel","scenario":"Marchetti Logistics runs 400 warehouses across the United States and hires around 30,000 seasonal staff each year. To cope, it has deployed a third-party AI screening tool that scores applicants on a 0–100 \"reliability index\" built from work history, commute distance, prior seasonal completion rates, and a short situational judgement questionnaire. Anyone below 55 is auto-rejected without human review. The vendor describes the model as \"bias-tested and EEOC-aligned\" but will not disclose the feature weights, calling them proprietary.\n\nSix months in, an internal analyst notices that applicants from three postal-code clusters are rejected at roughly 2.4 times the rate of others. Those clusters are predominantly Black and Hispanic. Commute distance is by far the heaviest-weighted feature. Separately, the tool has been marketed to Marchetti's own clients as a service, and Marchetti's website advertises it as \"removing human bias from hiring\".\n\nMarchetti's operations director argues that commute distance is a legitimate business factor because long commutes predict no-shows, that the vendor certified the tool, and that no protected characteristic is used as an input. The head of HR wants to keep using it through peak season and review afterwards. You are the AI governance lead.","fields":[{"key":"theory","prompt":"What is the legal exposure, and under which statutes?"},{"key":"commute","prompt":"Is \"commute distance predicts no-shows\" a valid defence? Reason it through."},{"key":"vendor","prompt":"What is the significance of the vendor's certification and refusal to disclose weights?"},{"key":"marketing","prompt":"Does the \"removes human bias\" claim create separate exposure?"},{"key":"peak","prompt":"Respond to the proposal to keep using it through peak season."},{"key":"actions","prompt":"What would you require, in what order, and on what timescale?"}],"rubric":[{"criterion":"Names disparate impact under Title VII","expected":"Facially neutral criterion, disproportionate effect on protected groups, no intent required. Absence of protected characteristics as inputs is not a defence.","citation":"Ch5 §Non-discrimination Laws and AI"},{"criterion":"Applies the business necessity test, not a plausibility test","expected":"Predictive validity is not sufficient; the employer must show job-relatedness and business necessity AND that no less discriminatory alternative achieving the same aim exists.","citation":"Ch5 §Non-discrimination Laws and AI"},{"criterion":"Identifies commute distance as a proxy","expected":"Given US residential segregation, commute distance is a well-recognised race proxy; heaviest weighting on a proxy is the core defect.","citation":"Ch5 §Non-discrimination Laws and AI"},{"criterion":"Rejects vendor certification as a shield","expected":"The employer remains liable for its own hiring decisions. Refusal to disclose weights is itself a governance failure and a contracting problem to fix.","citation":"Ch5 §Non-discrimination Laws and AI"},{"criterion":"Spots the consumer-protection exposure","expected":"\"Removes human bias\" is an unsubstantiated performance claim under FTC Act §5 — and is now demonstrably false, which sharply increases exposure.","citation":"Ch5 §How Consumer Protection Laws Apply to AI"},{"criterion":"Notes the role change from deployer to provider","expected":"Marketing the tool onward to clients changes Marchetti's role and adds obligations and liability it does not have as a pure user.","citation":"Ch5 §How Consumer Protection Laws Apply to AI"},{"criterion":"Refuses continued use of an auto-reject without human review","expected":"Continuing knowingly after discovering the disparity converts a defensible mistake into aggravated exposure. Auto-rejection below threshold with no human review is the specific feature to suspend first.","citation":"Ch5 §Non-discrimination Laws and AI"},{"criterion":"Flags state-law exposure","expected":"Illinois HB 3773 and NYC Local Law 144 impose notice and bias-audit duties on AI in employment; a national footprint means checking state overlays.","citation":"Horizon — not in the study guide"}]},{"id":"II.C-brief-01","area":"II.C","asOf":"2026-07-26","status":"stable","title":"NordBank AI Advisor","scenario":"NordBank, headquartered in Stockholm, licenses a general-purpose model from a US developer with no EU establishment. NordBank fine-tunes the model on twelve years of its own customer transaction data, wraps it in a decisioning layer, and deploys it to make consumer credit decisions across the Nordics and Germany. It is marketed to customers as \"NordBank AI Advisor\". Declines under €10,000 are issued automatically; above that, a credit officer reviews a one-line summary and, in practice, follows the recommendation 97% of the time.\n\nThe US developer's model was trained above the systemic-risk compute threshold. NordBank's contract with the developer disclaims all liability for downstream use and provides no technical documentation beyond a public model card. NordBank has not performed a conformity assessment; its position is that it is \"only a customer\" of the model. It plans to offer the Advisor to two smaller partner banks next year.\n\nA declined customer has asked, in writing, how the decision about her was reached and what data was used. The board wants to know its exposure before the partner-bank rollout.","fields":[{"key":"role","prompt":"What is NordBank under the EU AI Act, and what is the US developer? Justify each."},{"key":"tier","prompt":"What is the risk classification of the Advisor, and on what basis?"},{"key":"obligations","prompt":"Which obligations attach to NordBank, and which to the developer?"},{"key":"intersect","prompt":"Which other regimes are engaged, and what do they require here?"},{"key":"customer","prompt":"How must NordBank answer the declined customer?"},{"key":"exposure","prompt":"Quantify the exposure and state what must happen before the partner-bank rollout."}],"rubric":[{"criterion":"Identifies NordBank as provider, not deployer","expected":"Own branding plus fine-tuning plus a new intended purpose — any one would suffice. \"Only a customer\" is wrong and is the central error.","citation":"Ch6 §When Deployers Become Providers"},{"criterion":"Classifies as Annex III high-risk","expected":"Creditworthiness evaluation of natural persons is expressly Annex III high-risk.","citation":"Ch6 §High-risk AI Systems"},{"criterion":"Rejects the human-review argument on the facts","expected":"97% concurrence on a one-line summary is rubber-stamping, not meaningful human oversight, so Art. 22 is engaged above €10,000 too.","citation":"Ch6 §Human Oversight; Ch4 §Data Controller Obligations"},{"criterion":"Separates provider duties from GPAI duties","expected":"NordBank owes the high-risk set (risk management, data governance, technical documentation, conformity assessment, CE marking, registration, human oversight, logging, quality management). The developer owes GPAI plus systemic-risk duties and must appoint an EU authorised representative.","citation":"Ch6 §Classification Requirements; §Requirements for General-purpose AI"},{"criterion":"Treats the contract as inadequate rather than protective","expected":"A liability disclaimer does not move statutory obligations. Absent technical documentation, NordBank cannot discharge its own duties — this is a procurement failure to remediate, and Art. 25 addresses information flow along the value chain.","citation":"Ch6 §Shared and Overlapping Responsibilities"},{"criterion":"Answers the customer under both regimes","expected":"GDPR Arts. 15 and 22 give access plus meaningful information about the logic and the right to contest and obtain human intervention; the AI Act adds an explanation right for Annex III decisions. \"Proprietary model\" does not defeat either.","citation":"Ch4 §Data Controller Obligations; Ch6 §Transparency and User Instructions"},{"criterion":"Gets the penalty exposure right","expected":"Up to €15M or 3% for high-risk non-compliance — not the €35M/7% band, which is for Art. 5 prohibitions. GDPR exposure runs in parallel at up to 4%.","citation":"Ch6 §Penalties for Non-compliance"},{"criterion":"Stops the partner-bank rollout","expected":"Supplying to partner banks makes NordBank a provider to third parties, compounding every unmet obligation. Conformity assessment and documentation must precede rollout.","citation":"Ch6 §Organizational Context"}]},{"id":"II.D-brief-01","area":"II.D","asOf":"2026-07-26","status":"stable","title":"The framework bake-off","scenario":"You have joined a 900-person medical devices company as its first AI governance lead. The company builds imaging software with embedded AI, sold in the EU and the US. It already holds ISO 13485 and ISO 27001 certification and has a mature quality management system.\n\nThe CTO wants to \"adopt the NIST AI RMF because it's free and the Americans use it\". The quality director wants ISO/IEC 42001 \"because we can certify it and our auditors already know ISO\". The general counsel says neither matters because \"only the EU AI Act is law\". The CEO has asked for a one-page recommendation and is impatient with nuance.\n\nComplicating this: the company's products are Annex I embedded AI under the EU AI Act, not standalone Annex III. Nobody in the room knows what that changes. The board also wants to state something about responsible AI in the annual report and has asked whether the company can say it \"complies with the OECD AI Principles\".","fields":[{"key":"relationship","prompt":"Explain the relationship between the AI Act, ISO/IEC 42001, the NIST AI RMF and the OECD Principles."},{"key":"counsel","prompt":"Is the general counsel right that only the AI Act matters?"},{"key":"annexi","prompt":"What does being Annex I embedded rather than Annex III change?"},{"key":"iso","prompt":"Which ISO standards are relevant here, and what does each actually do?"},{"key":"oecd","prompt":"Can the company claim it 'complies with the OECD AI Principles'?"},{"key":"recommendation","prompt":"Give the one-page recommendation the CEO asked for."}],"rubric":[{"criterion":"Distinguishes binding from voluntary correctly","expected":"The AI Act is binding law with fines. 42001, the AI RMF and the OECD Principles are voluntary; they can evidence compliance but never substitute for it.","citation":"Ch7 §ISO Standards; §NIST AI Risk Management Framework"},{"criterion":"Corrects the general counsel without overstating","expected":"Only the Act is enforceable, but voluntary frameworks shape what regulators and courts treat as reasonable practice, and harmonised standards carry a presumption of conformity.","citation":"Ch7 §Other AI-related Standards"},{"criterion":"Gets the Annex I consequence right","expected":"Embedded AI in regulated products is assessed through the existing sectoral conformity route (here the medical device regime) rather than standalone AI Act procedures, and it phases in later than Annex III.","citation":"Ch6 §Organizational Context"},{"criterion":"Names the three core ISO standards accurately","expected":"22989 terminology and concepts; 42001 certifiable AI management system; 42005 AI system impact assessment guidance. BoK v2.1 names exactly these three.","citation":"Ch7 §ISO Standards"},{"criterion":"Exploits the existing certifications","expected":"42001 is designed to integrate with 27001 and 13485 through Annex SL, so the existing management system is the cheapest path — which resolves the CTO/quality director dispute on the merits rather than by preference.","citation":"Ch7 §ISO Standards"},{"criterion":"Handles the OECD claim honestly","expected":"The OECD Principles are non-certifiable state-directed principles. A company can say it is aligned with them; \"complies with\" implies a conformity assessment that does not exist, and risks being a deceptive claim.","citation":"Ch7 §OECD Principles"},{"criterion":"Recognises the NIST AI RMF is not either/or","expected":"The AI RMF and Playbook can structure risk work inside a 42001 management system; the question is not which one, it is which is the system of record.","citation":"Ch7 §NIST AI Risk Management Framework (AI RMF)"}]},{"id":"II-brief-capstone","area":"Mixed","asOf":"2026-07-26","status":"superseded","capstone":true,"title":"Capstone — Meridian Health, four jurisdictions","scenario":"Meridian Health operates hospital groups in Ireland, Illinois, South Korea and Brazil. It is deploying a single AI platform across all four: a triage assistant that ranks emergency arrivals by acuity, plus a generative documentation assistant that drafts clinical notes and patient-facing discharge summaries.\n\nThe triage model was built in-house in Dublin. The documentation assistant is a third-party general-purpose model above the systemic-risk threshold, accessed via API, fine-tuned on Meridian's own clinical notes, and deployed under the name \"Meridian Scribe\". Patient-facing summaries are generated and sent automatically unless a clinician intervenes; clinicians intervene in about 4% of cases.\n\nMeridian's Irish entity is the contracting party for the API. Korean patient data stays in Korea. Illinois staff are also screened for internal promotion using a separate AI tool. Brazilian operations were added by acquisition three months ago and have no AI documentation of any kind. The group CISO has proposed \"comply with the EU AI Act everywhere — it's the strictest, so we're covered\".\n\nIt is September 2026. The board wants a governance position before the platform goes live in November.","fields":[{"key":"classify","prompt":"Classify each system in each jurisdiction where it operates."},{"key":"roles","prompt":"What is Meridian's role for each system, and does it differ by jurisdiction?"},{"key":"strictest","prompt":"Assess the CISO's 'comply with the strictest' proposal."},{"key":"timeline","prompt":"As of September 2026, which obligations actually bind, and which are still ahead?"},{"key":"gaps","prompt":"What are the three most urgent gaps, and why those three?"},{"key":"position","prompt":"State the governance position and the go/no-go recommendation for November."}],"currency":{"book":"EU AI Act high-risk obligations apply from 2 August 2026, so in September 2026 they would bind.","changed":"The Digital Omnibus deferred standalone Annex III to 2 December 2027. Article 50 transparency still applies from 2 August 2026. Korea's AI Basic Act has applied since 22 January 2026 with an enforcement grace period.","exam":"BoK v2.1 predates the Omnibus. The exam-correct answer uses the enacted timeline; the practice-correct answer uses the amended one. Answer both and say which is which."},"rubric":[{"criterion":"Classifies triage as high-risk and separates the documentation assistant","expected":"Emergency triage is Annex III high-risk. The documentation assistant is largely an Art. 50 transparency case for patient-facing output, not automatically high-risk — different systems, different tiers.","citation":"Ch6 §Risk Classification"},{"criterion":"Identifies Meridian as provider for both","expected":"In-house build makes it provider of the triage model; branding as \"Meridian Scribe\" plus fine-tuning makes it provider of the documentation assistant despite it being third-party underneath.","citation":"Ch6 §When Deployers Become Providers"},{"criterion":"Dismantles 'comply with the strictest'","expected":"Requirements are not nested. Korea requires a domestic representative and generative-content labelling the AI Act does not; Illinois imposes employment-AI notice duties; Brazil has no comprehensive law but general consumer and data protection law still applies. Strictest-wins produces gaps, not safety.","citation":"Horizon — not in the study guide"},{"criterion":"Gets the September 2026 position right on both tracks","expected":"Enacted track: high-risk obligations live. Amended track: Art. 5 prohibitions and Art. 50 transparency live, Annex III deferred to December 2027. Korea's AI Basic Act live since January 2026. Naming which track is being used is the mark of a correct answer.","citation":"Currency layer"},{"criterion":"Flags the 4% intervention rate","expected":"Automatic dispatch of patient-facing clinical summaries with 4% clinician intervention is not meaningful human oversight and is the single highest patient-safety and Art. 22 exposure.","citation":"Ch6 §Human Oversight"},{"criterion":"Treats the Brazilian acquisition as a due-diligence failure","expected":"Three months post-acquisition with no AI documentation means unknown inventory, unknown third parties and unknown training data — you cannot classify what you have not inventoried.","citation":"Ch3 §Policies to Manage Third-party Risk"},{"criterion":"Identifies the Korean localisation and representative duties","expected":"Korea's AI Basic Act requires a domestic representative for qualifying foreign providers and advance notification plus labelling for generative output.","citation":"Horizon — not in the study guide"},{"criterion":"Reaches a defensible go/no-go","expected":"Any recommendation is acceptable if it is grounded: a staged launch that defers automatic patient-facing generation and Brazil pending inventory is the strongest, and 'launch everything in November' is not defensible on these facts.","citation":"Ch6 §Mapping Your Role in the AI Lifecycle"}]}],"amendmentsGrid":[{"id":"grid-eu-amend-01","domain":"Prohibited AI practices","area":"II.C","original":{"text":"The AI Act lists 8 distinct prohibited AI practices under Article 5 — no specific rule against synthetic intimate imagery.","citation":"EU AI Act Art. 5(1), prior to amendment"},"updated":{"text":"Article 5 prohibits AI systems intended to generate or manipulate non-consensual intimate imagery or CSAM, including systems with inadequate safety guardrails, alongside the original 8 practices.","citation":"EU AI Act Art. 5(1), as amended by Regulation (EU) 2026/1744 Art. 1(7) (the \"Digital Omnibus\") — verified against the consolidated text on eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"}},{"id":"grid-eu-amend-02","domain":"High-risk AI system compliance timeline","area":"II.C","original":{"text":"Applicable date is 2 August 2026 (for Annex III AI systems) and 2 August 2027 (for Annex I AI systems).","citation":"EU AI Act Art. 113, prior to amendment"},"updated":{"text":"Applicable date is postponed to 2 December 2027 (for Annex III AI systems) and 2 August 2028 (for Annex I AI systems).","citation":"EU AI Act Art. 113, as amended by Regulation (EU) 2026/1744 (the \"Digital Omnibus\") — \"the date of application of Sections 1, 2 and 3 of Chapter III is set to 2 December 2027 for AI systems classified as high-risk pursuant to Article 6(2) and Annex III, and to 2 August 2028 for AI systems classified as high-risk pursuant to Article 6(1) and Annex I\" — verified against the consolidated text on eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"}},{"id":"grid-eu-amend-03","domain":"Transparency obligation compliance timeline","area":"II.C","original":{"text":"All Article 50 obligations apply from 2 August 2026. This includes the AI output detection and watermarking obligation (Article 50(2)).","citation":"EU AI Act Art. 50, Art. 113, prior to amendment"},"updated":{"text":"Applicable date for the AI output detection and watermarking obligation (Article 50(2)) postponed to 2 December 2026, for legacy AI systems only.","citation":"EU AI Act Art. 50(2), as amended by Regulation (EU) 2026/1744 (the \"Digital Omnibus\") — verified against the consolidated text on eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"}},{"id":"grid-eu-amend-04","domain":"Registration of \"exempted\" AI systems which are not high-risk","area":"II.C","original":{"text":"A provider whose system meets the Article 6(3) derogation criteria (exempted from high-risk classification) must register it in the EU's public database, providing full supporting information."," // The manifest names the lab and lists its games; the deck bundle holds every
// data file those games reference, keyed by the path the manifest used. A deck
// referenced by two labs is authored once and inlined into both.
const LAB = JSON.parse(document.getElementById("lab-manifest").textContent);
const DECKS = JSON.parse(document.getElementById("lab-decks").textContent);
document.getElementById("lab-title").textContent = LAB.title;
document.getElementById("lab-sub").textContent = LAB.subtitle || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

/* ---------------------------------------------------------------- storage */
const KEY = LAB.storageKey;
let memoryOnly = false;
function loadProgress(){
  try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : {items:{},briefs:{}}; }
  catch(e){ memoryOnly = true; return {items:{},briefs:{}}; }
}
let progress = loadProgress();
function save(){
  if(memoryOnly) return;
  try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){ memoryOnly = true; }
}

/* -------------------------------------------------------------- scheduler */
const INTERVALS = [0,1,3,7,21];
const today = () => new Date().toISOString().slice(0,10);
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function record(id, correct){
  const it = progress.items[id] || {seen:0,wrong:0,confidentWrong:0,interval:0,due:today()};
  it.seen++;
  if(correct){
    const i = INTERVALS.indexOf(it.interval);
    it.interval = INTERVALS[Math.min(INTERVALS.length-1, (i<0?0:i)+1)];
  }else{
    it.wrong++; it.interval = 0;
  }
  it.due = addDays(it.interval); it.lastSeen = today();
  progress.items[id] = it; save();
}
function markConfidentlyWrong(id){
  const it = progress.items[id]; if(!it) return;
  it.confidentWrong = (it.confidentWrong||0)+1;
  it.interval = 0; it.due = today(); save();
}
function priority(id){
  const it = progress.items[id];
  if(!it) return 0;
  if(it.confidentWrong>0) return -3;
  if(it.wrong>0) return -2;
  if(it.interval<7) return -1;
  return it.interval;
}
const dueNow = id => { const it=progress.items[id]; return !it || it.due <= today(); };
function masteryOf(ids){
  if(!ids.length) return 0;
  return ids.filter(id => (progress.items[id]||{}).interval >= 7).length / ids.length;
}

/* ---------------------------------------------------------------- adapters */
// A game names either a runner + deck (generic content) or an adapter + data
// (an existing typed knowledge file, reached by the functions that already drove it).
// An adapter returns whatever its runner expects; nothing else in the engine
// knows which kind of game it is driving.
function deckOf(g){
  const d = DECKS[g.deck || g.data];
  if(!d) throw new Error(`game ${g.id}: no deck loaded for "${g.deck || g.data}"`);
  return d;
}
// Provenance resolves card-first, deck-second. A vendor-neutral deck states its
// source once instead of repeating the same citation on all twenty cards.
function withProvenance(items, d){
  return items.map(it => ({status:"stable", area:d.area, ...it,
                           citation: it.citation || d.source,
                           asOf: it.asOf || d.asOf}));
}

function serviceIcon(serviceName, providerKey){
  const p = ICON_PROVIDERS[providerKey];
  if (!p) return undefined;
  const file = p.map[serviceName] || p.fallback;
  return `assets/${p.dir}/${file}`;

const MAX_ZONES = 8;
function zonesFromAnswers(use){
  return [...new Set(use.map(i => i.answer))].map(a => ({key:a, name:a}));
}
// Decision decks add distractors drawn from the cards' own options. An
// answers-only board of six distinct answers is solvable by one-to-one
// elimination without reading a single card, which teaches nothing.
function zonesFromOptions(use, all, seed){
  const answers = [...new Set(use.map(i => i.answer))];
  const pool = [...new Set(all.flatMap(i => i.options || []))].filter(o => !answers.includes(o));
  const extra = shuffle(pool, seed + 11).slice(0, Math.max(0, MAX_ZONES - answers.length));
  return shuffle(answers.concat(extra), seed + 3).map(a => ({key:a, name:a}));
}
function genericBoard(g){
  const d = deckOf(g);
  const items = withProvenance(d.items, d);
  const stamped = g.areaOverride ? items.map(it => ({...it, area: g.areaOverride})) : items;
  const spec = {items: stamped, hint:d.hint || "", note:d.note, traps:d.traps};
  spec.icons = d.icons;
  if(d.zones) spec.zones = d.zones;
  else if(d.zoneMode === "options") spec.zonesFrom = use => zonesFromOptions(use, stamped, state.round);
  else spec.zonesFrom = zonesFromAnswers;
  // A "pick a service, see just its cards" mode: the deck names the field each
  // item is grouped by, and every group's identity (icon + name) comes from
  // the same lookup the tokens themselves already use.
  if(d.groupByService){
    const names = [...new Set(stamped.map(i => i.service))].sort();
    spec.serviceGroups = names.map(name => ({name, icon: serviceIcon(name, d.icons)}));
  }
  return spec;
}
function genericPairs(g){

  const d = deckOf(g);
  return d.ladders.map(l => {
    const base = {area:d.area, ...l, citation:l.citation || d.source};
    return g.areaOverride ? {...base, area: g.areaOverride} : base;
  });
}

/* ------------------------------------------------------------ board items */
// Each board game supplies items {id, label, sub?, answer} and zones
// {key, name, def?}. One board runner drives them all.
function tellsBoard(g){
  const DATA = deckOf(g);
  return {
    zonesFrom: items => {
      const s = new Set(); items.forEach(i => i.options.forEach(o => s.add(o)));
      return [...s].map(o => ({key:o, name:o}));
    },
    items: DATA.tells.map(t => ({
      id:t.id, area:t.area, status:t.status, label:`“${t.snippet}”`,
      answer:t.answer, options:t.options, why:t.tell, citation:t.citation
    })),
    hint:"Drag each snippet onto the instrument it came from. The reveal names the tell."
  };
}
function roleBoard(g){
  const DATA = deckOf(g);
  const set = DATA.roleMatrix.sets.find(s => s.id===g.setId);
  if(set.items){
    return {
      zones:set.buckets.map(b => ({key:b, name:b})),
      items:set.items.map((it,i) => ({
        id:`${set.id}-${i}`, area:set.area, status:"stable", label:it.text,
        answer:it.answer, why:it.why, citation:set.citation
      })),
      hint:set.prompt, traps:set.traps
    };
  }
  return {
    zones:set.roles.map(r => ({key:r.name, name:r.name, def:r.definition})),
    items:set.obligations.map((o,i) => {
      const role = set.roles.find(r => r.id===o.role);
      return {id:`${set.id}-${i}`, area:set.area, status:"stable", label:o.text,
              answer:role.name, why:role.definition, citation:set.citation};
    }),
    hint:DATA.roleMatrix.prompt, traps:set.traps
  };
}
function timelineBoard(g){
  const t = deckOf(g).timeline;
  return {
    zones:t.buckets.map(b => ({key:b, name:b})),
    items:t.milestones.map(m => ({
      id:m.id, area:"II.C", status:m.status, scope:m.scope,
      label:`${m.instrument} — ${m.milestone}`, sub:m.jurisdiction,
      answer:m.bucket, why:`${m.date}. ${m.note}`, citation:t.title
    })),
    hint:t.prompt, note:t.note
  };
}
function caseBoards(g){
  return deckOf(g).cases.map(c => ({
    id:c.id, brief:c.brief, currency:c.currency, citation:c.citation, areas:c.areas,
    steps:c.steps.map((s,i) => ({id:`${c.id}-s${i}`, ...s}))
  }));
}

// The registry is the seam between the manifest and the engine. build_lab.py
// parses these keys out of this file and fails the build if a manifest names a
// runner or adapter that is not here — otherwise a typo ships a lab with a
// silently missing game.
const ADAPTERS = {
  board:        genericBoard,
  pairs:        genericPairs,
  ladders:      genericLadders,
  aigpTells:    tellsBoard,
  aigpRoles:    roleBoard,
  aigpTimeline: timelineBoard,
  aigpCases:    caseBoards,
  aigpMap:      g => deckOf(g).map,
  aigpRisk:     g => ({campaign: deckOf(g).campaign, map: deckOf(g).map}),
  aigpBriefs:   g => deckOf(g).briefs,
  aigpPairs:    g => deckOf(g).pairs.filter(p => g.setId ? p.set===g.setId : !p.set),
  aigpLadders:  g => deckOf(g).ladders,
  grid3x3:      g => deckOf(g).amendmentsGrid
};

const GAMES = LAB.games.map(g => {
  const runner = g.runner || "board";
  const fn = ADAPTERS[g.adapter || runner];
  if(!fn) throw new Error(`game ${g.id}: unknown adapter "${g.adapter || runner}"`);
  // Payloads are built on demand, not cached: a board spec is rebuilt per deal
  // so that option-mode zones can vary with the round.
  const payload = () => fn(g);
  return {...g, runner, payload, board: runner==="board" ? payload : null};
});
