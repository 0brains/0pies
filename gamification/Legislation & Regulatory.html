<script id="lab-decks" type="application/json">{"aigp/knowledge/domain-ii.json":{"schemaVersion":1,"bokVersion":"2.1","domain":"II","domainTitle":"Understanding how laws, standards and frameworks apply to AI","asOf":"2026-07-26","blueprint":{"min":19,"max":23},"source":{"title":"IAPP AIGP Artificial Intelligence Governance Professional Study Guide","author":"Peter H. Gregory","publisher":"Sybex","year":2026,"isbn13":"9781394363940"},"areas":[{"id":"II.A","title":"Existing data privacy laws","chapter":4,"indicators":4,"blueprint":{"min":4,"max":6}},{"id":"II.B","title":"Other existing laws","chapter":5,"indicators":4,"blueprint":{"min":4,"max":6}},{"id":"II.C","title":"AI-specific laws","chapter":6,"indicators":6,"blueprint":{"min":6,"max":8}},{"id":"II.D","title":"Industry standards and tools","chapter":7,"indicators":3,"blueprint":{"min":3,"max":5}}],"tells":[{"id":"II.D-tell-001","area":"II.D","asOf":"2026-07-26","status":"stable","snippet":"The organization shall establish, implement, maintain and continually improve an AI management system, including the processes needed and their interactions.","answer":"ISO/IEC 42001","options":["ISO/IEC 42001","NIST AI RMF","OECD AI Principles","EU AI Act"],"tell":"\"management system\" plus the \"establish, implement, maintain and continually improve\" formula is ISO management-standard boilerplate. It is the same sentence shape as ISO 27001 and 9001.","citation":"Ch7 §ISO Standards"},{"id":"II.D-tell-002","area":"II.D","asOf":"2026-07-26","status":"stable","snippet":"GOVERN, MAP, MEASURE and MANAGE are the four core functions, each broken into categories and subcategories.","answer":"NIST AI RMF","options":["NIST AI RMF","ISO/IEC 42001","OECD AI Principles","ISO/IEC 22989"],"tell":"Four verbs in capitals is unique to NIST. Nothing else in Domain II organises itself into GOVERN/MAP/MEASURE/MANAGE.","citation":"Ch7 §NIST AI Risk Management Framework (AI RMF)"},{"id":"II.D-tell-003","area":"II.D","asOf":"2026-07-26","status":"stable","snippet":"This document provides a vocabulary and describes concepts and terminology for AI, so that different communities can use consistent language.","answer":"ISO/IEC 22989","options":["ISO/IEC 22989","ISO/IEC 42001","ISO/IEC 42005","NIST AI RMF"],"tell":"Vocabulary and concepts only, with nothing to certify against, is 22989. If a standard tells you what words mean rather than what to do, it is the terminology standard.","citation":"Ch7 §ISO Standards"},{"id":"II.D-tell-004","area":"II.D","asOf":"2026-07-26","status":"stable","snippet":"Guidance on the process for performing an impact assessment of an AI system on individuals and societies.","answer":"ISO/IEC 42005","options":["ISO/IEC 42005","ISO/IEC 42001","ISO/IEC 22989","ISO/IEC 23894"],"tell":"Impact assessment process = 42005. Easily confused with 42001 (the management system) and 23894 (risk management). BoK v2.1 names 22989, 42001 and 42005 as the three core ISO standards.","citation":"Ch7 §ISO Standards"},{"id":"II.D-tell-005","area":"II.D","asOf":"2026-07-26","status":"stable","snippet":"AI actors should respect the rule of law, human rights and democratic values throughout the AI system lifecycle, including inclusive growth and sustainable development.","answer":"OECD AI Principles","options":["OECD AI Principles","EU AI Act","NIST AI RMF","ISO/IEC 42001"],"tell":"\"AI actors\" plus \"inclusive growth, sustainable development and well-being\" is OECD language. It states values, imposes nothing, and is addressed to governments as much as firms.","citation":"Ch7 §OECD Principles"},{"id":"II.D-tell-006","area":"II.D","asOf":"2026-07-26","status":"stable","snippet":"An evaluation programme that assesses model performance in laboratory, in controlled field testing, and in real-world use, in three layers.","answer":"NIST ARIA","options":["NIST ARIA","NIST AI RMF","ISO/IEC 42005","OECD AI Principles"],"tell":"Layered evaluation moving from lab to field to real world is ARIA (Assessing Risks and Impacts of AI). The AI RMF is a framework; ARIA is a testing programme that feeds it.","citation":"Ch7 §NIST ARIA: Layered AI Model Evaluation"},{"id":"II.C-tell-007","area":"II.C","asOf":"2026-07-26","status":"stable","snippet":"Providers shall ensure that the system undergoes the relevant conformity assessment procedure prior to its placing on the market, and shall draw up an EU declaration of conformity.","answer":"EU AI Act","options":["EU AI Act","ISO/IEC 42001","NIST AI RMF","GDPR"],"tell":"\"shall\" plus conformity assessment, declaration of conformity and placing on the market is EU product-safety legislation. Standards never say \"shall … prior to placing on the market\".","citation":"Ch6 §Classification Requirements"},{"id":"II.D-tell-008","area":"II.D","asOf":"2026-07-26","status":"stable","snippet":"A companion resource offering suggested actions, references and documentation for each subcategory, which organisations may use in whole or in part.","answer":"NIST AI RMF Playbook","options":["NIST AI RMF Playbook","ISO/IEC 42001","NIST ARIA","OECD Framework"],"tell":"\"Suggested actions\" that are voluntary and per-subcategory is the Playbook, the companion to the AI RMF. BoK II.D.2 names the Playbook alongside the framework.","citation":"Ch7 §NIST AI Risk Management Framework (AI RMF)"},{"id":"II.A-tell-009","area":"II.A","asOf":"2026-07-26","status":"stable","snippet":"The data subject shall have the right not to be subject to a decision based solely on automated processing, including profiling, which produces legal effects concerning them.","answer":"GDPR Article 22","options":["GDPR Article 22","EU AI Act Article 50","GDPR Article 35","EU AI Act Article 6"],"tell":"\"solely on automated processing\" plus \"legal effects or similarly significantly affects\" is Art. 22. It is a data-protection right, not an AI Act obligation — a favourite exam trap.","citation":"Ch4 §Data Controller Obligations in the AI Context"},{"id":"II.A-tell-010","area":"II.A","asOf":"2026-07-26","status":"stable","snippet":"Where processing is likely to result in a high risk to the rights and freedoms of natural persons, the controller shall, prior to processing, carry out an assessment of the impact.","answer":"GDPR Article 35 (DPIA)","options":["GDPR Article 35 (DPIA)","EU AI Act FRIA","ISO/IEC 42005","GDPR Article 22"],"tell":"\"rights and freedoms of natural persons\" plus \"prior to the processing\" is the GDPR DPIA. Distinguish from the AI Act's fundamental rights impact assessment and from ISO 42005 guidance.","citation":"Ch4 §Data Controller Obligations in the AI Context"},{"id":"II.B-tell-011","area":"II.B","asOf":"2026-07-26","status":"stable","snippet":"Unfair or deceptive acts or practices in or affecting commerce are hereby declared unlawful.","answer":"FTC Act Section 5","options":["FTC Act Section 5","Title VII","Equal Credit Opportunity Act","EU AI Act"],"tell":"\"unfair or deceptive acts or practices\" is the literal statutory phrase of FTC Act §5 — the main US hook for overstated AI capability claims.","citation":"Ch5 §How Consumer Protection Laws Apply to AI"},{"id":"II.B-tell-012","area":"II.B","asOf":"2026-07-26","status":"stable","snippet":"A practice that is neutral on its face but falls more harshly on a protected group, and which cannot be justified by business necessity.","answer":"Disparate impact","options":["Disparate impact","Disparate treatment","Unfair practice","Product defect"],"tell":"\"Neutral on its face\" plus \"business necessity\" is the disparate-impact test. Disparate treatment needs intent; disparate impact does not — which is why proxy features in a model are the usual AI exposure.","citation":"Ch5 §Non-discrimination Laws and AI"}],"pairs":[{"id":"II.C-pair-001","area":"II.C","asOf":"2026-07-26","status":"stable","dimension":"human oversight in the decision loop","buckets":["High-risk","Not high-risk"],"a":{"text":"An AI system screens job applicants and produces a ranked shortlist that recruiters hire from.","answer":"High-risk","why":"Annex III employment use — the system materially influences who gets hired."},"b":{"text":"The same system only sorts applicants alphabetically for a recruiter who reads every CV and decides independently.","answer":"Not high-risk","why":"Art. 6(3): a narrow procedural task that does not materially influence the outcome falls outside high-risk."},"citation":"Ch6 §High-risk AI Systems"},{"id":"II.C-pair-002","area":"II.C","asOf":"2026-07-26","status":"stable","dimension":"whose name is on the system","buckets":["Provider","Deployer"],"a":{"text":"A bank licenses a third-party high-risk model and uses it internally under the vendor's brand.","answer":"Deployer","why":"Using a system under another's name keeps you a deployer."},"b":{"text":"The same bank puts its own trademark on the system and offers it to customers as its own.","answer":"Provider","why":"Placing your name or trademark on a high-risk system makes you its provider, with the full provider obligation set."},"citation":"Ch6 §When Deployers Become Providers"},{"id":"II.C-pair-003","area":"II.C","asOf":"2026-07-26","status":"stable","dimension":"law-enforcement context and real-time vs retrospective","buckets":["Prohibited","High-risk"],"a":{"text":"Police run real-time remote biometric identification across a public square to find suspects generally.","answer":"Prohibited","why":"Art. 5 bans real-time remote biometric identification in publicly accessible spaces for law enforcement, save narrow authorised exceptions."},"b":{"text":"Police run the same biometric matching after the fact, on stored footage, under judicial authorisation.","answer":"High-risk","why":"Post-remote biometric identification is not banned but is Annex III high-risk with authorisation requirements."},"citation":"Ch6 §Prohibited AI Systems; §Exceptions to the Biometric Identification Ban"},{"id":"II.C-pair-004","area":"II.C","asOf":"2026-07-26","status":"stable","dimension":"deployment context of emotion recognition","buckets":["Prohibited","Limited-risk"],"a":{"text":"An employer deploys emotion recognition to monitor staff attentiveness at their desks.","answer":"Prohibited","why":"Art. 5 bans emotion inference in the workplace and in education, outside medical and safety uses."},"b":{"text":"A games studio uses emotion recognition in a consumer entertainment app, disclosed to the user.","answer":"Limited-risk","why":"Outside workplace and education the ban does not bite; Art. 50 transparency duties apply instead."},"citation":"Ch6 §Prohibited AI Systems"},{"id":"II.C-pair-005","area":"II.C","asOf":"2026-07-26","status":"stable","dimension":"systemic-risk threshold","buckets":["GPAI","GPAI with systemic risk"],"a":{"text":"A provider releases a general-purpose model trained well below the systemic-risk compute threshold.","answer":"GPAI","why":"Baseline duties: technical documentation, information to downstream providers, copyright policy, training-data summary."},"b":{"text":"The same provider releases a model whose cumulative training compute exceeds the systemic-risk threshold.","answer":"GPAI with systemic risk","why":"Adds model evaluation, adversarial testing, systemic-risk assessment and mitigation, incident reporting and cybersecurity duties."},"citation":"Ch6 §Additional Obligations for GPAI with Systemic Risk"},{"id":"II.C-pair-006","area":"II.C","asOf":"2026-07-26","status":"stable","dimension":"who the penalty band attaches to","buckets":["€35M or 7%","€15M or 3%"],"a":{"text":"An organisation deploys a prohibited social-scoring system.","answer":"€35M or 7%","why":"Breach of the Art. 5 prohibitions attracts the top band."},"b":{"text":"An organisation deploys a high-risk system but fails to keep the required technical documentation.","answer":"€15M or 3%","why":"Non-compliance with obligations other than the Art. 5 prohibitions sits in the middle band."},"citation":"Ch6 §Penalties for Non-compliance"},{"id":"II.C-pair-007","area":"II.C","asOf":"2026-07-26","status":"stable","dimension":"substantial modification","buckets":["Deployer","Provider"],"a":{"text":"A hospital uses a CE-marked diagnostic AI exactly as the vendor intended.","answer":"Deployer","why":"Use within the intended purpose leaves provider duties with the vendor."},"b":{"text":"The hospital retrains the model on its own data and applies it to a different clinical purpose.","answer":"Provider","why":"A substantial modification, or a change of intended purpose that makes a system high-risk, transfers provider obligations to you."},"citation":"Ch6 §When Deployers Become Providers"},{"id":"II.C-pair-008","area":"II.C","asOf":"2026-07-26","status":"stable","dimension":"role in the supply chain","buckets":["Importer","Distributor"],"a":{"text":"A Dublin firm brings a US-built high-risk system into the EU market for the first time.","answer":"Importer","why":"Placing a third-country system on the EU market makes you the importer: verify conformity assessment, CE marking, documentation and the authorised representative."},"b":{"text":"A Dublin firm resells that system onward within the EU without altering it.","answer":"Distributor","why":"Distributors make available a system already on the market; duties are lighter but include checking CE marking and not supplying a system they know to be non-compliant."},"citation":"Ch6 §Organizational Context"},{"id":"II.A-pair-009","area":"II.A","asOf":"2026-07-26","status":"stable","dimension":"whether the decision is solely automated","buckets":["Article 22 engaged","Article 22 not engaged"],"a":{"text":"A lender declines a loan automatically on the model score, with no human review.","answer":"Article 22 engaged","why":"A decision based solely on automated processing with legal or similarly significant effects triggers Art. 22 safeguards."},"b":{"text":"The model flags the application and an underwriter reviews the file and can overturn it.","answer":"Article 22 not engaged","why":"Meaningful human involvement with real authority to change the outcome takes it outside \"solely\" automated. Rubber-stamping does not count."},"citation":"Ch4 §Data Controller Obligations in the AI Context"},{"id":"II.A-pair-010","area":"II.A","asOf":"2026-07-26","status":"stable","dimension":"purpose of the biometric processing","buckets":["Article 9 special category","Not special category"],"a":{"text":"A system processes facial images specifically to identify a named individual.","answer":"Article 9 special category","why":"Biometric data processed for the purpose of uniquely identifying a person is special-category data."},"b":{"text":"A system processes facial images only to count how many people are in a room.","answer":"Not special category","why":"Without the identification purpose the same raw data is not Art. 9 biometric data, though it remains personal data."},"citation":"Ch4 §Understanding the Requirements That Apply to Sensitive or Special Categories of Data"},{"id":"II.A-pair-011","area":"II.A","asOf":"2026-07-26","status":"stable","dimension":"compatibility of the new purpose","buckets":["Purpose limitation breach","Compatible use"],"a":{"text":"Customer service transcripts collected to resolve tickets are reused to train a commercial model.","answer":"Purpose limitation breach","why":"Training a product on data collected for support is not what the data subject was told; it needs a fresh basis or genuine compatibility analysis."},"b":{"text":"The same transcripts are used to audit whether ticket resolution met the stated service standard.","answer":"Compatible use","why":"Quality assurance of the very service the data was collected for is a compatible further purpose."},"citation":"Ch4 §Notice, Choice, Consent, and Purpose Limitation in AI"},{"id":"II.A-pair-012","area":"II.A","asOf":"2026-07-26","status":"stable","dimension":"inferred versus collected attributes","buckets":["Special category processing","Ordinary personal data"],"a":{"text":"A model infers users' likely religious beliefs from their posting history.","answer":"Special category processing","why":"Inferring a special category attribute is processing that category, even though it was never collected directly."},"b":{"text":"A model records which product pages each user visited.","answer":"Ordinary personal data","why":"Behavioural data alone is personal but not special category, unless it is used to infer a protected attribute."},"citation":"Ch4 §Understanding the Requirements That Apply to Sensitive or Special Categories of Data"},{"id":"II.B-pair-013","area":"II.B","asOf":"2026-07-26","status":"stable","dimension":"intent versus effect","buckets":["Disparate treatment","Disparate impact"],"a":{"text":"A hiring model is deliberately configured to downweight applicants from a protected group.","answer":"Disparate treatment","why":"Intentional differential treatment on a protected characteristic."},"b":{"text":"A hiring model uses postal code, which correlates strongly with race, and rejects one group at a far higher rate.","answer":"Disparate impact","why":"Facially neutral feature, disproportionate effect, no intent required. Proxy variables are the classic AI exposure."},"citation":"Ch5 §Non-discrimination Laws and AI"},{"id":"II.B-pair-014","area":"II.B","asOf":"2026-07-26","status":"stable","dimension":"which sectoral statute governs","buckets":["Title VII","Equal Credit Opportunity Act"],"a":{"text":"An AI tool screens candidates for a warehouse role and disadvantages older applicants.","answer":"Title VII","why":"Employment discrimination sits under Title VII, with the ADEA covering age specifically."},"b":{"text":"An AI model sets credit limits and produces systematically lower limits for one protected group.","answer":"Equal Credit Opportunity Act","why":"Credit decisions fall under ECOA, which also requires specific adverse action reasons — hard to give from an opaque model."},"citation":"Ch5 §Non-discrimination Laws and AI"},{"id":"II.B-pair-015","area":"II.B","asOf":"2026-07-26","status":"stable","dimension":"whether the claim is about capability or about harm caused","buckets":["Consumer protection","Product liability"],"a":{"text":"A vendor advertises 99% accuracy for its AI screening tool without evidence.","answer":"Consumer protection","why":"Unsubstantiated performance claims are deceptive practices under FTC Act §5."},"b":{"text":"A firmware update to an AI home robot causes erratic movement that damages property.","answer":"Product liability","why":"Defect causing damage is product liability; the EU's revised regime expressly brings software and AI within scope."},"citation":"Ch5 §How Consumer Protection Laws Apply to AI; §How Product Liability Laws Apply to AI"},{"id":"II.B-pair-016","area":"II.B","asOf":"2026-07-26","status":"stable","dimension":"commercial versus research text and data mining","buckets":["Reservation applies","Exception applies"],"a":{"text":"A company scrapes news sites commercially where publishers have machine-readably reserved their rights.","answer":"Reservation applies","why":"The EU commercial TDM exception can be opted out of by an express reservation, so scraping needs a licence."},"b":{"text":"A university mines the same corpus for non-commercial scientific research with lawful access.","answer":"Exception applies","why":"The research TDM exception cannot be overridden by contract or reservation."},"citation":"Ch5 §Intellectual Property Laws and AI"},{"id":"II.D-pair-017","area":"II.D","asOf":"2026-07-26","status":"stable","dimension":"binding force","buckets":["Binding law","Voluntary standard"],"a":{"text":"An organisation fails to complete a conformity assessment for a high-risk AI system.","answer":"Binding law","why":"EU AI Act obligation, enforceable with administrative fines."},"b":{"text":"An organisation chooses not to implement the NIST AI RMF's MEASURE function.","answer":"Voluntary standard","why":"The AI RMF is voluntary guidance. It carries no penalty — though it may inform what counts as reasonable practice."},"citation":"Ch7 §NIST AI Risk Management Framework (AI RMF)"},{"id":"II.D-pair-018","area":"II.D","asOf":"2026-07-26","status":"stable","dimension":"certifiable versus informative","buckets":["Certifiable","Informative only"],"a":{"text":"An organisation seeks third-party certification of its AI governance arrangements.","answer":"Certifiable","why":"ISO/IEC 42001 is a management system standard, so it can be audited and certified against."},"b":{"text":"An organisation wants agreed definitions of \"AI system\" and \"machine learning\" for its policy set.","answer":"Informative only","why":"ISO/IEC 22989 supplies vocabulary and concepts; there is nothing to certify against."},"citation":"Ch7 §ISO Standards"},{"id":"II.C-pair-019","area":"II.C","asOf":"2026-07-26","status":"superseded","dimension":"the Digital Omnibus deferral","buckets":["2 August 2026","2 December 2027"],"a":{"text":"As the AI Act was originally enacted, when did obligations for standalone Annex III high-risk systems apply?","answer":"2 August 2026","why":"The original two-year phase-in date, and what the study guide teaches."},"b":{"text":"After the Digital Omnibus agreed in May 2026, when do those same obligations apply?","answer":"2 December 2027","why":"The Omnibus deferred standalone Annex III obligations by roughly 16 months. Annex I embedded systems moved to 2 August 2028."},"currency":{"book":"High-risk obligations apply from 2 August 2026.","changed":"The Digital Omnibus, agreed May 2026, deferred standalone Annex III to 2 December 2027 and Annex I embedded products to 2 August 2028. Most Article 50 transparency duties still apply from 2 August 2026.","exam":"BoK v2.1 was approved in September 2025 and predates this. Expect the original timeline unless IAPP has issued an update."},"citation":"Ch6 §EU AI Act Implementation"},{"id":"II.C-pair-020","area":"II.C","asOf":"2026-07-26","status":"stable","dimension":"who the transparency duty falls on","buckets":["Provider duty","Deployer duty"],"a":{"text":"A chatbot must be built so that users can tell they are interacting with an AI system.","answer":"Provider duty","why":"Art. 50 places design-time disclosure for AI interaction on the provider."},"b":{"text":"An employer using an emotion recognition system must inform the people exposed to it.","answer":"Deployer duty","why":"Art. 50 places the duty to inform exposed individuals on the deployer operating the system."},"citation":"Ch6 §Limited-risk AI: Targeted Transparency Obligations"},{"id":"II.C-amend-001","area":"II.C","set":"eu-amendments","asOf":"2026-07-29","status":"stable","dimension":"prohibited AI practices","buckets":["Original Act","Amended Act"],"a":{"text":"The AI Act lists 8 distinct prohibited AI practices under Article 5 — no specific rule against synthetic intimate imagery.","answer":"Original Act","why":"The original Article 5 list of 8 practices predates the Amendments Regulation."},"b":{"text":"Article 5 prohibits AI systems intended to generate or manipulate non-consensual intimate imagery or CSAM, including systems with inadequate safety guardrails, alongside the original 8 practices.","answer":"Amended Act","why":"The Amendments Regulation adds this ninth prohibited practice, closing a gap the original 8-item list left open."},"citation":"EU AI Act Art. 5(1), as amended by Regulation (EU) 2026/1744 Art. 1(7) (the \"Digital Omnibus\") — verified against the consolidated text on eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"},{"id":"II.C-amend-002","area":"II.C","set":"eu-amendments","asOf":"2026-07-29","status":"stable","dimension":"registration of exempted (non-high-risk) AI systems","buckets":["Original Act","Amended Act"],"a":{"text":"A provider whose system meets the Article 6(3) derogation criteria (exempted from high-risk classification) must register it in the EU's public database, providing full supporting information.","answer":"Original Act","why":"The original Article 6(3)/71 registration duty requires the full information set for these exempted systems."},"b":{"text":"An exempted system under Article 6(3) is registered in the EU's public database with a reduced information set.","answer":"Amended Act","why":"The Amendments Regulation keeps the registration duty but reduces the information burden for exempted systems."},"citation":"EU AI Act Art. 6(3), Art. 49(2), Annex VIII, as amended by Regulation (EU) 2026/1744 Art. 1(42) (the \"Digital Omnibus\") — verified against the consolidated text on eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"},{"id":"II.C-amend-003","area":"II.C","set":"eu-amendments","asOf":"2026-07-29","status":"stable","dimension":"AI literacy obligation","buckets":["Original Act","Amended Act"],"a":{"text":"Providers and deployers are required to ensure a sufficient level of AI literacy of their staff.","answer":"Original Act","why":"Article 4's original wording is a duty to ensure literacy outright."},"b":{"text":"Providers and deployers are required to support the development of AI literacy of their staff.","answer":"Amended Act","why":"The Amendments Regulation softens Article 4 from an 'ensure' duty to a 'support the development of' duty."},"citation":"EU AI Act Art. 4, as replaced by Regulation (EU) 2026/1744 Art. 1(5) (the \"Digital Omnibus\") — verified against the consolidated text on eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"},{"id":"II.C-amend-004","area":"II.C","set":"eu-amendments","asOf":"2026-07-29","status":"stable","dimension":"processing sensitive personal data for bias detection and correction","buckets":["Original Act","Amended Act"],"a":{"text":"Only high-risk AI system providers may process sensitive personal data for bias detection and correction, and only when strictly necessary with safeguards in place.","answer":"Original Act","why":"The original Article 10(5) scope is limited to high-risk AI system providers."},"b":{"text":"Providers and deployers of other AI systems and GPAI models, and deployers of high-risk AI systems, may process sensitive personal data for bias detection and correction when strictly necessary with safeguards in place.","answer":"Amended Act","why":"The Amendments Regulation widens Article 10(5)'s scope beyond just high-risk providers, while keeping the strict-necessity/safeguards test unchanged."},"citation":"EU AI Act Art. 10(5) (original limits) and new Art. 4a, inserted by Regulation (EU) 2026/1744 Art. 1(6) (the \"Digital Omnibus\") — verified against the consolidated text on eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"},{"id":"II.C-amend-005","area":"II.C","set":"eu-amendments","asOf":"2026-07-29","status":"stable","dimension":"European AI Office's regulatory powers over GPAI-based systems","buckets":["Original Act","Amended Act"],"a":{"text":"The European AI Office and member state regulators have overlapping regulatory powers for AI systems built on GPAI models, where the same provider developed both the model and the system.","answer":"Original Act","why":"The original allocation of powers between the AI Office and national regulators is overlapping, not exclusive."},"b":{"text":"The European AI Office has exclusive competence over AI systems built on GPAI models where the same provider developed both — except for high-risk systems under Annex I and specific Annex III categories such as critical infrastructure and law enforcement.","answer":"Amended Act","why":"The Amendments Regulation moves the AI Office from overlapping to exclusive competence for this category, carving out Annex I and specific Annex III high-risk systems."},"citation":"EU AI Act Art. 75(1), as amended by Regulation (EU) 2026/1744 Art. 1(31) (the \"Digital Omnibus\") — verified against the consolidated text on eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"},{"id":"II.C-amend-006","area":"II.C","set":"eu-amendments","asOf":"2026-07-29","status":"stable","dimension":"proportionality of penalties for small mid-cap (SMC) enterprises","buckets":["Original Act","Amended Act"],"a":{"text":"Enforcement penalties are capped for small and medium-sized enterprises (SMEs), but small mid-cap (SMC) enterprises get no such cap.","answer":"Original Act","why":"The original penalty regime's proportionality cap applies to SMEs only."},"b":{"text":"SMEs and SMCs pay the lower of the percentage of global annual turnover or the fixed amount, while larger organisations pay the higher value.","answer":"Amended Act","why":"The Amendments Regulation extends the SME proportionality cap to SMCs on the same lower-of-two-values basis."},"citation":"EU AI Act Art. 99(6a), inserted by Regulation (EU) 2026/1744 Art. 1(38) (the \"Digital Omnibus\") — verified against the consolidated text on eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"},{"id":"II.C-amend-007","area":"II.C","set":"eu-amendments","asOf":"2026-07-29","status":"stable","dimension":"high-risk AI systems regulated by the EU Machinery Regulation","buckets":["Original Act","Amended Act"],"a":{"text":"AI systems that are products, or safety components of products, regulated by the EU Machinery Regulation must directly adhere to the AI Act's high-risk AI system requirements.","answer":"Original Act","why":"In the original Annex I, the Machinery Regulation sits in Section A, which triggers direct high-risk AI Act requirements."},"b":{"text":"The Machinery Regulation sits in Annex I Section B, so the AI Act's high-risk AI system requirements do not apply to it directly.","answer":"Amended Act","why":"The Amendments Regulation reclassifies the Machinery Regulation into Annex I Section B, removing the direct high-risk trigger."},"citation":"EU AI Act Annex I, as amended by Regulation (EU) 2026/1744 Art. 1(41) — point 1 of Section A deleted, Regulation (EU) 2023/1230 added to Section B (the \"Digital Omnibus\") — verified against the consolidated text on eur-lex.europa.eu/eli/reg/2026/1744/oj/eng"},{"id":"ii-tp-01","area":"II.D","set":"ii-topup","asOf":"2026-08","status":"stable","dimension":"shared vocabulary vs certifiable management system","buckets":["ISO/IEC 22989","ISO/IEC 42001"],"a":{"text":"Defines the common vocabulary and conceptual framework for AI — terms like AI system, machine learning, training, inference, and bias — so every other AI standard rests on the same definitions.","answer":"ISO/IEC 22989","why":"This is the dictionary of AI governance: it eliminates ambiguity in technical, legal, and governance discussions by fixing what the words mean, but it imposes no organisational requirements of its own."},"b":{"text":"Specifies a certifiable AI management system (AIMS) — policies, governance structures, risk controls, and oversight mechanisms an organisation can be independently audited against.","answer":"ISO/IEC 42001","why":"Published 2023, this moves AI governance from voluntary principles to auditable, certifiable practice — the AI-governance equivalent of ISO/IEC 27001 for information security."},"citation":"AIGP Study Guide §II.D ISO Core AI Standards (SG)"},{"id":"ii-tp-02","area":"II.D","set":"ii-topup","asOf":"2026-08","status":"stable","dimension":"assessing effects on people/society vs guiding organisational risk management","buckets":["ISO/IEC 42005","ISO/IEC 23894"],"a":{"text":"Guides how an organisation assesses an AI system's effects on individuals and societies — an AI impact assessment standard.","answer":"ISO/IEC 42005","why":"42005 scopes the assessment around the people and communities the system touches, not the organisation's internal risk posture.","externalSource":true},"b":{"text":"Guides how an organisation manages AI-related risk across its own processes — risk identification, analysis, evaluation, and treatment.","answer":"ISO/IEC 23894","why":"23894 is the AI-specific companion to ISO 31000's generic risk-management process, aimed at the organisation's risk function rather than the affected individual."},"citation":"ISO/IEC 42005:2025, Information technology — Artificial intelligence — AI system impact assessment, iso.org/standard/42005 (published April 2025; verified 2026-08-02). ISO/IEC 23894:2023, Information technology — Artificial intelligence — Guidance on risk management, iso.org/standard/77304 (verified 2026-08-02); also per AIGP Study Guide §II.D (SG).","externalSource":true},{"id":"ii-tp-03","area":"II.B","set":"ii-topup","asOf":"2026-08","status":"stable","dimension":"deceptive marketing vs unsafe design","buckets":["Consumer protection (UDAP/FTC Act)","Product liability (design defect)"],"a":{"text":"A marketing bot's ad copy claims the AI hiring tool is 'completely objective'; the system later exhibits bias and the regulator calls the claim deceptive.","answer":"Consumer protection (UDAP/FTC Act)","why":"The FTC Act bars false or exaggerated claims about what a product can do — the defect here is in what was said about the system, not in the system itself."},"b":{"text":"A flaw in how the system was engineered means it fails to perform as safely as consumers are entitled to expect, and a user is injured as a result.","answer":"Product liability (design defect)","why":"Under doctrines like the EU Product Liability Directive, manufacturers can be strictly liable for a defective design even without proof of negligence — the harm traces to engineering, not messaging."},"citation":"AIGP Study Guide §II.B Consumer Protection Laws / Product Liability and Safety Laws (SG)"},{"id":"ii-tp-04","area":"II.D","set":"ii-topup","asOf":"2026-08","status":"stable","dimension":"high-level guidelines vs risk-identification framework","buckets":["OECD AI Principles","NIST AI RMF"],"a":{"text":"Widely adopted, high-level principles for trustworthy AI — a values-level reference point rather than a step-by-step process.","answer":"OECD AI Principles","why":"The OECD's contribution is normative and international: what trustworthy AI should look like, not how to operationalise finding and fixing its risks."},"b":{"text":"A U.S.-originated but globally influential framework built specifically to help organisations identify and mitigate AI risks in practice.","answer":"NIST AI RMF","why":"The RMF is operational scaffolding — functions like Govern, Map, Measure, and Manage — that an organisation actually runs, distinct from OECD's principle-level guidance."},"citation":"AIGP Study Guide §II.D Industry Standards and Tools (SG)"},{"id":"ii-tp-05","area":"II.D","set":"ii-topup","asOf":"2026-08","status":"stable","dimension":"what the tool records — model facts vs anticipated harms","buckets":["Model card","Impact assessment"],"a":{"text":"A published summary of a model's data sources, known risks, and mitigations, written in language a non-expert can understand.","answer":"Model card","why":"A model card documents what the model already is and does — transparency about a finished artefact."},"b":{"text":"A structured exercise, run before deployment, to anticipate and manage the potential risks and harms an AI system could cause.","answer":"Impact assessment","why":"An impact assessment looks forward at consequences for people and society, not backward at what the model card already discloses about the artefact."},"citation":"AIGP Study Guide §II.D Industry Standards and Tools (SG)"},{"id":"ii-tp-06","area":"II.B","set":"ii-topup","asOf":"2026-08","status":"stable","dimension":"assurance of quality vs shifting the cost of a claim","buckets":["Warranty","Indemnity"],"a":{"text":"The vendor contractually promises the AI model will perform to a stated standard; if it doesn't, the deployer has a contract remedy against the vendor.","answer":"Warranty","why":"A warranty is a promise about the product itself — it fails or holds based on whether the system performs as stated."},"b":{"text":"The vendor agrees to cover the deployer's losses if a third party sues over IP infringement or a regulatory violation caused by the model — but the clause is voided once the deployer uses the model outside the jurisdictions the vendor covered.","answer":"Indemnity","why":"Indemnity reallocates who pays for a third-party claim; it says nothing about whether the model itself works, and — as exam-prep materials note — it can be voided by deploying outside the covered jurisdiction."},"citation":"AIGP Study Guide §IV.B Vendor Contractual Terms (SG, l.887)"},{"id":"ii-tp-07","area":"II.B","set":"ii-topup","asOf":"2026-08","status":"stable","dimension":"fault-based vs no-fault liability","buckets":["Negligence","Strict liability"],"a":{"text":"A claimant must show the developer failed to exercise reasonable care in designing, testing, or validating the system before liability attaches.","answer":"Negligence","why":"Negligence liability turns on proving a failure of care — no proof of fault, no claim."},"b":{"text":"Under the EU Product Liability Directive, a manufacturer can be held liable for damage caused by a defective AI-enabled product even without any proof of negligence.","answer":"Strict liability","why":"Strict liability removes the fault question entirely: if the product was defective and caused harm, liability can attach regardless of how carefully the manufacturer behaved."},"citation":"AIGP Study Guide §II.B Product Liability and Safety Laws (SG)"},{"id":"ii-tp-08","area":"II.B","set":"ii-topup","asOf":"2026-08","status":"stable","dimension":"sector-specific duty — patient privacy vs credit-decision transparency","buckets":["HIPAA (healthcare)","FCRA/ECOA (finance)"],"a":{"text":"An AI diagnostic tool that processes protected health information must comply with privacy and security rules covering access controls, audit logs, and breach notification.","answer":"HIPAA (healthcare)","why":"HIPAA's obligations attach the moment protected health information is processed, regardless of whether a decision is even automated."},"b":{"text":"An AI model that denies a consumer a loan must provide an adverse-action notice explaining the key factors driving the decision, and the underlying credit-scoring model must not produce discriminatory outcomes.","answer":"FCRA/ECOA (finance)","why":"These finance-sector laws require explainability and non-discrimination specifically for credit decisions — a different duty, in a different sector, from HIPAA's data-handling rules."},"citation":"AIGP Study Guide §II.B Sector-Specific Regulations — Healthcare (SG), Finance (SG, l.1279)"}],"ladders":[{"id":"II.C-ladder-penalties","area":"II.C","asOf":"2026-07-26","status":"stable","title":"Penalty bands","prompt":"Order these breaches from the highest maximum penalty to the lowest.","citation":"Ch6 §Penalties for Non-compliance","steps":[{"label":"Breach of the Article 5 prohibitions","detail":"Up to €35 million or 7% of total worldwide annual turnover, whichever is higher."},{"label":"Non-compliance with other obligations","detail":"Up to €15 million or 3% — provider and deployer duties, notified body and transparency obligations."},{"label":"Supplying incorrect or misleading information to authorities","detail":"Up to €7.5 million or 1%."}]},{"id":"II.C-ladder-phases","area":"II.C","asOf":"2026-07-26","status":"superseded","title":"EU AI Act phase-in","prompt":"Order the EU AI Act milestones from earliest to latest.","dualTrack":true,"citation":"Ch6 §EU AI Act Implementation","currency":{"book":"High-risk obligations apply from 2 August 2026; Annex I embedded from 2 August 2027.","changed":"Digital Omnibus (May 2026): standalone Annex III deferred to 2 December 2027; Annex I embedded to 2 August 2028.","exam":"BoK v2.1 predates the Omnibus. Learn the enacted track for the exam and the amended track for practice."},"steps":[{"label":"Entry into force","date":"2024-08-01","amended":"2024-08-01","detail":"The Act enters into force; obligations phase in afterwards."},{"label":"Prohibitions and AI literacy","date":"2025-02-02","amended":"2025-02-02","detail":"Article 5 prohibited practices and Article 4 AI literacy duties apply."},{"label":"GPAI obligations and governance","date":"2025-08-02","amended":"2025-08-02","detail":"General-purpose AI model obligations, governance bodies and most penalty provisions apply."},{"label":"Article 50 transparency","date":"2026-08-02","amended":"2026-08-02","detail":"Transparency duties for AI interaction, synthetic content, deepfakes and emotion recognition. Unchanged by the Omnibus."},{"label":"High-risk: standalone Annex III","date":"2026-08-02","amended":"2027-12-02","detail":"Employment, credit, education, essential services and similar. Deferred roughly 16 months."},{"label":"GPAI models placed before Aug 2025","date":"2027-08-02","amended":"2027-08-02","detail":"Legacy general-purpose models must reach compliance."},{"label":"High-risk: Annex I embedded products","date":"2027-08-02","amended":"2028-08-02","detail":"AI inside regulated products under existing sectoral law. Deferred 12 months."}]}],"timeline":{"id":"II-timeline-global","title":"Global Obligations Timeline","asOf":"2026-07-29","prompt":"Place each milestone on the timeline, then answer: on a given date, which obligations actually bind you?","note":"Jurisdictions marked scope \"horizon\" are professional currency rather than blueprint content; they are excluded from mastery scoring. \"Ongoing / uncertain\" covers proposed bills and rolling state/regional developments with no confirmed date.","buckets":["Already in force","H2 2026","Ongoing / uncertain","2027","2028"],"milestones":[{"id":"tl-eu-001","jurisdiction":"European Union","instrument":"EU AI Act","milestone":"Prohibited practices and AI-literacy obligations apply","date":"2 Feb 2025","bucket":"Already in force","status":"stable","scope":"bok","note":"Article 5 bans and Article 4 AI-literacy duties; maintain screening and training evidence."},{"id":"tl-eu-002","jurisdiction":"European Union","instrument":"EU AI Act","milestone":"GPAI provider obligations apply","date":"2 Aug 2025","bucket":"Already in force","status":"stable","scope":"bok","note":"Technical documentation, training-content summary, copyright-policy and systemic-risk evidence for GPAI providers."},{"id":"tl-cn-001","jurisdiction":"China","instrument":"Algorithm Recommendation / Deep Synthesis / Generative AI Interim Measures","milestone":"Synthetic-content labelling and filing regime in force","date":"in force; labelling since 2025","bucket":"Already in force","status":"stable","scope":"horizon","note":"Assess filing/security-assessment exposure, content controls, user identity and provenance labelling."},{"id":"tl-kr-001","jurisdiction":"South Korea","instrument":"AI Basic Act","milestone":"Takes effect","date":"22 Jan 2026","bucket":"Already in force","status":"stable","scope":"horizon","note":"AI inventory, high-impact use-case assessment, transparency, safety and human-oversight controls; check extraterritorial reach."},{"id":"tl-us-ca-001","jurisdiction":"California, US","instrument":"California AI transparency / training-data disclosure laws","milestone":"In force","date":"1 Jan 2026","bucket":"Already in force","status":"stable","scope":"horizon","note":"Public AI disclosures and training-data/governance evidence where the law applies."},{"id":"tl-us-tx-001","jurisdiction":"Texas, US","instrument":"TRAIGA (Texas Responsible AI Governance Act)","milestone":"In force","date":"1 Jan 2026","bucket":"Already in force","status":"stable","scope":"horizon","note":"Prohibited uses, government deployment controls, biometric/consumer and synthetic-media governance."},{"id":"tl-uae-001","jurisdiction":"UAE","instrument":"UAE AI Charter","milestone":"Current policy guidance","date":"current","bucket":"Already in force","status":"in-flux","scope":"horizon","note":"Binding duties arise from underlying federal/emirate/free-zone rules; segment controls for mainland, DIFC and ADGM."},{"id":"tl-uk-001","jurisdiction":"United Kingdom","instrument":"Regulator-led regime (ICO, FCA, PRA, CMA, Ofcom, AI Safety Institute)","milestone":"No omnibus AI Act","date":"current","bucket":"Already in force","status":"stable","scope":"horizon","note":"Map each use case to sector, privacy, equality, consumer and online-safety obligations; watch regulator guidance."},{"id":"tl-sg-001","jurisdiction":"Singapore","instrument":"Model AI Governance Framework / AI Verify","milestone":"Voluntary but procurement-influential","date":"current","bucket":"Already in force","status":"stable","scope":"horizon","note":"AI Verify-style testing, model documentation and assurance evidence for government/enterprise buyers."},{"id":"tl-jp-001","jurisdiction":"Japan","instrument":"Sectoral rules + AI governance guidance","milestone":"Predominantly soft-law","date":"current","bucket":"Already in force","status":"stable","scope":"horizon","note":"Documented risk management, data governance, transparency and sector-specific assessments."},{"id":"tl-ca-001","jurisdiction":"Canada","instrument":"Privacy / human-rights / consumer / IP rules","milestone":"AIDA (Bill C-27) not enacted","date":"current","bucket":"Already in force","status":"stable","scope":"horizon","note":"Do not treat AIDA as law; manage automated-decision and privacy risk under current regimes."},{"id":"tl-au-001","jurisdiction":"Australia","instrument":"Privacy / consumer / online-safety / discrimination rules","milestone":"No comprehensive AI Act","date":"current","bucket":"Already in force","status":"stable","scope":"horizon","note":"Apply privacy-impact, consumer-protection, safety and sectoral controls today; track proposed guardrails."},{"id":"tl-br-001","jurisdiction":"Brazil","instrument":"LGPD + sectoral / consumer rules","milestone":"Broad AI bill still legislative","date":"current","bucket":"Already in force","status":"stable","scope":"horizon","note":"Build privacy, automated-decision explanation and data-governance evidence; monitor the AI bill."},{"id":"tl-in-001","jurisdiction":"India","instrument":"DPDP framework, IT Rules, sector controls","milestone":"No standalone horizontal AI act","date":"current","bucket":"Already in force","status":"stable","scope":"horizon","note":"Apply consent/data controls and content/intermediary obligations; monitor AI governance proposals."},{"id":"tl-my-001","jurisdiction":"Malaysia","instrument":"PDPA, Cyber Security Act 2024, Online Safety Act 2024","milestone":"Existing-law baseline","date":"current","bucket":"Already in force","status":"stable","scope":"horizon","note":"AI-system inventory, privacy/data controls, cyber incident workflows and content-risk procedures."},{"id":"tl-eu-003","jurisdiction":"European Union","instrument":"EU AI Act","milestone":"Transparency obligations apply (AI-interaction disclosure, marked synthetic content)","date":"2 Aug 2026","bucket":"H2 2026","status":"stable","scope":"bok","note":"Chatbot disclosure, machine-readable provenance marking and deepfake/public-interest labelling."},{"id":"tl-eu-004","jurisdiction":"European Union","instrument":"EU AI Act","milestone":"Becomes broadly applicable, subject to transition exceptions","date":"2 Aug 2026","bucket":"H2 2026","status":"stable","scope":"bok","note":"Complete AI inventory/classification and assign provider/deployer/importer/distributor roles."},{"id":"tl-eu-005","jurisdiction":"European Union","instrument":"Cyber Resilience Act","milestone":"Vulnerability and severe-incident reporting begins","date":"11 Sep 2026","bucket":"H2 2026","status":"stable","scope":"bok","note":"For AI-enabled products with digital elements: vulnerability handling, coordinated disclosure, SBOM and reporting."},{"id":"tl-eu-006","jurisdiction":"European Union","instrument":"EU AI Act","milestone":"Ban on non-consensual intimate-imagery/CSAM systems; legacy GenAI marking deadline","date":"2 Dec 2026","bucket":"H2 2026","status":"stable","scope":"bok","note":"Article 5 ban on non-consensual intimate-imagery/CSAM systems applies from this date; the AI-output marking deadline (Article 50(2)) is postponed to this date for legacy GenAI systems only, per the Amendments Regulation (the \"Digital Omnibus\")."},{"id":"tl-my-002","jurisdiction":"Malaysia","instrument":"AI Governance Bill","milestone":"Proposed — consultation under way","date":"late 2026–2027","bucket":"Ongoing / uncertain","status":"in-flux","scope":"horizon","note":"Build readiness for lifecycle roles, risk tiering, incident reporting and central-authority oversight."},{"id":"tl-ca-002","jurisdiction":"Canada","instrument":"Potential replacement federal AI legislation","milestone":"Policy / legislative watch after AIDA stalled","date":"late 2026–2027","bucket":"Ongoing / uncertain","status":"in-flux","scope":"horizon","note":"Monitor a replacement legislative vehicle; do not base compliance dates on AIDA."},{"id":"tl-au-002","jurisdiction":"Australia","instrument":"Proposed mandatory AI guardrails","milestone":"Policy / legislative watch","date":"late 2026–2027","bucket":"Ongoing / uncertain","status":"in-flux","scope":"horizon","note":"Prepare accountability, testing, data-governance, transparency and contestability controls; dates unconfirmed."},{"id":"tl-br-002","jurisdiction":"Brazil","instrument":"PL 2338/2023 or successor AI framework","milestone":"Legislative watch","date":"late 2026–2027","bucket":"Ongoing / uncertain","status":"in-flux","scope":"horizon","note":"Prepare EU-style risk classification, governance and impact-assessment capability; enactment date uncertain."},{"id":"tl-us-co-001","jurisdiction":"Colorado, US","instrument":"Colorado automated decision-making technology law","milestone":"Scheduled, after 2026 replacement of the prior AI Act","date":"1 Jan 2027","bucket":"2027","status":"stable","scope":"horizon","note":"Impact/risk assessments, consumer notices, review/appeal process, vendor controls and discrimination testing."},{"id":"tl-eu-007","jurisdiction":"European Union","instrument":"EU model-evaluation and secure testing infrastructure","milestone":"Expected operational for advanced AI","date":"2027","bucket":"2027","status":"in-flux","scope":"bok","note":"A regulatory-support milestone, not a direct company deadline — use as a benchmark for frontier/GPAI governance."},{"id":"tl-eu-008","jurisdiction":"European Union","instrument":"Cyber Resilience Act","milestone":"Main obligations apply","date":"11 Dec 2027","bucket":"2027","status":"stable","scope":"bok","note":"Secure-by-design, vulnerability-management, technical documentation, conformity and lifecycle support."},{"id":"tl-eu-009","jurisdiction":"European Union","instrument":"EU AI Act","milestone":"Annex III high-risk duties apply (biometrics, critical infrastructure, employment, justice, etc.)","date":"2 Dec 2027","bucket":"2027","status":"stable","scope":"bok","note":"Risk-management system, data governance, logging, human oversight and post-market monitoring. Postponed from 2 Aug 2026 to this date by the Amendments Regulation (the \"Digital Omnibus\")."},{"id":"tl-us-multi-001","jurisdiction":"United States (multiple states)","instrument":"Rolling state laws","milestone":"Privacy, biometrics, deepfakes, employment AI, synthetic content","date":"2027–2028","bucket":"Ongoing / uncertain","status":"in-flux","scope":"horizon","note":"Operate a state-law rules engine; there is no single “US-compliant” control set or federal omnibus AI law."},{"id":"tl-uae-002","jurisdiction":"UAE","instrument":"Sectoral AI standards and regulator expectations","milestone":"Continued development","date":"2027–2028","bucket":"Ongoing / uncertain","status":"in-flux","scope":"horizon","note":"Monitor federal ministries, the UAE AI Office, CBUAE, DFSA, FSRA, VARA, DIFC and ADGM per footprint."},{"id":"tl-sa-gcc-001","jurisdiction":"Saudi Arabia / GCC","instrument":"National data, privacy, cloud, cybersecurity and sector frameworks","milestone":"Expanding AI governance","date":"2027–2028","bucket":"Ongoing / uncertain","status":"in-flux","scope":"horizon","note":"Map localisation, cross-border transfer, cloud assurance and critical-infrastructure requirements before deployment."},{"id":"tl-asean-001","jurisdiction":"ASEAN","instrument":"National AI rules and guidance","milestone":"Expected to diversify","date":"2027–2028","bucket":"Ongoing / uncertain","status":"in-flux","scope":"horizon","note":"Malaysia is the primary hard-law watch; Singapore remains assurance-led. Keep country-specific overlays."},{"id":"tl-eu-010","jurisdiction":"European Union","instrument":"EU AI Act","milestone":"Annex I high-risk systems embedded in regulated products apply","date":"2 Aug 2028","bucket":"2028","status":"stable","scope":"bok","note":"Integrate AI Act evidence with CE marking, product safety, quality management and post-market surveillance. Postponed from 2 Aug 2027 to this date by the Amendments Regulation (the \"Digital Omnibus\")."}]},"map":{"id":"II-map-jurisdictions","title":"Jurisdiction Map","asOf":"2026-08-02","prompt":"Match each instrument to its jurisdiction, then answer what actually binds you there.","note":"Positions are the real coordinates of each jurisdiction, projected onto a Miller-style world map. Labels for dense regions are nudged clear of their marker; the marker itself is always at the true location.","legend":[{"key":"comprehensive","label":"Comprehensive AI law in force"},{"key":"sectoral","label":"Sectoral or partial rules in force"},{"key":"voluntary","label":"Voluntary or non-binding framework"},{"key":"proposed","label":"Proposed, not in force"},{"key":"none","label":"No AI-specific statute"},{"key":"treaty","label":"Binding treaty — binds states, not companies"}],"jurisdictions":[{"id":"map-eu","name":"European Union","coverage":"comprehensive","scope":"bok","instruments":["EU AI Act","Digital Omnibus on AI (2026)","GDPR","Product Liability Directive (revised)"],"effective":"2024-08-01 onward, phased; Annex III high-risk deferred to 2027-12-02 (Digital Omnibus)","obligations":["Prohibitions and AI literacy since 2025-02-02; GPAI provider duties since 2025-08-02","Article 50 transparency (chatbot disclosure, synthetic-content marking, deepfake labelling) enforceable  AIDA is dead — it died on the order paper in January 2025 and was never revived — yet it is still widely cited as pending.","lat":58.0,"lon":-106.0,"short":"Canada","x":17.808,"y":24.782},{"id":"map-br","name":"Brazil","coverage":"proposed","scope":"horizon","instruments":["PL 2338 (pending)","LGPD"],"effective":"not in force","obligations":["EU-flavoured risk-based bill passed the Senate 2024-12-10, pending in the Chamber","LGPD applies to personal data in the meantime"],"tell":"Stalled, not abandoned. Meanwhile the data protection law does the work.","lat":-10.0,"lon":-52.0,"short":"Brazil","x":32.808,"y":69.348},{"id":"map-in","name":"India","coverage":"voluntary","scope":"horizon","instruments":["MeitY India AI Governance Guidelines (Nov 2025)","DPDP Act + DPDP Rules (notified 2025-11-13)"],"effective":"guidelines Nov 2025; DPDP Rules phasing through 2027","obligations":["No standalone AI Act","Official non-binding AI governance guidelines from MeitY","DPDP Rules notified 2025-11-13, core data-fiduciary duties phasing in","Sectoral regulation continues to apply"],"tell":"Large AI market with an official voluntary framework — MeitY guidelines plus a phasing data-protection regime, still no comprehensive AI statute.","lat":22.0,"lon":79.0,"short":"India","labelDx":0,"labelDy":3.0,"x":69.196,"y":50.271},{"id":"map-uk","name":"United Kingdom","coverage":"voluntary","scope":"horizon","instruments":["Pro-innovation framework","UK GDPR","existing regulators"],"effective":"framework guidance","obligations":["No comprehensive AI statute","Cross-sector principles delivered through existing regulators","UK GDPR continues to apply"],"tell":"Principles delegated to existing regulators rather than a new statute.","lat":54.0,"lon":-2.0,"short":"UK","labelDx":-4.0,"labelDy":-3.0,"x":46.696,"y":28.103},{"id":"map-au","name":"Australia","coverage":"voluntary","scope":"horizon","instruments":["Voluntary AI Safety Standard","National AI Plan (Dec 2025)"],"effective":"voluntary","obligations":["Voluntary guardrails and guidance for AI adoption","Binding AI requirements apply to Commonwealth agencies only (from 2026-06-15)"],"tell":"The 2024 mandatory-guardrails proposal was abandoned in the December 2025 National AI Plan — Australia chose to stay voluntary, not to drift toward binding rules.","lat":-25.0,"lon":134.0,"short":"Australia","x":84.474,"y":78.472},{"id":"map-coe","name":"Council of Europe","coverage":"treaty","scope":"horizon","instruments":["Framework Convention on AI (CETS No. 225)"],"effective":"in force 2025-11-01; EU accession effective 2026-09-01","obligations":["First binding international AI treaty, in force since 2025-11-01","Binds States Parties, not companies directly","EU ratified 2026-05-15; Convention takes effect for the EU 2026-09-01","National implementation decides how far the private sector is reached"],"tell":"International instrument, not a national law — in force and binding, but on states: companies feel it only through national implementation.","lat":48.6,"lon":7.75,"short":"CoE","labelDx":6,"labelDy":-2.0,"x":49.405,"y":32.323},{"id":"map-sg","name":"Singapore","coverage":"voluntary","scope":"horizon","instruments":["Model AI Governance Framework (+ GenAI edition 2024)","Model AI Governance Framework for Agentic AI (2026-01-22)","AI Verify testing framework"],"effective":"voluntary; agentic-AI framework launched 2026-01-22","obligations":["No binding AI-specific statute","Frameworks address developers, deployers and agent operators — all non-binding","AI Verify process checks and technical tests for AI assurance","Sector regulators issue AI guidance under existing binding law (PDPA, MAS FEAT)"],"tell":"The voluntary exemplar — world's first governance framework specifically for agentic AI, and still nothing AI-specific is enforceable.","lat":1.35,"lon":103.82,"short":"SG","labelDx":3.0,"labelDy":2.0,"x":76.091,"y":62.643},{"id":"map-tw","name":"Taiwan","coverage":"voluntary","scope":"horizon","instruments":["AI Basic Act"],"effective":"2026-01-14 (promulgated and in force)","obligations":["Seven governance principles codified, binding on government action","No operational obligations or penalties on private business yet","MODA must build a risk-classification framework; sector rules to follow","Implementing measures due within 24 months of effectiveness"],"tell":"The Japan pattern repeated: a binding framework statute in force with no business duties — obligations arrive only via forthcoming risk-classification and sectoral rules.","lat":25.04,"lon":121.56,"short":"TW","labelDx":3.0,"labelDy":2.0,"x":81.019,"y":48.38},{"id":"map-pe","name":"Peru","coverage":"comprehensive","scope":"horizon","instruments":["Law 31814","Supreme Decree 115-2025-PCM (regulation)"],"effective":"regulation in force 2026-01-22","obligations":["Risk tiers including prohibited and high-risk uses","Transparency, security and audit duties","Reaches developers and implementers/deployers, weighted to high-risk deployment","Governance under PCM/SGTD with phased deadlines"],"tell":"First binding general AI framework in force in Latin America — promotion-oriented and lighter than the EU, while Brazil's bill is still pending.","lat":-12.05,"lon":-77.04,"short":"PE","labelDx":0,"labelDy":3.0,"x":25.852,"y":70.57},{"id":"map-ch","name":"Switzerland","coverage":"none","scope":"horizon","instruments":["Federal Council sectoral approach (Feb 2025)","CoE Framework Convention (signed 2025-03-27, not ratified)"],"effective":"draft bill due for consultation by end-2026","obligations":["No AI-specific binding instrument in force","Existing technology-neutral law applies (FADP, product, sectoral finance/medical rules)","CoE Convention implementation bill in drafting","Cross-sectoral rules only where fundamental rights demand"],"tell":"The deliberate minimalist — a lean, sector-specific approach chosen on purpose, next door to the EU's comprehensive regime.","lat":46.95,"lon":7.45,"short":"CH","labelDx":-5,"labelDy":-3.0,"x":49.321,"y":33.56},{"id":"map-ae","name":"United Arab Emirates","coverage":"sectoral","scope":"horizon","instruments":["DIFC Data Protection Regulation 10","UAE AI Charter (non-binding)","Federal AI and Data Authority (announced 2026-06-14)"],"effective":"DIFC Reg 10 fully enforced from 2026-01-01","obligations":["Impact assessment, transparency and audit duties for autonomous systems processing personal data — DIFC only","Binds those who provide and those who deploy such systems, in data-protection roles","12-principle national AI Charter is aspirational, not enforceable","New federal AI/data regulator announced; no horizontal AI statute yet"],"tell":"Binding AI rules live only inside a financial free zone — the scope of the sectoral rule is a place, not an industry.","lat":24.45,"lon":54.38,"short":"AE","labelDx":0,"labelDy":3.0,"x":62.358,"y":48.749},{"id":"map-ke","name":"Kenya","coverage":"proposed","scope":"horizon","instruments":["AI Bill 2026 (Senate Bill No. 4)","National AI Strategy 2025-2030"],"effective":"Senate first reading 2026-04-02; not enacted","obligations":["Bill would create an Office of the AI Commissioner as primary regulator","Commissioner-licensing model with risk rules and penalties, if enacted","Must still pass the National Assembly before assent","National AI Strategy is the current operative framework"],"tell":"Africa's strongest legislative candidate — a licensing-commissioner model, not an EU-style provider/deployer chain.","lat":-1.29,"lon":36.82,"short":"KE","labelDx":0,"labelDy":3.0,"x":57.48,"y":64.198}],"projection":{"type":"miller-fit","note":"x/y are computed at build time from lat/lon by tools/build_aigp_game.py"}},"campaign":{"id":"II-campaign","title":"Regulatory Risk","asOf":"2026-08-02","prompt":"Expand your AI company worldwide without running out of compliance capital.","config":{"turns":15,"startCapital":5,"capitalCap":8,"gateFailCost":1,"escalateEveryTurns":2,"l3Cost":2,"roleShiftMax":2,"roleShiftMinTurn":5,"tiers":{"comprehensive":{"gateSize":3,"market":5,"noticeOnFail":true,"entryCost":2},"sectoral":{"gateSize":2,"market":2,"noticeOnFail":true,"entryCost":1},"proposed":{"gateSize":2,"market":1,"noticeOnFail":false,"entryCost":0},"voluntary":{"gateSize":2,"market":1,"noticeOnFail":false,"entryCost":0},"none":{"gateSize":1,"market":1,"noticeOnFail":false,"entryCost":0},"treaty":{"gateSize":2,"market":1,"noticeOnFail":false,"entryCost":0}},"grades":[["A+",26],["A",21],["B",14],["C",5],["D",3],["F",-999]]},"roles":[{"id":"provider","name":"Provider","definition":"Develops an AI system or has one developed and places it on the market or puts it into service under its own name or trademark."},{"id":"deployer","name":"Deployer","definition":"Uses an AI system under its own authority, other than in a personal non-professional activity."},{"id":"importer","name":"Importer","definition":"Established in the EU and places on the market a system bearing the name or trademark of a third-country entity."}],"hats":[{"id":"dpo","name":"DPO","blurb":"Privacy-office instincts — you read enforcement notices for breakfast, and notice-heavy events find you.","eventTags":["dpo"]},{"id":"product","name":"Product Lead","blurb":"Ship first, comply fast — market-facing events and sandbox openings find you.","eventTags":["product"]},{"id":"counsel","name":"Compliance Counsel","blurb":"You brief the board on exposure — status-change and enforcement events find you.","eventTags":["counsel"]}],"operations":[{"id":"biometric","name":"Biometric identification"},{"id":"genai","name":"Public generative AI service"},{"id":"hiring","name":"Employment screening"},{"id":"credit","name":"Credit & lending decisions"},{"id":"chatbot","name":"Consumer chatbot"}],"territories":[{"mapId":"map-eu","unlock":{"holdsAtLeast":2},"roleSensitive":true,"opsHooks":["biometric","genai","hiring","credit","chatbot"],"teach":"Risk tiers + product-safety machinery; the only 3-way role split."},{"mapId":"map-kr","unlock":{"holdsAtLeast":2},"roleSensitive":true,"opsHooks":["biometric","genai","hiring","credit"],"teach":"Second comprehensive law in force — operator taxonomy, not EU role names."},{"mapId":"map-cn","unlock":{"holdsAtLeast":2},"roleSensitive":true,"opsHooks":["genai","chatbot"],"teach":"A stack of binding measures — filing and content control, not one statute."},{"mapId":"map-jp","unlock":{"start":true},"roleSensitive":false,"opsHooks":[],"teach":"A statute with no business duties — 'has an AI law' does not mean 'has AI obligations'."},{"mapId":"map-us","unlock":{"start":true},"roleSensitive":false,"opsHooks":["biometric","genai","hiring","credit","chatbot"],"teach":"No federal AI act — FTC §5, ECOA and existing statutes do the enforcing."},{"mapId":"map-us-co","unlock":{"requiresHeld":["map-us"]},"roleSensitive":true,"opsHooks":[],"teach":"Repeal-and-replace churn — SB 24-205 became SB 26-189; a compliance date is not a fact you memorise once."},{"mapId":"map-us-il","unlock":{"requiresHeld":["map-us"]},"roleSensitive":false,"opsHooks":["hiring","biometric"],"teach":"Civil-rights amendment plus BIPA — AI duties grafted onto existing law."},{"mapId":"map-us-tx","unlock":{"requiresHeld":["map-us"]},"roleSensitive":true,"opsHooks":["biometric","hiring","credit"],"teach":"Third state comprehensive law — intent-based and light-touch, with its own developer/deployer split."},{"mapId":"map-us-nyc","unlock":{"requiresHeld":["map-us"]},"roleSensitive":true,"opsHooks":["hiring"],"teach":"City-level hiring rule — the earliest operative AI audit duty anywhere."},{"mapId":"map-us-ca","unlock":{"requiresHeld":["map-us"]},"roleSensitive":true,"opsHooks":["genai","hiring","credit","chatbot"],"teach":"Closest US analogue to GDPR-style ADM rights — provenance, training data, bots."},{"mapId":"map-ca","unlock":{"start":true},"roleSensitive":false,"opsHooks":[],"teach":"AIDA is dead — the voluntary code is what actually operates."},{"mapId":"map-br","unlock":{"start":true},"roleSensitive":false,"opsHooks":[],"teach":"PL 2338 still pending — the data-protection law does the work meanwhile."},{"mapId":"map-in","unlock":{"start":true},"roleSensitive":false,"opsHooks":[],"teach":"Voluntary MeitY guidelines plus phasing DPDP Rules — no AI statute."},{"mapId":"map-uk","unlock":{"start":true},"roleSensitive":false,"opsHooks":[],"teach":"Principles delegated to existing regulators — no AI statute to cite."},{"mapId":"map-au","unlock":{"start":true},"roleSensitive":false,"opsHooks":[],"teach":"Voluntary by choice — the mandatory-guardrails proposal was abandoned in December 2025."},{"mapId":"map-coe","unlock":{"requiresAnyHeld":["map-eu","map-uk"]},"roleSensitive":false,"opsHooks":[],"teach":"Binding treaty — binds states, not companies; you feel it only through national implementation."},{"mapId":"map-sg","unlock":{"start":true},"roleSensitive":false,"opsHooks":[],"teach":"The voluntary exemplar — Model Framework, AI Verify, first agentic-AI governance framework."},{"mapId":"map-tw","unlock":{"holdsAtLeast":2},"roleSensitive":false,"opsHooks":[],"teach":"The Japan pattern repeated — framework statute in force, business duties still to come."},{"mapId":"map-pe","unlock":{"holdsAtLeast":2},"roleSensitive":false,"opsHooks":["biometric","hiring"],"teach":"First binding general AI framework in Latin America — promotion-oriented, lighter than the EU."},{"mapId":"map-ch","unlock":{"start":true},"roleSensitive":false,"opsHooks":[],"teach":"The deliberate minimalist — a lean, sector-specific approach chosen on purpose, next door to the EU."},{"mapId":"map-ae","unlock":{"holdsAtLeast":2},"roleSensitive":false,"opsHooks":["genai","credit","biometric"],"teach":"Binding rules live only inside a financial free zone — the scope is a place, not an industry."},{"mapId":"map-ke","unlock":{"holdsAtLeast":2},"roleSensitive":false,"opsHooks":[],"teach":"A bill at first reading — a licensing-commissioner model, not a provider/deployer chain."}],"cards":[{"id":"ii-rr-eu-p01","kind":"gate","territory":"map-eu","roles":["provider"],"area":"II.C","fact":"eu-annex3-internal-control-route","q":"From 2 December 2027, your CV-screening system sits in the EU high-risk tier and you want it on the EU market under your own brand. Which route completes first?","options":["An internal-control conformity assessment against the requirements, then CE marking and registration in the EU database","A notified-body (third-party) conformity assessment, mandatory for every high-risk system","A fundamental rights impact assessment carried out by the end customer","An annual independent bias audit with a published summary"],"answer":"An internal-control conformity assessment against the requirements, then CE marking and registration in the EU database","why":"Annex III employment systems use the internal-control route (Art. 43(2)) — self-assess, CE-mark, register. Nearest confusable: (b) third-party assessment is for biometrics without fully applied harmonised standards. (c) is the deployer's FRIA; (d) is NYC LL144. High-risk duties bind from 2027-12-02 (Digital Omnibus deferral), which is why the stem is future-dated.","citation":"Ch6 §Classification Requirements; EU AI Act Art. 43(2); Council 2026-06-29 Omnibus adoption","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-eu-p02","kind":"gate","territory":"map-eu","roles":["provider"],"area":"II.C","fact":"eu-gpai-duties-and-fining","q":"It is 2 August 2026 and you provide a general-purpose AI model on the EU market. Which statement about your position is accurate?","options":["Your GPAI obligations have applied since August 2025, and from today the Commission can fine you up to 3% of global turnover or €15M","GPAI obligations only start today, together with the fining powers","You face the 7% / €35M band reserved for the gravest infringements","Nothing binds you until the high-risk regime applies in December 2027"],"answer":"Your GPAI obligations have applied since August 2025, and from today the Commission can fine you up to 3% of global turnover or €15M","why":"The stagger is the tested point and (b) is the nearest confusable: Art. 53 duties applied from 2025-08-02, while the Commission/AI Office enforcement and fining powers (Art. 101) arrive 2026-08-02. (c) is the prohibited-practices band, not the GPAI band; (d) confuses the GPAI chapter with the Annex III deferral.","citation":"Ch6 §Requirements for General-purpose AI; EU AI Act Art. 101; Regulation (EU) 2026/1744 (Digital Omnibus)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-eu-p03","kind":"gate","territory":"map-eu","roles":["provider"],"area":"II.C","fact":"eu-art50-provider-marking","q":"Your company provides a public generative service producing synthetic images, plus a consumer chatbot, in the EU. As of today, what does Article 50 require of you as provider?","options":["Mark synthetic outputs in a machine-readable way and design the chatbot so users know they are interacting with an AI system","Label each deepfake you publish and inform people exposed to emotion recognition","Nothing yet — the transparency rules were deferred to December 2027 with the rest of the Act","Complete a conformity assessment and affix CE marking to the service"],"answer":"Mark synthetic outputs in a machine-readable way and design the chatbot so users know they are interacting with an AI system","why":"Nearest confusable is (b): deepfake labelling and emotion-recognition disclosure are the DEPLOYER'S Article 50 duties; the provider side is machine-readable marking plus interaction disclosure. (c) misreads the Omnibus — Article 50 became enforceable 2026-08-02 (only a watermarking grace to 2026-12-02 for systems already on the market); (d) is high-risk product machinery, not transparency.","citation":"Ch6 §Limited-risk AI: Targeted Transparency Obligations; EU AI Act Art. 50; Regulation (EU) 2026/1744 (Digital Omnibus)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-eu-p04","kind":"gate","territory":"map-eu","roles":["provider"],"area":"II.C","fact":"eu-workplace-emotion-prohibition","q":"You are pitching an EU launch of a workplace tool that scores employees' emotional state from webcam feeds to flag 'disengagement'. What is its status under the AI Act today?","options":["It cannot be marketed — emotion inference in the workplace has been outlawed since February 2025, save narrow medical and safety exceptions","High-risk — permitted once a conformity assessment is completed","Limited-risk — a transparency notice to staff suffices","Unregulated until December 2027"],"answer":"It cannot be marketed — emotion inference in the workplace has been outlawed since February 2025, save narrow medical and safety exceptions","why":"Nearest confusable is (b): emotion recognition OUTSIDE workplaces and schools sits in Annex III as high-risk, but in the workplace it is an Article 5 prohibited practice — no conformity route legalises it. (d) misapplies the Omnibus: the deferral touched Annex III, while the prohibitions have applied since 2025-02-02.","citation":"Ch6 §Prohibited AI Systems; EU AI Act Art. 5(1)(f)","asOf":"2026-08-02"},{"id":"ii-rr-eu-p05","kind":"gate","territory":"map-eu","roles":["provider"],"area":"II.C","fact":"eu-systemic-risk-incident-reporting","q":"Your frontier model is classified as GPAI with systemic risk. A safety failure causes a serious incident. What is your reporting position today?","options":["Track, document and report the incident and corrective measures to the AI Office without undue delay — a duty live since August 2025","Report to national market surveillance authorities under the high-risk regime, a duty that binds from December 2027","No AI Act duty — incident reporting only arrives with the Annex III regime","Publish the incident in the EU database within 72 hours"],"answer":"Track, document and report the incident and corrective measures to the AI Office without undue delay — a duty live since August 2025","why":"Nearest confusable is (b): Article 73 serious-incident reporting attaches to HIGH-RISK systems and was deferred with Annex III to 2027-12-02; the systemic-risk GPAI duty (Art. 55, to the AI Office) has applied since 2025-08-02. (d) grafts the GDPR's 72-hour breach idiom onto the wrong instrument.","citation":"Ch6 §Additional Obligations for GPAI with Systemic Risk; EU AI Act Art. 55; Regulation (EU) 2026/1744 (Digital Omnibus)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-eu-d01","kind":"gate","territory":"map-eu","roles":["deployer"],"area":"II.C","fact":"eu-art26-deployer-duties","q":"From 2 December 2027 your firm will run a vendor's CE-marked CV-screening system on EU hiring. Which duty set lands on you?","options":["Use per the provider's instructions, assign trained human oversight, ensure relevant input data, monitor operation and keep the generated logs","Draw up the technical documentation and run the conformity assessment","Register the system in the EU database as its provider","Mark the system's outputs as artificially generated"],"answer":"Use per the provider's instructions, assign trained human oversight, ensure relevant input data, monitor operation and keep the generated logs","why":"Article 26 is the deployer's operational set. Nearest confusables: (b) and (c) are the PROVIDER'S pre-market duties — the deployer inherits neither by merely using the system; (d) is the Article 50 synthetic-content marking duty, which belongs to providers of generative systems.","citation":"Ch6 §Shared and Overlapping Responsibilities; EU AI Act Art. 26; Regulation (EU) 2026/1744 (Digital Omnibus)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-eu-d02","kind":"gate","territory":"map-eu","roles":["deployer"],"area":"II.C","fact":"eu-deployer-fria-scope","q":"From December 2027, which EU deployer must complete a fundamental rights impact assessment before first using a high-risk system — and when?","options":["A public body or private operator of public services (plus banks and insurers for certain systems), once before first use","Every deployer of any high-risk system, annually","The provider, before placing the system on the market","Any controller processing high-risk personal data, before processing begins"],"answer":"A public body or private operator of public services (plus banks and insurers for certain systems), once before first use","why":"Nearest confusable is (d): that describes the GDPR Article 35 DPIA. The Article 27 FRIA is deployer-side and limited to public-sector-type deployers plus specified credit/insurance uses — not every deployer, and not annual (b); (c) confuses it with the provider's conformity assessment.","citation":"Ch6 §High-risk AI Systems; EU AI Act Art. 27; Regulation (EU) 2026/1744 (Digital Omnibus)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-eu-d03","kind":"gate","territory":"map-eu","roles":["deployer"],"area":"II.C","fact":"eu-art50-deployer-disclosures","q":"Your marketing team runs AI-generated video of a photorealistic presenter indistinguishable from a real person in EU campaigns, and your retail unit uses a system inferring shoppers' emotions in stores. As deployer, what must you disclose today?","options":["Label the video as artificially generated and inform shoppers they are exposed to emotion recognition — both duties are live now","Nothing until December 2027, when the transparency chapter applies","Only machine-readable watermarking, which is the provider's task anyway","A fundamental rights impact assessment for both uses"],"answer":"Label the video as artificially generated and inform shoppers they are exposed to emotion recognition — both duties are live now","why":"Nearest confusable is (b): the Omnibus deferred Annex III high-risk duties, not Article 50, which became enforceable 2026-08-02. (c) names the PROVIDER'S marking duty — the deployer side is deepfake labelling and informing exposed persons; (d) the FRIA is a high-risk instrument for public-sector-type deployers, not a transparency disclosure.","citation":"Ch6 §Limited-risk AI: Targeted Transparency Obligations; EU AI Act Art. 50(3)-(4); Regulation (EU) 2026/1744 (Digital Omnibus)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-eu-d04","kind":"gate","territory":"map-eu","roles":["deployer"],"area":"II.C","fact":"eu-deployer-oversight-assignment","q":"From December 2027, what will 'human oversight' concretely require of a deployer running a high-risk system?","options":["Assigning it to natural persons with the competence, training and authority to intervene","Designing the system so it can be effectively overseen, with built-in operational constraints","Having a human approve every individual output before it takes effect","Notifying the market surveillance authority of the oversight arrangements"],"answer":"Assigning it to natural persons with the competence, training and authority to intervene","why":"Nearest confusable is (b): enabling oversight by design is the PROVIDER'S Article 14 duty; the deployer's Article 26(2) duty is assigning capable people. (c) overstates — oversight means meaningful ability to intervene, not per-output human approval.","citation":"Ch6 §Human Oversight; EU AI Act Arts. 14, 26(2); Regulation (EU) 2026/1744 (Digital Omnibus)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-eu-i01","kind":"gate","territory":"map-eu","roles":["importer"],"area":"II.C","fact":"eu-importer-verification-duties","q":"From 2 December 2027 your Dublin entity will bring a US developer's high-risk system, sold under the US brand, into the EU market. Before you do, what must you check?","options":["That the conformity assessment was carried out, technical documentation exists and the system bears CE marking — then add your own name and contact details","Nothing — the US developer retains all duties as provider","You must run your own conformity assessment and re-register the system","That the developer appointed you as its authorised representative"],"answer":"That t
