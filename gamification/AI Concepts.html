<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI & ML Concepts</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="icon" type="image/svg+xml" href="assets/misc/favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#15161a; --panel:#1c1e24; --panel2:#24262e; --line:#f0f0f0; --edge:#f0f0f0;
  --ink:#f0f0f0; --dim:#a9a9b2; --primary:#facc15; --secondary:#fd933d;
  --ok:#3ecf7a; --bad:#ff5d5d; --warn:#fd933d; --radius:0px; --shadow:4px; --shadow-lg:8px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f9f9f9; --panel:#ffffff; --panel2:#eeeeee; --line:#111111; --edge:#111111;
         --ink:#111111; --dim:#4d4632; }
}
:root[data-theme=light]{ --bg:#f9f9f9; --panel:#ffffff; --panel2:#eeeeee; --line:#111111;
  --edge:#111111; --ink:#111111; --dim:#4d4632; }
:root[data-theme=dark]{ --bg:#15161a; --panel:#1c1e24; --panel2:#24262e; --line:#f0f0f0;
  --edge:#f0f0f0; --ink:#f0f0f0; --dim:#a9a9b2; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 "Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
header{position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:4px solid var(--edge);padding:12px 16px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font-size:17px;margin:0;letter-spacing:-.3px;text-transform:uppercase;font-weight:700}
.brand .sub{color:var(--dim);font-size:12px}
.home-link{color:var(--ink);font-size:13px;font-weight:700;text-transform:uppercase;
  text-decoration:none;border:2px solid var(--edge);background:var(--panel);
  padding:5px 12px;white-space:nowrap}
.home-link:hover{background:var(--primary);color:#1a1c1c}
.brand-social{display:flex;align-items:center;gap:10px;margin-left:auto}
.brand-social a{display:inline-flex;align-items:center;color:var(--dim)}
.brand-social a:hover{color:var(--ink)}
@media print{.brand-social{display:none}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tab{background:var(--panel);border:2px solid var(--edge);color:var(--ink);font-weight:700;
  text-transform:uppercase;font-family:inherit;padding:6px 12px;cursor:pointer;font-size:12px}
.tab[aria-selected=true]{background:var(--primary);color:#1a1c1c}
.tab:disabled{opacity:.4;cursor:not-allowed}
main{max-width:1120px;margin:0 auto;padding:18px 16px 90px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--panel);border:2px solid var(--edge);color:var(--ink);font-weight:700;
  text-transform:uppercase;font-family:inherit;padding:7px 13px;cursor:pointer;font-size:12px}
.chip[aria-selected=true]{background:var(--primary);color:#1a1c1c}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--panel);border:3px solid var(--edge);box-shadow:var(--shadow) var(--shadow) 0 0 var(--edge);
  padding:14px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;
  transition:transform .1s,box-shadow .1s}
.card:hover{transform:translate(var(--shadow),var(--shadow));box-shadow:0 0 0 0 var(--edge)}
.card h3{margin:0 0 4px;font-size:15px;font-weight:700;text-transform:uppercase}
.card p{margin:0;color:var(--dim);font-size:13px}
.rung{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;
  font-weight:700;color:var(--secondary);margin-bottom:6px}
.meter{height:6px;background:var(--panel2);border:1px solid var(--edge);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary)}
.panel{background:var(--panel);border:4px solid var(--edge);
  box-shadow:var(--shadow-lg) var(--shadow-lg) 0 0 var(--edge);padding:18px}
.hint{color:var(--dim);font-size:13px;margin:0 0 14px}
.service-identity{display:flex;align-items:center;gap:14px;background:var(--panel2);
  border:2px solid var(--edge);padding:12px 14px;margin-bottom:14px}
.service-identity img{width:44px;height:44px;flex-shrink:0;border:1px solid var(--edge);
  background:#fff;padding:3px;object-fit:contain}
.service-identity label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  font-weight:700;color:var(--dim)}
.service-identity select{margin-top:4px;background:var(--panel);border:2px solid var(--edge);
  color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;padding:6px 8px;max-width:100%}

/* ---- board ---- */
.bank{background:var(--panel2);border:2px dashed var(--edge);
  padding:12px;min-height:64px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.bank:empty::after{content:"Bank empty — every card placed";color:var(--dim);font-size:13px}
.tok{background:var(--panel);border:2px solid var(--edge);color:var(--ink);
  padding:9px 12px;cursor:grab;font:inherit;font-size:13.5px;
  text-align:left;max-width:100%;line-height:1.4;display:flex;align-items:center;gap:8px}
.tok:hover{border-color:var(--secondary)}
.tok.sel{background:var(--primary);color:#1a1c1c;border-color:var(--edge);box-shadow:2px 2px 0 0 var(--edge)}
.tok.correct{border-color:var(--edge);background:var(--ok);color:#0c1a12}
.tok.wrong{border-color:var(--edge);background:var(--bad);color:#2a0505}
.tok em{color:var(--dim);font-style:normal;font-size:12px;display:block;margin-top:3px}
.tok.correct em,.tok.wrong em{color:inherit;opacity:.75}
.zones{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.zone{background:var(--panel2);border:2px solid var(--edge);padding:11px;
  min-height:110px;display:flex;flex-direction:column;gap:8px}
.zone.over{border-color:var(--secondary);box-shadow:2px 2px 0 0 var(--secondary)}
.zone h4{margin:0;font-size:13px;letter-spacing:.3px;font-weight:700;text-transform:uppercase;
  display:flex;align-items:center;gap:7px}
.zone-icon{width:18px;height:18px;flex-shrink:0;border:1px solid var(--edge);background:#fff;
  padding:2px;object-fit:contain}
.zone .zdef{color:var(--dim);font-size:11.5px;margin:0}
.zone .drop{flex:1;display:flex;flex-direction:column;gap:7px;min-height:34px}
/* Mobile placement sheet — only ever mounted on coarse-pointer devices. */
.sheet-root{position:fixed;inset:0;z-index:50}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);touch-action:none}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);
  border-top:2px solid var(--edge);max-height:70vh;display:flex;flex-direction:column;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .18s ease-out}
.sheet-root.open .sheet{transform:translateY(0)}
.sheet-title{margin:0 0 10px;font-weight:700;font-size:14px}
.sheet-rows{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:6px}
.sheet-row{display:flex;align-items:center;gap:10px;min-height:44px;text-align:left;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  font:inherit;font-size:13.5px;padding:9px 11px;cursor:pointer}
.sheet-row img{width:24px;height:24px;flex:none}
.sheet-row b{font-weight:700;display:block}
.sheet-row em{display:block;font-style:normal;color:var(--dim);font-size:12px}
.sheet-close{margin-top:10px;min-height:44px;background:none;border:1px solid var(--line);
  color:var(--dim);font:inherit;text-transform:uppercase;font-size:12px;cursor:pointer}
.snip{background:var(--panel2);border-left:4px solid var(--secondary);padding:11px 13px;
  font-style:italic;margin:0 0 10px;font-size:14px}
.flip{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:640px){ .flip{grid-template-columns:1fr} }
.variant{background:var(--panel2);border:2px solid var(--edge);padding:13px}
.variant p{margin:0 0 10px;font-size:14.5px;line-height:1.5}
.pick{display:grid;gap:7px}
.pick button{background:var(--panel);border:2px solid var(--edge);color:var(--ink);
  padding:9px 11px;cursor:pointer;font:inherit;font-size:13.5px;text-align:left}
.pick button:hover:not(:disabled){border-color:var(--secondary)}
.pick button[aria-pressed=true]{background:var(--primary);color:#1a1c1c;border-color:var(--edge);box-shadow:2px 2px 0 0 var(--edge)}
.pick button.correct{border-color:var(--edge);background:var(--ok);color:#0c1a12}
.pick button.wrong{border-color:var(--edge);background:var(--bad);color:#2a0505}
.score{font-size:24px;font-weight:700;margin:0 0 6px;text-transform:uppercase}
.score.ok{color:var(--ok)} .score.mid{color:var(--warn)} .score.no{color:var(--bad)}
.reveal{margin-top:16px;border-top:3px solid var(--edge);padding-top:14px}
.reveal li{margin-bottom:11px;font-size:14px}
.reveal li b{display:block}
.reveal li .miss{color:var(--bad)} .reveal li .hit{color:var(--ok)}
.grid3x3{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.grid-head{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;font-size:11px;
  text-transform:uppercase;letter-spacing:.3px;color:var(--dim);padding:0 2px}
.grid-row{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;align-items:stretch}
.grid-domain{background:var(--panel2);border:2px solid var(--edge);padding:11px;
  font-size:12.5px;font-weight:700;display:flex;align-items:center}
.grid-cell{padding:8px;min-height:52px}
.grid-cell .cell-empty{color:var(--dim);font-size:12px}
@media (max-width:640px){ .grid-head{display:none} .grid-row{grid-template-columns:1fr} }
.why{color:var(--dim);margin:0 0 10px}
.dim-note{background:var(--panel2);border:2px dashed var(--edge);padding:10px 12px;margin:10px 0;font-size:14px}
.dim-note b{color:var(--secondary)}
.currency{background:var(--panel2);border:2px solid var(--edge);
  padding:12px;margin:12px 0;font-size:14px}
.currency div{margin:3px 0}
.cite{font-size:12px;color:var(--dim);margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{background:var(--primary);border:2px solid var(--edge);color:#1a1c1c;padding:9px 16px;
  cursor:pointer;font:inherit;font-weight:700;text-transform:uppercase;font-size:13px;
  box-shadow:3px 3px 0 0 var(--edge);transition:transform .1s,box-shadow .1s}
.btn:hover:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 0 var(--edge)}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 0 var(--edge)}
.badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;
  padding:3px 9px;background:var(--panel2);color:var(--ink);border:2px solid var(--edge)}
.badge.horizon{color:#1a1c1c;background:var(--warn);border-color:var(--edge)}
.sweep{background:var(--panel2);border:2px solid var(--edge);
  padding:13px;margin-top:14px}
.sweep p{margin:0 0 9px;font-size:14px}
/* ---- map ---- */
.map-wrap{width:100%;margin:0 0 12px}
.map{position:relative;width:100%;aspect-ratio:1016.371/514.609;background:var(--panel2);
  border:3px solid var(--edge);min-height:250px;overflow:hidden}
/* The map SVG ships with a flat fill and stroke as presentation attributes,
   which any CSS rule overrides — so the land follows the theme. */
.map-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-svg path,.map-svg polygon{fill:var(--land);stroke:var(--land-line);stroke-width:.4}
:root{--land:#2a2d36;--land-line:#f0f0f0}
@media (prefers-color-scheme: light){ :root{--land:#eeeeee;--land-line:#111111} }
:root[data-theme=light]{--land:#eeeeee;--land-line:#111111}
:root[data-theme=dark]{--land:#2a2d36;--land-line:#f0f0f0}

.map .site{position:absolute;transform:translate(-50%,-50%);width:9px;height:9px;
  border-radius:50%;background:var(--primary);border:2px solid var(--panel);
  pointer-events:none;z-index:2}
.map .site.comprehensive{background:var(--ok)}
.map .site.sectoral{background:var(--primary)}
.map .site.voluntary{background:var(--warn)}
.map .site.proposed{background:transparent;border-color:var(--warn)}
.map .site.none{background:var(--dim)}
.map .site.treaty{background:var(--cov-treaty)}
.map .pin{position:absolute;transform:translate(-50%,-50%);background:var(--panel);
  border:2px solid var(--edge);color:var(--ink);padding:3px 7px;
  font-size:10.5px;line-height:1.25;cursor:pointer;max-width:26%;z-index:3;
  text-align:left;font-weight:700}
.map .pin:hover{border-color:var(--secondary)}
.map .pin.over{border-color:var(--secondary);box-shadow:2px 2px 0 0 var(--secondary)}
.map .pin.correct{background:var(--ok);color:#0c1a12;border-color:var(--edge)}
.map .pin.wrong{background:var(--bad);color:#2a0505;border-color:var(--edge)}
.map .pin .held{display:block;font-size:9.5px;color:inherit;opacity:.8;
  white-space:normal;line-height:1.25;margin-top:2px;max-width:150px}
.map .leader{position:absolute;height:1px;background:var(--edge);transform-origin:0 50%;
  z-index:1;pointer-events:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-bottom:10px}
/* ---- briefs ---- */
textarea{width:100%;background:var(--panel2);border:2px solid var(--edge);color:var(--ink);
  padding:11px;font:inherit;resize:vertical;min-height:96px}
textarea:focus{outline:none;border-color:var(--secondary)}
.field{margin-bottom:18px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field .count{font-size:12px;color:var(--dim);margin-top:4px}
.scenario{background:var(--panel2);border:2px solid var(--edge);padding:16px;margin-bottom:20px;
  white-space:pre-wrap;line-height:1.6}
.ai-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ai-links .lbl{color:var(--dim);font-size:13px;margin-right:2px}
.ai-link{background:var(--panel2);border:2px solid var(--edge);
  cursor:pointer;padding:7px;line-height:0;position:relative;display:inline-flex}
.ai-link:hover{border-color:var(--secondary)}
.ai-link svg{width:20px;height:20px;display:block}
/* The ChatGPT mark ships with no fill, so it would default to black and vanish
   on the dark theme. Claude and Perplexity carry their own brand colours. */
.ai-link{color:var(--ink)}
.ai-link::after{content:attr(data-label);position:absolute;bottom:calc(100% + 6px);
  left:50%;transform:translate(-50%,4px);background:var(--ink);color:var(--bg);
  font-size:11px;line-height:1.3;padding:4px 8px;border:1px solid var(--edge);white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .12s,transform .12s}
.ai-link:hover::after,.ai-link:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);
  border:2px solid var(--edge);box-shadow:3px 3px 0 0 var(--edge);
  color:#0c1a12;padding:11px 20px;z-index:60;font-size:14px;font-weight:700}
.share-root{position:fixed;inset:0;z-index:70;display:none}
.share-root.open{display:block}
.share-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.share-modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,calc(100vw - 32px));max-height:min(86vh,720px);overflow:auto;
  background:var(--panel);border:4px solid var(--edge);box-shadow:8px 8px 0 0 var(--edge);
  padding:22px}
.share-modal h3{margin:0 0 4px;font-size:18px;text-transform:uppercase}
.share-sub{color:var(--dim);font-size:13px;margin:0 0 12px}
.share-close{position:absolute;top:10px;right:10px;border:2px solid var(--edge);
  background:var(--panel2);color:var(--ink);font:inherit;font-size:16px;font-weight:700;
  width:32px;height:32px;cursor:pointer;line-height:1}
.share-close:hover{background:var(--bad);color:#fff}
.share-tones{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.share-tone{border:2px solid var(--edge);background:var(--panel2);color:var(--ink);
  font:inherit;font-size:13px;font-weight:700;text-align:left;padding:9px 12px;cursor:pointer}
.share-tone[aria-pressed="true"]{background:var(--accent);color:#1a1c1c;
  box-shadow:3px 3px 0 0 var(--edge)}
.share-tone .hint{display:block;font-weight:400;font-size:11px;opacity:.75}
.share-preview{border:2px dashed var(--edge);background:var(--bg);padding:12px;
  font-size:13px;line-height:1.55;margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
.share-reroll{border:2px solid var(--edge);background:var(--panel2);color:var(--ink);
  font:inherit;font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;margin-bottom:14px}
.share-reroll:hover{background:var(--accent);color:#1a1c1c}
.share-nets{display:flex;flex-wrap:wrap;gap:8px}
.share-nets a,.share-nets button{border:2px solid var(--edge);background:var(--panel2);
  color:var(--ink);font:inherit;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.4px;padding:8px 12px;cursor:pointer;text-decoration:none;
  box-shadow:3px 3px 0 0 var(--edge);transition:transform .1s,box-shadow .1s}
.share-nets a:hover,.share-nets button:hover{transform:translate(3px,3px);box-shadow:0 0 0 0 var(--edge)}
.share-note{font-size:11px;color:var(--dim);margin:14px 0 0;border-top:2px solid var(--edge);
  padding-top:10px;line-height:1.5}
@media print{.share-root,.share-btn{display:none}}
.rubric li{margin-bottom:12px}
.rubric b{display:block}
.empty{color:var(--dim);text-align:center;padding:40px 20px}
.banner{background:var(--warn);color:#1a1c1c;border:2px solid var(--edge);padding:10px 14px;
  margin-bottom:14px;font-size:14px;font-weight:700}
.order-list{display:grid;gap:8px;margin:12px 0}
.order-slot{background:var(--panel2);border:2px dashed var(--edge);
  padding:10px 13px;color:var(--dim);font-size:14px}
.order-slot.filled{border-style:solid;color:var(--ink)}
@media (max-width:640px){
  main{padding:14px 12px 80px}
  .zones{grid-template-columns:1fr 1fr}
  /* Pin labels are text, so they don't shrink with the board and start
     colliding below ~700px. Scroll the map inside its own container rather
     than degrading the geography, and never let the page scroll sideways. */
  .map-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* 920px is the desktop board width at which pin spacing was verified
     collision-free; anything narrower reintroduces label overlap. */
  .map{min-width:920px}
  .map-hint{display:block}
}
.map-hint{display:none;font-size:12px;color:var(--dim);margin:0 0 8px}
/* ---- regulatory risk (rr) ----
   Final coverage palette, defined ONCE per mode. Steps come from the dataviz
   reference palette and were run through validate_palette.js against the
   map's actual surfaces (--panel2): light #eeeeee ALL PASS (contrast WARN on
   4 hues — mitigated by the mandatory C/S/V/P/—/T letter badges, the second
   channel), dark #24262e ALL PASS incl. contrast ≥3:1. Worst adjacent CVD
   ΔE 9.1 light / 8.4 dark; normal-vision 19.6 / 19.3. The dark column is
   separately SELECTED dark-band steps, not an auto-flip of the light hexes.
   Ownership rides on luminance (fill-opacity .28 open / .78 held) so hue is
   never the only channel. */
:root{--cov-comprehensive:#3987e5;--cov-sectoral:#d95926;--cov-voluntary:#199e70;
  --cov-proposed:#c98500;--cov-none:#d55181;--cov-treaty:#008300}
@media (prefers-color-scheme: light){
  :root{--cov-comprehensive:#2a78d6;--cov-sectoral:#eb6834;--cov-voluntary:#1baf7a;
    --cov-proposed:#eda100;--cov-none:#e87ba4;--cov-treaty:#008300}
}
:root[data-theme=light]{--cov-comprehensive:#2a78d6;--cov-sectoral:#eb6834;
  --cov-voluntary:#1baf7a;--cov-proposed:#eda100;--cov-none:#e87ba4;--cov-treaty:#008300}
:root[data-theme=dark]{--cov-comprehensive:#3987e5;--cov-sectoral:#d95926;
  --cov-voluntary:#199e70;--cov-proposed:#c98500;--cov-none:#d55181;--cov-treaty:#008300}
/* RR-scoped 44px touch targets (playtest wave 1): action/submit/withdraw/
   begin/start/reg buttons, role-hat-ops pickers, gate answer options,
   sheet-close and debrief ai-links — scoped to .rr-mode so the shared house
   kit (other labs) keeps its baseline. */
.rr-mode .btn{min-height:44px}
.rr-mode .pick button{min-height:44px}
.rr-mode .ai-link{min-height:44px;min-width:44px;align-items:center;justify-content:center}
.rr-hud{position:sticky;z-index:25;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  background:var(--panel);border:3px solid var(--edge);padding:8px 12px;margin:0 0 12px;
  font-weight:700;font-size:14px}
.rr-hud .meter{flex:1;min-width:80px;margin-top:0}
.rr-hud .rr-reg{margin-left:auto;flex:0 0 auto}
.rr-map{position:relative;width:100%;aspect-ratio:1016.371/514.609;background:var(--panel2);
  border:3px solid var(--edge);overflow:hidden;margin:0 0 12px}
.rr-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rr-svg path,.rr-svg polygon{fill:var(--land);stroke:var(--land-line);stroke-width:.4;
  pointer-events:none}
.rr-svg .cov-comprehensive{fill:var(--cov-comprehensive)}
.rr-svg .cov-sectoral{fill:var(--cov-sectoral)}
.rr-svg .cov-voluntary{fill:var(--cov-voluntary)}
.rr-svg .cov-proposed{fill:var(--cov-proposed)}
.rr-svg .cov-none{fill:var(--cov-none)}
.rr-svg .cov-treaty{fill:var(--cov-treaty)}
.rr-svg .rr-open{fill-opacity:.28}
.rr-svg .rr-held{fill-opacity:.78;stroke-width:1}
.rr-svg .rr-notice{stroke:var(--bad);stroke-width:1.3}
.rr-svg .rr-sel{stroke:var(--secondary);stroke-width:1.6}
.rr-svg .rr-fx *{fill:url(#rr-hatch);stroke:none;pointer-events:none}
.rr-svg #rr-hatch line{stroke:var(--bad);stroke-opacity:.8;stroke-width:1.5}
.rr-svg .rr-coe{stroke:var(--dim);stroke-dasharray:7 5;stroke-width:1.6}
.rr-svg .rr-coe.rr-held{stroke:var(--edge);stroke-dasharray:none;stroke-width:2}
.rr-svg .rr-coe.rr-notice{stroke:var(--bad);stroke-dasharray:7 5}
/* the legacy Jurisdiction Map shares the stamped SVG until Task 13 removes it;
   hide the rr-only artefacts there so it stays pixel-identical */
.map-svg .rr-dot,.map-svg .rr-coe{display:none}
.rr-hit{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;
  background:transparent;border:none;cursor:pointer;z-index:3;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:inherit;padding:0}
.rr-glyph{font-size:13px;line-height:1;text-shadow:0 0 4px var(--bg)}
.rr-pinlab{display:none;font-size:9px;font-weight:700;line-height:1.1;
  background:var(--panel);border:1px solid var(--edge);padding:0 3px;margin-top:1px}
@media (min-width:700px){ .rr-pinlab{display:block} }
.rr-hit.rr-hitsel .rr-glyph{color:var(--secondary)}
.rr-hit.rr-hitsel .rr-pinlab{border-color:var(--secondary)}
/* Leader line from a pin to a label whose data nudge pushed it well away from
   the country (Europe cluster, island states) — desktop-only like the labels. */
.rr-lead{display:none;position:absolute;left:50%;top:50%;height:0;
  border-top:1.5px solid var(--edge);opacity:.75;transform-origin:left center;
  pointer-events:none}
@media (min-width:700px){ .rr-lead{display:block} }
.rr-hit.rr-hitsel .rr-lead{border-color:var(--secondary)}
.rr-chip{position:absolute;left:58%;top:-2px;font-size:9px;background:var(--panel);
  border:1px solid var(--edge);padding:0 3px;font-weight:700;white-space:nowrap}
.rr-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim);
  margin:0 0 10px;align-items:center}
.rr-legend span{display:inline-flex;align-items:center;gap:5px}
.rr-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border:2px solid var(--edge);font-weight:700;font-size:12px;flex-shrink:0;color:#111}
.rr-badge.cov-comprehensive{background:var(--cov-comprehensive)}
.rr-badge.cov-sectoral{background:var(--cov-sectoral)}
.rr-badge.cov-voluntary{background:var(--cov-voluntary)}
.rr-badge.cov-proposed{background:var(--cov-proposed)}
.rr-badge.cov-none{background:var(--cov-none)}
.rr-badge.cov-treaty{background:var(--cov-treaty)}
.rr-list{display:grid;gap:8px}
.rr-group{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);
  margin:14px 0 4px;font-weight:700}
.rr-row{display:flex;gap:10px;align-items:center;background:var(--panel2);
  border:2px solid var(--edge);padding:9px 11px}
.rr-row.rr-rowsel{border-color:var(--secondary);box-shadow:2px 2px 0 0 var(--secondary)}
.rr-tinfo{flex:1;min-width:0}
.rr-tinfo b{display:block;font-size:13.5px}
.rr-tinfo em{display:block;font-style:normal;color:var(--dim);font-size:12px}
.rr-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rr-acts .btn{padding:8px 10px;font-size:12px;min-height:44px}
.rr-opscount{font-size:12px;color:var(--dim);margin-top:6px}
@media (max-width:700px){
  .rr-row{flex-wrap:wrap}
  .rr-acts{width:100%;justify-content:flex-start}
}
/* ---- rr slice 3: regulator interstitial ---- */
.rr-aging{display:grid;gap:7px;margin:0 0 14px}
.rr-aging .rr-age{background:var(--panel2);border:2px solid var(--edge);padding:9px 12px;
  font-size:13.5px}
.rr-aging .rr-age.warn{border-color:var(--warn)}
.rr-aging .rr-age.no{border-color:var(--bad);color:var(--bad);font-weight:700}
.rr-event{background:var(--panel2);border:3px solid var(--edge);
  box-shadow:var(--shadow) var(--shadow) 0 0 var(--edge);padding:14px;margin:0 0 14px}
.rr-event h3{margin:0 0 6px;font-size:14px;text-transform:uppercase}
.rr-event p{margin:0 0 8px;font-size:14px}
/* ---- rr slice 3: US inset bottom sheet ---- */
.rr-scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39}
.rr-sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);
  border-top:4px solid var(--edge);padding:14px 16px 20px;max-height:72vh;overflow:auto}
.rr-sheet h3{margin:0;font-size:14px;text-transform:uppercase}
.rr-sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:0 0 10px}
.rr-inset-row{display:flex;gap:12px;align-items:center;width:100%;background:var(--panel2);
  border:2px solid var(--edge);padding:8px 12px;margin:0 0 8px;min-height:60px;
  font:inherit;color:var(--ink);text-align:left;cursor:default}
.rr-inset-row svg{width:48px;height:48px;flex-shrink:0;display:block}
.rr-inset-row svg .rr-frame{fill:none;stroke:var(--edge);stroke-width:3}
.rr-usdots{display:none;position:absolute;top:calc(100% + 1px);left:50%;
  transform:translateX(-50%);gap:3px;pointer-events:none}
@media (min-width:700px){ .rr-usdots{display:flex} }
.rr-usdots i{width:8px;height:8px;border:1px solid var(--edge);border-radius:50%}
/* ---- rr slice 3: debrief ---- */
.rr-arith{background:var(--panel2);border:2px solid var(--edge);padding:11px 13px;
  margin:10px 0;font-size:14px}
.rr-review{display:grid;gap:6px;margin:10px 0}
.rr-review .rr-q{background:var(--panel2);border-left:4px solid var(--ok);
  padding:8px 11px;font-size:13px}
.rr-review .rr-q.miss{border-left-color:var(--bad)}
.rr-review .rr-q em{display:block;font-style:normal;color:var(--dim);font-size:12px}
/* ---- rr slice 3: print strategy report (SPEC §2.7) ----
   The report exists ONLY inside the print media query: hidden on screen,
   and under print it is the only thing shown. Nothing is persisted. */
.rr-print{display:none}
@media print{
  header,.toast,main > *:not(.rr-print){display:none !important}
  body{background:#fff;color:#000;font:10px/1.35 "Space Mono",ui-monospace,monospace}
  main{max-width:none;padding:0}
  .rr-print{display:block;color:#000}
  .rr-print h2{font-size:15px;margin:0 0 2px;text-transform:uppercase}
  .rr-print h3{font-size:11px;margin:7px 0 3px;text-transform:uppercase;
    border-bottom:1px solid #000;padding-bottom:1px}
  .rr-print p{margin:0 0 3px}
  .rr-print table{width:100%;border-collapse:collapse;font-size:9px}
  .rr-print th,.rr-print td{border:1px solid #999;padding:1px 4px;text-align:left;
    vertical-align:top}
  .rr-print tr{page-break-inside:avoid}
  .rr-print ul{margin:0 0 3px;padding-left:16px}
  .rr-print li{margin:0}
  @page{size:A4 portrait;margin:11mm}
}
</style>

<script id="lab-manifest" type="application/json">{"id":"concepts","title":"AI & ML Concepts","subtitle":"Vendor-neutral foundations · risk · operations","output":"AI Concepts.html","storageKey":"concepts.progress.v1","allLabel":"Everything","studyContext":"I am studying artificial intelligence and machine learning concepts at a professional level, vendor-neutral — the ideas as they apply anywhere, not the products of one cloud provider.","citeInstruction":"Cite the standard, framework or source literature where one exists (for example \"NIST AI RMF 1.0 MEASURE 2.4\", \"ISO 31000:2018 §6.5\", \"Gama et al. 2014\").","filters":[{"id":"foundations","label":"Foundations"},{"id":"genai","label":"Generative AI"},{"id":"risk","label":"Risk"},{"id":"ops","label":"Operations"}],"games":[{"id":"terms","rung":"Learn","runner":"board","deck":"decks/shared/terms.json","title":"AI Foundations","blurb":"Match each definition to the term it defines."},{"id":"learning-methods","rung":"Learn","runner":"board","deck":"decks/shared/learning-methods.json","title":"Learning Methods","blurb":"Supervised, unsupervised, self-supervised, reinforcement — and their relatives."},{"id":"training-data","rung":"Learn","runner":"board","deck":"decks/shared/training-data.json","title":"Training Data","blurb":"Splits, labelling, leakage, imbalance and augmentation."},{"id":"fit-tuning","rung":"Learn","runner":"board","deck":"decks/shared/fit-tuning.json","title":"Fit & Tuning","blurb":"Under- and overfitting, regularisation, and what actually moves them."},{"id":"metrics","rung":"Learn","runner":"board","deck":"decks/shared/metrics.json","title":"Testing Metrics","blurb":"Precision, recall, F1, AUC and friends — and when each one lies."},{"id":"inference","rung":"Learn","runner":"board","deck":"decks/shared/inference.json","title":"Inference","blurb":"Batch, real-time, streaming, and the knobs that shape a generation."},{"id":"algorithms","rung":"Learn","runner":"board","deck":"decks/shared/algorithms.json","title":"ML Algorithms","blurb":"Which algorithm family solves which shape of problem."},{"id":"prompting","rung":"Learn","runner":"board","deck":"decks/shared/prompting.json","title":"Prompting & Risks","blurb":"Prompt patterns and the attacks that exploit them."},{"id":"rag","rung":"Learn","runner":"board","deck":"decks/shared/rag.json","title":"RAG","blurb":"Retrieval-augmented generation, part by part."},{"id":"responsible","rung":"Learn","runner":"board","deck":"decks/shared/responsible.json","title":"Responsible AI","blurb":"Fairness, transparency, explainability, safety and their measures."},{"id":"drift-pairs","rung":"Contrast","runner":"pairs","deck":"decks/shared/drift-pairs.json","title":"One Fact Changes Everything — Drift","blurb":"Two near-identical incidents. One fact differs and the diagnosis flips."},{"id":"risk-hierarchy-pairs","rung":"Contrast","runner":"pairs","deck":"decks/shared/risk-hierarchy-pairs.json","title":"One Fact Changes Everything — Treatment vs Control","blurb":"The two hierarchies answer different questions. These are where people conflate them."},{"id":"risk-pairs","rung":"Contrast","runner":"pairs","deck":"decks/shared/risk-pairs.json","title":"One Fact Changes Everything — Risk","blurb":"Eight vocabulary distinctions that decide who signs and what is measured."},{"id":"drift-types","rung":"Apply","runner":"board","deck":"decks/shared/drift-types.json","title":"Name That Drift","blurb":"Eight ways a model goes stale. Sort each symptom into the one it is."},{"id":"risk-treatment","rung":"Apply","runner":"board","deck":"decks/shared/risk-treatment.json","title":"Risk Treatment Hierarchy","blurb":"Avoid, reduce, transfer, accept — sorted by what actually happened to the risk."},{"id":"risk-controls","rung":"Apply","runner":"board","deck":"decks/shared/risk-controls.json","title":"Hierarchy of Controls","blurb":"Five tiers, strongest first. How much does the measure depend on a person?"},{"id":"risk-frameworks","rung":"Apply","runner":"board","deck":"decks/shared/risk-frameworks.json","title":"Which Framework Is This?","blurb":"Four documents people cite interchangeably and shouldn't."},{"id":"risk-rmf-functions","rung":"Apply","runner":"board","deck":"decks/shared/risk-rmf-functions.json","title":"NIST AI RMF — Four Functions","blurb":"Govern, Map, Measure, Manage. Which function is this activity?"},{"id":"risk-tiers","rung":"Apply","runner":"board","deck":"decks/shared/risk-tiers.json","title":"Regulatory Risk Tiers","blurb":"The EU AI Act pyramid plus the GPAI systemic-risk threshold."},{"id":"risk-analysis","rung":"Apply","runner":"board","deck":"decks/shared/risk-analysis.json","title":"Risk Analysis Techniques","blurb":"Bowtie, FMEA, Swiss cheese and the rest — what each is actually built to reveal."},{"id":"risk-org","rung":"Apply","runner":"board","deck":"decks/shared/risk-org.json","title":"Who Owns This Risk?","blurb":"Three lines of defence, and the body that can actually accept."},{"id":"solution-builder","rung":"Apply","runner":"board","deck":"decks/shared/solution-builder.json","title":"Solution Builder","blurb":"Pick the technique the problem actually calls for."},{"id":"model-decisions","rung":"Apply","runner":"board","deck":"decks/shared/model-decisions.json","title":"Model Decision Lab","blurb":"Choose the move that addresses the actual cause."},{"id":"genai-ops","rung":"Apply","runner":"board","deck":"decks/shared/genai-ops.json","title":"GenAI Evaluation & Ops","blurb":"Diagnose the failure, then pick the intervention that fits it."},{"id":"ml-lifecycle","rung":"Apply","runner":"ladders","deck":"decks/shared/ml-lifecycle.json","title":"ML Lifecycle","blurb":"Put the machine-learning lifecycle in order."},{"id":"industry-lifecycle","rung":"Apply","runner":"ladders","deck":"decks/shared/industry-lifecycle.json","title":"Industry ML Pipeline","blurb":"The fuller lifecycle as it runs in practice."},{"id":"rag-pipeline","rung":"Apply","runner":"ladders","deck":"decks/sha <script id="lab-decks" type="application/json">{"decks/shared/terms.json":{"id":"terms","runner":"board","title":"AI Foundations","blurb":"Match each definition to the term it defines.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 1","asOf":"2026-07","area":"foundations","hint":"Drag each definition onto the term it defines.","items":[{"id":"terms-01","label":"The broad field of building systems that perform tasks associated with human intelligence.","answer":"Artificial Intelligence","why":"AI is the umbrella field: rule-based expert systems, computer vision, robotics, machine learning, and generative models can all be AI. Machine learning is one way to build AI, not a synonym for the whole field."},{"id":"terms-02","label":"A subset of AI in which systems learn patterns from data instead of relying only on explicit rules.","answer":"Machine Learning","why":"For example, a spam filter can infer patterns from labeled messages rather than requiring a developer to enumerate every spam rule. The key exam cue is improvement from data or experience."},{"id":"terms-03","label":"A subset of ML that uses multi-layer neural networks to learn complex representations.","answer":"Deep Learning","why":"A vision model may learn edges in early layers, shapes in middle layers, and objects in later layers. It is distinguished from broader machine learning by its use of deep neural networks and typically larger data and compute needs."},{"id":"terms-04","label":"AI that creates new content such as text, images, audio, video, or code.","answer":"Generative AI","why":"A text model drafting an email and a diffusion model creating an image are generative because they synthesize new output. Predicting whether an existing email is spam is discriminative classification instead."},{"id":"terms-05","label":"The learned representation that maps inputs to predictions or generated outputs.","answer":"Model","why":"After training, the model is the artifact used for inference. For example, a house-price model applies learned relationships to a new property's features to estimate its price."},{"id":"terms-06","label":"The procedure used to learn patterns, optimize a model, or perform a computation.","answer":"Algorithm","why":"Gradient descent is a learning algorithm, while the trained network it produces is the model. The distinction is process versus learned artifact."},{"id":"terms-07","label":"An input variable or measurable attribute supplied to a model.","answer":"Feature","why":"For a house-price model, floor area, postcode, and bedroom count are features because they enter the model as evidence. The sale price is the label to predict, while parameters are internal values the model learns during training."},{"id":"terms-08","label":"The known target or desired answer attached to a supervised training example.","answer":"Label","why":"In spam detection, each training email's spam or not-spam answer is its label. A label is the target the model learns to predict; features are the evidence used to make that prediction."},{"id":"terms-09","label":"A value, such as a neural-network weight, learned from training data.","answer":"Parameter","why":"A neural-network weight is adjusted automatically as training minimizes error. Parameters are learned by the model, unlike hyperparameters such as learning rate that practitioners choose before or around training."},{"id":"terms-10","label":"A training or model setting chosen outside the learning process, such as learning rate or tree depth.","answer":"Hyperparameter","why":"Examples include learning rate, batch size, tree depth, and regularization strength. These settings control training or model structure and are usually selected with validation data rather than learned as model weights."},{"id":"terms-11","label":"The process of adjusting model parameters to reduce error on examples.","answer":"Training","why":"During training, the system compares outputs with a learning signal, calculates error, and updates parameters. This is the learning phase; inference uses the resulting fixed model on new inputs."},{"id":"terms-12","label":"Using a trained model to produce a prediction, decision, embedding, or generated result.","answer":"Inference","why":"A deployed fraud model scoring a new card transaction is performing inference. No model learning is required for that request; the trained model is being applied to previously unseen input."}]},"decks/shared/learning-methods.json":{"id":"learning-methods","runner":"board","title":"Learning Methods","blurb":"Supervised, unsupervised, self-supervised, reinforcement — and their relatives.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 1","asOf":"2026-07","area":"foundations","hint":"To identify the method, ask where its learning signal comes from: supplied answers, hidden structure in raw data, labels created from the data itself, or rewards from interaction.","items":[{"id":"learning-methods-01","label":"Learns from examples containing inputs paired with known labels or numeric targets.","answer":"Supervised Learning","why":"Learns from examples containing inputs paired with known labels or numeric targets."},{"id":"learning-methods-02","label":"Finds structure in unlabeled data, such as groups, associations, or unusual patterns.","answer":"Unsupervised Learning","why":"Finds structure in unlabeled data, such as groups, associations, or unusual patterns."},{"id":"learning-methods-03","label":"Creates supervisory signals from the data itself, such as predicting masked or missing content.","answer":"Self-Supervised Learning","why":"Creates supervisory signals from the data itself, such as predicting masked or missing content."},{"id":"learning-methods-04","label":"Learns a policy by taking actions and receiving rewards or penalties from an environment.","answer":"Reinforcement Learning","why":"Learns a policy by taking actions and receiving rewards or penalties from an environment."},{"id":"learning-methods-05","label":"Aligns model behavior using human preference comparisons that train a reward signal.","answer":"RLHF","why":"Aligns model behavior using human preference comparisons that train a reward signal."},{"id":"learning-methods-06","label":"A supervised task that predicts a category or class.","answer":"Classification","why":"A supervised task that predicts a category or class."},{"id":"learning-methods-07","label":"A supervised task that predicts a continuous numeric value.","answer":"Regression","why":"A supervised task that predicts a continuous numeric value."},{"id":"learning-methods-08","label":"An unsupervised task that groups similar records without predefined labels.","answer":"Clustering","why":"An unsupervised task that groups similar records without predefined labels."}]},"decks/shared/training-data.json":{"id":"training-data","runner":"board","title":"Training Data","blurb":"Splits, labelling, leakage, imbalance and augmentation.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 1","asOf":"2026-07","area":"foundations","hint":"The important distinction is the data's role, format, or fitness for the real population; those details determine what can be learned and whether evaluation is trustworthy.","items":[{"id":"training-data-01","label":"The portion of data used to learn model parameters.","answer":"Training Set","why":"The portion of data used to learn model parameters."},{"id":"training-data-02","label":"Held-out data used during development to compare choices and tune hyperparameters.","answer":"Validation Set","why":"Held-out data used during development to compare choices and tune hyperparameters."},{"id":"training-data-03","label":"Untouched data used at the end to estimate performance on unseen examples.","answer":"Test Set","why":"Untouched data used at the end to estimate performance on unseen examples."},{"id":"training-data-04","label":"Examples that include the target answer required for supervised learning.","answer":"Labeled Data","why":"Examples that include the target answer required for supervised learning."},{"id":"training-data-05","label":"Examples without target answers, often used for unsupervised or self-supervised learning.","answer":"Unlabeled Data","why":"Examples without target answers, often used for unsupervised or self-supervised learning."},{"id":"training-data-06","label":"Data organized into defined fields, rows, columns, or records.","answer":"Structured Data","why":"Data organized into defined fields, rows, columns, or records."},{"id":"training-data-07","label":"Free-form content such as text, images, audio, and video.","answer":"Unstructured Data","why":"Free-form content such as text, images, audio, and video."},{"id":"training-data-08","label":"Examples that reflect the people, conditions, and cases the model will encounter in use.","answer":"Representative Data","why":"Examples that reflect the people, conditions, and cases the model will encounter in use."},{"id":"training-data-09","label":"Information unavailable at prediction time accidentally enters training and inflates measured performance.","answer":"Data Leakage","why":"Information unavailable at prediction time accidentally enters training and inflates measured performance."},{"id":"training-data-10","label":"One target class appears much more often than another, making accuracy potentially misleading.","answer":"Class Imbalance","why":"One target class appears much more often than another, making accuracy potentially misleading."}]},"decks/shared/fit-tuning.json":{"id":"fit-tuning","runner":"board","title":"Fit & Tuning","blurb":"Under- and overfitting, regularisation, and what actually moves them.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 1","asOf":"2026-07","area":"foundations","hint":"Compare training performance with validation or test performance: both poor suggests underfitting, while a large training-to-validation gap suggests overfitting.","items":[{"id":"fit-tuning-01","label":"The model captures useful patterns and performs similarly on training and unseen data.","answer":"Good Fit","why":"The model captures useful patterns and performs similarly on training and unseen data."},{"id":"fit-tuning-02","label":"The model performs very well on training data but poorly on unseen data.","answer":"Overfitting","why":"The model performs very well on training data but poorly on unseen data."},{"id":"fit-tuning-03","label":"The model is too simple or insufficiently trained and performs poorly even on training data.","answer":"Underfitting","why":"The model is too simple or insufficiently trained and performs poorly even on training data."},{"id":"fit-tuning-04","label":"Systematic oversimplification causes consistent error and is commonly associated with underfitting.","answer":"High Bias","why":"Systematic oversimplification causes consistent error and is commonly associated with underfitting."},{"id":"fit-tuning-05","label":"The model is overly sensitive to its training sample and is commonly associated with overfitting.","answer":"High Variance","why":"The model is overly sensitive to its training sample and is commonly associated with overfitting."},{"id":"fit-tuning-06","label":"A constraint or penalty that discourages excessive complexity and can reduce overfitting.","answer":"Regularization","why":"A constraint or penalty that discourages excessive complexity and can reduce overfitting."},{"id":"fit-tuning-07","label":"Repeated train-validation splits used to estimate how consistently a model generalizes.","answer":"Cross-Validation","why":"Repeated train-validation splits used to estimate how consistently a model generalizes."},{"id":"fit-tuning-08","label":"A hyperparameter controlling the size of each optimization update.","answer":"Learning Rate","why":"A hyperparameter controlling the size of each optimization update."},{"id":"fit-tuning-09","label":"One complete pass through the training dataset.","answer":"Epoch","why":"One complete pass through the training dataset."},{"id":"fit-tuning-10","label":"The number of training examples used to calculate one parameter update.","answer":"Batch Size","why":"The number of training examples used to calculate one parameter update."}]},"decks/shared/metrics.json":{"id":"metrics","runner":"board","title":"Testing Metrics","blurb":"Precision, recall, F1, AUC and friends — and when each one lies.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 1","asOf":"2026-07","area":"foundations","hint":"Choose a metric from the type and cost of error, not from convenience; classification, regression, retrieval, generation, safety, and human judgment answer different quality questions.","items":[{"id":"metrics-01","label":"The fraction of all predictions that are correct; most useful when classes and error costs are balanced.","answer":"Accuracy","why":"For 90 correct predictions out of 100, accuracy is 90%. It can be deceptive with imbalanced classes: a model that predicts every rare-disease case as negative may appear highly accurate while finding no patients who need help."},{"id":"metrics-02","label":"Of all predicted positives, the fraction that are actually positive.","answer":"Precision","why":"Use precision when false positives are costly. If 100 transactions are flagged as fraud and only 80 are fraudulent, precision is 80%; the remaining 20 create unnecessary investigations or blocked purchases."},{"id":"metrics-03","label":"Of all actual positives, the fraction the model successfully finds.","answer":"Recall","why":"Use recall when missing a true positive is costly. If 100 fraudulent transactions occur and the model catches 90, recall is 90%; the other 10 are false negatives that escaped detection."},{"id":"metrics-04","label":"The harmonic mean of precision and recall, balancing both in one value.","answer":"F1 Score","why":"F1 becomes high only when both precision and recall are high, so it is useful for imbalanced classification when both false alarms and missed positives matter. It does not include true negatives and can hide which of precision or recall is weaker."},{"id":"metrics-05","label":"Counts true positives, true negatives, false positives, and false negatives.","answer":"Confusion Matrix","why":"This table exposes the exact error types hidden by one summary score. Read its four cells to see whether the model creates false alarms, misses real positives, or handles each class correctly before choosing precision, recall, or another metric."},{"id":"metrics-06","label":"Measures how well a classifier ranks positives above negatives across thresholds.","answer":"AUC-ROC","why":"AUC-ROC evaluates ranking quality without committing to one classification threshold: 1.0 is perfect ranking and about 0.5 is random. For highly imbalanced data, also inspect precision-recall behavior because ROC results can look optimistic when negatives dominate."},{"id":"metrics-07","label":"The average squared difference between predicted and actual values; lower is better.","answer":"MSE","why":"Squaring each residual makes large mistakes contribute disproportionately. Errors of 2 and 10 contribute 4 and 100, so MSE strongly penalizes outliers; its squared units make it less intuitive to explain directly."},{"id":"metrics-08","label":"The square root of MSE, expressing error in the same unit as the predicted values.","answer":"RMSE","why":"RMSE preserves MSE's extra penalty for large errors but converts the result back to the target's unit. An RMSE of $5,000 on house prices means the typical error scale is expressed in dollars, though large misses still influence it heavily."},{"id":"metrics-09","label":"The average absolute difference between predicted and actual numeric values.","answer":"MAE","why":"MAE treats error magnitude linearly: misses of 2 and 10 contribute 2 and 10. It is easier to interpret and less sensitive to outliers than MSE or RMSE, making it useful when every unit of error has roughly the same cost."},{"id":"metrics-10","label":"Measures how well a model predicts the likelihood of the next token or word.","answer":"Perplexity","why":"Lower perplexity means the language model is less surprised by the evaluation text and assigns higher probability to its tokens. It measures next-token prediction, not whether an answer is factual, safe, helpful, or grounded."},{"id":"metrics-11","label":"Measures overlap between generated and reference text and is commonly used for summaries.","answer":"ROUGE","why":"ROUGE commonly measures how much reference wording a generated summary recovers, often through matching words, n-grams, or sequences. A high score can still miss meaning or reward copied wording, so semantic and human evaluation may also be needed."},{"id":"metrics-12","label":"Evaluates translation by comparing n-grams in generated and reference text.","answer":"BLEU","why":"BLEU rewards n-gram overlap with one or more reference translations and applies a penalty to outputs that are too short. Valid translations can use different wording, so BLEU is most useful for aggregate comparison and not as proof that one sentence is correct."},{"id":"metrics-13","label":"Checks whether generated claims are supported by the context or sources supplied to the model.","answer":"Groundedness","why":"For a RAG answer, inspect whether each claim follows from the retrieved passages supplied to the model. A statement may be generally true but still be ungrounded if the provided evidence does not support it; citations help make this check traceable."},{"id":"metrics-14","label":"Checks claims against trusted facts rather than only measuring textual similarity.","answer":"Factual Correctness","why":"This asks whether claims agree with trusted reality, even when no supporting passage was supplied in the prompt. It differs from groundedness: an answer can be factually correct but unsupported by its cited context, or grounded in a source that is itself wrong."},{"id":"metrics-15","label":"Measures how often the retriever includes the relevant evidence among the returned passages.","answer":"Retrieval Recall","why":"If 100 questions require a known evidence passage and the retriever returns it for 85, retrieval recall is 85%. Low retrieval recall points to chunking, embeddings, filters, query rewriting, or candidate-count problems that generation cannot repair."},{"id":"metrics-16","label":"Uses people and a defined rubric to judge qualities that automated metrics may miss.","answer":"Human Evaluation","why":"People can score usefulness, tone, reasoning, cultural fit, and nuanced correctness against a consistent rubric. Use representative samples, multiple trained reviewers, and agreement checks because human judgments can be subjective, slow, and expensive."},{"id":"metrics-17","label":"Tests outputs for harmful content, privacy leakage, policy violations, and adversarial behavior.","answer":"Safety Evaluation","why":"Test both ordinary and adversarial prompts for harmful output, jailbreak success, sensitive-data exposure, bias, and unsafe tool actions. Report results by risk category and user group; one average quality score cannot demonstrate that a system is safe."}]},"decks/shared/inference.json":{"id":"inference","runner":"board","title":"Inference","blurb":"Batch, real-time, streaming, and the knobs that shape a generation.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 1","asOf":"2026-07","area":"foundations","hint":"Look for the operational requirement: response time, request volume, device location, hosted access, or change between training and production.","items":[{"id":"inference-01","label":"Returns a prediction immediately for an interactive request where low latency matters.","answer":"Real-Time Inference","why":"Returns a prediction immediately for an interactive request where low latency matters."},{"id":"inference-02","label":"Processes many stored records together when an immediate response is unnecessary.","answer":"Batch Inference","why":"Processes many stored records together when an immediate response is unnecessary."},{"id":"inference-03","label":"Runs the model near the data source or device to reduce latency, bandwidth use, or connectivity dependence.","answer":"Edge Inference","why":"Runs the model near the data source or device to reduce latency, bandwidth use, or connectivity dependence."},{"id":"inference-04","label":"A hosted interface through which applications send inputs and receive model outputs.","answer":"Model Endpoint","why":"A hosted interface through which applications send inputs and receive model outputs."},{"id":"inference-05","label":"The time between submitting an inference request and receiving its result.","answer":"Latency","why":"The time between submitting an inference request and receiving its result."},{"id":"inference-06","label":"The number of inference requests or records processed in a period of time.","answer":"Throughput","why":"The number of inference requests or records processed in a period of time."},{"id":"inference-07","label":"The distribution of production inputs changes from the data used during training.","answer":"Data Drift","why":"The distribution of production inputs changes from the data used during training."},{"id":"inference-08","label":"The relationship between inputs and the correct output changes over time.","answer":"Concept Drift","why":"The relationship between inputs and the correct output changes over time."}]},"decks/shared/algorithms.json":{"id":"algorithms","runner":"board","title":"ML Algorithms","blurb":"Which algorithm family solves which shape of problem.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 1","asOf":"2026-07","area":"foundations","hint":"Recognize it from the input, output, and structure of the task; model families that can process similar data may still optimize for very different outcomes.","items":[{"id":"algorithms-01","label":"Generates human-language text or computer code from prompts.","answer":"GPT","why":"Generates human-language text or computer code from prompts."},{"id":"algorithms-02","label":"Processes text bidirectionally to understand its context.","answer":"BERT","why":"Processes text bidirectionally to understand its context."},{"id":"algorithms-03","label":"Uses attention to model relationships across tokens and powers most modern foundation models.","answer":"Transformer","why":"Uses attention to model relationships across tokens and powers most modern foundation models."},{"id":"algorithms-04","label":"Generates content by learning to reverse a gradual noising process.","answer":"Diffusion Model","why":"Generates content by learning to reverse a gradual noising process."},{"id":"algorithms-05","label":"Processes sequential data such as time series, text, or speech.","answer":"RNN","why":"Processes sequential data such as time series, text, or speech."},{"id":"algorithms-06","label":"Learns spatial patterns and is commonly used for image and vision tasks.","answer":"CNN","why":"Learns spatial patterns and is commonly used for image and vision tasks."},{"id":"algorithms-07","label":"A deep convolutional neural network used for image recognition and object detection.","answer":"ResNet","why":"A deep convolutional neural network used for image recognition and object detection."},{"id":"algorithms-08","label":"Generates raw audio waveforms and is commonly used for speech synthesis.","answer":"WaveNet","why":"Generates raw audio waveforms and is commonly used for speech synthesis."},{"id":"algorithms-09","label":"Models a continuous numeric target as a weighted relationship between features.","answer":"Linear Regression","why":"Models a continuous numeric target as a weighted relationship between features."},{"id":"algorithms-10","label":"Estimates the probability of a class despite its regression-based name.","answer":"Logistic Regression","why":"Estimates the probability of a class despite its regression-based name."},{"id":"algorithms-11","label":"Learns interpretable decision rules by repeatedly splitting records by feature values.","answer":"Decision Tree","why":"Learns interpretable decision rules by repeatedly splitting records by feature values."},{"id":"algorithms-12","label":"Combines many decision trees to improve stability and predictive performance.","answer":"Random Forest","why":"Combines many decision trees to improve stability and predictive performance."},{"id":"algorithms-13","label":"Builds trees sequentially so each new model focuses on earlier errors.","answer":"Gradient Boosting","why":"Builds trees sequentially so each new model focuses on earlier errors."},{"id":"algorithms-14","label":"Groups unlabeled records around a chosen number of cluster centers.","answer":"K-Means","why":"Groups unlabeled records around a chosen number of cluster centers."}]},"decks/shared/prompting.json":{"id":"prompting","runner":"board","title":"Prompting & Risks","blurb":"Prompt patterns and the attacks that exploit them.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 3","asOf":"2026-07","area":"genai","hint":"This concept changes instructions, context, sampling, output constraints, or attack resistance at request time without retraining the model unless the clue explicitly says otherwise.","items":[{"id":"prompting-01","label":"Breaks a complex task into explicit smaller steps whose outputs can be checked.","answer":"Structured Decomposition","why":"Breaks a complex task into explicit smaller steps whose outputs can be checked."},{"id":"prompting-02","label":"Asks a model to perform a task without providing examples.","answer":"Zero-Shot","why":"Asks a model to perform a task without providing examples."},{"id":"prompting-03","label":"Provides a small number of examples to guide behavior and output format.","answer":"Few-Shot","why":"Provides a small number of examples to guide behavior and output format."},{"id":"prompting-04","label":"Defines high-priority application behavior, boundaries, role, and response requirements.","answer":"System Prompt","why":"Defines high-priority application behavior, boundaries, role, and response requirements."},{"id":"prompting-05","label":"A unit of text processed by a language model; token counts affect context capacity, latency, and cost.","answer":"Token","why":"A unit of text processed by a language model; token counts affect context capacity, latency, and cost."},{"id":"prompting-06","label":"The maximum combined amount of input and generated tokens a model can process in one request.","answer":"Context Window","why":"The maximum combined amount of input and generated tokens a model can process in one request."},{"id":"prompting-07","label":"Controls sampling randomness; lower values favor more repeatable output and higher values increase variation.","answer":"Temperature","why":"Controls sampling randomness; lower values favor more repeatable output and higher values increase variation."},{"id":"prompting-08","label":"Limits sampling to the smallest set of likely tokens whose cumulative probability reaches a threshold.","answer":"Top-p","why":"Limits sampling to the smallest set of likely tokens whose cumulative probability reaches a threshold."},{"id":"prompting-09","label":"Caps response length to control truncation risk, latency, and spend.","answer":"Maximum Output Tokens","why":"Caps response length to control truncation risk, latency, and spend."},{"id":"prompting-10","label":"Constrains a response to a schema such as JSON so downstream software can validate and consume it.","answer":"Structured Output","why":"Constrains a response to a schema such as JSON so downstream software can validate and consume it."},{"id":"prompting-11","label":"Malicious input attempts to override instructions or manipulate a model and its connected tools.","answer":"Prompt Injection","why":"Malicious input attempts to override instructions or manipulate a model and its connected tools."},{"id":"prompting-12","label":"Corrupted or adversarial training examples manipulate what a model learns.","answer":"Training-Data Poisoning","why":"Corrupted or adversarial training examples manipulate what a model learns."},{"id":"prompting-13","label":"Attempts to bypass safety guardrails to generate restricted content.","answer":"Prompt Jailbreaking","why":"Attempts to bypass safety guardrails to generate restricted content."}]},"decks/shared/rag.json":{"id":"rag","runner":"board","title":"RAG","blurb":"Retrieval-augmented generation, part by part.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 3","asOf":"2026-07","area":"genai","hint":"Place it in the retrieval path: preparing knowledge, finding candidates, improving their relevance, or ensuring the generated answer remains supported and traceable.","items":[{"id":"rag-01","label":"A numeric vector representing semantic characteristics so related content can be compared mathematically.","answer":"Embedding","why":"A numeric vector representing semantic characteristics so related content can be compared mathematically."},{"id":"rag-02","label":"Splits source documents into retrievable passages sized to preserve meaning without wasting context.","answer":"Chunking","why":"Splits source documents into retrievable passages sized to preserve meaning without wasting context."},{"id":"rag-03","label":"Stores embeddings and supports efficient nearest-neighbor similarity search.","answer":"Vector Index","why":"Stores embeddings and supports efficient nearest-neighbor similarity search."},{"id":"rag-04","label":"Retrieves content by meaning rather than requiring exact keyword overlap.","answer":"Semantic Search","why":"Retrieves content by meaning rather than requiring exact keyword overlap."},{"id":"rag-05","label":"Retrieves content using lexical term matches and remains useful for names, codes, and exact phrases.","answer":"Keyword Search","why":"Retrieves content using lexical term matches and remains useful for names, codes, and exact phrases."},{"id":"rag-06","label":"Combines semantic and keyword retrieval to benefit from meaning and exact-term matching.","answer":"Hybrid Search","why":"Combines semantic and keyword retrieval to benefit from meaning and exact-term matching."},{"id":"rag-07","label":"Restricts retrieval by attributes such as tenant, date, document type, or access level.","answer":"Metadata Filter","why":"Restricts retrieval by attributes such as tenant, date, document type, or access level."},{"id":"rag-08","label":"Re-scores retrieved candidates to place the passages most relevant to the full query first.","answer":"Reranker","why":"Re-scores retrieved candidates to place the passages most relevant to the full query first."},{"id":"rag-09","label":"Constrains generation to supplied evidence so claims can be supported and traced.","answer":"Grounding","why":"Constrains generation to supplied evidence so claims can be supported and traced."},{"id":"rag-10","label":"Links an answer claim back to the source passage that supports it.","answer":"Citation","why":"Links an answer claim back to the source passage that supports it."},{"id":"rag-11","label":"Indicates whether the retrieval stage finds the evidence needed to answer a question.","answer":"Retrieval Recall","why":"If 100 questions require a known evidence passage and the retriever returns it for 85, retrieval recall is 85%. Low retrieval recall points to chunking, embeddings, filters, query rewriting, or candidate-count problems that generation cannot repair."},{"id":"rag-12","label":"Indicates how much of the retrieved context is relevant rather than distracting noise.","answer":"Retrieval Precision","why":"Indicates how much of the retrieved context is relevant rather than distracting noise."}]},"decks/shared/responsible.json":{"id":"responsible","runner":"board","title":"Responsible AI","blurb":"Fairness, transparency, explainability, safety and their measures.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 4","asOf":"2026-07","area":"risk","hint":"Identify the source of harm and the matching control; documenting a risk, preventing it, detecting it, and requiring human approval are distinct safeguards.","items":[{"id":"responsible-01","label":"Existing social or institutional inequality is reflected in the data used to build the system.","answer":"Historical Bias","why":"Existing social or institutional inequality is reflected in the data used to build the system."},{"id":"responsible-02","label":"Some people, conditions, languages, or cases are underrepresented in the dataset.","answer":"Representation Bias","why":"Some people, conditions, languages, or cases are underrepresented in the dataset."},{"id":"responsible-03","label":"The chosen feature or label is an imperfect and systematically distorted proxy for the real concept.","answer":"Measurement Bias","why":"The chosen feature or label is an imperfect and systematically distorted proxy for the real concept."},{"id":"responsible-04","label":"Evaluates whether system quality and harms are acceptably distributed across relevant groups.","answer":"Fairness","why":"Evaluates whether system quality and harms are acceptably distributed across relevant groups."},{"id":"responsible-05","label":"Helps people understand the factors or evidence contributing to a model output.","answer":"Explainability","why":"Helps people understand the factors or evidence contributing to a model output."},{"id":"responsible-06","label":"Communicates that AI is being used, its intended purpose, limitations, and accountable owner.","answer":"Transparency","why":"Communicates that AI is being used, its intended purpose, limitations, and accountable owner."},{"id":"responsible-07","label":"Places qualified people in review or approval paths for uncertain, sensitive, or consequential cases.","answer":"Human Oversight","why":"Places qualified people in review or approval paths for uncertain, sensitive, or consequential cases."},{"id":"responsible-08","label":"Records where content came from and whether it was generated or modified by AI.","answer":"Content Provenance","why":"Records where content came from and whether it was generated or modified by AI."},{"id":"responsible-09","label":"Detects and removes personal data before it reaches a model, log, or unauthorized recipient.","answer":"PII Redaction","why":"Detects and removes personal data before it reaches a model, log, or unauthorized recipient."},{"id":"responsible-10","label":"Gives a model, agent, or tool only the permissions required for its specific task.","answer":"Least Privilege","why":"Gives a model, agent, or tool only the permissions required for its specific task."},{"id":"responsible-11","label":"Untrusted instructions in user input or retrieved content attempt to redirect model behavior.","answer":"Prompt Injection","why":"Untrusted instructions in user input or retrieved content attempt to redirect model behavior."},{"id":"responsible-12","label":"Malicious instructions hidden in external content are retrieved or read by an AI system.","answer":"Indirect Prompt Injection","why":"Malicious instructions hidden in external content are retrieved or read by an AI system."},{"id":"responsible-13","label":"Input is crafted to evade behavioral safeguards and elicit prohibited output.","answer":"Jailbreaking","why":"Input is crafted to evade behavioral safeguards and elicit prohibited output."},{"id":"responsible-14","label":"Manipulated training examples introduce attacker-chosen behavior or systematic errors.","answer":"Training-Data Poisoning","why":"Manipulated training examples introduce attacker-chosen behavior or systematic errors."},{"id":"responsible-15","label":"Malicious or misleading documents are inserted into a knowledge source to corrupt grounded answers.","answer":"Retrieval Poisoning","why":"Malicious or misleading documents are inserted into a knowledge source to corrupt grounded answers."},{"id":"responsible-16","label":"The system reveals confidential information through output, logs, memory, or tool results.","answer":"Sensitive-Data Disclosure","why":"The system reveals confidential information through output, logs, memory, or tool results."},{"id":"responsible-17","label":"An agent can take consequential actions without adequate scope limits, confirmation, or supervision.","answer":"Excessive Agency","why":"An agent can take consequential actions without adequate scope limits, confirmation, or supervision."},{"id":"responsible-18","label":"Abusive requests trigger excessive model or tool consumption and create avoidable cost.","answer":"Denial of Wallet","why":"Abusive requests trigger excessive model or tool consumption and create avoidable cost."},{"id":"responsible-19","label":"Documents intended use, evaluation results, limitations, risks, and other facts about a model.","answer":"Model Card","why":"Documents intended use, evaluation results, limitations, risks, and other facts about a model."},{"id":"responsible-20","label":"Records prompts, model versions, retrieved evidence, tool actions, approvals, and outcomes for accountability.","answer":"Audit Trail","why":"Records prompts, model versions, retrieved evidence, tool actions, approvals, and outcomes for accountability."}]},"decks/shared/drift-pairs.json":{"id":"drift-pairs","runner":"pairs","title":"One Fact Changes Everything — Drift","blurb":"Two near-identical incidents. One fact differs, and the diagnosis flips.","source":"Gama et al. (2014), A survey on concept drift adaptation · Moreno-Torres et al. (2012), A unifying view on dataset shift","asOf":"2026-07","area":"ops","pairs":[{"id":"dp-01","dimension":"whether the input-to-outcome relationship still holds","buckets":["Covariate drift","Concept drift"],"a":{"text":"A credit model sees a wave of applicants from a new region. For any given income, employment and history profile, default rates are exactly what the model expects.","answer":"Covariate drift","why":"The inputs moved into new territory but the rule is intact. More representative training data fixes it; a new rule is not needed."},"b":{"text":"A credit model sees the same wave of applicants from a new region. For an identical income, employment and history profile, default rates there are twice what the model expects.","answer":"Concept drift","why":"Identical inputs now produce different outcomes, so P(Y|X) has changed. No amount of rebalancing the input mix will fix a relationship that no longer holds."}},{"id":"dp-02","dimension":"whether the change originates in the world or in the pipeline","buckets":["Concept drift","Upstream data break"],"a":{"text":"A pricing model's error jumps on a Tuesday. Investigation finds a competitor launched an aggressive discount campaign that morning.","answer":"Concept drift","why":"A real change in the world altered the relationship the model encodes. Retraining on post-change data is the correct response."},"b":{"text":"A pricing model's error jumps on a Tuesday. Investigation finds the overnight ETL job began writing list price into the field that previously held net price.","answer":"Upstream data break","why":"Nothing about pricing behaviour changed — the model is being fed a different quantity under the same name. Retraining here bakes the defect in and hides it."}},{"id":"dp-03","dimension":"whether the old and new regimes coexist during the transition","buckets":["Concept drift — gradual","Concept drift — incremental"],"a":{"text":"Over six months a fraud model degrades as an old attack pattern is progressively replaced by a new one. Throughout the period, both patterns arrive in volume.","answer":"Concept drift — gradual","why":"Two distinct concepts overlapping in time, with the mixture weight moving. An ensemble that keeps a model per concept handles this well."},"b":{"text":"Over six months a fraud model degrades as attackers continuously adjust transaction sizes upward in small steps, with no distinct old and new pattern at any point.","answer":"Concept drift — incremental","why":"One concept moving smoothly through intermediate states. A rolling retraining window tracks it; concept-switching machinery has nothing to switch between."}},{"id":"dp-04","dimension":"whether the shift is in the inputs or in the outcome mix","buckets":["Covariate drift","Label shift"],"a":{"text":"A screening model is deployed at a new clinic. The patients are younger and fitter than the training population, and disease prevalence is unchanged.","answer":"Covariate drift","why":"The feature distribution moved while the outcome mix did not. The concern is extrapolation into thinly-covered input regions."},"b":{"text":"A screening model is deployed at a new clinic. The patients look demographically identical to the training population, but disease prevalence is a quarter of what it was.","answer":"Label shift","why":"P(Y) moved with P(X|Y) intact, so the model's ranking still works but its probabilities are systematically too high. Prior correction, not retraining."}},{"id":"dp-05","dimension":"whether ground-truth labels are available to confirm the degradation","buckets":["Prediction drift","Confirmed model decay"],"a":{"text":"A collections model's share of high-risk scores rises from 12% to 25% in a month. Outcomes take ninety days to observe, so none are yet available for this cohort.","answer":"Prediction drift","why":"An output-distribution change with no labels is a signal to investigate, not a finding. It may be a correct response to a genuinely riskier population."},"b":{"text":"A collections model's share of high-risk scores rises from 12% to 25% in a month, and the cohort from ninety days ago has now resolved with precision down 18 points.","answer":"Confirmed model decay","why":"Labels have arrived and quality has actually fallen. Only now is retraining justified on evidence rather than on the shape of a histogram."}},{"id":"dp-06","dimension":"whether the prior regime returns","buckets":["Concept drift — recurring","Concept drift — sudden"],"a":{"text":"A logistics model's accuracy collapses every year in the fortnight before Christmas and recovers immediately afterwards.","answer":"Concept drift — recurring","why":"A known concept that comes back on a cycle. Retire nothing: keep the seasonal model and select it by context."},"b":{"text":"A logistics model's accuracy collapses in the fortnight after a permanent change to national delivery regulations, and never recovers.","answer":"Concept drift — sudden","why":"An abrupt, one-way change with no return. The pre-change model has no further use and the pre-change data has limited value for retraining."}},{"id":"dp-07","dimension":"whether the target definition or the population changed","buckets":["Concept drift","Label shift"],"a":{"text":"A moderation team rewrites its guidance so that a category of borderline content is now labelled 'violating' where it was previously 'acceptable'. The content arriving is unchanged.","answer":"Concept drift","why":"Same inputs, different labels: the mapping was redefined. Every historical label under the old guidance is now partly wrong for training purposes."},"b":{"text":"A moderation team's guidance is unchanged, but a viral trend means genuinely violating content rises from 2% to 9% of the queue.","answer":"Label shift","why":"The rule is stable; the mix of outcomes moved. Thresholds and capacity planning need attention, not the model's learned boundary."}},{"id":"dp-08","dimension":"whether the monitored change is in the model or in the data","buckets":["Prediction drift","Upstream data break"],"a":{"text":"Scores shift the day a new model version is released. A fixed reference sample, replayed through both versions, reproduces the shift exactly.","answer":"Prediction drift","why":"Identical inputs producing different outputs isolates the change to the model. This is the expected use of a golden reference sample at release."},"b":{"text":"Scores shift the day a new model version is released. The same fixed reference sample, replayed through both versions, produces identical outputs.","answer":"Upstream data break","why":"If the model is provably unchanged on fixed inputs, the live inputs must have changed — and a same-day coincidence points at the deploy's data-side changes, not at the world."}}]},"decks/shared/risk-hierarchy-pairs.json":{"id":"risk-hierarchy-pairs","runner":"pairs","title":"One Fact Changes Everything — Treatment vs Control","blurb":"The two hierarchies answer different questions. These pairs are where people conflate them.","source":"ISO 31000:2018 §6.5 · Hierarchy of controls (NIOSH), applied to AI systems","asOf":"2026-07","area":"risk","pairs":[{"id":"rhp-01","dimension":"whether the measure changes the hazard or only who pays for it","buckets":["Reduce","Transfer"],"a":{"text":"The firm adds output validation and human review to a claims model, cutting the rate of wrong denials.","answer":"Reduce","why":"The probability of the harm actually falls. Reduction is the only treatment that makes the affected person better off."},"b":{"text":"The firm buys an insurance policy covering the cost of wrongly denied claims, leaving the model unchanged.","answer":"Transfer","why":"The claimant is denied at exactly the same rate; only the firm's balance sheet is protected. Insurance is never a control."}},{"id":"rhp-02","dimension":"whether the activity continues at all","buckets":["Avoid","Reduce"],"a":{"text":"After assessment, the emotion-inference feature is cancelled and removed from the roadmap.","answer":"Avoid","why":"The activity stops, so the exposure goes to zero. Avoidance is the only treatment with no residual risk to record."},"b":{"text":"After assessment, the emotion-inference feature ships with confidence thresholds, subgroup evaluation and human review of low-confidence cases.","
