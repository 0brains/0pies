ontrol catalogues."}}]},"decks/shared/risk-pairs.json":{"id":"risk-pairs","runner":"pairs","title":"One Fact Changes Everything — Risk","blurb":"Eight vocabulary distinctions that decide who signs, what is measured, and whether the answer is defensible.","source":"ISO 31000:2018 · IIA Three Lines Model (2020) · NIST AI RMF 1.0","asOf":"2026-07","area":"risk","pairs":[{"id":"rp-01","dimension":"whether controls are assumed to be operating","buckets":["Inherent risk","Residual risk"],"a":{"text":"The assessment rates the exposure from an automated decisioning model as if none of the review, threshold or appeal mechanisms existed.","answer":"Inherent risk","why":"Inherent risk is the gross position before controls. It exists to size the control effort, and it is never what gets accepted."},"b":{"text":"The assessment rates the same model with review, thresholds and appeal operating as designed, and reports what remains.","answer":"Residual risk","why":"Residual risk is what sign-off is actually against. Accepting against the inherent figure over-states what the organisation has agreed to carry."}},{"id":"rp-02","dimension":"whether the statement sets a strategic level or an operational limit","buckets":["Risk appetite","Risk tolerance"],"a":{"text":"The board states that the organisation will not pursue AI applications that make consequential decisions about individuals without human review.","answer":"Risk appetite","why":"Appetite is the broad, forward-looking statement of what risk the organisation is willing to take in pursuit of its objectives."},"b":{"text":"The policy states that a model may go live only if subgroup accuracy disparity is below four percentage points.","answer":"Risk tolerance","why":"Tolerance is the measurable boundary that operationalises appetite. Appetite without tolerance cannot be tested; tolerance without appetite is arbitrary."}},{"id":"rp-03","dimension":"whether the thing named is the source or the effect","buckets":["Hazard","Risk"],"a":{"text":"The model can produce fluent, confident text that is factually wrong.","answer":"Hazard","why":"A hazard is the intrinsic potential to cause harm. It is a property of the thing and does not depend on deployment."},"b":{"text":"Because the model drafts patient discharge instructions read by non-specialists, confident errors may lead to incorrect medication use.","answer":"Risk","why":"Risk combines the hazard with exposure and consequence in a context. The same hazard is a different risk in a different deployment — which is why tiers attach to use."}},{"id":"rp-04","dimension":"whether the measure stops the harm or finds it afterwards","buckets":["Preventive","Detective"],"a":{"text":"Input validation rejects requests containing patterns that the system is not authorised to process.","answer":"Preventive","why":"Preventive controls act on likelihood, before the event. They are the only kind that can bring a probability meaningfully toward zero."},"b":{"text":"A weekly report lists requests that were processed despite falling outside authorised categories.","answer":"Detective","why":"Detective controls act on duration and impact after the fact. A register listing detective controls as mitigation of likelihood over-states its position."}},{"id":"rp-05","dimension":"whether the function can be independent of what it reviews","buckets":["Second line","Third line"],"a":{"text":"The AI governance team reviews the delivery team's impact assessment and challenges its conclusions, reporting to the chief risk officer.","answer":"Second line","why":"Independent of delivery but still inside management. Second line advises, challenges and monitors; it cannot provide assurance on itself."},"b":{"text":"A review function examines whether those governance reviews were carried out as policy requires, and reports to the audit committee.","answer":"Third line","why":"Reporting to the board rather than to management is the structural difference. Without it, assurance is self-assessment with a different letterhead."}},{"id":"rp-06","dimension":"whether the response changes the risk or merely observes it","buckets":["Reduce","Accept"],"a":{"text":"The team adds an automated evaluation gate that blocks releases failing the robustness threshold.","answer":"Reduce","why":"Likelihood falls because a failing release cannot ship. Something about the risk itself changed."},"b":{"text":"The team adds a dashboard showing robustness scores, and agrees to review them monthly with no gating.","answer":"Accept","why":"Watching a risk is not treating it. Monitoring plus a decision not to gate is retention with better visibility — legitimate, provided it is recorded as acceptance."}},{"id":"rp-07","dimension":"whether the assessment is about the model or about the deployment","buckets":["Model-level obligation","Use-based obligation"],"a":{"text":"A general-purpose model exceeding the compute threshold must undergo adversarial testing and report serious incidents.","answer":"Model-level obligation","why":"Systemic-risk GPAI duties attach to the model regardless of any downstream use, which is why they sit outside the risk pyramid."},"b":{"text":"A deployer using that same model to screen job applicants must meet high-risk obligations for the deployment.","answer":"Use-based obligation","why":"The tier follows the purpose. One model can simultaneously carry model-level duties and sit in several different use tiers."}},{"id":"rp-08","dimension":"whether accountability moved with the work","buckets":["Transfer of consequence","Retained accountability"],"a":{"text":"A contract makes the vendor liable for the cost of damages arising from defects in the model they supplied.","answer":"Transfer of consequence","why":"Financial consequence moves. This is a legitimate treatment and it changes nothing about the harm's likelihood."},"b":{"text":"The regulator holds the deploying firm answerable for the outcomes of the decisions it makes with that vendor's model.","answer":"Retained accountability","why":"Regulatory accountability generally cannot be contracted away. Assuming an indemnity covers it is the most expensive version of this confusion."}}]},"decks/shared/solution-builder.json":{"id":"solution-builder","runner":"board","title":"Solution Builder","blurb":"Pick the technique the problem actually calls for.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 1","asOf":"2026-07","area":"foundations","hint":"Read the data and the desired output, then drag each scenario onto its technique.","items":[{"id":"sol-01","label":"A supermarket wants to understand which products are frequently bought together.","sub":"Market Basket Analysis","answer":"Association Rules (Apriori)","why":"Association learning finds item combinations that occur together and measures their support, confidence, and lift. Place or promote associated products together to increase basket value."},{"id":"sol-02","label":"A subscription business wants to identify customers likely to cancel next month.","sub":"Customer Churn","answer":"Binary Classification","why":"The target is a labeled category with two possible classes: churn or retain. Focus retention offers on customers with high churn probability."},{"id":"sol-03","label":"A property platform wants to estimate the selling price of a new listing.","sub":"House Price Estimation","answer":"Regression","why":"Regression learns relationships between input features and a numeric target. Provide a data-informed price estimate for each property."},{"id":"sol-04","label":"A retailer wants to discover natural customer groups without predefined labels.","sub":"Customer Segmentation","answer":"Clustering","why":"Clustering is unsupervised learning that groups records by similarity without labeled outcomes. Create tailored campaigns for distinct behavioral segments."},{"id":"sol-05","label":"A factory wants to identify unusual machine behavior before a breakdown.","sub":"Equipment Failure Signals","answer":"Anomaly Detection","why":"Anomaly detection models normal behavior and flags observations that deviate from it. Investigate abnormal equipment early and reduce unplanned downtime."},{"id":"sol-06","label":"A distributor needs weekly demand estimates for the next quarter.","sub":"Demand Planning","answer":"Time-Series Forecasting","why":"Forecasting explicitly models observations ordered over time, including trend and seasonality. Plan inventory and staffing around expected demand."},{"id":"sol-07","label":"A streaming platform wants to suggest content each user is likely to enjoy.","sub":"Personalized Media","answer":"Recommendation System","why":"Recommendation systems learn affinity from user, item, and interaction patterns. Present a personalized ranked list that improves discovery and engagement."},{"id":"sol-08","label":"A product team wants to track whether customer reviews are positive, neutral, or negative.","sub":"Review Sentiment","answer":"NLP Text Classification","why":"Text classification converts language into features and predicts a predefined label. Monitor sentiment trends and route negative feedback for attention."},{"id":"sol-09","label":"A production line needs to decide whether each component image is acceptable or defective.","sub":"Visual Quality Control","answer":"Image Classification","why":"Image classification predicts a category for an entire image. Automatically separate likely defects for inspection."},{"id":"sol-10","label":"A vehicle-assistance system must find every pedestrian visible in a camera frame.","sub":"Pedestrian Safety","answer":"Object Detection","why":"Object detection predicts what objects are present and where each one appears. Locate pedestrians so downstream safety systems can respond."},{"id":"sol-11","label":"Employees need answers grounded in frequently changing internal policies with source references.","sub":"Current Policy Assistant","answer":"Retrieval-Augmented Generation","why":"RAG retrieves relevant external context at request time and supplies it to a generative model. Answer from current policies with traceable supporting sources."},{"id":"sol-12","label":"A language model must consistently produce reports in a stable specialist format and tone.","sub":"Consistent Specialist Style","answer":"Fine-Tuning","why":"Fine-tuning updates model behavior from examples and is useful for stable style or task adaptation. Generate reports that consistently follow the specialist pattern."},{"id":"sol-13","label":"A general language model must return names, dates, and totals as a strict JSON object.","sub":"Structured Extraction","answer":"Few-Shot Prompting","why":"Few-shot prompts demonstrate the expected task and format inside the model context. Produce consistently structured output with minimal setup."},{"id":"sol-14","label":"A robot must learn efficient routes through a changing warehouse by trying actions.","sub":"Warehouse Navigation","answer":"Reinforcement Learning","why":"Reinforcement learning improves action choices through feedback expressed as rewards and penalties. Navigate dynamically while balancing speed and safety."},{"id":"sol-15","label":"A marketing team wants to create new product images from written creative briefs.","sub":"Campaign Artwork","answer":"Diffusion Model","why":"Diffusion models generate images by learning to reverse a gradual noising process conditioned on a prompt. Create original campaign concepts from natural-language descriptions."},{"id":"sol-16","label":"A public benefit must be approved only when a fixed set of legal conditions is met.","sub":"Statutory Eligibility","answer":"Deterministic Rules (No AI)","why":"A fixed rule engine is preferable when the required outcome is exact, explainable, and fully specified. Produce consistent decisions that can be traced directly to policy."},{"id":"sol-17","label":"A team has one historical dataset and needs to develop a model without overstating its performance.","sub":"Honest Model Evaluation","answer":"Train / Validation / Test Split","why":"Training data learns parameters, validation data guides model and hyperparameter choices, and untouched test data estimates final generalization. Compare models during development while preserving an honest final evaluation."},{"id":"sol-18","label":"A help desk wants to route new tickets into categories defined by its support team.","sub":"Known Ticket Categories","answer":"Supervised Learning","why":"Supervised learning uses labeled examples to learn how inputs relate to predefined answers. Automatically route new tickets to an appropriate support queue."},{"id":"sol-19","label":"A music service wants to discover listener behavior types without deciding the groups in advance.","sub":"Unknown Listening Patterns","answer":"Unsupervised Learning","why":"Unsupervised learning discovers patterns in data that has no predefined label or numeric target. Reveal useful listener segments for product research and personalization."},{"id":"sol-20","label":"A team has billions of sentences but very little manually labeled language data.","sub":"Learning Language at Scale","answer":"Self-Supervised Pretraining","why":"Self-supervised learning creates labels from the raw data, such as masking tokens and training the model to reconstruct them. Build general representations that can later be adapted with much less labeled data."},{"id":"sol-21","label":"A language model is capable but often produces responses people judge as unhelpful or poorly aligned.","sub":"Aligning an Assistant","answer":"RLHF","why":"RLHF learns a reward model from human preferences and then optimizes model behavior toward that reward. Produce responses that better reflect human expectations and instructions."},{"id":"sol-22","label":"A model reaches 99% training accuracy but only 68% validation accuracy.","sub":"Memorized Training Examples","answer":"Regularization & Early Stopping","why":"The gap signals overfitting and high variance; limiting complexity or stopping before memorization can improve unseen performance. Trade a little training performance for stronger validation and production performance."},{"id":"sol-23","label":"A small model performs poorly on both its training data and validation data.","sub":"Model Too Simple","answer":"Increase Model Capacity","why":"Poor performance even on training data indicates underfitting and high bias; richer features, greater capacity, or longer training may help. Learn a model complex enough to represent the useful signal."},{"id":"sol-24","label":"A team must select learning rate, batch size, tree depth, and regularization strength.","sub":"Choosing Training Settings","answer":"Hyperparameter Optimization","why":"Hyperparameters are selected outside parameter learning and should be compared using validation data or cross-validation. Find a strong configuration while preserving the test set for final evaluation."},{"id":"sol-25","label":"A lender recalculates risk for five million existing accounts every night.","sub":"Overnight Portfolio Scoring","answer":"Batch Inference","why":"Batch inference scores stored records together and is appropriate when results can be produced on a schedule. Generate updated portfolio risk scores before the next business day."},{"id":"sol-26","label":"A payment platform must assess each transaction while the customer is waiting at checkout.","sub":"Payment Authorization","answer":"Real-Time Inference","why":"Real-time inference serves individual requests through a persistent endpoint when low latency is essential. Approve, decline, or review the transaction without disrupting checkout."},{"id":"sol-27","label":"A screening model supports clinicians where missing a genuine case is much more harmful than reviewing a false alarm.","sub":"Rare Disease Screening","answer":"Recall-Focused Evaluation","why":"Recall measures the fraction of actual positives found; accuracy can look high on imbalanced data while missing rare cases. Select a threshold and model that minimizes dangerous false negatives."},{"id":"sol-28","label":"A manager wants total sales by region and the percentage change from last month.","sub":"Monthly Sales Summary","answer":"Descriptive Analytics (No ML)","why":"Grouping, summing, and calculating percentage change are deterministic analytics tasks with no learning or prediction requirement. Produce an exact, auditable report with a database query or business-intelligence calculation."}]},"decks/shared/model-decisions.json":{"id":"model-decisions","runner":"board","title":"Model Decision Lab","blurb":"Choose the move that addresses the actual cause.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 3","asOf":"2026-07","area":"genai","zoneMode":"options","hint":"Drag each situation onto the response it calls for. Some responses on the board are there to tempt you.","items":[{"id":"model-decisions-01","label":"An assistant must answer from private policies that change every week and cite the current source.","sub":"Frequently Changing Policies","options":["Retrieval-Augmented Generation","Fine-Tuning","Longer System Prompt"],"answer":"Retrieval-Augmented Generation","why":"RAG retrieves current private evidence at request time and supports citations. Trade-off: Fine-tuning can adapt behavior, but it is a poor mechanism for frequently changing facts."},{"id":"model-decisions-02","label":"Thousands of examples demonstrate a stable report style that the base model fails to reproduce consistently.","sub":"Stable Specialist Format","options":["Fine-Tuning","RAG","Increase Temperature"],"answer":"Fine-Tuning","why":"Fine-tuning is appropriate for recurring behavior demonstrated by a curated example set. Trade-off: Few-shot prompting should still be tried first when it meets quality requirements at lower complexity."},{"id":"model-decisions-03","label":"A capable model must extract five fields into a validated JSON object; no new knowledge is required.","sub":"Strict JSON Extraction","options":["Prompt with Structured Output","Continued Pretraining","Vector Search"],"answer":"Prompt with Structured Output","why":"Clear instructions, examples, a schema, and validation address formatting without changing model weights. Trade-off: Fine-tuning becomes reasonable only if prompt-based extraction repeatedly fails at the required scale and quality."},{"id":"model-decisions-04","label":"A model must internalize specialized terminology from a very large unlabeled scientific corpus.","sub":"Domain Language at Scale","options":["Continued Pretraining","RAG Only","Higher Top-p"],"answer":"Continued Pretraining","why":"Continued pretraining adapts the model's language representations using large quantities of domain text. Trade-off: RAG remains preferable when the need is access to changing facts rather than deeper domain-language adaptation."},{"id":"model-decisions-05","label":"The system must inspect an order, request approval, call a refund API, and report the result.","sub":"Action-Taking Assistant","options":["Agent with Constrained Tools","Text Generation Only","Embedding Model"],"answer":"Agent with Constrained Tools","why":"A tool-using agent can orchestrate steps, but each tool needs narrow permissions, validation, and approval gates. Trade-off: A deterministic workflow is safer when the sequence is fixed and does not require model-directed planning."},{"id":"model-decisions-06","label":"A claims system must reason over a damage photograph together with the written incident description.","sub":"Image and Text Inspection","options":["Multimodal Foundation Model","Text Embedding Model","Keyword Search"],"answer":"Multimodal Foundation Model","why":"A multimodal model can jointly interpret visual and textual inputs. Trade-off: Separate specialist vision and text models may win when independent outputs, control, or lower cost matter more."},{"id":"model-decisions-07","label":"Ten million short records must be classified nightly under a tight budget after labels are available.","sub":"High-Volume Simple Classification","options":["Small Task-Specific Model","Largest Available Foundation Model","Real-Time Agent"],"answer":"Small Task-Specific Model","why":"A smaller evaluated classifier can deliver adequate quality with much lower batch-inference cost. Trade-off: A foundation model may accelerate prototyping or create labels, but should earn its production cost through measured quality."},{"id":"model-decisions-08","label":"Published rules completely determine eligibility and every decision must be reproducible and auditable.","sub":"Exact Eligibility Policy","options":["Deterministic Rules","Fine-Tuned LLM","Autonomous Agent"],"answer":"Deterministic Rules","why":"Exact, complete rules should be implemented directly rather than approximated by a probabilistic model. Trade-off: AI can assist document intake or explanation without owning the authoritative decision."}]},"decks/shared/genai-ops.json":{"id":"genai-ops","runner":"board","title":"GenAI Evaluation & Ops","blurb":"Diagnose the failure, then pick the intervention that fits it.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 3","asOf":"2026-07","area":"ops","zoneMode":"options","hint":"Drag each situation onto the response it calls for. Some responses on the board are there to tempt you.","items":[{"id":"genai-ops-01","label":"Answers read well but include claims absent from the retrieved policy passages.","sub":"Unsupported Claims","options":["Measure Groundedness and Require Citations","Increase Temperature","Add More Agent Tools"],"answer":"Measure Groundedness and Require Citations","why":"First determine whether claims are supported, then tighten evidence use, refusal behavior, and citation validation. Trade-off: A larger model may improve fluency without solving missing or ignored evidence."},{"id":"genai-ops-02","label":"The answer generator cannot use the right fact because the relevant passage is absent from the retrieved set.","sub":"Correct Evidence Never Appears","options":["Measure Retrieval Recall","Fine-Tune Response Style","Lower Maximum Tokens"],"answer":"Measure Retrieval Recall","why":"Retrieval recall isolates whether chunking, embeddings, filters, query rewriting, or candidate count misses needed evidence. Trade-off: Generation changes cannot recover evidence that never enters the context."},{"id":"genai-ops-03","label":"The relevant passage is present, but it is buried among many distracting chunks.","sub":"Too Much Irrelevant Context","options":["Improve Retrieval Precision and Reranking","Add More Chunks","Raise Temperature"],"answer":"Improve Retrieval Precision and Reranking","why":"Better filters, hybrid retrieval, and reranking reduce noise while preserving the best evidence. Trade-off: Increasing candidate count can improve recall but may worsen precision, latency, and token cost."},{"id":"genai-ops-04","label":"A prompt change improved test examples but degraded several important customer workflows.","sub":"Quality Varies After Release","options":["Run a Golden-Set Regression Evaluation","Judge Five Handpicked Outputs","Deploy and Watch Complaints"],"answer":"Run a Golden-Set Regression Evaluation","why":"A versioned representative evaluation set detects regressions across use cases before release. Trade-off: Human review remains valuable when guided by a rubric and sampled across the real distribution."},{"id":"genai-ops-05","label":"An LLM judge consistently scores longer answers higher even when concise answers are correct.","sub":"Evaluator Prefers Verbose Answers","options":["Calibrate Against Human Ratings","Trust the Automated Score","Increase Every Output Length"],"answer":"Calibrate Against Human Ratings","why":"LLM judges can have position, verbosity, and self-preference biases and must be calibrated with human judgments. Trade-off: Automated judging remains useful for scale after its rubric and bias are validated."},{"id":"genai-ops-06","label":"Usage is steady, but average input context and output length have tripled.","sub":"Interactive Cost Spike","options":["Track Tokens, Trim Context, and Cap Output","Provision More GPUs Immediately","Increase Top-p"],"answer":"Track Tokens, Trim Context, and Cap Output","why":"Token telemetry exposes the direct cost driver; retrieve less noise, summarize history, cache stable context, and cap output. Trade-off: Provisioned throughput helps predictable high utilization, not wasteful prompt growth by itself."},{"id":"genai-ops-07","label":"Many users ask semantically equivalent questions about unchanged public information.","sub":"Slow but Repeated Answers","options":["Use Evaluated Semantic Caching","Fine-Tune Every Week","Disable Monitoring"],"answer":"Use Evaluated Semantic Caching","why":"A carefully keyed cache can reduce latency and token spend for equivalent requests when freshness and access boundaries are respected. Trade-off: Do not cache sensitive, personalized, rapidly changing, or insufficiently isolated responses."},{"id":"genai-ops-08","label":"A support agent calls the same failing API until its execution budget is exhausted.","sub":"Agent Repeats a Tool Call","options":["Add Call Limits, Error State, and Fallback","Give the Agent More Permissions","Hide Tool Errors"],"answer":"Add Call Limits, Error State, and Fallback","why":"Bounded retries, explicit error handling, idempotency, observability, and human escalation prevent runaway loops. Trade-off: Improving tool descriptions helps selection but does not replace runtime limits and failure controls."},{"id":"genai-ops-10","label":"A medical support model is uncertain and the cost of a wrong recommendation is severe.","sub":"High-Stakes Low Confidence","options":["Abstain and Route to Human Review","Force the Most Likely Answer","Raise Temperature"],"answer":"Abstain and Route to Human Review","why":"Confidence thresholds, abstention, evidence display, and qualified human review are appropriate for consequential uncertainty. Trade-off: Human oversight needs clear responsibility, useful context, and measured review quality rather than ceremonial approval."}]},"decks/shared/drift-types.json":{"id":"drift-types","runner":"board","title":"Name That Drift","blurb":"Eight ways a model goes stale. Sort each production symptom into the one it actually is.","source":"Gama et al. (2014), A survey on concept drift adaptation · Moreno-Torres et al. (2012), A unifying view on dataset shift · NIST AI RMF 1.0 MEASURE 2.4","asOf":"2026-07","area":"ops","hint":"Drag each production symptom onto the kind of drift it describes. The question is always which distribution moved — the inputs, the labels, the outputs, or the relationship between them.","note":"An upstream data break gets a zone of its own because it looks identical to real drift on every dashboard, and the correct response is the opposite one: fix the feed, never retrain on it.","zones":[{"key":"Covariate drift","name":"Covariate drift","def":"P(X) moves. The inputs look different, but the rule mapping inputs to outcomes still holds."},{"key":"Concept drift — sudden","name":"Concept drift — sudden","def":"P(Y|X) changes abruptly at a point in time. The old rule stops applying overnight."},{"key":"Concept drift — gradual","name":"Concept drift — gradual","def":"The old and new rules coexist, with the new one appearing in an increasing share of cases."},{"key":"Concept drift — incremental","name":"Concept drift — incremental","def":"The rule itself moves continuously through intermediate states rather than switching between two."},{"key":"Concept drift — recurring","name":"Concept drift — recurring","def":"A previously seen rule returns on a cycle. Seasonality is the common case."},{"key":"Label shift","name":"Label shift","def":"P(Y) moves — the mix of outcomes changes — while the features given the outcome behave as before."},{"key":"Prediction drift","name":"Prediction drift","def":"The model's output distribution moves. It is a symptom, observable without any labels, not a diagnosis."},{"key":"Upstream data break","name":"Upstream data break","def":"Nothing in the world changed. A pipeline, schema, unit or default changed, and the model is being fed corrupted input."}],"items":[{"id":"drift-01","label":"A loan model was trained on applicants aged 25–60. After a marketing push into a student market, a third of applications now come from under-25s. Repayment behaviour for any given profile is unchanged.","answer":"Covariate drift","why":"The input mix moved into a region the training data barely covered, but the relationship between profile and repayment is intact. That is P(X) moving with P(Y|X) held — covariate drift, and the fix is coverage, not a new rule."},{"id":"drift-02","label":"A speech model trained mostly on studio recordings now receives a large share of calls from mobile handsets in noisy streets. Words still mean what they meant.","answer":"Covariate drift","why":"Acoustic conditions are an input property. The mapping from audio to text has not changed; the model is simply operating outside the input region it learned well."},{"id":"drift-03","label":"A demand model built on one country's stores is rolled out to three more countries. The products, the seasons and the buying logic are the same; the store profiles are not.","answer":"Covariate drift","why":"This is the textbook case of the training distribution not covering the deployment distribution. Nothing about how demand is generated changed — only which inputs are being seen."},{"id":"drift-04","label":"A fraud model's precision collapses in a single week. Investigators find a new attack technique that began on a specific date and is now the dominant pattern.","answer":"Concept drift — sudden","why":"The same feature values that meant legitimate last month now mean fraud. P(Y|X) changed, and it changed at a point in time — an abrupt concept change, not a shift in who is transacting."},{"id":"drift-05","label":"A pricing model degrades overnight when a regulator caps a fee that the model had learned to treat as a strong signal of customer segment.","answer":"Concept drift — sudden","why":"A rule change external to the data instantaneously rewires what the feature means. Retraining on post-change data is the fix; nothing about the pre-change data is recoverable."},{"id":"drift-06","label":"A content classifier is fine until a platform policy change takes effect on the first of the month, after which its 'acceptable' label no longer matches moderator decisions.","answer":"Concept drift — sudden","why":"The target definition itself was redefined on a date. The features are unchanged; the ground truth moved under them."},{"id":"drift-07","label":"Over eight months, a churn model's accuracy slides as a competitor's new plan is adopted by more and more customers. Both the old and the new churn dynamics are visible in the data throughout.","answer":"Concept drift — gradual","why":"Two regimes coexist, with the newer one taking an increasing share of cases. That mixture over time is the signature of gradual drift, and it is why a single change point cannot be found."},{"id":"drift-08","label":"A recommendation model degrades slowly as an older cohort of users is progressively replaced by a younger one with different tastes. For a long period both behaviours are present.","answer":"Concept drift — gradual","why":"Two populations with two different input-to-outcome rules overlap during the transition. Detection is late precisely because no single week looks anomalous."},{"id":"drift-09","label":"A spam filter weakens over a year as senders migrate from one template family to another, with a long period where both templates arrive in quantity.","answer":"Concept drift — gradual","why":"Old and new concepts are both live during the switchover. Compare it with incremental drift, where there are no two regimes, just one that keeps moving."},{"id":"drift-10","label":"A delivery-time model's error grows steadily month after month as traffic congestion worsens a little at a time. There is no point at which behaviour jumps and no earlier regime to return to.","answer":"Concept drift — incremental","why":"The relationship is passing continuously through intermediate states rather than alternating between two defined regimes. Rolling-window retraining suits this; change-point detection will find nothing."},{"id":"drift-11","label":"A sensor-based quality model drifts as a machine's components wear, degrading a fraction of a percent per week with no discontinuity.","answer":"Concept drift — incremental","why":"Physical wear moves the input-to-outcome mapping smoothly and monotonically. Each week is a slightly new concept, not a mixture of an old and a new one."},{"id":"drift-12","label":"A language model's topical accuracy erodes month by month as vocabulary and usage evolve, with no single event responsible.","answer":"Concept drift — incremental","why":"Continuous, directional movement of the concept with no change point and no return. The remedy is a refresh cadence, not an alarm threshold."},{"id":"drift-13","label":"A retail forecasting model fails every December, recovers in January, and fails again the following December.","answer":"Concept drift — recurring","why":"A previously seen concept returns on a cycle. The right response is to model the seasonality or keep the seasonal model, not to retrain in a panic each winter."},{"id":"drift-14","label":"An energy demand model's errors follow a weekday/weekend pattern that repeats indefinitely.","answer":"Concept drift — recurring","why":"The alternating regimes are both known and both come back. Retraining on the most recent window alone would make the model permanently wrong for whichever regime it last saw."},{"id":"drift-15","label":"A staffing model degrades during each school holiday and returns to normal afterwards, year after year.","answer":"Concept drift — recurring","why":"Recurring context. Keeping and reselecting historical models per context beats discarding them, because the old concept is guaranteed to return."},{"id":"drift-16","label":"A disease screening model's positive rate falls sharply after a successful vaccination campaign. Symptoms still indicate the disease exactly as before.","answer":"Label shift","why":"The prevalence of the outcome fell — P(Y) moved — while P(X|Y) held. Thresholds and any prior-dependent calibration need adjusting; the learned relationship does not."},{"id":"drift-17","label":"A fraud model trained when 3% of transactions were fraudulent now operates where 0.5% are, because of controls introduced elsewhere. Fraudulent transactions look the same as ever.","answer":"Label shift","why":"The base rate changed, so every probability the model emits is miscalibrated even though its discrimination is unaffected. Prior correction fixes this without retraining."},{"id":"drift-18","label":"A defect classifier is moved from a pilot line with a 20% defect rate to a mature line with 2%. Defects present identically on both.","answer":"Label shift","why":"Only the class prior changed. Reading this as covariate drift leads to pointless feature work; reading it as label shift leads to a threshold recalibration that actually works."},{"id":"drift-19","label":"Monitoring shows the share of 'approve' decisions rising from 61% to 78% over six weeks. No labels have arrived yet, so quality cannot be measured.","answer":"Prediction drift","why":"The output distribution moved. That is an alert, not a diagnosis: it can be caused by covariate drift, label shift, a broken feed, or a genuinely changed population. It is what you watch when labels are delayed."},{"id":"drift-20","label":"A model's average predicted probability climbs steadily while the input feature distributions look stable on every chart.","answer":"Prediction drift","why":"Outputs moving without visible input movement usually means the movement is in a feature interaction or a feature nobody is monitoring. The finding is real; the cause is still unidentified."},{"id":"drift-21","label":"After a model version is deployed, the distribution of scores shifts noticeably even though the incoming data is identical to last week's.","answer":"Prediction drift","why":"Same inputs, different outputs means the change is in the model, not the world. Version-to-version prediction drift is the reason a new release is compared on a fixed reference sample."},{"id":"drift-22","label":"A revenue feature's mean drops to a third of its usual value overnight. An upstream team switched the field from cents to whole units the same night.","answer":"Upstream data break","why":"The world did not change; the unit did. Retraining here would teach the model to treat corrupted values as normal and make the eventual fix look like a new regression."},{"id":"drift-23","label":"A categorical feature suddenly shows 40% nulls. A schema change renamed the source column and the join now misses.","answer":"Upstream data break","why":"A pipeline defect presents exactly like sudden drift on a drift dashboard. The tell is that the change coincides with a deploy or schema event rather than anything in the world."},{"id":"drift-24","label":"A model's inputs shift the moment a vendor changes an API default, silently replacing missing values with zero instead of omitting them.","answer":"Upstream data break","why":"Zeros that mean 'missing' are read by the model as a real, extreme value. The fix is upstream contract enforcement and null semantics, never a retrain."}]},"decks/shared/risk-treatment.json":{"id":"risk-treatment","runner":"board","title":"Risk Treatment Hierarchy","blurb":"Avoid, reduce, transfer, accept. Sort each response into the treatment it actually is.","source":"ISO 31000:2018 §6.5 (risk treatment) · ISO/IEC 23894:2023 §6.5 · NIST AI RMF 1.0 MANAGE 1","asOf":"2026-07","area":"risk","hint":"Drag each decision onto the treatment option it represents. Ask what happened to the risk itself, not how much work the response took.","note":"Treatment answers 'what are we doing about this risk'. It is a different axis from control strength, which answers 'how effective is the reduction'. Buying insurance is a strong treatment decision and no control at all.","zones":[{"key":"Avoid","name":"Avoid","def":"Do not undertake, or stop undertaking, the activity that gives rise to the risk. The exposure goes to zero because the activity goes to zero."},{"key":"Reduce","name":"Reduce","def":"Keep the activity but act on likelihood or impact. Most controls live here, and residual risk always remains."},{"key":"Transfer","name":"Transfer","def":"Move the financial or legal consequence to another party. The hazard is untouched; only who pays changes."},{"key":"Accept","name":"Accept","def":"Retain the risk knowingly, at the level of authority entitled to accept it, and record the decision."}],"items":[{"id":"rt-01","label":"After a risk assessment, the company cancels its planned emotion-recognition feature for workplace monitoring entirely.","answer":"Avoid","why":"The activity itself is abandoned, so the exposure disappears rather than being managed. Avoidance is the only treatment that removes a risk instead of shrinking it."},{"id":"rt-02","label":"A vendor's model would require processing biometric data the firm has no lawful basis for, so the firm withdraws from the procurement.","answer":"Avoid","why":"Declining to proceed is a treatment decision, not the absence of one. It is usually the right answer when the risk is unacceptable at any residual level."},{"id":"rt-03","label":"A bank decides not to deploy an automated decisioning model in the one jurisdiction where it could not meet the contestability requirement.","answer":"Avoid","why":"Scoping the activity out of a jurisdiction removes the exposure there. Partial avoidance by scope is still avoidance."},{"id":"rt-04","label":"A team drops a planned feature that would have inferred health status from purchase history, judging no mitigation sufficient.","answer":"Avoid","why":"When no control brings residual risk within tolerance, avoidance is the remaining option. The tell is that the activity stops, not that it is watched more closely."},{"id":"rt-05","label":"Confidence thresholds are introduced so that uncertain cases are routed to a trained reviewer instead of being auto-decided.","answer":"Reduce","why":"The activity continues with lower likelihood of an unreviewed wrong decision. Residual risk remains — reviewers are fallible — which is the signature of reduction."},{"id":"rt-06","label":"The training corpus is rebalanced and the model is re-evaluated by subgroup before release.","answer":"Reduce","why":"This lowers the probability of disparate performance without eliminating it. Measurable improvement with residual exposure is reduction, not avoidance."},{"id":"rt-07","label":"Rate limits, output filters and a kill switch are added to a customer-facing assistant.","answer":"Reduce","why":"Each measure attacks likelihood or impact while the service keeps running. Note that the kill switch reduces impact rather than likelihood — both count."},{"id":"rt-08","label":"Model cards, evaluation results and known limitations are published so deployers can use the system within its tested envelope.","answer":"Reduce","why":"Reducing misuse by informing the deployer is a genuine, if weak, reduction. Its weakness is a control-strength question, not a treatment classification one."},{"id":"rt-09","label":"The firm buys specific AI liability insurance covering claims arising from automated decisions.","answer":"Transfer","why":"The financial consequence moves to the insurer while the model behaves exactly as before. Insurance never reduces the probability of harm and is not a control."},{"id":"rt-10","label":"A contract makes the model vendor liable for damages caused by defects in the supplied system.","answer":"Transfer","why":"Contractual indemnity reallocates cost between parties. The affected individual is no better protected, which is why regulators do not treat it as mitigation."},{"id":"rt-11","label":"A high-risk processing activity is outsourced to a specialist provider under a contract making them responsible for compliance failures.","answer":"Transfer","why":"Outsourcing shifts operational and financial consequence, though rarely regulatory accountability — a distinction that catches people out."},{"id":"rt-12","label":"The deployer negotiates a warranty and a capped indemnity for third-party IP claims arising from generated output.","answer":"Transfer","why":"The exposure is priced and shifted rather than diminished. A cap means the transfer is partial, which is worth recording in the risk register."},{"id":"rt-13","label":"A small residual risk of a low-severity formatting error is documented, signed off by the product owner, and reviewed annually.","answer":"Accept","why":"Informed, authorised and recorded retention is acceptance. Acceptance is a decision with an owner and a review date, not silence."},{"id":"rt-14","label":"The risk committee records that the residual risk of the deployment is within stated appetite and no further action is required this cycle.","answer":"Accept","why":"Explicit retention at the authority entitled to retain it. If nobody at the right level said yes, the risk is not accepted — it is merely unmanaged."},{"id":"rt-15","label":"A known limitation with a documented workaround is scheduled for review at the next model refresh rather than being fixed now.","answer":"Accept","why":"Time-boxed retention with a review point is acceptance. The workaround does not make it reduction, because the risk itself is unchanged in the meantime."},{"id":"rt-16","label":"The board notes that the cost of further mitigation exceeds the expected loss and directs that the residual risk be retained and monitored.","answer":"Accept","why":"A cost-justified retention decision at board level, with monitoring attached. Monitoring is not a control here — it detects, it does not prevent."}]},"decks/shared/risk-controls.json":{"id":"risk-controls","runner":"board","title":"Hierarchy of Controls","blurb":"Five tiers, strongest first. Sort each mitigation into the tier that determines how much it is worth.","source":"Hierarchy of controls (NIOSH), applied to AI systems · NIST AI RMF 1.0 MANAGE 2 · ISO/IEC 42001:2023 Annex A controls","asOf":"2026-07","area":"risk","hint":"Drag each mitigation onto its tier. The question is how much the measure depends on a human doing the right thing — the more it does, the weaker the tier.","note":"The order matters more than the labels. A measure that depends on a person reading, remembering and complying is structurally weaker than one that makes the failure impossible, however diligently the first is written.","zones":[{"key":"Eliminate","name":"Eliminate","def":"Remove the hazard. The failure mode cannot occur because the capability that produced it is gone."},{"key":"Substitute","name":"Substitute / redesign","def":"Replace the hazardous element with a safer one that achieves the same purpose."},{"key":"Engineering","name":"Engineering / technical","def":"Build the constraint into the system so that it holds without anyone choosing to comply."},{"key":"Administrative","name":"Administrative","def":"Policies, training, review steps and procedures. Effective only to the extent people follow them."},{"key":"Transparency","name":"Transparency & warnings","def":"Tell the user. The weakest tier: it moves responsibility to the person least able to change the outcome."}],"items":[{"id":"rc-01","label":"The free-text field that allowed users to submit arbitrary prompts to the underlying model is removed; only a fixed set of actions remains.","answer":"Eliminate","why":"The injection surface is gone, not guarded. Elimination is recognisable because the mitigation removes a capability rather than constraining its use."},{"id":"rc-02","label":"The feature that inferred demographic attributes from user photos is deleted from the product.","answer":"Eliminate","why":"No inference means no inference error, no disparate accuracy and no lawful-basis question. The hazard is not managed; it no longer exists."},{"id":"rc-03","label":"A chatbot's ability to execute account changes is withdrawn entirely; it can now only read and explain.","answer":"Eliminate","why":"Removing the write capability eliminates the entire class of unauthorised-action harms. Everything downstream of it becomes unnecessary."},{"id":"rc-04","label":"Direct identifiers are dropped from the training corpus altogether rather than being protected within it.","answer":"Eliminate","why":"Data that was never collected cannot leak, be re-identified, or be subject to an access request. This is why minimisation outranks encryption."},{"id":"rc-05","label":"A generative model used for summarising medical notes is replaced with an extractive summariser that can only quote the source.","answer":"Substitute","why":"The purpose is preserved while the hazardous mechanism — free generation, and therefore fabrication — is swapped out for one that cannot fabricate."},{"id":"rc-06","label":"A black-box gradient-boosted model in a lending decision is replaced by a monotonic scorecard with comparable accuracy.","answer":"Substitute","why":"Redesigning for an inherently explainable model removes the explanation problem rather than bolting a post-hoc explainer onto it."},{"id":"rc-07","label":"Real customer records used in a test environment are replaced with synthetic data of the same statistical shape.","answer":"Substitute","why":"The activity continues with a materially safer input. Substitution sits below elimination because the replacement carries its own, smaller risks."},{"id":"rc-08","label":"A facial recognition step in an identity check is replaced with a document-plus-liveness check that does not build a face template.","answer":"Substitute","why":"Same assurance objective, different mechanism, far lower biometric exposure. The tell is that the function survives and the hazard is exchanged."},{"id":"rc-09","label":"Output filters block responses containing personal data patterns before they ever reach the user.","answer":"Engineering","why":"The constraint is enforced by the system on every request. Nobody has to remember it, which is what makes technical controls outrank procedural ones."},{"id":"rc-10","label":"Role-based access control prevents the retrieval layer from returning documents the requesting user is not entitled to see.","answer":"Engineering","why":"Authorisation is enforced at the point of retrieval rather than trusted to the prompt. A rule the system applies cannot be forgotten under pressure."},{"id":"rc-11","label":"A hard cap limits the number of tool calls an agent may make before it must stop and escalate.","answer":"Engineering","why":"A runtime bound holds regardless of what the model decides to do. Improving the tool description would be an administrative measure by comparison."},{"id":"rc-12","label":"Deployment is gated by an automated evaluation suite that fails the build if subgroup performance regresses beyond a threshold.","answer":"Engineering","why":"The gate is mechanical and cannot be skipped by a busy release manager, which is precisely why it beats a review checklist covering the same ground."},{"id":"rc-13","label":"An acceptable-use policy is published and all staff complete annual training on it.","answer":"Administrative","why":"Effectiveness depends entirely on people reading, remembering and applying it. Training is worth having and is routinely over-credited in risk assessments."},{"id":"rc-14","label":"A procedure requires a second reviewer to sign off on every high-impact model change.","answer":"Administrative","why":"A procedural gate can be bypassed under deadline pressure. Making the same check a required status in the pipeline would move it up a tier."},{"id":"rc-15","label":"Quarterly manual audits sample model decisions and check them against policy.","answer":"Administrative","why":"Detective, periodic and human. It finds problems after they occur, which is useful and is not prevention."},{"id":"rc-16","label":"An incident response runbook sets out who is called and in what order when a model misbehaves.","answer":"Administrative","why":"Procedural preparation reduces impact through faster response, but only if the procedure is followed and current."},{"id":"rc-17","label":"A banner tells users that responses are AI-generated and may be inaccurate.","answer":"Transparency","why":"A disclosure obligation may well be mandatory, but as mitigation it is the weakest tier: it transfers vigilance to the user, who cannot inspect the model."},{"id":"rc-18","label":"The interface warns users not to enter confidential information into the assistant.","answer":"Transparency","why":"The warning depends on the person least equipped to enforce it. Blocking sensitive patterns at input would be an engineering control for the same risk."},{"id":"rc-19","label":"Documentation states that the model was not validated for use on paediatric cases.","answer":"Transparency","why":"Stating a limitation informs the deployer without preventing the misuse. Refusing out-of-scope inputs at runtime would be materially stronger."},{"id":"rc-20","label":"Generated images carry a visible label and embedded provenance metadata identifying them as synthetic.","answer":"Transparency","why":"Provenance marking supports downstream judgement and is often legally required. It changes nothing about what the system will produce."}]},"decks/shared/risk-frameworks.json":{"id":"risk-frameworks","runner":"board","title":"Which Framework Is This?","blurb":"Four documents people cite interchangeably and shouldn't. Sort each statement onto the one it comes from.","source":"ISO 31000:2018 · ISO/IEC 23894:2023 · ISO/IEC 42001:2023 · NIST AI RMF 1.0 (AI 100-1)","asOf":"2026-07","area":"risk","hint":"Drag each description onto the framework it belongs to. Ask what kind of document it is: generic risk, AI-specific risk guidance, a certifiable management system, or a voluntary framework.","note":"Only one of these four is certifiable. Only one is US federal and voluntary. Confusing 'we follow the NIST AI RMF' with 'we are certified' is the mistake this board exists to prevent.","zones":[{"key":"ISO 31000","name":"ISO 31000:2018","def":"Generic risk management principles, framework and process. Not AI-specific and not certifiable."},{"key":"ISO/IEC 23894","name":"ISO/IEC 23894:2023","def":"Guidance applying ISO 31000 to AI. Advisory: it tells you how AI risk differs, not what to certify."},{"key":"ISO/IEC 42001","name":"ISO/IEC 42001:2023","def":"AI management system standard. Requirements plus Annex A controls, and the one an organisation can be certified against."},{"key":"NIST AI RMF","name":"NIST AI RMF 1.0","def":"Voluntary US framework: four functions, seven trustworthiness characteristics, no certification."}],"items":[{"id":"rf-01","label":"Sets out the risk process as: establish scope and context, identify, analyse, evaluate, treat, with monitoring and communication throughout.","answer":"ISO 31000","why":"This is the generic risk process every other risk document builds on. Its vocabulary — likelihood, consequence, treatment, residual risk — is what the AI-specific documents inherit."},{"id":"rf-02","label":"Defines risk as the effect of uncertainty on objectives, which may be positive as well as negative.","answer":"ISO 31000","why":"The upside-inclusive definition of risk is ISO 31000's, and it is why the standard talks about objectives rather than harms."},{"id":"rf-03","label":"Is deliberately sector-agnostic and technology-agnostic; it says nothing about models, data or training.","answer":"ISO 31000","why":"Its generality is the point and also its limit — it is why 23894 exists to say what AI changes."},{"id":"rf-04","label":"Frames risk management as principles, a framework, and a process, with leadership commitment as the first requirement of the framework.","answer":"ISO 31000","why":"The three-part structure is ISO 31000's organising idea. AI-specific documents adopt it rather than replacing it."},{"id":"rf-05","label":"Provides guidance on applying a generic risk process specifically to artificial intelligence, including AI-specific risk sources.","answer":"ISO/IEC 23894","why":"23894 is the bridge document: ISO 31000's process, with AI's particular risk sources and lifecycle attached. It is guidance, not requirements."},{"id":"rf-06","label":"Describes how risk management activities map onto the AI system lifecycle, from inception through retirement.","answer":"ISO/IEC 23894","why":"Lifecycle-mapped AI risk guidance is 23894's contribution. Being guidance, it cannot be audited against, which is where 42001 comes in."},{"id":"rf-07","label":"Offers illustrative AI risk sources — data quality, opacity, automation bias, unintended use — as an aid rather than a mandatory list.","answer":"ISO/IEC 23894","why":"The catalogue of AI risk sources is advisory. Treating it as a compliance checklist misreads the document's status."},{"id":"rf-08","label":"Is the AI-specific companion that explains what changes when the thing you are managing risk about learns from data.","answer":"ISO/IEC 23894","why":"This is the document's whole purpose: 31000 for AI. If a statement is about applying risk method to AI without imposing requirements, it is 23894."},{"id":"rf-09","label":"Specifies requirements for establishing, implementing, maintaining and continually improving a management system for AI.","answer":"ISO/IEC 42001","why":"'Requirements for a management system' is management-system-standard language: this is the certifiable one, structured like ISO 27001."},{"id":"rf-10","label":"An organisation can be audited by a certification body and issued a certificate against it.","answer":"ISO/IEC 42001","why":"Certifiability is the single cleanest discriminator among these four. Neither NIST's framework nor ISO's guidance documents can be certified against."},{"id":"rf-11","label":"Carries an Annex A of controls and requires a statement of applicability explaining which are implemented.","answer":"ISO/IEC 42001","why":"Annex A plus a statement of applicability is the management-system pattern. It is what an auditor actually walks through."},{"id":"rf-12","label":"Requires an AI policy, defined roles, objectives, internal audit and management review on a continual improvement cycle.","answer":"ISO/IEC 42001","why":"Internal audit and management review are management-system obligations. Guidance documents recommend; only the management system standard requires."},{"id":"rf-13","label":"Organises risk work into four functions: Govern, Map, Measure and Manage.","answer":"NIST AI RMF","why":"The four functions are the RMF's signature structure, with Govern cutting across the other three rather than preceding them."},{"id":"rf-14","label":"Names seven characteristics of trustworthy AI, including valid and reliable, safe, secure and resilient, and accountable and transparent.","answer":"NIST AI RMF","why":"The seven trustworthiness characteristics are NIST's framing. ISO documents speak of objectives and controls instead."},{"id":"rf-15","label":"Is explicitly voluntary, developed by a US federal agency under a statutory direction, and is accompanied by a companion playbook.","answer":"NIST AI RMF","why":"Voluntary, US federal, with a playbook and profiles — none of which describes an ISO standard."},{"id":"rf-16","label":"Supports use profiles that tailor the framework to a particular sector or use case.","answer":"NIST AI RMF","why":"Profiles are how the RMF is adapted without being certified. They are the answer to 'how do we apply this to us' in a voluntary framework."}]},"decks/shared/risk-rmf-functions.json":{"id":"risk-rmf-functions","runner":"board","title":"NIST AI RMF — Four Functions","blurb":"Govern, Map, Measure, Manage. Sort each activity into the function it belongs to.","source":"NIST AI Risk Management Framework 1.0 (AI 100-1), January 2023","asOf":"2026-07","area":"risk","hint":"Drag each activity onto its function. Govern runs across all of them; Map establishes context, Measure quantifies, Manage acts.","note":"Govern is not a phase that finishes. If an activity sets the conditions under which the other three happen — culture, accountability, policy — it is Govern, whenever it occurs.","zones":[{"key":"Govern","name":"Govern","def":"Cultivate a culture of risk management: policies, accountability structures, roles, workforce capability, third-party oversight. Cuts across the other three."},{"key":"Map","name":"Map","def":"Establish context and frame risks: purpose, setting, actors, impacted people, capabilities and limitations, interdependencies."},{"key":"Measure","name":"Measure","def":"Analyse, assess, benchmark and monitor using quantitative and qualitative methods, including the trustworthiness characteristics."},{"key":"Manage","name":"Manage","def":"Allocate resources to mapped and measured risks: prioritise, respond, recover, communicate, and act on third-party and residual risk."}],"items":[{"id":"rmf-01","label":"The organisation documents who is accountable for AI risk decisions and at what level each class of decision may be taken.","answer":"Govern","why":"Accountability structures are the archetypal GOVERN activity. Without them the other three functions have no one to report to and no one to escalate to."},{"id":"rmf-02","label":"An AI policy is approved, aligned to legal requirements, and its exceptions process is defined.","answer":"Govern","why":"Policy and its exception route set the conditions under which every other activity happens. GOVERN is cross-cutting, not sequential."},{"id":"rmf-03","label":"Staff working on AI systems are given role-specific training and their competence is tracked.","answer":"Govern","why":"Workforce capability sits squarely in GOVERN. A measurement regime nobody is competent to run produces numbers without assurance."},{"id":"rmf-04","label":"Processes are established for overseeing third-party models and data, including what must be obtained from suppliers.","answer":"Govern","why":"GOVERN explicitly covers third-party oversight policy. Applying it to a specific vendor's risk on a specific system is MANAGE."},{"id":"rmf-05","label":"The team documents the system's intended purpose, deployment setting, and the categories of people it will affect.","answer":"Map","why":"Framing context is the whole point of MAP. Skipping it is how a system is later measured accurately against the wrong objective."},{"id":"rmf-06","label":"Known capabilities, limitations and assumptions of the system are catalogued, including where it should not be used.","answer":"Map","why":"MAP establishes what the system is and is not for. The out-of-scope statement authored here is what later evaluation and monitoring are judged against."},{"id":"rmf-07","label":"Internal and external stakeholders, including affected communities, are identified along with the benefits and potential harms to each.","answer":"Map","why":"Identifying impacted parties and framing potential impacts is MAP. Quantifying those impacts is MEASURE."},{"id":"rmf-08","label":"Interdependencies with other systems and the consequences of the AI component failing are traced.","answer":"Map","why":"MAP covers the system in its wider context, including what else breaks when it does. A component viewed in isolation is a mapped risk missed."},{"id":"rmf-09","label":"The system is benchmarked against defined metrics for validity, reliability and robustness before release.","answer":"Measure","why":"MEASURE covers assessment against the trustworthiness characteristics using repeatable methods."},{"id":"rmf-10","label":"Performance is evaluated separately for each demographic subgroup and the disparity is quantified.","answer":"Measure","why":"Analysing harmful bias with quantitative methods is MEASURE. Deciding what to do about the disparity is MANAGE."},{"id":"rmf-11","label":"Ongoing monitoring instruments the deployed system for input drift and quality degradation.","answer":"Measure","why":"MEASURE includes continuous monitoring after deployment, not only pre-release testing. Drift detection lives here."},{"id":"rmf-12","label":"Test, evaluation, verification and validation methods are chosen, documented, and their own limitations recorded.","answer":"Measure","why":"MEASURE requires that the measurement approach itself be assessed. A metric with unexamined blind spots is a false assurance."},{"id":"rmf-13","label":"Risks are prioritised against impact and resources are allocated to the highest first.","answer":"Manage","why":"Prioritisation and resource allocation across mapped and measured risks is the definition of MANAGE."},{"id":"rmf-14","label":"A response plan is put in place covering incident containment, recovery and communication for a model failure.","answer":"Manage","why":"MANAGE covers responding to, recovering from and communicating about incidents. Writing the plan is MANAGE; rehearsing capability is GOVERN."},{"id":"rmf-15","label":"Residual risk after mitigation is documented and communicated to the deployer of the system.","answer":"Manage","why":"MANAGE explicitly addresses residual risk, including telling downstream users what remains. Undocumented residual risk is transferred by accident."},{"id":"rmf-16","label":"A decision is taken to decommission a deployed model whose risk can no longer be brought within tolerance.","answer":"Manage","why":"Superseding or decommissioning a system is a MANAGE response. Having a defined route to retirement is what makes it possible."}]},"decks/shared/risk-org.json":{"id":"risk-org","runner":"board","title":"Who Owns This Risk?","blurb":"Three lines of defence, plus the body that carries ultimate accountability. Sort each activity onto its owner.","source":"IIA Three Lines Model (2020) · ISO/IEC 42001:2023 §5 (leadership) · NIST AI RMF 1.0 GOVERN 2","asOf":"2026-07","area":"risk","hint":"Drag each activity onto the line that should perform it. The test is independence: who can mark their own homework, and who cannot.","note":"The lines are about independence, not seniority or headcount. A second-line function that reports to the team it oversees is a first-line function wearing a different badge.","zones":[{"key":"First line","name":"First line","def":"Owns and manages the risk day to day: the teams that build, deploy and operate the system."},{"key":"Second line","name":"Second line","def":"Sets policy, advises, challenges and monitors — risk, compliance, legal, an AI governance function. Independent of delivery, not of management."},{"key":"Third line","name":"Third line","def":"Internal audit. Independent assurance to the board on whether the first two lines actually work."},{"key":"Board","name":"Board / accountable executive","def":"Sets appetite, holds ultimate accountability, and is the only body that can accept risk beyond delegated limits."}],"items":[{"id":"ro-01","label":"The engineering team runs the fairness evaluation suite before promoting a model to production.","answer":"First line","why":"Executing controls inside the delivery process is first-line work. Doing it well does not make it assurance, because the team is assessing its own output."},{"id":"ro-02","label":"The product owner records a new risk in the register and proposes a treatment.","answer":"First line","why":"Risk identification and day-to-day management sit with the people closest to the activity. The register is theirs to populate, not the risk function's."},{"id":"ro-03","label":"The operations team monitors production drift dashboards and raises an incident when thresholds are breached.","answer":"First line","why":"Operating a control, including a detective one, is first-line. Second line asks whether the threshold is right; first line acts when it trips."},{"id":"ro-04","label":"The data science team documents model limitations and intended use in the model card.","answer":"First line","why":"Producing the documentation is a build activity. Reviewing whether it meets policy is a different line's job."},{"id":"ro-05","label":"The AI governance function writes the policy defining which use cases require an impact assessment.","answer":"Second line","why":"Setting the framework and standards the first line must work within is the defining second-line activity."},{"id":"ro-06","label":"Compliance reviews a completed impact assessment and challenges the team's residual risk rating.","answer":"Second line","why":"Independent challenge of first-line judgement is second line. It is advisory and monitoring, and it is not assurance to the board."},{"id":"ro-07","label":"Legal advises that a proposed deployment falls within an Annex III area and therefore attracts high-risk obligations.","answer":"Second line","why":"Specialist advice that constrains what the first line may do is second-line. The decision to proceed remains the first line's, within policy."},{"id":"ro-08","label":"The risk function maintains the enterprise register and reports aggregate AI risk exposure to the executive.","answer":"Second line","why":"Aggregation, oversight and reporting across the first line is second-line monitoring. It relies on first-line data, which is precisely why third line exists."},{"id":"ro-09","label":"Internal audit examines whether the model approval process was followed for every release in the last year.","answer":"Third line","why":"Testing whether the controls operated as designed, after the fact and independently, is internal audit's remit."},{"id":"ro-10","label":"An independent review reports to the audit committee that the second line's challenge process is not evidenced.","answer":"Third line","why":"Third line audits the second line as well as the first, and reports to the board rather than to management — that reporting line is what makes it independent."},{"id":"ro-11","label":"Assurance work is planned on a risk-based cycle and its scope is agreed with the audit committee, not with the teams being audited.","answer":"Third line","why":"Scope set outside management is the structural feature that separates audit from a second-line review."},{"id":"ro-12","label":"A review concludes that a control is documented but has never actually been performed, and reports it upward.","answer":"Third line","why":"Finding the gap between documented and operating effectiveness is the value audit adds. Neither of the first two lines is positioned to report it against itself."},{"id":"ro-13","label":"Risk appetite for automated decision-making is set and published.","answer":"Board","why":"Appetite is a board-level statement of how much risk the organisation will take. Everything below is calibration against it."},{"id":"ro-14","label":"A residual risk exceeding the delegated limit is escalated and formally accepted at the top of the organisation.","answer":"Board","why":"Only the body holding the authority may accept beyond delegated limits. Acceptance elsewhere is not acceptance; it is an unrecorded exposure."},{"id":"ro-15","label":"An accountable executive is named for the AI management system, with the authority and resources to make it work.","answer":"Board","why":"Management-system standards require named leadership accountability. A governance function with no executive owner has responsibility without authority."},{"id":"ro-16","label":"The decision is taken to withdraw a deployed system after assurance reports that its risk cannot be brought within appetite.","answer":"Board","why":"Withdrawal against commercial interest is a decision only the accountable level can take, which is why the escalation route has to exist before it is needed."}]},"decks/shared/ml-lifecycle.json":{"id":"ml-lifecycle","runner":"ladders","title":"ML Lifecycle","blurb":"Put the machine-learning lifecycle in order.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 1","asOf":"2026-07","area":"foundations","ladders":[{"id":"ml-lifecycle","title":"ML Lifecycle","prompt":"Order the lifecycle from business goal to production monitoring.","steps":[{"label":"Business Goal Identification","detail":"Everything downstream inherits this. Without a business goal there is no way to say whether the model is any good."},{"label":"ML Problem Framing","detail":"Translate the goal into a learnable task: what is predicted, from what, and what counts as success."},{"label":"Data Collection","detail":"Assemble the raw material, and establish its provenance and permitted use before it is relied on."},{"label":"Data Preprocessing","detail":"Clean, join, de-duplicate and handle missing values, so the model learns signal rather than artefacts."},{"label":"Feature Engineering","detail":"Shape inputs into representations the algorithm can use. Often the largest single lever on accuracy."},{"label":"Model Training","detail":"Fit parameters on the training split. Cheap to repeat, so it comes after the expensive data work, not before."},{"label":"Hyperparameter Tuning","detail":"Search the settings the model cannot learn for itself, evaluated on validation data rather than test."},{"label":"Model Evaluation","detail":"Measure against held-out data and the business metric. This is the gate, not a formality."},{"label":"Model Deployment (Inference and Prediction)","detail":"Serve predictions for real requests, with the same preprocessing as training or the results will not match."},{"label":"Model Monitoring","detail":"Watch inputs, outputs and quality in production. This is where drift surfaces, and it never ends."}]}]},"decks/shared/rag-pipeline.json":{"id":"rag-pipeline","runner":"ladders","title":"RAG Builder","blurb":"Assemble a retrieval-augmented generation pipeline.","source":"AWS Certified AI Practitioner (AIF-C01) exam guide · Domain 3","asOf":"2026-07","area":"genai","ladders":[{"id":"rag-pipeline","title":"RAG Builder","prompt":"Order the stages from ingestion to a grounded, cited answer.","steps":[{"label":"Ingest Trusted Source Documents","detail":"Retrieval can only ever surface what was ingested. Source selection is a governance decision, not a plumbing one."},{"label":"Clean, Split, and Attach Metadata","detail":"Chunking decides what a retrievable unit is; metadata is what later makes filtering and attribution possible."},{"label":"Create Embeddings for Each Chunk","detail":"Text becomes vectors. The embedding model chosen here constrains everything the retriever can distinguish."},{"label":"Store Chunks and Vectors in an Index","detail":"The index makes similarity search tractable. Access controls belong here, not only at the answer."},{"label":"Embed and Interpret the User Query","detail":"The query is embedded by the same model as the chunks, or the two live in incomparable spaces."},{"label":"Retrieve, Filter, and Rerank Evidence","detail":"Recall decides whether the right passage is available at all; ranking decides whether it survives the context budget."},{"label":"Build a Prompt with Evidence and Instructions","detail":"The retrieved evidence is placed in the prompt with instructions on how to use it and when to refuse."},{"label":"Generate, Validate, and Cite the Grounded Answer","detail":"The model answers from the supplied evidence and cites it, so a reader can check rather than trust."}]}]}}</script>
