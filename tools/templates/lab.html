<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Anonymous by design (ADR 0004): this policy blocks every request to another site. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self' data: file:; connect-src 'self' file:; media-src 'self' file:; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<title>__LAB_TITLE__</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="icon" type="image/svg+xml" href="assets/misc/favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#15161a; --panel:#1c1e24; --panel2:#24262e; --line:#f0f0f0; --edge:#f0f0f0;
  --ink:#f0f0f0; --dim:#a9a9b2; --primary:#facc15; --secondary:#fd933d;
  --ok:#3ecf7a; --bad:#ff5d5d; --warn:#fd933d; --radius:0px; --shadow:4px; --shadow-lg:8px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f9f9f9; --panel:#ffffff; --panel2:#eeeeee; --line:#111111; --edge:#111111;
         --ink:#111111; --dim:#4d4632; }
}
:root[data-theme=light]{ --bg:#f9f9f9; --panel:#ffffff; --panel2:#eeeeee; --line:#111111;
  --edge:#111111; --ink:#111111; --dim:#4d4632; }
:root[data-theme=dark]{ --bg:#15161a; --panel:#1c1e24; --panel2:#24262e; --line:#f0f0f0;
  --edge:#f0f0f0; --ink:#f0f0f0; --dim:#a9a9b2; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 "Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
header{position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:4px solid var(--edge);padding:12px 16px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font-size:17px;margin:0;letter-spacing:-.3px;text-transform:uppercase;font-weight:700}
.brand .sub{color:var(--dim);font-size:12px}
.home-link{color:var(--ink);font-size:13px;font-weight:700;text-transform:uppercase;
  text-decoration:none;border:2px solid var(--edge);background:var(--panel);
  padding:5px 12px;white-space:nowrap}
.home-link:hover{background:var(--primary);color:#1a1c1c}
.lang-select{background:var(--panel);border:2px solid var(--edge);color:var(--ink);
  font:inherit;font-size:12px;font-weight:700;padding:5px 8px;cursor:pointer;
  text-transform:none;max-width:130px}
/* Arabic: letter-spacing breaks cursive joining; kill it wholesale under RTL.
   The world map stays LTR — geography does not mirror. */
:root[dir=rtl] body *{letter-spacing:normal !important}
.map-wrap,.rr-map{direction:ltr}
.brand-social{display:flex;align-items:center;gap:10px;margin-left:auto}
.brand-social a{display:inline-flex;align-items:center;color:var(--dim)}
.brand-social a:hover{color:var(--ink)}
@media print{.brand-social{display:none}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tab{background:var(--panel);border:2px solid var(--edge);color:var(--ink);font-weight:700;
  text-transform:uppercase;font-family:inherit;padding:6px 12px;cursor:pointer;font-size:12px}
.tab[aria-selected=true]{background:var(--primary);color:#1a1c1c}
.tab:disabled{opacity:.4;cursor:not-allowed}
main{max-width:1120px;margin:0 auto;padding:18px 16px 90px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--panel);border:2px solid var(--edge);color:var(--ink);font-weight:700;
  text-transform:uppercase;font-family:inherit;padding:7px 13px;cursor:pointer;font-size:12px}
.chip[aria-selected=true]{background:var(--primary);color:#1a1c1c}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--panel);border:3px solid var(--edge);box-shadow:var(--shadow) var(--shadow) 0 0 var(--edge);
  padding:14px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;
  transition:transform .1s,box-shadow .1s}
.card:hover{transform:translate(var(--shadow),var(--shadow));box-shadow:0 0 0 0 var(--edge)}
.card h3{margin:0 0 4px;font-size:15px;font-weight:700;text-transform:uppercase}
.card p{margin:0;color:var(--dim);font-size:13px}
.rung{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;
  font-weight:700;color:var(--secondary);margin-bottom:6px}
.meter{height:6px;background:var(--panel2);border:1px solid var(--edge);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary)}
.panel{background:var(--panel);border:4px solid var(--edge);
  box-shadow:var(--shadow-lg) var(--shadow-lg) 0 0 var(--edge);padding:18px}
.hint{color:var(--dim);font-size:13px;margin:0 0 14px}
.service-identity{display:flex;align-items:center;gap:14px;background:var(--panel2);
  border:2px solid var(--edge);padding:12px 14px;margin-bottom:14px}
.service-identity img{width:44px;height:44px;flex-shrink:0;border:1px solid var(--edge);
  background:#fff;padding:3px;object-fit:contain}
.service-identity label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  font-weight:700;color:var(--dim)}
.service-identity select{margin-top:4px;background:var(--panel);border:2px solid var(--edge);
  color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;padding:6px 8px;max-width:100%}

/* ---- board ---- */
.bank{background:var(--panel2);border:2px dashed var(--edge);
  padding:12px;min-height:64px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.bank-note{color:var(--dim);font-size:13px}
.tok{background:var(--panel);border:2px solid var(--edge);color:var(--ink);
  padding:9px 12px;cursor:grab;font:inherit;font-size:13.5px;
  text-align:left;max-width:100%;line-height:1.4;display:flex;align-items:center;gap:8px}
.tok:hover{border-color:var(--secondary)}
.tok.sel{background:var(--primary);color:#1a1c1c;border-color:var(--edge);box-shadow:2px 2px 0 0 var(--edge)}
.tok.correct{border-color:var(--edge);background:var(--ok);color:#0c1a12}
.tok.wrong{border-color:var(--edge);background:var(--bad);color:#2a0505}
.tok em{color:var(--dim);font-style:normal;font-size:12px;display:block;margin-top:3px}
.tok.correct em,.tok.wrong em{color:inherit;opacity:.75}
.zones{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.zone{background:var(--panel2);border:2px solid var(--edge);padding:11px;
  min-height:110px;display:flex;flex-direction:column;gap:8px}
.zone.over{border-color:var(--secondary);box-shadow:2px 2px 0 0 var(--secondary)}
.zone h4{margin:0;font-size:13px;letter-spacing:.3px;font-weight:700;text-transform:uppercase;
  display:flex;align-items:center;gap:7px}
.zone-icon{width:18px;height:18px;flex-shrink:0;border:1px solid var(--edge);background:#fff;
  padding:2px;object-fit:contain}
.zone .zdef{color:var(--dim);font-size:11.5px;margin:0}
.zone .drop{flex:1;display:flex;flex-direction:column;gap:7px;min-height:34px}
/* Mobile placement sheet — only ever mounted on coarse-pointer devices. */
.sheet-root{position:fixed;inset:0;z-index:50}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);touch-action:none}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);
  border-top:2px solid var(--edge);max-height:70vh;display:flex;flex-direction:column;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .18s ease-out}
.sheet-root.open .sheet{transform:translateY(0)}
.sheet-title{margin:0 0 10px;font-weight:700;font-size:14px}
.sheet-rows{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:6px}
.sheet-row{display:flex;align-items:center;gap:10px;min-height:44px;text-align:left;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  font:inherit;font-size:13.5px;padding:9px 11px;cursor:pointer}
.sheet-row img{width:24px;height:24px;flex:none}
.sheet-row b{font-weight:700;display:block}
.sheet-row em{display:block;font-style:normal;color:var(--dim);font-size:12px}
.sheet-close{margin-top:10px;min-height:44px;background:none;border:1px solid var(--line);
  color:var(--dim);font:inherit;text-transform:uppercase;font-size:12px;cursor:pointer}
.snip{background:var(--panel2);border-left:4px solid var(--secondary);padding:11px 13px;
  font-style:italic;margin:0 0 10px;font-size:14px}
.flip{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:640px){ .flip{grid-template-columns:1fr} }
.variant{background:var(--panel2);border:2px solid var(--edge);padding:13px}
.variant p{margin:0 0 10px;font-size:14.5px;line-height:1.5}
.pick{display:grid;gap:7px}
.pick button{background:var(--panel);border:2px solid var(--edge);color:var(--ink);
  padding:9px 11px;cursor:pointer;font:inherit;font-size:13.5px;text-align:left}
.pick button:hover:not(:disabled){border-color:var(--secondary)}
.pick button[aria-pressed=true]{background:var(--primary);color:#1a1c1c;border-color:var(--edge);box-shadow:2px 2px 0 0 var(--edge)}
.pick button.correct{border-color:var(--edge);background:var(--ok);color:#0c1a12}
.pick button.wrong{border-color:var(--edge);background:var(--bad);color:#2a0505}
.score{font-size:24px;font-weight:700;margin:0 0 6px;text-transform:uppercase}
.score.ok{color:var(--ok)} .score.mid{color:var(--warn)} .score.no{color:var(--bad)}
.reveal{margin-top:16px;border-top:3px solid var(--edge);padding-top:14px}
.reveal li{margin-bottom:11px;font-size:14px}
.reveal li b{display:block}
.reveal li .miss{color:var(--bad)} .reveal li .hit{color:var(--ok)}
.grid3x3{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.grid-head{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;font-size:11px;
  text-transform:uppercase;letter-spacing:.3px;color:var(--dim);padding:0 2px}
.grid-row{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;align-items:stretch}
.grid-domain{background:var(--panel2);border:2px solid var(--edge);padding:11px;
  font-size:12.5px;font-weight:700;display:flex;align-items:center}
.grid-cell{padding:8px;min-height:52px}
.grid-cell .cell-empty{color:var(--dim);font-size:12px}
@media (max-width:640px){ .grid-head{display:none} .grid-row{grid-template-columns:1fr} }
.why{color:var(--dim);margin:0 0 10px}
.dim-note{background:var(--panel2);border:2px dashed var(--edge);padding:10px 12px;margin:10px 0;font-size:14px}
.dim-note b{color:var(--secondary)}
.currency{background:var(--panel2);border:2px solid var(--edge);
  padding:12px;margin:12px 0;font-size:14px}
.currency div{margin:3px 0}
.cite{font-size:12px;color:var(--dim);margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{background:var(--primary);border:2px solid var(--edge);color:#1a1c1c;padding:9px 16px;
  cursor:pointer;font:inherit;font-weight:700;text-transform:uppercase;font-size:13px;
  box-shadow:3px 3px 0 0 var(--edge);transition:transform .1s,box-shadow .1s}
.btn:hover:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 0 var(--edge)}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 0 var(--edge)}
.badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;
  padding:3px 9px;background:var(--panel2);color:var(--ink);border:2px solid var(--edge)}
.badge.horizon{color:#1a1c1c;background:var(--warn);border-color:var(--edge)}
/* Release marking + home ladder (beta.1): the masthead/hub badge renders only
   when the manifest carries "release"; the rung-ladder strip and group blurb
   only when it declares "groups". Labs without either pay nothing. */
.release-badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;padding:1px 7px;border:2px solid var(--edge);background:var(--warn);
  color:#1a1c1c;vertical-align:middle}
.release-badge:empty{display:none}
.release-note{margin:0 0 12px;font-size:13px;color:var(--dim)}
.rung-ladder{font-weight:400;margin-left:10px;opacity:.75;letter-spacing:.5px}
.group-blurb{margin:-6px 0 12px;font-size:13px;color:var(--dim)}
.sweep{background:var(--panel2);border:2px solid var(--edge);
  padding:13px;margin-top:14px}
.sweep p{margin:0 0 9px;font-size:14px}
/* ---- gauntlet ---- */
.g-hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:2px solid var(--edge);padding:8px 12px;margin:0 0 12px;font-weight:700;font-size:13px}
.g-lives{color:var(--bad);letter-spacing:2px}
.g-lives i{font-style:normal}
.g-lives i.spent{color:var(--dim)}
.g-clock{flex:1;min-width:90px;height:10px;background:var(--panel);
  border:2px solid var(--edge);overflow:hidden}
.g-clock i{display:block;height:100%;background:var(--ok);transition:width .1s linear}
.g-clock.low i{background:var(--bad)}
.g-secs{min-width:36px;text-align:right}
.g-stem{font-size:16px;line-height:1.5;font-weight:600;margin:0 0 12px}
/* Out of time is not the same failure as a wrong pick: the answer you never
   gave is marked in the warning colour, not the correct-answer green. */
.pick button.correct.lapsed{background:var(--warn);color:#2a1a05}
.g-grade{display:flex;align-items:center;gap:10px;background:var(--panel2);
  border:3px solid var(--edge);padding:11px 13px;margin:0 0 12px;
  font-weight:700;text-transform:uppercase;font-size:14px}
.g-grade .medal{font-size:24px;line-height:1}
.g-grade.gold{background:var(--primary);color:#1a1c1c}
.g-grade.bronze{background:var(--secondary);color:#1a1c1c}
.g-grade.none{color:var(--dim)}
.g-doms{display:flex;flex-direction:column;gap:6px;margin:8px 0 0}
.g-dom{display:grid;grid-template-columns:minmax(96px,1.2fr) 3fr auto;gap:10px;
  align-items:center;font-size:13px;font-weight:400}
.g-bar{display:flex;height:12px;background:var(--panel);border:2px solid var(--edge);overflow:hidden}
.g-bar i{display:block;height:100%}
.g-bar i.right{background:var(--ok)}
.g-bar i.wrong{background:var(--bad)}
.reveal li .lapse{color:var(--warn)}
@media (max-width:640px){ .g-dom{grid-template-columns:1fr;gap:3px} }
/* ---- map ---- */
.map-wrap{width:100%;margin:0 0 12px}
.map{position:relative;width:100%;aspect-ratio:1016.371/514.609;background:var(--panel2);
  border:3px solid var(--edge);min-height:250px;overflow:hidden}
/* The map SVG ships with a flat fill and stroke as presentation attributes,
   which any CSS rule overrides — so the land follows the theme. */
.map-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-svg path,.map-svg polygon{fill:var(--land);stroke:var(--land-line);stroke-width:.4}
:root{--land:#2a2d36;--land-line:#f0f0f0}
@media (prefers-color-scheme: light){ :root{--land:#eeeeee;--land-line:#111111} }
:root[data-theme=light]{--land:#eeeeee;--land-line:#111111}
:root[data-theme=dark]{--land:#2a2d36;--land-line:#f0f0f0}

.map .site{position:absolute;transform:translate(-50%,-50%);width:9px;height:9px;
  border-radius:50%;background:var(--primary);border:2px solid var(--panel);
  pointer-events:none;z-index:2}
.map .site.comprehensive{background:var(--ok)}
.map .site.sectoral{background:var(--primary)}
.map .site.voluntary{background:var(--warn)}
.map .site.proposed{background:transparent;border-color:var(--warn)}
.map .site.none{background:var(--dim)}
.map .site.treaty{background:var(--cov-treaty)}
.map .pin{position:absolute;transform:translate(-50%,-50%);background:var(--panel);
  border:2px solid var(--edge);color:var(--ink);padding:3px 7px;
  font-size:10.5px;line-height:1.25;cursor:pointer;max-width:26%;z-index:3;
  text-align:left;font-weight:700}
.map .pin:hover{border-color:var(--secondary)}
.map .pin.over{border-color:var(--secondary);box-shadow:2px 2px 0 0 var(--secondary)}
.map .pin.correct{background:var(--ok);color:#0c1a12;border-color:var(--edge)}
.map .pin.wrong{background:var(--bad);color:#2a0505;border-color:var(--edge)}
.map .pin .held{display:block;font-size:9.5px;color:inherit;opacity:.8;
  white-space:normal;line-height:1.25;margin-top:2px;max-width:150px}
.map .leader{position:absolute;height:1px;background:var(--edge);transform-origin:0 50%;
  z-index:1;pointer-events:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-bottom:10px}
/* ---- briefs ---- */
textarea{width:100%;background:var(--panel2);border:2px solid var(--edge);color:var(--ink);
  padding:11px;font:inherit;resize:vertical;min-height:96px}
textarea:focus{outline:none;border-color:var(--secondary)}
.field{margin-bottom:18px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field .count{font-size:12px;color:var(--dim);margin-top:4px}
.scenario{background:var(--panel2);border:2px solid var(--edge);padding:16px;margin-bottom:20px;
  white-space:pre-wrap;line-height:1.6}
.ai-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ai-links .lbl{color:var(--dim);font-size:13px;margin-right:2px}
.ai-link{background:var(--panel2);border:2px solid var(--edge);
  cursor:pointer;padding:7px;line-height:0;position:relative;display:inline-flex}
.ai-link:hover{border-color:var(--secondary)}
.ai-link svg{width:20px;height:20px;display:block}
/* The ChatGPT mark ships with no fill, so it would default to black and vanish
   on the dark theme. Claude and Perplexity carry their own brand colours. */
.ai-link{color:var(--ink)}
.ai-link::after{content:attr(data-label);position:absolute;bottom:calc(100% + 6px);
  left:50%;transform:translate(-50%,4px);background:var(--ink);color:var(--bg);
  font-size:11px;line-height:1.3;padding:4px 8px;border:1px solid var(--edge);white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .12s,transform .12s}
.ai-link:hover::after,.ai-link:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);
  border:2px solid var(--edge);box-shadow:3px 3px 0 0 var(--edge);
  color:#0c1a12;padding:11px 20px;z-index:60;font-size:14px;font-weight:700}
.share-root{position:fixed;inset:0;z-index:70;display:none}
.share-root.open{display:block}
.share-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.share-modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,calc(100vw - 32px));max-height:min(86vh,720px);overflow:auto;
  background:var(--panel);border:4px solid var(--edge);box-shadow:8px 8px 0 0 var(--edge);
  padding:22px}
.share-modal h3{margin:0 0 4px;font-size:18px;text-transform:uppercase}
.share-sub{color:var(--dim);font-size:13px;margin:0 0 12px}
.share-close{position:absolute;top:10px;right:10px;border:2px solid var(--edge);
  background:var(--panel2);color:var(--ink);font:inherit;font-size:16px;font-weight:700;
  width:32px;height:32px;cursor:pointer;line-height:1}
.share-close:hover{background:var(--bad);color:#fff}
.share-tones{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.share-tone{border:2px solid var(--edge);background:var(--panel2);color:var(--ink);
  font:inherit;font-size:13px;font-weight:700;text-align:left;padding:9px 12px;cursor:pointer}
.share-tone[aria-pressed="true"]{background:var(--accent);color:#1a1c1c;
  box-shadow:3px 3px 0 0 var(--edge)}
.share-tone .hint{display:block;font-weight:400;font-size:11px;opacity:.75}
.share-preview{border:2px dashed var(--edge);background:var(--bg);padding:12px;
  font-size:13px;line-height:1.55;margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
.share-reroll{border:2px solid var(--edge);background:var(--panel2);color:var(--ink);
  font:inherit;font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;margin-bottom:14px}
.share-reroll:hover{background:var(--accent);color:#1a1c1c}
.share-nets{display:flex;flex-wrap:wrap;gap:8px}
.share-nets a,.share-nets button{border:2px solid var(--edge);background:var(--panel2);
  color:var(--ink);font:inherit;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.4px;padding:8px 12px;cursor:pointer;text-decoration:none;
  box-shadow:3px 3px 0 0 var(--edge);transition:transform .1s,box-shadow .1s}
.share-nets a:hover,.share-nets button:hover{transform:translate(3px,3px);box-shadow:0 0 0 0 var(--edge)}
.share-note{font-size:11px;color:var(--dim);margin:14px 0 0;border-top:2px solid var(--edge);
  padding-top:10px;line-height:1.5}
@media print{.share-root,.share-btn{display:none}}
.rubric li{margin-bottom:12px}
.rubric b{display:block}
.empty{color:var(--dim);text-align:center;padding:40px 20px}
.banner{background:var(--warn);color:#1a1c1c;border:2px solid var(--edge);padding:10px 14px;
  margin-bottom:14px;font-size:14px;font-weight:700}
.order-list{display:grid;gap:8px;margin:12px 0}
.order-slot{background:var(--panel2);border:2px dashed var(--edge);
  padding:10px 13px;color:var(--dim);font-size:14px}
.order-slot.filled{border-style:solid;color:var(--ink)}
@media (max-width:640px){
  main{padding:14px 12px 80px}
  .zones{grid-template-columns:1fr 1fr}
  /* Pin labels are text, so they don't shrink with the board and start
     colliding below ~700px. Scroll the map inside its own container rather
     than degrading the geography, and never let the page scroll sideways. */
  .map-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* 920px is the desktop board width at which pin spacing was verified
     collision-free; anything narrower reintroduces label overlap. */
  .map{min-width:920px}
  .map-hint{display:block}
}
.map-hint{display:none;font-size:12px;color:var(--dim);margin:0 0 8px}
/* ---- regulatory risk (rr) ----
   Final coverage palette, defined ONCE per mode. Steps come from the dataviz
   reference palette and were run through validate_palette.js against the
   map's actual surfaces (--panel2): light #eeeeee ALL PASS (contrast WARN on
   4 hues — mitigated by the mandatory C/S/V/P/—/T letter badges, the second
   channel), dark #24262e ALL PASS incl. contrast ≥3:1. Worst adjacent CVD
   ΔE 9.1 light / 8.4 dark; normal-vision 19.6 / 19.3. The dark column is
   separately SELECTED dark-band steps, not an auto-flip of the light hexes.
   Ownership rides on luminance (fill-opacity .28 open / .78 held) so hue is
   never the only channel. */
:root{--cov-comprehensive:#3987e5;--cov-sectoral:#d95926;--cov-voluntary:#199e70;
  --cov-proposed:#c98500;--cov-none:#d55181;--cov-treaty:#008300}
@media (prefers-color-scheme: light){
  :root{--cov-comprehensive:#2a78d6;--cov-sectoral:#eb6834;--cov-voluntary:#1baf7a;
    --cov-proposed:#eda100;--cov-none:#e87ba4;--cov-treaty:#008300}
}
:root[data-theme=light]{--cov-comprehensive:#2a78d6;--cov-sectoral:#eb6834;
  --cov-voluntary:#1baf7a;--cov-proposed:#eda100;--cov-none:#e87ba4;--cov-treaty:#008300}
:root[data-theme=dark]{--cov-comprehensive:#3987e5;--cov-sectoral:#d95926;
  --cov-voluntary:#199e70;--cov-proposed:#c98500;--cov-none:#d55181;--cov-treaty:#008300}
/* RR-scoped 44px touch targets (playtest wave 1): action/submit/withdraw/
   begin/start/reg buttons, role-hat-ops pickers, gate answer options,
   sheet-close and debrief ai-links — scoped to .rr-mode so the shared house
   kit (other labs) keeps its baseline. */
.rr-mode .btn{min-height:44px}
.rr-mode .pick button{min-height:44px}
.rr-mode .ai-link{min-height:44px;min-width:44px;align-items:center;justify-content:center}
.rr-hud{position:sticky;z-index:25;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  background:var(--panel);border:3px solid var(--edge);padding:8px 12px;margin:0 0 12px;
  font-weight:700;font-size:14px}
.rr-hud .meter{flex:1;min-width:80px;margin-top:0}
.rr-hud .rr-reg{margin-left:auto;flex:0 0 auto}
.rr-map{position:relative;width:100%;aspect-ratio:1016.371/514.609;background:var(--panel2);
  border:3px solid var(--edge);overflow:hidden;margin:0 0 12px}
.rr-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rr-svg path,.rr-svg polygon{fill:var(--land);stroke:var(--land-line);stroke-width:.4;
  pointer-events:none}
.rr-svg .cov-comprehensive{fill:var(--cov-comprehensive)}
.rr-svg .cov-sectoral{fill:var(--cov-sectoral)}
.rr-svg .cov-voluntary{fill:var(--cov-voluntary)}
.rr-svg .cov-proposed{fill:var(--cov-proposed)}
.rr-svg .cov-none{fill:var(--cov-none)}
.rr-svg .cov-treaty{fill:var(--cov-treaty)}
.rr-svg .rr-open{fill-opacity:.28}
.rr-svg .rr-held{fill-opacity:.78;stroke-width:1}
.rr-svg .rr-notice{stroke:var(--bad);stroke-width:1.3}
.rr-svg .rr-sel{stroke:var(--secondary);stroke-width:1.6}
.rr-svg .rr-fx *{fill:url(#rr-hatch);stroke:none;pointer-events:none}
.rr-svg #rr-hatch line{stroke:var(--bad);stroke-opacity:.8;stroke-width:1.5}
.rr-svg .rr-coe{stroke:var(--dim);stroke-dasharray:7 5;stroke-width:1.6}
.rr-svg .rr-coe.rr-held{stroke:var(--edge);stroke-dasharray:none;stroke-width:2}
.rr-svg .rr-coe.rr-notice{stroke:var(--bad);stroke-dasharray:7 5}
/* the legacy Jurisdiction Map shares the stamped SVG until Task 13 removes it;
   hide the rr-only artefacts there so it stays pixel-identical */
.map-svg .rr-dot,.map-svg .rr-coe{display:none}
.rr-hit{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;
  background:transparent;border:none;cursor:pointer;z-index:3;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:inherit;padding:0}
.rr-glyph{font-size:13px;line-height:1;text-shadow:0 0 4px var(--bg)}
.rr-pinlab{display:none;font-size:9px;font-weight:700;line-height:1.1;
  background:var(--panel);border:1px solid var(--edge);padding:0 3px;margin-top:1px}
@media (min-width:700px){ .rr-pinlab{display:block} }
.rr-hit.rr-hitsel .rr-glyph{color:var(--secondary)}
.rr-hit.rr-hitsel .rr-pinlab{border-color:var(--secondary)}
/* Leader line from a pin to a label whose data nudge pushed it well away from
   the country (Europe cluster, island states) — desktop-only like the labels. */
.rr-lead{display:none;position:absolute;left:50%;top:50%;height:0;
  border-top:1.5px solid var(--edge);opacity:.75;transform-origin:left center;
  pointer-events:none}
@media (min-width:700px){ .rr-lead{display:block} }
.rr-hit.rr-hitsel .rr-lead{border-color:var(--secondary)}
.rr-chip{position:absolute;left:58%;top:-2px;font-size:9px;background:var(--panel);
  border:1px solid var(--edge);padding:0 3px;font-weight:700;white-space:nowrap}
.rr-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim);
  margin:0 0 10px;align-items:center}
.rr-legend span{display:inline-flex;align-items:center;gap:5px}
.rr-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border:2px solid var(--edge);font-weight:700;font-size:12px;flex-shrink:0;color:#111}
.rr-badge.cov-comprehensive{background:var(--cov-comprehensive)}
.rr-badge.cov-sectoral{background:var(--cov-sectoral)}
.rr-badge.cov-voluntary{background:var(--cov-voluntary)}
.rr-badge.cov-proposed{background:var(--cov-proposed)}
.rr-badge.cov-none{background:var(--cov-none)}
.rr-badge.cov-treaty{background:var(--cov-treaty)}
.rr-list{display:grid;gap:8px}
.rr-group{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);
  margin:14px 0 4px;font-weight:700}
.rr-row{display:flex;gap:10px;align-items:center;background:var(--panel2);
  border:2px solid var(--edge);padding:9px 11px}
.rr-row.rr-rowsel{border-color:var(--secondary);box-shadow:2px 2px 0 0 var(--secondary)}
.rr-tinfo{flex:1;min-width:0}
.rr-tinfo b{display:block;font-size:13.5px}
.rr-tinfo em{display:block;font-style:normal;color:var(--dim);font-size:12px}
.rr-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rr-acts .btn{padding:8px 10px;font-size:12px;min-height:44px}
.rr-opscount{font-size:12px;color:var(--dim);margin-top:6px}
@media (max-width:700px){
  .rr-row{flex-wrap:wrap}
  .rr-acts{width:100%;justify-content:flex-start}
}
/* ---- rr slice 3: regulator interstitial ---- */
.rr-aging{display:grid;gap:7px;margin:0 0 14px}
.rr-aging .rr-age{background:var(--panel2);border:2px solid var(--edge);padding:9px 12px;
  font-size:13.5px}
.rr-aging .rr-age.warn{border-color:var(--warn)}
.rr-aging .rr-age.no{border-color:var(--bad);color:var(--bad);font-weight:700}
.rr-event{background:var(--panel2);border:3px solid var(--edge);
  box-shadow:var(--shadow) var(--shadow) 0 0 var(--edge);padding:14px;margin:0 0 14px}
.rr-event h3{margin:0 0 6px;font-size:14px;text-transform:uppercase}
.rr-event p{margin:0 0 8px;font-size:14px}
/* ---- rr slice 3: US inset bottom sheet ---- */
.rr-scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39}
.rr-sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);
  border-top:4px solid var(--edge);padding:14px 16px 20px;max-height:72vh;overflow:auto}
.rr-sheet h3{margin:0;font-size:14px;text-transform:uppercase}
.rr-sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:0 0 10px}
.rr-inset-row{display:flex;gap:12px;align-items:center;width:100%;background:var(--panel2);
  border:2px solid var(--edge);padding:8px 12px;margin:0 0 8px;min-height:60px;
  font:inherit;color:var(--ink);text-align:left;cursor:default}
.rr-inset-row svg{width:48px;height:48px;flex-shrink:0;display:block}
.rr-inset-row svg .rr-frame{fill:none;stroke:var(--edge);stroke-width:3}
.rr-usdots{display:none;position:absolute;top:calc(100% + 1px);left:50%;
  transform:translateX(-50%);gap:3px;pointer-events:none}
@media (min-width:700px){ .rr-usdots{display:flex} }
.rr-usdots i{width:8px;height:8px;border:1px solid var(--edge);border-radius:50%}
/* ---- rr slice 3: debrief ---- */
.rr-arith{background:var(--panel2);border:2px solid var(--edge);padding:11px 13px;
  margin:10px 0;font-size:14px}
.rr-review{display:grid;gap:6px;margin:10px 0}
.rr-review .rr-q{background:var(--panel2);border-left:4px solid var(--ok);
  padding:8px 11px;font-size:13px}
.rr-review .rr-q.miss{border-left-color:var(--bad)}
.rr-review .rr-q em{display:block;font-style:normal;color:var(--dim);font-size:12px}
/* ---- rr slice 3: print strategy report (SPEC §2.7) ----
   The report exists ONLY inside the print media query: hidden on screen,
   and under print it is the only thing shown. Nothing is persisted. */
.rr-print{display:none}
@media print{
  header,.toast,main > *:not(.rr-print){display:none !important}
  body{background:#fff;color:#000;font:10px/1.35 "Space Mono",ui-monospace,monospace}
  main{max-width:none;padding:0}
  .rr-print{display:block;color:#000}
  .rr-print h2{font-size:15px;margin:0 0 2px;text-transform:uppercase}
  .rr-print h3{font-size:11px;margin:7px 0 3px;text-transform:uppercase;
    border-bottom:1px solid #000;padding-bottom:1px}
  .rr-print p{margin:0 0 3px}
  .rr-print table{width:100%;border-collapse:collapse;font-size:9px}
  .rr-print th,.rr-print td{border:1px solid #999;padding:1px 4px;text-align:left;
    vertical-align:top}
  .rr-print tr{page-break-inside:avoid}
  .rr-print ul{margin:0 0 3px;padding-left:16px}
  .rr-print li{margin:0}
  @page{size:A4 portrait;margin:11mm}
}
/* ---- siegeBoard (sg) ----
   Build-then-defend on an inlined SVG scene. The scene art carries sg-zone /
   sg-node / sg-wire / sg-glyph / sg-slot / text classes so it follows the page
   theme; the engine overlays 44px point-target seats, a budgeted chip shop,
   and the breach-animation layer (sg-fx traces + travelling sg-dot). */
.sg-hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel2);
  border:2px solid var(--edge);padding:8px 12px;margin:0 0 12px;font-weight:700;font-size:13px}
.sg-wrap{width:100%;margin:0 0 12px}
.sg-scene{position:relative;width:100%;background:var(--panel2);border:3px solid var(--edge);
  overflow:hidden}
.sg-svg,.sg-fx{position:absolute;inset:0;width:100%;height:100%;display:block}
.sg-fx{pointer-events:none;z-index:2}
.sg-svg .sg-zone{fill:var(--panel);stroke:var(--edge);stroke-width:2;stroke-dasharray:8 6}
.sg-svg .sg-node{fill:var(--panel2);stroke:var(--edge);stroke-width:2}
.sg-svg .sg-wire{stroke:var(--dim);stroke-width:2;fill:none}
.sg-svg .sg-glyph{stroke:var(--dim);stroke-width:1.5;fill:none}
.sg-svg .sg-slot{stroke:var(--edge);stroke-width:3;stroke-dasharray:4 4}
.sg-svg text{fill:var(--dim);font-family:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.sg-svg .sg-zlab{font-size:19px;font-weight:700;letter-spacing:3px}
.sg-svg .sg-nlab{font-size:12px;letter-spacing:.5px}
.sg-tgt{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:44px;
  background:transparent;border:none;cursor:pointer;z-index:3;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:inherit;padding:0}
.sg-seat{width:22px;height:22px;border:2px dashed var(--edge);border-radius:50%;
  background:var(--panel);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;line-height:1}
.sg-tgt.sg-held .sg-seat{border-style:solid;background:var(--primary);color:#1a1c1c}
.sg-tgt.sg-sel .sg-seat,.sg-tgt.over .sg-seat{border-color:var(--secondary);
  box-shadow:2px 2px 0 0 var(--secondary)}
.sg-tgt.sg-safe .sg-seat{border-style:solid;background:var(--ok);color:#0c1a12}
.sg-tgt.sg-hit .sg-seat{border-style:solid;background:var(--bad);color:#2a0505}
.sg-tlab{font-size:9.5px;font-weight:700;line-height:1.1;background:var(--panel);
  border:1px solid var(--edge);padding:0 3px;margin-top:2px;white-space:nowrap}
.sg-tchips{font-size:9px;line-height:1.15;background:var(--panel2);border:1px solid var(--edge);
  padding:0 3px;margin-top:1px;max-width:150px}
.sg-trace{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-dasharray:6 4;
  transition:opacity .25s}
.sg-dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  background:var(--bad);border:2px solid var(--edge);z-index:4;pointer-events:none}
.sg-shop{display:flex;flex-wrap:wrap;gap:8px;background:var(--panel2);
  border:2px dashed var(--edge);padding:12px;margin:0 0 12px;min-height:64px}
.sg-chip{background:var(--panel);border:2px solid var(--edge);color:var(--ink);
  padding:9px 11px;cursor:grab;font:inherit;font-size:13px;text-align:left;max-width:280px;
  display:flex;gap:9px;align-items:flex-start}
.sg-chip:hover{border-color:var(--secondary)}
.sg-chip.sel{background:var(--primary);color:#1a1c1c}
.sg-chip.sg-poor{opacity:.45}
.sg-chip b{display:block;font-size:13px}
.sg-chip em{display:block;font-style:normal;color:var(--dim);font-size:11.5px;margin-top:2px}
.sg-chip.sel em{color:inherit;opacity:.8}
.sg-cost{flex-shrink:0;min-width:26px;height:26px;border:2px solid var(--edge);
  background:var(--panel2);color:var(--ink);font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;padding:0 4px}
.sg-chip.sel .sg-cost{background:var(--panel);color:var(--ink)}
.sg-log{display:grid;gap:6px;margin:0 0 12px}
.sg-line{background:var(--panel2);border-left:4px solid var(--ok);padding:8px 11px;
  font-size:13.5px;transition:opacity .25s}
.sg-line.no{border-left-color:var(--bad)}
.sg-medal{display:flex;align-items:center;gap:10px;background:var(--panel2);
  border:3px solid var(--edge);padding:11px 13px;margin:0 0 12px;font-weight:700;
  text-transform:uppercase;font-size:14px}
.sg-medal .medal{font-size:24px;line-height:1}
.sg-medal.gold{background:var(--primary);color:#1a1c1c}
.sg-mode .btn{min-height:44px}
@media (max-width:640px){
  /* Target labels are text and collide below ~640px; scroll the scene inside
     its own container, like the world map, rather than degrading the board. */
  .sg-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .sg-scene{min-width:640px}
}
</style>

<script id="i18n" type="application/json">/*__I18N__*/</script>
<script>
"use strict";
// The manifest names the lab and lists its games; the deck bundle holds every
// data file those games reference, keyed by the path the manifest used. A deck
// referenced by two labs is authored once and inlined into both.
const LAB = JSON.parse(document.getElementById("lab-manifest").textContent);
let DECKS = JSON.parse(document.getElementById("lab-decks").textContent);
// Per-game SVG scenes (siegeBoard boards), keyed by the deck's scene.svgRef.
// The build inlines only the scenes this lab's games actually reference — the
// aigpMap conditional-inlining rule generalized — so every other lab carries
// an empty object here.
const SCENES = JSON.parse(document.getElementById("lab-scenes").textContent);
document.getElementById("lab-title").textContent = LAB.title;
// Release marking (beta.1 verdict point 5): manifest "release" ("beta", ...)
// stamps the masthead; empty/absent renders nothing (CSS hides :empty), so
// flipping a lab to stable is a manifest edit, not an engine edit.
document.getElementById("lab-release").textContent = LAB.release || "";
document.getElementById("lab-sub").textContent = LAB.subtitle || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

/* ------------------------------------------------------------------ i18n */
const I18N = JSON.parse(document.getElementById("i18n").textContent);
const LANG_KEY = "0pies.lang";
function pickLang(){
  try{ const s = localStorage.getItem(LANG_KEY); if(s && I18N.meta[s]) return s; }catch(e){}
  const nav = (navigator.language || "en").toLowerCase().split("-")[0];
  return I18N.meta[nav] ? nav : "en";
}
let lang = pickLang();
function t(key, vars){
  const d = I18N.ui[lang] || {};
  let s = d[key] != null ? d[key] : I18N.ui.en[key];
  if(s == null){ console.error("i18n: missing key " + key); return key; }
  if(vars) for(const k in vars) s = s.split("{"+k+"}").join(vars[k]);
  return s;
}
const tn = (key, n) => t(key + (n === 1 ? "_one" : "_other"), {n});
function tGame(gameId, field, fallback){
  const v = (I18N.labs[lang] || {})[LAB.id + "." + gameId + "." + field];
  return v != null ? v : fallback;
}
/* Card-content overlay: flat {itemId | "zone:<key>": {dottedPath: text}}.
   Applied by re-parsing the pristine inlined deck JSON and patching it in
   place — one seam that covers every adapter, corpora included, at zero
   per-render cost. English restore = re-parse without patching. */
let OVERLAY = {};
const overlayCache = {};
async function loadOverlay(code){
  OVERLAY = {};
  if(code === "en" || !(I18N.meta[code] || {}).cards) return;
  if(overlayCache[code]){ OVERLAY = overlayCache[code]; return; }
  try{
    const r = await fetch("i18n/" + encodeURIComponent(LAB.id) + "." + code + ".json");
    if(!r.ok) throw new Error("HTTP " + r.status);
    OVERLAY = overlayCache[code] = await r.json();
  }catch(e){ /* file:// or offline — English cards, translated UI */ }
}
function patchTree(node, anchored){
  if(Array.isArray(node)){ node.forEach(n => patchTree(n, anchored)); return; }
  if(!node || typeof node !== "object") return;
  const isId = node.id != null;
  const isZone = !anchored && !isId && node.key != null && node.def != null;
  const oKey = isId ? String(node.id) : (isZone ? "zone:" + node.key : null);
  const o = oKey != null ? OVERLAY[oKey] : null;
  if(o) for(const path in o){
    const parts = path.split(/[.\[\]]+/).filter(Boolean); let tgt = node;
    for(let i = 0; i < parts.length - 1 && tgt; i++) tgt = tgt[parts[i]];
    const leaf = parts[parts.length - 1];
    if(tgt && typeof tgt[leaf] === "string") tgt[leaf] = o[path];
  }
  const childAnchored = anchored || isId || isZone;
  for(const k in node) patchTree(node[k], childAnchored);
}
function relocalizeDecks(){
  DECKS = JSON.parse(document.getElementById("lab-decks").textContent);
  if(Object.keys(OVERLAY).length) patchTree(DECKS);
}
function applyStatic(){
  document.querySelectorAll("[data-i18n]").forEach(n => n.textContent = t(n.dataset.i18n));
  document.querySelectorAll("[data-i18n-attrs]").forEach(n =>
    n.dataset.i18nAttrs.split(";").forEach(pair => {
      const i = pair.indexOf(":");
      n.setAttribute(pair.slice(0, i), t(pair.slice(i + 1)));
    }));
}
async function setLang(code){
  if(!I18N.meta[code]) return;
  lang = code;
  try{ localStorage.setItem(LANG_KEY, code); }catch(e){}
  document.documentElement.lang = code;
  document.documentElement.dir = I18N.meta[code].dir === "rtl" ? "rtl" : "ltr";
  const sel = document.getElementById("lang-select");
  if(sel) sel.value = code;
  await loadOverlay(code);
  relocalizeDecks();
  applyStatic();
  render();
}
function mountLangSelect(){
  const sel = document.getElementById("lang-select");
  sel.innerHTML = Object.keys(I18N.meta).map(c => {
    const m = I18N.meta[c], label = m.flag ? `${m.flag} ${m.name}` : m.name;
    return `<option value="${esc(c)}" ${c === lang ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
  sel.onchange = () => setLang(sel.value);
}

/* ---------------------------------------------------------------- storage */
const KEY = LAB.storageKey;
let memoryOnly = false;
function loadProgress(){
  try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : {items:{},briefs:{}}; }
  catch(e){ memoryOnly = true; return {items:{},briefs:{}}; }
}
let progress = loadProgress();
function save(){
  if(memoryOnly) return;
  try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){ memoryOnly = true; }
}

/* -------------------------------------------------------------- scheduler */
const INTERVALS = [0,1,3,7,21];
const today = () => new Date().toISOString().slice(0,10);
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function record(id, correct){
  const it = progress.items[id] || {seen:0,wrong:0,confidentWrong:0,interval:0,due:today()};
  it.seen++;
  if(correct){
    const i = INTERVALS.indexOf(it.interval);
    it.interval = INTERVALS[Math.min(INTERVALS.length-1, (i<0?0:i)+1)];
  }else{
    it.wrong++; it.interval = 0;
  }
  it.due = addDays(it.interval); it.lastSeen = today();
  progress.items[id] = it; save();
}
function markConfidentlyWrong(id){
  const it = progress.items[id]; if(!it) return;
  it.confidentWrong = (it.confidentWrong||0)+1;
  it.interval = 0; it.due = today(); save();
}
function priority(id){
  const it = progress.items[id];
  // Unseen cards rank between wrong and just-learned: a card answered
  // correctly minutes ago must not crowd out concepts never dealt at all,
  // or a small deck re-deals the same near-complete set every round.
  if(!it) return -1.5;
  if(it.confidentWrong>0) return -3;
  if(it.wrong>0) return -2;
  if(it.interval<7) return -1;
  return it.interval;
}
const dueNow = id => { const it=progress.items[id]; return !it || it.due <= today(); };
function masteryOf(ids){
  if(!ids.length) return 0;
  return ids.filter(id => (progress.items[id]||{}).interval >= 7).length / ids.length;
}

/* ---------------------------------------------------------------- adapters */
// A game names either a runner + deck (generic content) or an adapter + data
// (an existing typed knowledge file, reached by the functions that already drove it).
// An adapter returns whatever its runner expects; nothing else in the engine
// knows which kind of game it is driving.
function deckOf(g){
  const d = DECKS[g.deck || g.data];
  if(!d) throw new Error(`game ${g.id}: no deck loaded for "${g.deck || g.data}"`);
  return d;
}
// Provenance resolves card-first, deck-second. A vendor-neutral deck states its
// source once instead of repeating the same citation on all twenty cards.
function withProvenance(items, d){
  return items.map(it => ({status:"stable", area:d.area, ...it,
                           citation: it.citation || d.source,
                           asOf: it.asOf || d.asOf}));
}

function serviceIcon(serviceName, providerKey){
  const p = ICON_PROVIDERS[providerKey];
  if (!p) return undefined;
  const file = p.map[serviceName] || p.fallback;
  return `assets/${p.dir}/${file}`;
}
const MAX_ZONES = 8;
function zonesFromAnswers(use){
  return [...new Set(use.map(i => i.answer))].map(a => ({key:a, name:a}));
}
// Decision decks add distractors drawn from the cards' own options. An
// answers-only board of six distinct answers is solvable by one-to-one
// elimination without reading a single card, which teaches nothing.
function zonesFromOptions(use, all, seed){
  const answers = [...new Set(use.map(i => i.answer))];
  const pool = [...new Set(all.flatMap(i => i.options || []))].filter(o => !answers.includes(o));
  const extra = shuffle(pool, seed + 11).slice(0, Math.max(0, MAX_ZONES - answers.length));
  return shuffle(answers.concat(extra), seed + 3).map(a => ({key:a, name:a}));
}
function genericBoard(g){
  const d = deckOf(g);
  const items = withProvenance(d.items, d);
  const stamped = g.areaOverride ? items.map(it => ({...it, area: g.areaOverride})) : items;
  const spec = {items: stamped, hint:d.hint || "", note:d.note, traps:d.traps};
  spec.icons = d.icons;
  if(d.zones) spec.zones = d.zones;
  else if(d.zoneMode === "options") spec.zonesFrom = use => zonesFromOptions(use, stamped, state.round);
  else spec.zonesFrom = zonesFromAnswers;
  // A "pick a service, see just its cards" mode: the deck names the field each
  // item is grouped by, and every group's identity (icon + name) comes from
  // the same lookup the tokens themselves already use.
  if(d.groupByService){
    const names = [...new Set(stamped.map(i => i.service))].sort();
    spec.serviceGroups = names.map(name => ({name, icon: serviceIcon(name, d.icons)}));
  }
  return spec;
}
function genericPairs(g){
  const d = deckOf(g);
  return d.pairs.map(p => {
    const base = {area:d.area, ...p, citation:p.citation || d.source};
    return g.areaOverride ? {...base, area: g.areaOverride} : base;
  });
}
function genericLadders(g){
  const d = deckOf(g);
  return d.ladders.map(l => {
    const base = {area:d.area, ...l, citation:l.citation || d.source};
    return g.areaOverride ? {...base, area: g.areaOverride} : base;
  });
}

/* ------------------------------------------------------------ board items */
// Each board game supplies items {id, label, sub?, answer} and zones
// {key, name, def?}. One board runner drives them all.
function tellsBoard(g){
  const DATA = deckOf(g);
  return {
    zonesFrom: items => {
      const s = new Set(); items.forEach(i => i.options.forEach(o => s.add(o)));
      return [...s].map(o => ({key:o, name:o}));
    },
    items: DATA.tells.map(t => ({
      id:t.id, area:t.area, status:t.status, label:`"${t.snippet}"`,
      answer:t.answer, options:t.options, why:t.tell, citation:t.citation
    })),
    hint:t("board.tellsHintDesktop")
  };
}
function roleBoard(g){
  const DATA = deckOf(g);
  const set = DATA.roleMatrix.sets.find(s => s.id===g.setId);
  if(set.items){
    return {
      zones:set.buckets.map(b => ({key:b, name:b})),
      items:set.items.map((it,i) => ({
        id:`${set.id}-${i}`, area:set.area, status:"stable", label:it.text,
        answer:it.answer, why:it.why, citation:set.citation
      })),
      hint:set.prompt, traps:set.traps
    };
  }
  return {
    zones:set.roles.map(r => ({key:r.name, name:r.name, def:r.definition})),
    items:set.obligations.map((o,i) => {
      const role = set.roles.find(r => r.id===o.role);
      return {id:`${set.id}-${i}`, area:set.area, status:"stable", label:o.text,
              answer:role.name, why:role.definition, citation:set.citation};
    }),
    hint:DATA.roleMatrix.prompt, traps:set.traps
  };
}
function timelineBoard(g){
  const t = deckOf(g).timeline;
  // Area + provenance are parameterized (beta.1): a milestone may carry its
  // own area/label/sub/why/citation/asOf, with timeline-level area/citation/
  // asOf as the deck-wide defaults. The AIGP knowledge file predates every
  // override field, so each fallback below reproduces its historical output
  // byte-for-byte; a generic deck (runner "timeline", e.g. Crypto Graveyard
  // on areas 3.6/3.7) authors the same board purely from data.
  return {
    zones:t.buckets.map(b => ({key:b, name:b})),
    items:t.milestones.map(m => ({
      id:m.id, area:m.area || t.area || "II.C", status:m.status, scope:m.scope,
      label:m.label || `${m.instrument} — ${m.milestone}`,
      sub:m.sub !== undefined ? m.sub : m.jurisdiction,
      answer:m.bucket,
      why:m.why || `${m.date}. ${m.note}`,
      citation:m.citation || t.citation || t.title,
      asOf:m.asOf || t.asOf
    })),
    hint:t.prompt, note:t.note
  };
}
function caseBoards(g){
  return deckOf(g).cases.map(c => ({
    id:c.id, brief:c.brief, currency:c.currency, citation:c.citation, areas:c.areas,
    steps:c.steps.map((s,i) => ({id:`${c.id}-s${i}`, ...s}))
  }));
}

// The registry is the seam between the manifest and the engine. build_lab.py
// parses these keys out of this file and fails the build if a manifest names a
// runner or adapter that is not here — otherwise a typo ships a lab with a
// silently missing game.
const ADAPTERS = {
  board:        genericBoard,
  pairs:        genericPairs,
  ladders:      genericLadders,
  // The gauntlet runner needs the whole deck, not one collection: the run is
  // sampled from `questions` in proportion to the deck-level `weights` map.
  gauntlet:     g => deckOf(g),
  aigpTells:    tellsBoard,
  aigpRoles:    roleBoard,
  aigpTimeline: timelineBoard,
  // The same board, driven by a generic deck's `timeline` collection instead
  // of a typed knowledge file (beta.1 area parameterization) — a board-shaped
  // runner, so it deals/renders through the board machinery below.
  timeline:     timelineBoard,
  aigpCases:    caseBoards,
  aigpMap:      g => deckOf(g).map,
  aigpRisk:     g => ({campaign: deckOf(g).campaign, map: deckOf(g).map}),
  // Generalized rr code path (beta.1): same payload shape, but the map is
  // optional — a map-less campaign renders the territory list without the
  // world-map board, and all theater resolves via campaign.copy/config.
  opsCampaign:  g => ({campaign: deckOf(g).campaign, map: deckOf(g).map || null}),
  // Build-then-defend (beta.1 debut, point-target grammar only): the payload
  // is the deck's whole `siege` object; the board SVG itself is looked up in
  // SCENES by scene.svgRef at render time.
  siegeBoard:   g => deckOf(g).siege,
  aigpBriefs:   g => deckOf(g).briefs,
  aigpPairs:    g => deckOf(g).pairs.filter(p => g.setId ? p.set===g.setId : !p.set),
  aigpLadders:  g => deckOf(g).ladders,
  grid3x3:      g => deckOf(g).amendmentsGrid
};

const GAMES = LAB.games.map(g => {
  const runner = g.runner || "board";
  const fn = ADAPTERS[g.adapter || runner];
  if(!fn) throw new Error(`game ${g.id}: unknown adapter "${g.adapter || runner}"`);
  // Payloads are built on demand, not cached: a board spec is rebuilt per deal
  // so that option-mode zones can vary with the round.
  const payload = () => fn(g);
  // "timeline" is board-shaped end to end: it deals via dealBoard and renders
  // via renderBoard, exactly like runner "board" with a different collection.
  const boardish = runner==="board" || runner==="timeline";
  return {...g, runner, payload, board: boardish ? payload : null};
});

const ROUND = 6;

               area:"all", game:null, board:null, placed:{}, sel:null, serviceFilter:null,
               checked:false, round:0, pairIdx:0, pairPick:{}, brief:null,
               ladder:null, order:[], track:"enacted", deskIdx:0, deskPick:{}, sweep:null,
               scored:false, confirmClear:null, gauntlet:null,
               gridRound:0, gridGroups:null, gridItems:[], gridPlaced:{}, gridChecked:false, gridSel:null, gridScored:false};

const areaOK = it => state.area==="all" || (it.area||"").startsWith(state.area);

const main = document.getElementById("main");
// A lab with one tab hides the tab bar entirely; a lab with several shows them,
// with the ones holding no games marked "soon" and disabled.
const TABS = LAB.tabs || [{id:"all", label:"All", enabled:true}];
const tabOK = g => TABS.length<2 || (g.tab || TABS[0].id) === state.domain;
function renderDomainTabs(){
  const tabs = document.getElementById("domain-tabs");
  if(TABS.length < 2){ tabs.innerHTML = ""; return; }
  tabs.innerHTML = TABS.map(tab => {
    const live = tab.enabled !== false;
    return `<button class="tab" role="tab" data-domain="${tab.id}" aria-selected="${state.domain===tab.id}"
      ${live?"":"disabled"}>${esc(tab.label)}${live?"":t("header.soon")}</button>`;
  }).join("");
  tabs.querySelectorAll("[data-domain]").forEach(b =>
    b.onclick = () => { state.domain=b.dataset.domain; state.game=null; state.area="all"; render(); });
}
const RENDERERS = {board:renderBoard, pairs:renderPairs, map:renderMap, risk:renderRisk,
                   desk:renderDesk, ladders:renderLadders, briefs:renderBriefs, grid3x3:renderGrid3x3,
                   gauntlet:renderGauntlet, opsCampaign:renderRisk, siegeBoard:renderSiege,
                   timeline:renderBoard};
function render(){
  renderDomainTabs();
  // RR-scoped 44px touch-target bump (playtest wave 1): scoping class only —
  // the shared house kit keeps its own baseline for every other lab.
  main.classList.toggle("rr-mode", !!(state.game
    && (state.game.runner === "risk" || state.game.runner === "opsCampaign")));
  // Same 44px bump for the siege board, on its own scoping class.
  main.classList.toggle("sg-mode", !!(state.game && state.game.runner === "siegeBoard"));
  const tab = TABS.find(t => t.id===state.domain) || TABS[0];
  if(tab.enabled === false){
    main.innerHTML = `<div class="empty"><h2>${esc(tab.label)}</h2>
      <p>${esc(tab.soon || "Not built yet.")}</p></div>`;
    return;
  }
  syncHash();
  if(!state.game) return renderHome();
  return RENDERERS[state.game.runner]();
}
// Deep links: the address bar mirrors the open game as #g/<id>, so any game
// can be linked to directly. The id is only ever *compared* against GAMES —
// never rendered — so a hostile hash is inert. replaceState rather than
// pushState: tab and back button behave as before, the hash is just a label.
function syncHash(){
  const want = state.game ? "#g/" + encodeURIComponent(state.game.id) : "";
  const have = location.hash.startsWith("#g/") ? location.hash : "";
  if(want === have) return;
  // try/catch: some browsers refuse replaceState on file:// — the label is
  // cosmetic, so losing it must never take the render down with it.
  try{ history.replaceState(null, "", want || location.pathname + location.search); }catch{}
}
function gameFromHash(){
  const m = /^#g\/(.+)$/.exec(location.hash);
  if(!m) return null;
  let id; try{ id = decodeURIComponent(m[1]); }catch{ return null; }
  return GAMES.find(g => g.id === id) || null;
}
function openFromHash(){
  const g = gameFromHash();
  if(!g) return false;
  // Land on the game's own tab, else the board deals from the wrong pool.
  state.domain = g.tab || TABS[0].id;
  state.area = "all";
  start(g.id);
  renderDomainTabs();
  return true;
}
window.addEventListener("hashchange", () => {
  const g = gameFromHash();
  if(g){ if(!state.game || state.game.id !== g.id) openFromHash(); }
  else if(state.game){ state.game = null; render(); }
});

}

  const s=document.getElementById("share-game"); if(s) s.onclick=openShare;
}

function shareUrl(){

// What a game is worth on the home screen, per runner. Games with nothing left
// under the current filter return null and are hidden rather than offered and
// then found empty.
function homeMeta(g){
  const p = g.payload();
  switch(g.runner){
    case "timeline":   // board-shaped payload ({items}), same worth
    case "board": {
      const ids = p.items.filter(areaOK).map(i=>i.id);
      return ids.length ? {label:`${ids.length} ${t("count.cards")}`, ids} : null;
    }
    case "pairs": {
      const ps = p.filter(areaOK);
      return ps.length ? {label:`${ps.length} ${t("count.pairs")}`, ids:ps.map(x=>x.id)} : null;
    }
    case "gauntlet": {
      const qs = (p.questions || []).filter(areaOK);
      return qs.length ? {label:`${qs.length} ${t("count.questions")}`, ids:qs.map(q=>q.id)} : null;
    }
    case "ladders": {
      const ls = p.filter(l => state.area==="all" || l.area===state.area);
      return ls.length ? {label:`${ls.length} ${t("count.ladders")}`} : null;
    }
    case "desk": {
      const cs = p.filter(c => state.area==="all" || c.areas.includes(state.area));
      return cs.length ? {label:`${cs.length} ${t("count.case_files")}`} : null;
    }
    case "briefs": {
      const bs = p.filter(b => state.area==="all" || b.area===state.area || b.capstone);
      return bs.length ? {label:`${bs.length} ${t("count.briefs")}`} : null;
    }
    case "map": return {label:`${p.jurisdictions.length} ${t("count.jurisdictions")}`};
    case "risk": return {label:`${p.map.jurisdictions.length} ${t("count.jurisdictions")} · ${p.campaign.config.turns}-${t("count.campaign")}`};
    case "opsCampaign": {
      // Area-filterable like the boards: the campaign's cards carry area tags,
      // so the chips scope the count and the mastery meter tracks the pool.
      const cs = p.campaign.cards.filter(areaOK);
      if(!cs.length) return null;
      const cp = (p.campaign.copy || {}).home_label;
      const label = cp
        ? cp.split("{n}").join(cs.length).split("{turns}").join(p.campaign.config.turns)
        : `${cs.length} ${t("count.cards")} · ${p.campaign.config.turns}-${t("count.campaign")}`;
      return {label, ids:cs.map(c => c.id)};
    }
    case "siegeBoard": {
      // The scored atoms are the wave events (freebie demo events are never
      // recorded); area chips scope the count and the mastery meter.
      const evs = p.waves.flatMap(w => w.events).filter(areaOK);
      if(!evs.length) return null;
      const cp = (p.copy || {}).home_label;
      const label = cp ? cp.split("{n}").join(evs.length)
                       : `${evs.length} ${t("count.cards")}`;
      return {label, ids:evs.map(e => e.id)};
    }
    case "grid3x3": {
      const domains = g.payload();
      const ids = domains.flatMap(d => [`${d.id}-original`, `${d.id}-updated`]);
      return {label:t("count.grid3x3"), ids};
    }
  }
  return null;
}
// Rung ladder, bottom to top. "Sim" is the strategy-campaign rung the CISSP
// beta introduces (Learn → Apply → Sim, design §5); the AIGP vocabulary keeps
// its existing rungs untouched.
const RUNGS = ["Learn","Contrast","Apply","Drill","Sim","Brief"];
// One home-screen card. Returns "" when the current area filter leaves the
// game with nothing to deal (hidden rather than offered and found empty).
function homeCard(g){
  const meta = homeMeta(g);
  if(!meta) return "";
  const count = meta.label;
  const meter = meta.ids
    ? `<div class="meter"><i style="width:${Math.round(masteryOf(meta.ids)*100)}%"></i></div>` : "";
  return `<button class="card" data-game="${g.id}"><span class="rung">${esc(t("rung."+g.rung.toLowerCase()))}</span>
        <h3>${esc(tGame(g.id, "title", g.title))}</h3><p>${esc(tGame(g.id, "blurb", g.blurb))}</p>
        <p style="margin-top:8px;font-size:12px">${count}</p>${meter}</button>`;
}
const homeH2 = inner => `<h2 style="font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);
      margin:22px 0 10px">${inner}</h2>`;
function renderHome(){
  const filters = (LAB.filters || []).filter(f => !f.tab || f.tab===state.domain);

    [{id:"all", label:LAB.allLabel || "Everything"}].concat(filters).map(c =>

    }).join("");
  }else{
    sections = RUNGS.map(rung => {
      const cards = GAMES.filter(g => g.rung===rung && tabOK(g)).map(homeCard).filter(Boolean).join("");
      if(!cards) return "";

    }).join("");

  const banner = memoryOnly ? `<div class="banner">${esc(t("home.storageBlocked"))}</div>` : "";
  // Release marking (manifest "release": e.g. "beta") — the hub carries it too,

  const release = LAB.release ? `<div class="release-note"><span class="release-badge">${esc(LAB.release)}</span>${
    LAB.releaseNote ? " " + esc(LAB.releaseNote) : ""}</div>` : "";

  main.querySelectorAll("[data-area]").forEach(b => b.onclick=()=>{state.area=b.dataset.area;render();});
  main.querySelectorAll("[data-game]").forEach(b => b.onclick=()=>start(b.dataset.game));
}
function start(id){
  // A run left behind by another game must not keep a clock alive under the
  // one being opened; the gauntlet arms a fresh interval for itself below.
  gauntletStopClock();
  // Campaign screen state is per game: opening a different game drops another
  // campaign's transient UI state (its persisted run stays in localStorage
  // under its own key). Reopening the same campaign resumes as before.
  if(state.rr && state.rr.gameId !== id){ rrStopRegTimer(); state.rr = null; }
  // siegeBoard is session-only, like the gauntlet: opening any game invalidates
  // a running attack replay (seq bump); opening a different game drops the
  // build entirely. Reopening the same siege game resumes its build screen.
  sgAnimSeq++;
  if(state.siege && state.siege.gameId !== id) state.siege = null;
  state.game = GAMES.find(g=>g.id===id);
  state.gauntlet=null;
  state.placed={}; state.sel=null; state.checked=false; state.round=0; state.serviceFilter=null;
  state.pairIdx=0; state.pairPick={}; state.brief=null; state.ladder=null;
  state.order=[]; state.deskIdx=0; state.deskPick={}; state.sweep=null; state.scored=false;
  state.gridRound=0; state.gridGroups=null; state.gridItems=[]; state.gridPlaced={}; state.gridChecked=false; state.gridSel=null;
  if(state.game.board) dealBoard();
  if(state.game.runner==="grid3x3") dealGrid3x3();
  if(state.game.runner==="gauntlet") dealGauntlet();
  render();
}

/* ------------------------------------------------------------ board runner */
function dealBoard(){
  const spec = state.game.board();
  // A "pick a service" board narrows the pool to one group before anything
  // else runs, so priority/due scheduling and the round-robin deal below only
  // ever see that one service's cards.
  if(spec.serviceGroups){
    if(!state.serviceFilter || !spec.serviceGroups.some(s => s.name===state.serviceFilter)){
      state.serviceFilter = spec.serviceGroups[0].name;
    }
  }
  const scoped = spec.serviceGroups ? spec.items.filter(i => i.service===state.serviceFilter) : spec.items;
  // Seeded pre-shuffle + stable sort: equal-priority cards land in an order
  // that changes every round instead of the deck's file order, so a fully-played
  // small deck still varies from deal to deal.
  const pool = shuffle(scoped.filter(areaOK), state.round*31 + 11)
                 .sort((a,b)=>priority(a.id)-priority(b.id));
  const due = pool.filter(i=>dueNow(i.id));
  const source = due.length>=ROUND ? due : pool;

  // Stratify by answer. Dealt in priority order alone, a board fills with the
  // first zone's items and every card has the same answer — which is winnable
  // by pattern and teaches nothing. Round-robin across answer groups instead,
  // keeping priority order inside each group.
  const groups = new Map();
  source.forEach(i => {
    if(!groups.has(i.answer)) groups.set(i.answer, []);
    groups.get(i.answer).push(i);
  });
  const keys = shuffle([...groups.keys()], state.round + 7);
  const use = [];
  for(let guard=0; use.length<ROUND && guard<ROUND*keys.length+1; guard++){
    let took = false;
    for(const k of keys){
      const g = groups.get(k);
      if(g.length && use.length<ROUND){ use.push(g.shift()); took = true; }
    }
    if(!took) break;
  }
  state.board = {
    spec,
    zones: spec.zones || spec.zonesFrom(use),
    items: shuffle(use, state.round + use.length)
  };
  state.placed={}; state.sel=null; state.checked=false; state.scored=false;
}
// Display order for pick-one choices must carry no information: the agent
// playtest baseline (2026-10-02) found pair cards always listed with their
// answer first and desk options with the answer first, so "always pick the
// first" scored 95-100%. Order is seeded per page load (stable while a card is
// on screen, different on the next visit) and per item.
const ORDER_SALT = (Math.random() * 0x7fffffff) | 0;
function strSeed(s){ let h = 2166136261; for(const c of String(s)){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function displayOrder(arr, key){ return shuffle(arr, (strSeed(key) ^ ORDER_SALT) >>> 0); }
function shuffle(arr, seed){
  let h = 2166136261 ^ seed;
  return arr.map((v,i)=>{ h = (h*16777619) ^ (i+1); return [v,(h>>>0)]; })
            .sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
}
/* ------------------------------------------------- mobile placement sheet */
// HTML5 drag-and-drop never fires on touch input, so coarse-pointer devices
// place cards through a bottom sheet instead. Checked live rather than cached
// so DevTools emulation and convertible laptops behave correctly.
const isCoarse = () => matchMedia("(pointer: coarse)").matches;
let sheetEl = null;
function closeSheet(){
  if(sheetEl){ sheetEl.remove(); sheetEl = null; }
}
function openSheet(cfg){
  closeSheet();
  sheetEl = document.createElement("div");
  sheetEl.className = "sheet-root";
  sheetEl.innerHTML = `<div class="sheet-backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(cfg.title)}">
      <p class="sheet-title">${esc(cfg.title)}</p>
      <div class="sheet-rows">${cfg.targets.map(t =>
        `<button class="sheet-row" data-key="${esc(t.key)}">
          ${t.icon?`<img src="${esc(t.icon)}" alt="" aria-hidden="true">`:""}
          <span><b>${esc(t.label)}</b>${t.sub?`<em>${esc(t.sub)}</em>`:""}</span>
        </button>`).join("")}</div>
      <button class="sheet-close">Close</button>
    </div>`;
  document.body.appendChild(sheetEl);
  requestAnimationFrame(() => sheetEl && sheetEl.classList.add("open"));
  const dismiss = () => { closeSheet(); if(cfg.onClose) cfg.onClose(); };
  sheetEl.querySelector(".sheet-backdrop").onclick = dismiss;
  sheetEl.querySelector(".sheet-close").onclick = dismiss;
  sheetEl.querySelectorAll(".sheet-row").forEach(r =>
    r.onclick = () => cfg.onPick(r.dataset.key));
  // Focus the first row (or Close, if the sheet somehow has no targets) so
  // screen readers and keyboards land inside the dialog on open, and Escape
  // dismisses it the same way the backdrop/Close button do.
  const rows = sheetEl.querySelectorAll(".sheet-row");
  (rows[0] || sheetEl.querySelector(".sheet-close")).focus();
  sheetEl.addEventListener("keydown", e => { if(e.key === "Escape") dismiss(); });
}
// The sheet closes after every placement so the player sees the card land on
// the board before choosing the next one. (An auto-advance sweep was tried
// first; on a real phone it hid the board and read as the sheet being stuck.)
function sheetFlow(sheet, cardId){
  openSheet({
    title: t("board.sheetTitle", {label: sheet.labelOf(cardId)}),
    targets: sheet.targets(),
    onPick: key => {
      sheet.place(cardId, key);
      closeSheet();
      render();
    },
  });
}
function renderBoard(){
  const b = state.board, spec = b.spec;
  // An area filter can leave a game with nothing to deal. Without this guard an
  // empty board reads as "every card placed", enables Check, and then throws on
  // the reveal. The home screen hides empty games, so this is a backstop.
  if(!b.items.length){
    main.innerHTML = backBar(state.game.title) + `<div class="panel empty">
      <h2>${esc(t("board.emptyAreaHeader", {area: state.area==="all" ? (LAB.allLabel||"this lab") : state.area}))}</h2>
      <p>${esc(t("board.emptyAreaText"))}</p></div>`;
    wireBack();
    return;
  }
  const bank = b.items.filter(i => !state.placed[i.id]);
  const allPlaced = bank.length===0;

  const tok = (i, cls="") =>
    `<button class="tok ${cls}" draggable="true" data-tok="${i.id}">
    <span>${esc(i.label)}${i.sub?`<em>${esc(i.sub)}</em>`:""}</span></button>`;

  // Zone headers name a service (or, in a grouped board, a capability within one).
  // The icon belongs next to that name, not on the description card being sorted
  // into it — showing it there would give the answer away before the card is placed.
  const zoneIcon = (!spec.serviceGroups && spec.icons && ICON_PROVIDERS[spec.icons])
    ? name => serviceIcon(name, spec.icons) : null;
  const zonesHtml = b.zones.map(z => {
    const held = b.items.filter(i => state.placed[i.id]===z.key);
    return `<div class="zone" data-zone="${esc(z.key)}">
      <h4>${zoneIcon?`<img class="zone-icon" src="${esc(zoneIcon(z.name))}" alt="" aria-hidden="true">`:""
      }${esc(z.name)}</h4>${z.def?`<p class="zdef">${esc(z.def)}</p>`:""}
      <div class="drop">${held.map(i =>
        tok(i, state.checked ? (i.answer===z.key ? "correct":"wrong") : "")).join("")}</div></div>`;
  }).join("");

  let body = "";
  if(spec.serviceGroups){
    const current = spec.serviceGroups.find(s => s.name===state.serviceFilter) || spec.serviceGroups[0];
    body += `<div class="service-identity">
      <img src="${esc(current.icon)}" alt="">
      <div><label for="service-select">${esc(t("board.serviceLabel"))}</label><br>
        <select id="service-select">${spec.serviceGroups.map(s =>
          `<option value="${esc(s.name)}" ${s.name===state.serviceFilter?"selected":""}>${esc(s.name)}</option>`
        ).join("")}</select>
      </div></div>`;
  }
  body += `<p class="hint">${esc(isCoarse() ? t("board.hintMobile") : spec.hint)}</p>`;
  if(spec.note) body += `<p class="cite" style="margin:-8px 0 12px">${esc(spec.note)}</p>`;
  body += `<div class="bank">${bank.map(i => tok(i, state.sel===i.id?"sel":"")).join("")}${bank.length===0?`<span class="bank-note">${esc(t("board.bankEmpty"))}</span>`:""}</div>`;
  body += `<div class="zones">${zonesHtml}</div>`;

  const placedCount = b.items.length - bank.length;
  if(!state.checked){
    body += `<div class="row"><button class="btn" id="check" ${allPlaced?"":"disabled"}>
      ${allPlaced?esc(t("board.checkButton")):esc(t("board.placeAllButton", {n: b.items.length}))}</button>
      <button class="btn ghost" id="clear" ${placedCount?"":"disabled"}>${esc(t("board.clearButton"))}</button>
      <span class="badge">${t("board.badgePlaced", {placed: placedCount, total: b.items.length})}</span></div>`;
  }else{
    const right = b.items.filter(i => state.placed[i.id]===i.answer);
    const wrong = b.items.filter(i => state.placed[i.id]!==i.answer);
    const pct = right.length / b.items.length;
    body += `<div class="reveal">
      <p class="score ${pct===1?"ok":pct>=.6?"mid":"no"}">${t("board.scoreLine", {right: right.length, total: b.items.length})}</p>
      <ul>` + b.items.map(i => {
        const ok = state.placed[i.id]===i.answer;
        return `<li><b class="${ok?"hit":"miss"}">${ok?"✓":"✗"} ${esc(i.label)}</b>
          <span>${ok?"":t("board.revealWrong", {said: `<em>${esc(state.placed[i.id])}</em>`, actual: `<em>${esc(i.answer)}</em>`})}${esc(i.why)}</span></li>`;
      }).join("") + `</ul>`;
    if(spec.traps){
      body += `<div class="dim-note"><b>${esc(t("board.trapsHeading"))}</b><ul style="margin:6px 0 0;padding-left:18px">`
        + spec.traps.map(t=>`<li>${esc(t)}</li>`).join("") + `</ul></div>`;
    }
    const cites = [...new Set(b.items.map(i => i.citation).filter(Boolean))];
    body += `<p class="cite">${esc(cites.join(" · "))}</p>`;
    body += aiLinks(explainPrompt(state.game.title, b.items, cites.join("; ")),
                    esc(t("board.explainLink")));
    if(wrong.length){
      body += aiLinks(deepenPrompt(state.game.title,
        wrong.map(i => ({label:i.label, said:state.placed[i.id], answer:i.answer, why:i.why})),
        cites.join("; ")), esc(t("board.deepenLink")));
    }
    if(wrong.length && !state.sweep){
      body += `<div class="sweep"><p><strong>${esc(t("board.sweepHint", {n: wrong.length}))}</strong></p><div class="row" style="margin:0">` +
        wrong.map(i=>`<button class="btn ghost" data-cw="${i.id}">${esc(i.label.slice(0,44))}${i.label.length>44?"…":""}</button>`).join("")
        + `<button class="btn" data-cw="none">${esc(t("board.sweepNone"))}</button></div></div>`;
    }
    body += `<div class="row"><button class="btn" id="next">${esc(t("board.nextButton"))}</button>
      <button class="btn ghost" id="retry">${esc(t("board.retryButton"))}</button></div></div>`;
  }

  const boardSheet = () => {
    const b = state.board;
    return {
      targets: () => b.zones.map(z => ({key: z.key, label: z.name, sub: z.def || "",
        icon: zoneIcon ? zoneIcon(z.name) : null})),
      labelOf: id => b.items.find(i => i.id === id).label,
      nextUnplaced: () => { const n = b.items.find(i => !state.placed[i.id]); return n ? n.id : null; },
      place: (id, key) => { state.placed[id] = key; state.sel = null; },
    };
  };
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack(); wireDnd(boardSheet()); wireAiLinks();

  const svcSel = document.getElementById("service-select");
  if(svcSel) svcSel.onchange = () => {
    state.serviceFilter = svcSel.value; state.round = 0; dealBoard(); render();
  };

  const chk = document.getElementById("check");
  if(chk) chk.onclick = () => {
    state.checked = true;
    // Only the first attempt at a deal feeds the scheduler. Replaying the same
    // board would otherwise mark everything correct on the second go and quietly
    // inflate mastery.
    if(!state.scored){
      state.board.items.forEach(i => record(i.id, state.placed[i.id]===i.answer));
      state.scored = true;
    }
    render();
  };
  const clr = document.getElementById("clear");
  if(clr) clr.onclick = () => { state.placed = {}; state.sel = null; render(); };
  const rty = document.getElementById("retry");
  if(rty) rty.onclick = () => {
    state.placed = {}; state.sel = null; state.checked = false; state.sweep = null; render();
  };
  main.querySelectorAll("[data-cw]").forEach(x => x.onclick = () => {
    if(x.dataset.cw!=="none") markConfidentlyWrong(x.dataset.cw);
    x.disabled = true; x.classList.remove("ghost");
    if(x.dataset.cw==="none"){ state.sweep=true; render(); }
  });
  const nx = document.getElementById("next");
  if(nx) nx.onclick = () => { state.round++; state.sweep=null; dealBoard(); render(); };
}
function wireDnd(sheet){
  let dragId = null;
  main.querySelectorAll("[data-tok]").forEach(t => {
    t.onclick = () => {
      if(state.checked) return;
      const id = t.dataset.tok;
      // Tapping a placed token returns it to the bank (both input modes).
      if(state.placed[id]){ delete state.placed[id]; state.sel = null; render(); return; }
      if(sheet && isCoarse()){ sheetFlow(sheet, id); return; }
      state.sel = state.sel === id ? null : id;
      render();
    };
    t.ondragstart = e => { dragId = t.dataset.tok; e.dataTransfer.effectAllowed="move"; };
  });
  main.querySelectorAll("[data-zone]").forEach(z => {
    z.ondragover = e => { e.preventDefault(); z.classList.add("over"); };
    z.ondragleave = () => z.classList.remove("over");
    z.ondrop = e => {
      e.preventDefault(); z.classList.remove("over");
      if(dragId && !state.checked){ state.placed[dragId]=z.dataset.zone; dragId=null; state.sel=null; render(); }
    };
    z.onclick = () => {
      if(state.sel && !state.checked){ state.placed[state.sel]=z.dataset.zone; state.sel=null; render(); }
    };
  });
}

/* --------------------------------------------------------------- grid3x3 */
// 9 domains, 3 rounds of 3. Column 1 (domain label) is fixed; columns 2/3
// (Original/Updated) are drop targets fed from one shuffled pool per round
// mixing both sides of all 3 domains, so the player must place both which
// domain AND which side a snippet belongs to.
function dealGrid3x3(){
  const domains = state.game.payload();
  if(!state.gridGroups){
    const ids = shuffle(domains.map(d=>d.id), Math.floor(Math.random()*1e9));
    state.gridGroups = [ids.slice(0,3), ids.slice(3,6), ids.slice(6,9)];
  }
  const roundIds = state.gridGroups[state.gridRound];
  const roundDomains = roundIds.map(id => domains.find(d=>d.id===id));
  const items = [];
  roundDomains.forEach(d => {
    items.push({id:`${d.id}-original`, domainId:d.id, domain:d.domain, side:"original",
                text:d.original.text, citation:d.original.citation});
    items.push({id:`${d.id}-updated`, domainId:d.id, domain:d.domain, side:"updated",
                text:d.updated.text, citation:d.updated.citation});
  });
  state.gridItems = shuffle(items, state.gridRound + items.length);
  state.gridPlaced = {}; state.gridSel = null; state.gridChecked = false; state.gridScored = false;
}
function renderGrid3x3(){
  const domains = state.game.payload();
  const roundDomains = state.gridGroups[state.gridRound].map(id => domains.find(d=>d.id===id));
  const bank = state.gridItems.filter(i => !state.gridPlaced[i.id]);
  const allPlaced = bank.length===0;

  const tok = (i, cls="") => `<button class="tok ${cls}" draggable="true" data-tok="${i.id}">${esc(i.text)}</button>`;
  const cellItem = key => {
    const id = Object.keys(state.gridPlaced).find(k => state.gridPlaced[k]===key);
    return id ? state.gridItems.find(i=>i.id===id) : null;
  };
  const cell = (d, side) => {
    const key = `${d.id}:${side}`;
    const item = cellItem(key);
    const cls = state.gridChecked && item ? (item.domainId===d.id && item.side===side ? "correct" : "wrong") : "";
    return `<div class="zone grid-cell" data-cell="${key}"><div class="drop">${
      item ? tok(item, cls) : `<span class="cell-empty">${esc(t(side==="original"?"grid.cellEmptyOriginal":"grid.cellEmptyUpdated"))}</span>`
    }</div></div>`;
  };
  const rows = roundDomains.map(d => `<div class="grid-row">
      <div class="grid-domain">${esc(d.domain)}</div>
      ${cell(d,"original")}
      ${cell(d,"updated")}
    </div>`).join("");

  let body = `<p class="hint">${esc(isCoarse()
      ? t("grid.hintMobile")
      : t("grid.hintDesktop"))}</p>
    <div class="grid-head"><span></span><span>${esc(t("grid.originalHeader"))}</span><span>${esc(t("grid.updatedHeader"))}</span></div>
    <div class="grid3x3">${rows}</div>
    <div class="bank">${bank.map(i => tok(i, state.gridSel===i.id?"sel":"")).join("")}</div>`;

  if(!state.gridChecked){
    body += `<div class="row"><button class="btn" id="check" ${allPlaced?"":"disabled"}>
      ${allPlaced?esc(t("grid.checkButton")):esc(t("grid.placeAllButton"))}</button>
      <button class="btn ghost" id="clear" ${Object.keys(state.gridPlaced).length?"":"disabled"}>${esc(t("grid.clearButton"))}</button>
      <span class="badge">${t("grid.badgeRound", {n: state.gridRound+1})}</span></div>`;
  }else{
    const right = state.gridItems.filter(i => state.gridPlaced[i.id]===`${i.domainId}:${i.side}`);
    body += `<div class="reveal">
      <p class="score ${right.length===6?"ok":right.length>=4?"mid":"no"}">${t("grid.scoreLine", {right: right.length, total: 6})}</p>
      <ul>` + state.gridItems.map(i => {
        const ok = state.gridPlaced[i.id]===`${i.domainId}:${i.side}`;
        return `<li><b class="${ok?"hit":"miss"}">${ok?"✓":"✗"} ${esc(i.domain)} — ${i.side==="original"?t("grid.originalLabel"):t("grid.updatedLabel")}</b>
          <span>${esc(i.text)} <em>${esc(i.citation)}</em></span></li>`;
      }).join("") + `</ul></div>`;
    const isLast = state.gridRound===2;
    body += `<div class="row"><button class="btn" id="next">${isLast?esc(t("grid.finishButton")):esc(t("grid.nextButton"))}</button>
      <button class="btn ghost" id="retry">${esc(t("grid.retryButton"))}</button></div>`;
  }

  const gridSheet = () => ({
    targets: () => {
      const targets = [];
      roundDomains.forEach(d => ["original","updated"].forEach(side => {
        const key = `${d.id}:${side}`;
        const occ = cellItem(key);
        targets.push({key, label: `${d.domain} — ${side === "original" ? t("grid.originalLabel") : t("grid.updatedLabel")}`,
                sub: occ ? t("grid.sheetHolds", {text: occ.text.slice(0, 60)}) : "", icon: null});
      }));
      return targets;
    },
    labelOf: id => {
      const i = state.gridItems.find(x => x.id === id);
