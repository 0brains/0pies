undry Agent Service documentation"},{"id":"ss-021","label":"Generate a photorealistic product mockup image from a plain-English description, with no starting photo","answer":"DALL-E image generation","options":["DALL-E image generation","Multimodal model","Azure AI Vision"],"why":"Text-to-image generation is DALL-E's job; a multimodal chat model reads images as input but doesn't paint new ones, and Vision only analyzes images that already exist.","citation":"Microsoft Learn · Azure OpenAI DALL-E image generation documentation"},{"id":"ss-022","label":"Run a cost-sensitive assistant on a budget deployment that only ever handles short, simple requests","answer":"Small language model (Phi)","options":["Small language model (Phi)","Multimodal model","Azure OpenAI Service"],"why":"A Phi-class small language model trades some capability for a much smaller footprint and lower cost, which fits lightweight, budget-constrained requests; deploying a full frontier model for simple text is the classic over-provisioning trap.","citation":"Microsoft Learn · Phi small language models in the Azure AI Foundry model catalog"},{"id":"ss-023","label":"Let a user speak a question and hear a spoken answer back in the same low-latency turn, with no separate recognizer/synthesizer calls to wire up","answer":"Voice Live / gpt-realtime","options":["Voice Live / gpt-realtime","Azure AI Speech","Multimodal model"],"why":"gpt-realtime / Voice Live is the single low-latency speech-in, speech-out session; the Azure AI Speech distractor means wiring up the manual SpeechRecognizer→process→SpeechSynthesizer pipeline yourself, which loses on latency and integration — exactly what the realtime API replaces.","citation":"Microsoft Learn · Voice Live API documentation (Azure AI Foundry)"},{"id":"ss-024","label":"Get the deployed model's reply back as well-formed JSON matching a schema you supply, with no extra prose around it","answer":"Chat/completion model deployment","options":["Chat/completion model deployment","Fine-tuning","Multimodal model"],"why":"Structured output is a per-call parameter on a deployed chat/completion model; fine-tuning permanently changes model weights and is unnecessary just to shape one response's format.","citation":"Microsoft Learn · Azure OpenAI structured outputs documentation"},{"id":"ss-025","label":"Bake a company's writing style into every future response using hundreds of labeled example transcripts, so it never has to be re-prompted","answer":"Fine-tuning","options":["Fine-tuning","Chat/completion model deployment","Multimodal model"],"why":"Fine-tuning is the training pass that bakes demonstrated behavior into new weights so it persists across calls; a stock chat/completion deployment only reflects what's resent in that call's prompt, and a multimodal model changes what input types are accepted, not whether style persists without re-prompting.","citation":"Microsoft Learn · Azure OpenAI fine-tuning documentation"},{"id":"ss-026","label":"Test spoken prompts against a deployed audio-capable model directly in the Foundry chat playground, without writing any SDK code","answer":"Multimodal model","options":["Multimodal model","Voice Live / gpt-realtime","Azure AI Speech"],"why":"An audio-capable multimodal deployment can be exercised straight in the chat playground; Voice Live/gpt-realtime is the dedicated low-latency realtime session API, a separate deployment path built for continuous conversational voice.","citation":"Microsoft Learn · Azure AI Foundry models documentation (multimodal models)"}]},"decks/microsoft/cu-modality-grid.json":{"id":"cu-modality-grid","runner":"board","title":"Right Analyzer, Right Modality","blurb":"Documents, images, audio, video — drop each extraction job on the modality Content Understanding runs it against.","source":"AI-901 study guide Task 2.4","asOf":"2026-07","area":"microsoft-foundry","hint":"Ask what the source file actually is, then check the sub line for the exact prebuilt-* analyzer id — the id itself names its modality (document/image/audio/video), and Search-suffixed ids prep output for indexing rather than change the modality.","note":"Content Understanding always extracts — it never generates or indexes. Extraction into Azure AI Search is a downstream step, not something CU does itself.","traps":["Treating Content Understanding as another name for Document Intelligence is the classic trap — Document Intelligence is the older Forms Recognizer-lineage service; Content Understanding is the newer multimodal one spanning documents, images, audio and video.","Content Understanding extracts structured content; it doesn't index it for search — that's Azure AI Search's job once CU's markdown and fields are the input."],"zones":[{"key":"Documents & forms","name":"Documents & forms","def":"PDFs, invoices, contracts and freeform paperwork Content Understanding turns into structured fields, tables and text."},{"key":"Images","name":"Images","def":"Photos, screenshots and charts Content Understanding turns into structured fields, descriptions and detected objects."},{"key":"Audio","name":"Audio","def":"Recorded speech — calls, podcasts and voicemails — Content Understanding turns into transcripts, summaries and speaker labels."},{"key":"Video","name":"Video","def":"Recorded footage Content Understanding segments, transcribes and prepares for search."}],"items":[{"id":"cu-001","label":"Analyze an invoice PDF and read the extracted vendor, total and due-date fields","sub":"prebuilt-invoice","answer":"Documents & forms","why":"prebuilt-invoice extracts structured fields from invoice documents — the exam's most-tested prebuilt analyzer (7 mentions).","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (document and form analysis)"},{"id":"cu-002","label":"Define your own field schema in natural language and extract those fields from contracts","sub":"custom analyzer via begin_create_analyzer","answer":"Documents & forms","why":"Custom analyzers are built from a field schema you describe — CU's plain-language field description is what separates it from Document Intelligence prebuilts.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (document and form analysis)"},{"id":"cu-006","label":"Return text, tables, and selection marks with document structure — no field semantics","sub":"prebuilt-layout","answer":"Documents & forms","why":"Layout extracts text, tables, selection marks and structure; Read-style OCR is text only — histack's CU Read-vs-Layout distinction.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (document and form analysis)"},{"id":"cu-007","label":"A mixed batch of vendor forms needs their loose key-value pairs pulled out without starting from a predefined field schema","sub":"prebuilt-documentFields","answer":"Documents & forms","why":"prebuilt-documentFields extracts general key-value pairs from documents with no domain-specific schema required — unlike prebuilt-invoice's fixed invoice fields.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (document and form analysis)"},{"id":"cu-008","label":"Before building a custom analyzer for a brand-new form type, ask Content Understanding to propose the field schema, then base the new analyzer on the general document analyzer","sub":"prebuilt-documentFieldSchema → prebuilt-document","answer":"Documents & forms","why":"prebuilt-documentFieldSchema proposes fields for a document type you haven't schema'd yet; prebuilt-document is the base_analyzer_id used when defining a new custom document analyzer — two distinct ids in the same custom-build workflow.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (document and form analysis)"},{"id":"cu-003","label":"Extract text and identified objects from photographed equipment labels","sub":"prebuilt-image","answer":"Images","why":"prebuilt-image extracts text and objects from still images through the same analyzer workflow as every other modality.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (image analysis)"},{"id":"cu-009","label":"Run the Python quickstart against a product photo and read the generated description back from the result's Summary field","sub":"prebuilt-imageSearch","answer":"Images","why":"prebuilt-imageSearch is the quickstart analyzer for descriptive image output — its result exposes a Summary field holding the natural-language description.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (image analysis)"},{"id":"cu-010","label":"Build a custom analyzer that pulls a chart's Title and ChartType fields out of a batch of dashboard screenshots","sub":"custom analyzer via base_analyzer_id=\"prebuilt-image\"","answer":"Images","why":"Custom image analyzers set base_analyzer_id to prebuilt-image before layering a field schema — the documented pattern for chart and screenshot extraction.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (image analysis)"},{"id":"cu-011","label":"Analyze shelf photos from a retail audit and return structured fields for product count, brand presence, and out-of-stock indicators","sub":"prebuilt-image","answer":"Images","why":"Content Understanding's image analyzer returns schema-defined structured fields straight from photos — the retail shelf-audit scenario the exam tests directly.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (image analysis)"},{"id":"cu-012","label":"Wire a Python client that calls begin_analyze with analyzer_id=\"prebuilt-image\" against a photo URL, then read back the detected objects from the result","sub":"prebuilt-image","answer":"Images","why":"The begin_analyze(analyzer_id=..., inputs=[AnalysisInput(url=...)]) call pattern is identical across modalities — only the analyzer id changes, and prebuilt-image is the direct (non-search) image analyzer.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (image analysis)"},{"id":"cu-004","label":"Get a transcript plus summary and speaker breakdown from recorded support calls","sub":"prebuilt-audio","answer":"Audio","why":"CU's audio analyzers return transcripts, summaries and speakers — extraction, never speech synthesis.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (audio analysis)"},{"id":"cu-013","label":"Wire a lightweight Python client that calls begin_analyze with a call-recording URL to pull back a transcript and summary ready for a retrieval index","sub":"prebuilt-audioSearch","answer":"Audio","why":"prebuilt-audioSearch is the documented analyzer id in the SDK's quickstart snippet — the *Search suffix marks output prepped for indexing/RAG retrieval, unlike prebuilt-audio's direct extraction with no retrieval prep.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (audio analysis)"},{"id":"cu-014","label":"Pull speaker-labeled, precisely timed transcript phrases out of a batch of podcast episodes","sub":"transcriptPhrases","answer":"Audio","why":"transcriptPhrases is the output field carrying speaker identification and timing information — a direct audio-extraction output, distinct from the analyzer id itself.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (audio analysis)"},{"id":"cu-015","label":"Recognize that submitting a podcast MP3 to Content Understanding sets the contents object's kind to the same value used for video inputs","sub":"kind: \"audioVisual\"","answer":"Audio","why":"Audio-only and video inputs both use kind: \"audioVisual\" in the contents schema — a shared value that trips up anyone expecting a distinct 'audio' kind.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (audio analysis)"},{"id":"cu-016","label":"Confirm that pulling a structured transcript out of a voicemail inbox is speech captured into text, never text turned into speech","answer":"Audio","why":"CU's audio analyzers transcribe existing speech into structured output — they never synthesize new spoken output; that job belongs to Azure AI Speech, not Content Understanding.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (audio analysis)"},{"id":"cu-005","label":"Segment recorded training sessions and index their transcripts and visual events for search","sub":"prebuilt-videoSearch","answer":"Video","why":"Video analyzers return segments, transcripts and visual events; the *Search variants prepare content for retrieval — Azure AI Search indexes what CU extracts.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (video analysis)"},{"id":"cu-017","label":"Divide an uploaded recorded product demo into logical scene segments before any downstream processing runs","sub":"enableSegment","answer":"Video","why":"enableSegment is the analyzer schema property that splits footage into logical segments such as scenes — a video-analyzer control, not an audio or document one.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (video analysis)"},{"id":"cu-018","label":"After analyzing a marketing clip, read back a structured markdown summary of its transcript and visual content","sub":"prebuilt-videoSearch","answer":"Video","why":"prebuilt-videoSearch results expose a markdown field summarizing transcript and visual content per segment — the SDK's documented read-back field for video.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (video analysis)"},{"id":"cu-019","label":"Confirm that extracting keyframes and visual events from an uploaded recording works on footage that already exists, rather than generating new frames","answer":"Video","why":"CU's analyzers extract keyframes, transcripts and visual events from footage that already exists — they don't generate synthetic frames; that's a different category of AI service entirely.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (video analysis)"},{"id":"cu-020","label":"Wire a Python client that calls begin_analyze with analyzer_id=\"prebuilt-videoSearch\" against an uploaded MP4 URL","sub":"prebuilt-videoSearch","answer":"Video","why":"The begin_analyze(analyzer_id=\"prebuilt-videoSearch\", inputs=[AnalysisInput(url=...)]) call is the documented SDK pattern for kicking off video extraction.","citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding (video analysis)"}]},"decks/microsoft/sdk-wiring.json":{"id":"sdk-wiring","runner":"board","title":"Read the Snippet","blurb":"What does this line do, and which identifier does it — with the close-name impostor sitting right next to it?","source":"histack.net SDK-snippet pattern","asOf":"2026-07","area":"microsoft-foundry","zoneMode":"options","traps":["SpeechConfig holds credentials and voice settings; AudioConfig picks the input/output device; neither one recognizes or synthesizes on its own.","AIProjectClient.get_openai_client() is a method call on an instance, not a class-level call — the exam's documented trap.","input_audio is a message content part for spoken INPUT; modalities+audio is a request-level setting for spoken OUTPUT — they are opposite directions on the same call.","A multimodal chat deployment reads image content parts as input; ImageAnalysisClient is a separate Vision SDK with its own endpoint and fixed feature set — different services entirely."],"items":[{"id":"sw-001","label":"Connects your code to a Foundry project using an endpoint and credential (package azure-ai-projects)","answer":"AIProjectClient","options":["AIProjectClient","get_openai_client","DefaultAzureCredential"],"why":"AIProjectClient(endpoint, credential) is the project entry point; get_openai_client() hangs off it — remove auth and this is the line that breaks.","citation":"Microsoft Learn · Azure AI Foundry SDK quickstart (azure-ai-projects)"},{"id":"sw-002","label":"Sends the messages list to a deployed model and returns choices[0].message.content","answer":"chat.completions.create","options":["chat.completions.create","openai.responses.create","get_openai_client"],"why":"chat.completions.create(model=DEPLOYMENT_NAME, messages=[…]) is the chat call — and model= takes the deployment name, not the base model name (histack trap #5).","citation":"Microsoft Learn · Azure OpenAI chat completions quickstart"},{"id":"sw-003","label":"Holds your Speech resource key and region, and the synthesis voice name","answer":"SpeechConfig","options":["SpeechConfig","AudioConfig","SpeechSynthesizer"],"why":"SpeechConfig(key, region) is configured first (e.g. speech_synthesis_voice_name='en-US-Ava:DragonHDLatestNeural'); AudioConfig handles devices, not credentials.","citation":"Microsoft Learn · Azure AI Speech SDK documentation"},{"id":"sw-004","label":"Send the user's spoken question as inline audio data inside the message content","answer":"input_audio part","options":["input_audio part","modalities+audio","SpeechRecognizer"],"why":"Spoken INPUT goes in message content parts as input_audio; the response-settings twin is the documented trap.","citation":"Microsoft Learn · Azure OpenAI audio-enabled chat completions documentation"},{"id":"sw-005","label":"Ask the model to answer with spoken audio: voice \"alloy\", format \"wav\"","answer":"modalities+audio","options":["modalities+audio","input_audio part","SpeechSynthesizer"],"why":"Spoken OUTPUT is requested via modalities=[\"text\",\"audio\"] plus audio={\"voice\":\"alloy\",\"format\":\"wav\"} on the multimodal call — the exam's exact payload.","citation":"Microsoft Learn · Azure OpenAI audio-enabled chat completions documentation"},{"id":"sw-006","label":"Include a photo (URL or base64) in a chat message so the deployed gpt-4o can describe it","answer":"image content part","options":["image content part","ImageAnalysisClient","gpt-image-1 call"],"why":"Visual input travels as image_url / base64 content parts to a multimodal deployment — not through the Vision SDK, which is a different service and endpoint (pair #23).","citation":"Microsoft Learn · Azure OpenAI vision-enabled chat documentation (image input)"},{"id":"sw-007","label":"Bridges an existing project client to the OpenAI-compatible client used for Responses and Conversations calls","answer":"get_openai_client","options":["get_openai_client","AIProjectClient","chat.completions.create"],"why":"project.get_openai_client() is an instance method called on the project object; the exam's trap is calling it on the class itself instead.","citation":"Microsoft Learn · Azure AI Foundry SDK quickstart (azure-ai-projects)"},{"id":"sw-008","label":"Called once, right after the project client is built, before the first Responses or Conversations request goes out","answer":"get_openai_client","options":["get_openai_client","DefaultAzureCredential","AIProjectClient"],"why":"It is the runtime bridge that hands back the OpenAI-shaped client; the credential object only authenticates the project client, it never returns a chat client.","citation":"Microsoft Learn · Azure AI Foundry SDK quickstart (azure-ai-projects)"},{"id":"sw-009","label":"Passed with zero arguments as the credential= value so the app authenticates via signed-in Azure identity, no key typed anywhere","answer":"DefaultAzureCredential","options":["DefaultAzureCredential","AIProjectClient","azure-ai-projects"],"why":"DefaultAzureCredential() is the keyless Entra ID credential object; AIProjectClient is what consumes it, and azure-ai-projects is only the package name, not a runtime object.","citation":"Microsoft Learn · Azure Identity library (DefaultAzureCredential) documentation"},{"id":"sw-010","label":"The object az login sets up for: the client resolves your signed-in identity from it automatically at call time, no environment API key needed","answer":"DefaultAzureCredential","options":["DefaultAzureCredential","get_openai_client","AIProjectClient"],"why":"The quickstart pairs az login with this credential object; get_openai_client only returns a chat client and has nothing to do with authentication.","citation":"Microsoft Learn · Azure Identity library (DefaultAzureCredential) documentation"},{"id":"sw-011","label":"The pip package you install before writing any Foundry project client code, per the quickstart's very first setup command","answer":"azure-ai-projects","options":["azure-ai-projects","azure-ai-search","azure-ai-language"],"why":"\"Which package should you install for the project client?\" is a classic exam stem — the answer is azure-ai-projects, not the search or language SDKs.","citation":"Microsoft Learn · Azure AI Foundry SDK quickstart (azure-ai-projects)"},{"id":"sw-012","label":"Listed alongside az login in the quickstart setup steps, pinned to a minimum version (>=2.0.0) before any client code runs","answer":"azure-ai-projects","options":["azure-ai-projects","azure-ai-vision","azure-ai-search"],"why":"The documented quickstart guidance installs azure-ai-projects>=2.0.0 and runs az login — the Vision and Search packages are unrelated to the project client.","citation":"Microsoft Learn · Azure AI Foundry SDK quickstart (azure-ai-projects)"},{"id":"sw-013","label":"Constructed with an endpoint and an AzureKeyCredential before any key-phrase or sentiment call can run against plain text","answer":"TextAnalyticsClient","options":["TextAnalyticsClient","ContentUnderstandingClient","ImageAnalysisClient"],"why":"TextAnalyticsClient(endpoint, credential) exposes.extract_key_phrases()/.analyze_sentiment() on raw text; the other two clients target multimodal documents and images at different endpoints entirely.","citation":"Microsoft Learn · Azure AI Language SDK documentation (TextAnalyticsClient)"},{"id":"sw-014","label":"Whichever client type exposes analyze_sentiment(documents) so each document's overall sentiment gets printed back","answer":"TextAnalyticsClient","options":["TextAnalyticsClient","ContentUnderstandingClient","SpeechRecognizer"],"why":"Sentiment and key-phrase extraction are AI Language text-analytics methods on this client; the other two operate on multimodal documents or live audio, not plain text.","citation":"Microsoft Learn · Azure AI Language SDK documentation (TextAnalyticsClient)"},{"id":"sw-015","label":"Set to listen from the computer's default microphone instead of a saved file, then handed to the recognizer as its audio source","answer":"AudioConfig","options":["AudioConfig","SpeechConfig","SpeechRecognizer"],"why":"AudioConfig(use_default_microphone=True) picks the input device; SpeechConfig instead holds the subscription key/region, and SpeechRecognizer is the class this object gets passed into, not the device selector itself.","citation":"Microsoft Learn · Azure AI Speech SDK documentation"},{"id":"sw-016","label":"Built from a saved filename so a recognizer reads speech from a test WAV file instead of a live microphone","answer":"AudioConfig","options":["AudioConfig","SpeechConfig","SpeechSynthesizer"],"why":"AudioConfig(filename=…) is the file-backed device source; SpeechConfig carries credentials and voice name, and SpeechSynthesizer plays audio out rather than reading it in.","citation":"Microsoft Learn · Azure AI Speech SDK documentation"},{"id":"sw-017","label":"Given both a speech config and an audio config, then called to capture exactly one short spoken utterance and stop","answer":"SpeechRecognizer","options":["SpeechRecognizer","SpeechSynthesizer","AudioConfig"],"why":"This is the class whose recognize_once_async() captures a single utterance; SpeechSynthesizer instead speaks text out, and AudioConfig only wires up the input device.","citation":"Microsoft Learn · Azure AI Speech SDK documentation"},{"id":"sw-018","label":"Its single-utterance async call returns a result object whose.text holds the transcript of what the microphone just heard","answer":"SpeechRecognizer","options":["SpeechRecognizer","SpeechSynthesizer","TextAnalyticsClient"],"why":"The speech-to-text class returns result.text from recognizing live audio; the synthesizer speaks instead of listens, and the Language client only ever works on text that's already been transcribed.","citation":"Microsoft Learn · Azure AI Speech SDK documentation"},{"id":"sw-019","label":"Takes a speech config with the voice name already set, then turns a text string into spoken output through the speaker","answer":"SpeechSynthesizer","options":["SpeechSynthesizer","SpeechRecognizer","AudioConfig"],"why":"This class's speak_text_async() plays a string aloud using the configured voice; the recognizer instead converts speech to text, and AudioConfig only selects a device.","citation":"Microsoft Learn · Azure AI Speech SDK documentation"},{"id":"sw-020","label":"After a recognizer produces a text transcript, this second object reads that same string back out loud with its own async speak call","answer":"SpeechSynthesizer","options":["SpeechSynthesizer","SpeechRecognizer","SpeechConfig"],"why":"Text-to-speech playback of the recognized reply is this class's job; the recognizer already produced the text, and SpeechConfig only stores credentials and the voice name it uses.","citation":"Microsoft Learn · Azure AI Speech SDK documentation"},{"id":"sw-021","label":"Constructed with an endpoint and key, then its single call analyzes an image URL for the READ visual feature to pull text off a photo","answer":"ImageAnalysisClient","options":["ImageAnalysisClient","ContentUnderstandingClient","TextAnalyticsClient"],"why":"This Vision client's.analyze(image_url=…, visual_features=[…]) call runs OCR on general images; ContentUnderstandingClient instead returns a poller from a very different, asynchronous call shape.","citation":"Microsoft Learn · Azure AI Vision Image Analysis SDK quickstart"},{"id":"sw-022","label":"Its captioning-plus-OCR call takes the image by URL rather than raw bytes, requesting both CAPTION and READ features in one pass","answer":"ImageAnalysisClient","options":["ImageAnalysisClient","ContentUnderstandingClient","SpeechRecognizer"],"why":"This Vision client's by-URL analysis method returns fixed prebuilt features like caption and read; it has no polling step and no relation to speech capture at all.","citation":"Microsoft Learn · Azure AI Vision Image Analysis SDK quickstart"},{"id":"sw-023","label":"The client an app creates first when it will send document URLs off for extraction and read structured results back","answer":"ContentUnderstandingClient","options":["ContentUnderstandingClient","TextAnalyticsClient","ImageAnalysisClient"],"why":"\"Which client should the app create first?\" for a Content Understanding app is this class — the other two are separate services with separate endpoints for plain text and general images respectively.","citation":"Microsoft Learn · Azure AI Content Understanding SDK quickstart"},{"id":"sw-024","label":"Its long-running analyze call returns a poller; calling.result() on that poller is how the app waits for the final extracted output","answer":"ContentUnderstandingClient","options":["ContentUnderstandingClient","ImageAnalysisClient","TextAnalyticsClient"],"why":"begin_analyze() plus poller.result() is this client's asynchronous polling pattern; the Vision client's analyze() is synchronous, and the Language client's methods take documents directly with no polling.","citation":"Microsoft Learn · Azure AI Content Understanding SDK quickstart"},{"id":"sw-025","label":"The image-generation request whose response field b64_json holds the actual pixel data you decode, not a url field","answer":"gpt-image-1 call","options":["gpt-image-1 call","chat.completions.create","ImageAnalysisClient"],"why":"A GPT-image-1 deployment returns generated image bytes in response.data[0].b64_json; a completions call returns text choices, and the Vision client only analyzes an image that already exists.","citation":"Microsoft Learn · Azure OpenAI image generation API (gpt-image-1)"},{"id":"sw-026","label":"Set background to transparent and request PNG output on this text-to-image request to get a see-through background","answer":"gpt-image-1 call","options":["gpt-image-1 call","ImageAnalysisClient","chat.completions.create"],"why":"Transparent background plus PNG output are GPT-image-1-series generation parameters; nothing in the Vision analysis or chat-completion calls accepts them.","citation":"Microsoft Learn · Azure OpenAI image generation API (gpt-image-1)"}]},"decks/microsoft/foundry-flows.json":{"id":"foundry-flows","runner":"ladders","title":"Build Orders","blurb":"Six workflows the exam expects you to replay from memory — click each step into the only order that ships.","source":"AI-901 study guide Tasks 1.2/2.1/2.2/2.4","asOf":"2026-07","area":"microsoft-foundry","ladders":[{"id":"lad-genai","title":"How a generative model produces text","prompt":"Put the steps in the order a generative model turns your prompt into text.","steps":[{"label":"Tokenization","detail":"Input text is split into tokens — words or sub-words — each mapped to an id from the model's vocabulary; nothing downstream has meaning until this happens (Task 1.2)."},{"label":"Embeddings","detail":"Each token id is converted into a numeric vector encoding meaning — the same vector space that makes semantic similarity computable as vector distance."},{"label":"Transformer attention","detail":"Self-attention layers weigh every token against every other token in the sequence — the mechanic that 'powers most modern foundation models,' and it needs the embedding vectors to already exist."},{"label":"Next-token prediction","detail":"The model outputs a probability distribution over the whole vocabulary for the single next token; temperature and top-p reshape this distribution before one token is sampled."},{"label":"Detokenized output","detail":"The predicted token id is decoded back to text and the loop repeats one token at a time until a stop condition — perplexity measures how well this step's predictions matched held-out text."}],"citation":"AI-901 study guide Task 1.2 · Microsoft Learn: Fundamentals of generative AI (tokenization and text generation)"},{"id":"lad-chat","title":"Chat client with the Foundry SDK","prompt":"Put the code flow in the order it must run.","steps":[{"label":"Install azure-ai-projects","detail":"'Which package should you install for the project client?' is a classic exam stem — the answer is azure-ai-projects."},{"label":"Create AIProjectClient(endpoint, DefaultAzureCredential())","detail":"Endpoint + credential must both exist before any call; keyless auth = Entra ID DefaultAzureCredential."},{"label":"Call get_openai_client()","detail":"Bridges the project client to an OpenAI-compatible chat client — the line that breaks everything if removed."},{"label":"Build the messages list (system prompt first, then user prompt)","detail":"Rules and guardrails in the system message; this turn's request in the user message."},{"label":"Call chat.completions.create(model=DEPLOYMENT_NAME, messages=[...])","detail":"model= takes YOUR deployment name, never the base model name — the classic trap."},{"label":"Read response.choices[0].message.content","detail":"The reply text lives on the first choice's message — corpus snippet questions end here."}],"citation":"AI-901 study guide Task 2.2 · Microsoft Learn: Azure AI Foundry SDK quickstart (azure-ai-projects)"},{"id":"lad-agent","title":"Agent lifecycle","prompt":"Put the agent's lifecycle in the order it must happen.","steps":[{"label":"Define the agent: PromptAgentDefinition(model=MODEL_NAME, instructions=..., tools=[...])","detail":"Model + instructions + tools set at definition time — {\"deployment\":{\"model\":AGENT_NAME}} is the canonical wrong answer; deployments host models, agents are model + instructions + tools."},{"label":"Test it in the Agents playground","detail":"The playground configures persona, tools, and attached knowledge side by side and lets you try multi-turn behavior before any client code calls the agent."},{"label":"Save it: project.agents.create_version(agent_name=AGENT_NAME, definition=...)","detail":"Unsaved playground edits are lost on leaving the portal — create_version is what actually persists a definition, whether you built it in the portal or in code."},{"label":"Create a thread: openai.conversations.create()","detail":"Opens the runtime container that later turns write into — called by the client app before the first message is sent, distinct from the agent's own definition."},{"label":"Add the user's message to the thread","detail":"The turn's content is appended to the thread's accumulating message history — a run can't process a message that hasn't been added yet."},{"label":"Create a run and read the output: openai.responses.create(..., extra_body={\"agent_reference\": {...}})","detail":"The invocation that actually processes the conversation and produces the agent's next output; agent_reference is per-call metadata pointing at the saved definition."}],"citation":"AI-901 study guide Task 2.1 · Microsoft Learn: Azure AI Foundry Agent Service quickstart"},{"id":"lad-speech","title":"Speech SDK call order","prompt":"Put the Speech SDK calls in the order they must run.","steps":[{"label":"SpeechConfig(subscription=key, region=region)","detail":"Every Speech SDK flow starts here — the key/region (or endpoint) pair that authenticates every call that follows."},{"label":"Set speech_config.speech_synthesis_voice_name = \"...\"","detail":"Voice selection is a property set directly on the config object — exam's DragonHD-voice snippet sets this line right after SpeechConfig, before any other object is built from it."},{"label":"AudioConfig(...) — microphone, file, or default device","detail":"Built independently of the voice-name property, but quickstart snippets construct it only after config setup is finished, immediately before the recognizer/synthesizer that will consume both objects."},{"label":"Create the Recognizer or Synthesizer: SpeechRecognizer(speech_config, audio_config) / SpeechSynthesizer(speech_config)","detail":"Both constructors take the already-built speech_config (the recognizer also takes audio_config) — nothing after this point can still inject the config."},{"label":"Call recognize_once() / speak_text_async(text)","detail":"recognize_once() captures one short utterance (vs. continuous recognition); speak_text_async() actually plays the text — the async future/.get() pattern belongs here, last, once the object exists."}],"citation":"Microsoft Learn · Azure AI Speech SDK quickstart (speech to text and synthesis)"},{"id":"lad-voice","title":"Classic voice pipeline","prompt":"Put the classic voice-agent pipeline in order.","steps":[{"label":"Speech-to-text: convert the caller's spoken audio into text","detail":"Pipeline step one — recognize_once() or continuous recognition turns audio into a transcript before any reasoning can happen on it."},{"label":"Language / generative-AI processing: reason over the transcript and produce a text reply","detail":"A chat/agent call reasons over the transcript — the step a single multimodal model (e.g. audio-in/audio-out chat deployment) can collapse together with steps 1 and 3, and the one the Voice Live API is built to replace all three of at once with a single low-latency speech-to-speech interface."},{"label":"Text-to-speech: synthesize the reply back to audio","detail":"speak_text_async() plays the generated reply — the classic pipeline's final step, also foldable into the single-multimodal-model or Voice Live alternative named in step 2's detail."}],"citation":"Microsoft Learn · Azure AI Speech documentation (speech-to-text, language model, text-to-speech pipeline)"},{"id":"lad-cu","title":"Content Understanding workflow","prompt":"Put the Content Understanding workflow in order.","steps":[{"label":"Choose or define an analyzer: describe the schema in natural language (ContentAnalyzer(base_analyzer_id=..., field_schema=...))","detail":"Prebuilt analyzer ids (prebuilt-invoice, prebuilt-audio,...) cover common domains; a custom ContentAnalyzer names the fields you want in plain language via field_schema — no code beyond describing what to extract."},{"label":"Register it: client.begin_create_analyzer(...)","detail":"Provisions the analyzer definition as a long-running operation before it can be called against any content — a one-time setup step, not a per-document one."},{"label":"Submit content: client.begin_analyze(analyzer_id=..., inputs=[AnalysisInput(url=file_url)])","detail":"Each document/image/audio/video file gets its own begin_analyze call against the already-registered analyzer — the per-document step, unlike step 2."},{"label":"Poll the operation: poller.result()","detail":"begin_analyze returns a poller; call its.result() method to wait for the final analysis output — analysis is asynchronous, not a synchronous return (the exam calls it 'call the poller's ________ method')."},{"label":"Read the structured JSON fields from the result","detail":"The extracted fields — vendor name, invoice date, invoice total, and the like — land in the poller's result payload; this is where Content Understanding's own job ends."},{"label":"Hand off to Azure AI Search for indexing","detail":"Content Understanding only extracts — it never indexes or generates; Azure AI Search is the separate downstream service that indexes CU's structured output for retrieval/RAG."}],"citation":"AI-901 study guide Task 2.4 · Microsoft Learn: Azure AI Content Understanding documentation"}]}}</script>

<script>
"use strict";
// The manifest names the lab and lists its games; the deck bundle holds every
// data file those games reference, keyed by the path the manifest used. A deck
// referenced by two labs is authored once and inlined into both.
const LAB = JSON.parse(document.getElementById("lab-manifest").textContent);
let DECKS = JSON.parse(document.getElementById("lab-decks").textContent);
// Per-game SVG scenes (siegeBoard boards), keyed by the deck's scene.svgRef.
// The build inlines only the scenes this lab's games actually reference — the
// aigpMap conditional-inlining rule generalized — so every other lab carries
// an empty object here.
const SCENES = JSON.parse(document.getElementById("lab-scenes").textContent);
document.getElementById("lab-title").textContent = LAB.title;
// Release marking (beta.1 verdict point 5): manifest "release" ("beta", ...)
// stamps the masthead; empty/absent renders nothing (CSS hides :empty), so
// flipping a lab to stable is a manifest edit, not an engine edit.
document.getElementById("lab-release").textContent = LAB.release || "";
document.getElementById("lab-sub").textContent = LAB.subtitle || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

/* ------------------------------------------------------------------ i18n */
const I18N = JSON.parse(document.getElementById("i18n").textContent);
const LANG_KEY = "0pies.lang";
function pickLang(){
  try{ const s = localStorage.getItem(LANG_KEY); if(s && I18N.meta[s]) return s; }catch(e){}
  const nav = (navigator.language || "en").toLowerCase().split("-")[0];
  return I18N.meta[nav] ? nav : "en";
}
let lang = pickLang();
function t(key, vars){
  const d = I18N.ui[lang] || {};
  let s = d[key] != null ? d[key] : I18N.ui.en[key];
  if(s == null){ console.error("i18n: missing key " + key); return key; }
  if(vars) for(const k in vars) s = s.split("{"+k+"}").join(vars[k]);
  return s;
}
const tn = (key, n) => t(key + (n === 1 ? "_one" : "_other"), {n});
function tGame(gameId, field, fallback){
  const v = (I18N.labs[lang] || {})[LAB.id + "." + gameId + "." + field];
  return v != null ? v : fallback;
}
/* Card-content overlay: flat {itemId | "zone:<key>": {dottedPath: text}}.
   Applied by re-parsing the pristine inlined deck JSON and patching it in
   place — one seam that covers every adapter, corpora included, at zero
   per-render cost. English restore = re-parse without patching. */
let OVERLAY = {};
const overlayCache = {};
async function loadOverlay(code){
  OVERLAY = {};
  if(code === "en" || !(I18N.meta[code] || {}).cards) return;
  if(overlayCache[code]){ OVERLAY = overlayCache[code]; return; }
  try{
    const r = await fetch("i18n/" + encodeURIComponent(LAB.id) + "." + code + ".json");
    if(!r.ok) throw new Error("HTTP " + r.status);
    OVERLAY = overlayCache[code] = await r.json();
  }catch(e){ /* file:// or offline — English cards, translated UI */ }
}
function patchTree(node, anchored){
  if(Array.isArray(node)){ node.forEach(n => patchTree(n, anchored)); return; }
  if(!node || typeof node !== "object") return;
  const isId = node.id != null;
  const isZone = !anchored && !isId && node.key != null && node.def != null;
  const oKey = isId ? String(node.id) : (isZone ? "zone:" + node.key : null);
  const o = oKey != null ? OVERLAY[oKey] : null;
  if(o) for(const path in o){
    const parts = path.split(/[.\[\]]+/).filter(Boolean); let tgt = node;
    for(let i = 0; i < parts.length - 1 && tgt; i++) tgt = tgt[parts[i]];
    const leaf = parts[parts.length - 1];
    if(tgt && typeof tgt[leaf] === "string") tgt[leaf] = o[path];
  }
  const childAnchored = anchored || isId || isZone;
  for(const k in node) patchTree(node[k], childAnchored);
}
function relocalizeDecks(){
  DECKS = JSON.parse(document.getElementById("lab-decks").textContent);
  if(Object.keys(OVERLAY).length) patchTree(DECKS);
}
function applyStatic(){
  document.querySelectorAll("[data-i18n]").forEach(n => n.textContent = t(n.dataset.i18n));
  document.querySelectorAll("[data-i18n-attrs]").forEach(n =>
    n.dataset.i18nAttrs.split(";").forEach(pair => {
      const i = pair.indexOf(":");
      n.setAttribute(pair.slice(0, i), t(pair.slice(i + 1)));
    }));
}
async function setLang(code){
  if(!I18N.meta[code]) return;
  lang = code;
  try{ localStorage.setItem(LANG_KEY, code); }catch(e){}
  document.documentElement.lang = code;
  document.documentElement.dir = I18N.meta[code].dir === "rtl" ? "rtl" : "ltr";
  const sel = document.getElementById("lang-select");
  if(sel) sel.value = code;
  await loadOverlay(code);
  relocalizeDecks();
  applyStatic();
  render();
}
function mountLangSelect(){
  const sel = document.getElementById("lang-select");
  sel.innerHTML = Object.keys(I18N.meta).map(c => {
    const m = I18N.meta[c], label = m.flag ? `${m.flag} ${m.name}` : m.name;
    return `<option value="${esc(c)}" ${c === lang ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
  sel.onchange = () => setLang(sel.value);
}

/* ---------------------------------------------------------------- storage */
const KEY = LAB.storageKey;
let memoryOnly = false;
function loadProgress(){
  try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : {items:{},briefs:{}}; }
  catch(e){ memoryOnly = true; return {items:{},briefs:{}}; }
}
let progress = loadProgress();
function save(){
  if(memoryOnly) return;
  try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){ memoryOnly = true; }
}

/* -------------------------------------------------------------- scheduler */
const INTERVALS = [0,1,3,7,21];
const today = () => new Date().toISOString().slice(0,10);
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function record(id, correct){
  const it = progress.items[id] || {seen:0,wrong:0,confidentWrong:0,interval:0,due:today()};
  it.seen++;
  if(correct){
    const i = INTERVALS.indexOf(it.interval);
    it.interval = INTERVALS[Math.min(INTERVALS.length-1, (i<0?0:i)+1)];
  }else{
    it.wrong++; it.interval = 0;
  }
  it.due = addDays(it.interval); it.lastSeen = today();
  progress.items[id] = it; save();
}
function markConfidentlyWrong(id){
  const it = progress.items[id]; if(!it) return;
  it.confidentWrong = (it.confidentWrong||0)+1;
  it.interval = 0; it.due = today(); save();
}
function priority(id){
  const it = progress.items[id];
  // Unseen cards rank between wrong and just-learned: a card answered
  // correctly minutes ago must not crowd out concepts never dealt at all,
  // or a small deck re-deals the same near-complete set every round.
  if(!it) return -1.5;
  if(it.confidentWrong>0) return -3;
  if(it.wrong>0) return -2;
  if(it.interval<7) return -1;
  return it.interval;
}
const dueNow = id => { const it=progress.items[id]; return !it || it.due <= today(); };
function masteryOf(ids){
  if(!ids.length) return 0;
  return ids.filter(id => (progress.items[id]||{}).interval >= 7).length / ids.length;
}

/* ---------------------------------------------------------------- adapters */
// A game names either a runner + deck (generic content) or an adapter + data
// (an existing typed knowledge file, reached by the functions that already drove it).
// An adapter returns whatever its runner expects; nothing else in the engine
// knows which kind of game it is driving.
function deckOf(g){
  const d = DECKS[g.deck || g.data];
  if(!d) throw new Error(`game ${g.id}: no deck loaded for "${g.deck || g.data}"`);
  return d;
}
// Provenance resolves card-first, deck-second. A vendor-neutral deck states its
// source once instead of repeating the same citation on all twenty cards.
function withProvenance(items, d){
  return items.map(it => ({status:"stable", area:d.area, ...it,
                           citation: it.citation || d.source,
                           asOf: it.asOf || d.asOf}));
}

function serviceIcon(serviceName, providerKey){
  const p = ICON_PROVIDERS[providerKey];
  if (!p) return undefined;
  const file = p.map[serviceName] || p.fallback;
  return `assets/${p.dir}/${file}`;

const MAX_ZONES = 8;
function zonesFromAnswers(use){
  return [...new Set(use.map(i => i.answer))].map(a => ({key:a, name:a}));
}
// Decision decks add distractors drawn from the cards' own options. An
// answers-only board of six distinct answers is solvable by one-to-one
// elimination without reading a single card, which teaches nothing.
function zonesFromOptions(use, all, seed){
  const answers = [...new Set(use.map(i => i.answer))];
  const pool = [...new Set(all.flatMap(i => i.options || []))].filter(o => !answers.includes(o));
  const extra = shuffle(pool, seed + 11).slice(0, Math.max(0, MAX_ZONES - answers.length));
  return shuffle(answers.concat(extra), seed + 3).map(a => ({key:a, name:a}));
}
function genericBoard(g){
  const d = deckOf(g);
  const items = withProvenance(d.items, d);
  const stamped = g.areaOverride ? items.map(it => ({...it, area: g.areaOverride})) : items;
  const spec = {items: stamped, hint:d.hint || "", note:d.note, traps:d.traps};
  spec.icons = d.icons;
  if(d.zones) spec.zones = d.zones;
  else if(d.zoneMode === "options") spec.zonesFrom = use => zonesFromOptions(use, stamped, state.round);
  else spec.zonesFrom = zonesFromAnswers;
  // A "pick a service, see just its cards" mode: the deck names the field each
  // item is grouped by, and every group's identity (icon + name) comes from
  // the same lookup the tokens themselves already use.
  if(d.groupByService){
    const names = [...new Set(stamped.map(i => i.service))].sort();
    spec.serviceGroups = names.map(name => ({name, icon: serviceIcon(name, d.icons)}));
  }
  return spec;
}
function genericPairs(g){
  const d = deckOf(g);
  return d.pairs.map(p => {
    const base = {area:d.area, ...p, citation:p.citation || d.source};
    return g.areaOverride ? {...base, area: g.areaOverride} : base;
  });
}
function genericLadders(g){
  const d = deckOf(g);
  return d.ladders.map(l => {
    const base = {area:d.area, ...l, citation:l.citation || d.source};
    return g.areaOverride ? {...base, area: g.areaOverride} : base;
  });
}

/* ------------------------------------------------------------ board items */
// Each board game supplies items {id, label, sub?, answer} and zones
// {key, name, def?}. One board runner drives them all.
function tellsBoard(g){
  const DATA = deckOf(g);
  return {
    zonesFrom: items => {
      const s = new Set(); items.forEach(i => i.options.forEach(o => s.add(o)));
      return [...s].map(o => ({key:o, name:o}));
    },
    items: DATA.tells.map(t => ({
      id:t.id, area:t.area, status:t.status, label:`"${t.snippet}"`,
      answer:t.answer, options:t.options, why:t.tell, citation:t.citation
    })),
    hint:t("board.tellsHintDesktop")
  };
}
function roleBoard(g){
  const DATA = deckOf(g);
  const set = DATA.roleMatrix.sets.find(s => s.id===g.setId);
  if(set.items){
    return {
      zones:set.buckets.map(b => ({key:b, name:b})),
      items:set.items.map((it,i) => ({
        id:`${set.id}-${i}`, area:set.area, status:"stable", label:it.text,
        answer:it.answer, why:it.why, citation:set.citation
      })),
      hint:set.prompt, traps:set.traps
    };
  }
  return {
    zones:set.roles.map(r => ({key:r.name, name:r.name, def:r.definition})),
    items:set.obligations.map((o,i) => {
      const role = set.roles.find(r => r.id===o.role);
      return {id:`${set.id}-${i}`, area:set.area, status:"stable", label:o.text,
              answer:role.name, why:role.definition, citation:set.citation};
    }),
    hint:DATA.roleMatrix.prompt, traps:set.traps
  };
}
function timelineBoard(g){
  const t = deckOf(g).timeline;
  // Area + provenance are parameterized (beta.1): a milestone may carry its
  // own area/label/sub/why/citation/asOf, with timeline-level area/citation/
  // asOf as the deck-wide defaults. The AIGP knowledge file predates every
  // override field, so each fallback below reproduces its historical output
  // byte-for-byte; a generic deck (runner "timeline", e.g. Crypto Graveyard
  // on areas 3.6/3.7) authors the same board purely from data.
  return {
    zones:t.buckets.map(b => ({key:b, name:b})),
    items:t.milestones.map(m => ({
      id:m.id, area:m.area || t.area || "II.C", status:m.status, scope:m.scope,
      label:m.label || `${m.instrument} — ${m.milestone}`,
      sub:m.sub !== undefined ? m.sub : m.jurisdiction,
      answer:m.bucket,
      why:m.why || `${m.date}. ${m.note}`,
      citation:m.citation || t.citation || t.title,
      asOf:m.asOf || t.asOf
    })),
    hint:t.prompt, note:t.note
  };
}
function caseBoards(g){
  return deckOf(g).cases.map(c => ({
    id:c.id, brief:c.brief, currency:c.currency, citation:c.citation, areas:c.areas,
    steps:c.steps.map((s,i) => ({id:`${c.id}-s${i}`, ...s}))
  }));
}

// The registry is the seam between the manifest and the engine. build_lab.py
// parses these keys out of this file and fails the build if a manifest names a
// runner or adapter that is not here — otherwise a typo ships a lab with a
// silently missing game.
const ADAPTERS = {
  board:        genericBoard,
  pairs:        genericPairs,
  ladders:      genericLadders,
  // The gauntlet runner needs the whole deck, not one collection: the run is
  // sampled from `questions` in proportion to the deck-level `weights` map.
  gauntlet:     g => deckOf(g),
  aigpTells:    tellsBoard,
  aigpRoles:    roleBoard,
  aigpTimeline: timelineBoard,
  // The same board, driven by a generic deck's `timeline` collection instead
  // of a typed knowledge file (beta.1 area parameterization) — a board-shaped
  // runner, so it deals/renders through the board machinery below.
  timeline:     timelineBoard,
  aigpCases:    caseBoards,
  aigpMap:      g => deckOf(g).map,
  aigpRisk:     g => ({campaign: deckOf(g).campaign, map: deckOf(g).map}),
  // Generalized rr code path (beta.1): same payload shape, but the map is
  // optional — a map-less campaign renders the territory list without the
  // world-map board, and all theater resolves via campaign.copy/config.
  opsCampaign:  g => ({campaign: deckOf(g).campaign, map: deckOf(g).map || null}),
  // Build-then-defend (beta.1 debut, point-target grammar only): the payload
  // is the deck's whole `siege` object; the board SVG itself is looked up in
  // SCENES by scene.svgRef at render time.
  siegeBoard:   g => deckOf(g).siege,
  aigpBriefs:   g => deckOf(g).briefs,
  aigpPairs:    g => deckOf(g).pairs.filter(p => g.setId ? p.set===g.setId : !p.set),
  aigpLadders:  g => deckOf(g).ladders,
  grid3x3:      g => deckOf(g).amendmentsGrid
};

const GAMES = LAB.games.map(g => {
  const runner = g.runner || "board";
  const fn = ADAPTERS[g.adapter || runner];
  if(!fn) throw new Error(`game ${g.id}: unknown adapter "${g.adapter || runner}"`);
  // Payloads are built on demand, not cached: a board spec is rebuilt per deal
  // so that option-mode zones can vary with the round.
  const payload = () => fn(g);
  // "timeline" is board-shaped end to end: it deals via dealBoard and renders
  // via renderBoard, exactly like runner "board" with a different collection.
  const boardish = runner==="board" || runner==="timeline";
  return {...g, runner, payload, board: boardish ? payload : null};
});

// Deep links: the address bar mirrors the open game as #g/<id>, so any game
// can be linked to directly. The id is only ever *compared* against GAMES —
// never rendered — so a hostile hash is inert. replaceState rather than
// pushState: tab and back button behave as before, the hash is just a label.
function syncHash(){
  const want = state.game ? "#g/" + encodeURIComponent(state.game.id) : "";
  const have = location.hash.startsWith("#g/") ? location.hash : "";
  if(want === have) return;
  // try/catch: some browsers refuse replaceState on file:// — the label is
  // cosmetic, so losing it must never take the render down with it.
  try{ history.replaceState(null, "", want || location.pathname + location.search); }catch{}
}
function gameFromHash(){
  const m = /^#g\/(.+)$/.exec(location.hash);
  if(!m) return null;
  let id; try{ id = decodeURIComponent(m[1]); }catch{ return null; }
  return GAMES.find(g => g.id === id) || null;
}
function openFromHash(){
  const g = gameFromHash();
  if(!g) return false;
  // Land on the game's own tab, else the board deals from the wrong pool.
  state.domain = g.tab || TABS[0].id;
  state.area = "all";
  start(g.id);
  renderDomainTabs();
  return true;
}
window.addEventListener("hashchange", () => {

function shareUrl(){

// What a game is worth on the home screen, per runner. Games with nothing left
// under the current filter return null and are hidden rather than offered and
// then found empty.
function homeMeta(g){
  const p = g.payload();
  switch(g.runner){
    case "timeline":   // board-shaped payload ({items}), same worth
    case "board": {
      const ids = p.items.filter(areaOK).map(i=>i.id);
      return ids.length ? {label:`${ids.length} ${t("count.cards")}`, ids} : null;
    }
    case "pairs": {
      const ps = p.filter(areaOK);
      return ps.length ? {label:`${ps.length} ${t("count.pairs")}`, ids:ps.map(x=>x.id)} : null;
    }
    case "gauntlet": {
      const qs = (p.questions || []).filter(areaOK);
      return qs.length ? {label:`${qs.length} ${t("count.questions")}`, ids:qs.map(q=>q.id)} : null;
    }
    case "ladders": {
      const ls = p.filter(l => state.area==="all" || l.area===state.area);
      return ls.length ? {label:`${ls.length} ${t("count.ladders")}`} : null;
    }
    case "desk": {
      const cs = p.filter(c => state.area==="all" || c.areas.includes(state.area));
      return cs.length ? {label:`${cs.length} ${t("count.case_files")}`} : null;
    }
    case "briefs": {
      const bs = p.filter(b => state.area==="all" || b.area===state.area || b.capstone);
      return bs.length ? {label:`${bs.length} ${t("count.briefs")}`} : null;
    }
    case "map": return {label:`${p.jurisdictions.length} ${t("count.jurisdictions")}`};
    case "risk": return {label:`${p.map.jurisdictions.length} ${t("count.jurisdictions")} · ${p.campaign.config.turns}-${t("count.campaign")}`};
    case "opsCampaign": {
      // Area-filterable like the boards: the campaign's cards carry area tags,
      // so the chips scope the count and the mastery meter tracks the pool.
      const cs = p.campaign.cards.filter(areaOK);
      if(!cs.length) return null;
      const cp = (p.campaign.copy || {}).home_label;
      const label = cp
        ? cp.split("{n}").join(cs.length).split("{turns}").join(p.campaign.config.turns)
        : `${cs.length} ${t("count.cards")} · ${p.campaign.config.turns}-${t("count.campaign")}`;
      return {label, ids:cs.map(c => c.id)};
    }
    case "siegeBoard": {
      // The scored atoms are the wave events (freebie demo events are never
      // recorded); area chips scope the count and the mastery meter.
      const evs = p.waves.flatMap(w => w.events).filter(areaOK);
      if(!evs.length) return null;
      const cp = (p.copy || {}).home_label;
      const label = cp ? cp.split("{n}").join(evs.length)
                       : `${evs.length} ${t("count.cards")}`;
      return {label, ids:evs.map(e => e.id)};
    }
    case "grid3x3": {
      const domains = g.payload();
      const ids = domains.flatMap(d => [`${d.id}-original`, `${d.id}-updated`]);
      return {label:t("count.grid3x3"), ids};
    }
  }
  return null;
}

/* ------------------------------------------------------------ board runner */
function dealBoard(){
  const spec = state.game.board();
  // A "pick a service" board narrows the pool to one group before anything
  // else runs, so priority/due scheduling and the round-robin deal below only
  // ever see that one service's cards.
  if(spec.serviceGroups){
    if(!state.serviceFilter || !spec.serviceGroups.some(s => s.name===state.serviceFilter)){
      state.serviceFilter = spec.serviceGroups[0].name;
    }
  }
  const scoped = spec.serviceGroups ? spec.items.filter(i => i.service===state.serviceFilter) : spec.items;
  // Seeded pre-shuffle + stable sort: equal-priority cards land in an order
  // that changes every round instead of the deck's file order, so a fully-played
  // small deck still varies from deal to deal.
  const pool = shuffle(scoped.filter(areaOK), state.round*31 + 11)
                 .sort((a,b)=>priority(a.id)-priority(b.id));
  const due = pool.filter(i=>dueNow(i.id));
  const source = due.length>=ROUND ? due : pool;

  // Stratify by answer. Dealt in priority order alone, a board fills with the
  // first zone's items and every card has the same answer — which is winnable
  // by pattern and teaches nothing. Round-robin across answer groups instead,
  // keeping priority order inside each group.
  const groups = new Map();
  source.forEach(i => {
    if(!groups.has(i.answer)) groups.set(i.answer, []);
    groups.get(i.answer).push(i);
  });
  const keys = shuffle([...groups.keys()], state.round + 7);
  const use = [];
  for(let guard=0; use.length<ROUND && guard<ROUND*keys.length+1; guard++){
    let took = false;
    for(const k of keys){
      const g = groups.get(k);
      if(g.length && use.length<ROUND){ use.push(g.shift()); took = true; }
    }
    if(!took) break;
  }
  state.board = {
    spec,
    zones: spec.zones || spec.zonesFrom(use),
    items: shuffle(use, state.round + use.length)
  };
  state.placed={}; state.sel=null; state.checked=false; state.scored=false;
}
function shuffle(arr, seed){
  let h = 2166136261 ^ seed;
  return arr.map((v,i)=>{ h = (h*16777619) ^ (i+1); return [v,(h>>>0)]; })
            .sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
}

    if(wrong.length){
      body += aiLinks(deepenPrompt(state.game.title,
        wrong.map(i => ({label:i.label, said:state.placed[i.id], answer:i.answer, why:i.why})),
        cites.join("; ")), esc(t("board.deepenLink")));
    }
    if(wrong.length && !state.sweep){
      body += `<div class="sweep"><p><strong>${esc(t("board.sweepHint", {n: wrong.length}))}</strong></p><div class="row" style="margin:0">` +
        wrong.map(i=>`<button class="btn ghost" data-cw="${i.id}">${esc(i.label.slice(0,44))}${i.label.length>44?"…":""}</button>`).join("")
        + `<button class="btn" data-cw="none">${esc(t("board.sweepNone"))}</button></div></div>`;
    }
    body += `<div class="row"><button class="btn" id="next">${esc(t("board.nextButton"))}</button>
      <button class="btn ghost" id="retry">${esc(t("board.retryButton"))}</button></div></div>`;
  }

  const boardSheet = () => {
    const b = state.board;
    return {
      targets: () => b.zones.map(z => ({key: z.key, label: z.name, sub: z.def || "",
        icon: zoneIcon ? zoneIcon(z.name) : null})),
      labelOf: id => b.items.find(i => i.id === id).label,
      nextUnplaced: () => { const n = b.items.find(i => !state.placed[i.id]); return n ? n.id : null; },
      place: (id, key) => { state.placed[id] = key; state.sel = null; },
    };
  };
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack(); wireDnd(boardSheet()); wireAiLinks();

  const svcSel = document.getElementById("service-select");
  if(svcSel) svcSel.onchange = () => {
    state.serviceFilter = svcSel.value; state.round = 0; dealBoard(); render();
  };

  const chk = document.getElementById("check");
  if(chk) chk.onclick = () => {
    state.checked = true;
    // Only the first attempt at a deal feeds the scheduler. Replaying the same
    // board would otherwise mark everything correct on the second go and quietly
    // inflate mastery.
    if(!state.scored){
      state.board.items.forEach(i => record(i.id, state.placed[i.id]===i.answer));
      state.scored = true;
    }
    render();
  };
  const clr = document.getElementById("clear");
  if(clr) clr.onclick = () => { state.placed = {}; state.sel = null; render(); };
  const rty = document.getElementById("retry");
  if(rty) rty.onclick = () => {
    state.placed = {}; state.sel = null; state.checked = false; state.sweep = null; render();
  };
  main.querySelectorAll("[data-cw]").forEach(x => x.onclick = () => {
    if(x.dataset.cw!=="none") markConfidentlyWrong(x.dataset.cw);
    x.disabled = true; x.classList.remove("ghost");
    if(x.dataset.cw==="none"){ state.sweep=true; render(); }
  });
  const nx = document.getElementById("next");
  if(nx) nx.onclick = () => { state.round++; state.sweep=null; dealBoard(); render(); };
}
function wireDnd(sheet){
  let dragId = null;
  main.querySelectorAll("[data-tok]").forEach(t => {
    t.onclick = () => {
      if(state.checked) return;
      const id = t.dataset.tok;
      // Tapping a placed token returns it to the bank (both input modes).
      if(state.placed[id]){ delete state.placed[id]; state.sel = null; render(); return; }
      if(sheet && isCoarse()){ sheetFlow(sheet, id); return; }
      state.sel = state.sel === id ? null : id;
      render();
    };
    t.ondragstart = e => { dragId = t.dataset.tok; e.dataTransfer.effectAllowed="move"; };
  });
  main.querySelectorAll("[data-zone]").forEach(z => {
    z.ondragover = e => { e.preventDefault(); z.classList.add("over"); };
    z.ondragleave = () => z.classList.remove("over");
    z.ondrop = e => {
      e.preventDefault(); z.classList.remove("over");
      if(dragId && !state.checked){ state.placed[dragId]=z.dataset.zone; dragId=null; state.sel=null; render(); }
    };
    z.onclick = () => {
      if(state.sel && !state.checked){ state.placed[state.sel]=z.dataset.zone; state.sel=null; render(); }
    };
  });
}

/* --------------------------------------------------------------- grid3x3 */
// 9 domains, 3 rounds of 3. Column 1 (domain label) is fixed; columns 2/3
// (Original/Updated) are drop targets fed from one shuffled pool per round
// mixing both sides of all 3 domains, so the player must place both which
// domain AND which side a snippet belongs to.
function dealGrid3x3(){
  const domains = state.game.payload();
  if(!state.gridGroups){
    const ids = shuffle(domains.map(d=>d.id), Math.floor(Math.random()*1e9));
    state.gridGroups = [ids.slice(0,3), ids.slice(3,6), ids.slice(6,9)];
  }
  const roundIds = state.gridGroups[state.gridRound];
  const roundDomains = roundIds.map(id => domains.find(d=>d.id===id));
  const items = [];
  roundDomains.forEach(d => {
    items.push({id:`${d.id}-original`, domainId:d.id, domain:d.domain, side:"original",
                text:d.original.text, citation:d.original.citation});
    items.push({id:`${d.id}-updated`, domainId:d.id, domain:d.domain, side:"updated",
                text:d.updated.text, citation:d.updated.citation});
  });
  state.gridItems = shuffle(items, state.gridRound + items.length);
  state.gridPlaced = {}; state.gridSel = null; state.gridChecked = false; state.gridScored = false;
}
function renderGrid3x3(){
  const domains = state.game.payload();
  const roundDomains = state.gridGroups[state.gridRound].map(id => domains.find(d=>d.id===id));
  const bank = state.gridItems.filter(i => !state.gridPlaced[i.id]);
  const allPlaced = bank.length===0;

  const tok = (i, cls="") => `<button class="tok ${cls}" draggable="true" data-tok="${i.id}">${esc(i.text)}</button>`;
  const cellItem = key => {
    const id = Object.keys(state.gridPlaced).find(k => state.gridPlaced[k]===key);
    return id ? state.gridItems.find(i=>i.id===id) : null;
  };
  const cell = (d, side) => {
    const key = `${d.id}:${side}`;
    const item = cellItem(key);
    const cls = state.gridChecked && item ? (item.domainId===d.id && item.side===side ? "correct" : "wrong") : "";
    return `<div class="zone grid-cell" data-cell="${key}"><div class="drop">${
      item ? tok(item, cls) : `<span class="cell-empty">${esc(t(side==="original"?"grid.cellEmptyOriginal":"grid.cellEmptyUpdated"))}</span>`
    }</div></div>`;
  };
  const rows = roundDomains.map(d => `<div class="grid-row">
      <div class="grid-domain">${esc(d.domain)}</div>
      ${cell(d,"original")}
      ${cell(d,"updated")}
    </div>`).join("");

  let body = `<p class="hint">${esc(isCoarse()
      ? t("grid.hintMobile")
      : t("grid.hintDesktop"))}</p>
    <div class="grid-head"><span></span><span>${esc(t("grid.originalHeader"))}</span><span>${esc(t("grid.updatedHeader"))}</span></div>
    <div class="grid3x3">${rows}</div>
    <div class="bank">${bank.map(i => tok(i, state.gridSel===i.id?"sel":"")).join("")}</div>`;

  if(!state.gridChecked){
    body += `<div class="row"><button class="btn" id="check" ${allPlaced?"":"disabled"}>
      ${allPlaced?esc(t("grid.checkButton")):esc(t("grid.placeAllButton"))}</button>
      <button class="btn ghost" id="clear" ${Object.keys(state.gridPlaced).length?"":"disabled"}>${esc(t("grid.clearButton"))}</button>
      <span class="badge">${t("grid.badgeRound", {n: state.gridRound+1})}</span></div>`;
  }else{
    const right = state.gridItems.filter(i => state.gridPlaced[i.id]===`${i.domainId}:${i.side}`);
    body += `<div class="reveal">
      <p class="score ${right.length===6?"ok":right.length>=4?"mid":"no"}">${t("grid.scoreLine", {right: right.length, total: 6})}</p>
      <ul>` + state.gridItems.map(i => {
        const ok = state.gridPlaced[i.id]===`${i.domainId}:${i.side}`;
        return `<li><b class="${ok?"hit":"miss"}">${ok?"✓":"✗"} ${esc(i.domain)} — ${i.side==="original"?t("grid.originalLabel"):t("grid.updatedLabel")}</b>
          <span>${esc(i.text)} <em>${esc(i.citation)}</em></span></li>`;
      }).join("") + `</ul></div>`;
    const isLast = state.gridRound===2;
    body += `<div class="row"><button class="btn" id="next">${isLast?esc(t("grid.finishButton")):esc(t("grid.nextButton"))}</button>
      <button class="btn ghost" id="retry">${esc(t("grid.retryButton"))}</button></div>`;
  }

  const gridSheet = () => ({
    targets: () => {
      const targets = [];
      roundDomains.forEach(d => ["original","updated"].forEach(side => {
        const key = `${d.id}:${side}`;
        const occ = cellItem(key);
        targets.push({key, label: `${d.domain} — ${side === "original" ? t("grid.originalLabel") : t("grid.updatedLabel")}`,
                sub: occ ? t("grid.sheetHolds", {text: occ.text.slice(0, 60)}) : "", icon: null});
      }));
      return targets;
    },
    labelOf: id => {
      const i = state.gridItems.find(x => x.id === id);
      return i.text.length > 80 ? i.text.slice(0, 80) + "…" : i.text;
    },
    nextUnplaced: () => {
      const n = state.gridItems.find(i => state.gridPlaced[i.id] === undefined);
      return n ? n.id : null;
    },
    place: (id, key) => { placeInCell(id, key); state.gridSel = null; },
  });
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack(); wireGridDnd(gridSheet());

  const chk = document.getElementById("check");
  if(chk) chk.onclick = () => {
    state.gridChecked = true;
    if(!state.gridScored){
      state.gridItems.forEach(i => record(i.id, state.gridPlaced[i.id]===`${i.domainId}:${i.side}`));
      state.gridScored = true;
    }
    render();
  };
  const clr = document.getElementById("clear");
  if(clr) clr.onclick = () => { state.gridPlaced = {}; state.gridSel = null; render(); };
  const rty = document.getElementById("retry");
  if(rty) rty.onclick = () => { dealGrid3x3(); render(); };
  const nx = document.getElementById("next");
  if(nx) nx.onclick = () => {
    if(state.gridRound < 2){ state.gridRound++; dealGrid3x3(); render(); }
    else { state.game = null; render(); }
  };
}
function wireGridDnd(sheet){
  let dragId = null;
  main.querySelectorAll("[data-tok]").forEach(t => {
    t.onclick = () => {
      if(state.gridChecked) return;
      const id = t.dataset.tok;
      if(state.gridSel && state.gridSel!==id && state.gridPlaced[id]!==undefined) return;
      if(state.gridPlaced[id] !== undefined){ delete state.gridPlaced[id]; state.gridSel = null; render(); return; }
      if(sheet && isCoarse()){ sheetFlow(sheet, id); return; }
      state.gridSel = state.gridSel===id ? null : id;
      render();
    };
    t.ondragstart = e => { dragId = t.dataset.tok; e.dataTransfer.effectAllowed = "move"; };
  });
  main.querySelectorAll("[data-cell]").forEach(z => {
    z.ondragover = e => { e.preventDefault(); z.classList.add("over"); };
    z.ondragleave = () => z.classList.remove("over");
    z.ondrop = e => {
      e.preventDefault(); z.classList.remove("over");
      if(dragId && !state.gridChecked){ placeInCell(dragId, z.dataset.cell); dragId=null; state.gridSel=null; render(); }
    };
    z.onclick = () => {
      if(state.gridSel && !state.gridChecked){ placeInCell(state.gridSel, z.dataset.cell); state.gridSel=null; render(); }
    };
  });
}
function placeInCell(itemId, cellKey){
  // A cell holds at most one item; dropping a new one onto an occupied cell
  // bumps the old occupant back to the bank rather than stacking silently.
  for(const k of Object.keys(state.gridPlaced)) if(state.gridPlaced[k]===cellKey) delete state.gridPlaced[k];
  state.gridPlaced[itemId] = cellKey;
}
