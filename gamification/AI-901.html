/* S6 — debrief: score per ADD §1.6 (market + capital − open notices − 2 ×
   sanctions; bust is always F), grade thresholds from config (sim-tuned per
   SPEC §2.5), review list, aiLinks, replay CTA, print strategy report. */
function rrScore(camp){
  let market = 0;
  const parts = [];
  Object.keys(camp.held).forEach(id => {
    const v = rrTerr(id);
    if(!v || camp.held[id].suspended) return;
    market += v.market;
    parts.push(`${v.short} +${v.market}`);
  });
  const open = camp.notices.length;
  const score = market + camp.capital - open - 2 * camp.sanctions;
  const bust = camp.capital <= 0;
  return {market, parts, open, sanctions:camp.sanctions, capital:camp.capital,
          score, bust, grade:bust ? "F" : rrGrade(score)};
}
// Hardened (playtest wave 1): survives fallback card objects with no fact/id
// (card-id drift across redeploys) instead of throwing mid-debrief render.
function rrFactText(card){ return String(card.fact || card.id || card.q || "?").replace(/-/g, " "); }
function rrTerrName(terr){
  if(!terr || terr === "any") return rrT("cross_cutting");
  return (rrJur(terr) || {name:terr}).name;
}
// Print-only one-page strategy report (SPEC §2.7). Pure markup derived from
// the campaign in memory — nothing persisted, no new localStorage keys.
function rrPrintReport(camp, s){
  const C = rrData().campaign, cfg = C.config;
  const role = (C.roles.find(r => r.id===camp.role) || {name:camp.role}).name;
  const hat = ((C.hats || []).find(h => h.id===camp.hat) || {name:camp.hat || ""}).name;
  const arith = rrT("print_score_arith", {market:s.market,
    parts:s.parts.length ? ` (${s.parts.join(" · ")})` : "",
    capitalDelta:s.capital < 0 ? `− ${-s.capital}` : `+ ${s.capital}`,
    open:s.open, noticePlural:s.open===1 ? "" : "s",
    sanctions:s.sanctions, sanctionPlural:s.sanctions===1 ? "" : "s", score:s.score,
    gradeFrag:s.bust ? rrT("bust_message") : rrT("grade_fragment", {grade:s.grade})});
  const tierOrder = cfg.tierOrder
    || ["comprehensive","sectoral","proposed","voluntary","none","treaty"];
  const terrRows = tierOrder.map(tier =>
    rrJurisAll().filter(j => j.coverage===tier).map(j => {
      const v = rrTerr(j.id);
      const status = v.suspended ? rrT("print_suspended_status") : v.held
        ? rrT("print_held_status", {turn:camp.held[j.id].turnClaimed}) : rrT("print_open_status");
      const outcome = v.held && !v.suspended ? rrT("print_outcome_market", {market:v.market}) : "—";
      const notice = v.noticeLevel ? " · " + rrT("print_notice_open", {level:v.noticeLevel}) : "";
      return `<tr><td>${esc(tier)}</td><td>${rrCovLetter(tier)}</td>
        <td>${esc(v.name)}</td><td>${esc(status + notice)}</td><td>${esc(outcome)}</td></tr>`;
    }).join("")).join("");
  const evRows = (camp.eventsFaced || []).map(f => {
    const e = C.events.find(x => x.id===f.id) || {title:f.id};
    return `<tr><td>${esc(e.title)}</td><td>${esc(f.res)}</td></tr>`;
  }).join("") || `<tr><td colspan="2">${rrT("print_no_events")}</td></tr>`;
  const qRows = (camp.answers || []).map((an, i) => {
    const card = rrCard(an.id) || {id:an.id};
    return `<tr><td>${i + 1}</td><td>${an.ok ? "✓" : "✗"}</td>
      <td>${esc(rrTerrName(card.territory))}</td>
      <td>${esc(rrFactText(card))}</td>
      <td>${esc(card.citation || "")}</td></tr>`;
  }).join("") || `<tr><td colspan="5">${rrT("print_no_questions")}</td></tr>`;
  const missedBy = {};
  (camp.answers || []).filter(an => !an.ok).forEach(an => {
    const card = rrCard(an.id) || {id:an.id};
    const k = rrTerrName(card.territory);
    (missedBy[k] = missedBy[k] || []).push(rrFactText(card));
  });
  const study = Object.keys(missedBy).length
    ? Object.keys(missedBy).sort().map(k =>
        `<li><b>${esc(k)}:</b> ${esc([...new Set(missedBy[k])].join(" · "))}</li>`).join("")
    : `<li>${rrT("print_no_missed")}</li>`;
  return `<div class="rr-print">
    <h2>${rrT("print_title")}</h2>
    <p><b>${rrT("print_role_label")}</b> ${esc(role)} · <b>${rrT("print_hat_label")}</b> ${esc(hat)} · <b>${rrT("print_operations_label")}</b>
      ${esc(rrOpNames(camp.operations))} · <b>${rrT("print_date_label")}</b>
      ${new Date().toISOString().slice(0, 10)} ·
      <b>${rrT("print_grade_label", {grade:s.grade})}</b> ${rrT("print_turn_of",
      {turn:Math.min(camp.turn, cfg.turns), total:cfg.turns})}</p>
    <p><b>${rrT("print_score_label")}</b> ${esc(arith)}</p>
    <h3>${rrT("print_territories_head")}</h3>
    <table><tr><th>${rrT("print_th_tier")}</th><th></th><th>${rrT("print_th_territory")}</th><th>${rrT("print_th_status")}</th><th>${rrT("print_th_outcome")}</th></tr>
      ${terrRows}</table>
    <h3>${rrT("print_events_head")}</h3>
    <table><tr><th>${rrT("print_th_event")}</th><th>${rrT("print_th_resolution")}</th></tr>${evRows}</table>
    <h3>${rrT("print_questions_head")}</h3>
    <table><tr><th>#</th><th></th><th>${rrT("print_th_jurisdiction")}</th><th>${rrT("print_th_tested_fact")}</th>
      <th>${rrT("print_th_citation")}</th></tr>${qRows}</table>
    <h3>${rrT("print_study_head")}</h3>
    <ul>${study}</ul>
  </div>`;
}
function rrRenderDebrief(){
  const camp = rrState();
  if(!camp){ state.rr.screen = "role"; return rrRenderRole(); }
  const cfg = rrCfg();
  if(camp.turn <= cfg.turns && camp.capital > 0 && !state.rr.forceDebrief){
    state.rr.screen = "board"; return rrRenderBoard();
  }
  const C = rrData().campaign;
  const s = rrScore(camp);
  const answers = camp.answers || [];
  const right = answers.filter(a => a.ok).length;
  const otherRole = C.roles.find(r => r.id !== camp.role) || C.roles[0];
  const otherHat = (C.hats || []).find(h => h.id !== camp.hat)
    || (C.hats || [])[0] || {id:undefined, name:""};
  const arith = rrT("debrief_score_arith", {market:s.market,
    parts:s.parts.length ? `(${s.parts.join(" · ")}) ` : "",
    capitalDelta:s.capital < 0 ? `− ${-s.capital}` : `+ ${s.capital}`,
    open:s.open, noticePlural:s.open===1 ? "" : "s",
    sanctions:s.sanctions, sanctionPlural:s.sanctions===1 ? "" : "s", score:s.score});
  const review = answers.map(an => {
    const card = rrCard(an.id) || {id:an.id, q:an.id, citation:""};
    return `<div class="rr-q${an.ok ? "" : " miss"}">${an.ok ? "✓" : "✗"}
      <b>${esc(rrTerrName(card.territory))}</b> — ${esc(rrFactText(card))}
      <em>${esc(card.q || "")}</em>
      <em>${esc(card.citation || "")} · turn ${an.t}</em></div>`;
  }).join("") || `<p class="hint">${rrT("debrief_no_questions")}</p>`;
  const missed = answers.filter(an => !an.ok).map(an => {
    const card = rrCard(an.id) || {id:an.id};
    return {label:card.q || an.id, said:an.pick, answer:card.answer, why:card.why};
  });
  const allItems = answers.map(an => {
    const card = rrCard(an.id) || {id:an.id};
    return {label:card.q || an.id, answer:card.answer, why:card.why};
  });
  let links = "";
  if(allItems.length)
    links += aiLinks(explainPrompt(rrT("print_campaign_debrief"), allItems,
      `${cfg.turns}-turn campaign as ${camp.role} + ${camp.hat}, grade ${s.grade}`),
      rrT("debrief_dial_campaign"));
  if(missed.length)
    links += aiLinks(deepenPrompt(rrT("print_campaign_debrief"), missed,
      `campaign as ${camp.role} + ${camp.hat}`), rrT("deepen_link"));
  const stats = `<div class="row" style="margin:0 0 4px">
    <span class="badge">${rrT("badge_turn", {turn: Math.min(camp.turn, cfg.turns), totalTurns: cfg.turns})}</span>
    <span class="badge">${rrT("badge_questions", {correct: right, total: answers.length})}</span>
    <span class="badge">${rrT("badge_held", {held: Object.keys(camp.held).length})}</span>
    <span class="badge">${rrT("badge_events", {n: (camp.eventsFaced || []).length})}</span>
    <span class="badge">${rrT("badge_sanctions", {n: s.sanctions})}</span></div>`;
  const body = `<p class="score ${s.bust ? "no" : (s.grade==="A+" || s.grade==="A")
      ? "ok" : s.grade==="F" ? "no" : "mid"}">${rrT("grade_display", {grade: s.grade})}${s.bust
      ? rrT("grade_bust_suffix") : ""}</p>
    ${stats}
    <div class="rr-arith"><b>${rrT("score_arithmetic_label")}</b> ${esc(arith)}
      ${s.bust ? " — " + rrT("bust_overrides") : ""}</div>
    <div class="rr-group">${rrT("review_heading")}</div>
    <div class="rr-review">${review}</div>
    ${links}
    <div class="row">
      <button class="btn" id="rr-replay">${rrT("replay_button", {role: otherRole.name, hat: otherHat.name})}</button>
      <button class="btn ghost" id="rr-print">${rrT("print_button")}</button>
      <button class="btn ghost" id="rr-new">${rrT("new_campaign_button")}</button></div>`;
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`
    + rrPrintReport(camp, s);
  wireBack(); wireAiLinks();
  const endCampaign = pick => {
    rrClear();  // seed slot is consumed in rrStart, not here
    state.rr = {gameId:state.game.id, screen:"role", sel:null, action:null,
                confirmAbandon:false, pick};
    render();
  };
  document.getElementById("rr-replay").onclick = () =>
    endCampaign({role:otherRole.id, hat:otherHat.id, ops:[]});
  document.getElementById("rr-new").onclick = () =>
    endCampaign(rrDefaultPick());
  document.getElementById("rr-print").onclick = () => window.print();
}

/* ----------------------------------------------- siegeBoard runner (sg) */
// Build-then-defend, point-target grammar only (spec §3.2 wave 1).
// Phase 1 (decide): spend a budget dragging typed control chips — each with a
// cost, TRUE properties, and a visible definition — onto point targets of an
// inlined SVG scene; coarse pointers place through the shared bottom sheet.
// Phase 2 (resolve): "Run the attack" — the wave's event deck resolves each
// attacker against the properties of whatever guards its target; every breach
// ANIMATES along its authored breachPath with mechanism-naming copy, and the
// leak list names what would have stopped it. A deck-scripted freebie wave
// (one interception + one breach) plays before anything is scored.
// record(event.id, stopped) fires once per wave event when the attack is run;
// nothing about a run is persisted — like the gauntlet, a reload starts fresh.
let sgAnimSeq = 0;
const sgSleep = ms => new Promise(res => setTimeout(res, ms));
// Deck-authored copy wins over these built-in English defaults (rrT pattern,
// no new i18n keys — the CISSP lab ships English-first, untranslated:true).
const SG_COPY = {
  demo_hint: "Freebie wave — watch one attack get intercepted and one get through before anything is scored. The pre-placed controls below are the demo loadout.",
  demo_run: "Run the demo wave",
  demo_end: "Start the shift",
  build_hint_fine: "Drag a control onto a target to deploy it, or click a control then click a target. Click a guarded target to take its last control back.",
  build_hint_coarse: "Tap a control, then choose where to deploy it. Tap a guarded target to take its last control back.",
  hud_budget: "Budget {left}/{budget}",
  hud_spent: "Spent {spent}",
  hud_par: "Par {par}",
  hud_wave: "Wave {n}/{total}",
  run_button: "Run the attack",
  run_locked: "Deploy at least one control",
  clear_button: "Recall all",
  over_budget: "Not enough budget left for that control.",
  resolve_hint: "The wave is coming in…",
  wave_clear: "Wave survived — every attack intercepted.",
  wave_leaks: "{n} attack(s) got through.",
  stopped_by: "Stopped by {chip}.",
  unguarded: "{target} had nothing deployed on it.",
  wrong_guard: "{chips} could not answer it — wrong properties for this attack class.",
  leak_head: "Would have stopped it: {chips}.",
  review_heading: "Attack review",
  next_wave: "Next wave",
  to_debrief: "End-of-run debrief",
  new_run: "New run",
  medal_gold: "Held under par — {spent} spent, par {par}.",
  medal_silver: "Held the perimeter — but over par: {spent} spent, par {par}.",
  medal_none: "{n} breach(es) got through.",
  citation_line: "{citation} · as of {asOf}",
  said_nothing: "nothing deployed on the struck target",
  said_chips: "guarded by {chips}",
  explain_link: "Dial in what held",
  deepen_link: "Drill what got through",
  prompt_context: "tower-defense build: {spent} of {budget} budget spent, {breaches} breach(es)",
  status_open: "open seat",
  status_held: "guarded by {chips}"
};
function sgData(){ return state.game.payload(); }          // the deck's `siege`
function sgT(key, vars){
  const cp = sgData().copy || {};
  let s = cp[key] != null ? cp[key] : SG_COPY[key];
  if(s == null) return key;
  if(vars) for(const k in vars) s = s.split("{"+k+"}").join(vars[k]);
  return s;
}
function sgChip(id){ return sgData().chips.find(c => c.id===id); }
function sgTarget(id){ return sgData().scene.targets.find(x => x.id===id); }
function sgFresh(demoDone){
  return {gameId:state.game.id,
          phase:(sgData().freebie && !demoDone) ? "demo" : "build",
          demo:false, demoDone:!!demoDone, wave:0, placed:{}, sel:null,
          res:null, hist:[], scored:{}, played:false};
}
function sgSpent(placed){
  return Object.keys(placed).reduce((s, id) => s + ((sgChip(id) || {}).cost || 0), 0);
}
// The scripted freebie placement as a placed-map, same shape as S.placed.
function sgDemoPlaced(){
  const out = {};
  ((sgData().freebie || {}).place || []).forEach(p => { out[p.chip] = p.target; });
  return out;
}
function sgChipsOn(placed, targetId){
  return Object.keys(placed).filter(id => placed[id]===targetId)
    .map(sgChip).filter(Boolean);
}
// The resolution rule — an attacker is stopped iff some chip on its target
// carries one of the properties the event's attack class requires. The chip's
// REAL properties, not its name, decide: that mismatch is the lesson.
function sgResolveEvents(events, placed){
  return events.map(ev => {
    const guards = sgChipsOn(placed, ev.target);
    const by = guards.find(ch => (ch.properties || [])
      .some(p => (ev.requires || []).includes(p))) || null;
    return {ev, stopped:!!by, by, guards};
  });
}
// Every chip in the shop that could have answered this attack class.
function sgLeakChips(ev){
  return sgData().chips.filter(ch => (ch.properties || [])
    .some(p => (ev.requires || []).includes(p)));
}

function sgSceneHtml(S, placed, interactive){
  const siege = sgData(), sc = siege.scene;
  // Final per-target status once a run has resolved (or replayed statically).
  const status = {};
  const resolved = S.phase === "debrief" ? S.hist
    : (S.res && (S.phase === "waveEnd" || (S.phase === "resolve" && S.played)))
      ? S.res : null;
  if(resolved) resolved.forEach(r => {
    if(r.stopped) status[r.ev.target] = "sg-safe";
    else (r.ev.breachPath || []).forEach(id => { status[id] = "sg-hit"; });
  });
  const targets = sc.targets.map(tg => {
    const held = sgChipsOn(placed, tg.id);
    const chips = held.map(ch => esc(ch.short || ch.label)).join(" · ");
    const st = held.length ? sgT("status_held", {chips:held.map(ch => ch.label).join(", ")})
                           : sgT("status_open");
    const cls = ["sg-tgt", held.length ? "sg-held" : "",
      status[tg.id] || ""].filter(Boolean).join(" ");
    return `<button class="${cls}" style="left:${tg.x}%;top:${tg.y}%"
      data-sg-tgt="${esc(tg.id)}" aria-label="${esc(tg.label)} — ${esc(st)}"
      ${interactive ? "" : "tabindex=\"-1\""}>
      <span class="sg-seat">${held.length || ""}</span>
      <span class="sg-tlab">${esc(tg.label)}</span>
      ${chips ? `<span class="sg-tchips">${chips}</span>` : ""}</button>`;
  }).join("");
  // Breach traces are rendered statically for every resolved breach; during
  // the replay they start invisible and the animation chain reveals them.
  const traces = !S.res ? "" : S.res.filter(r => !r.stopped).map(r => {
    const pts = (r.ev.breachPath || []).map(sgTarget).filter(Boolean);
    if(pts.length < 2) return "";
    return `<polyline class="sg-trace" data-sg-ev="${esc(r.ev.id)}"
      vector-effect="non-scaling-stroke"
      points="${pts.map(p => `${p.x},${p.y}`).join(" ")}"
      ${S.played ? "" : ' style="opacity:0"'}></polyline>`;
  }).join("");
  const vb = String(sc.viewBox || "0 0 100 100").split(/\s+/);
  const ratio = `${vb[2] || 100}/${vb[3] || 100}`;
  return `<div class="sg-wrap"><div class="sg-scene" style="aspect-ratio:${ratio}">
    <svg class="sg-svg" viewBox="${esc(sc.viewBox)}" preserveAspectRatio="none"
      aria-hidden="true">${SCENES[sc.svgRef] || ""}</svg>
    <svg class="sg-fx" viewBox="0 0 100 100" preserveAspectRatio="none"
      aria-hidden="true">${traces}</svg>
    ${targets}</div></div>`;
}
function sgHudHtml(S, placed){
  const siege = sgData(), spent = sgSpent(placed);
  return `<div class="sg-hud">
    <span>${sgT("hud_budget", {left:siege.budget - spent, budget:siege.budget})}</span>
    <span>${sgT("hud_spent", {spent})}</span>
    <span>${sgT("hud_par", {par:siege.par})}</span>
    <span class="badge">${sgT("hud_wave", {n:S.wave + 1, total:siege.waves.length})}</span></div>`;
}
function sgLogHtml(S){
  return `<div class="sg-log" aria-live="polite">` + S.res.map(r => {
    const tg = sgTarget(r.ev.target) || {label:r.ev.target};
    const line = r.stopped
      ? `${esc(r.ev.stopCopy)} ${sgT("stopped_by", {chip:esc(r.by.label)})}`
      : esc(r.ev.failCopy);
    return `<div class="sg-line ${r.stopped ? "ok" : "no"}" data-sg-ev="${esc(r.ev.id)}"
      ${S.played ? "" : ' style="opacity:0"'}>${r.stopped ? "✓" : "✗"}
      ${esc(r.ev.attackClass)} → ${esc(tg.label)} — ${line}</div>`;
  }).join("") + `</div>`;
}
function sgReviewHtml(res, full){
  return `<ul>` + res.map(r => {
    const tg = sgTarget(r.ev.target) || {label:r.ev.target};
    let extra = "";
    if(!r.stopped){
      const could = sgLeakChips(r.ev).map(ch => ch.label);
      const guards = r.guards.map(ch => ch.label).join(", ");
      extra += `<span>${guards
        ? sgT("wrong_guard", {chips:esc(guards)})
        : sgT("unguarded", {target:esc(tg.label)})} ${sgT("leak_head",
        {chips:esc(could.join(", "))})}</span>`;
    }
    const why = full && r.ev.why ? `<span>${esc(r.ev.why)}</span>` : "";
    const cite = full && r.ev.citation ? `<span class="cite">${sgT("citation_line",
      {citation:esc(r.ev.citation), asOf:esc(r.ev.asOf || "")})}</span>` : "";
    return `<li><b class="${r.stopped ? "hit" : "miss"}">${r.stopped ? "✓" : "✗"}
      ${esc(r.ev.attackClass)} → ${esc(tg.label)}</b>
      <span>${esc(r.stopped ? r.ev.stopCopy : r.ev.failCopy)}</span>${extra}${why}${cite}</li>`;
  }).join("") + `</ul>`;
}

function renderSiege(){
  sgAnimSeq++;                       // any re-render invalidates a live replay
  if(!state.siege || state.siege.gameId !== state.game.id)
    state.siege = sgFresh(false);
  const S = state.siege, siege = sgData();
  if(S.phase === "demo" && (!siege.freebie || S.demoDone)) S.phase = "build";
  if(S.phase === "debrief") return sgRenderDebrief();
  const placed = (S.demo || S.phase === "demo") ? sgDemoPlaced() : S.placed;

  /* ---- demo: the scripted freebie wave, pre-placed and unscored ---- */
  if(S.phase === "demo"){
    const body = `<p class="hint">${esc(siege.prompt)}</p>
      <p class="dim-note" style="margin:0 0 12px">${sgT("demo_hint")}</p>
      ${sgSceneHtml(S, placed, false)}
      <div class="row"><button class="btn" id="sg-demo-run">${sgT("demo_run")}</button></div>`;
    main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
    wireBack();
    document.getElementById("sg-demo-run").onclick = () => {
      S.res = sgResolveEvents(siege.freebie.events, sgDemoPlaced());
      S.demo = true; S.played = false; S.phase = "resolve";
      render();
    };
    return;
  }

  /* ---- resolve: the attack replays; copy lands line by line ---- */
  if(S.phase === "resolve"){
    const body = `<p class="hint">${sgT("resolve_hint")}</p>
      ${sgHudHtml(S, placed)}
      ${sgSceneHtml(S, placed, false)}
      ${sgLogHtml(S)}`;
    main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
    wireBack();
    sgPlay(sgAnimSeq);
    return;
  }

  /* ---- waveEnd: static replay result + review + the next step ---- */
  if(S.phase === "waveEnd"){
    const leaks = S.res.filter(r => !r.stopped).length;
    const next = S.demo ? {id:"sg-demo-end", label:sgT("demo_end")}
      : (S.wave + 1 < siege.waves.length)
        ? {id:"sg-next-wave", label:sgT("next_wave")}
        : {id:"sg-debrief", label:sgT("to_debrief")};
    const body = `${sgHudHtml(S, placed)}
      ${sgSceneHtml(S, placed, false)}
      ${sgLogHtml(S)}
      <div class="reveal">
        <p class="score ${leaks ? "no" : "ok"}">${leaks
          ? sgT("wave_leaks", {n:leaks}) : sgT("wave_clear")}</p>
        ${sgReviewHtml(S.res, !S.demo)}
        <div class="row"><button class="btn" id="${next.id}">${next.label}</button></div>
      </div>`;
    main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
    wireBack();
    const de = document.getElementById("sg-demo-end");
    if(de) de.onclick = () => {
      S.demoDone = true; S.demo = false; S.res = null; S.phase = "build"; render();
    };
    const nw = document.getElementById("sg-next-wave");
    if(nw) nw.onclick = () => { S.wave++; S.res = null; S.phase = "build"; render(); };
    const db = document.getElementById("sg-debrief");
    if(db) db.onclick = () => { S.phase = "debrief"; render(); };
    return;
  }

  /* ---- build: budgeted placement ---- */
  const spent = sgSpent(S.placed), left = siege.budget - spent;
  const anyPlaced = Object.keys(S.placed).length > 0;
  const shopChips = siege.chips.filter(c => !S.placed[c.id]);
  const chipBtn = c => {
    const cls = ["sg-chip", state.siege.sel===c.id ? "sel" : "",
      c.cost > left ? "sg-poor" : ""].filter(Boolean).join(" ");
    return `<button class="${cls}" draggable="true" data-sg-chip="${esc(c.id)}"
      title="${esc(c.definition)}">
      <span class="sg-cost">${c.cost}</span>
      <span><b>${esc(c.label)}</b><em>${esc((c.properties || []).join(" · "))}</em>
        <em>${esc(c.definition)}</em></span></button>`;
  };
  const hint = siege.hint ? `<p class="dim-note" style="margin:0 0 12px">${esc(siege.hint)}</p>` : "";
  const body = `<p class="hint">${esc(siege.prompt)} ${isCoarse()
      ? sgT("build_hint_coarse") : sgT("build_hint_fine")}</p>
    ${hint}
    ${sgHudHtml(S, S.placed)}
    ${sgSceneHtml(S, S.placed, true)}
    <div class="sg-shop">${shopChips.map(chipBtn).join("")}${shopChips.length
      ? "" : `<span class="bank-note">${sgT("run_locked")}</span>`}</div>
    <div class="row">
      <button class="btn" id="sg-run" ${anyPlaced ? "" : "disabled"}>${anyPlaced
        ? sgT("run_button") : sgT("run_locked")}</button>
      <button class="btn ghost" id="sg-clear" ${anyPlaced ? "" : "disabled"}>${sgT("clear_button")}</button>
    </div>`;
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack();

  const place = (chipId, targetId) => {
    const c = sgChip(chipId);
    if(!c || S.placed[chipId]) return;
    if(c.cost > siege.budget - sgSpent(S.placed)){ toast(sgT("over_budget")); return; }
    S.placed[chipId] = targetId; S.sel = null; render();
  };
  const sgSheet = {
    targets: () => siege.scene.targets.map(tg => {
      const held = sgChipsOn(S.placed, tg.id);
      return {key:tg.id, label:tg.label,
        sub:(tg.sub ? tg.sub + " · " : "") + (held.length
          ? sgT("status_held", {chips:held.map(ch => ch.short || ch.label).join(", ")})
          : sgT("status_open")), icon:null};
    }),
    labelOf: id => (sgChip(id) || {}).label || id,
    nextUnplaced: () => null,
    place,
  };
  let dragId = null;
  main.querySelectorAll("[data-sg-chip]").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.sgChip;
      if(isCoarse()){ sheetFlow(sgSheet, id); return; }
      S.sel = S.sel === id ? null : id;
      render();
    };
    b.ondragstart = e => { dragId = b.dataset.sgChip; e.dataTransfer.effectAllowed = "move"; };
  });
  main.querySelectorAll("[data-sg-tgt]").forEach(z => {
    z.ondragover = e => { e.preventDefault(); z.classList.add("over"); };
    z.ondragleave = () => z.classList.remove("over");
    z.ondrop = e => {
      e.preventDefault(); z.classList.remove("over");
      if(dragId){ place(dragId, z.dataset.sgTgt); dragId = null; }
    };
    z.onclick = () => {
      const tid = z.dataset.sgTgt;
      if(S.sel){ place(S.sel, tid); return; }
      // No selection: clicking a guarded target takes its last control back.
      const held = Object.keys(S.placed).filter(id => S.placed[id]===tid);
      if(held.length){ delete S.placed[held[held.length - 1]]; render(); }
    };
  });
  const run = document.getElementById("sg-run");
  if(run) run.onclick = () => {
    if(!Object.keys(S.placed).length) return;
    S.res = sgResolveEvents(siege.waves[S.wave].events, S.placed);
    // The scheduler write, once per wave event per run — the placement verdict
    // is the record()ed outcome, exactly as the board records a drop.
    S.res.forEach(r => {
      if(!S.scored[r.ev.id]){ record(r.ev.id, r.stopped); S.scored[r.ev.id] = true; }
    });
    S.hist = S.hist.concat(S.res);
    S.demo = false; S.played = false; S.phase = "resolve";
    render();
  };
  const clr = document.getElementById("sg-clear");
  if(clr) clr.onclick = () => { S.placed = {}; S.sel = null; render(); };
}

// The attack replay. Self-guarding like the gauntlet clock: the seq token,
// the game, the phase and the DOM are all re-checked between steps, so
// leaving the game or re-rendering kills the chain instead of animating a
// detached tree. Interrupted replays restart from the top on re-render;
// results were computed (and recorded) before the animation began.
async function sgPlay(seq){
  const S = state.siege;
  const alive = () => sgAnimSeq === seq && state.game
    && state.game.runner === "siegeBoard" && state.siege === S
    && S.phase === "resolve" && !!main.querySelector(".sg-scene");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  await sgSleep(400);
  for(const r of S.res){
    if(!alive()) return;
    const scene = main.querySelector(".sg-scene");
    const line = main.querySelector(`.sg-line[data-sg-ev="${r.ev.id}"]`);
    if(line) line.style.opacity = "1";
    const tgtEl = id => main.querySelector(`.sg-tgt[data-sg-tgt="${id}"]`);
    if(r.stopped){
      const el = tgtEl(r.ev.target);
      if(el) el.classList.add("sg-safe");
      await sgSleep(reduce ? 250 : 750);
    }else{
      const trace = main.querySelector(`.sg-trace[data-sg-ev="${r.ev.id}"]`);
      if(trace) trace.style.opacity = "1";
      const pts = (r.ev.breachPath || []).map(sgTarget).filter(Boolean);
      if(!reduce && pts.length > 1 && scene){
        const dot = document.createElement("i");
        dot.className = "sg-dot";
        dot.style.left = pts[0].x + "%"; dot.style.top = pts[0].y + "%";
        scene.appendChild(dot);
        try{
          await dot.animate(
            pts.map((p, i) => ({left:p.x + "%", top:p.y + "%",
                                offset:i / (pts.length - 1)})),
            {duration:450 * (pts.length - 1), easing:"linear", fill:"forwards"}).finished;
        }catch(e){ /* cancelled — the guard below decides what happens next */ }
        dot.remove();
      }
      if(!alive()) return;
      pts.forEach(p => { const el = tgtEl(p.id); if(el) el.classList.add("sg-hit"); });
      await sgSleep(reduce ? 250 : 550);
    }
  }
  if(!alive()) return;
  S.played = true;
  S.phase = "waveEnd";
  render();
}

function sgRenderDebrief(){
  const S = state.siege, siege = sgData();
  const spent = sgSpent(S.placed);
  const breaches = S.hist.filter(r => !r.stopped).length;
  const medal = breaches === 0 && spent <= siege.par ? "gold"
    : breaches === 0 ? "silver" : "none";
  const medalIcon = {gold:"🥇", silver:"🥈", none:"—"}[medal];
  const medalLine = medal === "gold" ? sgT("medal_gold", {spent, par:siege.par})
    : medal === "silver" ? sgT("medal_silver", {spent, par:siege.par})
    : sgT("medal_none", {n:breaches});
  const missed = S.hist.filter(r => !r.stopped).map(r => {
    const tg = sgTarget(r.ev.target) || {label:r.ev.target};
    return {label:`${r.ev.attackClass} against ${tg.label}`,
      said:r.guards.length
        ? sgT("said_chips", {chips:r.guards.map(ch => ch.label).join(", ")})
        : sgT("said_nothing"),
      answer:sgLeakChips(r.ev).map(ch => ch.label).join(" / "),
      why:r.ev.why};
  });
  const allItems = S.hist.map(r => {
    const tg = sgTarget(r.ev.target) || {label:r.ev.target};
    return {label:`${r.ev.attackClass} against ${tg.label}`,
      answer:sgLeakChips(r.ev).map(ch => ch.label).join(" / "),
      why:r.ev.why};
  });
  const ctx = sgT("prompt_context", {spent, budget:siege.budget, breaches});
  let links = "";
  if(allItems.length)
    links += aiLinks(explainPrompt(state.game.title, allItems, ctx), sgT("explain_link"));
  if(missed.length)
    links += aiLinks(deepenPrompt(state.game.title, missed, ctx), sgT("deepen_link"));
  const cites = [...new Set(S.hist.map(r => r.ev.citation).filter(Boolean))];
  const body = `<div class="sg-medal ${medal}"><span class="medal">${medalIcon}</span>
      <span>${medalLine}</span></div>
    ${sgHudHtml(S, S.placed)}
    ${sgSceneHtml(S, S.placed, false)}
    <div class="reveal">
      <p class="score ${breaches ? "no" : "ok"}">${sgT("review_heading")}</p>
      ${sgReviewHtml(S.hist, true)}
      ${cites.length ? `<p class="cite">${esc(cites.join(" · "))}</p>` : ""}
      ${links}
      <div class="row"><button class="btn" id="sg-again">${sgT("new_run")}</button></div>
    </div>`;
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack(); wireAiLinks();
  document.getElementById("sg-again").onclick = () => {
    state.siege = sgFresh(true);      // demo already seen this session
    render();
  };
}

/* ------------------------------------------------------------------- desk */
function renderDesk(){
  const cases = state.game.payload().filter(c => state.area==="all" || c.areas.includes(state.area));
  const c = cases[state.deskIdx % cases.length];
  const answered = c.steps.every(s => state.deskPick[s.id]);

  let body = `<div class="scenario">${esc(c.brief)}</div>`;
  if(c.currency) body += currencyHtml(c.currency);
  body += c.steps.map(s => `<div class="field"><label>${esc(s.q)}</label><div class="pick">` +
    s.options.map(o => {
      let cls="";
      if(state.checked) cls = o===s.answer ? "correct" : (state.deskPick[s.id]===o ? "wrong":"");
      return `<button class="${cls}" data-step="${s.id}" data-opt="${esc(o)}"
        aria-pressed="${state.deskPick[s.id]===o}" ${state.checked?"disabled":""}>${esc(o)}</button>`;
    }).join("") + `</div>` +
    (state.checked?`<p class="why" style="margin:9px 0 0;font-size:13px">${esc(s.why)}</p>`:"") + `</div>`).join("");

  if(!state.checked){
    const anyAnswered = c.steps.some(s => state.deskPick[s.id]);
    body += `<div class="row"><button class="btn" id="check" ${answered?"":"disabled"}>
      ${answered?t("desk.submit_button"):t("desk.answer_all_button")}</button>
      <button class="btn ghost" id="clear" ${anyAnswered?"":"disabled"}>${t("desk.clear_button")}</button>
      <span class="badge">${t("desk.badge_case", {n: state.deskIdx+1, total: cases.length})}</span></div>`;
  }else{
    const missed = c.steps.filter(s => state.deskPick[s.id]!==s.answer);
    const right = c.steps.length - missed.length;
    body += `<div class="reveal"><p class="score ${right===c.steps.length?"ok":"no"}">
      ${t("desk.score_display", {correct: right, total: c.steps.length})}</p><p class="cite">${esc(c.citation)}</p>`;
    body += aiLinks(explainPrompt(`Compliance Desk — ${c.areas.join(", ")}`,
      c.steps.map(s => ({label:s.q, answer:s.answer, why:s.why})), `case facts: ${c.brief}`) +
      `\n\nThen change two facts in the case so the correct answers shift, walk me through the new analysis, and tell me what a governance lead would still be missing even with every answer right.`,
      t("desk.explain_link"));
    if(missed.length){
      body += aiLinks(deepenPrompt(`Compliance Desk — ${c.areas.join(", ")}`,
        missed.map(s => ({label:s.q, said:state.deskPick[s.id], answer:s.answer, why:s.why})),
        `case facts: ${c.brief}`), t("desk.deepen_link"));
    }
    body += `<div class="row"><button class="btn" id="next">${t("desk.next_button")}</button>
      <button class="btn ghost" id="retry">${t("desk.retry_button")}</button></div></div>`;
  }
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack(); wireAiLinks();
  main.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
    state.deskPick[b.dataset.step] = b.dataset.opt; render(); });
  const chk = document.getElementById("check");
  if(chk) chk.onclick = () => {
    state.checked = true;
    if(!state.scored){
      c.steps.forEach(s => record(s.id, state.deskPick[s.id]===s.answer));
      state.scored = true;
    }
    render();
  };
  const clr = document.getElementById("clear");
  if(clr) clr.onclick = () => { state.deskPick = {}; render(); };
  const rty = document.getElementById("retry");
  if(rty) rty.onclick = () => { state.deskPick={}; state.checked=false; render(); };
  const nx = document.getElementById("next");
  if(nx) nx.onclick = () => {
    state.deskIdx++; state.deskPick={}; state.checked=false; state.scored=false; render();
  };
}

/* ---------------------------------------------------------------- ladders */
function renderLadders(){
  const ls = state.game.payload().filter(l => state.area==="all" || l.area===state.area);
  if(!state.ladder){
    main.innerHTML = backBar(t("ladders.page_title")) + `<div class="grid">` + ls.map((l,i) =>
      `<button class="card" data-l="${i}"><span class="rung">${t("ladders.rung_apply")}</span>
       <h3>${esc(l.title)}</h3><p>${esc(l.prompt)}</p></button>`).join("") + `</div>`;
    wireBack();
    main.querySelectorAll("[data-l]").forEach(b =>
      b.onclick = () => { state.ladder = ls[+b.dataset.l]; state.order=[]; render(); });
    return;
  }
  const l = state.ladder, track = state.track;
  const key = s => l.dualTrack ? (track==="enacted" ? s.date : s.amended) : "";
  const ordered = l.dualTrack
    ? l.steps.slice().sort((a,b) => key(a).localeCompare(key(b))) : l.steps.slice();
  const remaining = ordered.filter(s => !state.order.includes(s.label));
  const done = remaining.length===0;

  let body = `<p class="hint">${esc(l.prompt)}</p>`;
  if(l.dualTrack) body += `<div class="row" style="margin:0 0 12px">
    <button class="btn ${track==="enacted"?"":"ghost"}" data-track="enacted">${t("ladders.track_enacted")}</button>
    <button class="btn ${track==="amended"?"":"ghost"}" data-track="amended">${t("ladders.track_amended")}</button></div>`;
  body += `<div class="order-list">` + ordered.map((s,i) => {
    const placed = state.order[i]; const right = placed===s.label;
    return `<div class="order-slot ${placed?"filled":""}"
      style="${placed?(right?"border-color:var(--ok)":"border-color:var(--bad)"):""}">
      ${i+1}. ${placed?esc(placed):"—"}</div>`;
  }).join("") + `</div>`;
  if(!done){
    body += `<div class="bank">` + shuffle(remaining, l.id.length).map(s =>
      `<button class="tok" data-step="${esc(s.label)}">${esc(s.label)}</button>`).join("") + `</div>`;
    body += `<div class="row"><button class="btn ghost" id="clear"
      ${state.order.length?"":"disabled"}>${t("ladders.clear_button")}</button>
      <span class="badge">${t("ladders.badge_placed", {n: state.order.length, total: ordered.length})}</span></div>`;
  }else{
    const rc = state.order.filter((lab,i)=>lab===ordered[i].label).length;
    body += `<div class="reveal"><p class="score ${rc===ordered.length?"ok":"no"}">
      ${t("ladders.scoreLine", {right: rc, total: ordered.length})}</p>` +
      ordered.map(s => `<p class="why"><strong>${esc(s.label)}</strong>${
        key(s)?` — ${esc(key(s))}`:""}. ${esc(s.detail)}</p>`).join("");
    if(l.currency) body += currencyHtml(l.currency);
    body += `<p class="cite">${esc(l.citation)}</p>`;
    body += aiLinks(explainPrompt(l.title,
      ordered.map((s,i) => ({label:`Position ${i+1}: ${s.label}`,
        answer:key(s)||`step ${i+1}`, why:s.detail})),
      l.dualTrack ? `ordered on the "${track}" track` : l.prompt) +
      (l.currency ? `\n\nNote the currency position: ${l.currency.book} ${l.currency.changed} ${l.currency.exam} Explain what a governance lead should actually plan against, versus what the exam expects.` : ""),
      t("ladders.explain_link"));
    body += `<div class="row"><button class="btn" id="reset">${t("ladders.reset_button")}</button>
      <button class="btn ghost" id="pick">${t("ladders.pick_button")}</button></div></div>`;
  }
  main.innerHTML = backBar(l.title) + `<div class="panel">${body}</div>`;
  wireBack(); wireAiLinks();
  main.querySelectorAll("[data-track]").forEach(b =>
    b.onclick = () => { state.track=b.dataset.track; state.order=[]; render(); });
  main.querySelectorAll("[data-step]").forEach(b =>
    b.onclick = () => { state.order.push(b.dataset.step); render(); });
  const c=document.getElementById("clear"); if(c) c.onclick=()=>{state.order=[];render();};
  const r=document.getElementById("reset"); if(r) r.onclick=()=>{state.order=[];render();};
  const p=document.getElementById("pick"); if(p) p.onclick=()=>{state.ladder=null;state.order=[];render();};
}

/* ----------------------------------------------------------------- briefs */
function renderBriefs(){
  const bs = state.game.payload().filter(b => state.area==="all" || b.area===state.area || b.capstone);
  if(!state.brief){
    main.innerHTML = backBar(t("briefs.page_title")) + `<div class="grid">` + bs.map(b => {
      const st = progress.briefs[b.id] || {};
      const markLabel = st.selfMark ? (
        st.selfMark === "nailed" ? t("briefs.mark_nailed") :
        st.selfMark === "gaps" ? t("briefs.mark_gaps") :
        st.selfMark === "redo" ? t("briefs.mark_redo") :
        st.selfMark  // fallback for legacy translated values
      ) : null;
      return `<button class="card" data-b="${b.id}"><span class="rung">${t("briefs.rung_brief")}</span>
        <h3>${esc(b.title)}</h3><p>${b.capstone?t("briefs.capstone_label"):""}${t("briefs.rubric_count", {n: b.rubric.length})}</p>
        ${markLabel?`<p style="margin-top:8px"><span class="badge">${esc(markLabel)}</span></p>`:""}</button>`;
    }).join("") + `</div>`;
    wireBack();
    main.querySelectorAll("[data-b]").forEach(x =>
      x.onclick = () => { state.brief = bs.find(b=>b.id===x.dataset.b); state.confirmClear=null; render(); });
    return;
  }
  renderBrief(state.brief);
}
function renderBrief(b){
  const st = progress.briefs[b.id] || {responses:{}};
  st.responses = st.responses || {};
  const filled = b.fields.every(f => (st.responses[f.key]||"").trim().length>0);

  let body = `<div class="scenario">${esc(b.scenario)}</div>`;
  if(b.currency) body += currencyHtml(b.currency);
  body += b.fields.map(f => {
    const v = st.responses[f.key] || "";
    return `<div class="field"><label for="f-${f.key}">${esc(f.prompt)}</label>
      ${f.hint?`<p class="why" style="margin:-2px 0 6px;font-size:13px">${esc(f.hint)}</p>`:""}
      <textarea id="f-${f.key}" data-field="${f.key}">${esc(v)}</textarea>
      <div class="count" id="c-${f.key}">${v.trim()?v.trim().split(/\s+/).length:0} words</div></div>`;
  }).join("");

  const written = b.fields.some(f => (st.responses[f.key]||"").trim().length>0);
  // Two-step confirm rather than a one-click wipe: this button can destroy
  // twenty minutes of writing, and there is no undo.
  const clearBtn = state.confirmClear === b.id
    ? `<button class="btn" id="clear-yes" style="background:var(--bad)">${t("briefs.confirm_clear")}</button>
       <button class="btn ghost" id="clear-no">${t("briefs.cancel_clear")}</button>`
    : `<button class="btn ghost" id="clear" ${written?"":"disabled"}>${t("briefs.clear_button")}</button>`;
  body += `<div class="row"><button class="btn" id="reveal" ${filled?"":"disabled"}>
    ${filled?t("briefs.reveal_button"):t("briefs.reveal_locked")}</button>
    ${clearBtn}</div>
    <p class="cite">${t("briefs.autosave_note", {memoryOnly: memoryOnly?t("briefs.autosave_no_storage"):""})}</p>
    <div class="reveal"><p style="font-weight:600;margin:0 0 6px">${t("briefs.critique_heading")}</p>
    <p class="why">${t("briefs.critique_intro")}</p>${aiLinks(critiquePrompt(b), t("briefs.critique_link"))}</div>`;

  if(st.revealed){
    body += `<div class="reveal rubric"><h3 style="font-size:15px">${t("briefs.rubric_heading")}</h3><ul>` +
      b.rubric.map(r => `<li><b>${esc(r.criterion)}</b>${esc(r.expected)}
        <span class="cite">${esc(r.citation)}</span></li>`).join("") + `</ul>
      <div class="sweep"><p><strong>${t("briefs.self_assess_prompt")}</strong> ${t("briefs.self_assess_note")}</p>
      <div class="row" style="margin:0">
        <button class="btn" data-mark="nailed">${t("briefs.mark_nailed")}</button>
        <button class="btn ghost" data-mark="gaps">${t("briefs.mark_gaps")}</button>
        <button class="btn ghost" data-mark="redo">${t("briefs.mark_redo")}</button></div></div></div>`;
  }

  main.innerHTML = backBar(b.title) + `<div class="panel">${body}</div>`;
  wireBack();
  main.querySelectorAll("[data-field]").forEach(ta => {
    ta.oninput = () => {
      const rec = progress.briefs[b.id] || {responses:{}};
      rec.responses = rec.responses || {};
      rec.responses[ta.dataset.field] = ta.value; rec.updated = today();
      progress.briefs[b.id] = rec; save();
      const c = document.getElementById("c-"+ta.dataset.field);
      const w = ta.value.trim()?ta.value.trim().split(/\s+/).length:0;
      if(c) c.textContent = `${w} words`;
      const btn = document.getElementById("reveal");
      if(btn){
        const ok = b.fields.every(f => (rec.responses[f.key]||"").trim().length>0);
        btn.disabled = !ok;
        btn.textContent = ok?t("briefs.reveal_button"):t("briefs.reveal_locked");
      }
    };
  });
  const rv = document.getElementById("reveal");
  if(rv) rv.onclick = () => {
    const rec = progress.briefs[b.id]||{responses:{}}; rec.revealed=true;
    progress.briefs[b.id]=rec; save(); render();
  };
  const clr = document.getElementById("clear");
  if(clr) clr.onclick = () => { state.confirmClear = b.id; render(); };
  const no = document.getElementById("clear-no");
  if(no) no.onclick = () => { state.confirmClear = null; render(); };
  const yes = document.getElementById("clear-yes");
  if(yes) yes.onclick = () => {
    delete progress.briefs[b.id];
    save(); state.confirmClear = null; render();
    toast(t("briefs.toast_cleared"));
  };
  main.querySelectorAll("[data-mark]").forEach(x => x.onclick = () => {
    const rec = progress.briefs[b.id]||{responses:{}}; rec.selfMark=x.dataset.mark;
    progress.briefs[b.id]=rec; save(); state.brief=null; render();
  });
  wireAiLinks();
}

// Every reveal offers two deep dives, because getting a card right is not the
// same as understanding it. "Explain" always appears and covers everything on
// the board; "what you missed" appears on top of it only when there are misses.
function explainPrompt(title, items, context){
  const list = items.map(i =>
    `- ${i.label}\n  Answer: ${i.answer}\n  Given reason: ${i.why}`).join("\n");
  return `${LAB.studyContext}

I just worked through "${title}"${context?` (${context})`:""}. Here is everything that was on the board, with the correct answers:

${list}

I got these right, but I want to dial the knowledge in properly rather than rely on recognition. For each item:

1. Teach me the underlying rule from first principles — why the law is drawn this way, not just what it says.
2. Give me the decision test I should run in my head, phrased as a question.
3. Name the single concept it is most often confused with, and the precise distinction between them.
4. Give one concrete real-world example, and one edge case where the answer is genuinely arguable.

Then, across the whole set: what is the connecting principle, and what do examiners most often catch people out on here?

${LAB.citeInstruction} Correct me if any of the reasons above are imprecise or oversimplified.`;
}

// Built from what you actually got wrong, because a generic "explain this topic"
// prompt is worth far less than one that names the specific confusion you just
// demonstrated.
function deepenPrompt(title, missed, context){
  const items = missed.map(m => `- ${m.label}\n  You said: ${m.said}\n  Correct: ${m.answer}\n  Why: ${m.why}`).join("\n");
  return `${LAB.studyContext}

I just worked through "${title}"${context?` (${context})`:""} and got these wrong:

${items}

Please:
1. Explain each one properly, from first principles, so I understand the underlying rule rather than the answer.
2. For each, give me the distinguishing test I should apply next time — the specific question to ask myself.
3. Show one near-miss example per item where the answer flips, and say which fact changed.
4. Flag any place where my wrong answer would have been correct in a different context, since that is probably why I picked it.

${LAB.citeInstruction} Be precise rather than reassuring.`;
}
function critiquePrompt(b){
  const st = progress.briefs[b.id] || {responses:{}};
  const answers = b.fields.map(f =>
    `### ${f.prompt}\n${((st.responses||{})[f.key]||"(left blank)").trim()}`).join("\n\n");
  const criteria = b.rubric.map((r,i) =>
    `${i+1}. ${r.criterion} — a strong answer: ${r.expected} [${r.citation}]`).join("\n");
  return `${LAB.examinerRole} Critique the candidate response below against the assessment criteria. Be specific and demanding.

## SCENARIO
${b.scenario}

## ASSESSMENT CRITERIA
${criteria}

## CANDIDATE RESPONSE
${answers}

## WHAT I WANT BACK
For each criterion: state Met / Partially met / Missed, quote the candidate's relevant text as evidence, and explain the gap in one or two sentences.

Then:
1. List any statements that are legally incorrect, and correct them.
2. List what a strong answer would have included that is absent here.
3. Give an overall band — Strong / Adequate / Not yet exam-ready — with a one-paragraph justification.

${LAB.citeInstruction} Do not speak in generalities. Do not be encouraging at the expense of being accurate.`;
}

const AI_URLS = {claude:"https://claude.ai/new", chatgpt:"https://chatgpt.com/",
                 perplexity:"https://www.perplexity.ai/search"};
const AI_NAMES = {claude:"Claude", chatgpt:"ChatGPT", perplexity:"Perplexity"};

// Logo-only handoff buttons. The prompt is stashed on the element rather than
// rebuilt on click, so a reveal can offer several different deep dives.
let promptSeq = 0;
const PROMPTS = new Map();
function aiLinks(prompt, label){
  const key = `p${++promptSeq}`;
  let finalPrompt = prompt;
  if(lang !== "en") finalPrompt += "\n\nPlease respond in " + I18N.meta[lang].name + ".";
  PROMPTS.set(key, finalPrompt);
  // AI_LOGOS holds each mark's inner geometry plus the brand fill that sat on
  // the source <svg> element. Both are needed: dropped straight into a <button>
  // the browser discards the paths, and without the fill every mark renders
  // black — invisible on the dark theme. ChatGPT's mark has no brand colour, so
  // it carries currentColor and follows the text colour instead.
  const btns = Object.keys(AI_URLS).map(s => {
    const openLabel = t("ai.open_in_label", {serviceName: AI_NAMES[s]});
    return `<button class="ai-link ${s}" data-ai="${s}" data-prompt="${key}"
      data-label="${esc(openLabel)}" aria-label="${esc(openLabel)}"
      ><svg viewBox="0 0 24 24" fill="${AI_LOGOS[s].fill}" aria-hidden="true"
        focusable="false">${AI_LOGOS[s].inner}</svg></button>`;
  }).join("");
  return `<div class="ai-links">${label?`<span class="lbl">${esc(label)}</span>`:""}${btns}</div>`;
}
function wireAiLinks(){
  main.querySelectorAll("[data-ai]").forEach(b => b.onclick = () =>
    handoff(PROMPTS.get(b.dataset.prompt) || "", b.dataset.ai));
}
function handoff(prompt, service){
  // Gate on the URL actually sent, not the raw prompt: the target sites all
  // read ?q= client-side and tolerate long query strings, so prefill works
  // well past the old 1800-char guess. ~8k total URL keeps clear of proxy/CDN
  // request-line limits.
  const url = `${AI_URLS[service]}?q=${encodeURIComponent(prompt)}`;
  if(url.length < 7600){
    window.open(url, "_blank", "noopener");
    return;
  }
  // Too long to prefill: copy, then tell the player in a way that cannot be
  // missed. A toast dies unseen because window.open steals focus, so reuse
  // the placement sheet — the new tab only opens from the player's own tap
  // on "Open in <service>", after they have read that the prompt was copied.
  const open = () => window.open(AI_URLS[service], "_blank", "noopener");
  const announce = () => openSheet({
    title: t("ai.sheet_copied_title"),
    targets: [{key:"open", label: t("ai.open_in_label", {serviceName: AI_NAMES[service]}),
               sub: t("ai.sheet_copied_sub")}],
    onPick: () => { closeSheet(); open(); }
  });
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(prompt)
      .then(announce)
      .catch(() => { if(fallbackCopy(prompt)) announce(); else open(); });
  }else{ if(fallbackCopy(prompt)) announce(); else open(); }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try{ ok = document.execCommand("copy"); }
  catch(e){ ok = false; }
  if(!ok) toast(t("ai.toast_copy_fail"));
  document.body.removeChild(ta);
  return ok;
}
function toast(msg){
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),3200);
}

mountLangSelect();
document.documentElement.lang = lang;
document.documentElement.dir = I18N.meta[lang].dir === "rtl" ? "rtl" : "ltr";
loadOverlay(lang).then(() => { relocalizeDecks(); applyStatic(); if(!openFromHash()) render(); });
