t-out and access machinery now — the rules took effect in 2026, with significant-decision compliance due by 1 January 2027","why":"The nearest confusable is (b), which misreads the phase-in as total deferral — the CPPA regulations have been effective since 2026-01-01; only the significant-decision ADMT compliance deadline runs to 2027-01-01. Option (c) invents an autonomy threshold the rules do not use.","citation":"CPPA — Final ADMT regulations (eff. 2026-01-01)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-usca-n02","kind":"defend","territory":"map-us-ca","roles":["*"],"area":"II.C","fact":"usca-sb53-incident-reporting","q":"Your client develops frontier models. One behaves in a way that creates a critical safety event. Under California law, who must hear about it?","options":["The state Office of Emergency Services, under the frontier-AI transparency act's incident-reporting duty","The city consumer-affairs department","The EU AI Office, under serious-incident rules"],"answer":"The state Office of Emergency Services, under the frontier-AI transparency act's incident-reporting duty","why":"The nearest confusable is (c) — the EU AI Act's serious-incident reporting is the parallel mechanism but the wrong jurisdiction; SB 53 routes critical incidents to California's OES. The city consumer-affairs channel (b) is NYC LL144's enforcement home, unrelated to frontier models.","citation":"California SB 53 — Transparency in Frontier AI Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-usca-c01","kind":"consolidate","territory":"map-us-ca","roles":["*"],"area":"II.C","fact":"usca-sb53-safety-framework","q":"Beyond incident reports, what does California's frontier-AI law demand of the largest developers, on pain of penalties up to $1M?","options":["A published safety framework and whistleblower protections","CE marking of each model before release","Divestiture of compute above a licensing threshold"],"answer":"A published safety framework and whistleblower protections","why":"The nearest confusable is (b) — CE marking is EU conformity iconography with no California analogue. SB 53 is a transparency statute: publish the safety framework, protect whistleblowers, report critical incidents. It licenses nothing and divests nothing (c).","citation":"California SB 53 — Transparency in Frontier AI Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-usca-c02","kind":"consolidate","territory":"map-us-ca","roles":["*"],"area":"II.C","fact":"usca-role-patchwork","q":"Summarize how California allocates AI duties across the actors in a supply chain.","options":["Statute by statute — training-data duties on developers, provenance on large generative providers, ADMT rights against businesses deploying the tools","Through a single provider-deployer-importer scheme like the EU's","By consolidating every duty on whoever deploys the system"],"answer":"Statute by statute — training-data duties on developers, provenance on large generative providers, ADMT rights against businesses deploying the tools","why":"The nearest confusable is (b): unlike the EU AI Act's single role taxonomy, California has no unified scheme — AB 2013 names developers, SB 942 covered providers, the CCPA regs businesses. Option (c) describes Colorado's deployer-weighted replacement law, not California.","citation":"California AB 2013; SB 942; CPPA ADMT regulations","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-co-s01","kind":"gate","territory":"map-us-co","roles":["*"],"area":"II.C","fact":"co-sb24-205-never-effective","q":"A colleague budgets 2026 compliance work for Colorado's landmark duty-of-care AI law. Correct the record.","options":["It never took effect — repealed and replaced in May 2026 before its delayed start date arrived","It has applied since February 2026 as originally scheduled","It applies, but only to government agencies","It survived judicial review and has applied since June 2026"],"answer":"It never took effect — repealed and replaced in May 2026 before its delayed start date arrived","why":"The nearest confusables are (b) and (d), which recite the two effective dates that never arrived: 2026-02-01 was pushed to 2026-06-30 by SB 25B-004, and the repeal-and-replace (2026-05-14) landed first. SB 24-205 produced zero days of operative law.","citation":"Colorado General Assembly — SB26-189; SB 25B-004","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-co-s02","kind":"gate","territory":"map-us-co","roles":["*"],"area":"II.C","fact":"co-sb26-189-replacement","q":"What replaced Colorado's original AI act, and when does it start to bite?","options":["A narrower ADMT disclosure law, signed May 2026, effective 1 January 2027","A comprehensive intent-based act effective January 2026","Nothing — the field was deregulated by design","A ballot measure that took effect immediately on passage"],"answer":"A narrower ADMT disclosure law, signed May 2026, effective 1 January 2027","why":"The nearest confusable is (b), which describes TEXAS's TRAIGA — in force since January 2026 and intent-based. Colorado's SB 26-189 is a disclosure/transparency regime for automated decision technology and does not operate until 2027-01-01.","citation":"Colorado General Assembly — SB26-189","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-co-s03","kind":"gate","territory":"map-us-co","roles":["*"],"area":"II.C","fact":"co-deployer-weighted-duties","q":"Under Colorado's replacement law, which actor carries most of the load once it operates?","options":["Those deploying automated decision technology — disclosure duties sit mainly with them","Developers, through a duty of care and impact assessments","Importers and distributors of AI systems","Auditors certified by the attorney general"],"answer":"Those deploying automated decision technology — disclosure duties sit mainly with them","why":"The nearest confusable is (b) — the developer duty-of-care with impact assessments was the REPEALED SB 24-205 design; SB 26-189 largely eliminated the developer/deployer duty split and weighted what remains toward deployers. Importers (c) are an EU role with no Colorado analogue.","citation":"Colorado General Assembly — SB26-189","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-co-s04","kind":"gate","territory":"map-us-co","roles":["*"],"area":"II.C","fact":"co-compliance-date-churn","q":"List the Colorado sequence a compliance calendar had to track between 2024 and 2026.","options":["Enacted 2024 → start date delayed → enforcement stayed amid litigation → repealed and replaced, new date 2027","Enacted 2024 → effective 2025 → amended 2026","Proposed 2024 → died in committee → reintroduced 2026","Enacted 2024 → preempted by a federal statute in 2026"],"answer":"Enacted 2024 → start date delayed → enforcement stayed amid litigation → repealed and replaced, new date 2027","why":"The nearest confusable is (d) — the DOJ did intervene in the court challenge, but no federal preemption statute exists; the reversal was Colorado's own legislature. Four moves in two years is the date-churn lesson: a compliance date is not a fact you memorise once.","citation":"Colorado General Assembly — SB26-189; SB 25B-004","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-co-c01","kind":"consolidate","territory":"map-us-co","roles":["*"],"area":"II.C","fact":"co-xai-doj-challenge","q":"What role did the courts play in Colorado's AI-law reversal?","options":["An AI company sued the attorney general, the DOJ intervened, and enforcement was stayed weeks before the repeal","The state supreme court struck the law down as unconstitutional","None — the repeal was purely a legislative initiative with no litigation backdrop"],"answer":"An AI company sued the attorney general, the DOJ intervened, and enforcement was stayed weeks before the repeal","why":"The nearest confusable is (b): no court ever ruled the law unconstitutional — xAI's suit (filed 2026-04-09, DOJ intervening) produced a stay, and the LEGISLATURE then repealed and replaced it. Option (c) erases the litigation pressure that shaped the outcome.","citation":"Colorado General Assembly — SB26-189; xAI v. Colorado AG (2026)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-co-c02","kind":"consolidate","territory":"map-us-co","roles":["*"],"area":"II.C","fact":"co-what-replacement-dropped","q":"Name the pieces of the original Colorado model that the 2026 replacement dropped.","options":["Duty of care, risk-management programs, impact assessments and attorney-general reporting","All disclosure and transparency duties","Only the definition of algorithmic discrimination"],"answer":"Duty of care, risk-management programs, impact assessments and attorney-general reporting","why":"The nearest confusable is (b), which inverts the outcome — disclosure and transparency are exactly what SB 26-189 KEPT; the heavyweight governance machinery is what went. That deletion is why commentators describe the replacement as substantially narrower.","citation":"Colorado General Assembly — SB26-189","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-co-k01","kind":"check","territory":"map-us-co","roles":["*"],"area":"II.C","fact":"co-nothing-in-force-today","q":"It is 2 August 2026 and your client operates decisioning tools in Colorado. Which AI-specific state obligations bind today?","options":["None yet — the replacement law starts 1 January 2027, and its predecessor never operated","The original act's duty of care, pending the repeal taking effect","The replacement law's disclosure duties, in force since signing"],"answer":"None yet — the replacement law starts 1 January 2027, and its predecessor never operated","why":"The nearest confusable is (c), the signing-date-equals-effective-date error — SB 26-189 was signed 2026-05-14 but operates from 2027-01-01. Option (b) treats a dead law as live. Colorado today is a gap: general consumer and privacy law apply, nothing AI-specific.","citation":"Colorado General Assembly — SB26-189","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ca-s01","kind":"gate","territory":"map-ca","roles":["*"],"area":"II.C","fact":"ca-aida-died-prorogation","q":"A prospect insists Canada's federal AI bill will govern your deployment next year. What actually happened to that bill?","options":["It died on the order paper at the January 2025 prorogation and was never revived","It passed and takes effect in 2027","It is in committee before final reading","It was folded into the federal privacy statute"],"answer":"It died on the order paper at the January 2025 prorogation and was never revived","why":"The nearest confusable is (c), the still-in-committee myth — AIDA (Bill C-27 Part 3) is dead, not dormant, and no successor bill has been tabled as of August 2026. The government has said future AI legislation will proceed separately from privacy reform, so (d) is backwards too.","citation":"ISED — AIDA (Bill C-27) companion document; prorogation 2025-01-06","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ca-s02","kind":"gate","territory":"map-ca","roles":["*"],"area":"II.C","fact":"ca-voluntary-genai-code","q":"With no binding statute for the private sector, what actually anchors AI governance expectations for Canadian industry?","options":["The 2023 voluntary code of conduct for advanced generative systems, joined by signatories","The Directive on Automated Decision-Making","A dedicated AI chapter inside PIPEDA","Provincial AI acts in Ontario and Quebec"],"answer":"The 2023 voluntary code of conduct for advanced generative systems, joined by signatories","why":"The nearest confusable is (b) — the ADM Directive is genuinely binding, but only on the federal government's own decision systems, so it sets no private-sector expectations. PIPEDA has no AI chapter (c), and no province has a general private-sector AI act (d) — Ontario's 2024 act reaches only public-sector use.","citation":"Voluntary Code of Conduct on Advanced Generative AI (2023)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ca-c01","kind":"consolidate","territory":"map-ca","roles":["*"],"area":"II.C","fact":"ca-adm-directive-scope","q":"Canada does have one binding AI instrument. Who must obey it?","options":["Federal institutions using automated decision systems for their own administrative decisions","Any company doing business in Canada above a revenue threshold","Signatories of the generative-AI code of conduct"],"answer":"Federal institutions using automated decision systems for their own administrative decisions","why":"The nearest confusable is (c) — code signatories make voluntary commitments, which is the opposite of binding law. The ADM Directive binds government deployers only; a federally REGULATED private company (banks, airlines) is still outside its scope, which trips up option (b) thinkers.","citation":"Directive on Automated Decision-Making","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ca-c02","kind":"consolidate","territory":"map-ca","roles":["*"],"area":"II.C","fact":"ca-ai-for-all-strategy","q":"What did June 2026 bring for Canadian AI policy, and did it create any duties?","options":["A national strategy with a $1B compute fund — it signals future legislation but imposes nothing","A binding AI safety statute with immediate effect","Accession to the EU AI Act's third-country mechanism"],"answer":"A national strategy with a $1B compute fund — it signals future legislation but imposes nothing","why":"The nearest confusable is (b): the 'AI for All' strategy (launched 2026-06-04) and the February 2026 consultation summary signal rules on safety testing and oversight to come, but nothing has been tabled. Option (c) is a category error — the EU AI Act has no accession mechanism for states.","citation":"Canada.ca — National AI Strategy launch (2026-06-04)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ca-k01","kind":"check","territory":"map-ca","roles":["*"],"area":"II.C","fact":"ca-revival-rumour-response","q":"Ottawa insiders say the dead federal AI bill is coming back, and clients ask whether to stand up a compliance program now. Your call?","options":["No binding duties exist or are tabled — track developments rather than build to a ghost statute","Begin conformity assessments now to get ahead of enactment","Adopt the EU AI Act wholesale as a proxy for the coming Canadian law"],"answer":"No binding duties exist or are tabled — track developments rather than build to a ghost statute","why":"The nearest confusable is (b), the comply-now trap: AIDA died at the January 2025 prorogation and no successor text exists to comply WITH — building conformity machinery against a rumour misallocates capital. Voluntarily adopting good practice differs from (c)'s pretence that EU law maps onto a nonexistent Canadian statute.","citation":"ISED — AIDA (Bill C-27) companion document; prorogation 2025-01-06","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-br-s01","kind":"gate","territory":"map-br","roles":["*"],"area":"II.C","fact":"br-pl2338-still-pending","q":"Where does Brazil's risk-based AI bill stand as of August 2026?","options":["Approved by the Senate in December 2024, still before a special committee of the Chamber of Deputies — not law","In force since January 2026","Vetoed by the president after passage","Withdrawn by its sponsors pending redrafting"],"answer":"Approved by the Senate in December 2024, still before a special committee of the Chamber of Deputies — not law","why":"The nearest confusable is (b) — the Latin American framework actually in force since January 2026 is PERU's, not Brazil's. PL 2338/2023 passed the Senate on 2024-12-10 and sits 'Aguardando Parecer' in the Chamber; there has been no floor vote, veto or withdrawal.","citation":"Câmara dos Deputados — PL 2338/2023 tramitação","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-br-s02","kind":"gate","territory":"map-br","roles":["*"],"area":"II.C","fact":"br-bill-roles-not-binding","q":"Your contracts team wants to allocate 'developer', 'distributor' and 'applier' obligations for a Brazilian rollout, copying the AI bill's own language. What is the problem?","options":["Those graded role duties bind no one yet — the bill is not enacted","The bill actually uses the EU's provider-deployer-importer labels","Distributors were struck from the Senate text","The duties already apply through data-authority regulation"],"answer":"Those graded role duties bind no one yet — the bill is not enacted","why":"The nearest confusable is (d) — the ANPD is tipped to coordinate the bill's future enforcement system, but it has issued no binding AI-role duties; contracting as if the bill were law imports obligations that do not exist. The role names themselves are correctly Brazilian (b is wrong): the bill does not copy EU labels.","citation":"Câmara dos Deputados — PL 2338/2023 tramitação","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-br-s03","kind":"gate","territory":"map-br","roles":["*"],"area":"II.A","fact":"br-lgpd-governs-today","q":"Meanwhile, what actually governs an AI system processing Brazilians' personal data today?","options":["The LGPD — the general data-protection law, including its review right over automated decisions","The AI bill's high-risk chapter, applied provisionally","The EU AI Act, extraterritorially","Nothing, until the AI bill passes"],"answer":"The LGPD — the general data-protection law, including its review right over automated decisions","why":"The nearest confusable is (d), the legal-vacuum myth — no AI act does not mean no law; the LGPD's Article 20 already gives review rights over automated decisions. Provisional application (b) is not a thing in Brazilian legislative procedure, and the EU AI Act (c) reaches EU-market conduct, not domestic Brazilian processing.","citation":"LGPD (Law 13.709/2018) Art. 20","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-br-c01","kind":"consolidate","territory":"map-br","roles":["*"],"area":"II.C","fact":"br-anpd-sia-design","q":"If Brazil's bill passes as drafted, how would enforcement be organized?","options":["A national AI governance system (SIA) coordinated by the data-protection authority, the ANPD","A new standalone AI agency replacing the data-protection authority","State-level consumer bodies acting independently"],"answer":"A national AI governance system (SIA) coordinated by the data-protection authority, the ANPD","why":"The nearest confusable is (b) — the design builds on the EXISTING authority rather than replacing it: the ANPD is tipped as coordinator of the SIA, with sector regulators retained. Fragmented state-level enforcement (c) is the US pattern, not the bill's.","citation":"Câmara dos Deputados — PL 2338/2023 tramitação","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-br-c02","kind":"consolidate","territory":"map-br","roles":["*"],"area":"II.C","fact":"br-may-2026-vote-slipped","q":"A May 2026 date was set for the Chamber floor vote on Brazil's AI bill. What happened, and what is the sticking point?","options":["The vote slipped without being held — copyright remuneration remains the main fight","It passed narrowly and awaits Senate concurrence","It failed on the floor and the bill was archived"],"answer":"The vote slipped without being held — copyright remuneration remains the main fight","why":"The nearest confusable is (b) — the Senate already approved the bill in 2024; the pending step is the Chamber, and the scheduled 27 May 2026 vote simply never happened. Archiving (c) would require a floor defeat that never occurred; the bill remains live in committee.","citation":"Câmara dos Deputados — PL 2338/2023 tramitação","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-br-k01","kind":"check","territory":"map-br","roles":["*"],"area":"II.C","fact":"br-comply-now-trap","q":"Headline: 'Brazilian AI Act imminent.' A client asks whether to stand up an EU-style conformity program for Brazil this quarter. Best advice?","options":["Not yet — track the bill; today's binding work is LGPD compliance","Yes — the duties will apply retroactively once enacted","Yes — the Senate vote already made the bill binding"],"answer":"Not yet — track the bill; today's binding work is LGPD compliance","why":"The nearest confusable is (c), which mistakes bicameral progress for enactment — Senate approval in 2024 created no duties; the Chamber has not voted. Retroactive application (b) is not how the bill is drafted. Budget goes to the LGPD obligations that bind now.","citation":"Câmara dos Deputados — PL 2338/2023 tramitação; LGPD","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-pe-s01","kind":"gate","territory":"map-pe","roles":["*"],"area":"II.C","fact":"pe-first-latam-in-force","q":"Which Latin American jurisdiction has a binding general AI framework actually in force, and since when?","options":["Peru — its AI law's implementing regulation took effect in January 2026","Brazil — since the Senate vote of December 2024","Chile — under a 2025 AI statute","None; the region remains voluntary-only"],"answer":"Peru — its AI law's implementing regulation took effect in January 2026","why":"The nearest confusable is (b), the Senate-vote-as-law error — Brazil's PL 2338 is still pending in the Chamber. Peru's Law 31814 (2023) gained operative force through Supreme Decree 115-2025-PCM on 2026-01-22, making it the first binding general AI framework in the region.","citation":"Law 31814; DS 115-2025-PCM (in force 2026-01-22)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-pe-s02","kind":"gate","territory":"map-pe","roles":["*"],"area":"II.C","fact":"pe-risk-tier-structure","q":"Your product team asks how Peru's framework sorts AI uses. The structure is:","options":["Risk tiers, including prohibited uses and a high-risk band carrying heavier duties","A single horizontal duty set applying equally to every system","Sector-by-sector rules issued by each ministry","Voluntary self-classification by the operator"],"answer":"Risk tiers, including prohibited uses and a high-risk band carrying heavier duties","why":"The nearest confusable is (c) — sector-by-sector regulation is the US pattern; Peru's reglamento is a general framework with EU-flavoured tiering (prohibited and high-risk categories). Classification is legal, not self-selected (d).","citation":"Law 31814; DS 115-2025-PCM (in force 2026-01-22)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-pe-s03","kind":"gate","territory":"map-pe","roles":["*"],"area":"II.C","fact":"pe-promotion-oriented","q":"Compared with the EU AI Act, Peru's regime is best characterized as:","options":["Promotion-oriented and lighter-touch — an innovation-promoting law with risk safeguards attached","Stricter, with criminal penalties for high-risk misuse","A verbatim transposition of the EU text","Purely aspirational, with no binding force"],"answer":"Promotion-oriented and lighter-touch — an innovation-promoting law with risk safeguards attached","why":"The nearest confusable is (d), which understates it — the reglamento's duties are binding; 'promotion-oriented' describes the statute's purpose (economic and social development), not an absence of force. Option (c) overstates the EU likeness: the tiering rhymes, the weight does not.","citation":"Law 31814; DS 115-2025-PCM (in force 2026-01-22)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-pe-s04","kind":"gate","territory":"map-pe","roles":["*"],"area":"II.C","fact":"pe-developer-implementer-split","q":"Peru's regulation distinguishes actor categories. Which pairing does it use, and who bears more?","options":["Developers and implementers — with duties weighted toward those deploying high-risk uses","Providers and importers, per the EU taxonomy","Operators split into development and utilization classes","Platforms and end users, with duties on platforms"],"answer":"Developers and implementers — with duties weighted toward those deploying high-risk uses","why":"The nearest confusable is (c) — the development/utilization operator split is SOUTH KOREA's taxonomy, not Peru's. Option (b) borrows EU labels the decree does not use. The reglamento reaches developers and implementers/deployers, with the weight on high-risk deployment.","citation":"Law 31814; DS 115-2025-PCM (in force 2026-01-22)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-pe-n01","kind":"defend","territory":"map-pe","roles":["*"],"area":"II.C","fact":"pe-high-risk-duty-cluster","q":"Peru's digital-government secretariat questions your client's high-risk deployment. Which duty cluster must the response evidence?","options":["Transparency, security and audit obligations under the reglamento's high-risk band","CE marking and an EU declaration of conformity","A published bias-audit summary per the municipal hiring rule"],"answer":"Transparency, security and audit obligations under the reglamento's high-risk band","why":"The nearest confusable is (b) — CE marking and declarations of conformity are EU AI Act artifacts with no Peruvian counterpart. The published bias-audit summary (c) is NYC LL144's employer duty. Peru's decree asks for transparency, security and auditability evidence.","citation":"Law 31814; DS 115-2025-PCM (in force 2026-01-22)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-pe-n02","kind":"defend","territory":"map-pe","roles":["*"],"area":"II.C","fact":"pe-phased-entry","q":"Your client argues nothing in Peru applied before 2026, so early-2025 conduct is beyond reach. Why is that not quite right?","options":["Several provisions took effect the day after the decree's September 2025 publication; the rest followed in January 2026","The whole framework has applied since the 2023 law passed","Nothing applies until 2027 under the phase-in schedule"],"answer":"Several provisions took effect the day after the decree's September 2025 publication; the rest followed in January 2026","why":"The nearest confusable is (b) — Law 31814 (2023) was principles-level; operative duties arrived only with the reglamento, so dating everything to 2023 overreaches just as (c)'s 2027 deferral underreaches. The decree published 2025-09-09 with a phased entry ending 2026-01-22.","citation":"Law 31814; DS 115-2025-PCM (in force 2026-01-22)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-pe-c01","kind":"consolidate","territory":"map-pe","roles":["*"],"area":"II.C","fact":"pe-pcm-sgtd-governance","q":"Which body sits at the center of Peru's AI governance architecture?","options":["The Presidency of the Council of Ministers, through its digital transformation secretariat","An independent AI commission modeled on the EU AI Office","The central bank's financial-technology unit"],"answer":"The Presidency of the Council of Ministers, through its digital transformation secretariat","why":"The nearest confusable is (b) — Peru created no standalone AI office; oversight runs through the existing PCM/SGTD machinery inside the National Digital Transformation System. The central-bank framing (c) would make the regime sectoral, which it is not.","citation":"Law 31814; DS 115-2025-PCM (in force 2026-01-22)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-pe-c02","kind":"consolidate","territory":"map-pe","roles":["*"],"area":"II.C","fact":"pe-90-business-day-vacatio","q":"Peru's reglamento was published on 9 September 2025 yet is dated in force from 22 January 2026. What explains the gap?","options":["The decree set a vacatio legis of 90 business days from publication — the general framework applied once that period expired","The government postponed it by emergency decree after industry pushback","It awaited congressional ratification before it could take effect"],"answer":"The decree set a vacatio legis of 90 business days from publication — the general framework applied once that period expired","why":"The nearest confusable is (b) — no postponement ever happened; the interval was designed in from day one, and it is counted in BUSINESS days, not calendar days, which is why it stretches from September into late January. (c) misreads the instrument: a supreme decree regulating Law 31814 needs no congressional ratification.","citation":"DS 115-2025-PCM (published 2025-09-09; in force 2026-01-22)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-kr-p01","kind":"gate","territory":"map-kr","roles":["provider"],"area":"II.C","fact":"kr-high-impact-duties","q":"Your Seoul lab builds a credit-scoring model that MSIT's criteria class as high-impact AI. As the developing business, what does the Framework Act require of you before and during service?","options":["Establish a risk-management plan and ensure explainability, human oversight, user protection and documentation","Complete a third-party conformity assessment and affix a national certification mark","Publish an annual transparency report; substantive duties fall on the end user","Nothing yet — high-impact duties do not take effect until 2027"],"answer":"Establish a risk-management plan and ensure explainability, human oversight, user protection and documentation","why":"The nearest confusable is (b): a conformity-assessment-plus-marking route is the EU AI Act's machinery — Korea's Act imposes direct statutory duties on the operator with no CE-style marking. (d) transplants the EU's deferred Annex III timeline (December 2027 under the Digital Omnibus); Korea's Act has been fully in force since 2026-01-22. Note the taxonomy: an 'AI development business operator' sits roughly where the EU's provider does, but Korea's Act uses the operator terms, not the EU ones.","citation":"AI Framework Act (Act No. 20676); CSET official-text translation","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-kr-p02","kind":"gate","territory":"map-kr","roles":["provider"],"area":"II.C","fact":"kr-generative-output-marking","q":"Your generative model produces both photorealistic video of real people and obviously stylised cartoon output for the Korean market. How does the Framework Act treat the two output streams differently?","options":["Realistic synthetic output needs a visible label; clearly artificial output may carry machine-readable watermarks instead","Both streams need visible on-screen labels — no machine-readable alternative exists","Neither needs marking; Korea only requires advance notice that generative AI is in use","Only output re-shared by platforms must be marked, and the platform bears the duty"],"answer":"Realistic synthetic output needs a visible label; clearly artificial output may carry machine-readable watermarks instead","why":"The nearest confusable is (d): a platform-side verify-and-relabel duty is China's regime under the Labelling Measures and GB 45438-2025 — in Korea the duty stays with the operator. (c) confuses the separate advance-notice duty with output marking: both exist, and notice does not substitute for marking realistic content.","citation":"AI Framework Act (Act No. 20676); FPF — South Korea's New AI Framework Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-kr-p03","kind":"gate","territory":"map-kr","roles":["provider"],"area":"II.C","fact":"kr-compute-threshold-safety","q":"Your foundation model's training run exceeds the compute threshold set under Korea's Enforcement Decree. What extra obligation attaches to your business?","options":["Safety obligations for large-scale AI, including reporting the risk assessment to MSIT","Notify the Personal Information Protection Commission and pause deployment","Register the model in a public algorithm registry before launch","Obtain an operating licence from a national AI safety institute"],"answer":"Safety obligations for large-scale AI, including reporting the risk assessment to MSIT","why":"The nearest confusable is (c): registry filing is China's mechanism under its algorithm provisions — Korea's compute-threshold trigger is a safety-assurance-and-report duty owed to MSIT, the AI ministry. (b) points at the privacy regulator, which owns personal-data questions, not large-scale-AI safety; no licensing regime exists.","citation":"AI Framework Act (Act No. 20676); CSET official-text translation","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-kr-d01","kind":"gate","territory":"map-kr","roles":["deployer"],"area":"II.C","fact":"kr-utilization-operator-duties","q":"A Busan bank licenses a third-party screening model and runs it on loan applicants under its own authority. Under the Framework Act, which duties land on the bank?","options":["Safety and reliability measures plus user-protection duties, as the AI utilization business operator using the system","None — the Act binds only the business that developed the model","EU-style deployer duties, imported by reference into Korean law","Only a duty to appoint a domestic representative"],"answer":"Safety and reliability measures plus user-protection duties, as the AI utilization business operator using the system","why":"The nearest confusable is (c): Korea's Act attaches its own duty content to the bank's use — safety/reliability measures and protection of the users the model is run on — rather than importing the EU's deployer duty set; the utilization operator sits roughly where the EU deployer does, but the duties come from the Korean statute alone. (d) is the foreign-operator threshold duty, irrelevant to a domestic bank.","citation":"AI Framework Act (Act No. 20676); FPF — South Korea's New AI Framework Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-kr-d02","kind":"gate","territory":"map-kr","roles":["deployer"],"area":"II.C","fact":"kr-domestic-representative","q":"Your US company serves Korean users at scale with no establishment in Korea. What does the Framework Act add once you cross the qualifying thresholds?","options":["Appoint a domestic representative in Korea","Route the product through a locally established importer that takes over your obligations","Nothing — the Act has no reach over foreign operators","Move all Korean user data onshore before continuing service"],"answer":"Appoint a domestic representative in Korea","why":"The nearest confusable is (b): an importer that assumes responsibility for a third-country product is an EU AI Act role — Korea has no importer category; the Act reaches foreign operators affecting the Korean market directly and adds a local-representative duty above thresholds. (c) is wrong because extraterritorial application is explicit. Unlike the EU's authorised-representative duty (Art. 22), which is role-based and attaches to every third-country provider of a high-risk system regardless of scale, Korea's duty is threshold-triggered — it keys on user/revenue scale.","citation":"AI Framework Act (Act No. 20676); Cooley — South Korea's AI Basic Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-kr-d03","kind":"gate","territory":"map-kr","roles":["deployer"],"area":"II.C","fact":"kr-advance-notice","q":"Your customer-service product answers Korean consumers using a generative model. What must users receive before they interact with it?","options":["Advance notification that generative AI is being used","A copy of the operator's risk-management plan","An opt-out that routes them to a human by default","Nothing, unless MSIT has designated the generative service high-impact"],"answer":"Advance notification that generative AI is being used","why":"The nearest confusable is (d): the generative-AI transparency duty is a standalone obligation that applies regardless of high-impact designation — the two tiers trigger different duty sets. (b) confuses user-facing transparency with the high-impact operator's internal documentation, which is never handed to consumers.","citation":"AI Framework Act (Act No. 20676); CSET official-text translation","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-kr-n01","kind":"defend","territory":"map-kr","roles":["*"],"area":"II.C","fact":"kr-threshold-evidence","q":"MSIT writes asking you to evidence whether your foreign-run service crossed the thresholds that trigger the local-representative duty. What actually decides it?","options":["User numbers and revenue measured against the Enforcement Decree criteria","Training compute measured against the large-scale-AI threshold","Whether the service has been designated high-impact"],"answer":"User numbers and revenue measured against the Enforcement Decree criteria","why":"The Act has three distinct triggers that are easy to swap: the compute threshold (b) triggers the safety-report duty, and high-impact designation (c) triggers risk-management duties — the representative duty keys on user/revenue scale for foreign operators.","citation":"AI Framework Act (Act No. 20676); Cooley — South Korea's AI Basic Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-kr-n02","kind":"defend","territory":"map-kr","roles":["*"],"area":"II.C","fact":"kr-decree-labelling-methods","q":"A deficiency notice cites the way your service marks generative output. Which instrument sets out how marking must actually be done in Korea?","options":["The Enforcement Decree of the AI Basic Act","GB 45438-2025","The METI/MIC AI Guidelines for Business"],"answer":"The Enforcement Decree of the AI Basic Act","why":"GB 45438-2025 is China's mandatory labelling standard and the METI/MIC guidelines are Japan's voluntary layer — Korea's labelling methods are detailed in the Enforcement Decree, finalized and effective with the Act on 2026-01-22 after the September 2025 draft.","citation":"Enforcement Decree of the AI Basic Act; FPF — South Korea's New AI Framework Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-kr-n03","kind":"defend","territory":"map-kr","roles":["*"],"area":"II.C","fact":"kr-high-impact-criteria","q":"In an audit, MSIT probes whether your system should have been treated as high-impact all along. What determines that status?","options":["MSIT's determination weighing usage extent and the severity and frequency of risk","Whether the use case appears on an enumerated high-risk annex","The operator's own designation, with no regulator involvement"],"answer":"MSIT's determination weighing usage extent and the severity and frequency of risk","why":"The nearest confusable is (b): an enumerated use-case annex is the EU's Annex III architecture — Korea uses criteria-based determination under the Enforcement Decree, which businesses report remains vague in practice.","citation":"Enforcement Decree of the AI Basic Act; Cooley — South Korea's AI Basic Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-kr-c01","kind":"consolidate","territory":"map-kr","roles":["*"],"area":"II.C","fact":"kr-grace-period","q":"It is August 2026 and you operate in Korea. What is the realistic enforcement posture right now?","options":["Fines up to KRW 30 million exist, but MSIT is running a grace period of at least a year — enforcement generally deferred except serious-harm cases","Full administrative fines have been levied since the Act's first day in force","The Act is not yet in force, so nothing can be enforced"],"answer":"Fines up to KRW 30 million exist, but MSIT is running a grace period of at least a year — enforcement generally deferred except serious-harm cases","why":"The nearest confusable is (c), which transplants the EU's deferred Annex III timeline onto Korea — the Framework Act has applied since 2026-01-22; what is soft-pedalled in 2026 is enforcement, not applicability. That distinction (in force vs actively fined) is exactly what a compliance brief must get right.","citation":"trade.gov — South Korea AI Basic Act (grace period, fines)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-kr-c02","kind":"consolidate","territory":"map-kr","roles":["*"],"area":"II.A","fact":"kr-operator-taxonomy","q":"You brief EU colleagues on Korea. How do the Framework Act's business categories map onto the EU AI Act's?","options":["They don't map one-to-one: duties attach to 'AI business operators', subdivided into development and utilization operators that largely share duties","Korea copied provider, deployer and importer into its statute verbatim","Korea regulates only the business that develops AI; business users are out of scope"],"answer":"They don't map one-to-one: duties attach to 'AI business operators', subdivided into development and utilization operators that largely share duties","why":"The nearest confusable is (b): the EU's provider/deployer/importer split allocates sharply different duty sets per role, and Korea rejected that design — its two operator types largely share obligations, and Korea's foreign-operator domestic-representative duty is threshold-based (user/revenue scale) where the EU's authorised-representative duty (Art. 22) is role-based, attaching to every third-country provider.","citation":"AI Framework Act (Act No. 20676); CSET official-text translation","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-cn-p01","kind":"gate","territory":"map-cn","roles":["provider"],"area":"II.C","fact":"cn-interim-measures-baseline","q":"You want to launch a public-facing chatbot built on a large model in mainland China. Which instrument sets the baseline duties — training-data governance, content safety — for the service?","options":["The Interim Measures for the Management of Generative AI Services (CAC and six agencies)","The comprehensive AI law China enacted in 2026","The amended Cybersecurity Law on its own","The Model AI Governance Framework"],"answer":"The Interim Measures for the Management of Generative AI Services (CAC and six agencies)","why":"The nearest confusable is (b): no unified AI statute exists in China as of August 2026 — comprehensive-law drafting has only been accelerated on the 2026 legislative agenda. (c) adds AI safe-development language but is not the operative service-level rulebook; (d) is Singapore's voluntary framework. The Interim Measures have been in force since 2023-08-15.","citation":"Interim Measures for Generative AI Services (CAC); White & Case — AI Watch China","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-cn-p02","kind":"gate","territory":"map-cn","roles":["provider"],"area":"II.C","fact":"cn-algorithm-filing","q":"Before your recommendation and generation algorithms serve the Chinese public, what administrative step do China's algorithm provisions require?","options":["File the algorithm with the CAC registry","Affix a conformity mark after a self-assessment against essential requirements","Obtain a court order authorising deployment","Publish the model weights for public inspection"],"answer":"File the algorithm with the CAC registry","why":"The nearest confusable is (b): self-assessment-plus-marking is the EU internal-control conformity route — China's mechanism is administrative filing in a regulator-run registry (Algorithm Recommendation Provisions, in force 2022-03-01), and public-facing generative services file too: 796 had completed filing as of 2026-02-28. Filing is not certification and not CE marking.","citation":"Algorithm Recommendation Provisions; ICLG 2026 — China AI governance developments","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-cn-p03","kind":"gate","territory":"map-cn","roles":["provider"],"area":"II.C","fact":"cn-deep-synthesis-in-force","q":"Your product lets users swap faces in video for the Chinese market. Which rules first imposed consent, marking and filing duties on this technology — and what is their status now?","options":["The Deep Synthesis Provisions (in force since January 2023) — still in force alongside the 2025 labelling measures","The Deep Synthesis Provisions, but they were repealed when the 2025 labelling measures took effect","The Interim Measures for generative services — deepfakes have no dedicated Chinese rules","GB 45438-2025 is the only instrument covering synthetic media"],"answer":"The Deep Synthesis Provisions (in force since January 2023) — still in force alongside the 2025 labelling measures","why":"The nearest confusable is (b): the layering is the tested fact — China stacks instruments rather than replacing them, so the Deep Synthesis Provisions (eff. 2023-01-10) operate alongside the Labelling Measures and GB 45438-2025. Assuming the newer measure supersedes the older is the classic error in this regime.","citation":"Provisions on Deep Synthesis Internet Information Services; ICLG 2026 — China AI governance developments","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-cn-p04","kind":"gate","territory":"map-cn","roles":["provider"],"area":"II.C","fact":"cn-labelling-gb45438","q":"From September 2025, what must your generation service itself apply to synthetic output destined for Chinese users?","options":["Both explicit visible labels and implicit metadata labels, per the Labelling Measures and mandatory standard GB 45438-2025","A visible label only where the content is realistic; machine-readable marks suffice for clearly artificial output","Marks only when a user requests them","Nothing — marking duties fall solely on the distribution platform"],"answer":"Both explicit visible labels and implicit metadata labels, per the Labelling Measures and mandatory standard GB 45438-2025","why":"The nearest confusable is (b): the realistic-vs-clearly-artificial distinction is Korea's rule under its Framework Act — China requires BOTH label types on generated output regardless. (d) inverts the duty split: platforms have their own verify-and-relabel obligations, but that supplements rather than replaces the generator's duty.","citation":"Measures for Labeling AI-Generated Synthetic Content + GB 45438-2025 (eff. 2025-09-01)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-cn-p05","kind":"gate","territory":"map-cn","roles":["provider"],"area":"II.C","fact":"cn-security-assessment","q":"Your chatbot can shape public opinion at scale. Beyond registry paperwork, what pre-launch hurdle applies to public-facing services like this in China?","options":["A security assessment under the Interim Measures before offering the service to the public","A notified-body conformity assessment","A fundamental rights impact assessment","A voluntary AI Verify test report"],"answer":"A security assessment under the Interim Measures before offering the service to the public","why":"The nearest confusable is (b): third-party conformity assessment is the EU's reserved route for certain biometric systems — China's gate for services with public-opinion attributes is a regulator-facing security assessment paired with filing. (c) is the EU deployer's FRIA; (d) is Singapore's voluntary assurance tooling.","citation":"Interim Measures for Generative AI Services (CAC); White & Case — AI Watch China","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-cn-n01","kind":"defend","territory":"map-cn","roles":["*"],"area":"II.C","fact":"cn-training-data-governance","q":"A regulator audit letter targets your model's training corpus. Under the Interim Measures, what must you show about the data?","options":["That sources were lawful — respecting intellectual property and personal-information rights","Only that the data was stored on servers inside China","Nothing — training data sits outside the scope of the generative-AI rules"],"answer":"That sources were lawful — respecting intellectual property and personal-information rights","why":"The nearest confusable is (b): data localisation is a Cybersecurity Law / Data Security Law concern — the Interim Measures' training-data governance duty is about source legality, IP and personal-information compliance, and training data is expressly in scope (contrary to (c)).","citation":"Interim Measures for Generative AI Services (CAC)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-cn-n02","kind":"defend","territory":"map-cn","roles":["*"],"area":"II.C","fact":"cn-platform-relabel","q":"An inspection finds your service's output stripped of its hidden marks when re-shared on a Chinese platform. Who must check and re-mark such content, and under what?","options":["The distribution platform, which must verify and re-label under the Labelling Measures and GB 45438-2025","Only the original generation service — platforms carry no marking duties","No one — implicit marks are optional under Chinese law"],"answer":"The distribution platform, which must verify and re-label under the Labelling Measures and GB 45438-2025","why":"The nearest confusable is (b), which describes Korea's operator-only duty design — China uniquely extends verification and re-labelling duties to distribution platforms. Implicit metadata labels are mandatory, not optional, so (c) fails too.","citation":"Measures for Labeling AI-Generated Synthetic Content + GB 45438-2025 (eff. 2025-09-01)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-cn-c01","kind":"consolidate","territory":"map-cn","roles":["*"],"area":"II.C","fact":"cn-no-unified-statute","q":"A director asks whether China has 'an AI Act'. What is the accurate answer in August 2026?","options":["No unified statute — a stack of binding sectoral measures (generative services, deep synthesis, recommendation algorithms, content labelling) governs instead","Yes — a comprehensive AI law took effect on 2026-01-01","No — AI in China is governed only by voluntary guidance"],"answer":"No unified statute — a stack of binding sectoral measures (generative services, deep synthesis, recommendation algorithms, content labelling) governs instead","why":"The nearest confusable is (b): what took effect on 2026-01-01 is the amended Cybersecurity Law with AI safe-development provisions — not a comprehensive AI statute. (c) confuses China with Japan or Singapore: China's measures are fully binding, just not consolidated.","citation":"State Council 2026 Legislative Work Plan; White & Case — AI Watch China","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-cn-c02","kind":"consolidate","territory":"map-cn","roles":["*"],"area":"II.C","fact":"cn-csl-amendment-agenda","q":"What changed at the statute level in China during 2026, and what is on the horizon?","options":["The amended Cybersecurity Law with AI safe-development provisions took effect 2026-01-01, and comprehensive-AI-law drafting was formally accelerated in the May 2026 legislative work plans","A comprehensive AI law was enacted in May 2026","Nothing — Chinese AI rulemaking is frozen pending the unified law"],"answer":"The amended Cybersecurity Law with AI safe-development provisions took effect 2026-01-01, and comprehensive-AI-law drafting was formally accelerated in the May 2026 legislative work plans","why":"The nearest confusable is (b): the State Council's 'accelerate comprehensive legislation' commitment is a drafting agenda, not an enactment — no unified statute is in force as of 2026-08-02. The CSL amendment (adopted by the NPC Standing Committee 2025-10-28) is real but is an amendment to existing law, not the awaited AI act.","citation":"NPC — Cybersecurity Law amendment; State Council 2026 Legislative Work Plan","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-jp-s01","kind":"gate","territory":"map-jp","roles":["*"],"area":"II.C","fact":"jp-no-business-duties","q":"Entering Japan, you ask counsel what the AI Promotion Act obliges your company to do. What is the accurate answer?","options":["Nothing enforceable — the sole private-sector clause is a non-binding effort duty to cooperate, and the statute carries no penalties","Register high-risk systems with METI before deployment","Undergo third-party conformity assessment for generative systems","Nothing, because Japan has no AI legislation at all"],"answer":"Nothing enforceable — the sole private-sector clause is a non-binding effort duty to cooperate, and the statute carries no penalties","why":"The nearest confusable is (d), the outdated claim: Japan HAS a binding statute — the AI Promotion Act (Act No. 53 of 2025), in force since 2025-06-04 — it just imposes no business obligations. (b) and (c) import EU-style registration and conformity machinery that Japan deliberately never adopted.","citation":"AI Promotion Act (Act No. 53 of 2025); Cabinet Office ai_act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-jp-s02","kind":"gate","territory":"map-jp","roles":["*"],"area":"II.C","fact":"jp-guidelines-operative-layer","q":"If Japan's statute imposes nothing on business, where does its operative AI governance actually live?","options":["In the voluntary METI/MIC AI Guidelines for Business, backed by existing laws such as the APPI, copyright and product liability","In binding Cabinet ordinances issued under the Promotion Act","In prefecture-level AI ordinances","In mandatory business codes issued by the AI Strategy Headquarters"],"answer":"In the voluntary METI/MIC AI Guidelines for Business, backed by existing laws such as the APPI, copyright and product liability","why":"The nearest confusable is (b)/(d): the Act does create government machinery — the AI Strategy Headquarters and the AI Basic Plan (adopted by Cabinet 2025-12-23) — but that machinery directs the state, not business. The operative layer for companies is agile, voluntary guidance riding on general law.","citation":"AI Guidelines for Business (METI/MIC); FPF — Understanding Japan's AI Promotion Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-jp-s03","kind":"gate","territory":"map-jp","roles":["*"],"area":"II.C","fact":"jp-name-no-fines","q":"Under the Promotion Act, what CAN the Japanese government do about a company whose AI causes serious harm?","options":["Investigate and publicly name malicious cases — but impose no fines","Levy administrative fines of up to 3% of global turnover","Suspend the service by ministerial order","Order a mandatory recall of the AI system"],"answer":"Investigate and publicly name malicious cases — but impose no fines","why":"The nearest confusable is (b): a 3%-of-turnover fining power is the EU Commission's GPAI enforcement tool — Japan's act contains no monetary penalties at all. Reputational naming after investigation is the only teeth; there is no suspension or recall power in the statute.","citation":"AI Promotion Act (Act No. 53 of 2025); White & Case — Japan's first AI legislation","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-jp-c01","kind":"consolidate","territory":"map-jp","roles":["*"],"area":"II.C","fact":"jp-act-dates","q":"Pin the dates: when did Japan's first AI statute pass and take effect?","options":["Passed by the Diet 2025-05-28; main provisions in force 2025-06-04; institutional chapters 2025-09-01","Passed December 2025; in force January 2026","Still a pending bill as of August 2026"],"answer":"Passed by the Diet 2025-05-28; main provisions in force 2025-06-04; institutional chapters 2025-09-01","why":"The nearest confusable is (b), which is Taiwan's AI Basic Act timeline (passed 2025-12-23, effective 2026-01-14) — the two Asian framework statutes are easy to swap because they share the no-business-duties design.","citation":"AI Promotion Act (Act No. 53 of 2025); e-Gov law text","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-jp-c02","kind":"consolidate","territory":"map-jp","roles":["*"],"area":"II.C","fact":"jp-statute-vs-obligation-pattern","q":"'Japan has an AI law, so we need a compliance programme like our EU one.' What is wrong with that reasoning?","options":["It equates having a statute with having obligations — Japan's act promotes and coordinates but binds only the state","Nothing — the statement is correct","It is wrong because Japan's AI law was repealed in 2026"],"answer":"It equates having a statute with having obligations — Japan's act promotes and coordinates but binds only the state","why":"The pattern recurs in Taiwan's Basic Act — statute in force, business duties absent — so 'has an AI law' is never sufficient for a compliance trigger. In Japan the trigger for companies remains general law (APPI, product liability), not the AI statute, and nothing was repealed.","citation":"AI Promotion Act (Act No. 53 of 2025); FPF — Understanding Japan's AI Promotion Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-au-s01","kind":"gate","territory":"map-au","roles":["*"],"area":"II.C","fact":"au-tech-neutral-law","q":"Which instruments actually bind your private-sector AI deployment in Australia?","options":["Existing technology-neutral laws — privacy, consumer and anti-discrimination — enforced by sector regulators","The Voluntary AI Safety Standard, which became mandatory in 2025","The Australian AI Act passed alongside the National AI Plan","The mandatory AI requirements for Commonwealth agencies"],"answer":"Existing technology-neutral laws — privacy, consumer and anti-discrimination — enforced by sector regulators","why":"The nearest confusable is (d): the Commonwealth-agency requirements ARE binding (first requirements 2026-06-15) but only on federal agencies, never on the private sector. (b) and (c) never happened — the guidance stack stayed voluntary (the AI6 Guidance for AI Adoption superseded the 2024 standard in October 2025) and no AI act exists.","citation":"National AI Plan (Dec 2025); Guidance for AI Adoption (AI6)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-au-s02","kind":"gate","territory":"map-au","roles":["*"],"area":"II.C","fact":"au-guardrails-abandoned","q":"What did the December 2025 National AI Plan decide about the 2024 proposal for mandatory guardrails on high-risk AI?","options":["It abandoned the proposal — no standalone AI act; reliance on existing law plus a new advisory AI Safety Institute","It scheduled the proposal's guardrails to commence in 2027","It converted the guardrails into a binding standard with immediate effect","It referred the guardrails to the states and territories to legislate"],"answer":"It abandoned the proposal — no standalone AI act; reliance on existing law plus a new advisory AI Safety Institute","why":"The nearest confusable is (b), the stale-news trap: 2024 reporting made mandatory guardrails look inevitable, but the National AI Plan formally dropped them. The Australian AI Safety Institute (launched early 2026, AUD 29.9m) is advisory, not a regulator — no enforcement powers came with it.","citation":"National AI Plan (Dec 2025); Australia walks away from mandatory AI guardrails","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-au-c01","kind":"consolidate","territory":"map-au","roles":["*"],"area":"II.C","fact":"au-agency-only-rules","q":"Australia does have binding AI rules starting June 2026 — for whom?","options":["Commonwealth agencies only — impact assessments, accountable officials and training, phasing to full compliance by 2026-12-15","All deployers of high-risk AI nationwide","Foreign AI providers serving Australian users"],"answer":"Commonwealth agencies only — impact assessments, accountable officials and training, phasing to full compliance by 2026-12-15","why":"This government-internal DTA policy is the confusable that fuels 'Australia went mandatory' claims — it binds federal agencies as an administrative policy, while the private sector remains under voluntary guidance and general law. Note the date discipline: agency full compliance is 2026-12-15, distinct from the Privacy Act ADM date in December 2026.","citation":"DTA policy for responsible use of AI in government v2.0","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-au-c02","kind":"consolidate","territory":"map-au","roles":["*"],"area":"II.C","fact":"au-privacy-adm-dec2026","q":"Which binding change lands on 10 December 2026 for Australian companies using automated decisions?","options":["Privacy Act transparency obligations for automated decision-making commence (tranche-1 reform)","The AI Safety Institute gains enforcement powers","Mandatory guardrails for high-risk AI take effect"],"answer":"Privacy Act transparency obligations for automated decision-making commence (tranche-1 reform)","why":"The nearest confusable is (c), the abandoned proposal — the December 2026 change comes from the Privacy and Other Legislation Amendment Act 2024, existing law adapting to AI, not an AI statute. The AI Safety Institute stays advisory; it gained no powers.","citation":"Privacy and Other Legislation Amendment Act 2024 (ADM transparency)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-au-k01","kind":"check","territory":"map-au","roles":["*"],"area":"II.C","fact":"au-still-voluntary-trap","q":"An adviser urges you to pre-comply now because Australia's mandatory AI guardrails 'are about to commence'. What is the true status?","options":["Still voluntary — and the mandatory-guardrails proposal was formally dropped in the December 2025 National AI Plan","The adviser is right — the guardrails commence within months","Partly right — the guardrails bind only foreign providers"],"answer":"Still voluntary — and the mandatory-guardrails proposal was formally dropped in the December 2025 National AI Plan","why":"The adviser is working from stale 2024 reporting on the proposals paper. The only binding accents in Australia are government-internal agency rules (from 2026-06-15) and the Privacy Act ADM transparency change (December 2026) — neither is 'AI guardrails', and neither touches ordinary private-sector deployment.","citation":"National AI Plan (Dec 2025); Australia walks away from mandatory AI guardrails","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-in-s01","kind":"gate","territory":"map-in","roles":["*"],"area":"II.C","fact":"in-meity-guidelines-nonbinding","q":"What is the legal weight of the India AI Governance Guidelines that MeitY released in November 2025?","options":["An official but non-enforceable framework — light-touch and pro-innovation, with harms handled through existing law","Binding rules enforceable with penalties by MeitY","A draft that was never officially adopted","A state-level framework applying only in a few states"],"answer":"An official but non-enforceable framework — light-touch and pro-innovation, with harms handled through existing law","why":"The confusables are 'official' and 'binding' pulling in opposite directions: the Guidelines are genuinely government-issued (under the IndiaAI Mission) yet voluntary — India's binding instruments are general and sectoral laws (DPDP, IT Rules), never the Guidelines themselves.","citation":"MeitY India AI Governance Guidelines (Nov 2025)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-in-s02","kind":"gate","territory":"map-in","roles":["*"],"area":"II.C","fact":"in-dpdp-phasing","q":"Your model trains on Indian users' personal data. Which binding regime governs that today, and where is it in its rollout?","options":["The DPDP Act, with Rules notified 2025-11-13 — phased, with core data-fiduciary duties landing around mid-2027","The Artificial Intelligence (Ethics and Accountability) Act, in force since December 2025","No binding regime — India relies wholly on voluntary guidelines","The EU GDPR, applied extraterritorially to Indian residents"],"answer":"The DPDP Act, with Rules notified 2025-11-13 — phased, with core data-fiduciary duties landing around mid-2027","why":"The nearest confusable is (b): that bill is a private member's bill introduced in the Lok Sabha in December 2025, not enacted law. The DPDP regime is not AI-specific, but its consent requirements reach personal data used for model training — which is exactly why (c) is wrong.","citation":"DPDP Rules 2025 (notified 2025-11-13); AZB — DPDP phased rollout","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-in-s03","kind":"gate","territory":"map-in","roles":["*"],"area":"II.C","fact":"in-it-rules-deepfake-labelling","q":"Does India have any binding AI-specific rules in force in August 2026?","options":["Yes — the IT Amendment Rules 2026 require intermediaries to prominently label synthetically generated content, in force since 2026-02-20","Yes — a comprehensive AI statute took effect in 2026","No — everything AI-related in India is voluntary","Yes — the MeitY Guidelines became binding during 2026"],"answer":"Yes — the IT Amendment Rules 2026 require intermediaries to prominently label synthetically generated content, in force since 2026-02-20","why":"The nearest confusable is (c), over-applying India's 'voluntary' label: accurate for the horizontal framework, but the deepfake-labelling rules under the IT Act (Gazette notification February 2026) are binding and AI-specific — user declarations, prominent labels, provenance metadata where feasible. No comprehensive AI statute exists and the Guidelines never hardened.","citation":"IT Amendment Rules 2026 (G.S.R. 120(E), in force 2026-02-20)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-in-c01","kind":"consolidate","territory":"map-in","roles":["*"],"area":"II.C","fact":"in-regime-layering","q":"Summarise India's AI-governance position correctly for a board briefing.","options":["Voluntary horizontal guidelines, a binding general data-protection regime phasing in, and binding synthetic-content rules — but no AI statute","A single AI Act covering all of it since 2025","No official position at all — India has not addressed AI governance"],"answer":"Voluntary horizontal guidelines, a binding general data-protection regime phasing in, and binding synthetic-content rules — but no AI statute","why":"The nearest confusable is (c), the old 'none' classification — outdated since MeitY's official framework of November 2025. India is a layered regime, not a statute regime: what binds is general law (DPDP) and sectoral rules (IT Amendment Rules), while the AI-wide layer stays voluntary.","citation":"MeitY India AI Governance Guidelines (Nov 2025); DPDP Rules 2025","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-in-c02","kind":"consolidate","territory":"map-in","roles":["*"],"area":"II.C","fact":"in-private-members-bill","q":"The 'Artificial Intelligence (Ethics and Accountability) Bill, 2025' appears in your India news scan. How should you weight it?","options":["Low — a private member's bill introduced in the Lok Sabha in December 2025, not enacted and unlikely to pass","High — bills of this kind are typically enacted within months","It already passed and takes effect in 2027"],"answer":"Low — a private member's bill introduced in the Lok Sabha in December 2025, not enacted and unlikely to pass","why":"The discriminator is private member's bill versus government instrument: contrast the DPDP Rules, which MeitY notified and which ARE binding and phasing in. Treating every introduced bill as pending law is the horizon-scanning error this card trains against.","citation":"AI (Ethics and Accountability) Bill 2025 — Lok Sabha private member's bill","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-sg-s01","kind":"gate","territory":"map-sg","roles":["*"],"area":"II.C","fact":"sg-model-framework-voluntary","q":"Singapore's flagship AI-governance instruments carry what legal force?","options":["None — the Model AI Governance Framework and its GenAI edition are voluntary","Binding on all AI developers through the PDPA","Binding once a company self-certifies against them","Mandatory for government vendors only"],"answer":"None — the Model AI Governance Framework and its GenAI edition are voluntary","why":"The nearest confusable is (b): the PDPA is binding law, but it is general data protection — the Model Framework (2nd ed. 2020) and GenAI edition (May 2024) sit on top of it voluntarily. No self-certification mechanism converts them into obligations; Singapore is the deliberate voluntary exemplar.","citation":"Model AI Governance Framework + GenAI edition; GLI 2026 — Singapore","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-sg-s02","kind":"gate","territory":"map-sg","roles":["*"],"area":"II.B","fact":"sg-ai-verify","q":"What is AI Verify, and what does using it commit your company to?","options":["An open-source testing framework and toolkit — process checks plus technical tests, with no legal commitment","A government licensing scheme for AI deployment","Singapore's mandatory conformity-assessment body","A binding audit standard issued under MAS FEAT"],"answer":"An open-source testing framework and toolkit — process checks plus technical tests, with no legal commitment","why":"The nearest confusable is (c): 'conformity assessment' is EU-route thinking — AI Verify (IMDA, open-sourced 2023 under the AI Verify Foundation) is voluntary assurance tooling, not a gatekeeper. MAS FEAT (d) is sectoral guidance for financial institutions and is likewise non-binding.","citation":"AI Verify testing framework + toolkit (IMDA / AI Verify Foundation)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-sg-s03","kind":"gate","territory":"map-sg","roles":["*"],"area":"II.C","fact":"sg-agentic-framework","q":"In January 2026 at Davos, IMDA launched a world-first governance instrument. For what technology, and with what force?","options":["Agentic AI — a voluntary Model framework, the first of its kind anywhere","Agentic AI — binding rules with penalties","Generative AI — that edition was the 2026 launch","Autonomous vehicles — a mandatory certification scheme"],"answer":"Agentic AI — a voluntary Model framework, the first of its kind anywhere","why":"The nearest confusable is (c), a date slip: the GenAI edition dates from May 2024 — the 2026-01-22 Davos launch was the Model AI Governance Framework for Agentic AI, non-binding like the rest of Singapore's stack (and updated with industry feedback on 2026-05-20).","citation":"IMDA — Model AI Governance Framework for Agentic AI (2026-01-22)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-sg-c01","kind":"consolidate","territory":"map-sg","roles":["*"],"area":"II.C","fact":"sg-binding-via-general-law","q":"Where do binding obligations for your Singapore AI deployment actually come from?","options":["Existing general laws — the PDPA and sectoral regimes — with regulators issuing AI guidance under them","The Model AI Governance Framework, once IMDA endorses your use case","AI Verify test reports filed with IMDA"],"answer":"Existing general laws — the PDPA and sectoral regimes — with regulators issuing AI guidance under them","why":"The confusable is mistaking sector guidance (MAS FEAT/Veritas, MOH healthcare guidelines) for standalone AI law — that guidance interprets existing binding statutes; the AI-specific layer itself never binds. There is no IMDA endorsement or filing mechanism that creates obligations.","citation":"GLI 2026 — Singapore; Mayer Brown mid-year checkpoint 2026","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-sg-c02","kind":"consolidate","territory":"map-sg","roles":["*"],"area":"II.C","fact":"sg-kr-same-day-contrast","q":"On 22 January 2026, two Asian jurisdictions made AI-governance news on the same day. What is the contrast?","options":["Korea's binding AI Framework Act entered into force while Singapore launched another voluntary framework — for agentic AI","Both enacted binding AI statutes that day","Singapore enacted a binding statute while Korea launched voluntary guidance"],"answer":"Korea's binding AI Framework Act entered into force while Singapore launched another voluntary framework — for agentic AI","why":"The trap is the reversal in (c) — Singapore is the voluntary exemplar and Korea the comprehensive-law jurisdiction. The date coincidence makes a clean memory anchor for Asia's two diverging governance tracks.","citation":"IMDA — Agentic AI framework press release; AI Framework Act (Act No. 20676)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tw-s01","kind":"gate","territory":"map-tw","roles":["*"],"area":"II.C","fact":"tw-basic-act-in-force","q":"What is the status of Taiwan's AI Basic Act in August 2026?","options":["Passed on third reading 2025-12-23, promulgated and in force since 2026-01-14","Still the stalled 2024 NSTC draft, not yet passed","Passed, but not effective until sector rules issue","Vetoed by the President in January 2026"],"answer":"Passed on third reading 2025-12-23, promulgated and in force since 2026-01-14","why":"The nearest confusable is (b), the outdated claim — the bill did stall for years as the NSTC draft, but the Legislative Yuan passed it in December 2025 and President Lai promulgated it effective 2026-01-14. (c) confuses the statute's effectiveness with the arrival of business duties: the Act took effect on promulgation; the duties are what await sector rules.","citation":"MODA press release; LoC Global Legal Monitor — Taiwan AI Basic Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tw-s02","kind":"gate","territory":"map-tw","roles":["*"],"area":"II.C","fact":"tw-nstc-moda-split","q":"Your Taipei subsidiary asks which agency it will ultimately answer to under the AI Basic Act, and which one owes it the coming risk framework. The correct split is:","options":["The NSTC is the central competent authority; MODA is tasked with building the risk-classification framework","MODA is the central competent authority; the NSTC drafts the risk framework","A newly created dedicated AI commission holds both roles","Each sector regulator is its own central authority — there is no centre"],"answer":"The NSTC is the central competent authority; MODA is tasked with building the risk-classification framework","why":"The nearest confusable is (b), the exact inversion — MODA is the digital ministry and looks like the natural lead, but the Act seats central competence with the science and technology council (NSTC) and delegates the internationally aligned risk-classification framework to MODA (Q1 2026 target, slipping). No new AI commission exists (c), and sector regulators (d) act only under the coming framework.","citation":"AI Basic Act (promulgated 2026-01-14); LoC Global Legal Monitor — Taiwan AI Basic Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tw-s03","kind":"gate","territory":"map-tw","roles":["*"],"area":"II.C","fact":"tw-act-contents","q":"What does Taiwan's AI Basic Act actually contain?","options":["Seven governance principles, NSTC as central authority, MODA tasked with a risk framework, and implementing measures due within 24 months","A high-risk use-case annex with conformity-assessment requirements","Fines of up to NT$30 million for non-compliant developers","A licensing regime for foundation models"],"answer":"Seven governance principles, NSTC as central authority, MODA tasked with a risk framework, and implementing measures due within 24 months","why":"The nearest confusable is (b): an enumerated high-risk annex with conformity assessment is the EU AI Act's architecture — Taiwan chose principles-plus-delegation instead (sustainability, human autonomy, privacy, security, transparency, fairness, accountability). The Act contains no fines on business and no licensing.","citation":"MODA press release; LoC Global Legal Monitor — Taiwan AI Basic Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tw-c01","kind":"consolidate","territory":"map-tw","roles":["*"],"area":"II.C","fact":"tw-japan-pattern","q":"Which other jurisdiction's approach does Taiwan's Basic Act most resemble, and why?","options":["Japan's — a binding framework statute in force that imposes no business obligations or penalties","Korea's — comprehensive operator duties applying from day one","The EU's — enforceable risk tiers with provider obligations"],"answer":"Japan's — a binding framework statute in force that imposes no business obligations or penalties","why":"The tempting neighbour-match (b) is the opposite pattern: Korea's Framework Act carries operative duties, fines and extraterritorial reach from commencement. Taiwan and Japan share the statute-without-business-duties design — law on the books, obligations delegated to the future.","citation":"AI Basic Act (promulgated 2026-01-14); Baker McKenzie — Taiwan AI Basic Act","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-tw-c02","kind":"consolidate","territory":"map-tw","roles":["*"],"area":"II.C","fact":"tw-duties-via-future-rules","q":"When should you expect business-facing AI obligations in Taiwan, and from where?","options":["Via MODA's risk-classification framework and sector rules — the Act gives a 24-month window for implementing measures, to roughly early 2028","They took effect together with the Act in January 2026","Never — the Act forecloses sectoral AI regulation"],"answer":"Via MODA's risk-classification framework and sector rules — the Act gives a 24-month window for implementing measures, to roughly early 2028","why":"The nearest confusable is (b), the statute-equals-duties error this territory exists to break. The compliance action today is monitoring: the MODA risk framework had a Q1 2026 public target that appears to be slipping, and sector regulators legislate only after it lands.","citation":"AI Basic Act (promulgated 2026-01-14); MODA press release","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ae-s01","kind":"gate","territory":"map-ae","roles":["*"],"area":"II.C","fact":"ae-difc-reg10-scope","q":"Your client operates credit-scoring AI from the DIFC in Dubai and asks what binding AI-specific rules apply in August 2026. What is the correct scope answer?","options":["Regulation 10 of the DIFC data-protection regime — duties for autonomous and semi-autonomous systems, enforced in full since January 2026","A horizontal UAE federal AI act applying across all seven emirates","The UAE AI Charter, which imposes twelve enforceable obligations","No rules at all — the UAE governs AI purely by strategy documents"],"answer":"Regulation 10 of the DIFC data-protection regime — duties for autonomous and semi-autonomous systems, enforced in full since January 2026","why":"The nearest confusable is (b): no horizontal UAE AI statute exists — the June 2026 federal body is a regulator, not an act. (c) inverts the Charter, which is aspirational. (d) ignores that one binding instrument does exist, but only inside the financial free zone.","citation":"DIFC Data Protection Regulations, Regulation 10 (full enforcement from 2026-01-01)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ae-s02","kind":"gate","territory":"map-ae","roles":["*"],"area":"II.C","fact":"ae-federal-authority-2026","q":"In June 2026 Sheikh Mohammed announced a major federal AI initiative. What did it actually create?","options":["A unified federal regulator for AI, digital government and data — an institutional step, with no horizontal AI statute attached","A binding federal AI act with penalties effective immediately","An extension of the DIFC's autonomous-systems rules to the whole country","A voluntary industry council with no regulatory mandate"],"answer":"A unified federal regulator for AI, digital government and data — an institutional step, with no horizontal AI statute attached","why":"The nearest confusable is (b) — regulator is not statute: the 2026-06-14 announcement created the Federal Authority for Artificial Intelligence and Data, while the UAE still has no horizontal AI law. (c) is wrong because Regulation 10 stays scoped to the DIFC free zone.","citation":"Federal Authority for Artificial Intelligence and Data (announced 2026-06-14)","asOf":"2026-08-02","externalSource":true},{"id":"ii-rr-ae-s03","kind":"gate","territory":"map-ae","roles":["*"],"area":"II.C","fact":"ae-charter-nonbinding","q":"Procurement asks whether the UAE Charter for the Development and Use of AI creates compliance obligations for your product. What is the correct answer?","options":["No — twelve aspirational principles with no enforcement machinery behind them","Yes — it carries the same fines as the DIFC's autonomous-systems rules","Yes, but only for government entities in Abu Dhabi","No, because it was repealed when the federal AI authority was announced"],"answer":"No — twelve aspirational principles with no enforcement machinery behind the
