<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azure AI Fundamentals</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="icon" type="image/svg+xml" href="assets/misc/favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#15161a; --panel:#1c1e24; --panel2:#24262e; --line:#f0f0f0; --edge:#f0f0f0;
  --ink:#f0f0f0; --dim:#a9a9b2; --primary:#facc15; --secondary:#fd933d;
  --ok:#3ecf7a; --bad:#ff5d5d; --warn:#fd933d; --radius:0px; --shadow:4px; --shadow-lg:8px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f9f9f9; --panel:#ffffff; --panel2:#eeeeee; --line:#111111; --edge:#111111;
         --ink:#111111; --dim:#4d4632; }
}
:root[data-theme=light]{ --bg:#f9f9f9; --panel:#ffffff; --panel2:#eeeeee; --line:#111111;
  --edge:#111111; --ink:#111111; --dim:#4d4632; }
:root[data-theme=dark]{ --bg:#15161a; --panel:#1c1e24; --panel2:#24262e; --line:#f0f0f0;
  --edge:#f0f0f0; --ink:#f0f0f0; --dim:#a9a9b2; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 "Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
header{position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:4px solid var(--edge);padding:12px 16px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font-size:17px;margin:0;letter-spacing:-.3px;text-transform:uppercase;font-weight:700}
.brand .sub{color:var(--dim);font-size:12px}
.home-link{color:var(--ink);font-size:13px;font-weight:700;text-transform:uppercase;
  text-decoration:none;border:2px solid var(--edge);background:var(--panel);
  padding:5px 12px;white-space:nowrap}
.home-link:hover{background:var(--primary);color:#1a1c1c}
.brand-social{display:flex;align-items:center;gap:10px;margin-left:auto}
.brand-social a{display:inline-flex;align-items:center;color:var(--dim)}
.brand-social a:hover{color:var(--ink)}
@media print{.brand-social{display:none}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tab{background:var(--panel);border:2px solid var(--edge);color:var(--ink);font-weight:700;
  text-transform:uppercase;font-family:inherit;padding:6px 12px;cursor:pointer;font-size:12px}
.tab[aria-selected=true]{background:var(--primary);color:#1a1c1c}
.tab:disabled{opacity:.4;cursor:not-allowed}
main{max-width:1120px;margin:0 auto;padding:18px 16px 90px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--panel);border:2px solid var(--edge);color:var(--ink);font-weight:700;
  text-transform:uppercase;font-family:inherit;padding:7px 13px;cursor:pointer;font-size:12px}
.chip[aria-selected=true]{background:var(--primary);color:#1a1c1c}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--panel);border:3px solid var(--edge);box-shadow:var(--shadow) var(--shadow) 0 0 var(--edge);
  padding:14px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;
  transition:transform .1s,box-shadow .1s}
.card:hover{transform:translate(var(--shadow),var(--shadow));box-shadow:0 0 0 0 var(--edge)}
.card h3{margin:0 0 4px;font-size:15px;font-weight:700;text-transform:uppercase}
.card p{margin:0;color:var(--dim);font-size:13px}
.rung{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;
  font-weight:700;color:var(--secondary);margin-bottom:6px}
.meter{height:6px;background:var(--panel2);border:1px solid var(--edge);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary)}
.panel{background:var(--panel);border:4px solid var(--edge);
  box-shadow:var(--shadow-lg) var(--shadow-lg) 0 0 var(--edge);padding:18px}
.hint{color:var(--dim);font-size:13px;margin:0 0 14px}
.service-identity{display:flex;align-items:center;gap:14px;background:var(--panel2);
  border:2px solid var(--edge);padding:12px 14px;margin-bottom:14px}
.service-identity img{width:44px;height:44px;flex-shrink:0;border:1px solid var(--edge);
  background:#fff;padding:3px;object-fit:contain}
.service-identity label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  font-weight:700;color:var(--dim)}
.service-identity select{margin-top:4px;background:var(--panel);border:2px solid var(--edge);
  color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;padding:6px 8px;max-width:100%}

/* ---- board ---- */
.bank{background:var(--panel2);border:2px dashed var(--edge);
  padding:12px;min-height:64px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.bank:empty::after{content:"Bank empty — every card placed";color:var(--dim);font-size:13px}
.tok{background:var(--panel);border:2px solid var(--edge);color:var(--ink);
  padding:9px 12px;cursor:grab;font:inherit;font-size:13.5px;
  text-align:left;max-width:100%;line-height:1.4;display:flex;align-items:center;gap:8px}
.tok:hover{border-color:var(--secondary)}
.tok.sel{background:var(--primary);color:#1a1c1c;border-color:var(--edge);box-shadow:2px 2px 0 0 var(--edge)}
.tok.correct{border-color:var(--edge);background:var(--ok);color:#0c1a12}
.tok.wrong{border-color:var(--edge);background:var(--bad);color:#2a0505}
.tok em{color:var(--dim);font-style:normal;font-size:12px;display:block;margin-top:3px}
.tok.correct em,.tok.wrong em{color:inherit;opacity:.75}
.zones{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.zone{background:var(--panel2);border:2px solid var(--edge);padding:11px;
  min-height:110px;display:flex;flex-direction:column;gap:8px}
.zone.over{border-color:var(--secondary);box-shadow:2px 2px 0 0 var(--secondary)}
.zone h4{margin:0;font-size:13px;letter-spacing:.3px;font-weight:700;text-transform:uppercase;
  display:flex;align-items:center;gap:7px}
.zone-icon{width:18px;height:18px;flex-shrink:0;border:1px solid var(--edge);background:#fff;
  padding:2px;object-fit:contain}
.zone .zdef{color:var(--dim);font-size:11.5px;margin:0}
.zone .drop{flex:1;display:flex;flex-direction:column;gap:7px;min-height:34px}
/* Mobile placement sheet — only ever mounted on coarse-pointer devices. */
.sheet-root{position:fixed;inset:0;z-index:50}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);touch-action:none}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);
  border-top:2px solid var(--edge);max-height:70vh;display:flex;flex-direction:column;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .18s ease-out}
.sheet-root.open .sheet{transform:translateY(0)}
.sheet-title{margin:0 0 10px;font-weight:700;font-size:14px}
.sheet-rows{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:6px}
.sheet-row{display:flex;align-items:center;gap:10px;min-height:44px;text-align:left;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  font:inherit;font-size:13.5px;padding:9px 11px;cursor:pointer}
.sheet-row img{width:24px;height:24px;flex:none}
.sheet-row b{font-weight:700;display:block}
.sheet-row em{display:block;font-style:normal;color:var(--dim);font-size:12px}
.sheet-close{margin-top:10px;min-height:44px;background:none;border:1px solid var(--line);
  color:var(--dim);font:inherit;text-transform:uppercase;font-size:12px;cursor:pointer}
.snip{background:var(--panel2);border-left:4px solid var(--secondary);padding:11px 13px;
  font-style:italic;margin:0 0 10px;font-size:14px}
.flip{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:640px){ .flip{grid-template-columns:1fr} }
.variant{background:var(--panel2);border:2px solid var(--edge);padding:13px}
.variant p{margin:0 0 10px;font-size:14.5px;line-height:1.5}
.pick{display:grid;gap:7px}
.pick button{background:var(--panel);border:2px solid var(--edge);color:var(--ink);
  padding:9px 11px;cursor:pointer;font:inherit;font-size:13.5px;text-align:left}
.pick button:hover:not(:disabled){border-color:var(--secondary)}
.pick button[aria-pressed=true]{background:var(--primary);color:#1a1c1c;border-color:var(--edge);box-shadow:2px 2px 0 0 var(--edge)}
.pick button.correct{border-color:var(--edge);background:var(--ok);color:#0c1a12}
.pick button.wrong{border-color:var(--edge);background:var(--bad);color:#2a0505}
.score{font-size:24px;font-weight:700;margin:0 0 6px;text-transform:uppercase}
.score.ok{color:var(--ok)} .score.mid{color:var(--warn)} .score.no{color:var(--bad)}
.reveal{margin-top:16px;border-top:3px solid var(--edge);padding-top:14px}
.reveal li{margin-bottom:11px;font-size:14px}
.reveal li b{display:block}
.reveal li .miss{color:var(--bad)} .reveal li .hit{color:var(--ok)}
.grid3x3{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.grid-head{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;font-size:11px;
  text-transform:uppercase;letter-spacing:.3px;color:var(--dim);padding:0 2px}
.grid-row{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;align-items:stretch}
.grid-domain{background:var(--panel2);border:2px solid var(--edge);padding:11px;
  font-size:12.5px;font-weight:700;display:flex;align-items:center}
.grid-cell{padding:8px;min-height:52px}
.grid-cell .cell-empty{color:var(--dim);font-size:12px}
@media (max-width:640px){ .grid-head{display:none} .grid-row{grid-template-columns:1fr} }
.why{color:var(--dim);margin:0 0 10px}
.dim-note{background:var(--panel2);border:2px dashed var(--edge);padding:10px 12px;margin:10px 0;font-size:14px}
.dim-note b{color:var(--secondary)}
.currency{background:var(--panel2);border:2px solid var(--edge);
  padding:12px;margin:12px 0;font-size:14px}
.currency div{margin:3px 0}
.cite{font-size:12px;color:var(--dim);margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{background:var(--primary);border:2px solid var(--edge);color:#1a1c1c;padding:9px 16px;
  cursor:pointer;font:inherit;font-weight:700;text-transform:uppercase;font-size:13px;
  box-shadow:3px 3px 0 0 var(--edge);transition:transform .1s,box-shadow .1s}
.btn:hover:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 0 var(--edge)}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 0 var(--edge)}
.badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;
  padding:3px 9px;background:var(--panel2);color:var(--ink);border:2px solid var(--edge)}
.badge.horizon{color:#1a1c1c;background:var(--warn);border-color:var(--edge)}
.sweep{background:var(--panel2);border:2px solid var(--edge);
  padding:13px;margin-top:14px}
.sweep p{margin:0 0 9px;font-size:14px}
/* ---- map ---- */
.map-wrap{width:100%;margin:0 0 12px}
.map{position:relative;width:100%;aspect-ratio:1016.371/514.609;background:var(--panel2);
  border:3px solid var(--edge);min-height:250px;overflow:hidden}
/* The map SVG ships with a flat fill and stroke as presentation attributes,
   which any CSS rule overrides — so the land follows the theme. */
.map-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-svg path,.map-svg polygon{fill:var(--land);stroke:var(--land-line);stroke-width:.4}
:root{--land:#2a2d36;--land-line:#f0f0f0}
@media (prefers-color-scheme: light){ :root{--land:#eeeeee;--land-line:#111111} }
:root[data-theme=light]{--land:#eeeeee;--land-line:#111111}
:root[data-theme=dark]{--land:#2a2d36;--land-line:#f0f0f0}

.map .site{position:absolute;transform:translate(-50%,-50%);width:9px;height:9px;
  border-radius:50%;background:var(--primary);border:2px solid var(--panel);
  pointer-events:none;z-index:2}
.map .site.comprehensive{background:var(--ok)}
.map .site.sectoral{background:var(--primary)}
.map .site.voluntary{background:var(--warn)}
.map .site.proposed{background:transparent;border-color:var(--warn)}
.map .site.none{background:var(--dim)}
.map .site.treaty{background:var(--cov-treaty)}
.map .pin{position:absolute;transform:translate(-50%,-50%);background:var(--panel);
  border:2px solid var(--edge);color:var(--ink);padding:3px 7px;
  font-size:10.5px;line-height:1.25;cursor:pointer;max-width:26%;z-index:3;
  text-align:left;font-weight:700}
.map .pin:hover{border-color:var(--secondary)}
.map .pin.over{border-color:var(--secondary);box-shadow:2px 2px 0 0 var(--secondary)}
.map .pin.correct{background:var(--ok);color:#0c1a12;border-color:var(--edge)}
.map .pin.wrong{background:var(--bad);color:#2a0505;border-color:var(--edge)}
.map .pin .held{display:block;font-size:9.5px;color:inherit;opacity:.8;
  white-space:normal;line-height:1.25;margin-top:2px;max-width:150px}
.map .leader{position:absolute;height:1px;background:var(--edge);transform-origin:0 50%;
  z-index:1;pointer-events:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-bottom:10px}
/* ---- briefs ---- */
textarea{width:100%;background:var(--panel2);border:2px solid var(--edge);color:var(--ink);
  padding:11px;font:inherit;resize:vertical;min-height:96px}
textarea:focus{outline:none;border-color:var(--secondary)}
.field{margin-bottom:18px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field .count{font-size:12px;color:var(--dim);margin-top:4px}
.scenario{background:var(--panel2);border:2px solid var(--edge);padding:16px;margin-bottom:20px;
  white-space:pre-wrap;line-height:1.6}
.ai-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ai-links .lbl{color:var(--dim);font-size:13px;margin-right:2px}
.ai-link{background:var(--panel2);border:2px solid var(--edge);
  cursor:pointer;padding:7px;line-height:0;position:relative;display:inline-flex}
.ai-link:hover{border-color:var(--secondary)}
.ai-link svg{width:20px;height:20px;display:block}
/* The ChatGPT mark ships with no fill, so it would default to black and vanish
   on the dark theme. Claude and Perplexity carry their own brand colours. */
.ai-link{color:var(--ink)}
.ai-link::after{content:attr(data-label);position:absolute;bottom:calc(100% + 6px);
  left:50%;transform:translate(-50%,4px);background:var(--ink);color:var(--bg);
  font-size:11px;line-height:1.3;padding:4px 8px;border:1px solid var(--edge);white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .12s,transform .12s}
.ai-link:hover::after,.ai-link:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);
  border:2px solid var(--edge);box-shadow:3px 3px 0 0 var(--edge);
  color:#0c1a12;padding:11px 20px;z-index:60;font-size:14px;font-weight:700}
.share-root{position:fixed;inset:0;z-index:70;display:none}
.share-root.open{display:block}
.share-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.share-modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px,calc(100vw - 32px));max-height:min(86vh,720px);overflow:auto;
  background:var(--panel);border:4px solid var(--edge);box-shadow:8px 8px 0 0 var(--edge);
  padding:22px}
.share-modal h3{margin:0 0 4px;font-size:18px;text-transform:uppercase}
.share-sub{color:var(--dim);font-size:13px;margin:0 0 12px}
.share-close{position:absolute;top:10px;right:10px;border:2px solid var(--edge);
  background:var(--panel2);color:var(--ink);font:inherit;font-size:16px;font-weight:700;
  width:32px;height:32px;cursor:pointer;line-height:1}
.share-close:hover{background:var(--bad);color:#fff}
.share-tones{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.share-tone{border:2px solid var(--edge);background:var(--panel2);color:var(--ink);
  font:inherit;font-size:13px;font-weight:700;text-align:left;padding:9px 12px;cursor:pointer}
.share-tone[aria-pressed="true"]{background:var(--accent);color:#1a1c1c;
  box-shadow:3px 3px 0 0 var(--edge)}
.share-tone .hint{display:block;font-weight:400;font-size:11px;opacity:.75}
.share-preview{border:2px dashed var(--edge);background:var(--bg);padding:12px;
  font-size:13px;line-height:1.55;margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
.share-reroll{border:2px solid var(--edge);background:var(--panel2);color:var(--ink);
  font:inherit;font-size:12px;font-weight:700;padding:6px 12px;cursor:pointer;margin-bottom:14px}
.share-reroll:hover{background:var(--accent);color:#1a1c1c}
.share-nets{display:flex;flex-wrap:wrap;gap:8px}
.share-nets a,.share-nets button{border:2px solid var(--edge);background:var(--panel2);
  color:var(--ink);font:inherit;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.4px;padding:8px 12px;cursor:pointer;text-decoration:none;
  box-shadow:3px 3px 0 0 var(--edge);transition:transform .1s,box-shadow .1s}
.share-nets a:hover,.share-nets button:hover{transform:translate(3px,3px);box-shadow:0 0 0 0 var(--edge)}
.share-note{font-size:11px;color:var(--dim);margin:14px 0 0;border-top:2px solid var(--edge);
  padding-top:10px;line-height:1.5}
@media print{.share-root,.share-btn{display:none}}
.rubric li{margin-bottom:12px}
.rubric b{display:block}
.empty{color:var(--dim);text-align:center;padding:40px 20px}
.banner{background:var(--warn);color:#1a1c1c;border:2px solid var(--edge);padding:10px 14px;
  margin-bottom:14px;font-size:14px;font-weight:700}
.order-list{display:grid;gap:8px;margin:12px 0}
.order-slot{background:var(--panel2);border:2px dashed var(--edge);
  padding:10px 13px;color:var(--dim);font-size:14px}
.order-slot.filled{border-style:solid;color:var(--ink)}
@media (max-width:640px){
  main{padding:14px 12px 80px}
  .zones{grid-template-columns:1fr 1fr}
  /* Pin labels are text, so they don't shrink with the board and start
     colliding below ~700px. Scroll the map inside its own container rather
     than degrading the geography, and never let the page scroll sideways. */
  .map-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* 920px is the desktop board width at which pin spacing was verified
     collision-free; anything narrower reintroduces label overlap. */
  .map{min-width:920px}
  .map-hint{display:block}
}
.map-hint{display:none;font-size:12px;color:var(--dim);margin:0 0 8px}
/* ---- regulatory risk (rr) ----
   Final coverage palette, defined ONCE per mode. Steps come from the dataviz
   reference palette and were run through validate_palette.js against the
   map's actual surfaces (--panel2): light #eeeeee ALL PASS (contrast WARN on
   4 hues — mitigated by the mandatory C/S/V/P/—/T letter badges, the second
   channel), dark #24262e ALL PASS incl. contrast ≥3:1. Worst adjacent CVD
   ΔE 9.1 light / 8.4 dark; normal-vision 19.6 / 19.3. The dark column is
   separately SELECTED dark-band steps, not an auto-flip of the light hexes.
   Ownership rides on luminance (fill-opacity .28 open / .78 held) so hue is
   never the only channel. */
:root{--cov-comprehensive:#3987e5;--cov-sectoral:#d95926;--cov-voluntary:#199e70;
  --cov-proposed:#c98500;--cov-none:#d55181;--cov-treaty:#008300}
@media (prefers-color-scheme: light){
  :root{--cov-comprehensive:#2a78d6;--cov-sectoral:#eb6834;--cov-voluntary:#1baf7a;
    --cov-proposed:#eda100;--cov-none:#e87ba4;--cov-treaty:#008300}
}
:root[data-theme=light]{--cov-comprehensive:#2a78d6;--cov-sectoral:#eb6834;
  --cov-voluntary:#1baf7a;--cov-proposed:#eda100;--cov-none:#e87ba4;--cov-treaty:#008300}
:root[data-theme=dark]{--cov-comprehensive:#3987e5;--cov-sectoral:#d95926;
  --cov-voluntary:#199e70;--cov-proposed:#c98500;--cov-none:#d55181;--cov-treaty:#008300}
/* RR-scoped 44px touch targets (playtest wave 1): action/submit/withdraw/
   begin/start/reg buttons, role-hat-ops pickers, gate answer options,
   sheet-close and debrief ai-links — scoped to .rr-mode so the shared house
   kit (other labs) keeps its baseline. */
.rr-mode .btn{min-height:44px}
.rr-mode .pick button{min-height:44px}
.rr-mode .ai-link{min-height:44px;min-width:44px;align-items:center;justify-content:center}
.rr-hud{position:sticky;z-index:25;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  background:var(--panel);border:3px solid var(--edge);padding:8px 12px;margin:0 0 12px;
  font-weight:700;font-size:14px}
.rr-hud .meter{flex:1;min-width:80px;margin-top:0}
.rr-hud .rr-reg{margin-left:auto;flex:0 0 auto}
.rr-map{position:relative;width:100%;aspect-ratio:1016.371/514.609;background:var(--panel2);
  border:3px solid var(--edge);overflow:hidden;margin:0 0 12px}
.rr-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rr-svg path,.rr-svg polygon{fill:var(--land);stroke:var(--land-line);stroke-width:.4;
  pointer-events:none}
.rr-svg .cov-comprehensive{fill:var(--cov-comprehensive)}
.rr-svg .cov-sectoral{fill:var(--cov-sectoral)}
.rr-svg .cov-voluntary{fill:var(--cov-voluntary)}
.rr-svg .cov-proposed{fill:var(--cov-proposed)}
.rr-svg .cov-none{fill:var(--cov-none)}
.rr-svg .cov-treaty{fill:var(--cov-treaty)}
.rr-svg .rr-open{fill-opacity:.28}
.rr-svg .rr-held{fill-opacity:.78;stroke-width:1}
.rr-svg .rr-notice{stroke:var(--bad);stroke-width:1.3}
.rr-svg .rr-sel{stroke:var(--secondary);stroke-width:1.6}
.rr-svg .rr-fx *{fill:url(#rr-hatch);stroke:none;pointer-events:none}
.rr-svg #rr-hatch line{stroke:var(--bad);stroke-opacity:.8;stroke-width:1.5}
.rr-svg .rr-coe{stroke:var(--dim);stroke-dasharray:7 5;stroke-width:1.6}
.rr-svg .rr-coe.rr-held{stroke:var(--edge);stroke-dasharray:none;stroke-width:2}
.rr-svg .rr-coe.rr-notice{stroke:var(--bad);stroke-dasharray:7 5}
/* the legacy Jurisdiction Map shares the stamped SVG until Task 13 removes it;
   hide the rr-only artefacts there so it stays pixel-identical */
.map-svg .rr-dot,.map-svg .rr-coe{display:none}
.rr-hit{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;
  background:transparent;border:none;cursor:pointer;z-index:3;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:inherit;padding:0}
.rr-glyph{font-size:13px;line-height:1;text-shadow:0 0 4px var(--bg)}
.rr-pinlab{display:none;font-size:9px;font-weight:700;line-height:1.1;
  background:var(--panel);border:1px solid var(--edge);padding:0 3px;margin-top:1px}
@media (min-width:700px){ .rr-pinlab{display:block} }
.rr-hit.rr-hitsel .rr-glyph{color:var(--secondary)}
.rr-hit.rr-hitsel .rr-pinlab{border-color:var(--secondary)}
/* Leader line from a pin to a label whose data nudge pushed it well away from
   the country (Europe cluster, island states) — desktop-only like the labels. */
.rr-lead{display:none;position:absolute;left:50%;top:50%;height:0;
  border-top:1.5px solid var(--edge);opacity:.75;transform-origin:left center;
  pointer-events:none}
@media (min-width:700px){ .rr-lead{display:block} }
.rr-hit.rr-hitsel .rr-lead{border-color:var(--secondary)}
.rr-chip{position:absolute;left:58%;top:-2px;font-size:9px;background:var(--panel);
  border:1px solid var(--edge);padding:0 3px;font-weight:700;white-space:nowrap}
.rr-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim);
  margin:0 0 10px;align-items:center}
.rr-legend span{display:inline-flex;align-items:center;gap:5px}
.rr-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border:2px solid var(--edge);font-weight:700;font-size:12px;flex-shrink:0;color:#111}
.rr-badge.cov-comprehensive{background:var(--cov-comprehensive)}
.rr-badge.cov-sectoral{background:var(--cov-sectoral)}
.rr-badge.cov-voluntary{background:var(--cov-voluntary)}
.rr-badge.cov-proposed{background:var(--cov-proposed)}
.rr-badge.cov-none{background:var(--cov-none)}
.rr-badge.cov-treaty{background:var(--cov-treaty)}
.rr-list{display:grid;gap:8px}
.rr-group{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);
  margin:14px 0 4px;font-weight:700}
.rr-row{display:flex;gap:10px;align-items:center;background:var(--panel2);
  border:2px solid var(--edge);padding:9px 11px}
.rr-row.rr-rowsel{border-color:var(--secondary);box-shadow:2px 2px 0 0 var(--secondary)}
.rr-tinfo{flex:1;min-width:0}
.rr-tinfo b{display:block;font-size:13.5px}
.rr-tinfo em{display:block;font-style:normal;color:var(--dim);font-size:12px}
.rr-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rr-acts .btn{padding:8px 10px;font-size:12px;min-height:44px}
.rr-opscount{font-size:12px;color:var(--dim);margin-top:6px}
@media (max-width:700px){
  .rr-row{flex-wrap:wrap}
  .rr-acts{width:100%;justify-content:flex-start}
}
/* ---- rr slice 3: regulator interstitial ---- */
.rr-aging{display:grid;gap:7px;margin:0 0 14px}
.rr-aging .rr-age{background:var(--panel2);border:2px solid var(--edge);padding:9px 12px;
  font-size:13.5px}
.rr-aging .rr-age.warn{border-color:var(--warn)}
.rr-aging .rr-age.no{border-color:var(--bad);color:var(--bad);font-weight:700}
.rr-event{background:var(--panel2);border:3px solid var(--edge);
  box-shadow:var(--shadow) var(--shadow) 0 0 var(--edge);padding:14px;margin:0 0 14px}
.rr-event h3{margin:0 0 6px;font-size:14px;text-transform:uppercase}
.rr-event p{margin:0 0 8px;font-size:14px}
/* ---- rr slice 3: US inset bottom sheet ---- */
.rr-scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39}
.rr-sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);
  border-top:4px solid var(--edge);padding:14px 16px 20px;max-height:72vh;overflow:auto}
.rr-sheet h3{margin:0;font-size:14px;text-transform:uppercase}
.rr-sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:0 0 10px}
.rr-inset-row{display:flex;gap:12px;align-items:center;width:100%;background:var(--panel2);
  border:2px solid var(--edge);padding:8px 12px;margin:0 0 8px;min-height:60px;
  font:inherit;color:var(--ink);text-align:left;cursor:default}
.rr-inset-row svg{width:48px;height:48px;flex-shrink:0;display:block}
.rr-inset-row svg .rr-frame{fill:none;stroke:var(--edge);stroke-width:3}
.rr-usdots{display:none;position:absolute;top:calc(100% + 1px);left:50%;
  transform:translateX(-50%);gap:3px;pointer-events:none}
@media (min-width:700px){ .rr-usdots{display:flex} }
.rr-usdots i{width:8px;height:8px;border:1px solid var(--edge);border-radius:50%}
/* ---- rr slice 3: debrief ---- */
.rr-arith{background:var(--panel2);border:2px solid var(--edge);padding:11px 13px;
  margin:10px 0;font-size:14px}
.rr-review{display:grid;gap:6px;margin:10px 0}
.rr-review .rr-q{background:var(--panel2);border-left:4px solid var(--ok);
  padding:8px 11px;font-size:13px}
.rr-review .rr-q.miss{border-left-color:var(--bad)}
.rr-review .rr-q em{display:block;font-style:normal;color:var(--dim);font-size:12px}
/* ---- rr slice 3: print strategy report (SPEC §2.7) ----
   The report exists ONLY inside the print media query: hidden on screen,
   and under print it is the only thing shown. Nothing is persisted. */
.rr-print{display:none}
@media print{
  header,.toast,main > *:not(.rr-print){display:none !important}
  body{background:#fff;color:#000;font:10px/1.35 "Space Mono",ui-monospace,monospace}
  main{max-width:none;padding:0}
  .rr-print{display:block;color:#000}
  .rr-print h2{font-size:15px;margin:0 0 2px;text-transform:uppercase}
  .rr-print h3{font-size:11px;margin:7px 0 3px;text-transform:uppercase;
    border-bottom:1px solid #000;padding-bottom:1px}
  .rr-print p{margin:0 0 3px}
  .rr-print table{width:100%;border-collapse:collapse;font-size:9px}
  .rr-print th,.rr-print td{border:1px solid #999;padding:1px 4px;text-align:left;
    vertical-align:top}
  .rr-print tr{page-break-inside:avoid}
  .rr-print ul{margin:0 0 3px;padding-left:16px}
  .rr-print li{margin:0}
  @page{size:A4 portrait;margin:11mm}
}
</style>
</head>

r":"ladders","deck":"decks/microsoft/foundry-flows.json","title":"Build Orders","blurb":"Six workflows the exam expects you to replay from memory — click each step into the only order that ships."}]}</script>
<script id="lab-decks" type="application/json">{"decks/microsoft/services.json":{"id":"services","runner":"board","title":"Service to Purpose","blurb":"Match each purpose to the Azure service built for it.","source":"Microsoft AI-901 (Azure AI Fundamentals) skills-measured guide · in-scope Azure AI services","asOf":"2026-07","area":"microsoft-services","hint":"Drag each purpose onto the service that exists to do it.","icons":"azure-service","items":[{"id":"svc-001","label":"Auto-generate a caption and tags for an uploaded product photo","answer":"Azure AI Vision","why":"Azure AI Vision's Image Analysis feature extracts captions, tags, and objects directly from images."},{"id":"svc-002","label":"Turn a recorded customer-support call into a written transcript","answer":"Azure AI Speech","why":"Azure AI Speech's speech-to-text recognition converts spoken audio into text."},{"id":"svc-003","label":"Decide whether hundreds of product reviews are positive or negative","answer":"Azure AI Language","why":"Azure AI Language's sentiment analysis scores text as positive, negative, neutral, or mixed."},{"id":"svc-004","label":"Translate an incoming support ticket from Japanese into English","answer":"Azure AI Translator","why":"Azure AI Translator performs text translation across dozens of languages in real time."},{"id":"svc-005","label":"Pull the vendor name, invoice number, and total from a scanned invoice","answer":"Azure AI Document Intelligence","why":"Its prebuilt invoice model deterministically extracts known fields from standard form types like invoices and receipts."},{"id":"svc-006","label":"Describe the fields you want in plain language and get structured JSON back from a mix of documents, photos, and call recordings","answer":"Azure Content Understanding","why":"Content Understanding lets you define an analyzer in natural language and reasons over multimodal input to return structured JSON, unlike Document Intelligence's fixed prebuilt forms."},{"id":"svc-007","label":"Train a model to spot one specific defect on your factory's assembly-line images","answer":"Azure AI Custom Vision","why":"Custom Vision lets you train an image classifier or object detector on your own labeled images for a narrow, custom task."},{"id":"svc-008","label":"Verify a person's identity by comparing a selfie against their ID photo","answer":"Azure AI Face","why":"Azure AI Face provides face detection, verification, and liveness-check capabilities for identity scenarios."},{"id":"svc-009","label":"Automatically block hateful or violent text before it reaches app users","answer":"Azure AI Content Safety","why":"Content Safety analyzes text and images for harmful-content categories and severity, then flags or blocks it."},{"id":"svc-010","label":"Spot an unusual spike in a sensor's time-series readings","answer":"Azure AI Anomaly Detector","why":"Anomaly Detector applies time-series analysis to flag data points that deviate from expected patterns."},{"id":"svc-011","label":"Let employees run natural-language search across thousands of internal documents","answer":"Azure AI Search","why":"Azure AI Search indexes and enriches content so users can query it with keyword and semantic search."},{"id":"svc-012","label":"Extract keywords, faces, and scene changes from an uploaded training video","answer":"Azure AI Video Indexer","why":"Video Indexer analyzes recorded video and audio to surface faces, keywords, topics, and scenes."},{"id":"svc-013","label":"Deploy GPT-4o inside your own Azure tenant to draft customer-support replies","answer":"Azure OpenAI Service","why":"Azure OpenAI Service hosts OpenAI's models, like GPT-4o, as an enterprise Azure resource with your own deployment, quota, and content filters."},{"id":"svc-014","label":"One place to deploy a model, build an agent, and evaluate it before shipping","answer":"Microsoft Foundry","why":"Microsoft Foundry is the unified platform combining the model catalog, portal, SDK, and Agent Service for building and deploying AI solutions."},{"id":"svc-015","label":"Give a model file search, code interpreter, and function-calling tools so it can act across multiple turns","answer":"Microsoft Foundry Agent Service","why":"Foundry Agent Service builds persistent agents combining a model, instructions, tools, and threads for multi-step, stateful tasks, not a single stateless chat call."},{"id":"svc-016","label":"Train, track, and manage a classic ML model through a full experiment pipeline","answer":"Azure Machine Learning","why":"Azure Machine Learning is Microsoft's dedicated platform for traditional ML model training, tracking, and MLOps, distinct from Foundry's generative-AI focus."}]},"decks/microsoft/features.json":{"id":"features","runner":"board","title":"Feature to Function","blurb":"Match each job to the capability that does it.","source":"Microsoft AI-901 (Azure AI Fundamentals) skills-measured guide · in-scope Azure AI services","asOf":"2026-07","area":"microsoft-services","hint":"Drag each job onto the capability that performs it. The reveal names the service it belongs to.","icons":"azure-service","groupByService":true,"items":[{"id":"feat-000-00","label":"Pull machine-readable text out of a photo of a whiteboard or street sign.","answer":"OCR / Read API","why":"Azure AI Vision's Read API applies OCR to extract printed and handwritten text from images, unlike Image Analysis's captioning and tagging.","service":"Azure AI Vision"},{"id":"feat-000-01","label":"Identify and place bounding boxes around individual objects in a photo.","answer":"Object Detection","why":"Azure AI Vision's Object Detection returns bounding boxes and labels for individual objects found in an image.","service":"Azure AI Vision"},{"id":"feat-000-02","label":"Generate a natural-language caption describing what's happening in an image.","answer":"Image Captioning","why":"Azure AI Vision's Image Analysis captioning feature generates a natural-language description of an image's content.","service":"Azure AI Vision"},{"id":"feat-001-00","label":"Convert a live microphone feed into streaming text in real time.","answer":"Speech-to-text (speech recognition)","why":"Azure AI Speech's speech-to-text recognition transcribes streaming or batch audio into text in real time.","service":"Azure AI Speech"},{"id":"feat-001-01","label":"Produce natural-sounding spoken audio from written text for a voice assistant.","answer":"Text-to-speech (speech synthesis)","why":"Azure AI Speech's text-to-speech synthesis converts written text into natural-sounding spoken audio.","service":"Azure AI Speech"},{"id":"feat-001-02","label":"Translate spoken French audio into spoken or written English in real time.","answer":"Speech Translation","why":"Azure AI Speech's Speech Translation feature translates spoken audio into another language's text or speech in real time, combining recognition and translation in one call.","service":"Azure AI Speech"},{"id":"feat-002-00","label":"Pull out people, places, organizations, and dates named in a block of text.","answer":"Named Entity Recognition (NER)","why":"Azure AI Language's Named Entity Recognition identifies and categorizes people, places, organizations, and dates mentioned in text.","service":"Azure AI Language"},{"id":"feat-002-01","label":"Automatically find and redact credit-card numbers and phone numbers found in support transcripts.","answer":"PII Detection and Redaction","why":"Azure AI Language's PII detection feature finds and can redact sensitive personal data like phone numbers and card numbers in text.","service":"Azure AI Language"},{"id":"feat-002-02","label":"Condense a long article down to its most important sentences.","answer":"Text Summarization","why":"Azure AI Language's summarization feature condenses long text into its most salient sentences or a short abstract.","service":"Azure AI Language"},{"id":"feat-002-03","label":"Detect which of dozens of languages a piece of incoming text is written in.","answer":"Language Detection","why":"Azure AI Language's language detection feature identifies which of dozens of languages a piece of text is written in.","service":"Azure AI Language"},{"id":"feat-002-04","label":"Build a chatbot that recognizes a user's intent, such as 'book a flight,' and pulls out key entities from their message.","answer":"Conversational Language Understanding (CLU)","why":"Azure AI Language's Conversational Language Understanding trains a model to recognize a user's intent and extract entities from conversational input.","service":"Azure AI Language"},{"id":"feat-003-00","label":"Instantly translate a chat message typed in Spanish into German.","answer":"Text Translation","why":"Azure AI Translator's text translation feature converts text between languages in real time via a single API call.","service":"Azure AI Translator"},{"id":"feat-003-01","label":"Translate an entire Word document while preserving its original layout and formatting.","answer":"Document Translation","why":"Azure AI Translator's Document Translation feature translates whole documents asynchronously while preserving their original formatting and layout.","service":"Azure AI Translator"},{"id":"feat-004-00","label":"Extract vendor, total, and line items from a receipt using a ready-made model, with no training required.","answer":"Prebuilt models","why":"Azure AI Document Intelligence's prebuilt models extract known fields from standard form types like invoices and receipts with no training required.","service":"Azure AI Document Intelligence"},{"id":"feat-004-01","label":"Train a model on your own custom form layout that no prebuilt model covers.","answer":"Custom models","why":"Azure AI Document Intelligence's custom models are trained on your own labeled form layouts that no prebuilt model covers.","service":"Azure AI Document Intelligence"},{"id":"feat-004-02","label":"Pull raw text, tables, and selection marks out of a scanned document's structure.","answer":"Layout model","why":"Azure AI Document Intelligence's Layout model extracts raw text, tables, and selection marks along with a document's structure.","service":"Azure AI Document Intelligence"},{"id":"feat-005-00","label":"Pull invoice numbers, totals, and line items out of scanned PDF forms and photographed receipts into structured JSON fields you named yourself.","answer":"Document field extraction","why":"Azure Content Understanding's document field extraction applies a custom analyzer schema to PDFs, scanned forms, and images to return the specific structured fields you defined, not just a fixed prebuilt layout.","service":"Azure Content Understanding"},{"id":"feat-005-01","label":"Get a call recording transcribed and its sentiment and key talking points summarized, or pull spoken dialogue and on-screen text out of a training video.","answer":"Audio and video content analysis","why":"Azure Content Understanding's audio and video analysis transcribes and reasons over call recordings and video content, extracting fields such as speaker sentiment, summaries, and dialogue that don't exist in a static document.","service":"Azure Content Understanding"},{"id":"feat-006-00","label":"Train a model to sort your own product photos into categories you define.","answer":"Custom image classification","why":"Azure AI Custom Vision's image classification trains a model on your own labeled photos to sort images into categories you define.","service":"Azure AI Custom Vision"},{"id":"feat-006-01","label":"Train a model to locate and draw a box around a specific defect type in your own images.","answer":"Custom object detection","why":"Azure AI Custom Vision's object detection trains a model on your own labeled images to locate and box a specific object or defect.","service":"Azure AI Custom Vision"},{"id":"feat-007-00","label":"Find the location of every face present in a group photo.","answer":"Face Detection","why":"Azure AI Face's face detection locates the position of every face present in an image.","service":"Azure AI Face"},{"id":"feat-007-01","label":"Confirm that two photos show the same specific person.","answer":"Face Verification (1:1 matching)","why":"Azure AI Face's verification (1:1 matching) confirms whether two face images belong to the same person.","service":"Azure AI Face"},{"id":"feat-007-02","label":"Search a large gallery of enrolled faces to identify who appears in a new photo.","answer":"Face Identification (1:N matching)","why":"Azure AI Face's identification (1:N matching) searches a gallery of enrolled faces to find a match for a new photo.","service":"Azure AI Face"},{"id":"feat-008-00","label":"Score a chat message for hate, violence, sexual, or self-harm content severity.","answer":"Text moderation categories","why":"Azure AI Content Safety's text moderation scores text for hate, violence, sexual, and self-harm content severity.","service":"Azure AI Content Safety"},{"id":"feat-008-01","label":"Detect an attempt to jailbreak a chatbot or hide malicious instructions inside a document a model will read.","answer":"Prompt Shields","why":"Azure AI Content Safety's Prompt Shields detects jailbreak attempts and indirect prompt injection hidden in content a model will process.","service":"Azure AI Content Safety"},{"id":"feat-008-02","label":"Flag an uploaded image for graphic or violent visual content.","answer":"Image moderation categories","why":"Azure AI Content Safety's image moderation scores uploaded images for the same harmful-content categories applied to text.","service":"Azure AI Content Safety"},{"id":"feat-009-00","label":"Flag an unusual spike in a single sensor's reading over time.","answer":"Univariate anomaly detection","why":"Azure AI Anomaly Detector's univariate detection flags unexpected spikes or dips in a single time-series stream.","service":"Azure AI Anomaly Detector"},{"id":"feat-009-01","label":"Detect an unusual combined pattern across dozens of correlated sensor streams at once.","answer":"Multivariate anomaly detection","why":"Azure AI Anomaly Detector's multivariate detection flags anomalous combined patterns across many correlated time-series signals at once.","service":"Azure AI Anomaly Detector"},{"id":"feat-010-00","label":"Retrieve documents by the closeness of their meaning rather than exact keyword match.","answer":"Vector search","why":"Azure AI Search's vector search retrieves documents by the closeness of their meaning rather than exact keyword overlap.","service":"Azure AI Search"},{"id":"feat-010-01","label":"Run an AI enrichment pipeline that extracts entities, key phrases, and image text from raw content before indexing.","answer":"Skillsets (AI enrichment)","why":"Azure AI Search's skillsets run an AI enrichment pipeline that extracts entities, key phrases, and image text from raw content before it's indexed.","service":"Azure AI Search"},{"id":"feat-010-02","label":"Re-rank keyword search results using a language model to push the most relevant hits to the top.","answer":"Semantic ranking","why":"Azure AI Search's semantic ranking reorders keyword search results using a language model to surface the most relevant matches first.","service":"Azure AI Search"},{"id":"feat-011-00","label":"Identify and label the same person's face wherever they reappear across a video.","answer":"Face detection and tracking","why":"Azure AI Video Indexer's face detection identifies and tracks the same person's face as they reappear across a video.","service":"Azure AI Video Indexer"},{"id":"feat-011-01","label":"Produce a searchable transcript labeled by which speaker said each line.","answer":"Transcription with speaker diarization","why":"Azure AI Video Indexer's transcription feature produces a searchable transcript labeled by which speaker said each line.","service":"Azure AI Video Indexer"},{"id":"feat-011-02","label":"Automatically detect scene and shot boundaries in an uploaded video.","answer":"Scene and shot detection","why":"Azure AI Video Indexer's scene and shot detection automatically marks scene and shot boundaries in an uploaded video.","service":"Azure AI Video Indexer"},{"id":"feat-012-00","label":"Deploy GPT-4o for enterprise chat completions with your own quota and content filters.","answer":"Chat/completion model deployment","why":"Azure OpenAI Service deploys chat and completion models like GPT-4o as an enterprise resource with your own quota and content filters.","service":"Azure OpenAI Service"},{"id":"feat-012-01","label":"Generate a set of unique product images from a text description.","answer":"DALL-E image generation","why":"Azure OpenAI Service's DALL-E deployment generates new images from a text description.","service":"Azure OpenAI Service"},{"id":"feat-012-02","label":"Convert a batch of documents into numeric vectors for similarity search.","answer":"Embeddings models","why":"Azure OpenAI Service's embeddings models convert text into numeric vectors for similarity search and retrieval.","service":"Azure OpenAI Service"},{"id":"feat-012-03","label":"Adapt a base model's tone and style using your own labeled examples.","answer":"Fine-tuning","why":"Azure OpenAI Service's fine-tuning adapts a deployed model's tone and behavior using your own labeled examples.","service":"Azure OpenAI Service"},{"id":"feat-013-00","label":"Browse and compare foundation models from multiple providers in one catalog before deploying.","answer":"Model catalog","why":"Microsoft Foundry's model catalog lets you browse and compare foundation models from multiple providers before deploying one.","service":"Microsoft Foundry"},{"id":"feat-013-01","label":"Trace, test, and score prompt variants against evaluation datasets before shipping.","answer":"Prompt flow and evaluation","why":"Microsoft Foundry's prompt flow and evaluation tools trace, test, and score prompt variants against datasets before shipping.","service":"Microsoft Foundry"},{"id":"feat-013-02","label":"Call into a Foundry project programmatically from Python to manage models and agents.","answer":"Foundry SDK (AIProjectClient)","why":"Microsoft Foundry's SDK exposes an AIProjectClient so code can connect to a Foundry project and manage models and agents programmatically.","service":"Microsoft Foundry"},{"id":"feat-014-00","label":"Let an agent search and cite your own uploaded files when answering a question.","answer":"File search tool","why":"Microsoft Foundry Agent Service's file search tool lets an agent search and cite your own uploaded files when answering.","service":"Microsoft Foundry Agent Service"},{"id":"feat-014-01","label":"Let an agent write and run code in a sandbox mid-conversation to solve a data or math problem.","answer":"Code interpreter tool","why":"Microsoft Foundry Agent Service's code interpreter tool lets an agent write and run code in a sandbox mid-conversation to solve a problem.","service":"Microsoft Foundry Agent Service"},{"id":"feat-014-02","label":"Give an agent the ability to call your own external APIs or functions as part of its reasoning.","answer":"Function calling / custom tools","why":"Microsoft Foundry Agent Service's function calling lets an agent invoke your own external APIs or functions as part of its reasoning.","service":"Microsoft Foundry Agent Service"},{"id":"feat-015-00","label":"Automatically try multiple algorithms and hyperparameters to find the best-performing model for your dataset.","answer":"Automated ML (AutoML)","why":"Azure Machine Learning's Automated ML tries multiple algorithms and hyperparameters to find the best-performing model for your dataset.","service":"Azure Machine Learning"},{"id":"feat-015-01","label":"Build a training pipeline visually by dragging and connecting modules, with no code required.","answer":"Designer (drag-and-drop pipelines)","why":"Azure Machine Learning's Designer builds a training pipeline visually by dragging and connecting modules, with no code required.","service":"Azure Machine Learning"},{"id":"feat-015-02","label":"Track experiment runs, register models, and manage deployment through a governed MLOps pipeline.","answer":"MLOps / pipelines and model registry","why":"Azure Machine Learning's pipelines and model registry track experiment runs, register models, and manage governed deployment.","service":"Azure Machine Learning"}]},"decks/microsoft/rai-principles.json":{"id":"rai-principles","runner":"board","title":"Responsible AI: The Six Pillars","blurb":"Drag each situation — and each Azure safeguard — onto the responsible-AI principle it belongs to.","source":"Microsoft AI-901 study guide Task 1.1 (2026-04-15); histack.net AI-901 guide","asOf":"2026-07","area":"microsoft-rai","hint":"Drag each card onto the principle it belongs to. Ask what actually moved: who gets treated differently (fairness), whether the system behaves and holds up under stress (reliability & safety), whether data or access is exposed (privacy & security), who can use it at all (inclusiveness), what people are told about it (transparency), or who answers for it after the fact (accountability).","note":"Several cards look like they could fit two zones. The tie-break is always the one thing the scenario is actually about — differential outcome, system behavior, data exposure, usability, disclosure, or ownership.","traps":["Requiring a single interaction method for all users is the planted anti-inclusiveness answer.","Treating the AI system as the final authority for decisions that affect people's lives is the planted anti-accountability answer — human oversight must stay in the loop.","Claiming that hiding a model's limitations protects users is the planted anti-transparency answer — transparency means disclosing capabilities and limitations, not concealing them."],"zones":[{"key":"Fairness","name":"Fairness","def":"AI systems should treat all people fairly, avoiding bias and unequal outcomes across demographic groups."},{"key":"Reliability & safety","name":"Reliability & safety","def":"AI systems should perform consistently under expected and adversarial conditions and avoid causing unintended harm."},{"key":"Privacy & security","name":"Privacy & security","def":"AI systems should protect personal data and prompts/outputs from unauthorized access, collection, or use."},{"key":"Inclusiveness","name":"Inclusiveness","def":"AI systems should empower and engage everyone, including people with different abilities, languages, and needs."},{"key":"Transparency","name":"Transparency","def":"AI systems should be understandable — people should know they're interacting with AI and know its capabilities and limitations."},{"key":"Accountability","name":"Accountability","def":"People who design and deploy AI systems remain answerable for how those systems are built, operated, and monitored."}],"items":[{"id":"rai-001","label":"A loan-approval model rejects far more applicants from one neighborhood","answer":"Fairness","why":"Biased outcomes across demographic groups is the canonical fairness scenario — mitigated with fairness assessments and balanced, representative training data."},{"id":"rai-007","label":"A recruiting model consistently scores candidates from one age group lower than others, even when their qualifications are comparable","answer":"Fairness","why":"Unequal scoring by a protected attribute despite equal qualifications is a differential-outcome problem, not an access problem — that makes it fairness, not inclusiveness."},{"id":"rai-008","label":"A facial-recognition model trained on a dataset with far fewer images of one ethnic group produces a much higher error rate for that group","answer":"Fairness","why":"Underrepresentation in training data driving a systematic accuracy gap between groups is a fairness issue — no data is exposed, so it is not privacy & security."},{"id":"rai-009","label":"A hiring tool ranks candidates from certain universities lower regardless of their actual qualifications, systematically disadvantaging one applicant pool","answer":"Fairness","why":"A proxy variable (university) producing a consistent disadvantage for one group of applicants is fairness, even though no demographic attribute is used directly."},{"id":"rai-010","label":"Compare the model's error rate and approval rate side by side across demographic groups before it ships","answer":"Fairness","why":"Fairness assessments are the Azure-lever card for fairness — distinct from content filters (reliability & safety) or audit logs (accountability)."},{"id":"rai-002","label":"A chatbot must refuse harmful content and stay stable when users submit risky prompts","answer":"Reliability & safety","why":"Consistent, tested behavior and reduced unsafe outputs under adversarial input is reliability & safety; content filters and model evaluation are its Azure levers."},{"id":"rai-011","label":"A moderation pipeline sometimes misses harmful content and occasionally blocks content that is actually safe","answer":"Reliability & safety","why":"Inconsistent detection quality under normal operating conditions is a performance problem, not a data-exposure or disclosure one — that is reliability & safety."},{"id":"rai-012","label":"An AI tool that summarizes medical notes for clinicians must behave predictably even on unusual or edge-case input, since clinical decisions depend on it","answer":"Reliability & safety","why":"High-stakes, predictable behavior under unexpected input is the reliability & safety concern — the risk here is the system malfunctioning, not who it treats unfairly."},{"id":"rai-013","label":"A team tests how an AI system behaves under unexpected or adversarial conditions before releasing it, checking that it degrades safely rather than failing unpredictably","answer":"Reliability & safety","why":"Pre-release testing against adversarial and edge-case conditions is the direct definition of reliability & safety, distinct from accountability's post-hoc oversight."},{"id":"rai-014","label":"Configure content filters and run automated red-team evaluations on a deployed model to catch harmful or low-quality outputs before real users see them","answer":"Reliability & safety","why":"Content filters and automated evaluation are the Azure lever mapped to reliability & safety, not accountability — accountability is about who signs off, not what the model outputs."},{"id":"rai-006","label":"Managed identities and private endpoints so customer PII never leaks into responses or logs","answer":"Privacy & security","why":"Data protection, PII governance and access control map to privacy & security — managed identities and private endpoints are the mapped Azure features."},{"id":"rai-015","label":"A customer-support chatbot may receive account numbers and other personal data typed directly into user prompts","answer":"Privacy & security","why":"Personal data flowing through prompts is a data-exposure risk, mitigated by redaction and access control — the defining concern of privacy & security."},{"id":"rai-016","label":"An AI assistant processes employee HR documents, and the team must reduce the risk that this data leaks to unauthorized parties","answer":"Privacy & security","why":"Restricting who can access sensitive stored data is privacy & security, not accountability — accountability is about ownership of decisions, not access control."},{"id":"rai-017","label":"A school plans to release an AI tutor that processes private student conversations and must review how that data is stored and protected before broad rollout","answer":"Privacy & security","why":"Reviewing storage and protection of personal conversation data before release is a privacy & security review, distinct from a transparency review of disclosed capabilities."},{"id":"rai-018","label":"An AI application is configured to collect and retain only the specific conversation fields it actually needs, deleting the rest after a fixed retention window","answer":"Privacy & security","why":"Data minimization and retention limits reduce how much personal data exists to be exposed in the first place — a distinct privacy & security lever from access-control mechanisms like managed identities."},{"id":"rai-003","label":"Provide captions for audio and multilingual support so everyone can use the assistant","answer":"Inclusiveness","why":"Usable and accessible to all people via multiple interaction methods is inclusiveness — the exam's trap 'require one interaction method for all users' is its opposite."},{"id":"rai-019","label":"An AI help desk is built for a global workforce and needs to work well for people speaking different languages and using different devices","answer":"Inclusiveness","why":"Designing for a range of languages and devices so everyone can use the system is inclusiveness — the concern is who can access the system, not who it scores differently."},{"id":"rai-020","label":"A translation assistant assumes all users can hear audio responses clearly, ignoring people with hearing impairments","answer":"Inclusiveness","why":"An accessible-design gap that shuts out users with a disability is inclusiveness, not fairness — fairness is about differential model outcomes across groups, not usable design."},{"id":"rai-021","label":"An AI kiosk must work as well in a noisy factory floor as in a quiet office, since some users cannot rely on voice input alone in either setting","answer":"Inclusiveness","why":"Supporting varied physical environments and interaction needs so the kiosk stays usable for everyone is inclusiveness."},{"id":"rai-022","label":"A voice-enabled AI app is improved so it works better for people with different accents, physical abilities, and interaction needs","answer":"Inclusiveness","why":"Widening who the system serves well, across accents and abilities, is the direct definition of inclusiveness."},{"id":"rai-005","label":"Model cards published for every deployed model, stating capabilities and limitations","answer":"Transparency","why":"Communicating what a system can AND cannot do is transparency; model cards are the Azure feature histack maps to it. Hiding limitations violates the principle."},{"id":"rai-023","label":"Users are told upfront that they are talking to an AI assistant, not a human, before the conversation begins","answer":"Transparency","why":"Disclosing that an interaction is with AI is the core of transparency — it is about what users are told, not who is answerable if something goes wrong (accountability)."},{"id":"rai-024","label":"An AI-generated summary embedded inside a search results page carries a visible label wherever it appears on the page, not just in a one-time pop-up the first time someone visits","answer":"Transparency","why":"Ongoing, in-context labeling of AI-generated content is a different mechanism from a one-time upfront notice (rai-023) or a written model card (rai-005) — the discriminator against accountability is that this is about what the page shows, not who owns the outcome."},{"id":"rai-025","label":"A loan applicant who is declined asks for the specific reasons behind that decision, and the bank must be able to point to the factors that drove that particular outcome for them","answer":"Transparency","why":"Explaining an individual, already-made decision to the person it affected is transparency — distinct from accountability, which is about who is answerable for the decision process, not about explaining a specific outcome to the affected person."},{"id":"rai-026","label":"A generative AI assistant shows the specific source documents it drew on so a user can check the basis for its answer before trusting it","answer":"Transparency","why":"Surfacing the grounding sources behind an answer lets users verify it themselves — a traceability angle distinct from disclosing general capabilities/limitations (rai-005) or explaining one decision (rai-025)."},{"id":"rai-004","label":"Keep a reviewable record of what the AI did and who signed off on its decisions","answer":"Accountability","why":"Human oversight, governance and clear ownership of outcomes — audit logs and abuse monitoring — is accountability, not transparency (which is disclosure)."},{"id":"rai-027","label":"A bank designs its loan-recommendation AI so that a human reviewer, not the model itself, makes the final decision on escalated cases","answer":"Accountability","why":"Keeping a named human as the final authority over consequential decisions is accountability — the trap answer treats the AI system itself as the final authority, which accountability explicitly rejects."},{"id":"rai-028","label":"Even though a company uses an AI service built by someone else, the company remains responsible for how that solution is used and governed within its own operations","answer":"Accountability","why":"Responsibility for governance does not transfer away just because the underlying model or service is managed by a vendor — that non-transferable ownership is accountability."},{"id":"rai-029","label":"A team asks who is responsible if the AI system produces a harmful or incorrect outcome, and defines an escalation path before launch","answer":"Accountability","why":"Assigning responsibility and an escalation path for when things go wrong is accountability — it is about ownership of outcomes, not about what the system discloses (transparency)."},{"id":"rai-030","label":"Before a new AI feature can go live, a named risk owner must sign off on it, and the feature is blocked from release without that documented approval","answer":"Accountability","why":"A pre-launch approval gate tied to a named owner is a system-wide governance checkpoint, distinct from rai-027's per-case human override of an individual decision and from rai-028's vendor-responsibility point."}]},"decks/microsoft/workload-sort.json":{"id":"workload-sort","runner":"board","title":"The Intake Desk","blurb":"Every request that hits the desk goes to one of six AI workloads — triage fast, triage right.","source":"AI-901 study guide Task 1.3","asOf":"2026-07","area":"microsoft-workloads","hint":"Ask what the deliverable actually is: brand-new content from a prompt (generative), autonomous multi-step action with tools (agentic), a judgment or summary about existing text (text analysis), anything that touches spoken audio (speech), a judgment about an image or video frame (computer vision), or a fixed set of structured fields/an index pulled out of documents or mixed content (information extraction).","note":"Several requests could sound like two workloads. The tie-break is always the deliverable: new content vs. an autonomous action vs. an analysis of existing text vs. audio in/out vs. a judgment about pixels vs. a structured field set.","traps":["A single generated reply with no tool use or follow-up step is generative AI, not agentic AI — agentic AI requires autonomous multi-step action.","Summarization sounds like content creation but is grounded in and constrained by the source document, so the blueprint places it under text analysis, not generative AI.","Extracting fields from audio or video content against a fixed schema is information extraction, not speech — the deliverable is structured data, not a transcript."],"zones":[{"key":"Generative AI","name":"Generative AI","def":"Creating new content — text, images, code, or audio — from a prompt, rather than analyzing or acting on content that already exists."},{"key":"Agentic AI","name":"Agentic AI","def":"Autonomously planning, using tools, and taking multi-step action toward a goal, going beyond a single stateless response."},{"key":"Text analysis","name":"Text analysis","def":"Analyzing written text to surface meaning already present in it — sentiment, key phrases, entities, PII, or a grounded summary — without generating new content."},{"key":"Speech","name":"Speech","def":"Converting between spoken audio and text, or working directly with audio streams — recognition, synthesis, translation, and diarization."},{"key":"Computer vision","name":"Computer vision","def":"Analyzing the visual content of images and video frames — classifying, detecting objects, verifying faces, or reading a scene."},{"key":"Information extraction","name":"Information extraction","def":"Pulling a fixed set of structured fields, or a searchable index, out of documents, forms, or mixed-modality content."}],"items":[{"id":"wl-001","label":"Draft five candidate slogans for a new product from a two-line brief","answer":"Generative AI","why":"Creating new content from a prompt is generative AI — nothing is being analyzed, extracted or spoken."},{"id":"wl-007","label":"Create a photorealistic hero image for a product page from a two-sentence text description of the item and its setting","answer":"Generative AI","why":"Producing a brand-new image from a text prompt is generative AI's image side — there is no existing image being analyzed, which is what would make it computer vision."},{"id":"wl-008","label":"Produce a first draft of a product FAQ page from a bullet-point outline of talking points","answer":"Generative AI","why":"Turning a sparse outline into new prose is content creation from a prompt, the same capability as wl-001's slogans, just applied to a longer document."},{"id":"wl-009","label":"Answer a single one-off customer question in a chat window with one reply, with no follow-up steps or tools invoked","answer":"Generative AI","why":"One stateless response to one prompt is generative AI; the moment a system starts planning steps and calling tools on its own it crosses into agentic AI."},{"id":"wl-002","label":"An assistant that checks inventory, files the reorder, and emails the supplier without step-by-step prompts","answer":"Agentic AI","why":"Multi-step autonomous action with tool use is the agentic signature — histack's 'persistent assistant' vs 'one stateless response'."},{"id":"wl-010","label":"A travel-booking assistant compares fares across three sites, holds a seat, and completes the purchase once the price target is hit, with no human confirming each step","answer":"Agentic AI","why":"Comparing, deciding, and executing a purchase end to end with no per-step prompting is the agentic pattern, distinct from a chatbot that only replies."},{"id":"wl-011","label":"An IT-support assistant triages an incoming ticket, runs a diagnostic script against the affected server, and escalates to a human only if the automated fix fails","answer":"Agentic AI","why":"Tool use plus a conditional next action is the exam's 'tool use means the agent can call external capabilities' definition — distinct from a single generated response."},{"id":"wl-012","label":"A research assistant breaks a broad question into sub-questions, searches multiple sources for each, and stitches the findings into one final report","answer":"Agentic AI","why":"Task planning that decomposes a goal into steps, executed end to end, is the exam's task-planning-plus-task-completion definition of agentic AI, not a single generated answer."},{"id":"wl-013","label":"Scan free-text support tickets and flag any phone numbers or email addresses they contain before the tickets are stored","answer":"Text analysis","why":"PII detection flags sensitive spans inside unstructured text — a text-analysis feature, distinct from information extraction's fixed fields pulled from forms and documents."},{"id":"wl-014","label":"Return a short ranked list of the main topics mentioned across thousands of support tickets, without producing a rewritten paragraph","answer":"Text analysis","why":"Keyword extraction lists the salient terms; the exam's planted trap is offering summarization instead, which would produce prose rather than a topic list."},{"id":"wl-015","label":"Identify every person name, organization, and location mentioned across a batch of news articles","answer":"Text analysis","why":"Named entity recognition classifies mentions inside running text into people, places and organizations — a text-analysis capability, not extraction against a fixed document schema."},{"id":"wl-016","label":"Condense a 40-page policy document into a three-paragraph overview that captures its key points","answer":"Text analysis","why":"Summarization compresses existing text into new but faithful prose — text analysis, not generative AI, because the output is grounded in and constrained by the source document."},{"id":"wl-003","label":"Determine who spoke when in a recorded meeting (speaker diarisation)","answer":"Speech","why":"Diarisation separates speakers within audio — a speech capability. Trap: it generates nothing, so it is never synthesis."},{"id":"wl-004","label":"Low-latency, high-quality speech-to-speech interactions for a voice agent","answer":"Speech","why":"Verbatim Voice Live / gpt-realtime phrasing from the corpus — real-time audio in, audio out."},{"id":"wl-017","label":"Transcribe a batch of uploaded interview recordings once they have all finished uploading, rather than as they are spoken","answer":"Speech","why":"Batch transcription processes pre-recorded audio asynchronously — still a speech capability, just the offline sibling of real-time recognition, not a text or extraction task."},{"id":"wl-018","label":"Produce natural-sounding narrated audio for an e-learning module from a written script","answer":"Speech","why":"Converting written text into spoken audio is text-to-speech synthesis — the output side of the speech workload, mirroring wl-004's audio-in/audio-out case."},{"id":"wl-005","label":"Return bounding boxes around each vehicle in traffic-camera footage","answer":"Computer vision","why":"Object detection — bounding boxes per object — is computer vision, distinct from whole-image classification."},{"id":"wl-019","label":"Verify that the person in front of a login camera is a live human being, not a printed photo or a video replay","answer":"Computer vision","why":"Face liveness detection defends against presentation attacks by analyzing the live camera image — a computer-vision security capability, distinct from face verification's identity match."},{"id":"wl-020","label":"Detect scene changes and generate chapter markers by analyzing the visual frames of an uploaded training video","answer":"Computer vision","why":"Deriving chapter breaks from what the frames show is visual analysis of the video; the same footage shifts to speech only when the deliverable is the spoken transcript instead."},{"id":"wl-021","label":"Tag an uploaded photo with a single whole-image category such as 'beach' or 'city street', with no per-object locations needed","answer":"Computer vision","why":"Image classification assigns one label to the whole image, unlike wl-005's object detection, which returns per-object bounding boxes — both are computer vision, but distinct techniques."},{"id":"wl-006","label":"Pull the invoice number, total, and due date out of thousands of scanned PDFs","answer":"Information extraction","why":"Extracting structured fields from documents and forms is the information-extraction workload — Content Understanding territory in Domain 2."},{"id":"wl-022","label":"Run AI enrichment skills over thousands of scanned reports and images during indexing so content that was previously unsearchable becomes searchable","answer":"Information extraction","why":"This is knowledge mining — the exam's Azure AI Search definition of using AI skills to surface information from unstructured content into a search index."},{"id":"wl-023","label":"Return a schema-defined set of fields — call reason, resolution, and follow-up action — from a batch of recorded support calls","answer":"Information extraction","why":"Pulling a fixed business schema out of audio content is Content Understanding's structured extraction; the deliverable is defined fields, not a transcript, which is what would make it speech."},{"id":"wl-024","label":"Pull key-value pairs and table structure from a mixed batch of contracts, intake forms, and handwritten receipts using one reusable schema","answer":"Information extraction","why":"Structured field and table extraction across varied document types is document intelligence's layout/custom-model territory — the same workload as wl-006's invoices, applied to a broader document mix."}]},"decks/microsoft/param-dials.json":{"id":"param-dials","runner":"board","title":"Turn the Right Dial","blurb":"Text dials, image dials, deployment dials — match each symptom to the parameter that fixes it, past the near-miss the exam planted.","source":"AI-901 study guide Task 1.2; histack.net","asOf":"2026-07","area":"microsoft-models","zoneMode":"options","traps":["Tune temperature OR top_p — not both","max_tokens caps length, never randomness"],"items":[{"id":"pd-001","label":"You need consistent, repeatable output from the same prompt every run","answer":"Temperature","options":["Temperature","top_p","max_tokens"],"why":"histack's exact exam cue: 'consistent, repeatable output' → low temperature. It rescales the whole probability distribution; tune it or top_p, not both."},{"id":"pd-002","label":"Restrict sampling to the smallest set of tokens whose cumulative probability reaches a set threshold","answer":"top_p","options":["top_p","Temperature","Presence penalty"],"why":"Nucleus sampling — top_p truncates the candidate set, while temperature reshapes the whole distribution (corpus confused-pair #5)."},{"id":"pd-003","label":"Responses keep cutting off mid-sentence — you need complete answers","answer":"max_tokens","options":["max_tokens","Temperature","Stop sequence"],"why":"max_tokens caps output length only — the exam's most frequent parameter trap is offering it as a randomness control (pair #4)."},{"id":"pd-004","label":"The model keeps repeating one phrase; penalize tokens in proportion to how often they've appeared","answer":"Frequency penalty","options":["Frequency penalty","Presence penalty","top_p"],"why":"Frequency penalty scales with repeat count (repetition); presence penalty fires once a token has appeared at all (topic novelty) — corpus pair #6."},{"id":"pd-005","label":"Generated marketing images look rough — request the higher render fidelity tier","answer":"quality","options":["quality","size","n"],"why":"gpt-image-1's payload takes prompt, size, quality (including the 'high' trap value) and n — quality controls fidelity, size controls dimensions."},{"id":"pd-006","label":"See image progress sooner while a large generation renders","answer":"partial_images","options":["partial_images","n","quality"],"why":"Streaming partial_images on the images/generations path returns progressive output — the exam's 'see image progress sooner' stem verbatim."},{"id":"pd-007","label":"The randomness knob that reshapes the entire token probability distribution before sampling, not just the top slice","answer":"Temperature","options":["Temperature","top_p","Frequency penalty"],"why":"Temperature scales logits across the whole distribution; top_p instead truncates by cumulative probability mass — same 'creativity' intuition, different mechanism."},{"id":"pd-008","label":"The team wants the model to only ever consider the most probable slice of next-token candidates, cutting off the long tail","answer":"top_p","options":["top_p","Temperature","Presence penalty"],"why":"Nucleus sampling (top_p) restricts candidates to a cumulative-probability slice; temperature reshapes probabilities but never removes candidates outright."},{"id":"pd-009","label":"A hard ceiling on how many tokens a single response can generate, regardless of what it says","answer":"max_tokens","options":["max_tokens","Stop sequence","Temperature"],"why":"max_tokens is a length ceiling enforced during generation; a stop sequence instead halts generation early only when a specific string appears — different trigger, same 'shorter output' goal."},{"id":"pd-010","label":"Discourage the model from reusing the same word or phrase many times over — the more it repeats, the harder the pushback","answer":"Frequency penalty","options":["Frequency penalty","Presence penalty","top_p"],"why":"Frequency penalty scales with how often a token has already appeared; presence penalty applies a flat penalty the moment a token appears even once — count-proportional vs binary."},{"id":"pd-011","label":"The chat transcript never revisits earlier topics — the model always drifts onto new subject matter instead of returning to what it already covered","answer":"Presence penalty","options":["Presence penalty","Frequency penalty","top_p"],"why":"A high presence penalty fires the instant a token has appeared once, pushing the model toward new topics; frequency penalty scales with repeat count and mainly curbs literal repetition, not topic drift."},{"id":"pd-012","label":"Applies the same fixed penalty to any token that has shown up at all in the response so far, no matter how many times","answer":"Presence penalty","options":["Presence penalty","Frequency penalty","max_tokens"],"why":"Presence penalty is binary per-token (appeared or not); frequency penalty instead grows with repeat count — the exam's confused-pair distinction between the two penalty parameters."},{"id":"pd-013","label":"Generation should end the instant the model writes a specific marker string, without waiting to hit the length ceiling","answer":"Stop sequence","options":["Stop sequence","max_tokens","Temperature"],"why":"A stop sequence is a literal string trigger that halts generation early; max_tokens only enforces a length ceiling and has no awareness of specific text."},{"id":"pd-014","label":"A specific piece of text the model is told to treat as an ending marker, so output stops the moment that text is produced","answer":"Stop sequence","options":["Stop sequence","Frequency penalty","max_tokens"],"why":"Stop sequences trigger on matching text content; neither max_tokens nor frequency penalty inspects the generated text itself — one counts tokens, the other counts repeats."},{"id":"pd-015","label":"Latency must stay predictable at high, sustained request volume, and the team is fine paying reserved hourly cost to guarantee it","answer":"PTU deployment","options":["PTU deployment","Standard deployment","Capacity (TPM)"],"why":"Provisioned throughput (PTU) reserves dedicated capacity for predictable latency at scale; Standard deployment is pay-per-token with variable throughput under load, and Capacity (TPM) is only the quota dial, not the deployment type itself."},{"id":"pd-016","label":"Reserved, dedicated model capacity purchased ahead of time so throughput does not fluctuate with shared-tenant traffic","answer":"PTU deployment","options":["PTU deployment","Standard deployment","Capacity (TPM)"],"why":"PTU is the reserved-capacity deployment model; Standard shares capacity and bills per token with variable throughput, while Capacity (TPM) merely sets the quota on whichever deployment type is chosen."},{"id":"pd-017","label":"Traffic to the customer-support app is unpredictable and bursty, and the team wants pay-per-token billing instead of hourly reserved capacity","answer":"Standard deployment","options":["Standard deployment","PTU deployment","Capacity (TPM)"],"why":"Pay-per-token pricing under variable load is Standard deployment (the exam's exact scenario); PTU instead bills hourly for reserved capacity regardless of actual usage."},{"id":"pd-018","label":"Bills per token consumed rather than per hour of reserved compute, with throughput that can vary under shared load","answer":"Standard deployment","options":["Standard deployment","PTU deployment","Capacity (TPM)"],"why":"Standard is consumption-based billing with variable throughput; PTU trades that variability for a fixed hourly reservation, and Capacity (TPM) is the quota setting layered on top of either model."},{"id":"pd-019","label":"A deployment keeps hitting throttling under peak load, so the team shifts spare throughput quota over from another underused deployment","answer":"Capacity (TPM)","options":["Capacity (TPM)","PTU deployment","Standard deployment"],"why":"The per-deployment
