        + rrOptOrder(card).map(o => `<button disabled class="${o===card.answer ? "correct"
            : (r.pick===o ? "wrong" : "")}">${esc(o)}</button>`).join("")
        + `</div></div>
        <p class="why" style="margin:9px 0 0;font-size:13px">${esc(card.why)}</p>
        <p class="cite">${t("rr.citation_line", {citation:esc(card.citation), asOf:esc(card.asOf)})}</p>`;
      body += r.ok
        ? aiLinks(explainPrompt(`Regulatory Risk — ${v.name}`,
            [{label:card.q, answer:card.answer, why:card.why}],
            `${a.type} action in ${v.name}, playing as ${camp.role}`),
            t("rr.explain_link"))
        : aiLinks(deepenPrompt(`Regulatory Risk — ${v.name}`,
            [{label:card.q, said:r.pick, answer:card.answer, why:card.why}],
            `${a.type} action in ${v.name}, playing as ${camp.role}`),
            t("rr.deepen_link"));
    }
    if(r.done){
      body += `<div class="reveal"><p class="score ${r.done.ok ? "ok" : "no"}">${esc(r.done.msg)}</p>`;
      if(r.done.bust) body += `<p class="score no">${t("rr.capital_exhausted")}</p>`;
      body += `</div>`;
    }
    const label = r.done ? (r.done.bust ? t("rr.action_to_debrief") : t("rr.action_return_board"))
                         : t("rr.action_next_question");
    body += `<div class="row"><button class="btn" id="rr-cont">${label}</button></div>`;
    shell(body); wireAiLinks();
    document.getElementById("rr-cont").onclick = () => {
      const done = r.done;
      state.rr.reveal = null; state.rr.qPick = null; state.rr.confirmWd = false;
      if(done){ state.rr.action = null; state.rr.screen = done.bust ? "debrief" : "board"; }
      render();
    };
    return;
  }

  /* stage 2 — live question (pending persisted; withdrawing now costs) */
  if(camp.pending){
    const p = camp.pending, card = rrCard(p.cardIds[p.qIndex]);
    if(!card){ camp.pending = null; rrSave(); return toBoard(); }   // data drift guard
    const wd = state.rr.confirmWd;
    const wdWarn = a.type === "expand"
      ? t("rr.wd_gate_fail", {gateFailCost:cfg.gateFailCost, nexusMessage:rrNexusCopy(a.terr)})
      : a.type === "defend"
      ? t("rr.wd_defend_fail", {gateFailCost:cfg.gateFailCost})
      : a.type === "audit"
      ? t("rr.wd_audit_fail", {territory:v.name})
      : a.type === "check"
      ? t("rr.wd_check_fail", {penalty:(a.penalty || 0)
          ? t("rr.wd_check_penalty_amount", {penalty:a.penalty})
          : t("rr.wd_check_reward_forfeit")})
      : t("rr.wd_missed");
    const body = `<p class="hint">${t("rr.question_progress",
        {n:p.qIndex + 1, total:p.cardIds.length, correct:p.correctSoFar})}${a.type==="expand"
        ? " · " + t("rr.first_miss_note") : ""}</p>
      <div class="field"><div class="scenario">${esc(card.q)}</div><div class="pick">`
      + rrOptOrder(card).map(o => `<button data-rr-opt="${esc(o)}"
          aria-pressed="${state.rr.qPick===o}">${esc(o)}</button>`).join("")
      + `</div></div>
      ${wd ? `<p class="why" style="margin:0 0 9px;font-size:13px">${esc(wdWarn)}</p>` : ""}
      <div class="row"><button class="btn" id="rr-submit" ${state.rr.qPick ? "" : "disabled"}>
        ${state.rr.qPick ? t("rr.action_submit_answer") : t("rr.action_pick_answer")}</button>
      <button class="btn ghost" id="rr-wd">${wd ? t("rr.action_really_withdraw") : t("rr.action_withdraw")}</button></div>`;
    shell(body);
    main.querySelectorAll("[data-rr-opt]").forEach(b => b.onclick = () => {
      state.rr.qPick = b.dataset.rrOpt; render();
    });
    document.getElementById("rr-submit").onclick = () => {
      const pick = state.rr.qPick;
      if(!pick) return;
      const ok = pick === card.answer;
      record(card.id, ok);                       // SR commit at every submit (ADD §6.3)
      camp.askedQ.push(card.id);
      // Per-question ledger for the debrief review list + print report. Same
      // rr-campaign-v1 key, additive field — no new localStorage keys.
      (camp.answers = camp.answers || []).push({id:card.id, ok, pick, t:camp.turn});
      if(ok) p.correctSoFar++;
      let done = null;
      if(!ok) done = rrResolveFail(a);           // first miss ends gate AND defence
      else if(p.qIndex + 1 >= p.cardIds.length) done = rrResolvePass(a);
      else { p.qIndex++; rrSave(); }             // pending persisted after every submit
      state.rr.reveal = {cardId:card.id, pick, ok, done};
      state.rr.qPick = null; state.rr.confirmWd = false;
      render();
    };
    document.getElementById("rr-wd").onclick = () => {
      if(!state.rr.confirmWd){ state.rr.confirmWd = true; return render(); }
      const done = rrResolveFail(a);             // no record(): nothing was submitted
      state.rr.reveal = {cardId:null, pick:null, ok:false, done};
      state.rr.qPick = null; state.rr.confirmWd = false;
      render();
    };
    return;
  }

  /* stage 1 — intro: no stem revealed yet, withdrawing is free */
  // One-action-per-turn at the mutation layer (playtest wave 1): re-derive
  // `acted` from the log here, not just in the board's button rendering, so a
  // forced screen state cannot double-act. Regulator-phase actions (audit /
  // check) are exempt — the guard keys on player-phase action types only.
  const rrPlayerActs = ["expand","defend","consolidate"];
  const rrActedNow = () => camp.log.some(l => l.t === camp.turn && rrPlayerActs.includes(l.a));
  let bad = null;
  if(rrPlayerActs.includes(a.type) && rrActedNow())
    bad = t("rr.action_already_taken_turn");
  if(a.type === "expand" && v.held) bad = t("rr.action_already_held", {territory:v.name});
  if(a.type === "defend" && !notice) bad = t("rr.action_no_open_notice", {territory:v.name});
  if(a.type === "consolidate"){
    if(!v.held) bad = t("rr.action_not_held", {territory:v.name});
    else if((camp.held[a.terr].consolidates || 0) >= rrConsLimit(a.terr))
      bad = t("rr.action_consolidate_limit", {territory:v.name, limit:rrConsLimit(a.terr)});
  }
  if(bad){
    shell(`<p class="hint">${esc(bad)}</p>
      <div class="row"><button class="btn" id="rr-back2">${t("rr.action_back_board")}</button></div>`);
    document.getElementById("rr-back2").onclick = toBoard;
    return;
  }
  const entryCost = (a.type === "expand" && v.entryCost) || 0;
  const canAfford = !(entryCost > 0 && camp.capital <= entryCost);
  let stakes;
  if(a.type === "expand"){
    const hooked = rrHookedOps(a.terr);
    const noticeLine = !v.noticeOnFail
      ? t("rr.stakes_notice_none", {tier:v.tier})
      : hooked.length
      ? t("rr.stakes_notice_hooked", {operations:rrOpNames(hooked), territory:v.name})
      : t("rr.stakes_notice_no_nexus", {territory:v.name});
    const costLine = entryCost
      ? " " + t("rr.stakes_cost_line", {tier:v.tier, entryCost, gateFailCost:cfg.gateFailCost})
      : "";
    stakes = t("rr.stakes_expand_gate", {gateSize:v.gateSize, role:camp.role}) + costLine + "\n      "
      + t("rr.stakes_first_miss", {gateFailCost:cfg.gateFailCost, noticeLine});
  }else if(a.type === "defend"){
    stakes = (notice.level >= 2
      ? t("rr.stakes_defend_multi", {level:notice.level, gateFailCost:cfg.gateFailCost})
      : t("rr.stakes_defend_single", {level:notice.level, gateFailCost:cfg.gateFailCost}));
  }else{
    stakes = t("rr.stakes_consolidate", {cap:cfg.capitalCap,
      used:(camp.held[a.terr].consolidates || 0), limit:rrConsLimit(a.terr)});
  }
  shell(`<p class="hint">${esc(stakes)}</p>
    <p class="hint">${t("rr.stakes_withdraw_free")}</p>
    ${canAfford ? "" : `<p class="why" style="margin:0 0 9px;font-size:13px">${esc(t("rr.entry_would_bust",
      {cost:entryCost, capital:camp.capital}) + t("rr.gate_cannot_begin_suffix"))}</p>`}
    <div class="row"><button class="btn" id="rr-begin" ${canAfford ? "" : "disabled"}>
      ${canAfford ? t("rr.action_show_question") : t("rr.action_need_capital", {cost:entryCost})}</button>
      <button class="btn ghost" id="rr-wdfree">${t("rr.action_withdraw_free")}</button></div>`);
  document.getElementById("rr-wdfree").onclick = toBoard;
  document.getElementById("rr-begin").onclick = () => {
    const badState = msg => {
      shell(`<p class="hint">${esc(msg)}</p>
        <div class="row"><button class="btn" id="rr-back2">${t("rr.action_back_board")}</button></div>`);
      document.getElementById("rr-back2").onclick = toBoard;
    };
    // Mutation-layer turn guard (playtest wave 1): re-check the log right
    // before pending is created — the intro screen may be stale or forced.
    if(rrPlayerActs.includes(a.type) && rrActedNow())
      return badState(t("rr.action_already_taken_turn"));
    let cardIds;
    if(a.type === "expand") cardIds = rrDrawGate(a.terr, camp.role, rrDrawSeed());
    else if(a.type === "defend") cardIds = rrDrawDefend(notice);
    else cardIds = rrDrawConsolidate(a.terr);
    // Empty-draw guard (playtest wave 1): never silently bounce begin→board.
    if(!cardIds.length)
      return badState(t("rr.action_no_available", {actionType:a.type === "expand" ? "gate" : "question", territory:v.name}));
    // Tier entry stake — charged exactly once, in the same code path that
    // creates pending (a reload mid-gate resumes pending and never re-charges).
    // Returned on a gate pass (rrResolvePass); lost on fail/withdraw, with
    // gateFailCost on top of a fail. Mutation-layer affordability guard:
    // entering must not itself bust you (bust fires at capital ≤ 0).
    if(entryCost > 0){
      if(camp.capital <= entryCost)
        return badState(t("rr.action_entry_bust_check", {cost:entryCost, capital:camp.capital}));
      camp.capital -= entryCost;
    }
    camp.pending = {action:a.type, terr:a.terr, cardIds, qIndex:0, correctSoFar:0};
    if(a.type === "defend") camp.pending.noticeId = notice.id;
    if(a.type === "consolidate")
      camp.held[a.terr].consolidates = (camp.held[a.terr].consolidates || 0) + 1;
    rrSave();                                    // stem now committed — no re-roll scouting
    state.rr.qPick = null; state.rr.confirmWd = false;
    render();
  };
}

/* ---- slice 3: regulator phase (ADD §1.2 step 3, §4.3, §5.2-5) ---- */
// Which territory an audit lands on: the effect names one, or "match" resolves
// against the event's weighted holdings — held first, then noticed.
function rrAuditTerr(e, camp){
  const cands = e.effect.territory === "match"
    ? ((e.weight || {}).holdings || []) : [e.effect.territory];
  return cands.find(id => camp.held[id])
      || cands.find(id => camp.notices.some(n => n.terr===id)) || null;
}
function rrEventEligible(e, camp, cfg){
  if(camp.deckDrawn.includes(e.id)) return false;          // without replacement
  const w = e.weight || {}, t = e.effect.type;
  if(w.minTurn && camp.turn < w.minTurn) return false;
  if(w.hats && w.hats.length && !w.hats.includes(camp.hat)) return false;
  if(t === "roleShift"){
    if(camp.turn < cfg.roleShiftMinTurn) return false;
    if(camp.roleShiftsFired >= cfg.roleShiftMax) return false;
    if(e.effect.toRole === camp.role) return false;
  }
  if(t === "audit" && !rrAuditTerr(e, camp)) return false; // neither held nor noticed
  return true;
}
// ADD §4.3 weighting: base 1; +2 holdings held; +1 noticed holdings (+2 at
// L2+); +2 operations overlap; +1 coverage tier matching ≥2 held; +2
// rubber-band lifeline on reward events at capital ≤ 2.
function rrEventWeight(e, camp){
  const w = e.weight || {};
  let x = 1;
  if((w.holdings || []).some(id => camp.held[id])) x += 2;
  const lv = (w.holdings || []).reduce((m, id) =>
    camp.notices.reduce((mm, n) => n.terr===id ? Math.max(mm, n.level) : mm, m), 0);
  if(lv >= 2) x += 2; else if(lv >= 1) x += 1;
  if((w.operations || []).some(op => camp.operations.includes(op))) x += 2;
  if((w.coverage || []).some(cv =>
    Object.keys(camp.held).filter(id => (rrJur(id) || {}).coverage===cv).length >= 2)) x += 1;
  if((e.effect.reward || 0) > 0 && camp.capital <= 2) x += 2;
  return x;
}
function rrEventDraw(){
  const camp = rrState(), cfg = rrCfg();
  const evs = rrData().campaign.events;
  let pool = evs.filter(e => rrEventEligible(e, camp, cfg));
  if(!pool.length){
    // Deck exhausted: reshuffle, minus fired role-shifts (ADD §4.3).
    camp.deckDrawn = camp.deckDrawn.filter(id => {
      const e = evs.find(x => x.id===id);
      return e && e.effect.type === "roleShift";
    });
    pool = evs.filter(e => rrEventEligible(e, camp, cfg));
  }
  if(!pool.length) return null;
  const rnd = rrRand((camp.seed ^ Math.imul(camp.turn, 68767) ^ 0x2545F49) >>> 0);
  const weights = pool.map(e => rrEventWeight(e, camp));
  let roll = rnd() * weights.reduce((s, w) => s + w, 0);
  for(let i = 0; i < pool.length; i++){
    roll -= weights[i];
    if(roll <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}
// Phase A aging + Phase B draw, applied EXACTLY once per turn and persisted in
// camp.reg so a reload resumes the same interstitial (same event, no re-roll).
function rrRegBegin(){
  const camp = rrState(), cfg = rrCfg();
  if(camp.reg && camp.reg.turn === camp.turn) return;    // already running
  const lines = [];
  camp.notices.forEach(n => {
    n.ageTurns = (n.ageTurns || 0) + 1;
    const name = (rrJur(n.terr) || {name:n.terr}).name;
    if(n.level === 1 && n.ageTurns >= cfg.escalateEveryTurns){
      n.level = 2;
      lines.push({cls:"warn", txt:t("rr.event_escalate", {territory:name})});
    }else if(n.level === 2 && n.ageTurns >= cfg.escalateEveryTurns * 2){
      n.level = 3;
      camp.capital -= cfg.l3Cost;
      camp.sanctions += 1;
      const rec = camp.held[n.terr];
      if(rec) rec.suspended = true;
      lines.push({cls:"no", txt:t("rr.event_enforcement", {territory:name.toUpperCase(), penalty:cfg.l3Cost, suspended:rec ? t("rr.suspended_fragment") : ""})});
    }else{
      lines.push({cls:"", txt:t("rr.event_open", {territory:name, level:n.level, turns:n.ageTurns, plural:n.ageTurns===1 ? "phase" : "phases"})});
    }
  });
  camp.reg = {turn:camp.turn, lines, ev:null, terr:null, shiftLines:null, bust:false};
  if(camp.capital <= 0){                                   // bust check after aging
    camp.reg.bust = true;
    rrSave();
    return;
  }
  const pick = rrEventDraw();
  if(pick){
    camp.deckDrawn.push(pick.id);
    camp.reg.ev = pick.id;
    const eff = pick.effect;
    if(eff.type === "audit") camp.reg.terr = rrAuditTerr(pick, camp);
    if(eff.type === "roleShift"){
      // ADD §2.4: role changes now; one random held comprehensive territory
      // gains an L1 notice whose defend pool is the any-pool duty-shift cards.
      camp.role = eff.toRole;
      camp.roleShiftsFired += 1;
      const shift = [t("rr.role_shift_msg", {newRole:eff.toRole.toUpperCase()})];
      const comps = Object.keys(camp.held).filter(id =>
        (rrTerr(id) || {}).tier === "comprehensive" && !camp.held[id].suspended);
      if(comps.length){
        const terrId = comps[Math.floor(rrRand((camp.seed ^ Math.imul(camp.turn, 40503)) >>> 0)()
          * comps.length)];
        camp.noticeSeq = (camp.noticeSeq || 0) + 1;
        camp.notices.push({id:"n"+camp.noticeSeq, terr:terrId, level:1, ageTurns:0,
                           source:pick.id, pool:"any"});
        shift.push(t("rr.role_shift_notice", {territory:(rrJur(terrId) || {name:terrId}).name}));
      }
      camp.reg.shiftLines = shift;
      rrEvResolved(pick.id, t("rr.event_res_role_shift", {toRole:eff.toRole}));
    }
    if(eff.type === "info") rrEvResolved(pick.id, t("rr.event_res_noted"));
  }
  rrSave();
}

/* S4 — regulator interstitial: ONGOING MATTERS aging block first (ADD §5.2-5),
   then the drawn event, then [ YOUR TURN → ]. */
function rrRenderRegulator(){
  const camp = rrState();
  if(!camp){ state.rr.screen = "role"; return rrRenderRole(); }
  if(!camp.reg || camp.reg.turn !== camp.turn) rrRegBegin();
  const cfg = rrCfg(), reg = camp.reg;
  const ev = reg.ev ? rrData().campaign.events.find(e => e.id===reg.ev) : null;
  const aging = `<div class="rr-group">${t("rr.ongoing_heading")}</div><div class="rr-aging">`
    + (reg.lines.length
        ? reg.lines.map(l => `<div class="rr-age ${l.cls}">${esc(l.txt)}</div>`).join("")
        : `<div class="rr-age">${t("rr.no_matters")}</div>`)
    + `</div>`;
  const head = `<div class="row" style="margin:0 0 12px"><strong>${t("rr.regulator_phase_head",
      {turn: camp.turn, totalTurns: cfg.turns})}</strong>
    <span class="badge">₿ ${camp.capital}</span>
    <span class="badge">⚑ ${camp.notices.length}</span></div>`;
  let body = head + aging, wire = null;
  if(reg.bust){
    body += `<p class="score no">${t("rr.bust_message")}</p>
      <div class="row"><button class="btn" id="rr-toend">${t("rr.action_to_debrief")}</button></div>`;
    wire = () => document.getElementById("rr-toend").onclick = () => {
      state.rr.screen = "debrief"; render();
    };
  }else if(!ev){
    body += `<div class="rr-event"><h3>${t("rr.quiet_docket_title")}</h3>
        <p>${t("rr.quiet_docket_text")}</p></div>
      <div class="row"><button class="btn" id="rr-turn">${t("rr.your_turn_button")}</button></div>`;
  }else{
    const cite = `<p class="cite">${t("rr.citation_line", {citation:esc(ev.citation), asOf:esc(ev.asOf)})}</p>`;
    if(ev.effect.type === "audit"){
      const tn = (rrJur(reg.terr) || {name:reg.terr}).name;
      body += `<div class="rr-event"><h3>⚖ ${esc(ev.title)}</h3><p>${esc(ev.text)}</p>
          <p class="hint">${t("rr.audit_hint")}</p>${cite}</div>
        <div class="row"><button class="btn" id="rr-face">${t("rr.face_audit_button")}</button></div>`;
      wire = () => document.getElementById("rr-face").onclick = () => {
        const cardIds = rrDrawDefend({terr:reg.terr, level:1});
        if(!cardIds.length){ rrEvResolved(ev.id, t("rr.event_res_no_file")); rrTurnEnd();
          state.rr.screen = "board"; return render(); }
        camp.pending = {action:"audit", terr:reg.terr, cardIds, qIndex:0,
                        correctSoFar:0, eventId:ev.id, evName:ev.title};
        rrSave();
        state.rr.action = rrActionFromPending(camp.pending);
        state.rr.qPick = null; state.rr.confirmWd = false;
        state.rr.screen = "action"; render();
      };
    }else if(ev.effect.type === "check"){
      const rew = ev.effect.reward || 0, pen = ev.effect.penalty || 0;
      const hint = `${rew ? t("rr.check_right_text", {reward: rew, cap: cfg.capitalCap}) + " " : ""}${pen ? t("rr.check_wrong_text", {penalty: pen}) : t("rr.check_no_loss")} ${t("rr.check_never_notice")}`;
      body += `<div class="rr-event"><h3>☑ ${esc(ev.title)}</h3><p>${esc(ev.text)}</p>
          <p class="hint">${hint}</p>${cite}</div>
        <div class="row"><button class="btn" id="rr-face">${t("rr.make_call_button")}</button></div>`;
      wire = () => document.getElementById("rr-face").onclick = () => {
        const pool = (ev.effect.cardId ? [rrCard(ev.effect.cardId)]
          : (ev.effect.cardPool || []).map(id => rrCard(id))).filter(Boolean);
        const cardIds = rrDrawFrom(pool, 1, rrDrawSeed());
        if(!cardIds.length){ rrEvResolved(ev.id, t("rr.event_res_no_card")); rrTurnEnd();
          state.rr.screen = "board"; return render(); }
        const ct = (rrCard(cardIds[0]) || {}).territory;
        camp.pending = {action:"check", terr:ct==="any" ? null : ct, cardIds, qIndex:0,
                        correctSoFar:0, eventId:ev.id, evName:ev.title,
                        reward:rew, penalty:pen};
        rrSave();
        state.rr.action = rrActionFromPending(camp.pending);
        state.rr.qPick = null; state.rr.confirmWd = false;
        state.rr.screen = "action"; render();
      };
    }else if(ev.effect.type === "roleShift"){
      body += `<div class="rr-event"><h3>⇄ ${esc(ev.title)}</h3><p>${esc(ev.text)}</p>
          ${(reg.shiftLines || []).map(l => `<p class="score no" style="font-size:14px">
            ${esc(l)}</p>`).join("")}${cite}</div>
        <div class="row"><button class="btn" id="rr-turn">${t("rr.your_turn_button")}</button></div>`;
    }else{
      body += `<div class="rr-event"><h3>ℹ ${esc(ev.title)}</h3><p>${esc(ev.text)}</p>${cite}</div>
        <div class="row"><button class="btn" id="rr-turn">${t("rr.your_turn_button")}</button></div>`;
    }
  }
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack();
  if(wire) wire();
  const tn = document.getElementById("rr-turn");
  if(tn) tn.onclick = () => { rrTurnEnd(); state.rr.screen = "board"; render(); };
}

/* S5 — US inset bottom sheet: 5 hand-authored simple shapes sharing the
   territory tint classes (ADD §5.4), each row a ≥44px target. Rendered as an
   overlay on the live board so the world map stays visible behind the scrim. */
const RR_INSET_SHAPES = {
  "map-us-co":  '<rect  x="14" y="26" width="72" height="48"/>',
  "map-us-tx":  '<path d="M34 8h22v28h32l-8 24-22 30-20-16-6-26 2-20z"/>',
  "map-us-il":  '<path d="M34 10h32l6 22-4 34-14 24-16-14-6-32z"/>',
  "map-us-nyc": '<circle cx="50" cy="50" r="26"/>',
  "map-us-ca":  '<path d="M28 8h26v36l24 30-8 18-30-8-12-40z"/>'
};
function rrRenderInset(){
  const camp = rrState();
  if(!camp){ state.rr.screen = "role"; return rrRenderRole(); }
  rrRenderBoard();
  if(state.rr.screen !== "inset") return;      // the board redirected elsewhere
  const acted = camp.log.some(l => l.t === camp.turn
    && ["expand","defend","consolidate"].includes(l.a));
  const rows = RR_INSET_IDS.map(id => {
    const v = rrTerr(id), dis = acted ? " disabled" : "";
    let acts = "";
    if(v.noticeLevel) acts += `<button class="btn rr-act" data-rr-act="defend"
      data-rr-terr="${id}"${dis}>${t("rr.inset_defend")}</button>`;
    if(v.held){
      const consDone = (camp.held[id].consolidates || 0) >= rrConsLimit(id);
      acts += `<button class="btn ghost rr-act" data-rr-act="consolidate"
        data-rr-terr="${id}"${consDone ? " disabled" : dis}>${consDone
        ? t("rr.inset_consolidated") : t("rr.inset_consolidate")}</button>`;
    }
    else acts += rrExpandBtn(v, camp, acted);
    const frame = id==="map-us-nyc" ? `<rect class="rr-frame" x="16" y="16"
      width="68" height="68"/>` : "";
    const shape = RR_INSET_SHAPES[id]
      .replace("/>", ` class="t t-${v.sid} cov-${v.tier}"/>`);
    return `<div class="rr-inset-row">
      <svg class="rr-svg" viewBox="0 0 100 100" aria-hidden="true"
        style="position:static">${frame}${shape}</svg>
      <span class="rr-badge cov-${v.tier}">${RR_COV_LETTER[v.tier] || "?"}</span>

/* S6 — debrief: score per ADD §1.6 (market + capital − open notices − 2 ×
   sanctions; bust is always F), grade thresholds from config (sim-tuned per
   SPEC §2.5), review list, aiLinks, replay CTA, print strategy report. */
function rrScore(camp){
  let market = 0;
  const parts = [];
  Object.keys(camp.held).forEach(id => {
    const v = rrTerr(id);
    if(!v || camp.held[id].suspended) return;
    market += v.market;
    parts.push(`${v.short} +${v.market}`);
  });
  const open = camp.notices.length;
  const score = market + camp.capital - open - 2 * camp.sanctions;
  const bust = camp.capital <= 0;
  return {market, parts, open, sanctions:camp.sanctions, capital:camp.capital,
          score, bust, grade:bust ? "F" : rrGrade(score)};
}
// Hardened (playtest wave 1): survives fallback card objects with no fact/id
// (card-id drift across redeploys) instead of throwing mid-debrief render.
function rrFactText(card){ return String(card.fact || card.id || card.q || "?").replace(/-/g, " "); }
function rrTerrName(terr){
  if(!terr || terr === "any") return t("rr.cross_cutting");
  return (rrJur(terr) || {name:terr}).name;
}
// Print-only one-page strategy report (SPEC §2.7). Pure markup derived from
// the campaign in memory — nothing persisted, no new localStorage keys.
function rrPrintReport(camp, s){
  const C = rrData().campaign, cfg = C.config;
  const role = (C.roles.find(r => r.id===camp.role) || {name:camp.role}).name;
  const hat = (C.hats.find(h => h.id===camp.hat) || {name:camp.hat}).name;
  const arith = t("rr.print_score_arith", {market:s.market,
    parts:s.parts.length ? ` (${s.parts.join(" · ")})` : "",
    capitalDelta:s.capital < 0 ? `− ${-s.capital}` : `+ ${s.capital}`,
    open:s.open, noticePlural:s.open===1 ? "" : "s",
    sanctions:s.sanctions, sanctionPlural:s.sanctions===1 ? "" : "s", score:s.score,
    gradeFrag:s.bust ? t("rr.bust_message") : t("rr.grade_fragment", {grade:s.grade})});
  const tierOrder = ["comprehensive","sectoral","proposed","voluntary","none","treaty"];
  const terrRows = tierOrder.map(tier =>
    rrData().map.jurisdictions.filter(j => j.coverage===tier).map(j => {
      const v = rrTerr(j.id);
      const status = v.suspended ? t("rr.print_suspended_status") : v.held
        ? t("rr.print_held_status", {turn:camp.held[j.id].turnClaimed}) : t("rr.print_open_status");
      const outcome = v.held && !v.suspended ? t("rr.print_outcome_market", {market:v.market}) : "—";
      const notice = v.noticeLevel ? " · " + t("rr.print_notice_open", {level:v.noticeLevel}) : "";
      return `<tr><td>${esc(tier)}</td><td>${RR_COV_LETTER[tier] || "?"}</td>
        <td>${esc(v.name)}</td><td>${esc(status + notice)}</td><td>${esc(outcome)}</td></tr>`;
    }).join("")).join("");
  const evRows = (camp.eventsFaced || []).map(f => {
    const e = C.events.find(x => x.id===f.id) || {title:f.id};
    return `<tr><td>${esc(e.title)}</td><td>${esc(f.res)}</td></tr>`;
  }).join("") || `<tr><td colspan="2">${t("rr.print_no_events")}</td></tr>`;
  const qRows = (camp.answers || []).map((an, i) => {
    const card = rrCard(an.id) || {id:an.id};
    return `<tr><td>${i + 1}</td><td>${an.ok ? "✓" : "✗"}</td>
      <td>${esc(rrTerrName(card.territory))}</td>
      <td>${esc(rrFactText(card))}</td>
      <td>${esc(card.citation || "")}</td></tr>`;
  }).join("") || `<tr><td colspan="5">${t("rr.print_no_questions")}</td></tr>`;
  const missedBy = {};
  (camp.answers || []).filter(an => !an.ok).forEach(an => {
    const card = rrCard(an.id) || {id:an.id};
    const k = rrTerrName(card.territory);
    (missedBy[k] = missedBy[k] || []).push(rrFactText(card));
  });
  const study = Object.keys(missedBy).length
    ? Object.keys(missedBy).sort().map(k =>
        `<li><b>${esc(k)}:</b> ${esc([...new Set(missedBy[k])].join(" · "))}</li>`).join("")
    : `<li>${t("rr.print_no_missed")}</li>`;
  return `<div class="rr-print">
    <h2>${t("rr.print_title")}</h2>
    <p><b>${t("rr.print_role_label")}</b> ${esc(role)} · <b>${t("rr.print_hat_label")}</b> ${esc(hat)} · <b>${t("rr.print_operations_label")}</b>
      ${esc(rrOpNames(camp.operations))} · <b>${t("rr.print_date_label")}</b>
      ${new Date().toISOString().slice(0, 10)} ·
      <b>${t("rr.print_grade_label", {grade:s.grade})}</b> ${t("rr.print_turn_of",
      {turn:Math.min(camp.turn, cfg.turns), total:cfg.turns})}</p>
    <p><b>${t("rr.print_score_label")}</b> ${esc(arith)}</p>
    <h3>${t("rr.print_territories_head")}</h3>
    <table><tr><th>${t("rr.print_th_tier")}</th><th></th><th>${t("rr.print_th_territory")}</th><th>${t("rr.print_th_status")}</th><th>${t("rr.print_th_outcome")}</th></tr>
      ${terrRows}</table>
    <h3>${t("rr.print_events_head")}</h3>
    <table><tr><th>${t("rr.print_th_event")}</th><th>${t("rr.print_th_resolution")}</th></tr>${evRows}</table>
    <h3>${t("rr.print_questions_head")}</h3>
    <table><tr><th>#</th><th></th><th>${t("rr.print_th_jurisdiction")}</th><th>${t("rr.print_th_tested_fact")}</th>
      <th>${t("rr.print_th_citation")}</th></tr>${qRows}</table>
    <h3>${t("rr.print_study_head")}</h3>
    <ul>${study}</ul>
  </div>`;
}
function rrRenderDebrief(){
  const camp = rrState();
  if(!camp){ state.rr.screen = "role"; return rrRenderRole(); }
  const cfg = rrCfg();
  if(camp.turn <= cfg.turns && camp.capital > 0 && !state.rr.forceDebrief){
    state.rr.screen = "board"; return rrRenderBoard();
  }
  const C = rrData().campaign;
  const s = rrScore(camp);
  const answers = camp.answers || [];
  const right = answers.filter(a => a.ok).length;
  const otherRole = C.roles.find(r => r.id !== camp.role) || C.roles[0];
  const otherHat = C.hats.find(h => h.id !== camp.hat) || C.hats[0];
  const arith = t("rr.debrief_score_arith", {market:s.market,
    parts:s.parts.length ? `(${s.parts.join(" · ")}) ` : "",
    capitalDelta:s.capital < 0 ? `− ${-s.capital}` : `+ ${s.capital}`,
    open:s.open, noticePlural:s.open===1 ? "" : "s",
    sanctions:s.sanctions, sanctionPlural:s.sanctions===1 ? "" : "s", score:s.score});
  const review = answers.map(an => {
    const card = rrCard(an.id) || {id:an.id, q:an.id, citation:""};
    return `<div class="rr-q${an.ok ? "" : " miss"}">${an.ok ? "✓" : "✗"}
      <b>${esc(rrTerrName(card.territory))}</b> — ${esc(rrFactText(card))}
      <em>${esc(card.q || "")}</em>
      <em>${esc(card.citation || "")} · turn ${an.t}</em></div>`;
  }).join("") || `<p class="hint">${t("rr.debrief_no_questions")}</p>`;
  const missed = answers.filter(an => !an.ok).map(an => {
    const card = rrCard(an.id) || {id:an.id};
    return {label:card.q || an.id, said:an.pick, answer:card.answer, why:card.why};
  });
  const allItems = answers.map(an => {
    const card = rrCard(an.id) || {id:an.id};
    return {label:card.q || an.id, answer:card.answer, why:card.why};
  });
  let links = "";
  if(allItems.length)
    links += aiLinks(explainPrompt(t("rr.print_campaign_debrief"), allItems,
      `${cfg.turns}-turn campaign as ${camp.role} + ${camp.hat}, grade ${s.grade}`),
      t("rr.debrief_dial_campaign"));
  if(missed.length)
    links += aiLinks(deepenPrompt(t("rr.print_campaign_debrief"), missed,
      `campaign as ${camp.role} + ${camp.hat}`), t("rr.deepen_link"));
  const stats = `<div class="row" style="margin:0 0 4px">
    <span class="badge">${t("rr.badge_turn", {turn: Math.min(camp.turn, cfg.turns), totalTurns: cfg.turns})}</span>
    <span class="badge">${t("rr.badge_questions", {correct: right, total: answers.length})}</span>
    <span class="badge">${t("rr.badge_held", {held: Object.keys(camp.held).length})}</span>
    <span class="badge">${t("rr.badge_events", {n: (camp.eventsFaced || []).length})}</span>
    <span class="badge">${t("rr.badge_sanctions", {n: s.sanctions})}</span></div>`;
  const body = `<p class="score ${s.bust ? "no" : (s.grade==="A+" || s.grade==="A")
      ? "ok" : s.grade==="F" ? "no" : "mid"}">${t("rr.grade_display", {grade: s.grade})}${s.bust
      ? t("rr.grade_bust_suffix") : ""}</p>
    ${stats}
    <div class="rr-arith"><b>${t("rr.score_arithmetic_label")}</b> ${esc(arith)}
      ${s.bust ? " — " + t("rr.bust_overrides") : ""}</div>
    <div class="rr-group">${t("rr.review_heading")}</div>
    <div class="rr-review">${review}</div>
    ${links}
    <div class="row">
      <button class="btn" id="rr-replay">${t("rr.replay_button", {role: otherRole.name, hat: otherHat.name})}</button>
      <button class="btn ghost" id="rr-print">${t("rr.print_button")}</button>
      <button class="btn ghost" id="rr-new">${t("rr.new_campaign_button")}</button></div>`;
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`
    + rrPrintReport(camp, s);
  wireBack(); wireAiLinks();
  const endCampaign = pick => {
    rrClear();  // seed slot is consumed in rrStart, not here
    state.rr = {screen:"role", sel:null, action:null, confirmAbandon:false, pick};
    render();
  };
  document.getElementById("rr-replay").onclick = () =>
    endCampaign({role:otherRole.id, hat:otherHat.id, ops:[]});
  document.getElementById("rr-new").onclick = () =>
    endCampaign({role:"deployer", hat:"dpo", ops:[]});
  document.getElementById("rr-print").onclick = () => window.print();
}

/* ------------------------------------------------------------------- desk */
function renderDesk(){
  const cases = state.game.payload().filter(c => state.area==="all" || c.areas.includes(state.area));
  const c = cases[state.deskIdx % cases.length];
  const answered = c.steps.every(s => state.deskPick[s.id]);

  let body = `<div class="scenario">${esc(c.brief)}</div>`;
  if(c.currency) body += currencyHtml(c.currency);
  body += c.steps.map(s => `<div class="field"><label>${esc(s.q)}</label><div class="pick">` +
    s.options.map(o => {
      let cls="";
      if(state.checked) cls = o===s.answer ? "correct" : (state.deskPick[s.id]===o ? "wrong":"");
      return `<button class="${cls}" data-step="${s.id}" data-opt="${esc(o)}"
        aria-pressed="${state.deskPick[s.id]===o}" ${state.checked?"disabled":""}>${esc(o)}</button>`;
    }).join("") + `</div>` +
    (state.checked?`<p class="why" style="margin:9px 0 0;font-size:13px">${esc(s.why)}</p>`:"") + `</div>`).join("");

  if(!state.checked){
    const anyAnswered = c.steps.some(s => state.deskPick[s.id]);
    body += `<div class="row"><button class="btn" id="check" ${answered?"":"disabled"}>
      ${answered?t("desk.submit_button"):t("desk.answer_all_button")}</button>
      <button class="btn ghost" id="clear" ${anyAnswered?"":"disabled"}>${t("desk.clear_button")}</button>
      <span class="badge">${t("desk.badge_case", {n: state.deskIdx+1, total: cases.length})}</span></div>`;
  }else{
    const missed = c.steps.filter(s => state.deskPick[s.id]!==s.answer);
    const right = c.steps.length - missed.length;
    body += `<div class="reveal"><p class="score ${right===c.steps.length?"ok":"no"}">
      ${t("desk.score_display", {correct: right, total: c.steps.length})}</p><p class="cite">${esc(c.citation)}</p>`;
    body += aiLinks(explainPrompt(`Compliance Desk — ${c.areas.join(", ")}`,
      c.steps.map(s => ({label:s.q, answer:s.answer, why:s.why})), `case facts: ${c.brief}`) +
      `\n\nThen change two facts in the case so the correct answers shift, walk me through the new analysis, and tell me what a governance lead would still be missing even with every answer right.`,
      t("desk.explain_link"));
    if(missed.length){
      body += aiLinks(deepenPrompt(`Compliance Desk — ${c.areas.join(", ")}`,
        missed.map(s => ({label:s.q, said:state.deskPick[s.id], answer:s.answer, why:s.why})),
        `case facts: ${c.brief}`), t("desk.deepen_link"));
    }
    body += `<div class="row"><button class="btn" id="next">${t("desk.next_button")}</button>
      <button class="btn ghost" id="retry">${t("desk.retry_button")}</button></div></div>`;
  }
  main.innerHTML = backBar(state.game.title) + `<div class="panel">${body}</div>`;
  wireBack(); wireAiLinks();
  main.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
    state.deskPick[b.dataset.step] = b.dataset.opt; render(); });
  const chk = document.getElementById("check");
  if(chk) chk.onclick = () => {
    state.checked = true;
    if(!state.scored){
      c.steps.forEach(s => record(s.id, state.deskPick[s.id]===s.answer));
      state.scored = true;
    }
    render();
  };
  const clr = document.getElementById("clear");
  if(clr) clr.onclick = () => { state.deskPick = {}; render(); };
  const rty = document.getElementById("retry");
  if(rty) rty.onclick = () => { state.deskPick={}; state.checked=false; render(); };
  const nx = document.getElementById("next");
  if(nx) nx.onclick = () => {
    state.deskIdx++; state.deskPick={}; state.checked=false; state.scored=false; render();
  };
}

/* ---------------------------------------------------------------- ladders */
function renderLadders(){
  const ls = state.game.payload().filter(l => state.area==="all" || l.area===state.area);
  if(!state.ladder){
    main.innerHTML = backBar(t("ladders.page_title")) + `<div class="grid">` + ls.map((l,i) =>
      `<button class="card" data-l="${i}"><span class="rung">${t("ladders.rung_apply")}</span>
       <h3>${esc(l.title)}</h3><p>${esc(l.prompt)}</p></button>`).join("") + `</div>`;
    wireBack();
    main.querySelectorAll("[data-l]").forEach(b =>
      b.onclick = () => { state.ladder = ls[+b.dataset.l]; state.order=[]; render(); });
    return;
  }
  const l = state.ladder, track = state.track;
  const key = s => l.dualTrack ? (track==="enacted" ? s.date : s.amended) : "";
  const ordered = l.dualTrack
    ? l.steps.slice().sort((a,b) => key(a).localeCompare(key(b))) : l.steps.slice();
  const remaining = ordered.filter(s => !state.order.includes(s.label));
  const done = remaining.length===0;

  let body = `<p class="hint">${esc(l.prompt)}</p>`;
  if(l.dualTrack) body += `<div class="row" style="margin:0 0 12px">
    <button class="btn ${track==="enacted"?"":"ghost"}" data-track="enacted">${t("ladders.track_enacted")}</button>
    <button class="btn ${track==="amended"?"":"ghost"}" data-track="amended">${t("ladders.track_amended")}</button></div>`;
  body += `<div class="order-list">` + ordered.map((s,i) => {
    const placed = state.order[i]; const right = placed===s.label;
    return `<div class="order-slot ${placed?"filled":""}"
      style="${placed?(right?"border-color:var(--ok)":"border-color:var(--bad)"):""}">
      ${i+1}. ${placed?esc(placed):"—"}</div>`;
  }).join("") + `</div>`;
  if(!done){
    body += `<div class="bank">` + shuffle(remaining, l.id.length).map(s =>
      `<button class="tok" data-step="${esc(s.label)}">${esc(s.label)}</button>`).join("") + `</div>`;
    body += `<div class="row"><button class="btn ghost" id="clear"
      ${state.order.length?"":"disabled"}>${t("ladders.clear_button")}</button>
      <span class="badge">${t("ladders.badge_placed", {n: state.order.length, total: ordered.length})}</span></div>`;
  }else{
    const rc = state.order.filter((lab,i)=>lab===ordered[i].label).length;
    body += `<div class="reveal"><p class="score ${rc===ordered.length?"ok":"no"}">
      ${t("ladders.scoreLine", {right: rc, total: ordered.length})}</p>` +
      ordered.map(s => `<p class="why"><strong>${esc(s.label)}</strong>${
        key(s)?` — ${esc(key(s))}`:""}. ${esc(s.detail)}</p>`).join("");
    if(l.currency) body += currencyHtml(l.currency);
    body += `<p class="cite">${esc(l.citation)}</p>`;
    body += aiLinks(explainPrompt(l.title,
      ordered.map((s,i) => ({label:`Position ${i+1}: ${s.label}`,
        answer:key(s)||`step ${i+1}`, why:s.detail})),
      l.dualTrack ? `ordered on the "${track}" track` : l.prompt) +
      (l.currency ? `\n\nNote the currency position: ${l.currency.book} ${l.currency.changed} ${l.currency.exam} Explain what a governance lead should actually plan against, versus what the exam expects.` : ""),
      t("ladders.explain_link"));
    body += `<div class="row"><button class="btn" id="reset">${t("ladders.reset_button")}</button>
      <button class="btn ghost" id="pick">${t("ladders.pick_button")}</button></div></div>`;
  }
  main.innerHTML = backBar(l.title) + `<div class="panel">${body}</div>`;
  wireBack(); wireAiLinks();
  main.querySelectorAll("[data-track]").forEach(b =>
    b.onclick = () => { state.track=b.dataset.track; state.order=[]; render(); });
  main.querySelectorAll("[data-step]").forEach(b =>
    b.onclick = () => { state.order.push(b.dataset.step); render(); });
  const c=document.getElementById("clear"); if(c) c.onclick=()=>{state.order=[];render();};
  const r=document.getElementById("reset"); if(r) r.onclick=()=>{state.order=[];render();};
  const p=document.getElementById("pick"); if(p) p.onclick=()=>{state.ladder=null;state.order=[];render();};
}

/* ----------------------------------------------------------------- briefs */
function renderBriefs(){

  if(!state.brief){
    main.innerHTML = backBar(t("briefs.page_title")) + `<div class="grid">` + bs.map(b => {

function renderBrief(b){
  const st = progress.briefs[b.id] || {responses:{}};
  st.responses = st.responses || {};
  const filled = b.fields.every(f => (st.responses[f.key]||"").trim().length>0);

  let body = `<div class="scenario">${esc(b.scenario)}</div>`;
  if(b.currency) body += currencyHtml(b.currency);
  body += b.fields.map(f => {
    const v = st.responses[f.key] || "";
    return `<div class="field"><label for="f-${f.key}">${esc(f.prompt)}</label>
      ${f.hint?`<p class="why" style="margin:-2px 0 6px;font-size:13px">${esc(f.hint)}</p>`:""}
      <textarea id="f-${f.key}" data-field="${f.key}">${esc(v)}</textarea>
      <div class="count" id="c-${f.key}">${v.trim()?v.trim().split(/\s+/).length:0} words</div></div>`;
  }).join("");

  const written = b.fields.some(f => (st.responses[f.key]||"").trim().length>0);
  // Two-step confirm rather than a one-click wipe: this button can destroy
  // twenty minutes of writing, and there is no undo.
  const clearBtn = state.confirmClear === b.id
    ? `<button class="btn" id="clear-yes" style="background:var(--bad)">${t("briefs.confirm_clear")}</button>
       <button class="btn ghost" id="clear-no">${t("briefs.cancel_clear")}</button>`
    : `<button class="btn ghost" id="clear" ${written?"":"disabled"}>${t("briefs.clear_button")}</button>`;
  body += `<div class="row"><button class="btn" id="reveal" ${filled?"":"disabled"}>
    ${filled?t("briefs.reveal_button"):t("briefs.reveal_locked")}</button>
    ${clearBtn}</div>
    <p class="cite">${t("briefs.autosave_note", {memoryOnly: memoryOnly?t("briefs.autosave_no_storage"):""})}</p>
    <div class="reveal"><p style="font-weight:600;margin:0 0 6px">${t("briefs.critique_heading")}</p>
    <p class="why">${t("briefs.critique_intro")}</p>${aiLinks(critiquePrompt(b), t("briefs.critique_link"))}</div>`;

  if(st.revealed){
    body += `<div class="reveal rubric"><h3 style="font-size:15px">${t("briefs.rubric_heading")}</h3><ul>` +
      b.rubric.map(r => `<li><b>${esc(r.criterion)}</b>${esc(r.expected)}
        <span class="cite">${esc(r.citation)}</span></li>`).join("") + `</ul>
      <div class="sweep"><p><strong>${t("briefs.self_assess_prompt")}</strong> ${t("briefs.self_assess_note")}</p>
      <div class="row" style="margin:0">
        <button class="btn" data-mark="nailed">${t("briefs.mark_nailed")}</button>
        <button class="btn ghost" data-mark="gaps">${t("briefs.mark_gaps")}</button>
        <button class="btn ghost" data-mark="redo">${t("briefs.mark_redo")}</button></div></div></div>`;
  }

  main.innerHTML = backBar(b.title) + `<div class="panel">${body}</div>`;
  wireBack();
  main.querySelectorAll("[data-field]").forEach(ta => {
    ta.oninput = () => {
      const rec = progress.briefs[b.id] || {responses:{}};
      rec.responses = rec.responses || {};
      rec.responses[ta.dataset.field] = ta.value; rec.updated = today();
      progress.briefs[b.id] = rec; save();
      const c = document.getElementById("c-"+ta.dataset.field);
      const w = ta.value.trim()?ta.value.trim().split(/\s+/).length:0;
      if(c) c.textContent = `${w} words`;
      const btn = document.getElementById("reveal");
      if(btn){
        const ok = b.fields.every(f => (rec.responses[f.key]||"").trim().length>0);
        btn.disabled = !ok;
        btn.textContent = ok?t("briefs.reveal_button"):t("briefs.reveal_locked");
      }
    };
  });
  const rv = document.getElementById("reveal");
  if(rv) rv.onclick = () => {
    const rec = progress.briefs[b.id]||{responses:{}}; rec.revealed=true;
    progress.briefs[b.id]=rec; save(); render();
  };
  const clr = document.getElementById("clear");
  if(clr) clr.onclick = () => { state.confirmClear = b.id; render(); };
  const no = document.getElementById("clear-no");
  if(no) no.onclick = () => { state.confirmClear = null; render(); };
  const yes = document.getElementById("clear-yes");
  if(yes) yes.onclick = () => {
    delete progress.briefs[b.id];
    save(); state.confirmClear = null; render();
    toast(t("briefs.toast_cleared"));
  };
  main.querySelectorAll("[data-mark]").forEach(x => x.onclick = () => {
    const rec = progress.briefs[b.id]||{responses:{}}; rec.selfMark=x.dataset.mark;
    progress.briefs[b.id]=rec; save(); state.brief=null; render();
  });
  wireAiLinks();
}

// Every reveal offers two deep dives, because getting a card right is not the
// same as understanding it. "Explain" always appears and covers everything on
// the board; "what you missed" appears on top of it only when there are misses.
function explainPrompt(title, items, context){
  const list = items.map(i =>
    `- ${i.label}\n  Answer: ${i.answer}\n  Given reason: ${i.why}`).join("\n");
  return `${LAB.studyContext}

I just worked through "${title}"${context?` (${context})`:""}. Here is everything that was on the board, with the correct answers:

${list}

I got these right, but I want to dial the knowledge in properly rather than rely on recognition. For each item:

1. Teach me the underlying rule from first principles — why the law is drawn this way, not just what it says.
2. Give me the decision test I should run in my head, phrased as a question.
3. Name the single concept it is most often confused with, and the precise distinction between them.
4. Give one concrete real-world example, and one edge case where the answer is genuinely arguable.

Then, across the whole set: what is the connecting principle, and what do examiners most often catch people out on here?

${LAB.citeInstruction} Correct me if any of the reasons above are imprecise or oversimplified.`;
}

// Built from what you actually got wrong, because a generic "explain this topic"
// prompt is worth far less than one that names the specific confusion you just
// demonstrated.
function deepenPrompt(title, missed, context){
  const items = missed.map(m => `- ${m.label}\n  You said: ${m.said}\n  Correct: ${m.answer}\n  Why: ${m.why}`).join("\n");
  return `${LAB.studyContext}

I just worked through "${title}"${context?` (${context})`:""} and got these wrong:

${items}

Please:
1. Explain each one properly, from first principles, so I understand the underlying rule rather than the answer.
2. For each, give me the distinguishing test I should apply next time — the specific question to ask myself.
3. Show one near-miss example per item where the answer flips, and say which fact changed.
4. Flag any place where my wrong answer would have been correct in a different context, since that is probably why I picked it.

${LAB.citeInstruction} Be precise rather than reassuring.`;
}
function critiquePrompt(b){
  const st = progress.briefs[b.id] || {responses:{}};
  const answers = b.fields.map(f =>
    `### ${f.prompt}\n${((st.responses||{})[f.key]||"(left blank)").trim()}`).join("\n\n");
  const criteria = b.rubric.map((r,i) =>
    `${i+1}. ${r.criterion} — a strong answer: ${r.expected} [${r.citation}]`).join("\n");
  return `${LAB.examinerRole} Critique the candidate response below against the assessment criteria. Be specific and demanding.

## SCENARIO
${b.scenario}

## ASSESSMENT CRITERIA
${criteria}

## CANDIDATE RESPONSE
${answers}

## WHAT I WANT BACK
For each criterion: state Met / Partially met / Missed, quote the candidate's relevant text as evidence, and explain the gap in one or two sentences.

Then:
1. List any statements that are legally incorrect, and correct them.
2. List what a strong answer would have included that is absent here.
3. Give an overall band — Strong / Adequate / Not yet exam-ready — with a one-paragraph justification.

${LAB.citeInstruction} Do not speak in generalities. Do not be encouraging at the expense of being accurate.`;
}

const AI_URLS = {claude:"https://claude.ai/new", chatgpt:"https://chatgpt.com/",
                 perplexity:"https://www.perplexity.ai/search"};
const AI_NAMES = {claude:"Claude", chatgpt:"ChatGPT", perplexity:"Perplexity"};

// Logo-only handoff buttons. The prompt is stashed on the element rather than
// rebuilt on click, so a reveal can offer several different deep dives.
let promptSeq = 0;
const PROMPTS = new Map();
function aiLinks(prompt, label){
  const key = `p${++promptSeq}`;
  let finalPrompt = prompt;
  if(lang !== "en") finalPrompt += "\n\nPlease respond in " + I18N.meta[lang].name + ".";
  PROMPTS.set(key, finalPrompt);
  // AI_LOGOS holds each mark's inner geometry plus the brand fill that sat on
  // the source <svg> element. Both are needed: dropped straight into a <button>
  // the browser discards the paths, and without the fill every mark renders
  // black — invisible on the dark theme. ChatGPT's mark has no brand colour, so
  // it carries currentColor and follows the text colour instead.
  const btns = Object.keys(AI_URLS).map(s => {
    const openLabel = t("ai.open_in_label", {serviceName: AI_NAMES[s]});
    return `<button class="ai-link ${s}" data-ai="${s}" data-prompt="${key}"
      data-label="${esc(openLabel)}" aria-label="${esc(openLabel)}"
      ><svg viewBox="0 0 24 24" fill="${AI_LOGOS[s].fill}" aria-hidden="true"
        focusable="false">${AI_LOGOS[s].inner}</svg></button>`;
  }).join("");
  return `<div class="ai-links">${label?`<span class="lbl">${esc(label)}</span>`:""}${btns}</div>`;
}
function wireAiLinks(){
  main.querySelectorAll("[data-ai]").forEach(b => b.onclick = () =>
    handoff(PROMPTS.get(b.dataset.prompt) || "", b.dataset.ai));
}
function handoff(prompt, service){
  if(prompt.length < 1800){
    window.open(`${AI_URLS[service]}?q=${encodeURIComponent(prompt)}`, "_blank", "noopener");
    return;
  }
  const open = () => window.open(AI_URLS[service], "_blank", "noopener");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(prompt)
      .then(() => { toast(t("ai.toast_copied_with_open")); open(); })
      .catch(() => { fallbackCopy(prompt); open(); });
  }else{ fallbackCopy(prompt); open(); }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast(t("ai.toast_copied_new_tab")); }
  catch(e){ toast(t("ai.toast_copy_fail")); }
  document.body.removeChild(ta);
}
function toast(msg){
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),3200);
}

mountLangSelect();
document.documentElement.lang = lang;
document.documentElement.dir = I18N.meta[lang].dir === "rtl" ? "rtl" : "ltr";
loadOverlay(lang).then(() => { relocalizeDecks(); applyStatic(); if(!openFromHash()) render(); });
